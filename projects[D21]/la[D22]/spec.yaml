  458: "UN TOOL NE FAIT JAMAIS DEUX CHOSES A LA FOIS."
  459: "Il ne depend pas d'une decision prise plus tot : ses arguments sont COMPLETS."
  460: "IL NE PREND JAMAIS DE COMMANDE EN TEXTE : il n'y a pas de tool run."
