  304: "[2] LES KEYS : le .env est lu AVANT tout appel ; une variable DEJA posee GAGNE."
  305: "[2] LA VALEUR NE SORT JAMAIS DU SCRIPT : il dit le NOM et l'state, posee ou ABSENTE."
