  1902: "Elle ne bouge pas d'un turn a l'autre : c'est ce qui la met en cache."
  1903: "ZONE 2, LE BLOC DYNAMIQUE, pose juste apres la tete : QUATRE SECTIONS, jamais plus."
  1904: "SES QUATRE : le micro-resume, le plan en cours, l'horodatage, la doc de l'action."
  1905: "LE MICRO-RESUME PORTE L'STATE : l'avancement, les decisions prises, les fichiers modifies."
  1906: "Sa section se refait A CHAQUE avancement du plan, ou a chaque modification du plan."
  1907: "LA DOC EST CELLE DE L'ACTION EN COURS : choisie pour ce turn, elle n'est pas entassee."
  1908: "CHAQUE SECTION A UNE TAILLE FIXE : elle se REMPLACE, elle ne s'allonge pas."
  1909: "Une taille fixe, et le prefixe reste en cache d'un turn a l'autre."
  1910: "ZONE 3, LA QUEUE : une fenetre GLISSANTE des echanges recents, pour l'immediatete."
  1911: "ZONE 4, LE STATE EXTERNE : l'historique long vit dans le fichier, pas la fenetre."
  1912: "LE STATE EXTERNE SE CHOISIT : on remonte a la source, on n'entasse pas dans le contexte."
  1913: "LE BLOC DYNAMIQUE EST TENU EN ARRIERE-PLAN, par le micro-model ephemere."
  1914: "LE PRINCIPAL EST DECHARGE DE LA PLOMBERIE : le nettoyage va au local."

  1915: "LA FENETRE GARDE VINGT ECHANGES ; ceux qui en sortent passent au RESUME du head."
SECTION : TOOLS
  400: "LA n'a QU'UN tool : la(g, a)."
