  2045: "delegate_task PREND UN NOM DE LA LISTE, ou le PREMIER SIEGE LIBRE, ou REFUSE."
  2046: "CHAQUE AGENT A SON STATE : config/<nom>.skill, .project, .head, .run, .seen."
  2047: "AUCUN NE LIT L'STATE D'UN AUTRE : le principal garde skills/.active et projects/.active."
  2048: "L'STATE DU SOUS-AGENT EST SEME DEPUIS CELUI DU PRINCIPAL, a chaque appel."
  2049: "LE SKILLSET EST UN MUR EXTERIEUR : l'union de leurs TOOLS ; load_skill se ferme."
  2050: "LA PROFONDEUR EST 1 : un sous-agent ne delegue pas. LES TURNS VONT DE 1 A 6."
  2051: "LE HEAD DIT QUI PARLE : le sous-agent signe de son nom et ecrit SON head."
  2052: "UN AGENT SANS PROJET CHARGE QUAND MEME UNE SKILL : le pointeur existe par agent."

SECTION : PATHS
  2200: "TOUT CHEMIN SE NOMME DANS la_config, section paths : work, state, returns, scripts, docs."
  2201: "relatif -> sous la racine du depot ; absolu -> tel quel. UN SEUL resolveur : lib.sh."
  2202: "lib.sh EXPORTE WORK, STATE, RETURNS, SCRIPTS, DOCS : aucune brick ne recompose un chemin."
  2203: "UN CHEMIN ECRIT DANS UN SCRIPT EST UNE FAULT, et il n'y en a aucun dans config/engine/."
  2204: "UN FICHIER D'STATE PORTE SON NOM, PAS SON DOSSIER : approve, approve.request, say.queue,"
  2205: "journal.jsonl, thinking.jsonl, spoken.jsonl, next.md, turn.pid, board.log."
  2206: "work/ N'EST PAS UN CHEMIN D'STATE : c'est le PERIMETRE d'ecriture des skills."
  2207: "LES BASES SUIVENT LA MEME REGLE : sessions.db, memory.db, terminal_return.db."

SECTION : APPROVAL_GATE
  2300: "UNE SKILL DECLARE SON DROIT : APPROVAL: true ou false ; le fault est false."
  2301: "TROIS CONDITIONS, LES TROIS : le droit, la marque NOMMEE (state/approve), le TEMPS."
  2302: "LA MARQUE EST UN GESTE : <tool> <action>, ou <tool> seul quand le tool n'a pas d'action."
  2303: "ELLE EST CONSOMMEE : une marque, un op, une fois. La relire ne la rallume pas."
  2304: "LA REQUEST NAIT DU REFUS : la loop refuse, ECRIT state/approve.request, et sonne."
  2305: "LA POLITIQUE VIT DANS LE FICHIER DU TOOL : RULES approval: whole|write."
  2306: "approval_actions DANS LE TOOL NOMME LES GESTES gates : qui refuse lit le tool."
  2307: "approval.sh status | allow <tool> [<action>] | deny : aucune signature a l'aveugle."
  2308: "ON NE SIGNE QUE CE QUI ATTEND : une marque sans request ne s'ecrit pas."
  2309: "LES GESTES GATES : table_manage, skill_manage, install_program,"
  2310: "uninstall_program, download_file. UNE LECTURE N'EST JAMAIS GATEE."
  2311: "LA PORTE SE SIGNALE : un son quand la request nait, un autre quand le feu vert est ecrit."
  2312: "L'APPLET PORTE LE BOUTON : il appelle approval.sh allow, puis relit le board."
  2313: "download_file N'ENTRE QUE DU https, AVEC SA TAILLE ET SON sha256 ; il n'execute rien."
  2314: "install_program NE PREND QUE DES PAQUETS DU DEPOT : aucun telechargement, aucune adresse."

SECTION : TUNNEL
  2400: "UN TUNNEL EST UNE SKILL : PERMANENT_TODO: true, chaque etape porte ses tools."
  2401: "L'ETAPE EN COURS EST LA SEULE [progress] ; les autres sont [todo]."
  2402: "CHAQUE ETAPE NOMME SES TOOLS en fin de ligne : -- tools: tunnel_status"
  2403: "LE PERIMETRE SE FERME SUR L'ETAPE : les tools des autres etapes ne sont pas atteignables."
  2404: "L'ETAPE SE FERME SUR UN FAIT MACHINE : tous ses tools ont rendu status: ok."
  2405: "C'EST plan.sh QUI AVANCE, PAS LE MODEL : update_todo est ferme dans un tunnel."
  2406: "LE TODO OBLIGATOIRE TOMBE QUAND UN PLAN PERMANENT EST CHARGE : un tunnel, une route."
  2407: "IL N'Y A PAS DE STEPS : une recette ecrite que rien n'appliquait. La route, c'est le plan."
  2408: "LES TOOLS DE TUNNEL : tunnel_status (lire), tunnel_up (lever), tunnel_down (baisser)."
  2409: "L'INTERFACE SE NOMME DANS la_config (tunnel.iface) : wg0, une fois, nulle part ailleurs."
  2410: "phone-tunnel EST LE TUNNEL DE REFERENCE : il mene de la lecture au journal."
  2411: "LE GABARIT PORTE PERMANENT_TODO: false ; un tunnel met true."
  2412: "LE DOCTEUR CONTROLE : une [progress], douze etapes au plus, chaque tool declare ET porte."

SECTION : PROGRAMS
  2500: "LE ENGINE EST dash + coreutils + jq. LES PROGRAMMES SONT AUTRE CHOSE, et ils le disent."
  2501: "config/programs/ PORTE LES QUATRE SERVEURS : board.py (panneau et cli), dash.py,"
  2502: "tts_daemon.py, watch.py. Un programme ne fait que ce que le shell ne sait pas faire."
  2503: "board.py EST LE BOARD : ce que lit l'applet, en un ecran etroit et vivant."
  2504: "tts_daemon.py TIENT LA VOIX EN MEMOIRE : sherpa-onnx charge une fois, puis repond."
  2505: "LES YEUX SONT QUATRE TOOLS : find_objects_in_img, cut_subject_from_img, read_depth_of_img, repair_zone_in_img."
  2505.1: "LEUR INSTRUMENT EST micro_vision, nomme par le corps du tool, jamais par le moteur."
  2506: "watch.py ECOUTE UN REQUEST : trois reseaux ONNX (3,6 Mo) et il SIGNE ce qui attend."
  2507: "LE VEILLEUR NE CHOISIT RIEN : la voix approuve ce qui attend, elle ne dicte pas an op."
  2508: "LE VEILLEUR TOURNE SUR UN COEUR, 63 a 80 fois le temps reel, sans la carte."
  2509: "LE MOTEUR NE CALCULE AUCUN VECTEUR EN PYTHON : vectors.sh les ecrit, rank.sh les compare."
  2510: "LES BANCS VIVENT HORS DU DEPOT : ils mesurent le harness, ils ne le composent pas."

SECTION : DASHBOARD
  2600: "LA PAGE DU POSTE EST UNE PORTE, PAS UN SECOND HARNESS : ni model, ni loop, ni tool."
  2601: "ELLE PARLE AU HARNESS PAR UN SEUL CHEMIN : le bridge (/say, /stop, /engine)."
  2602: "POUR LES GESTES SANS MODEL, elle appelle la brick : engine.sh <id>, doctor.sh."
  2603: "LES ETAGERES DE LA PAGE : chat, config, skills, projects, agents, tools, memory, diff."
  2604: "LE CHAT EST LA PAGE D'ECHANGE : on y parle, on y voit le raisonnement et les tools."
  2605: "TOUT CE QU'ELLE MONTRE VIENT D'UNE BRICK : elle n'invente aucune verite."
  2606: "CE QU'ELLE CHANGE PASSE UNE REGLE VERIFIEE AVANT D'ECRIRE, et laisse une copie horodatee."
  2607: "LE BOARD (board.py) ET LA PAGE (dash.py) SONT DEUX CHOSES : l'applet lit le premier."
  2608: "LE CHAT MONTRE CHAQUE TOOL COMME UNE ACTION ET SA CIBLE : /api/history porte tool_calls."
  26081: "l ecran ecrit Lecture (dossier/fichier), jamais le nom brut."

SECTION : TERMINAL
  2700: "LE CLI EST UNE PORTE DU MEME HARNESS : ni model, ni loop, ni tool."
  2701: "IL PARLE AU HARNESS PAR LE BRIDGE (/say, /stop), comme la page du poste."
  2702: "IL NE RELANCE JAMAIS second.sh : il lit le HEAD, section par section."
  2703: "LE HEAD EST DEPOSE PAR LA LOOP, ecrit a cote puis renomme : jamais a moitie."
  2704: "LE CLI NE RELIT LE HEAD QUE SI LE MTIME A BOUGE : la regle du board."
  2705: "UN TOOL S ECRIT EN UNE LIGNE, 120 signes au plus : jamais son JSON."
  2706: "LES JETONS VIENNENT DU ENGINE (usage.jsonl), pas d une estimation du cli."
  2707: "LA FENETRE DU MODEL EST UNE KEY DE LA CONFIG (engines: context)."
  2708: "TAB COMPLETE ET NE CHANGE PAS DE FIELD ; Ctrl-C pose le STOP, Ctrl-Q sort."
  2709: "UN FAULT SE DIT EN CLAIR DANS LE STREAM, jamais par une trace brute."

SECTION : CONFORMITY
  1800: "LE CANON EST spec.yaml, ET IL SE CONTROLE : la forme et l'empreinte, par une PASSE."
  1801: "Cette passe est un PROC sh, lance, jamais suppose."
  1802: "VOULU : la passe est posee, et elle lit l'arborescence REELLE de la racine du depot."
  1803: "L'OBSOLETE SE SUPPRIME, IL NE S'ANNOTE PAS : un renvoi mort se retire du corpus."
  1804: "Le 'pour memoire' est ce qui rend un corpus illisible."
  1805: "UNE REGLE S'ECRIT DANS LE LIEU QUI LA TIENT."
  1806: "Une regle tenue par un script s'ecrit dans le script ; par une mesure, avec sa mesure."
  1807: "Une regle qui ne tient nulle part ne s'ecrit pas."
  1808: "LE CORPUS SE LIT DANS CET ORDRE : spec.yaml pour L'ARCHITECTURE et ses bounds."
  1809: "Puis les scripts pour le DETAIL."
  1810: "Deux lieux se contredisent, le SCRIPT dit vrai sur le present, la PAROLE sur l'intention."
  1811: "UN COMPTE SE PERIME, UNE BOUND SE TIENT : ce fichier ne porte pas d'inventaire."
  1812: "Il porte des PLAFONDS, des SEUILS et des TEMPS, tenus par un script."
  1813: "LA SPEC NE MENT PAS SUR SON PROPRE STATE : le PRESENT est dans le code."
  1814: "Ce qui est VOULU porte sa CONDITION."
  1815: "LE VOCABULAIRE TECHNIQUE EST L ANGLAIS : tool, skill, plan, log. Aucun synonyme francais."
  1816: "UN SEUL PORTEUR : un tool qui parle a une machine dit machine et op ; carrier porte."
  1817: "PAS DE PYTHON DANS engine/ : les porteurs python vivent dans config/programs/."
  1818: "LE YAML DECLARE, LE ENGINE COMPOSE : machine, op, arguments ; engine.sh batit."
  1819: "LE DISCRIMINANT S'APPELLE op : liste fermee, refusee par le engine, jamais action."
  1820: "LA PLOMBERIE VIT DANS LE PORTEUR : ni controle du CLI, ni timeout, ni retour repetes."
