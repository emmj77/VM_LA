  334: "[7] LE HEAD SECONDAIRE : sections BORNEES ; ordre et textes DECLARES dans la_config."
  335: "[7] Un preambule n'est pas une reply : si le second rend JSON, la loop prend le result."
  336: "L'ORDRE EST L'ARCHITECTURE : HEAD, PROTOCOLE, PERIMETRE, STATE, COUCHE DE L'STATE, REQUEST."
