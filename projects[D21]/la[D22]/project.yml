SUMMARY:
  101: "LA est un harness : le modele NOMME un tool, le engine le valide et l'execute."
  102: "La racine est le projet lui-meme."
  103: "LE ENGINE lit une ligne de la table config/la_tools.yaml, valide, puis execute."
  104: "LE SKILL ACTIF porte la portee et ouvre la palette de ses tools."
  105: "Le contexte a trois zones : TETE immuable, etat rebatie, fenetre bornee."
  106: "LE CANON EST LA ZONE SPEC DU MANIFESTE : L'ARCHITECTURE."
  107: "config/engine/*.sh EST LE ENGINE."
  108: "LA BOUCLE PORTE CINQ BORNES D'ARRET : CONTEXTE, ANTI-BOUCLE, JETONS, APPELS, TEMPS."


SPEC:
  # id: J03
  id: "LA"
  created: "2026-10-15"
  last_revision: "2026-10-21"
  source: human
  version: "9.0.0"
  cap:
    lines_per_section: 100
    chars_per_line: 100

  MACHINE:
    100: "VM_LA EST LA RACINE DU PROJET."
    101: "config/ PORTE LE CODE, L ETAT ET LES DOCUMENTS : conf/ (la_config, pipeline, index, texts, second), engine/ (les briques dash), tools/ (le registre et les corps, par famille), programs/ (les .py), state/, data/, page/, applet/, audio/, filter/, certs/."
    102: "docs/ EST A LA RACINE, work/ EST LE DOSSIER DE L AGENT : aucune trace du harness n y vit."
    103: "LE PARTAGE DES CHEMINS S ECRIT DANS la_config ; aucun script ne recompose un chemin."
    104: "GIT EST LE FILET : pas de copies dans le depot, git log et git diff suffisent."
    105: "LA BASE EST DEBIAN MINIMAL, LA MEME QUE LA STATION : une seule libc (glibc)."
    106: "LA VOIX RESTE SUR LA MACHINE : la sortir enverrait l audio de la piece a un tiers."
    107: "LE CANON EST LA ZONE SPEC DU MANIFESTE : la PAROLE, le pourquoi, L ARCHITECTURE."
    108: "TOUT CE QUI EST TECHNIQUE S ECRIT EN ANGLAIS : identifiants, variables, ressources, fichiers ; la prose reste francaise."
    109: "AUCUN SECRET NE VIT DANS UN FICHIER SUIVI : le .env le porte, et git l ignore ; un secret se NOMME, il ne s ecrit pas."

  ORGANISATION:
    200: "TROIS CHOSES SE DECLARENT, ET TROIS SEULEMENT : les tools, l adresse du engine, les noms des secrets."
    201: "LES DECLARATIONS SONT DES ROUAGES, PAS DES DOCUMENTS ; elles vivent dans config/ et la racine les recoit."
    202: "QUI CHANGE UNE DECLARATION : L HUMAN, par un tool de la station, JAMAIS a la main, JAMAIS par le model."
    203: "LE MODEL NE LIT NI N ECRIT UNE DECLARATION : il voit un TOOLSET, jamais la liste qui le produit."
    204: "LA TABLE ET LE YAML DISENT LA MEME CHOSE, ou l un des deux est corrige."
    205: "LE BACKLOG N EST PAS UNE POUBELLE : chaque input porte sa CONDITION, et le jour ou elle tombe, il remonte dans sa section."

  HARNESS:
    300: "loop.sh DEROULE UN TURN, de la REQUEST a la REPLY."
    302: "LES KEYS SE LISENT AVANT TOUT APPEL : une variable DEJA posee GAGNE, et sa valeur ne sort jamais du script."
    304: "LA LISTE DES TOOLS ENVOYEE A L API PORTE EXACTEMENT UN ELEMENT : la(g, a). AUCUN CATALOGUE N EST ENVOYE."
    305: "g EST LE NUMERO D UNE LIGNE DE LA TABLE ; a PORTE LES ARGUMENTS DANS L ORDRE DECLARE."
    306: "LE PROTOCOLE : on ne repond JAMAIS par du texte, mais par un tool ; le surplus de a part sur l INPUT STANDARD."
    307: "LA TABLE SE LIT PAR BOUNDS, sans analyseur YAML, et LA MEME LOI sert a la loop et au tool."
    308: "LE TOOLSET EST LES TOOLS DE LA SKILL ACTIVE, PLUS LA CATEGORIE PERMANENTE ; un toolset vide arrete le turn."
    309: "REPLY: answer, ask, talk et kill TOMBENT TOUJOURS, meme sous un lock : sans eux un agent n a plus de bouton."
    311: "LE TOOLSET EST ECRIT AU MODEL : numero, nom, famille, description, arguments. Un numero hors de cette liste est refuse PAR LE HARNESS."
    312: "LE HEAD EST GELE, LU SUR PLACE :"
    313: "L ORDRE EST L ARCHITECTURE : HEAD, PROTOCOLE, toolseT, STATE, COUCHE DE L ETAT, REQUEST, historique, faits."
    315: "L APPEL : curl --max-time LA_TIMEOUT sur le post du engine actif ; une reply qui porte .error ARRETE le turn en le nommant."
    318: "LE RETOUR AU MODEL EST LE RESULT, JAMAIS L ENVELOPPE ; le turn se ferme quand answer ou ask passe avec status ok."
    319: "LES BOUNDS SE DISENT, ELLES NE COUPENT PAS ; le PLAFOND DE TURNS, lui, ARRETE."
    320: "LE HARNESS EST UN SEUL PROCESSUS : une table, un engine, une loop ; le LLM est appele a chaque turn, sans exception."
    321: "Le talk N EST PAS LA FIN DU TURN : le model doit pouvoir PARLER avant d avoir fini."
    325: "L ECHELLE DE RECUPERATION A QUATRE BARREAUX, ET ON N EN SAUTE AUCUN : dire, elargir d un cran, reduire, demander."
    326: "COCHER DES ETAPES N EST UN PROGRES QUE SI LE TURN A FAIT AUTRE CHOSE."
    329: "LE TEMPS ENTRE DANS LA LOOP PAR LE Sleep, ET PAR LUI SEUL : le turn ATTEND."

  CONTEXT:
    400: "LE CONTEXTE EST CLOSONNE EN QUATRE ZONES, chacune avec SA BOUND."
    401: "ZONE 1, LA TETE : le socle immuable ; elle ne bouge pas d un turn a l autre, et c est ce qui la met en cache."
    402: "ZONE 2, LE BLOC DYNAMIQUE : le micro-resume, le plan en cours, l horodatage, la doc de l action ; QUATRE SECTIONS, jamais plus."
    403: "CHAQUE SECTION A UNE TAILLE FIXE : elle se REMPLACE, elle ne s allonge pas."
    404: "ZONE 3, LA QUEUE : une fenetre GLISSANTE des echanges recents, pour l immediatete."

  TOOLS:
    500: "LE REGISTRE PORTE id, tool, family ; LE FICHIER DU CORPS ARGS, COMMAND, RULES."
    501: "L id est une IDENTITE ; le tool un NOM ; la family dit la NATURE, jamais l endroit."
    502: "UN TOOL EST UN PROCESSUS : il lit un objet JSON sur son INPUT et ecrit UNE ligne JSON, et RIEN d autre."
    504: "LES CINQ TYPES SONT FERMES : path, enum, int, bool, text."
    505: "UN CHEMIN SE RESOUT, IL NE SE DONNE PAS : absolu, ~, .., $, guillemet, controle sont refuses ; sous READ et WRITE il reste sous le registry de sa famille."
    507: "LE MONTAGE : la commande porte des trous {{nom}}, remplis par les valeurs DEJA VALIDEES ; tout autre {{...}} reste tel quel."
    512: "FORMAT UNIQUE OPEN AI COMPATIBLE."
    515: "LE MOTEUR NE CONNAIT AUCUN SECRET : il n en lit, n en ecrit, n en imprime aucun."
    516: "LA SKILL ACTIVE EST OBLIGATOIRE : sans elle, ni registry d ecriture, ni palette."
    517: "UN TOOL NE FAIT JAMAIS DEUX CHOSES A LA FOIS, et ses arguments sont COMPLETS : il ne depend pas d une decision prise plus tot."
    518: "le model ne compose aucune commande LIBRE."
    519: "LA CONFORMITE A CINQ POINTS : il fait UNE chose ; son resultat est un FAIT BORNE ; le model a la liberte de la VALEUR, jamais de la commande."
    522: "LE SOMMEIL EST UN TOOL : il arme une unite systemd jetable, et n ecrit aucun fichier d etat."
    523: "SA DUREE EST UNE LISTE FERMEE ; hors liste, le refus DIT la liste."
    524: "LE SOMMEIL A DEUX MORTS : l echeance atteinte, ou le stop de l human."
    525: "LE SOMMEIL LONG SE FAIT PAR REPETITION, jamais en relevant le delai du engine."

  PROCS:
    600: "LES LOIS D UN TOOL, TELLES QUE LE CODE LES TIENT : il fait UNE chose, il refuse EN NOMMANT, rien hors de sa scope, il LAISSE UNE LIGNE."
    602: "OU VIT UN TOOL : son corps est un fichier YAML, le registre le NOMME, et c est LE MOTEUR qui l execute apres avoir valide."
    603: "EN DASH + JQ + COREUTILS, ET RIEN D AUTRE : ni bash, ni python ; un proc qui demande plus est deux procs."
    604: "IL SE LIT PAR JQ, JAMAIS PAR LE SHELL : aucun argument n est du texte interprete."
    605: "IL REND UNE LIGNE JSON, CONSTRUITE PAR jq -cn : jamais a la main, un guillemet dans un nom de fichier ne doit pas casser un retour."
    609: "IL SORT TOUJOURS 0 : c est le JSON qui JUGE. Un code non nul veut dire que le proc s est CASSE, pas qu il a refuse."
    612: "UN PROC NE PEND PAS LA LOOP."

  TOOL_RESULTS:
    701: "LE RESULTAT EST BORNE PAR LE MOTEUR, pas par le tool : ce qui depasse part dans un FICHIER DE DEBORDEMENT, et le flux ne porte que le CHEMIN."
    703: "LES TROIS FORMES DU RETOUR, ET ELLES SE MESURENT : entier, resume plus chemin, rien plus chemin."
    707: "LE TURN SE TRANSCRIT : chaque tool laisse UNE LIGNE horodatee, tool, arguments, statut."

  PLAN:
    1000: "LE PLAN EST LA TACHE ECRITE : un fichier du dossier des plans, horodate et nomme, lu par la couche de l etat."
    1001: "UNE SEULE TACHE OUVERTE A LA FOIS, et le plan est LA PREMIERE BORNE."
    1002: "LE PLAN EST GOAL-BASED, ET C EST LUI QUI ARRETE ; un plan se ferme, il ne s evapore pas."
    1003: "UNE ETAPE SE VERIFIE, SINON C EST DE LA PROSE ; le seul chiffre du plan est le COMPTE DES ETAPES."
    1004: "UN PAS EN AVANT SE PAIE : progress complete ne recule pas, et l etape suivante s ouvre."
    1005: "LE PLAN DE PLUS DE DIX ETAPES SE DECOUPE ; le plafond de turns se pose, 400, une bound de surete et jamais un frein."
    1006: "TOUS LES CINQ TURNS, LE PLAN OUVERT SE RAPPELLE : la palette se retrecit a progress, et l imposition tient jusqu au point marque."
    1007: "LE PLAN A DEUX NIVEAUX : LE PETIT DANS LA SKILL, LE GRAND DANS LE PROJET."
    1008: "LE GRAND PLAN NE S EFFACE PAS : IL SE CHANGE, AVEC VALIDATION."
    1009: "LE PETIT PLAN FINI DECHARGE LA SKILL TOUT SEUL ; L AGENT N A AUCUN GESTE A FAIRE."
    1010: "LE PLAN A DEUX REGIMES : le JOURNAL, ecrit par le model ; le PERMANENT, par l human."
    1011: "UN PLAN PERMANENT EST UNE ROUTE : ses etapes portent leurs tools, et update_todo y est ferme."
    1012: "UNE ETAPE PORTE 100 OCTETS AU PLUS, TOOLS COMPRIS : une ligne, pas un paragraphe."
    1013: "LA SECTION PLAN D UNE SKILL TIENT EN VINGT LIGNES ; au-dela, le gabarit refuse d ecrire."
    1014: "TOUS LES DIX TURNS, LE GRAND PLAN ET LA SPEC SE METTENT A JOUR : C EST UN BLOCAGE."

  PROJECTS:
    2100: "UN PROJET ENVELOPPE DES SKILLS : son manifeste est projects/<nom>/project.yml."
    2101: "LE MANIFESTE PORTE TROIS CHOSES : son resume, ses regles (skillset compris), son canon."
    2102: "LE PROJET EST OPTIONNEL ; LA SKILL ACTIVE NE L EST PAS : sans elle, rien ne demarre."
    2104: "PROJET CHARGE : seules les SKILLS de son manifeste se chargent ;"
    2105: "LE PROJET BORNE CE QUI SE CHARGE, JAMAIS CE QUI TOMBE : le toolset du turn ne bouge pas."
    2106: "LE CANON D UN PROJET EST SA ZONE SPEC, DANS SON MANIFESTE."
    2108: "LES PORTES IMPOSENT Le toDO : le chargement a l entree, le dechargement a la sortie."
    2109: "UN PROJET CHARGE IMPOSE SON CHANTIER : le grand plan s il est vide, sa mise a jour sinon."

  SKILL:
    1000: "L ORDRE NE S INVERSE PAS : la skill, puis la doc, PUIS LE PLAN, PUIS LES TOOLS."
    1001: "UNE SEULE SKILL ACTIVE : son nom vit dans la config des skills, jamais dans un lien."
    1002: "TANT QUE LA DOC N EST PAS PASSEE, la famille du plan reste FERMEE."
    1003: "LA DOC OBLIGATOIRE SE LIT AVANT LE TOOL SENSIBLE : le harness REDUIT alors le TOOLSET a ce seul tool, et l appel fait il redevient celui du skill."
    1004: "CE N EST PAS UNE CONSIGNE, C EST UN LOCK : un enum se refuse la ou une phrase se recopie."
    1005: "LE LOCK NE JUGE PAS LE CONTENU LU : la doc peut etre hors sujet, le harness l ignore."
    1006: "L EMPLACEMENT EST DECLARE PAR LE SKILL SEUL : un chemin declare est RELATIF, sans .., sans $, sans guillemet."
    1007: "LA SCOPE SE DECLARE, ELLE NE SE CALCULE PAS."
    1008: "LE MANIFESTE D UNE SKILL EST LU COMME UNE CONFIG, jamais comme une prose."
    1009: "LES SECTIONS FIXES NE COMPTENT PAS DANS LE PLAFOND ; les LIBRES sont plafonnees."
    1010: "UNE SKILL S ECRIT PAR FIELDS : un tool ecrit UNE section PAR SON NOM, le corps vient du TEMPLATE, la date est posee par le proc."
    1011: "L ID N EST PAS LA POSITION : une liste se designe par son rang, une table par un nom, et inserer ne deplace rien."
    1012: "LA PROPRIETE EST UNE POLITIQUE, PAS UNE PREUVE : un skill de l human est en LECTURE SEULE pour l agent, et le FAIT est tenu a cote."
    1013: "LES TEMPLATES SONT LA FORME, ECRITE UNE FOIS PAR L HUMAN : l agent les REMPLIT, et un field sans producteur est ecrit EN CLAIR."
    1014: "CHARGER UNE SKILL CHANGE LA PALETTE ; la LIRE ne la charge pas."
    1015: "UN SKILL QUI N OUVRE AUCUN TOOL PORTE UNE PALETTE VIDE : c est un ETAT, pas une erreur."
    1016: "LA PALETTE NE S OUVRE QU AVEC LE PLAN : sans un tool de plan, les tools du skill restent FERMES."
    1017: "SANS RERANKER, LA LOOP S ARRETE EN LE NOMMANT : un BUG DU MOTEUR, jamais un silence."

  MANAGERS:
    1100: "UN MANAGER N EST PAS UN PROC : le proc VALIDE, MONTE, EXECUTE et FORME ; le manager TIENT une section et il en est le seul ecrivain."
    1101: "SA BOUND EST LA SECTION ELLE-MEME."
    1102: "LES SECTIONS ET LEUR MANAGER : le travail et les plans ; les skills ; la table ; les specs ; la memoire ; les notes ; les sessions."
    1103: "LA MEMOIRE N A AUCUN TOOL D ECRITURE : c est le compacteur qui l ecrit, et ses trois lectures ne font que LIRE."
    1104: "UN MANAGER QUI ECRIT HORS DE SA SECTION EST UN BUG, PAS UNE LIBERTE."
    1105: "UN MANAGER ECRIT PAR APPROBATION QUAND LE TOOL EST SENSIBLE : il GELE, ASKS ; le FAUT dans le doute est le REFUS."
    1106: "UN MANAGER NE CREE PAS L ARBORESCENCE : la section qu il tient EXISTE DEJA."
    1107: "UN MANAGER REND UNE LIGNE, comme tout tool, et ce qu il a change se lit dans la ligne horodatee."
    1108: "LES MANAGERS SONT DANS LA TABLE, DONC DANS LA PALETTE : meme enum, meme refus."
    1109: "LE MANAGER VERIFIE LA FORME, PAS LE FOND : il ne juge pas si le skill est BON, et il ne touche pas aux autres sections."
    1110: "LA TRACE HORODATEE TRANCHE : une politique dit ce qui est PERMIS, la trace dit ce qui a EU LIEU."
    1111: "WRITE_SPEC PORTE DEUX GESTES : une SECTION par son nom, une LOI par son NUMERO ; on n ancre JAMAIS sur le nom de section."
    1112: "LE CHEMIN DU SPEC VOYAGE SOUS SPEC_FILE : ecraser SPEC perd le fichier, pas le turn."
    1113: "LES ADRESSES SE TIENNENT PAR UN GESTE UNIQUE : list, puis take <alias>."
    1114: "TROIS MANAGERS : PLAN, PROJET, SKILL. CHACUN PORTE SES GESTES, PAS DES ACTIONS."
    1115: "UN GESTE QUI S IMPOSE EST PERMANENT : sinon il ne serait pas imposable."

  WRITE_LAW:
    1200: "AUCUN TOOL N EFFACE : le retrait passe par la CORBEILLE, et son vidage est HUMAN."
    1201: "L ECRITURE EST UNE CARTE, PAS UN DROIT : chaque tool ecrit SOUS SA RACINE."
    1202: "LA TABLE DIT OU (la scope), LE SKILL DIT QUOI (sa palette), LA CLOTURE VERIFIE."
    1203: "LE RESTE SE LIT : les skills par leur manager, la table par le sien."
    1204: "LES TROIS MODES D ECRITURE, ET RIEN DE PLUS : new, append, replace ; new refuse un fichier qui existe, replace se DECLARE."
    1205: "L ECRITURE EST ATOMIQUE : un temporaire, puis un renommage ; jamais une troncature en place."
    1206: "LES LIENS N EXISTENT PAS : un nom qui pointe ailleurs met une porte dans un mur. DEUX COPIES, JAMAIS UN LIEN."
    1207: "UN SEUL ECRIVAIN A LA FOIS : la loop tient le turn, le manager sa section."
    1208: "L HORODATAGE VIENT DU PROC : une date produite par le model est une valeur inventee."
    1209: "UN FICHIER ECRIT PORTE SON ENTETE : ce qu il est, qui l a ecrit, quand, par quel tool."
    1210: "LES CHEMINS SONT RELATIFS A LA RACINE, ET LEUR SCOPE LES BORNE : pas d absolu, pas de .., pas de motif."
    1211: "ECRIRE DANS LA RACINE N EST PAS ECRIRE DANS LE MONDE : ce qui sort de la machine est un FICHIER."
    1212: "ON VERIFIE AVANT L EFFET, PAS APRES."
    1213: "LE CAP JUGE LA LIGNE QU ON ECRIT, PAS L HERITAGE : l ancien ne bloque pas le neuf."
    1214: "UNE ECRITURE REMPLACE, ELLE NE DOUBLE PAS : le meme id repose la meme ligne."

  CONFINEMENT:
    1300: "LA BARRIERE EST LE MONTAGE, PAS LE TOOLSET : le toolset dit ce qui est ATTEIGNABLE, le montage dit ce qui est POSSIBLE."
    1301: "LE PREMIER CEDE AVEC UNE ERREUR ; LE SECOND TIENT MEME QUAND LE PREMIER CEDE."
    1302: "LA OU LA MACHINE TOURNE EST LA CAGE : les registrys et les dossiers systeme y sont montes."
    1303: "L ECRITURE EST OUVERTE LA OU ELLE EST LISTEE, ET FERMEE PARTOUT AILLEURS."
    1304: "LES LISTES SE TIENNENT ENSEMBLE : une racine ouverte dans une liste et pas dans l autre donne un EROFS MUET."
    1305: "CE QUI ECRIT HORS DE LA CAGE RESTE HORS DE LA CAGE, ET C EST LA SEULE VOIE CONNUE : un projet ecrit des deux cotes se corrompt en silence."
    1306: "LA GARDE LIT L EFFET, PAS LA FORME : guillemets, hexa, base64 et $IFS sont DEVOLES, et un nom de commande INCONNU est refuse par FAUT."
    1307: "UN TUBE VERS UN INTERPRETEUR ET UN HTTP BRUT VERS UN PORT D EDITEUR SONT REFUSES."
    1308: "LA GARDE APPARTIENT A LA MACHINE, PAS A L AGENT : il ne la reecrit pas, sinon elle suit la mode du jour."
    1309: "UN REFUS SE DIT EN NOMMANT LA RAISON, JAMAIS EN SILENCE : un refus muet est un bug deguise en permission."

  VOICE:
    1400: "LA MACHINE DOIT ETRE JOIGNABLE SANS MESSAGERIE : ni vocal tiers, ni application tierce."
    1401: "LE BRIDGE EST DIRECT, ET IL N Y EN A QU UN : c est le TRANSPORT, il transporte un TEXTE et un signal."
    1402: "LE DECLENCHEMENT EST UNE PRESSION : l human decide quand la machine ecoute ; le widget DECLENCHE, la bulle ECOUTE."
    1403: "LE WIDGET EST LE POINT D ENTREE ET LA TELEMETRIE : ce que la machine dit deja, sans canal de plus."
    1404: "LE STREAM : une pression ouvre le canal, la parole est STREAMEE, transcrite, injectee, et la reply revient en voix."
    1405: "LE HARNESS NE SAIT PAS D OU VIENT LA REQUEST : c est ce qui rend le canal remplacable."
    1406: "LE STT, LE TTS ET LE DECLENCHEMENT SONT LOCAUX : aucun service tiers."
    1407: "LE CANAL PASSE PAR UN TUNNEL PRIVE, CHIFFRE, SANS OUVRIR DE PORT : la face TLS est celle du telephone, le clair reste sur 127.0.0.1."
    1408: "LE TELEPHONE ATTEINT LE POSTE PAR LE TUNNEL, depuis n importe ou ; sur le meme reseau, l APK se prend sur le poste."
    1409: "LES APPROBATIONS SONT DES TOOLS : le harness GELE, ASKS, et le FAUT dans le doute est le REFUS."
    1410: "LA VOIX NE CHANGE PAS LE HARNESS : elle change l INPUT, et tout ce qu elle peut faire passe par les memes tools et le meme TOOLSET."
    1411: "LE MODE DE PAROLE EST UN TURN ENTIER : l human parle, la loop travaille et repond, et il ne donne AUCUN droit de plus."
    1412: "PARLER NE FERME PAS LE TURN."
    1413: "LA VOIX SE DECOUPE EN DEUX BOUTS INDEPENDANTS, l INPUT et la SORTIE : deux mesures, la RAM au repos et le temps du premier token."
    1414: "LE MODEL RESTE SUR LA MACHINE ; le poste n est qu un BOUT."
    1415: "LA SYNTHESE EST LOCALE : une voix francaise, deux timbres, un niveau regle A LA CRETE."
    1416: "LE STT EST PARAKEET, LOCAL : il transcrit un audio court, il ne juge pas."
    1417: "LA VOIX ET L OREILLE SONT DES SERVICES RESIDENTS, et leur contrat est un fichier audio que le bridge lit."
    1418: "LA VOIX DU TURN S ENTEND AU FIL DE L EAU : le premier son arrive avec le premier token dit."
    1419: "LE MODE DE PAROLE A QUATRE ETATS, ILS SE DISENT : ecoute, travaille, parle, attend."

  MODEL:
    1500: "UNE SEULE ADRESSE DE ENGINE EST ACTIVE A LA FOIS, et elle est declaree dans la machine."
    1501: "LE MODEL NE SE CHOISIT PAS AU MOMENT DE L APPEL."
    1502: "LE MODEL REND DU TEXTE ET DES APPELS DE TOOL ; il ne connait NI le chemin, NI la commande, et il ne voit que ce qui a ete BORNE pour lui."
    1503: "TROIS ETAGES : un classifieur, un model de structure, un model principal ; chaque etage fait ce que les autres font mal."
    1504: "LES ETAGES LEGERS TOURNENT SUR LE CPU, SONT LOCAUX PAR CONSTRUCTION, et ne prennent pas la place du principal."
    1505: "LE MODEL PRINCIPAL PASSE PAR UNE ADRESSE : il n est PAS sur une carte de la machine, et toute architecture qui suppose son inference locale est FAUSSE."
    1506: "LE HARNESS PEUT NE PRESENTER QU UN SEUL TOOL : ce qu on masque n a pas besoin d etre refuse, il n existe pas dans le turn."
    1507: "LE MODEL NE REMPLIT PAS CE QUE LE HARNESS SAIT REMPLIR."
    1508: "LA QUALITE D UN MODEL SE MESURE, ELLE NE SE CROIT PAS : sa vitesse, sa tenue d un schema, la fidelite d un resume, une MESURE avec la DATE."
    1509: "LE TRAVAIL LOURD RESTE AU PRINCIPAL, LA PLOMBERIE AU LOCAL."
    1510: "LE MICRO-MODEL EST UN TRAVAILLEUR EPHEMERE, instancie pour UNE mission et purge aussitot, sans state persistant : c est ce qui garantit zero derive de contexte."
    1511: "SES POIDS SONT TERNAIRES, sa taille vise UN A TROIS MILLIARDS, et il porte un head minimal : le contexte, son role, le schema de son SEUL tool."
    1512: "LE CLASSIFIEUR EST FASTTEXT, PAS UN MICRO-LLM : IL PROPOSE, LE MOTEUR DECIDE ; l etat, la palette et le verrou ne sont pas des textes."
    1513: "LE SKILL DELIMITE LA PALETTE DES TOOLS ; le WRITABLE_WORKSPACE DELIMITE L ECRITURE."
    1514: "L ETAGE DE VISION EST LOCAL ET LEGER, et il LIT L ANGLAIS : une question posee en francais le fait divaguer."
    1515: "LE REPLI SE DECIDE COTE CLIENT, ET IL SE VOIT : une panne reseau ne replie pas."
    1516: "LA VISION A TROIS VOIES : le petit sur CPU, le gros sur les cartes, et l API multimodale ; le gros se demarre seul et refuse sans la place."
    1517: "LE COMPACTEUR EST DANS LE ROUTEUR : LE MODEL LOCAL ECRIT APRES LA REPLY, JAMAIS DEVANT."
    1518: "LE REPOS A DEUX SYSTEMES JETABLES : le VOLONTAIRE et l AUTOMATIQUE."
    1519: "LE VOLONTAIRE : le model appelle le sommeil, et le retour du systeme revient A LUI."
    1520: "L AUTOMATIQUE : answer l ARME POUR UNE DUREE DECLAREE ; son retour reveille l agent EN DIRECT, et la veille VIT DANS SYSTEMD : un turn meurt, le timer sonne quand meme."
    1521: "LE JUGE EST UN WATCHER : une input, DEUX SORTIES convenues, wake or sleep ; son etage est le RERANKER, il NOTE, il n INVENTE aucune sortie."
    1522: "IL JUGE LE REVEIL, JAMAIS L ARRET, ET IL PROPOSE : le moteur decide, et un reveil ouvre une REQUEST sans elargir le TOOLSET du reveille."
    1523: "CHAQUE VERDICT ECRIT UNE LIGNE : l heure, l evenement, la proposition, la decision ; les evenements admis sont NOMMES, une liste fermee."
    1524: "UN SEUL SYSTEME AUTOMATIQUE ARME PAR SESSION ; le plan est sa bound."
    1525: "LE PREMIER ETAGE ECRIT DANS LA TETE SECONDAIRE : CE QUE LA REQUEST EST ; ce qui entre a l offset 2 est un FAIT BORNE d une ligne."
    1526: "UN INSTRUMENT QUI NE LIT PAS LA LANGUE SE TAIT : il la mesure d abord, et un porteur se mesure avant d etre branche."
    1527: "LE FILTER EST UN BRILLON, PAS UN VERROU."
    1528: "LE SELECTEUR EST UN RERANKER LOCAL, sur la carte, ENTIEREMENT : il ne voit que id, nom, description ; NI la commande, NI les arguments."
    1529: "LA CARTE SE CHOISIT PAR INDEX dans la_config, JAMAIS en automatique ; la carte des models de parole n est pas la sienne."
    1530: "LE SELECTEUR NE DECIDE PAS : il CLASSE, et le turn garde sa part et son plafond."
    1531: "UN SELECTEUR MUET NE BLOQUE PAS LE TURN : la loop repart sur la table entiere."
    1532: "LE SERVICE EST UNIQUE : un seul llama-server ROUTEUR, un port, trois models nommes, en systemd --user."
    1533: "LE CLIENT NOMME SON MODEL, LE ROUTEUR CHOISIT : UN SEUL MODEL CHARGE A LA FOIS."
    1534: "UN MODEL OISIF REND SES POIDS, et son reveil se mesure."
    1535: "L EFFORT A QUATRE NIVEAUX, none, low, medium, high : le reranker le choisit, le turn l envoie au model."
    1536: "LE REVEIL D UN SOMMEIL EST DIRECT : le timer ouvre le tour lui-meme, et le juge ne voit que les EVENEMENTS."
    1537: "LA SURVEILLANCE SE PROGRAMME UNE FOIS, DANS SYSTEMD : aucun turn ne la reprogramme."
    1538: "LA SURVEILLANCE EST UN SOMMEIL REPETITIF : douze reveils au plus, et il s arrete seul au dernier."
    1539: "LE TEXTE DU REVEIL PORTE LA MISSION : le model lit ce qu il doit continuer de surveiller."
    1540: "LE GRAND PLAN SE SURVEILLE COMME UNE MISSION : toutes les 600 ou 1200 s, tant qu il n est pas fini."

  WORK:
    1600: "UN CHEMIN D ECRITURE EST RELATIF ET SE RESOUT SOUS LE REGISTRY DU SKILL ACTIF."
    1601: "LE MODEL NE CHOISIT AUCUN CHEMIN : il nomme une VALEUR."
    1602: "L AGENT REMPLIT DES FIELDS BORNES : il n ecrit pas de texte libre dans les registrys, et ce qui entre dans un document y entre en REMPLACANT une valeur."
    1603: "LA TRANSCRIPTION EST UN TOOL DE LA TABLE : l audio entre, le texte sort."
    1604: "LE TURN S ECRIT DANS UNE SESSION HORODATEE ; une session est un REGISTRY, pas un document."
    1605: "TOUT CE QUE L AGENT ECRIT RESTE LISIBLE ET BORNE, et un refus se dit EN CLAIR : l agent lit son propre refus et se corrige au turn suivant."
    1606: "APRES UN CHANTIER, LE RANGEMENT EST OBLIGATOIRE : ce qui a ete seme se range, et un travail non range n est pas un travail fini."
    1607: "AUCUNE ERREUR N EFFACE : un fichier se deplace vers la corbeille, jamais ne disparait."

  MEMORY:
    1700: "LA MEMOIRE EST LA TABLE, le sommaire des echanges ; le corps est la base des sessions."
    1701: "LE MODEL N ECRIT JAMAIS LA MEMOIRE : une memoire ecrite par le model qui la lit est un SOUHAIT, pas un registry."
    1702: "LE COMPACTEUR L ECRIT, EN FIN DE TURN, et il en est LE SEUL ECRIVAIN : un autre ecrivain est un bug."
    1703: "DEUX DUREES, DEUX REGISTRYS : le sommaire dans la table, le detail dans le corps, et LE LIEN EST L ECHANGE."
    1704: "LE SOMMAIRE SERT A CHOISIR, JAMAIS A RELIRE : deux lignes par cote, rien de plus."
    1705: "RIEN N EST INVENTE DANS LA TABLE : une input n existe que si le compacteur l ecrit ; s il ne repond pas, rien n entre."
    1706: "LA SESSION SE TRANSCRIT : chaque turn laisse ses lignes, le tool, ses arguments, l heure."
    1707: "LA TABLE SE LIT SOUS UNE QUESTION ; LE CORPS SE CHARGE PAR SON NUMERO : un grep ne remplace pas une question."
    1708: "LE PASSE EST SA MEMOIRE APPELABLE : ce qui n est pas cherche se redemande."
    1709: "LA MEMOIRE NE SE DECLARE PAS : elle se cherche, et elle se charge."
    1710: "UN LIVRE DE PAGES : une session est une page, avec son agent et son titre ; le titre vient de la request, jamais du model."

  AGENTS:
    2000: "UN AGENT PORTE UN NOM, ET SON NOM LE PRECEDE : il signe, et il nomme sa boite."
    2001: "LE NOM EST POSE PAR LE LANCEUR, jamais par le model ; il se lit une fois, a l ouverture, et il est exporte au turn."
    2002: "LES NOMS SONT STABLES ET GRAVES EN DUR : la liste est FERMEE, et un nom qui ne tient pas en nom de fichier est remplace."
    2003: "AUCUN TURN N EST ANONYME : l human, la voix et le sous-agent portent chacun leur nom."
    2004: "LE BOARD EST UN FICHIER, PAS UN SERVICE : une ligne est un message, l auteur, le destinataire, l heure, le corps."
    2005: "L AUTEUR VIENT DU TURN ; LE DESTINATAIRE EST UNE VALEUR : rien ne s invente ici, et le corps est BORNE."
    2006: "LA LIGNE S ECRIT D UN SEUL GESTE : un message a moitie ecrit n entre pas au board."
    2007: "LE BOARD EST PLAFONNE, et sa purge est une REEVALUATION, jamais un rm."
    2008: "CE QUI A ECHAPPE A UN AGENT, CET AGENT LE DIT : un silence n existe pas."
    2009: "RECEVOIR N EST PAS UN TOOL : le message entre dans une fenetre du head secondaire, qui se rebat a chaque appel au model."
    2010: "LE MESSAGE ENTRE SIGNE : l auteur d abord, qu un pair ne soit pas pris pour l human ; aucun message n est montre par moitie."
    2011: "LA FENETRE DES AGENTS DIT nom, pid, statut et travail : le statut est un FAIT de la machine, un pid vit ou ne vit pas."
    2012: "UNE FENETRE EST UNE SECTION AVEC UN PLAFOND DECLARE ; rien n entre sans plafond."
    2013: "CE QUI CHANGE, LE PID ET LE STATUT, VIT APRES LE GELE : un cache est un prefixe, et tout ce qui suit se repaye a chaque appel."
    2014: "CHAQUE AGENT A SON PROPRE JOURNAL DE TOOLS ; la fenetre des tools est une AGREGATION BORNEE, jamais le journal entier."
    2015: "UN SOUS-AGENT RECOIT UNE MISSION : la skill cible, sa doc, son plan, son travail."
    2016: "UN AGENT DEMARRE DORT : sans tache, il attend que le juge le reveille, et un reveil est une REQUEST."
    2017: "LE CHAT N OUVRE NI PORT, NI DEMON : un fichier et une section."
    2018: "CINQ SIEGES NOMMES FORMENT LA LISTE FERMEE ; le principal en est un, et une delegation prend un nom de la liste, ou le premier siege libre, ou REFUSE."
    2019: "CHAQUE AGENT A SON ETAT, ET AUCUN NE LIT CELUI D UN AUTRE : le principal garde les pointeurs globaux."
    2020: "LA PROFONDEUR EST 1 : un sous-agent ne delegue pas."
    2021: "LE HEAD DIT QUI PARLE : le sous-agent signe de son nom et ecrit SON head."

  PATHS:
    2200: "TOUT CHEMIN SE NOMME DANS la_config, section paths : work, state, returns, scripts, docs."
    2201: "UN SEUL RESOLVEUR : relatif rend sous la racine du depot, absolu rend tel quel."
    2202: "UN CHEMIN ECRIT DANS UN SCRIPT EST UNE FAUTE, et il n y en a aucun dans les briques."
    2203: "UN FICHIER D ETAT PORTE SON NOM, PAS SON DOSSIER."
    2204: "work/ N EST PAS UN CHEMIN D ETAT : c est le WRITABLE_WORKSPACE d ecriture des skills."
    2205: "LES BASES SUIVENT LA MEME REGLE : sessions, memory, terminal_return."

  APPROVAL_GATE:
    2300: "UNE SKILL DECLARE SON DROIT, et le FAUT est de refuser."
    2301: "TROIS CONDITIONS, LES TROIS : le droit, la marque NOMMEE, le TEMPS."
    2302: "LA MARQUE EST UN GESTE, ET ELLE EST CONSOMMEE : une marque, un geste, une fois ; la relire ne la rallume pas."
    2303: "LA REQUEST NAIT DU REFUS : la loop refuse, ECRIT la request, et sonne."
    2304: "LA POLITIQUE VIT DANS LE FICHIER DU TOOL ; ce sont SES GESTES gates qui la declarent, et une LECTURE N EST JAMAIS GATEE."
    2305: "ON NE SIGNE QUE CE QUI ATTEND : une marque sans request ne s ecrit pas."
    2306: "LA PORTE SE SIGNALE : un son quand la request nait, un autre quand le feu vert est ecrit."
    2307: "UN TELECHARGEMENT N ENTRE QUE DU https, AVEC SA TAILLE ET SON sha256 ; il n execute rien."
    2308: "UNE INSTALLATION NE PREND QUE DES PAQUETS DU DEPOT : aucun telechargement, aucune adresse."

  TUNNEL:
    2400: "UN TUNNEL EST UNE SKILL PERMANENTE : chaque etape porte ses tools."
    2401: "L ETAPE EN COURS EST LA SEULE marquee courante ; les autres sont en attente."
    2402: "LA PALETTE SE FERME SUR L ETAPE : les tools des autres etapes ne sont pas atteignables."
    2403: "L ETAPE SE FERME SUR UN FAIT MACHINE : tous ses tools ont rendu ok."
    2404: "C EST LE PLAN QUI AVANCE, PAS LE MODEL : l update du plan est ferme dans un tunnel."
    2405: "LE PLAN OBLIGATOIRE TOMBE QUAND UN PLAN PERMANENT EST CHARGE : un tunnel, une route."
    2406: "IL N Y A PAS DE RECETTE ECRITE QUE RIEN N APPLIQUE : la route, c est le plan."
    2407: "L INTERFACE SE NOMME DANS la_config, UNE FOIS, NULLE PART AILLEURS."
    2408: "LE GABARIT PORTE UN PLAN NON PERMANENT ; un tunnel le rend permanent."
    2409: "LE DOCTEUR CONTROLE : une etape courante, douze au plus, chaque tool declare ET porte."

  PROGRAMS:
    2500: "LE MOTEUR EST DASH + COREUTILS + JQ. LES PROGRAMMES SONT AUTRE CHOSE, et ils le disent."
    2501: "programs/ PORTE LES PROGRAMMES PYTHON : le panneau et son cli, le pont, la page, la voix residente, le veilleur."
    2502: "UN PROGRAMME NE FAIT QUE CE QUE LE SHELL NE SAIT PAS FAIRE."
    2503: "LE PANNEAU EST CE QUE LIT L APPLET, en un ecran etroit et vivant."
    2504: "LA VOIX RESIDENTE CHARGE SON MODELE UNE FOIS, PUIS REPOND."
    2505: "LE VEILLEUR ECOUTE UN MOT : il SIGNE ce qui attend, il ne CHOISIT rien, et il tourne sur un coeur sans la carte."
    2506: "LE MOTEUR NE CALCULE AUCUN VECTEUR EN PYTHON : les vecteurs s ecrivent d un cote, se comparent de l autre."
    2507: "LES BANCS VIVENT HORS DU DEPOT : ils mesurent le harness, ils ne le composent pas."
    2508: "PAS DE PYTHON DANS LE MOTEUR : les porteurs python vivent dans programs/."

  DASHBOARD:
    2600: "LA PAGE DU POSTE EST UNE PORTE, PAS UN SECOND HARNESS : ni model, ni loop, ni tool."
    2603: "LE CHAT EST LA PAGE D ECHANGE : on y parle, on y voit le raisonnement et les tools."
    2604: "TOUT CE QU ELLE MONTRE VIENT D UNE BRIQUE : elle n invente aucune verite."
    2605: "CE QU ELLE CHANGE PASSE UNE REGLE VERIFIEE AVANT D ECRIRE, et laisse une copie horodatee."
    2606: "LE PANNEAU ET LA PAGE SONT DEUX CHOSES : l applet lit le premier."
    2607: "LE CHAT MONTRE CHAQUE TOOL COMME UNE ACTION ET SA CIBLE."

  TERMINAL:
    2700: "LE CLI EST UNE PORTE DU MEME HARNESS : ni model, ni loop, ni tool."
    2701: "IL PARLE AU HARNESS PAR LE PONT, comme la page du poste."
    2702: "IL NE RELANCE JAMAIS LE SECOND : il lit le HEAD, section par section."
    2704: "LE CLI NE RELIT LE HEAD QUE SI LE MTIME A BOUGE."
    2705: "UN TOOL S ECRIT EN UNE LIGNE, 120 signes au plus : jamais son JSON."
    2706: "LES JETONS VIENNENT DU MOTEUR, pas d une estimation du cli."
    2707: "LA FENETRE DU MODEL EST UNE KEY DE LA CONFIG."
    2708: "LA TABULATION COMPLETE ET NE CHANGE PAS DE FIELD ; Ctrl-C pose le stop, Ctrl-Q sort."
    2709: "UN FAUT SE DIT EN CLAIR DANS LE FLUX, jamais par une trace brute."

  CONFORMITY:
    1800: "LE CANON EST spec.yaml, ET IL SE CONTROLE : la forme et l empreinte, par une PASSE qui lit l ARBORESCENCE REELLE."
    1801: "L OBSOLETE SE SUPPRIME, IL NE S ANNOTE PAS : un renvoi mort se retire du corpus."
    1802: "UNE REGLE S ECRIT DANS LE LIEU QUI LA TIENT : dans le script s il est tenu par un script, avec sa mesure s il est tenu par une mesure."
    1803: "UNE REGLE QUI NE TIENT NULLE PART NE S ECRIT PAS."
    1804: "LE CORPUS SE LIT DANS CET ORDRE : le canon pour L ARCHITECTURE et ses bounds, puis les scripts pour le DETAIL."
    1805: "DEUX LIEUX SE CONTREDISENT ? LE SCRIPT DIT VRAI SUR LE PRESENT, LA PAROLE SUR L INTENTION."
    1806: "UN COMPTE SE PERIME, UNE BOUND SE TIENT : ce fichier ne porte pas d inventaire."
    1807: "LA SPEC NE MENT PAS SUR SON PROPRE ETAT : le PRESENT est dans le code."
    1808: "CE QUI EST VOULU PORTE SA CONDITION."
    1809: "LE VOCABULAIRE TECHNIQUE EST L ANGLAIS : tool, skill, plan, log. Aucun synonyme francais."
    1810: "UN SEUL PORTEUR : un tool qui parle a une machine dit machine et op ; la plomberie vit dans le porteur."
    1811: "LE YAML DECLARE, LE MOTEUR COMPOSE : machine, op, arguments."
    1812: "LE DISCRIMINANT S APPELLE op : liste fermee, refusee par le moteur, jamais action."

