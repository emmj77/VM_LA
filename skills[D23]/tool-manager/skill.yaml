# LA SEULE SKILL QUI PORTE CE DROIT, ET CE N EST PAS UN DETAIL : `table_manage` ecrit dans la table,
# `skill_manage` ecrit dans un mode d emploi. Ce sont les deux choses qui DEFINISSENT le harnais.
# Avec APPROVAL: true, chacun de ces gestes exige un feu vert humain qui NOMME le geste et ne sert
# qu une fois (work/approve). Sans feu vert, le geste est refuse -- et la boucle ecrit la demande
# pour que l humain puisse la voir et la signer (approval.sh allow <tool> <geste>).
APPROVAL: true
