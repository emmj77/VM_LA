id: "K26"
skill: "tool-manager"
date: "2026-10-19"
tags: ["tool-manager", "forge", "outil", "outils", "table", "skill", "palette", "ajouter", "retirer", "activer"]

SUMMARY:
  101: "Change the HARNESS: the tool table, or a skill and its toolset."
  102: "list_tools first: a free id is never guessed, and a line is never overwritten."
  103: "Every act that WRITES asks for a HUMAN go, NAMED, only once."
  104: "A tool body is a FILE (config/tools/<machine>/tool_<name>.yaml), never a line."
RULES:
  create_subfolder: true
  execute_code: false
  max_section_lines: 100
  # THE ONLY SKILL THAT CARRIES THIS RIGHT, AND IT IS NO DETAIL: `table_manage` writes in the table,
  # `skill_manage` writes in a manual. Those are the two things that DEFINE the harness.
  # With APPROVAL: true, each of these acts needs a human go that NAMES the act and serves
  # only once (work/approve). Without the go, the act is refused -- and the loop writes the request
  # so the human can see it and sign it (approval.sh allow <tool> <act>).
APPROVAL: true
TOOLS:
  G018: "table_manage"
  G017: "skill_manage"
  G002: "read_file"
  G003: "list_dir"
  G022: "load_doc"
  G062: "mkdir"
DOCS:
  300: "web_search"
PLAN:
WRITABLE_WORKSPACE:
  workspace: "work/"
  type-file: ".md .yaml .sh .json .txt"
ERROR:
  600: "Refused without a go: the human must approve THIS act (approval.sh allow <tool> <act>). Never work around it, never repeat it hoping"
  601: "table_manage refuses to remove a MANAGER (table_manage, skill_manage, todo...). That is deliberate: a harness does not cut off its own hand."
  602: "A tool body must carry tool:, RULES:, DESCRIPTION:, COMMAND:, ARGS: and name THE SAME tool. Refused otherwise: the line would be silent."