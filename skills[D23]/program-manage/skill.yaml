id: "K18"
skill: "program-manage"
date: "2026-10-17"
tags: ["program-manage", "install", "remove", "open", "packages"]

SUMMARY:
  101: "Manage the programs of the machine: install, remove, open."
  102: "One repository: apt. What is not there does not install from here."
  103: "A removal is named TWICE (name and confirm): that is the mark of intent."
  104: "Opening touches nothing: it is the act that cannot damage anything."

RULES:
  create_subfolder: false
  execute_code: false
  max_section_lines: 100

  # NOT BECAUSE IT WRITES IN THE HARNESS, BUT BECAUSE IT WRITES IN THE MACHINE:
  # install_program / uninstall_program set and remove packages. Every act named in GATED
  # asks for a named go, once, inside the approval.window seconds (300).
APPROVAL: true
PERMANENT_TODO: false
TOOLS:
  G045: "install_program"
  G046: "uninstall_program"
  G047: "open_program"
  G003: "list_dir"
  G022: "load_doc"
  G062: "mkdir"

DOCS:
  300: "web_search"

PLAN:

WRITABLE_WORKSPACE:
  workspace: "work/"
  type-file: ".log .txt .md"

ERROR:
  600: "Package name unknown to the repository: say it, and offer to look up the exact name."
  601: "Removal without its double: remove nothing, ask again for the name."
  602: "sudo asking for a password: refuse, do not wait (the call is --non-interactive)."
  603: "Program not found: say where it was looked for, and what sits next to it."
