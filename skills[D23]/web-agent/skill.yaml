id: "K31"
skill: "web-agent"
date: "2026-10-20"
tags: ["web", "agent-browser", "gemini", "image", "reading"]

SUMMARY:
  101: "Read a page, generate an image on Gemini: agent-browser drives Chromium, not a home-made engine."
  102: "An LA tool is a YAML that goes through the engine to the shell: no .sh, no .py, never."
  103: "Moussa's Chromium profile carries his Google session: no sign-in to redo, no profile to copy."
  104: "The [ref=eN] references die at every new snapshot: one read, then one action, never two."
  105: "The engine cuts at 200 lines and 4000 bytes: a tool that returns text stops at 180 lines."
  106: "Typing: key by key, one word at a time, irregular pauses - inserttext (paste) is seen and trips the antibot."
  107: "Headless passes on ChatGPT and DeepSeek, provided chromium --headless=new runs with the --user-agent of a real Chrome: it is the HeadlessChrome + webdriver=true chain that makes the antibot fail, not the absence of a screen."
  108: "A captcha, though, is not solved without a screen: if one ever appears, the visible window will be needed."
  111: "The bundled agent-browser announces webdriver=true and HeadlessChrome: every captcha fails. So /usr/bin/chromium --remote-debugging-port=9222 runs on the persistent profile and we hold on to it with --cdp 9222."
  109: "dash has no $RANDOM: the entropy of the typing pauses comes from od -An -N1 -tu1 /dev/urandom."
  110: "ChatGPT sits behind Cloudflare: headless the page stays on 'Just a moment'. Work in a real window on :99."
  112: "Measured trap: --download-path returns 0 file. Without that flag, the file lands under an identifier in the target folder, and the command exits on error even when it succeeded."

RULES:
  create_subfolder: true
  max_section_lines: 100

