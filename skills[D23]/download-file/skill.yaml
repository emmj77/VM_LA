id: "K08"
skill: "download-file"
date: "2026-10-19"
tags: ["download", "file", "https", "sha256", "download_file"]

SUMMARY:
  100: "BRING A FILE IN FROM OUTSIDE, SHOW IT, AND NEVER RUN IT."
  101: "MOUSSA, 19/10: 'the agent tends to download in an anarchic way'. This disorder"
  102: "is what this skill prevents: one file at a time, a valid name, a fingerprint returned."
  110: "THE RULE, IN THREE SENTENCES"
  111: "1. The download goes into the workspace (work/), never into the system. The file"
  112: "   name carries neither / nor ..: it cannot leave the folder."
  113: "2. The tool returns the SIZE and the sha256 FINGERPRINT. A file that comes in without a fingerprint is a"
  114: "   file that cannot be checked: it is not used."
  115: "3. What came in is NEVER RUN. A downloaded binary stays a file; if it"
  116: "   must be installed, that is install_program (repository package) or an act signed by hand."
  120: "WHAT YOU DO NOT DO HERE"
  121: "No http (the file would cross in clear), no ftp, no file://. No"
  122: "download loop: one file, one address, one name. No curl pipe to bash:"
  123: "that is not a download, it is a disguised execution, and it is refused."
  130: "THE APPROVAL: this skill carries APPROVAL: true, and download_file is in GATED. Every"
  131: "download therefore asks for a NAMED HUMAN GO (work/approve), once, inside the"
  132: "window. It is the only way to keep a journal of what came in, and through whom."

RULES:
  create_subfolder: true
  max_section_lines: 100

  # THE AGENT DOWNLOADS BADLY WHEN NOBODY WATCHES (MOUSSA's observation). The right exists, but it is
  # signed: download_file is in GATED, so every call asks for a named and fresh go.
APPROVAL: true
HUMAN_ONLY: false
PERMANENT_TODO: false

SKILL_TOOL_SET:
  G067: "download_file"
  G002: "read_file"
  G003: "list_dir"
  G062: "mkdir"
  G022: "load_doc"

  G015: "todo"
  G016: "update_todo"
DOCS:
  300: "TUNNEL_trois_skills_a_juger"

PLAN:
  400: "task: bring a file in and prove it"
  401: "etat : todo"

WRITABLE_WORKSPACE:
  # THE INSIDE OF A DOWNLOAD IS THE DOWNLOAD FOLDER OF THE HUMAN (MOUSSA, 19/10).
  # Written as an ABSOLUTE path, not relative to the root: the engine resolves both, but a relative
  # ("work/") would send the files into the agent workspace, where the human would
  # never see them. It is the only folder of this project that leaves the tree, and it leaves
  # for one reason: it is where MOUSSA looks.
  workspace: "/home/moussa/Téléchargements"
  type-file: ".deb .rpm .AppImage .tar.gz .tgz .zip .whl .gguf .onnx .md .yaml .txt .json .sh .conf .pdf .png .jpg"

ERROR:
  600: "the file is already there: it is not overwritten, another name is given"
  601: "the fingerprint does not match the one the source announced: the file is not what it is thought to be"
PORTEUR: ""
