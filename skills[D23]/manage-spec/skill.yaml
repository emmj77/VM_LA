id: "K36"
skill: "manage-spec"
date: "2026-10-22"
tags: ["spec", "canon", "project", "statement"]

SUMMARY:
  100: "The ONE skill that loads and appends the SPEC of the loaded project. Two acts, nothing else."
  101: "load_spec: all of the canon, one section, or a range of its lines. It opens app_spec, once."
  102: "app_spec: one or two statements, at the offset it is told. It comes after load_spec, or it is refused."
  103: "No section is named here: naming it is the act of create-spec. No line is ever dropped."
  104: "A statement is one line, one fact, 100 bytes at most. What cannot be proven is reported, never invented."
  110: "the order is the law: load, then append, once. after a write, load again to write again."

RULES:
  create_subfolder: false
  max_section_lines: 100

# APPROVAL: false -- the spec tools touch the project manifest, not the TABLE nor a SKILL.
APPROVAL: false
HUMAN_ONLY: false
PERMANENT_TODO: false

SKILL_TOOL_SET:
  G078: "load_spec"
  G079: "app_spec"
  G002: "read_file"

DOCS:
  300: "manage-spec: load_spec reads the canon (all, a section, a range of lines) and opens app_spec for this turn."
  301: "app_spec writes one or two statements at the offset it is told, in a section that exists, then closes."
  302: "no section is named here (create-spec names it), no statement is dropped, nothing is invented: what cannot hold is said."

PLAN:

WRITABLE_WORKSPACE:
  workspace: "work/"
  type-file: ".md .txt .yaml"
ERROR:
  600: "the project carries no SPEC zone: say it, do not fabricate one"
  601: "the statement is longer than cap.chars_per_line: cut it, or ask the human"
  602: "app_spec without load_spec, or a second write in the same turn: load again first"
PORTEUR: ""
