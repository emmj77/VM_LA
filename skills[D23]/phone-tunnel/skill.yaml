id: "K17"
skill: "phone-tunnel"
date: "2026-10-19"
tags: ["tunnel", "phone", "wireguard", "wg0", "pairing", "route"]

SUMMARY:
  100: "A ROUTE, NOT A RECIPE: bring the phone up to the bridge, and prove it with the machine."
  101: "the FACT closes a step, never the word of tunnel_up. a step that cannot pass says what is missing."
  102: "| # | act   | the set of tools              | the step closes when                      |"
  103: "| 1 | read  | tunnel_status, read_file      | the state is printed: an interface line   |"
  104: "| 2 | raise | tunnel_up, tunnel_down, status| the address appears, or it says what lacks|"
  105: "| 3 | check | tunnel_status, read_file      | address, port open, one pair has spoken   |"
  106: "| 4 | speak | reply                         | four lines are said: what stands, phone   |"
  107: "never: lay it down unasked, open the bridge on the network, promise before step 3 is read."
  110: "the bridge listens on 127.0.0.1 only; the tunnel is what brings the phone to it."
  111: "raising wg0 sets 10.10.0.1/24 and a UDP port; it opens no service of its own."

RULES:
  create_subfolder: true
  max_section_lines: 100

# APPROVAL: false -- the three tunnel tools are outside GATED; what bounds this skill is the
# route itself: every step opens its own set of tools, and the engine closes it on a fact.
APPROVAL: false
HUMAN_ONLY: false
PERMANENT_TODO: true

SKILL_TOOL_SET:
  G064: "tunnel_status"
  G065: "tunnel_up"
  G066: "tunnel_down"
  G002: "read_file"

DOCS:
  300: "skilltunelfone.txt"

PLAN:
  400: "the phone on the bridge, proven"
  at: 401
  401:
    text: "read what stands"
    tools: [tunnel_status, read_file]
    close: ["UDP"]
  402:
    text: "raise wg0, or lower it first if the profile is lost"
    tools: [tunnel_up, tunnel_down, tunnel_status]
    close: ["10.10.0.1"]
  403:
    text: "prove it by the fact"
    tools: [tunnel_status, read_file]
    close: ["10.10.0.1", "ecoute", "last exchange"]
  404:
    text: "report four lines"
    tools: [reply]
    close: []

WRITABLE_WORKSPACE:
  # the tunnel writes nothing: it reads the machine and reports. declared for the form the
  # harness demands, and it serves no step.
  workspace: "work/"
  type-file: ".md .yaml .txt .json"
ERROR:
  600: "tunnel_status/tunnel_up/tunnel_down do not exist or were cut: the route is dead, say it"
  601: "sudo asks for a password: no tunnel act is possible from here, say it"
PORTEUR: ""
