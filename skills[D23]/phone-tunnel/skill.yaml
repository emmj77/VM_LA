id: "K17"
skill: "phone-tunnel"
date: "2026-10-19"
tags: ["tunnel", "phone", "wireguard", "wg0", "pairing", "route"]

SUMMARY:
  100: "A ROUTE, NOT A RECIPE: bring the phone up to the bridge, and prove it with the machine."
  101: "the FACT closes a step, never the word of tunnel_up. a step that cannot pass says what is missing."
  102: "| # | act   | tool          | the step closes when                                       |"
  103: "| 1 | read  | tunnel_status | an address AND a listening port are printed                |"
  104: "| 2 | raise | tunnel_up     | it says what it mounted, or names what it lacks            |"
  105: "| 3 | check | tunnel_status | address, port, and a peer that has spoken: three lines     |"
  106: "| 4 | speak | reply         | four lines: what stands, the address, the port, phone side |"
  107: "never: lay it down unasked, open the bridge on the network, promise before step 3 is read."
  110: "the bridge listens on 127.0.0.1 only; the tunnel is what brings the phone to it."
  111: "raising wg0 sets 10.10.0.1/24 and a UDP port; it opens no service of its own."

RULES:
  create_subfolder: true
  max_section_lines: 100

# APPROVAL: false -- the three tunnel tools are outside GATED; what bounds this skill is the
# tunnel itself: every step closes the toolset on the one tool it names.
APPROVAL: false
PERMANENT_TODO: true

SKILL_TOOL_SET:
  G064: "tunnel_status"
  G065: "tunnel_up"
  G066: "tunnel_down"
  G002: "read_file"

DOCS:
  300: "TUNNEL_trois_skills_a_juger"

PLAN:
  400: "PLAN phone-tunnel: the phone on the bridge, proven"
  401: "[in_progress] read what stands -- tools: tunnel_status"
  402: "[todo] raise wg0 -- tools: tunnel_up"
  403: "[todo] prove it by the fact -- tools: tunnel_status"
  404: "[todo] report four lines -- tools: reply"

WRITABLE_WORKSPACE:
  # the tunnel writes nothing: it reads the machine and reports. declared for the form the
  # harness demands, and it serves no step.
  workspace: "work/"
  type-file: ".md .yaml .txt .json"
ERROR:
  600: "tunnel_status/tunnel_up/tunnel_down do not exist or were cut: the route is dead, say it"
  601: "sudo asks for a password: no tunnel act is possible from here, say it"
