SECTION : LA_MACHINE
  100: "VM_LA EST LA RACINE DU PROJET."
  101: "LA RACINE SE POSE ET NE SE DEVINE PAS."
  102: "UN CHEMIN SE DERIVE DU DOSSIER DU SCRIPT, JAMAIS PAR .."
  103: "config/ : la_tools.yaml, la_config.yaml, head.yaml, USER.md, templates/, engine/, backups/."
  104: "config/la_tools.yaml EST LA TABLE DES TOOLS."
  105: "config/la_config.yaml PORTE LES ADRESSES ET LA PERMANENTE."
  106: "config/head.yaml EST LE HEAD : GELE, lu sur place, jamais reecrit."
  107: "config/USER.md EST LE BLOC HUMAIN, porte par la section USER du head."
  108: "config/engine/ PORTE LES SCRIPTS : dash + coreutils + jq, rien d'autre."
  109: "loop.sh TIENT UN TOUR ; engine.sh EXECUTE UN TOOL."
  110: "second.sh REND L'ETAT ; summary.sh ECRIT LE RESUME. entete.sh sans role : head gele."
  111: "signal_task.sh PARLE A L'HUMAIN ; bound_result BORNE LA MARGE"
  112: "backup.sh TIENT LE FILET."
  113: "LE CONFINEMENT SE CHOISIT DANS CE QUI EST PUBLIE : firejail, bubblewrap, proot, apparmor."
  114: "LES ETAGES LEGERS TOURNENT EN LOCAL : LFM2.5-1.2B, servi par llama.cpp sur 127.0.0.1:8088."
  115: "CLASSER, FILTRER, RESUMER NE COUTE AUCUN APPEL AU ENGINE PRINCIPAL."
  116: "MESURE : sous 1,5 G, un modele structure mal son JSON."
  117: "LA VOIX SE SEPARE : NeMo-Speech.cpp porte le STT ; sherpa-onnx porte la synthese (Piper)."
  118: "LE CANON EST spec.yaml : la PAROLE, le pourquoi, L'ARCHITECTURE."
  119: "LA VM EST LE HARNESS : les scripts SONT le harness."
  120: "LA BASE EST DEBIAN MINIMAL, LA MEME QUE LA STATION : une seule libc (glibc)."
  121: "DEBIAN PUBLIE espeak-ng, ffmpeg, alsa-utils, pipewire ; NeMo-Speech.cpp se compile."
  122: "DEBIAN PESE PLUS QU'ALPINE, en disque comme en memoire."
  123: "LA VM MONTE DEUX IMAGES ext4 : rootfs.img et coffre.img."
  124: "RIEN DE CE QUE LA VM ECRIT NE TRAVERSE VERS LA STATION."
  125: "LE CONFINEMENT EST LA CONSEQUENCE DU MONTAGE, PAS UNE REGLE."
  126: "LE DISQUE EST UN ext4, JAMAIS UN PARTAGE : un drapeau se retire, un disque absent non."
  127: "JAMAIS DE QCOW2 : l'image se copie et se compare par cp."
  128: "ext4 SE LIT ET S'ECRIT SANS MONTER NI root : mke2fs, e2fsck, debugfs."
  129: "L'AMORCE NE FAIT QUE CHARGER LE DISQUE : /proc /sys /dev AVANT tout."
  130: "UN /dev NEUF EST VIDE : /dev/shm se donne."
  131: "LE RESEAU : udhcpc JAMAIS bloquant (timeout)."
  132: "LE NOYAU INTEGRE VIRTIO, VIRTIO_PCI, VIRTIO_RING, BLK_MQ_VIRTIO, DEVTMPFS, BINFMT_SCRIPT."
  133: "INTEGRE AUSSI EXT4_FS, JBD2, MBCACHE, CRC16, FW_CFG_SYSFS."
  134: "MODULES : virtio_blk, virtio_net, virtio_snd, et leurs dependances REELLES."
  135: "PIEGE : l'initrd doit porter L'INTERPRETEUR de son /init."
  136: "PIEGE : un /dev neuf n'a aucun point de montage."
  137: "PIEGE : -cpu host exige -enable-kvm."
  138: "PIEGE : le son passe par virtio-snd, pas par snd-hda-intel."
  139: "PIEGE : udhcpc sans timeout bloque."
  140: "PIEGE : crc32c se resout par les dependances reelles."
  141: "PIEGE : l'amorce et le cpio se reconstruisent ENSEMBLE."
  142: "vml.sh REFUSE DE DEMARRER SANS FILET : tar de la racine, support ETRANGER, compare."
  143: "LA RAM SE FIXE PAR LE PIC SIMULTANE, PAS PAR L'INVENTAIRE."
  144: "STT ET TTS NE TOURNENT JAMAIS ENSEMBLE : le pic est le plus gros des deux."
  145: "RAM = noyau + ce qui tourne ensemble + une marge DECIDEE."
  146: "LE PLANCHER SE MESURE PAR PALIERS : VML_MEM descendu jusqu'a l'echec."
  147: "LA VOIX RESTE DANS LA VM : la sortir enverrait l'audio de la piece a un tiers."
  148: "VML_MEM : le defaut vit DANS le lanceur, sa valeur vient du plancher mesure."
  149: "LANCEUR : -smp 4, -cpu host, -audiodev pa, -drive rootfs.img + coffre.img."
  150: "L'AUDIO PASSE PAR PIPEWIRE, SUR LA STATION."
  151: "LE CONFINEMENT EST TOTAL SUR LES FICHIERS, PARTIEL SUR L'AUDIO."
  152: "LE MICRO ET LE HAUT-PARLEUR SONT DES PERIPHERIQUES DE LA STATION."
  153: "L'AUDIO DE LA PIECE TRAVERSE LA STATION : inevitable."
  154: "LA STATION APPORTE le noyau, les modules, QEMU, la corbeille, config/."
  155: "LA VM APPORTE le disque, la racine, les procs, le STT, le TTS."
  156: "AUCUNE LOGIQUE METIER COTE STATION : le script de demarrage est un outil."
  157: "AUCUN TOOL NE VIDE LA CORBEILLE."
  158: "CORBEILLE PLEINE : le tool se REFUSE et le DIT."
  159: "L'HUMAIN VIDE LA CORBEILLE, SUR LA STATION, VM ARRETEE."
  160: "LE CONTROLE DU CORPUS EST UN PROC sh. VOULU : pose, il lit l'arborescence REELLE."
  161: "LES IMAGES ET LE FILET VIVENT HORS DE LA RACINE."
  162: "UNE IMAGE NE PEUT PAS CONTENIR SON PROPRE FILET."
  163: "LE CODE NOMME LA RACINE LA_ROOT (ROOT dans les scripts) ; SKROOT est le dossier du SKILL."
  164: "UN IDENTIFIANT DE LA MACHINERIE EST EN ANGLAIS ; la prose reste en francais."

SECTION : ORGANISATION
  200: "AUCUN SECRET NE VIT DANS LA RACINE, pas meme dans memory/."
  201: "UN SECRET SE NOMME, IL NE S'ECRIT PAS."
  202: "LES DECLARATIONS SONT DES ROUAGES, PAS DES DOCUMENTS : trois choses se declarent, trois."
  203: "LES TROIS : les tools, l'ADRESSE du engine, les NOMS des secrets."
  204: "ELLES VIVENT DANS config/ ; LA RACINE LES RECOIT."
  205: "LA TABLE ET LE YAML DISENT LA MEME CHOSE, ou l'un des deux est corrige."
  206: "QUI CHANGE UNE DECLARATION : L'HUMAIN, par un outil de la station."
  207: "JAMAIS A LA MAIN, JAMAIS PAR LE MODELE."
  208: "LE MODELE NE LIT NI N'ECRIT UNE DECLARATION."
  209: "IL VOIT UN PERIMETRE, JAMAIS LA LISTE QUI LE PRODUIT."
  210: "LE BACKLOG N'EST PAS UNE POUBELLE : chaque entree porte sa CONDITION."
  211: "LE JOUR OU LA CONDITION TOMBE, L'ENTREE REMONTE DANS SA SECTION."

SECTION : LE_HARNAIS
  300: "loop.sh deroule UN tour, de la DEMANDE a la REPLY."
  301: "UN TOUR A NEUF TEMPS NOMMES, et le detail vit dans le script."
  302: "LES NEUF : les tools, les cles, le engine actif, le schema, la table."
  303: "LES NEUF, SUITE : la skill et son perimetre, le head, l'espace de travail, la boucle."
  304: "[2] LES CLES : le .env est lu AVANT tout appel ; une variable DEJA posee GAGNE."
  305: "[2] LA VALEUR NE SORT JAMAIS DU SCRIPT : il dit le NOM et l'etat, posee ou ABSENTE."
  306: "[3] LE ENGINE ACTIF est le bloc de la_config.yaml qui porte active: true."
  307: "[3] Si LA_ALIAS est pose, le bloc doit porter CET alias."
  308: "[3] Sans post ou sans model, le tour s'arrete EN LE NOMMANT."
  309: "[3] Un bloc qui nomme une variable exige qu'elle soit posee : vide, le tour s'arrete."
  310: "[3] L'entete par defaut est Authorization: Bearer."
  311: "[3] Un bloc SANS variable est un engine LOCAL : aucun entete, aucune cle."
  312: "[4] LA LISTE DES TOOLS ENVOYEE A L'API PORTE EXACTEMENT UN ELEMENT : la(g, a)."
  313: "[4] g est un entier, le NUMERO d'une ligne ; a porte les arguments DANS L'ORDRE declare."
  314: "[4] AUCUN CATALOGUE N'EST ENVOYE : le modele ne voit jamais la table entiere."
  315: "[4] LE PROTOCOLE : on ne repond JAMAIS par du texte, mais par un tool."
  316: "[4] LE SURPLUS de a (le texte libre) part sur l'ENTREE STANDARD du tool."
  317: "[4] Le tool qui repond porte sa FORME en premier argument ; tout le reste est la reply."
  318: "[5] LA TABLE SE LIT PAR BORNES, sans analyseur YAML : les ids sont les lignes '- id:'."
  319: "[5] LA MEME LOI sert a la boucle et au engine : deux lectures divergeraient en silence."
  320: "[6] LE PERIMETRE = les tools de la SKILL ACTIVE, PLUS la CATEGORIE PERMANENTE."
  321: "[6] Un perimetre VIDE arrete le tour."
  322: "[6] answer, ask, talk et kill tombent TOUJOURS, meme sous un lock."
  323: "[6] Sans eux, un lock ne se leve plus, et un agent en boucle n'a plus de bouton."
  324: "[6] Ils vivent dans UNE variable NOMMEE, pour qu'on les VOIE."
  325: "[6] LA PERMANENTE se declare par NOM ; 'tool:action' ne vaut QUE pour cette action."
  326: "[6] Un privilege se donne a l'ACTION, pas au voisinage."
  327: "[6] LE LOCK : requires_tool REDUIT le perimetre a ce seul tool, plus les guards."
  328: "[6] Le modele n'est pas pris en flagrant delit : il est EMPECHE."
  329: "[6] LE PERIMETRE EST ECRIT AU MODELE : numero, nom, famille, description, arguments."
  330: "[6] Un numero HORS de cette liste est refuse PAR LE HARNAIS, dans la meme forme."
  331: "[6] LA_PERIM_TRACE=1 MONTRE le calcul : lock, guards, permanente, ids retenus."
  332: "[7] LE HEAD EST config/head.yaml : GELE, lu sur place -- le prefixe se met en cache."
  333: "[7] Sans head.yaml, la boucle S'ARRETE en le nommant : la tete est la piece unique du tour."
  334: "[7] LE HEAD SECONDAIRE est REBATI A CHAQUE TOUR : sections FIXES et BORNEES, ordre fixe."
  335: "[7] Un preambule n'est pas une reply : si le second rend JSON, la boucle prend le result."
  336: "L'ORDRE EST L'ARCHITECTURE : HEAD, PROTOCOLE, PERIMETRE, ETAT, COUCHE DE L'ETAT, DEMANDE."
  337: "[8] PUIS L'HISTORIQUE DU TOUR, ET LES FAITS (date, heure, locale) EN DERNIER."
  338: "[8] L'ESPACE DE TRAVAIL est un dossier temporaire PAR TOUR, nettoye au retour."
  339: "[8] INT, TERM et HUP arretent le tour (code 130) et le DISENT."
  340: "[9] L'APPEL : curl -sS --max-time LA_TIMEOUT (600 s) sur le post du engine actif."
  341: "[9] Corps : {model, tools, tool_choice, max_tokens, stream:false, messages}."
  342: "[9] Une reply qui porte .error ARRETE le tour en le nommant ; une reply sans message aussi."
  343: "[9] CHARGEMENT N'EST PAS UN TOUR : finish_reason load repose la MEME question, huit fois."
  344: "[9] PAS DE TOOL, C'EST UN REFUS, PAS UNE REPLY : le harness le DIT, trois fois au plus."
  345: "[9] L'HISTORIQUE REJOUE L'APPEL TEL QUEL, identifiants compris."
  346: "[9] Sans identifiant du engine, la boucle en POSE UN (call_la_<tour>_<rang>)."
  347: "[9] LES ARGUMENTS SONT {g, a} ET RIEN D'AUTRE : tout le reste est refuse EN LE NOMMANT."
  348: "[9] Un refus est un TOUR, pas une panne : le tour continue."
  349: "[9] LA LOI DU DECOUPAGE : autant d'arguments que la ligne en declare HORS stdin."
  350: "[9] LE SURPLUS DE a EST LE TEXTE LIBRE : il entre par l'ENTREE STANDARD."
  351: "[9] LE RETOUR AU MODELE EST LE RESULT, JAMAIS L'ENVELOPPE : ni status, ni ts, ni la forme."
  352: "[9] LE TOUR SE FERME QUAND answer OU ask PASSE avec status ok ; refuse, il reste ouvert."
  353: "[9] C'est pour cela qu'ils sont guards : un guard qui peut etre refuse n'en est pas un."
  354: "[9] LES BORNES SE DISENT, ELLES NE COUPENT PAS ; le PLAFOND DE TOURS, lui, ARRETE."
  355: "[9] LA REPLY DE L'HUMAIN est le resultat de answer, imprime sur la sortie standard."
  356: "[9] Sans answer, la derniere ligne DIT que la tache s'est arretee sans reply."
  357: "LE JOURNAL : une ligne horodatee par tool, sur la sortie d'erreur."
  358: "LA_JOURNAL pose : une ligne JSON par tool. LA_TRACE=1 rend l'appel BRUT du modele."
  359: "LE HARNAIS EST UN SEUL PROCESSUS : une table, un engine, une boucle."
  360: "LA BOUCLE : la demande, l'horodatage, le PERIMETRE, l'appel assemble dans l'ordre."
  361: "PUIS le LLM travaille DANS ce perimetre ; UN PROC execute ; la LIGNE part ; fini ? NON."
  362: "LE LLM EST APPELE A CHAQUE TOUR, SANS EXCEPTION."
  363: "LA PAROLE N'EST PAS LA FIN DU TOUR : le modele doit pouvoir PARLER avant d'avoir fini."
  364: "L'ETAT N'EST PAS UN ACTEUR : il n'ecrit RIEN, il n'appelle AUCUN proc, il ne survit PAS."
  365: "C'est une DONNEE de la boucle : le plan, son etape, les fichiers lus ou ecrits."
  366: "CE QUE L'HUMAIN DIT ENTRE COMME UNE DEMANDE : la boucle ne l'interprete pas."
  367: "L'HUMAIN N'A PAS DE TOOL ET N'EN AURA PAS : il agit en PARLANT."
  368: "LES BORNES D'ARRET : le CONTEXTE (70 %), l'ANTI-BOUCLE, puis JETONS, APPELS, TEMPS."
  369: "Une tache longue s'arrete sur le COMPTE DES ETAPES DU PLAN."
  370: "ET UNE BORNE SE DIT : au MODELE (role: tool) et A L'HUMAIN."
  371: "L'ANTI-BOUCLE SE JUGE SUR LE TOOL ET LA CIBLE normalisee, jamais sur les caracteres."
  372: "Deux seuils : ALERTE, puis ARRET ; jetons, appels, temps dormants par defaut."
  373: "L'ECHELLE DE RECUPERATION : QUATRE BARREAUX, ET ON N'EN SAUTE AUCUN."
  374: "[1] DIRE ; [2] ELARGIR d'un cran ; [3] REDUIRE (progress complete) ; [4] DEMANDER."
  375: "LES TROIS SYMPTOMES : REPETEUR, ALTERNATEUR, RODEUR - chacun a son detecteur."
  376: "LA MESURE DE PROGRES : une etape cochee OU un chemin JAMAIS vu dans cette tache."
  377: "Trois tours sans progres -> RODEUR. Le seuil se MESURE."
  378: "COCHER DES ETAPES N'EST UN PROGRES QUE SI LE TOUR A FAIT AUTRE CHOSE."
  379: "Un tour qui ne porte que des progress DEFAIT le plan : c'est un refus nomme."
  380: "CE QUI N'EST PAS UN BARREAU : l'escalade de modele, la remise a zero, le perimetre large."
  381: "LE TOUR EST TURN-BASED ; LE PLAN OUVERT LE REND GOAL-BASED."
  382: "Turn-based, l'arret est un answer ; goal-based, l'arret est un COMPTE d'etapes restantes."
  383: "Il n'y a AUCUN modele juge."
  384: "LE TEMPS ENTRE DANS LA BOUCLE PAR LE SOMMEIL, ET PAR LUI SEUL : le tour ATTEND."
  385: "VOULU LE BANC SE POSE AVANT LE MODELE : un faux modele ecrit a la main, sans reseau ni cle."
  386: "LES CINQ CAS : un tour qui finit ; un refus ; une question ; une borne ; une boucle."
  387: "LE CONTROLE QUI DECIDE DE TOUT : chaque message assistant porte sa cle tool_calls."
  388: "INTERDIT : reduire un message a {role, content} - la prose raconte, elle ne rejoue pas."
  389: "LE HARNAIS N'A RIEN A FILTRER : pas d'outil run, pas de script compose par le modele."
  390: "rm -rf n'est pas interdit, il n'est PAS REPRESENTABLE : aucun tool ne le porte."
  391: "talk DIT CE QUI SE PASSE, SANS FERMER LE TOUR."
  392: "answer FERME LE TOUR QUAND LE PLAN EST TERMINE ; ask ARRETE et rend la main a l'humain."
  393: "UN PLAN OUVERT CHANGE LA NATURE DE L'ARRET : il devient un COMPTE, jamais un jugement."
  394: "[4] LE SCHEMA ECRIT DANS LE HEAD, TOOLS_SCHEMA : la boucle le LIT, elle ne le fabrique pas."
  395: "[2] LE ENGINE LIT LES CLES DE LA SKILL EN MAJUSCULES : SUMMARY, TOOLS, PERIMETER."
  396: "[6] TOOLS : une ligne, un nom de tool. PERIMETER : workspace et type-file."
  397: "[6] ROOT ET SPECS NE SE DECLARENT PAS : ils se DERIVENT du SKILL ACTIF."
  398: "[4] AUCUN SCHEMA PAR TOOL N EST ENVOYE : le perimetre ECRIT les tools en TEXTE."

  399: "LE PONT TRADUIT ; il ne decide rien : une image ou une voix DEVIENT la demande."
SECTION : LE_CONTEXTE
  1900: "LE CONTEXTE EST CLOSONNE EN QUATRE ZONES, chacune avec SA BORNE."
  1901: "ZONE 1, LA TETE : le socle immuable - le prompt, les regles, la structure du plan."
  1902: "Elle ne bouge pas d'un tour a l'autre : c'est ce qui la met en cache."
  1903: "ZONE 2, LE BLOC DYNAMIQUE, pose juste apres la tete : QUATRE SECTIONS, jamais plus."
  1904: "SES QUATRE : le micro-resume, le plan en cours, l'horodatage, la doc de l'action."
  1905: "LE MICRO-RESUME PORTE L'ETAT : l'avancement, les decisions prises, les fichiers modifies."
  1906: "Sa section se refait A CHAQUE avancement du plan, ou a chaque modification du plan."
  1907: "LA DOC EST CELLE DE L'ACTION EN COURS : choisie pour ce tour, elle n'est pas entassee."
  1908: "CHAQUE SECTION A UNE TAILLE FIXE : elle se REMPLACE, elle ne s'allonge pas."
  1909: "Une taille fixe, et le prefixe reste en cache d'un tour a l'autre."
  1910: "ZONE 3, LA QUEUE : une fenetre GLISSANTE des echanges recents, pour l'immediatete."
  1911: "ZONE 4, L'ETAT EXTERNALISE : l'historique long vit dans le fichier, pas la fenetre."
  1912: "L'ETAT EXTERNALISE SE CHOISIT : on remonte a la source, on n'entasse pas dans le contexte."
  1913: "LE BLOC DYNAMIQUE EST TENU EN ARRIERE-PLAN, par le micro-modele ephemere."
  1914: "LE PRINCIPAL EST DECHARGE DE LA PLOMBERIE : le nettoyage va au local."

  1915: "LA FENETRE GARDE VINGT ECHANGES ; ceux qui en sortent passent au RESUME du head."
SECTION : LES_OUTILS
  400: "LA n'a QU'UN tool : la(g, a)."
  401: "g est le NUMERO d'une ligne de la table ; a porte les valeurs DANS L'ORDRE declare."
  402: "LE MODELE NE COMPOSE AUCUNE COMMANDE : il nomme un tool."
  403: "UNE LIGNE PORTE : id, tool, family, description, args, command, enabled."
  404: "L'id est une IDENTITE ; le tool un NOM ; la family dit la NATURE, jamais l'endroit."
  405: "QUATRE FAMILLES : READ sous la racine, WRITE sous l'espace du skill, MANAGE son registre."
  406: "LA FAMILLE DECIDE OU UN CHEMIN A LE DROIT D'ETRE."
  407: "UN TOOL EST UN PROCESSUS : il recoit l'id, les arguments, le texte libre."
  408: "Il ecrit UNE ligne JSON sur sa sortie standard, et RIEN d'autre."
  409: "LA VALIDATION PASSE AVANT TOUT EFFET : id, table, ligne, arguments, portee."
  410: "Une seule chose qui cloche : RIEN n'est execute, et le refus est NOMME."
  411: "L'ARITE : les arguments marques stdin: true NE SE COMPTENT PAS."
  412: "Plus d'arguments que declares : REFUS ; les manquants prennent le defaut de la ligne."
  413: "LES CINQ TYPES, ET ILS SONT FERMES : path, enum, int, bool, text."
  414: "UN CHEMIN SE RESOUT, IL NE SE DONNE PAS : absolu, ~, .., $, guillemet, controle : REFUSES."
  415: "Sous READ et WRITE, le chemin resolu reste SOUS le registre de sa famille."
  416: "ENUM N'EST PAS UN TEXTE LIBRE : la valeur est DANS la liste fermee, ou refusee en DISANT."
  417: "LE MONTAGE : la commande porte des trous {{nom}}, remplis par les valeurs DEJA VALIDEES."
  418: "Tout autre {{...}} RESTE tel quel : un template y garde ses propres trous."
  419: "CE QUI EST LIBRE ENTRE PAR L'ENTREE STANDARD, JAMAIS DANS LA COMMANDE."
  420: "L'EXECUTION : timeout 600 s (LA_TIMEOUT), puis dash -c sur la commande montee."
  421: "C'est le timeout interne de la LIGNE qui coupe un tool qui pend : il est plus serre."
  422: "LA LOI DU RETOUR : 0 -> ok ; 3 -> approbation ; 124 -> delai ; tout autre -> refus."
  423: "UN TOOL QUI ECHOUE SANS RIEN DIRE LE DIT QUAND MEME."
  424: "LA BORNE PASSE AVANT LA FORME : 4000 octets ET 200 lignes."
  425: "Sous les deux plafonds : le resultat passe TEL QUEL, aucun fichier n'est cree."
  426: "Au-dela : TETE et QUEUE, et la sortie COMPLETE va dans l'espace de travail, horodatee."
  427: "LE RESULTAT BORNE DIT SON CHEMIN, ses octets, ses lignes, et qu'il est tronque."
  428: "La coupe tombe TOUJOURS sur un caractere entier."
  429: "LA FORME UNIQUE : une ligne JSON {status, tool, line, result, ts}, ecrite par le ENGINE."
  430: "Un refus est un RESULTAT : forme complete, rien sur la sortie d'erreur, JAMAIS un silence."
  431: "LA LIGNE SE DESACTIVE EN PLACE : enabled: faux, et le engine refuse en NOMMANT le champ."
  432: "Une ligne qui ne porte PAS enabled est ACTIVE."
  433: "LE ENGINE NE CONNAIT AUCUN SECRET : il n'en lit, n'en ecrit, n'en imprime aucun."
  434: "LA SKILL ACTIVE EST OBLIGATOIRE : sans elle, il REFUSE en nommant le fichier."
  435: "Sans skill active : ni registre d'ecriture, ni palette."
  436: "L'ENVIRONNEMENT DU TOOL PORTE LA RACINE, LE REGISTRE DE TRAVAIL ET LES PLANS."
  437: "LA TABLE PORTE DEUX LANCEURS GENERIQUES : un pour un CLI, un pour le shell."
  438: "LA TABLE EST UN CATALOGUE DE RECETTES CANONIQUES, pas une liste de commandes."
  439: "answer EST LA SEULE SORTIE POSSIBLE VERS L'HUMAIN."
  440: "LES NOMS SONT EN ANGLAIS : la norme du format d'appel d'outil."
  441: "LE VOCABULAIRE DU PROJET, LUI, RESTE FRANCAIS."
  442: "La ligne porte doc: quand le tool vient d'un CLI : c'est le SUJET de sa documentation."
  443: "LE RETOUR EST UNE SEULE FORME POUR TOUS LES TOOLS."
  444: "LA FORME MACHINE : un JSON Schema MINIMAL, derive de la ligne."
  445: "Le name, une phrase qui dit ce que le tool couvre, les arguments, leurs types et bornes."
  446: "LE DROIT EST ECRIT AVEC LE TOOL : la famille, et la portee quand il touche un chemin."
  447: "LE ENGINE NE S'Y FIE PAS : il re-verifie la portee avant l'effet, et refuse en nommant."
  448: "LA TABLE A UNE GEOGRAPHIE : les tools ordinaires, ceux de la BOUCLE, les FRAGMENTS DE CLI."
  449: "Un fragment porte son EN-TETE : la commande de DECOUVERTE et le compte des commandes."
  450: "UN FRAGMENT DE CLI N'OUVRE AUCUN CHEMIN D'EXECUTION."
  451: "LA LISTE FERMEE (famille, commande) EST LUE DANS LE CATALOGUE DU CLI."
  452: "LA DISCOVERABILITE EST UN TOOL, PAS UN CATALOGUE ENVOYE."
  453: "LE CATALOGUE EST PLAFONNE, ET LE PLAFOND EST UNE MESURE."
  454: "UN MODE AJOUTE DE LA MECANIQUE SANS AJOUTER DE NAME."
  455: "Un mode entre s'il REMPLACE un tool entier, ou si son ABSENCE ferme une porte."
  456: "UN TOOL ENTRE QUAND SON PORTEUR EXISTE."
  457: "LES TOOLS SENSIBLES SORTENT EN 3 : 'approbation requise' et la ligne assemblee."
  458: "UN TOOL NE FAIT JAMAIS DEUX CHOSES A LA FOIS."
  459: "Il ne depend pas d'une decision prise plus tot : ses arguments sont COMPLETS."
  460: "IL NE PREND JAMAIS DE COMMANDE EN TEXTE : il n'y a pas de tool run."
  461: "LA CONFORMITE : cinq points, et un tool qui en manque UN SEUL n'entre pas."
  462: "[1] IL FAIT UNE CHOSE ; [2] SON RESULTAT EST UN FAIT BORNE."
  463: "[3] LE MODELE A LA LIBERTE DE LA VALEUR, JAMAIS CELLE DE LA COMMANDE."
  464: "CE QUI N'A PAS DE LIGNE : run, exec, eval, script, repl, shell."
  465: "Pas de ligne non plus : install, editor, plugin, auth, login, cloud, telemetry."
  466: "LA PAROLE EST UN TOOL : talk(form, text) dit ce qui se passe et NE FERME PAS LE TOUR."
  467: "answer ferme le tour ; talk et answer partagent la forme, la famille REPLY, le texte libre."
  468: "LE TOOL PREALABLE EST load_doc, ET LA TABLE LE PORTE."
  469: "UN SEUL MECANISME, VERIFIE UNE FOIS : un tool, un canal, une borne, un lock."
  470: "toolset MONTRE TOUS LES TOOLS DU TOUR : le recours quand un tool manque au perimetre."
  471: "A CHAQUE TOUR, LA BOUCLE CLASSE les tools MOUVANTS du skill ; un reranker local les NOTE."
  472: "LA PART EST DE 30% A CHAQUE TOUR ; toolset ouvre le tour ENTIER un seul tour."

  473: "UN OUTIL APPELE PAR LE PONT LIT UNE ENTREE VIDE, jamais la socket du client."

  474: "LE SOMMEIL EST UN TOOL DU TOUR ; il n'ouvre NI proc, NI service, NI fichier d'etat."
  475: "SA DUREE EST UNE LISTE FERMEE (15..180 par pas de 15) ; hors liste, le refus DIS la liste."
  476: "LE SOMMEIL A DEUX MORTS : l'echeance atteinte, ou le MOT DE L'HUMAIN (LA_STOP_FILE)."
  477: "IL RESTE SOUS LE DELAI DU ENGINE (600 s) : au-dela, le tool est TUE, pas attendu."
  478: "LE SOMMEIL LONG SE FAIT PAR REPETITION, jamais en relevant le delai du engine."

SECTION : LES_PROCS
  500: "LES LOIS D'UN TOOL, TELLES QUE LE CODE LES TIENT."
  501: "Il FAIT UNE chose ; il REFUSE EN NOMMANT ; RIEN hors de sa portee ; IL LAISSE UNE LIGNE."
  502: "UN TOOL SILENCIEUX EST UN TOOL QUI N'EXISTE PAS."
  503: "OU VIT UN TOOL : sa COMMANDE est DANS LA LIGNE de la table (config/la_tools.yaml)."
  504: "En dash + jq + coreutils, et c'est LE ENGINE qui l'execute apres avoir valide."
  505: "Les scripts de la boucle vivent dans config/engine/, un par fonction."
  506: "VOULU : le corps d'un tool est un script a part ; la ligne ne porte que la commande."
  507: "CE QU'IL RECOIT : un objet JSON sur son ENTREE, les ARGUMENTS et rien d'autre."
  508: "Il se lit par jq, JAMAIS par le shell : aucun argument n'est du texte interprete."
  509: "CE QU'IL REND : une ligne JSON dans la FORME UNIQUE, construite par jq -cn."
  510: "Jamais a la main : un guillemet dans un nom de fichier ne doit pas casser un retour."
  511: "CE QU'IL SUPPOSE : la racine, nommee par une variable posee par le LANCEUR."
  512: "Le proc ne la DEVINE pas : vide, il REFUSE en la nommant."
  513: "CE QU'IL TOUCHE : un chemin d'argument est RELATIF A LA RACINE, jamais a la portee."
  514: "UNE SEULE BASE, la meme pour tous les tools."
  515: "La PORTEE est la CLOTURE : un chemin resolu qui en sort est refuse."
  516: "CE QUI L'EXECUTE : /bin/sh (dash), coreutils et jq, ET RIEN D'AUTRE."
  517: "Ni bash, ni python3 : un proc qui demande plus est deux procs."
  518: "UN PROC PEUT APPELER LA MACHINE : un service sur 127.0.0.1."
  519: "IL NE JOINT JAMAIS LE DEHORS : aucune adresse publique, aucun nom de domaine."
  520: "CE QU'IL SORT : toujours 0. C'est le JSON qui JUGE (status)."
  521: "Un code non nul veut dire que le proc s'est CASSE, pas qu'il a refuse."
  522: "LES CINQ VERIFICATIONS, TOUTES DETERMINISTES ET AVANT L'EFFET."
  523: "[1] LA PORTEE ; [2] LES BORNES ; [3] LA CIBLE ; [4] LES DROITS ; [5] LE MONTAGE."
  524: "LE ENGINE ET LE MANAGER SONT DEUX POSTES."
  525: "Le ENGINE valide, monte, execute et forme : il ne connait AUCUN secret, il n'ecrit rien."
  526: "Le MANAGER tient une SECTION de la racine, et il ecrit dedans."
  527: "UN PROC NE PEND PAS LA BOUCLE."

SECTION : LE_RETOUR_DES_OUTILS
  600: "LE RETOUR D'UN TOOL EST UNE DONNEE, PAS UN TEXTE."
  601: "LE RESULTAT EST BORNE PAR LE ENGINE, pas par le tool : 4000 octets et 200 lignes."
  602: "Ce qui depasse part dans un FICHIER DE DEBORDEMENT, et le fil ne porte que le CHEMIN."
  603: "UN TOOL QUI ECRIT UN FICHIER REND LE CHEMIN, jamais le contenu."
  604: "LES TROIS FORMES DU RETOUR, ET ELLES SE MESURENT."
  605: "[1] ENTIER ; [2] RESUME + CHEMIN ; [3] RIEN + CHEMIN, le resultat n'est plus utile."
  606: "Ce qui decide est LA MARGE DU TOUR, jamais le tool."
  607: "LE REFUS EST UN RETOUR COMME UN AUTRE."
  608: "CE QUE LE MODELE VOIT APRES UN TOOL EST UN FAIT."
  609: "L'HISTORIQUE DU TOUR EST ENVOYE DANS L'ORDRE, ET CET ORDRE EST L'ARCHITECTURE."
  610: "LE TOUR SE TRANSCRIT : chaque tool laisse UNE LIGNE horodatee, tool, arguments, statut."
  611: "LE RETOUR EST UNE PRISE, PAS UN DEPOT : le modele n'a pas besoin du fichier entier."
  612: "S'il en veut plus, il a le tool pour le lire."
  613: "UN TOOL LANCE N'EST JAMAIS PERDU : il rend TOUJOURS dans la meme forme."
  614: "Au-dela du delai, un refus NOMME ; s'il casse, la ligne dit que le script s'est casse."
  615: "LE RETOUR NE PORTE PAS D'INSTRUCTION : il dit ce qui est, pas ce qu'il faut faire."
  616: "LE TOOL TRAVAILLE EN ARRIERE-PLAN : la boucle le surveille, et PARLE toutes les 15 s."
  617: "UN LONG RUN N'EST PAS COUPE : le delai du engine est une MARGE, jamais un budget."
  618: "DANS LA MARGE, LE SENS ORDONNE : les plus utiles gardent le plus de place."

SECTION : LE_FILTRE
  700: "LE FILTRE EST LE skill.yaml : sa liste tools EST le perimetre."
  701: "LE PERIMETRE : le skill ACTIF ouvre ses tools, la PERMANENTE ajoute les siens."
