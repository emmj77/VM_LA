  1208: "L'ECRITURE EST ATOMIQUE : un temporaire, puis un renommage."
  1209: "Jamais une troncature en place : un fichier a moitie pose ne se distingue pas d'un faux."
  1210: "LA SUPPRESSION PASSE PAR LA CORBEILLE, le vidage est HUMAIN."
  1211: "LES LIENS N'EXISTENT PAS : un nom qui pointe ailleurs met une porte dans un mur."
  1212: "Deux copies, jamais un lien."
  1213: "UN SEUL ECRIVAIN A LA FOIS : la boucle tient le tour, le manager sa section."
  1214: "L'HORODATAGE VIENT DU PROC : une date produite par le modele est une valeur inventee."
  1215: "UN FICHIER ECRIT PORTE SON ENTETE : ce qu'il est, qui l'a ecrit, quand, par quel tool."
  1216: "LES CHEMINS SONT RELATIFS A LA RACINE, ET LEUR PORTEE LES BORNE."
  1217: "Pas d'absolu, pas de .., pas de motif : ce qui n'est pas nommable est INEXPRESSIBLE."
  1218: "ECRIRE DANS LA RACINE N'EST PAS ECRIRE DANS LE MONDE : la machine ne joint rien."
  1219: "Ce qui sort de la machine est un FICHIER."
  1220: "ON VERIFIE AVANT L'EFFET, PAS APRES."

  1221: "LE CAP JUGE LA LIGNE QU'ON ECRIT, PAS L'HERITAGE : l'ancien ne bloque pas le neuf."
  1222: "UNE ECRITURE REMPLACE, ELLE NE DOUBLE PAS : le meme id repose la meme ligne."
SECTION : LE_CONFINEMENT
  1300: "LA BARRIERE EST LE MONTAGE, PAS LE PERIMETRE."
  1301: "Le perimetre dit ce qui est ATTEIGNABLE ; le montage dit ce qui est POSSIBLE."
  1302: "Le premier cede avec une erreur ; le second tient meme quand le premier cede."
  1303: "LA OU LA MACHINE TOURNE EST LA CAGE : les registres et les dossiers systeme y sont montes."
  1304: "L'ecriture est OUVERTE la ou elle est LISTEE, et fermee partout ailleurs."
