  1306: "Les listes se tiennent ENSEMBLE, ou l'ecriture echoue sans explication."
  1307: "CE QUI ECRIT HORS DE LA CAGE RESTE HORS DE LA CAGE : l'editeur d'un projet, ses caches."
  1308: "C'est la SEULE voie d'ecriture sur ces projets, et elle est connue."
  1309: "Un projet ecrit des deux cotes se corrompt en silence."
  1310: "LA GARDE LIT L'EFFET, PAS LA FORME : guillemets, hexa, base64 et $IFS sont DEVOLES."
