  1126: "write_spec PORTE DEUX GESTES : une SECTION par son nom, une LOI par son NUMERO."
  1127: "set_law ECRIT UNE LOI, PAS DEUX, PAS LE FICHIER : elle se pose dans sa CENTAINE."
  1128: "ON N'ANCRE JAMAIS SUR LE NOM DE SECTION : le seul token fixe est 'SECTION : '."
  1129: "LE CHEMIN DU SPEC VOYAGE SOUS SPEC_FILE : ecraser SPEC perd le fichier, pas le tour."
  1130: "LES ADRESSES SONT TENUES PAR engine_switch.sh : list, puis take <alias>."
  1131: "LA CHAINE ANDROID VIT SOUS ~/Applications ; gradle assembleDebug rend l APK."
SECTION : LA_LOI_D_ECRITURE
  1200: "AUCUN TOOL N'EFFACE : le retrait passe par la CORBEILLE, un tool qui DEPLACE."
  1201: "Il n'y a pas de rm dans la table : pas de tool qui le porte."
  1202: "L'ECRITURE EST UNE CARTE, PAS UN DROIT : chaque tool ecrit SOUS SA RACINE."
  1203: "La table dit OU (la portee), le skill dit QUOI (le PERIMETER), la cloture verifie."
  1204: "LE SKILL ACTIF DECLARE LE REGISTRE D'ECRITURE : PERIMETER.workspace, et ses sous-dossiers."
  1205: "Le reste se LIT : les skills par skill_manage, la table par table_manage."
  1206: "LES TROIS MODES D'ECRITURE, ET RIEN DE PLUS : new, append, replace."
