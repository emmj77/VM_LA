  1037: "SANS RERANKER, LA BOUCLE S'ARRETE EN LE NOMMANT : un BUG DU MOTEUR, jamais un silence."
  1038: "LE CLASSEMENT PORTE SUR LES TOOLS MOUVANTS DU SKILL, jamais les permanents."
SECTION : LES_MANAGERS
  1100: "UN MANAGER N'EST PAS UN PROC : le proc VALIDE, MONTE, EXECUTE et FORME."
  1101: "Le manager TIENT une SECTION de la racine : il en est le seul ecrivain."
  1102: "Sa borne est la section elle-meme."
