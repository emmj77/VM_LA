  1428: "LE STT EST PARAKEET (NeMo-Speech.cpp) : il transcrit un audio court, il ne juge pas."
  1429: "MESURE : parakeet v3 q8_0, 60,4x le temps reel en CUDA (886 Mo VRAM), 7,0x en CPU, 64 s."
  1430: "LE MODE JARVIS NE DONNE AUCUN DROIT DE PLUS : un mode est une MECANIQUE."
  1431: "LE TOUR DE PAROLE A QUATRE ETATS, ILS SE DISENT : ecoute, travaille, parle, attend (ask)."
  1432: "LE WIDGET MONTRE CE QUE LA MACHINE DIT DEJA : il n'ajoute aucun canal."
  1433: "LA LIAISON EST DIRECTE : flux persistant entre le widget et le poste, sans intermediaire."
  1434: "LE WIDGET EST UNE SEULE VUE : la voix, la telemetrie du plan, le rendu des donnees."
  1435: "LA MACHINE TIENT DES SESSIONS LONGUES, d'une a deux heures, sans derive."

  1436: "LE TELEPHONE PORTE UN CLIENT NATIF : widget d ecran d accueil ET bulle."
  1437: "LE WIDGET NE TIENT PAS DE MICRO : il DECLENCHE ; la BULLE, elle, ecoute."
  1438: "LA BULLE EST UNE VRAIE FENETRE DU SYSTEME, pas une page du navigateur."
  1439: "L APP NATIVE N A PAS BESOIN DE HTTPS : c est une regle du WEB, pas du systeme."
  1440: "LE SERVICE PORTE LE TYPE microphone : Android 14 l exige pour le micro."
  1441: "LE TELEPHONE N ATTEINT LE POSTE QUE SUR LE MEME RESEAU : adresse privee, rien en 4G."
  1442: "L ADRESSE DU POSTE EST ECRITE EN DUR : une autre adresse de la box rend le widget muet."
  1443: "L APK SE PREND SUR LE POSTE, MEME RESEAU ; hors du reseau, le cable et adb."
  1444: "LE TUNNEL EST LE SEUL CHEMIN HORS RESEAU : 10.10.0.1, port 51820 ouvert sur la box."
  1445: "LA FACE TLS EST CELLE DU TELEPHONE ; le clair reste sur 127.0.0.1, rien n est ouvert."
  1446: "LE CABLE DE LA VOIX EST VERIFIE : vits-model, vits-tokens, vits-data-dir, sid."
  1447: "LA VOIX ET L OREILLE SONT DES SERVICES RESIDENTS : la-tts.service et la-asr.service."
  1448: "LE CONTRAT DE LA VOIX : speech : config/audio/<nom> (N Ko, T s) ; le pont la lit."
  1449: "LE NIVEAU SE REGLE A LA CRETE : -1,5 dBFS, gain borne a 4 (MESURE sur voix humaine)."
  1450: "MESURE : Piper upmc dit 8,7 s de parole en moins d une seconde, modele charge."
  1451: "LA VOIX DU TOUR S ENTEND AU FIL DE L EAU : le pont publie les wav sous /spoken."
  1452: "LE PREMIER SON ARRIVE AVEC LE PREMIER MOT DIT : l appli n attend plus la fin du tour."
  1453: "LE STREAMING DANS LA VOIX RESTE A FAIRE : l oreille n ecrit pas encore en lisant."
SECTION : LE_MODELE
  1500: "UNE SEULE ADRESSE DE ENGINE EST ACTIVE A LA FOIS, et elle est declaree dans la machine."
  1501: "LE MODELE NE SE CHOISIT PAS AU MOMENT DE L'APPEL."
  1502: "LE MODELE REND DU TEXTE ET DES APPELS DE TOOL."
  1503: "Il ne connait NI le chemin, NI la commande : ils viennent du harness."
  1504: "Il ne voit que ce qui a ete BORNE pour lui."
  1505: "TROIS ETAGES : un classifieur, un modele de structure, un modele principal."
  1506: "Chaque etage fait ce que les autres font mal."
  1507: "LES ETAGES LEGERS TOURNENT SUR LE CPU et ne prennent pas la place du principal."
  1508: "Les legers sont LOCAUX par construction : ils doivent repondre sans reseau."
  1509: "LE MODELE PRINCIPAL PASSE PAR UNE ADRESSE : il n'est PAS sur une carte de la machine."
  1510: "Toute architecture qui suppose l'inference locale du principal est FAUSSE."
  1511: "LE HARNAIS PEUT NE PRESENTER QU'UN SEUL TOOL : le modele n'a aucun moyen de divaguer."
  1512: "Ce qu'on masque n'a pas besoin d'etre refuse : il n'existe pas dans le tour."
  1513: "LE MODELE NE REMPLIT PAS CE QUE LE HARNAIS SAIT REMPLIR."
  1514: "UN ENGINE PEUT CHARGER SON MODELE : c'est un ETAT, pas une panne."
  1515: "La boucle repose la MEME question et ne consomme pas un tour de la tache."
  1516: "LE MODELE QUI ECHOUE SE DIT : une erreur du engine arrete le tour EN LA NOMMANT."
  1517: "LA QUALITE D'UN MODELE SE MESURE, ELLE NE SE CROIT PAS."
  1518: "Sa vitesse, sa tenue d'un schema, la fidelite d'un resume : une MESURE, avec la DATE."
  1519: "LE TRAVAIL LOURD RESTE AU PRINCIPAL, LA PLOMBERIE AU LOCAL."
  1520: "Inverser les deux, et on paie le lourd au prix du lourd pour faire du leger."
  1521: "LE MICRO-MODELE EST UN TRAVAILLEUR EPHEMERE : instancie pour UNE mission, purge aussitot."
  1522: "Aucun etat persistant : c'est ce qui garantit zero derive de contexte."
  1523: "SES POIDS SONT TERNAIRES (-1, 0, +1) : des additions a la place des multiplications."
  1524: "Le CPU suffit, et il ne prend JAMAIS la place de la carte graphique."
  1525: "Sa taille vise UN A TROIS MILLIARDS : de quoi resumer, trop peu pour divaguer."
  1526: "IL PORTE UN HEAD MINIMAL : le contexte, son role, et le schema de son SEUL tool."
  1527: "TROIS TOOLS AU PLUS, UN SEUL SCHEMA : une action, puis la remise a zero."
  1528: "SES MISSIONS SONT UNITAIRES : tenir le fichier de session, refaire le micro-resume."
  1529: "Et condenser les donnees brutes d'un tool quand sa sortie n'est que du bruit de forme."
  1530: "UNE CONDENSATION QUI HALLUCINE EST PIRE QUE LE BRUIT : elle se mesure avant d'etre crue."
  1531: "LA MISSION EST ECRITE, PAS DEVINEE : un prompt de mission, et rien d'autre."
  1532: "LE CLASSIFIEUR EST fastText, PAS UN MICRO-LLM : un micro-modele ne tient pas."
  1533: "IL PROPOSE, LE ENGINE DECIDE : l'etat, le perimetre et le verrou ne sont pas des textes."
  1534: "LE SKILL DELIMITE LA PALETTE DES TOOLS ; le PERIMETER delimite L'ECRITURE."

  1535: "L'ETAGE DE VISION EST LOCAL ET LEGER : SmolVLM-256M, 831 Mo au repos, 1,4 s sur CPU."
  1536: "IL LIT L'ANGLAIS : une question posee en francais le fait divaguer."
  1537: "LE REPLI SE DECIDE COTE CLIENT, ET IL SE VOIT ; une panne reseau ne replie pas."
  1538: "LA VISION A TROIS VOIES : le petit (SmolVLM, CPU), le gros (cartes), et l API multimodale."
  1539: "see_image PREND small (CPU) ET big (cartes) ; big se demarre seul et refuse sans la place."
  1540: "LE COMPACTEUR EST LE 0.5B SUR LE CPU (8088) : 1,5 a 6 s pour 24 000 octets, 1 Go de RAM."
  1541: "LE MODELE LOCAL ECRIT APRES LA REPLY, JAMAIS DEVANT : devant, il paie sa latence."
  1542: "LE REPOS A DEUX SYSTEMES D JETABLES : le VOLONTAIRE et l'AUTOMATIQUE."
  1543: "LE VOLONTAIRE : le modele appelle le sommeil, et le retour du systeme revient A LUI."
  1544: "L'AUTOMATIQUE : answer l'ARME ; son retour va AU JUGE, jamais a l'agent."
  1545: "LA VEILLE ARMEE PAR answer VIT AU PONT : un tour meurt, le pont vit."
  1546: "LE JUGE EST LE VEILLEUR : une entree, DEUX SORTIES convenues, reveiller ou dormir."
  1547: "SON ETAGE EST LE RERANKER : il NOTE les deux sorties, il n'en INVENTE aucune."
  1548: "IL JUGE LE REVEIL, JAMAIS L'ARRET : l'arret reste un COMPTE d'etapes (lois 382, 393)."
  1549: "IL PROPOSE, LE ENGINE DECIDE (loi 1533) ; un reveil ouvre une DEMANDE."
  1550: "UN REVEIL N'ELARGIT JAMAIS LE PERIMETRE DU REVEILLE."
  1551: "UN SEUL SYSTEME AUTOMATIQUE ARME PAR SESSION ; le plan est sa borne."
  1552: "CHAQUE VERDICT ECRIT UNE LIGNE : l'HEURE, l'EVENEMENT, la PROPOSITION, la DECISION."
  1553: "LES EVENEMENTS ADMIS SONT NOMMES : une liste fermee, jamais tout ce qui entre."

SECTION : LE_TRAVAIL
  1600: "UN CHEMIN D'ECRITURE EST RELATIF ET SE RESOUT SOUS LE REGISTRE DU SKILL ACTIF."
  1601: "Le modele ne choisit AUCUN chemin : il nomme une VALEUR."
  1602: "L'AGENT REMPLIT DES CHAMPS BORNES : il n'ecrit pas de texte libre dans les registres."
  1603: "Ce qui entre dans un document y entre en REMPLACANT une valeur."
  1604: "Un fichier qui grossit tout seul finit illisible."
  1605: "LA TRANSCRIPTION EST UN TOOL DE LA TABLE : l'audio entre, le texte sort."
  1606: "Le tour s'ecrit dans une session HORODATEE."
  1607: "Une session est un REGISTRE, pas un document."
  1608: "TOUT CE QUE L'AGENT ECRIT RESTE LISIBLE ET BORNE, et un refus se dit EN CLAIR."
  1609: "L'agent lit son propre refus et se corrige au tour suivant."
  1610: "APRES UN CHANTIER, LE RANGEMENT EST OBLIGATOIRE : ce qui a ete seme se range."
  1611: "Un travail non range n'est pas un travail fini."

SECTION : LA_MEMOIRE
  1700: "LA MEMOIRE GENERALE EST LE SEUL REGISTRE QUI TRAVERSE LES SESSIONS."
  1701: "Ce qui doit etre vrai dans un mois s'y ecrit par un TOOL ; le reste meurt avec la session."
  1702: "LA MEMOIRE VIT DANS UNE BASE : elle se LIT sous une question (search_memory)."
  1703: "Une memoire qui ne se cherche pas est un fichier que personne n'ouvre."
  1704: "DEUX DUREES, DEUX REGISTRES : le fait long en memoire, le fait du tour en session."
  1705: "Melanger les deux fait perdre le fait qui comptait."
  1706: "LA MEMOIRE EST ECRITE PAR L'AGENT, PAS PAR LE HARNAIS."
  1707: "Le harness FABRIQUE la forme, l'agent DIT le fait, la trace horodatee tranche."
  1708: "LE MODELE NE JUGE PAS LA MEMOIRE : aucun tool ne decide ce qui est important."
  1709: "C'est la FORME, un fait court, date, citable, qui rend la memoire utile."
  1710: "UN FAIT SE RETIRE AUSSI : un fait faux est pire qu'un fait absent."
  1711: "CE QUI N'EST PAS DANS LA MEMOIRE SE REDEMANDE."
  1712: "LA SESSION SE TRANSCRIT : chaque tour laisse ses lignes (le tool, ses arguments, l'heure)."
  1713: "sessions.yaml EST L'INDEX QUE LIT LE MICRO-MODELE : une entree par session."
  1714: "Assez pour CHOISIR une session, jamais assez pour la relire : le sommaire, pas le livre."
  1715: "sessions.db EST LE CORPS, sessions.yaml EST LA TABLE."
  1716: "LE MICRO-MODELE ECRIT LES DEUX RESUMES : sessions.yaml et le head secondaire."

  1717: "sessions.yaml PORTE L ECHANGE COMPACTE : l heure, deux lignes chacun, rien de plus."
SECTION : LA_CONFORMITE
  1800: "LE CANON EST spec.yaml, ET IL SE CONTROLE : la forme et l'empreinte, par une PASSE."
  1801: "Cette passe est un PROC sh, lance, jamais suppose."
  1802: "VOULU : la passe est posee, et elle lit l'arborescence REELLE ; USER.md vit sous config/."
  1803: "L'OBSOLETE SE SUPPRIME, IL NE S'ANNOTE PAS : un renvoi mort se retire du corpus."
  1804: "Le 'pour memoire' est ce qui rend un corpus illisible."
  1805: "UNE REGLE S'ECRIT DANS LE LIEU QUI LA TIENT."
  1806: "Une regle tenue par un script s'ecrit dans le script ; par une mesure, avec sa mesure."
  1807: "Une regle qui ne tient nulle part ne s'ecrit pas."
  1808: "LE CORPUS SE LIT DANS CET ORDRE : spec.yaml pour L'ARCHITECTURE et ses bornes."
  1809: "Puis les scripts pour le DETAIL."
  1810: "Deux lieux se contredisent, le SCRIPT dit vrai sur le present, la PAROLE sur l'intention."
  1811: "UN COMPTE SE PERIME, UNE BORNE SE TIENT : ce fichier ne porte pas d'inventaire."
  1812: "Il porte des PLAFONDS, des SEUILS et des TEMPS, tenus par un script."
  1813: "LA SPEC NE MENT PAS SUR SON PROPRE ETAT : le PRESENT est dans le code."
  1814: "Ce qui est VOULU porte sa CONDITION."
  1815: "LE VOCABULAIRE TECHNIQUE EST L ANGLAIS : tool, skill, plan, log. Aucun synonyme francais."
