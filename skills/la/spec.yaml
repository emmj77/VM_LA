  1026: "Un champ sans producteur est ecrit EN CLAIR dans le template."
  1027: "CHARGER UNE SKILL CHANGE LA PALETTE ; la LIRE ne la charge pas."
  1028: "La porte se ferme aussi par la TABLE : une ligne desactivee n'existe pas pour ce tour."
  1029: "UNE CATEGORIE PERMANENTE RESTE APPARENTE, meme sous contrainte."
  1030: "UN SKILL QUI N'OUVRE AUCUN TOOL PORTE TOOLS: VIDE : le modele n'a aucun tool a nommer."
  1031: "C'est un ETAT, pas une erreur."

  1032: "UNE LIGNE S'ECRIT PAR SON ID : set_line pose UNE ligne de skill.yaml, et remplace."
