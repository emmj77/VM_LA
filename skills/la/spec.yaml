  1116: "LE MANAGER VERIFIE LA FORME, PAS LE FOND : il ne juge pas si le skill est BON."
  1117: "UN MANAGER NE TOUCHE PAS AUX AUTRES SECTIONS : la portee ne voyage pas avec les arguments."
  1118: "LA MEMOIRE A DEUX TOOLS PARCE QU'ELLE A DEUX DUREES : add_memory, remove_memory."
  1119: "search_memory LIT sous une question ; ce qui est vrai d'un tour ne va pas dans la memoire."
  1123: "LE NOTE AJOUTE UNE ligne horodatee a une section de notes : pas d'objet a modeliser."
  1124: "LE MANAGER LAISSE UNE TRACE HORODATEE, ET C'EST ELLE QUI TRANCHE."
