  1016: "LE SKILL S'ECRIT PAR CHAMPS, JAMAIS LIBREMENT : un tool ecrit UNE section PAR SON NOM."
  1017: "Le corps vient du TEMPLATE, l'emplacement est fixe, la date est posee par le proc."
  1018: "Ce que le modele fournit tient entre des accolades."
  1019: "L'ID N'EST PAS LA POSITION, ET C'EST LA RAISON DU FORMAT."
  1020: "Une LISTE se designe par son rang ; une TABLE, par un nom : inserer ne deplace rien."
  1021: "LA PROPRIETE EST UNE POLITIQUE, PAS UNE PREUVE : source dit qui a le DROIT d'ecrire."
  1022: "Un skill de l'humain est en LECTURE SEULE pour l'agent."
  1023: "Le FAIT est tenu a cote : le proc laisse sa ligne horodatee, et c'est ELLE qui tranche."
  1024: "LES TOOLS SENSIBLES PASSENT PAR UNE APPROBATION ; le DEFAUT dans le doute est le REFUS."
