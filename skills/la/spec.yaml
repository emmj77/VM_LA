  906: "LE PLAN EST GOAL-BASED, ET C'EST LUI QUI ARRETE."
  907: "UN PLAN SE FERME, IL NE S'EVAPORE PAS."
  908: "LE PLAN EST LE PREMIER PERIMETRE."
  909: "LE PLAN NE DOUBLE PAS LA SKILL."
  910: "LA TACHE COURTE N'A PAS DE PLAN."
