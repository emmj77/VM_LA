  1312: "Un tube vers un interpreteur et un HTTP brut vers un port d'editeur sont refuses."
  1313: "LA GARDE ELLE-MEME EST HORS D'ATTEINTE : elle appartient a la machine, pas a l'agent."
  1314: "L'agent ne la reecrit pas, sinon elle suit la mode du jour."
  1315: "UN TOOL QUI REFUSE LE FAIT EN NOMMANT LA RAISON, jamais en silence."
  1316: "Un refus muet est un bug deguise en permission."

