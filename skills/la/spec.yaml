SECTION : LE_SKILL
  1000: "L'ORDRE NE S'INVERSE PAS : load_skill ; load_doc ; PUIS LE PLAN ; PUIS LES TOOLS."
  1001: "UNE SEULE SKILL ACTIVE : son nom vit dans la CONFIG des skills, jamais dans un lien."
