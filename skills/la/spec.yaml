  1108: "UN MANAGER ECRIT PAR APPROBATION QUAND LE TOOL EST SENSIBLE : il GELE, demande."
  1109: "Le DEFAUT, dans le doute, est le REFUS."
  1110: "UN MANAGER NE CREE PAS L'ARBORESCENCE : la section qu'il tient EXISTE DEJA."
