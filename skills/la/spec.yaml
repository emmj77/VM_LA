  1004: "LA DOC OBLIGATOIRE SE LIT AVANT LE TOOL SENSIBLE : requires_tool NOMME le tool prealable."
  1005: "Le HARNAIS REDUIT le perimetre A CE SEUL TOOL ; l'appel fait, il redevient celui du skill."
