  805: "LE HEAD REFUSE EN NOMMANT."
  806: "LE HEAD PORTE L'ADN, EN SECTIONS."
  807: "LE HEAD SECONDAIRE EST LA COUCHE DE L'ETAT, rebatie a chaque tour."
  808: "LE RESUME A SA PLACE, ET CETTE PLACE EST BORNEE."
  809: "LES VINGT DERNIERS ECHANGES RESTENT DANS LE CONTEXTE ACTIF, BRUTS."
  810: "LES DIX ECHANGES QUI SORTENT SONT RESUMES."
  811: "LE MICRO-MODELE EST UN MODELE LOCAL, SUR LE CPU."
  812: "LE RESUME A UNE BORNE DECLAREE, TENUE PAR LE SCRIPT."
  813: "UN RESUME VIENT DU MODELE, OU IL N'Y A PAS DE RESUME."
  814: "LE MICRO-MODELE EST UN TRAVAILLEUR EPHEMERE, SANS ETAT."
  815: "LA CONVERSATION DU MICRO-MODELE EST CONTRAINTE, PAS LIBRE."
  816: "CE QUE LE MICRO-MODELE RETIENT SE MESURE, il ne se croit pas."
  817: "CE QU'IL REFUSE SE MESURE AUSSI."
  818: "LA MEMOIRE EST A DEUX VITESSES, ET ELLE EST ECRITE."
  819: "L'ECONOMIE DE SORTIE EST UNE LOI."
  820: "LES BORNES DU CONTEXTE SE DECLARENT."
  821: "LA FENETRE EST DECLAREE EN CHIFFRES, pas devinee."
