skill: "web-agent"
date: "2026-10-20"
tags: ["web", "agent-browser", "gemini", "image", "lecture"]

SUMMARY:
  101: "Lire une page, generer une image sur Gemini : c'est agent-browser qui pilote Chromium, pas un moteur maison."
  102: "Un outil LA est un YAML qui passe par le moteur au shell : aucun .sh, aucun .py, jamais."
  103: "Le profil Chromium de Moussa porte sa session Google : pas de connexion a refaire, pas de profil a recopier."
  104: "Les references [ref=eN] meurent a chaque nouveau snapshot : une lecture, puis une action, jamais deux."
  105: "Le moteur coupe a 200 lignes et 4000 octets : un outil qui rend du texte s'arrete a 180 lignes."
  106: "Frappe : touche par touche, un mot a la fois, pauses irregulieres — inserttext (collage) se voit et fait sonner l'antibot."
  107: "Headless passe sur ChatGPT et DeepSeek, a condition de lancer chromium --headless=new avec --user-agent d'un vrai Chrome : c'est la chaine « HeadlessChrome » et webdriver=true qui font echouer l'antibot, pas l'absence d'ecran."
  108: "Un captcha, lui, ne se resout pas sans ecran : si un jour il en apparait un, il faudra la fenetre visible."
  111: "Le navigateur integre d'agent-browser annonce webdriver=true et « HeadlessChrome » : tout captcha echoue. On lance /usr/bin/chromium --remote-debugging-port=9222 sur le profil persistant et on s'y raccroche avec --cdp 9222."
  109: "dash n'a pas $RANDOM : l'entropie des pauses de frappe vient de od -An -N1 -tu1 /dev/urandom."
  110: "ChatGPT est derriere Cloudflare : en headless la page reste sur « Just a moment ». On travaille en fenetre reelle sur :99."
  112: "Piege mesure : --download-path rend 0 fichier. Sans ce drapeau, le fichier arrive sous un identifiant dans le dossier de la cible, et la commande sort en erreur meme quand elle a reussi."

PERIMETER:
  workspace: "work/"
  type-file: ".jpg .png .webp .md .txt"

ERROR:
  600: "Gemini sans image, agent-browser absent, page injoignable : le dire avec la raison, ne pas reessayer a l'aveugle."

