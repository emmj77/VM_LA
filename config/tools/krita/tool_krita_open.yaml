# QUI : ouvre un dessin DANS Krita (le document sur lequel travaillent tous les autres outils Krita).
# REFUSE : (1) le dessin absent ; (2) un format que Krita n'ouvre pas ; (3) la machine muette.
# ORIGINE : ecrit le 2026-10-17.
tool: "krita_open"
date: "2026-10-17"
tags: ["krita", "krita_open"]

doc: krita

RULES:
  enabled: true
  timeout: 120

DESCRIPTION: "opens a drawing in Krita and reports its size"

COMMAND: |
  SERVICE=http://127.0.0.1:5678
  curl -sf --max-time 10 "$SERVICE/health" >/dev/null 2>&1 \
    || { printf "refuse : la machine Krita ne repond pas sur %s (le plugin kritamcp s'ouvre avec Krita ouverte)\n" "$SERVICE" >&2; exit 1; }
  SRC="$W/{{source}}"
  [ -f "$SRC" ] || { printf "refuse : le dessin est absent (%s)\n" "$SRC" >&2; exit 1; }
  case "$SRC" in
    *.kra|*.krz|*.png|*.jpg|*.jpeg) ;;
    *) printf "refuse : Krita n'ouvre pas ca (%s)\n" "$SRC" >&2; exit 1 ;;
  esac
  REP=$(curl -sS --max-time 60 -H 'Content-Type: application/json' -d "$(jq -cn --arg p "$SRC" '{action:"open_file",params:{path:$p}}')" "$SERVICE/")
  printf '%s' "$REP" | jq -e '.status == "ok"' >/dev/null 2>&1 \
    || { printf "refuse : %s\n" "$(printf '%s' "$REP" | jq -r '.error.message // "reponse illisible de la machine"')" >&2; exit 1; }
  printf 'ouvert : %s (%s x %s)\n' "$(printf '%s' "$REP" | jq -r .path)" "$(printf '%s' "$REP" | jq -r .width)" "$(printf '%s' "$REP" | jq -r .height)"

ARGS:
  - {name: source, type: path}                 # le dessin, relatif a l'espace du skill
