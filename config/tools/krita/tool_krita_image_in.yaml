# QUI : pose une image dans un calque NEUF du document ouvert. C'est le geste qui manquait au plugin :
#   sans lui, une image produite par la machine du dessin ne pouvait jamais rentrer dans un .kra.
#   Le verbe vient d'une GRAFFE dans kritamcp (import_image), faite le 2026-10-17.
# REFUSE : (1) l'image absente ou illisible ; (2) la machine muette ; (3) la machine trop vieille
#   pour porter le geste (elle le dit : « Unknown action »).
# ORIGINE : ecrit le 2026-10-17.
tool: "krita_image_in"
date: "2026-10-17"
tags: ["krita", "krita_image_in"]

doc: krita

RULES:
  enabled: true
  timeout: 300

DESCRIPTION: "puts an image into a new layer of the open document"

COMMAND: |
  SERVICE=http://127.0.0.1:5678
  curl -sf --max-time 10 "$SERVICE/health" >/dev/null 2>&1 \
    || { printf "refuse : la machine Krita ne repond pas sur %s (le plugin kritamcp s'ouvre avec Krita ouverte)\n" "$SERVICE" >&2; exit 1; }
  IMAGE="$W/{{image}}"
  [ -f "$IMAGE" ] || { printf "refuse : l'image est absente (%s)\n" "$IMAGE" >&2; exit 1; }
  NOM="{{name}}"
  [ -n "$NOM" ] || NOM=$(basename "$IMAGE")
  REP=$(curl -sS --max-time 240 -H 'Content-Type: application/json' \
    -d "$(jq -cn --arg p "$IMAGE" --arg n "$NOM" '{action:"import_image",params:{path:$p,name:$n}}')" "$SERVICE/")
  printf '%s' "$REP" | jq -e '.status == "ok"' >/dev/null 2>&1 \
    || { printf "refuse : %s\n" "$(printf '%s' "$REP" | jq -r '.error.message // "reponse illisible de la machine"')" >&2; exit 1; }
  printf 'calque %s : image posee (%s x %s)\n' "$NOM" "$(printf '%s' "$REP" | jq -r .width)" "$(printf '%s' "$REP" | jq -r .height)"

ARGS:
  - {name: image, type: path}                 # l'image, relative a l'espace du skill
  - {name: name, type: text}                  # le nom du calque neuf (vide : le nom du fichier)
