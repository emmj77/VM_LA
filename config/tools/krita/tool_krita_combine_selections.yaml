tool: "krita_combine_selections"
date: "2026-10-18"
tags: ["krita", "krita_combine_selections"]
doc: krita
RULES:
  enabled: true
  timeout: 60
DESCRIPTION: "Combine the active selection with a second selection loaded from a mask file"
COMMAND: |
  SERVICE=$(dash "$ROOT/config/engine/engine.sh" carrier krita-url) || exit 1
  num() { case "$1" in ''|*[!0-9.-]*) printf 'null' ;; *) printf '%s' "$1" ;; esac; }
  tab() { case "$1" in '') printf 'null' ;; *) printf '%s' "$1" | jq -c . 2>/dev/null || printf 'null' ;; esac; }

  D=$(jq -cn \
    --arg operation "{{operation}}" \
    --arg mask_path "{{mask_path}}" \
    '{action:"combine_selections", params:({ operation:$operation, mask_path:$mask_path } | with_entries(select(.value != null and .value != "")))}')
  REP=$(curl -sS --max-time 60 -H 'Content-Type: application/json' -d "$D" "$SERVICE/")
  printf '%s' "$REP" | jq -e '.status == "ok"' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$REP" | jq -r '.error.message // "reponse illisible de la machine"')" >&2; exit 1; }
  printf '%s\n' "$(printf '%s' "$REP" | jq -c .)"

ARGS:
  - {name: operation, type: text}
  - {name: mask_path, type: text}
