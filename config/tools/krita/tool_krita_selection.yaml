tool: "krita_selection"
date: "2026-10-17"
tags: ["krita", "krita_selection"]
doc: krita
RULES:
  enabled: true
  timeout: 220
DESCRIPTION: "acts on the current selection: grow, shrink, border, invert, or none"
COMMAND: |
  SERVICE=$(dash "$ROOT/config/engine/engine.sh" carrier krita-url) || exit 1
  WHAT="{{what}}"; PX="{{pixels}}"
  case "$WHAT" in
    none)   D='{"action":"deselect","params":{}}' ;;
    invert) D='{"action":"invert_selection","params":{}}' ;;
    grow|shrink|border)
      case "$PX" in ''|*[!0-9]*) printf '%s\n' "$(msg number_pixels_required)""$PX" >&2; exit 1 ;; esac
      D=$(jq -cn --argjson p "$PX" --arg q "$WHAT" '{action:($q + "_selection"),params:{pixels:$p}}') ;;
    *) printf '%s\n' "$(msg op_must_be_grow)""$WHAT" >&2; exit 1 ;;
  esac
  REP=$(curl -sS --max-time 90 -H 'Content-Type: application/json' -d "$D" "$SERVICE/")
  printf '%s' "$REP" | jq -e '.status == "ok"' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$REP" | jq -r '.error.message // "reponse illisible de la machine"')" >&2; exit 1; }
  printf 'selection : %s\n' "$(printf '%s' "$REP" | jq -c .)"

ARGS:
  - {name: what, type: enum, values: [grow, shrink, border, invert, none]}   # ce qu'on lui fait
  - {name: pixels, type: int}                 # pour grow / shrink / border
