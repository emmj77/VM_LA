tool: "krita_layer_new"
date: "2026-10-17"
tags: ["krita", "krita_layer_new"]
doc: krita
RULES:
  enabled: true
  timeout: 90
DESCRIPTION: "creates a paint layer in the open document, with the given name"
COMMAND: |
  SERVICE=$(dash "$ROOT/config/engine/engine.sh" carrier krita-url) || exit 1
  NAME="{{name}}"
  [ -n "$NAME" ] || { printf '%s\n' "$(msg layer_name_required)" >&2; exit 1; }
  REP=$(curl -sS --max-time 60 -H 'Content-Type: application/json' -d "$(jq -cn --arg n "$NAME" '{action:"create_layer",params:{name:$n}}')" "$SERVICE/")
  printf '%s' "$REP" | jq -e '.status == "ok"' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$REP" | jq -r '.error.message // "reponse illisible de la machine"')" >&2; exit 1; }
  printf '%s\n' "$(msg layer)""$NAME"

ARGS:
  - {name: name, type: text}                   # le nom du calque (obligatoire)
