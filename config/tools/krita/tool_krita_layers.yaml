# QUI : la pile de calques du document ouvert dans Krita. Aucun fichier touche : c'est un regard.
# REFUSE : aucun document ouvert, ou la machine muette -- dit, nomme.
# ORIGINE : ecrit le 2026-10-17.
tool: "krita_layers"
date: "2026-10-17"
tags: ["krita", "krita_layers"]

doc: krita

RULES:
  enabled: true
  timeout: 40

DESCRIPTION: "lists the layers of the document Krita has open (name, type, visibility, opacity)"

COMMAND: |
  SERVICE=http://127.0.0.1:5678
  curl -sf --max-time 10 "$SERVICE/health" >/dev/null 2>&1 \
    || { printf "refuse : la machine Krita ne repond pas sur %s (le plugin kritamcp s'ouvre avec Krita ouverte)\n" "$SERVICE" >&2; exit 1; }
  REP=$(curl -sS --max-time 60 -H 'Content-Type: application/json' -d "$(jq -cn "{\"action\":\"list_layers\",\"params\":{}}")" "$SERVICE/")
  printf '%s' "$REP" | jq -e '.status == "ok"' >/dev/null 2>&1 \
    || { printf "refuse : %s\n" "$(printf '%s' "$REP" | jq -r '.error.message // "reponse illisible de la machine"')" >&2; exit 1; }
  printf '%s' "$REP" | jq -r '.layers[] | "  " + .name + "  " + .type + "  visible=" + (.visible|tostring) + "  opacity=" + (.opacity|tostring)'
  printf '  (%s calque(s))\n' "$(printf '%s' "$REP" | jq -r .count)"

ARGS:
ARGS: []                    # aucun argument : ce tool se nomme seul
