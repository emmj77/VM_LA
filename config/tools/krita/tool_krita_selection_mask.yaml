tool: "krita_selection_mask"
date: "2026-10-17"
tags: ["krita", "krita_selection_mask"]
doc: krita
RULES:
  enabled: true
  timeout: 400
DESCRIPTION: "loads a png mask as the current selection (white = selected), and can thicken it"
COMMAND: |
  SERVICE=$(dash "$ROOT/config/engine/engine.sh" carrier krita-url) || exit 1
  MASQUE="$W/{{mask}}"
  [ -f "$MASQUE" ] || { printf '%s\n' "$(msg mask_missing)""$MASQUE" >&2; exit 1; }
  case "$MASQUE" in *.png) ;; *) printf '%s\n' "$(msg mask_must_be_png)""$MASQUE" >&2; exit 1 ;; esac
  REP=$(curl -sS --max-time 240 -H 'Content-Type: application/json' -d "$(jq -cn --arg p "$MASQUE" '{action:"load_selection",params:{path:$p,format:"png"}}')" "$SERVICE/")
  printf '%s' "$REP" | jq -e '.status == "ok"' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$REP" | jq -r '.error.message // "reponse illisible de la machine"')" >&2; exit 1; }
  G="{{grow}}"
  case "$G" in ''|*[!0-9]*) ;; *)
    REP2=$(curl -sS --max-time 90 -H 'Content-Type: application/json' \
      -d "$(jq -cn --argjson p "$G" '{action:"grow_selection",params:{pixels:$p}}')" "$SERVICE/")
    printf 'epaissie de %s px : %s\n' "$G" "$(printf '%s' "$REP2" | jq -c .)" ;;
  esac
  printf '%s\n' "$(msg selection_set)""$MASQUE"

ARGS:
  - {name: mask, type: path}                   # le masque PNG, relatif a l'espace du skill
  - {name: grow, type: int}                    # l'epaissir de N pixels (vide : tel quel)
