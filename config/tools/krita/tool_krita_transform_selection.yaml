tool: "krita_transform_selection"
date: "2026-10-18"
tags: ["krita", "krita_transform_selection"]
doc: krita
RULES:
  enabled: true
  timeout: 180
DESCRIPTION: "Transform the current selection (move, rotate, scale)"
COMMAND: |
  SERVICE=$(dash "$ROOT/config/engine/engine.sh" carrier krita-url) || exit 1
  num() { case "$1" in ''|*[!0-9.-]*) printf 'null' ;; *) printf '%s' "$1" ;; esac; }
  tab() { case "$1" in '') printf 'null' ;; *) printf '%s' "$1" | jq -c . 2>/dev/null || printf 'null' ;; esac; }
  A_dx=$(num "{{dx}}")
  A_dy=$(num "{{dy}}")

  D=$(jq -cn \
    --argjson dx "$A_dx" \
    --argjson dy "$A_dy" \
    --arg angle "{{angle}}" \
    --arg scale_x "{{scale_x}}" \
    --arg scale_y "{{scale_y}}" \
    '{action:"transform_selection", params:({ dx:$dx, dy:$dy, angle:$angle, scale_x:$scale_x, scale_y:$scale_y } | with_entries(select(.value != null and .value != "")))}')
  REP=$(curl -sS --max-time 180 -H 'Content-Type: application/json' -d "$D" "$SERVICE/")
  printf '%s' "$REP" | jq -e '.status == "ok"' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$REP" | jq -r '.error.message // "reponse illisible de la machine"')" >&2; exit 1; }
  printf '%s\n' "$(printf '%s' "$REP" | jq -c .)"

ARGS:
  - {name: dx, type: int}
  - {name: dy, type: int}
  - {name: angle, type: text}
  - {name: scale_x, type: text}
  - {name: scale_y, type: text}
