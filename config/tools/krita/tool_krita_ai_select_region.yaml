tool: "krita_ai_select_region"
date: "2026-10-18"
tags: ["krita", "krita_ai_select_region"]
doc: krita
RULES:
  enabled: true
  timeout: 180
DESCRIPTION: "Select an existing region by index or by linked layer_id. Pass null/None to select root"
COMMAND: |
  SERVICE=$(dash "$ROOT/config/engine/engine.sh" carrier krita-url) || exit 1
  num() { case "$1" in ''|*[!0-9.-]*) printf 'null' ;; *) printf '%s' "$1" ;; esac; }
  tab() { case "$1" in '') printf 'null' ;; *) printf '%s' "$1" | jq -c . 2>/dev/null || printf 'null' ;; esac; }
  A_index=$(num "{{index}}")
  A_layer_id=$(num "{{layer_id}}")

  D=$(jq -cn \
    --argjson index "$A_index" \
    --argjson layer_id "$A_layer_id" \
    '{action:"ai_select_region", params:({ index:$index, layer_id:$layer_id } | with_entries(select(.value != null and .value != "")))}')
  REP=$(curl -sS --max-time 180 -H 'Content-Type: application/json' -d "$D" "$SERVICE/")
  printf '%s' "$REP" | jq -e '.status == "ok"' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$REP" | jq -r '.error.message // "reponse illisible de la machine"')" >&2; exit 1; }
  printf '%s\n' "$(printf '%s' "$REP" | jq -c .)"

ARGS:
  - {name: index, type: int}
  - {name: layer_id, type: int}
