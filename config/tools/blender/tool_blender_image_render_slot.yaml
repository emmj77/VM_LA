tool: "blender_image_render_slot"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a render slot of an image: add | clear | cycle | remove (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "image.{{op}}_render_slot" --arg "reverse={{reverse}}"
ARGS:
  - {name: op, type: enum, values: [add, clear, cycle, remove]}
  - {name: reverse, type: text}
