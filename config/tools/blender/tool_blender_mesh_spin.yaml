tool: "blender_mesh_spin"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Extrude selected vertices in a circle around the cursor in indicated viewport"
machine: blender
op: mesh.spin
ARGS:
  - {name: steps, type: int}
  - {name: dupli, type: text}          # true|false, vide pour ne rien poser
  - {name: angle, type: text}
  - {name: use_auto_merge, type: text}          # true|false, vide pour ne rien poser
  - {name: use_normal_flip, type: text}          # true|false, vide pour ne rien poser
  - {name: center, type: text}          # 3 valeurs separees par des virgules
  - {name: axis, type: text}          # 3 valeurs separees par des virgules

