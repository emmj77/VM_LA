tool: "blender_text_edit"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a text block: autocomplete | copy | delete | indent | indent_or_autocomplete | insert | line_break | move | move_select | paste | select_all | select_word | selection_set | unindent (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "text.{{op}}" --arg "type={{type}}" --arg "selection={{selection}}" --arg "text={{text}}"
ARGS:
  - {name: op, type: enum, values: [autocomplete, copy, delete, indent, indent_or_autocomplete, insert, line_break, move, move_select, paste, select_all, select_word, selection_set, unindent]}
  - {name: type, type: text}
  - {name: selection, type: text}
  - {name: text, type: text}
