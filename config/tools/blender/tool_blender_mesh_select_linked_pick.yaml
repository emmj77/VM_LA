tool: "blender_mesh_select_linked_pick"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "(De)select all vertices linked to the edge under the mouse cursor"
machine: blender
op: mesh.select_linked_pick
ARGS:
  - {name: deselect, type: text}          # true|false, vide pour ne rien poser
  - {name: delimit, type: text}          # un de : NORMAL | MATERIAL | SEAM | SHARP | UV
  - {name: object_index, type: int}
  - {name: index, type: int}

