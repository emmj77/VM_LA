tool: "blender_mesh_subdivide"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Subdivide selected edges"
machine: blender
op: mesh.subdivide
ARGS:
  - {name: number_cuts, type: int}
  - {name: smoothness, type: text}
  - {name: ngon, type: text}          # true|false, vide pour ne rien poser
  - {name: quadcorner, type: text}          # un de : INNERVERT | PATH | STRAIGHT_CUT | FAN
  - {name: fractal, type: text}
  - {name: fractal_along_normal, type: text}
  - {name: seed, type: int}

