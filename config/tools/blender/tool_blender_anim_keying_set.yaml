tool: "blender_anim_keying_set"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a keying set: active_set | add | export | path_add | path_remove | remove (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "anim.keying_set_{{op}}" --arg "filepath={{filepath}}" --arg "type={{type}}" --arg "filter_folder={{filter_folder}}" --arg "filter_python={{filter_python}}" --arg "filter_text={{filter_text}}"
ARGS:
  - {name: op, type: enum, values: [active_set, add, export, path_add, path_remove, remove]}
  - {name: filepath, type: text}
  - {name: type, type: text}
  - {name: filter_folder, type: text}
  - {name: filter_python, type: text}
  - {name: filter_text, type: text}
