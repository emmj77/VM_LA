tool: "blender_curves_create"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a new hair curve: add_bezier | add_circle | draw | pen (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "curves.{{op}}" --arg "align={{align}}" --arg "enter_editmode={{enter_editmode}}" --arg "location={{location}}" --arg "radius={{radius}}" --arg "rotation={{rotation}}" --arg "scale={{scale}}" --arg "bezier_as_nurbs={{bezier_as_nurbs}}" --arg "corner_angle={{corner_angle}}" --arg "cycle_handle_type={{cycle_handle_type}}" --arg "delete_point={{delete_point}}" --arg "deselect={{deselect}}" --arg "deselect_all={{deselect_all}}" --arg "error_threshold={{error_threshold}}" --arg "extend={{extend}}" --arg "extrude_handle={{extrude_handle}}" --arg "extrude_point={{extrude_point}}" --arg "fit_method={{fit_method}}" --arg "insert_point={{insert_point}}" --arg "is_curve_2d={{is_curve_2d}}" --arg "move_point={{move_point}}" --arg "move_segment={{move_segment}}" --arg "select_passthrough={{select_passthrough}}" --arg "select_point={{select_point}}" --arg "size={{size}}" --arg "stroke={{stroke}}" --arg "toggle={{toggle}}" --arg "use_cyclic={{use_cyclic}}" --arg "wait_for_input={{wait_for_input}}"
ARGS:
  - {name: op, type: enum, values: [add_bezier, add_circle, draw, pen]}
  - {name: align, type: text}
  - {name: enter_editmode, type: text}
  - {name: location, type: text}
  - {name: radius, type: text}
  - {name: rotation, type: text}
  - {name: scale, type: text}
  - {name: bezier_as_nurbs, type: text}
  - {name: corner_angle, type: text}
  - {name: cycle_handle_type, type: text}
  - {name: delete_point, type: text}
  - {name: deselect, type: text}
  - {name: deselect_all, type: text}
  - {name: error_threshold, type: text}
  - {name: extend, type: text}
  - {name: extrude_handle, type: text}
  - {name: extrude_point, type: text}
  - {name: fit_method, type: text}
  - {name: insert_point, type: text}
  - {name: is_curve_2d, type: text}
  - {name: move_point, type: text}
  - {name: move_segment, type: text}
  - {name: select_passthrough, type: text}
  - {name: select_point, type: text}
  - {name: size, type: text}
  - {name: stroke, type: text}
  - {name: toggle, type: text}
  - {name: use_cyclic, type: text}
  - {name: wait_for_input, type: text}
