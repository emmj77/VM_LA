tool: "blender_nla_tweakmode_enter"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Enter tweaking mode for the action referenced by the active strip to edit its keyframes"
machine: blender
op: nla.tweakmode_enter
ARGS:
  - {name: isolate_action, type: text}          # true|false, vide pour ne rien poser
  - {name: use_upper_stack_evaluation, type: text}          # true|false, vide pour ne rien poser

