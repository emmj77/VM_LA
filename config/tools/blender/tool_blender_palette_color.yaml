tool: "blender_palette_color"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a colour of a palette: add | delete | move (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "palette.color_{{op}}" --arg "type={{type}}"
ARGS:
  - {name: op, type: enum, values: [add, delete, move]}
  - {name: type, type: text}
