tool: "blender_paint_visibility_filter"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Edit the visibility of the current mesh"
machine: blender
op: paint.visibility_filter
ARGS:
  - {name: action, type: text}          # un de : GROW | SHRINK
  - {name: iterations, type: int}
  - {name: auto_iteration_count, type: text}          # true|false, vide pour ne rien poser

