tool: "blender_view3d_select_circle"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Select items using circle selection"
machine: blender
op: view3d.select_circle
ARGS:
  - {name: x, type: int}
  - {name: y, type: int}
  - {name: radius, type: int}
  - {name: wait_for_input, type: text}          # true|false, vide pour ne rien poser
  - {name: mode, type: text}          # un de : SET | ADD | SUB

