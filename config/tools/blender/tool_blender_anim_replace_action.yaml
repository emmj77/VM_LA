tool: "blender_anim_replace_action"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Swap all users of one action to another one. The normal action slot assignment rules apply. This ignores the NLA and Action Constraints"
machine: blender
op: anim.replace_action
ARGS:
  - {name: old_session_uid, type: int}
  - {name: new_session_uid, type: int}

