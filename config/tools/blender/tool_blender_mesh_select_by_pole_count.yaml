tool: "blender_mesh_select_by_pole_count"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Select vertices at poles by the number of connected edges. In edge and face mode the geometry connected to the vertices is selected"
machine: blender
op: mesh.select_by_pole_count
ARGS:
  - {name: pole_count, type: int}
  - {name: type, type: text}          # un de : LESS | EQUAL | GREATER | NOTEQUAL
  - {name: extend, type: text}          # true|false, vide pour ne rien poser
  - {name: exclude_nonmanifold, type: text}          # true|false, vide pour ne rien poser

