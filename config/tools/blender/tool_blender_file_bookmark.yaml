tool: "blender_file_bookmark"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a bookmark of the file browser: add | cleanup | delete | move (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "file.bookmark_{{op}}" --arg "direction={{direction}}" --arg "index={{index}}"
ARGS:
  - {name: op, type: enum, values: [add, cleanup, delete, move]}
  - {name: direction, type: text}
  - {name: index, type: int}
