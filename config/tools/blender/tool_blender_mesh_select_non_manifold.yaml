tool: "blender_mesh_select_non_manifold"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Select all non-manifold vertices or edges"
machine: blender
op: mesh.select_non_manifold
ARGS:
  - {name: extend, type: text}          # true|false, vide pour ne rien poser
  - {name: use_wire, type: text}          # true|false, vide pour ne rien poser
  - {name: use_boundary, type: text}          # true|false, vide pour ne rien poser
  - {name: use_multi_face, type: text}          # true|false, vide pour ne rien poser
  - {name: use_non_contiguous, type: text}          # true|false, vide pour ne rien poser
  - {name: use_verts, type: text}          # true|false, vide pour ne rien poser

