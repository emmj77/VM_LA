tool: "blender_mesh_decimate"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Simplify geometry by collapsing edges"
machine: blender
op: mesh.decimate
ARGS:
  - {name: ratio, type: text}
  - {name: use_vertex_group, type: text}          # true|false, vide pour ne rien poser
  - {name: vertex_group_factor, type: text}
  - {name: invert_vertex_group, type: text}          # true|false, vide pour ne rien poser
  - {name: use_symmetry, type: text}          # true|false, vide pour ne rien poser
  - {name: symmetry_axis, type: text}          # un de : X | Y | Z

