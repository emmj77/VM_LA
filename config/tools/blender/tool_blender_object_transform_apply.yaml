tool: "blender_object_transform_apply"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Apply the object's transformation to its data"
machine: blender
op: object.transform_apply
ARGS:
  - {name: location, type: text}          # true|false, vide pour ne rien poser
  - {name: rotation, type: text}          # true|false, vide pour ne rien poser
  - {name: scale, type: text}          # true|false, vide pour ne rien poser
  - {name: properties, type: text}          # true|false, vide pour ne rien poser
  - {name: corrective_flip_normals, type: text}          # true|false, vide pour ne rien poser
  - {name: isolate_users, type: text}          # true|false, vide pour ne rien poser

