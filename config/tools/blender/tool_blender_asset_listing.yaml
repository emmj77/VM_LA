tool: "blender_asset_listing"
date: "2026-10-17"
tags: ["blender", "blender_asset_listing"]

doc: blender

RULES:
  enabled: true
  timeout: 600

DESCRIPTION: "manage asset library index files."

COMMAND: |
  env -u DISPLAY timeout 120 "$HOME/Applications/blender-5.2.2-linux-x64/blender" --background --factory-startup --command asset_listing </dev/null

ARGS: []                    # aucun argument : ce tool se nomme seul
