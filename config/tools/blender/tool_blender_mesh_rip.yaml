tool: "blender_mesh_rip"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Disconnect vertices or edges from connected geometry"
machine: blender
op: mesh.rip
ARGS:
  - {name: mirror, type: text}          # true|false, vide pour ne rien poser
  - {name: use_proportional_edit, type: text}          # true|false, vide pour ne rien poser
  - {name: proportional_edit_falloff, type: text}          # un de : SMOOTH | SPHERE | ROOT | INVERSE_SQUARE | SHARP | LINEAR | CONSTANT | RANDOM
  - {name: proportional_size, type: text}
  - {name: use_proportional_connected, type: text}          # true|false, vide pour ne rien poser
  - {name: use_proportional_projected, type: text}          # true|false, vide pour ne rien poser
  - {name: release_confirm, type: text}          # true|false, vide pour ne rien poser
  - {name: use_accurate, type: text}          # true|false, vide pour ne rien poser
  - {name: use_fill, type: text}          # true|false, vide pour ne rien poser

