tool: "blender_transform_modal"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a modal transform: bend | mirror | push_pull | resize | rotate | shear | shrink_fatten | tosphere | trackball | transform | translate | vertex_random | vertex_warp (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "transform.{{op}}" --arg "release_confirm={{release_confirm}}" --arg "use_accurate={{use_accurate}}" --arg "mirror={{mirror}}" --arg "proportional_edit_falloff={{proportional_edit_falloff}}" --arg "proportional_size={{proportional_size}}" --arg "snap={{snap}}" --arg "use_proportional_connected={{use_proportional_connected}}" --arg "use_proportional_edit={{use_proportional_edit}}" --arg "use_proportional_projected={{use_proportional_projected}}" --arg "gpencil_strokes={{gpencil_strokes}}" --arg "value={{value}}" --arg "center_override={{center_override}}" --arg "orient_matrix={{orient_matrix}}" --arg "orient_matrix_type={{orient_matrix_type}}" --arg "orient_type={{orient_type}}" --arg "constraint_axis={{constraint_axis}}" --arg "snap_elements={{snap_elements}}" --arg "snap_point={{snap_point}}" --arg "snap_target={{snap_target}}" --arg "use_snap_edit={{use_snap_edit}}" --arg "use_snap_nonedit={{use_snap_nonedit}}" --arg "use_snap_project={{use_snap_project}}" --arg "use_snap_selectable={{use_snap_selectable}}" --arg "use_snap_self={{use_snap_self}}" --arg "orient_axis={{orient_axis}}" --arg "remove_on_cancel={{remove_on_cancel}}" --arg "texture_space={{texture_space}}" --arg "use_duplicated_keyframes={{use_duplicated_keyframes}}" --arg "snap_align={{snap_align}}" --arg "snap_normal={{snap_normal}}" --arg "use_automerge_and_split={{use_automerge_and_split}}" --arg "angle={{angle}}" --arg "center={{center}}" --arg "cursor_transform={{cursor_transform}}" --arg "max={{max}}" --arg "min={{min}}" --arg "mode={{mode}}" --arg "mouse_dir_constraint={{mouse_dir_constraint}}" --arg "normal={{normal}}" --arg "offset={{offset}}" --arg "offset_angle={{offset_angle}}" --arg "orient_axis_ortho={{orient_axis_ortho}}" --arg "seed={{seed}}" --arg "translate_origin={{translate_origin}}" --arg "uniform={{uniform}}" --arg "use_even_offset={{use_even_offset}}" --arg "view2d_edge_pan={{view2d_edge_pan}}" --arg "viewmat={{viewmat}}" --arg "wait_for_input={{wait_for_input}}" --arg "warp_angle={{warp_angle}}"
ARGS:
  - {name: op, type: enum, values: [bend, mirror, push_pull, resize, rotate, shear, shrink_fatten, tosphere, trackball, transform, translate, vertex_random, vertex_warp]}
  - {name: release_confirm, type: text}
  - {name: use_accurate, type: text}
  - {name: mirror, type: text}
  - {name: proportional_edit_falloff, type: text}
  - {name: proportional_size, type: text}
  - {name: snap, type: text}
  - {name: use_proportional_connected, type: text}
  - {name: use_proportional_edit, type: text}
  - {name: use_proportional_projected, type: text}
  - {name: gpencil_strokes, type: text}
  - {name: value, type: text}
  - {name: center_override, type: text}
  - {name: orient_matrix, type: text}
  - {name: orient_matrix_type, type: text}
  - {name: orient_type, type: text}
  - {name: constraint_axis, type: text}
  - {name: snap_elements, type: text}
  - {name: snap_point, type: text}
  - {name: snap_target, type: text}
  - {name: use_snap_edit, type: text}
  - {name: use_snap_nonedit, type: text}
  - {name: use_snap_project, type: text}
  - {name: use_snap_selectable, type: text}
  - {name: use_snap_self, type: text}
  - {name: orient_axis, type: text}
  - {name: remove_on_cancel, type: text}
  - {name: texture_space, type: text}
  - {name: use_duplicated_keyframes, type: text}
  - {name: snap_align, type: text}
  - {name: snap_normal, type: text}
  - {name: use_automerge_and_split, type: text}
  - {name: angle, type: text}
  - {name: center, type: text}
  - {name: cursor_transform, type: text}
  - {name: max, type: text}
  - {name: min, type: text}
  - {name: mode, type: text}
  - {name: mouse_dir_constraint, type: text}
  - {name: normal, type: text}
  - {name: offset, type: text}
  - {name: offset_angle, type: text}
  - {name: orient_axis_ortho, type: text}
  - {name: seed, type: int}
  - {name: translate_origin, type: text}
  - {name: uniform, type: text}
  - {name: use_even_offset, type: text}
  - {name: view2d_edge_pan, type: text}
  - {name: viewmat, type: text}
  - {name: wait_for_input, type: text}
  - {name: warp_angle, type: text}
