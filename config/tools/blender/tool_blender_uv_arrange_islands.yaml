tool: "blender_uv_arrange_islands"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Arrange selected UV islands on a line"
machine: blender
op: uv.arrange_islands
ARGS:
  - {name: initial_position, type: text}          # un de : BOUNDING_BOX | UV_GRID | ACTIVE_UDIM | CURSOR
  - {name: axis, type: text}          # un de : X | Y
  - {name: align, type: text}          # un de : MIN | MAX | CENTER | NONE
  - {name: order, type: text}          # un de : LARGE_TO_SMALL | SMALL_TO_LARGE | Fixed
  - {name: margin, type: text}

