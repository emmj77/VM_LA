tool: "blender_view3d_snap"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "the 3D cursor or the selection: cursor_to_active | cursor_to_center | cursor_to_grid | cursor_to_selected | selected_to_active | selected_to_cursor | selected_to_grid (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "view3d.snap_{{op}}" --arg "use_offset={{use_offset}}" --arg "use_rotation={{use_rotation}}"
ARGS:
  - {name: op, type: enum, values: [cursor_to_active, cursor_to_center, cursor_to_grid, cursor_to_selected, selected_to_active, selected_to_cursor, selected_to_grid]}
  - {name: use_offset, type: text}
  - {name: use_rotation, type: text}
