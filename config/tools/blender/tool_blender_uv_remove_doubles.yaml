tool: "blender_uv_remove_doubles"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Selected UV vertices that are within a radius of each other are welded together"
machine: blender
op: uv.remove_doubles
ARGS:
  - {name: threshold, type: text}
  - {name: use_unselected, type: text}          # true|false, vide pour ne rien poser
  - {name: use_shared_vertex, type: text}          # true|false, vide pour ne rien poser

