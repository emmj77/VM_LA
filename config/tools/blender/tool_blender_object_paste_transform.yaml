tool: "blender_object_paste_transform"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Pastes the matrix from the clipboard to the currently active pose bone or object. Uses world-space matrices"
machine: blender
op: object.paste_transform
ARGS:
  - {name: method, type: text}          # un de : CURRENT | EXISTING_KEYS | BAKE
  - {name: bake_step, type: int}
  - {name: use_mirror, type: text}          # true|false, vide pour ne rien poser
  - {name: mirror_axis_loc, type: text}          # un de : x | y | z
  - {name: mirror_axis_rot, type: text}          # un de : x | y | z
  - {name: use_relative, type: text}          # true|false, vide pour ne rien poser

