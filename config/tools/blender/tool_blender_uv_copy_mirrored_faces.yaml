tool: "blender_uv_copy_mirrored_faces"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Copy mirror UV coordinates based on a mirrored mesh"
machine: blender
op: uv.copy_mirrored_faces
ARGS:
  - {name: mesh_axis, type: text}          # un de : POS_X | POS_Y | POS_Z | NEG_X | NEG_Y | NEG_Z
  - {name: uv_axis, type: text}          # un de : X | Y
  - {name: precision, type: int}

