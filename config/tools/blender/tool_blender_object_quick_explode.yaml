tool: "blender_object_quick_explode"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Make selected objects explode"
machine: blender
op: object.quick_explode
ARGS:
  - {name: style, type: text}          # un de : EXPLODE | BLEND
  - {name: amount, type: int}
  - {name: frame_duration, type: int}
  - {name: frame_start, type: int}
  - {name: frame_end, type: int}
  - {name: velocity, type: text}
  - {name: fade, type: text}          # true|false, vide pour ne rien poser

