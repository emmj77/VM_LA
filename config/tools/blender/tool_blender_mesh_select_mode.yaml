tool: "blender_mesh_select_mode"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Change selection mode"
machine: blender
op: mesh.select_mode
ARGS:
  - {name: use_extend, type: text}          # true|false, vide pour ne rien poser
  - {name: use_expand, type: text}          # true|false, vide pour ne rien poser
  - {name: type, type: text}          # un de : VERT | EDGE | FACE
  - {name: action, type: text}          # un de : DISABLE | ENABLE | TOGGLE

