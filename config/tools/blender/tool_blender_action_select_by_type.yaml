tool: "blender_action_select_by_type"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Select all keyframes of the given type"
machine: blender
op: action.select_by_type
ARGS:
  - {name: extend, type: text}          # true|false, vide pour ne rien poser
  - {name: type, type: text}          # un de : KEYFRAME | BREAKDOWN | MOVING_HOLD | EXTREME | JITTER | GENERATED

