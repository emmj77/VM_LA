tool: "blender_marker_select_mode"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "the selection of a timeline marker: all | box | leftright (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "marker.select_{{op}}" --arg "mode={{mode}}" --arg "action={{action}}" --arg "extend={{extend}}" --arg "tweak={{tweak}}" --arg "wait_for_input={{wait_for_input}}" --arg "xmax={{xmax}}" --arg "xmin={{xmin}}" --arg "ymax={{ymax}}" --arg "ymin={{ymin}}"
ARGS:
  - {name: op, type: enum, values: [all, box, leftright]}
  - {name: mode, type: text}
  - {name: action, type: text}
  - {name: extend, type: text}
  - {name: tweak, type: text}
  - {name: wait_for_input, type: text}
  - {name: xmax, type: int}
  - {name: xmin, type: int}
  - {name: ymax, type: int}
  - {name: ymin, type: int}
