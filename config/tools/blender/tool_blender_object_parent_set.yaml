tool: "blender_object_parent_set"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Set the object's parenting"
machine: blender
op: object.parent_set
ARGS:
  - {name: type, type: text}          # un de : OBJECT | ARMATURE | ARMATURE_NAME | ARMATURE_AUTO | ARMATURE_ENVELOPE | BONE | BONE_RELATIVE | CURVE | FOLLOW | PATH_CONST | LATTICE | VERTEX | VERTEX_TRI
  - {name: xmirror, type: text}          # true|false, vide pour ne rien poser
  - {name: keep_transform, type: text}          # true|false, vide pour ne rien poser

