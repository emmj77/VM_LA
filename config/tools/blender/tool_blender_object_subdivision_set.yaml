tool: "blender_object_subdivision_set"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Sets a Subdivision Surface level (1 to 5)"
machine: blender
op: object.subdivision_set
ARGS:
  - {name: level, type: int}
  - {name: relative, type: text}          # true|false, vide pour ne rien poser
  - {name: ensure_modifier, type: text}          # true|false, vide pour ne rien poser

