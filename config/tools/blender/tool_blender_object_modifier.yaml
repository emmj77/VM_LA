tool: "blender_object_modifier"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a modifier of an object: add | add_node_group | apply | apply_as_shapekey | convert | copy | copy_to_selected | move_down | move_to_index | move_up | remove | set_active (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "object.modifier_{{op}}" --arg "modifier={{modifier}}" --arg "use_selected_objects={{use_selected_objects}}" --arg "report={{report}}" --arg "all_keyframes={{all_keyframes}}" --arg "asset_library_identifier={{asset_library_identifier}}" --arg "asset_library_type={{asset_library_type}}" --arg "index={{index}}" --arg "keep_modifier={{keep_modifier}}" --arg "merge_customdata={{merge_customdata}}" --arg "relative_asset_identifier={{relative_asset_identifier}}" --arg "session_uid={{session_uid}}" --arg "single_user={{single_user}}" --arg "type={{type}}"
ARGS:
  - {name: op, type: enum, values: [add, add_node_group, apply, apply_as_shapekey, convert, copy, copy_to_selected, move_down, move_to_index, move_up, remove, set_active]}
  - {name: modifier, type: text}
  - {name: use_selected_objects, type: text}
  - {name: report, type: text}
  - {name: all_keyframes, type: text}
  - {name: asset_library_identifier, type: text}
  - {name: asset_library_type, type: text}
  - {name: index, type: int}
  - {name: keep_modifier, type: text}
  - {name: merge_customdata, type: text}
  - {name: relative_asset_identifier, type: text}
  - {name: session_uid, type: int}
  - {name: single_user, type: text}
  - {name: type, type: text}
