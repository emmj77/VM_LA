tool: "blender_outliner_select_box"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Use box selection to select tree elements"
machine: blender
op: outliner.select_box
ARGS:
  - {name: tweak, type: text}          # true|false, vide pour ne rien poser
  - {name: xmin, type: int}
  - {name: xmax, type: int}
  - {name: ymin, type: int}
  - {name: ymax, type: int}
  - {name: wait_for_input, type: text}          # true|false, vide pour ne rien poser
  - {name: mode, type: text}          # un de : SET | ADD | SUB

