tool: "blender_clip_tracks"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a motion-tracking track: average | clean | copy | filter | hide | join | lock | paste (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "clip.{{op}}_tracks" --arg "action={{action}}" --arg "error={{error}}" --arg "frames={{frames}}" --arg "keep_original={{keep_original}}" --arg "track_threshold={{track_threshold}}" --arg "unselected={{unselected}}"
ARGS:
  - {name: op, type: enum, values: [average, clean, copy, filter, hide, join, lock, paste]}
  - {name: action, type: text}
  - {name: error, type: text}
  - {name: frames, type: int}
  - {name: keep_original, type: text}
  - {name: track_threshold, type: text}
  - {name: unselected, type: text}
