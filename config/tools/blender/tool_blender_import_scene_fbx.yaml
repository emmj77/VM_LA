tool: "blender_import_scene_fbx"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Load a FBX file"
machine: blender
op: import_scene.fbx
ARGS:
  - {name: filepath, type: text}
  - {name: directory, type: text}
  - {name: filter_glob, type: text}
  - {name: files, type: text}
  - {name: ui_tab, type: text}          # un de : MAIN | ARMATURE
  - {name: use_manual_orientation, type: text}          # true|false, vide pour ne rien poser
  - {name: global_scale, type: text}
  - {name: bake_space_transform, type: text}          # true|false, vide pour ne rien poser
  - {name: use_custom_normals, type: text}          # true|false, vide pour ne rien poser
  - {name: colors_type, type: text}          # un de : NONE | SRGB | LINEAR
  - {name: use_image_search, type: text}          # true|false, vide pour ne rien poser
  - {name: use_alpha_decals, type: text}          # true|false, vide pour ne rien poser
  - {name: decal_offset, type: text}
  - {name: use_anim, type: text}          # true|false, vide pour ne rien poser
  - {name: anim_offset, type: text}
  - {name: use_subsurf, type: text}          # true|false, vide pour ne rien poser
  - {name: use_custom_props, type: text}          # true|false, vide pour ne rien poser
  - {name: use_custom_props_enum_as_string, type: text}          # true|false, vide pour ne rien poser
  - {name: ignore_leaf_bones, type: text}          # true|false, vide pour ne rien poser
  - {name: force_connect_children, type: text}          # true|false, vide pour ne rien poser
  - {name: automatic_bone_orientation, type: text}          # true|false, vide pour ne rien poser
  - {name: primary_bone_axis, type: text}          # un de : X | Y | Z | -X | -Y | -Z
  - {name: secondary_bone_axis, type: text}          # un de : X | Y | Z | -X | -Y | -Z
  - {name: use_prepost_rot, type: text}          # true|false, vide pour ne rien poser
  - {name: mtl_name_collision_mode, type: text}          # un de : MAKE_UNIQUE | REFERENCE_EXISTING
  - {name: axis_forward, type: text}          # un de : X | Y | Z | -X | -Y | -Z
  - {name: axis_up, type: text}          # un de : X | Y | Z | -X | -Y | -Z

