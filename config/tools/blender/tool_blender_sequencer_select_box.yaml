tool: "blender_sequencer_select_box"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Select strips using box selection"
machine: blender
op: sequencer.select_box
ARGS:
  - {name: xmin, type: int}
  - {name: xmax, type: int}
  - {name: ymin, type: int}
  - {name: ymax, type: int}
  - {name: wait_for_input, type: text}          # true|false, vide pour ne rien poser
  - {name: mode, type: text}          # un de : SET | ADD | SUB
  - {name: tweak, type: text}          # true|false, vide pour ne rien poser
  - {name: include_handles, type: text}          # true|false, vide pour ne rien poser
  - {name: ignore_connections, type: text}          # true|false, vide pour ne rien poser

