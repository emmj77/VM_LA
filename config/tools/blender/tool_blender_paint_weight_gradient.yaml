tool: "blender_paint_weight_gradient"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Draw a line to apply a weight gradient to selected vertices"
machine: blender
op: paint.weight_gradient
ARGS:
  - {name: type, type: text}          # un de : LINEAR | RADIAL
  - {name: xstart, type: int}
  - {name: xend, type: int}
  - {name: ystart, type: int}
  - {name: yend, type: int}
  - {name: flip, type: text}          # true|false, vide pour ne rien poser
  - {name: cursor, type: int}

