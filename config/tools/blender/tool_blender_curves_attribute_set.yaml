tool: "blender_curves_attribute_set"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Set values of the active attribute for selected elements"
machine: blender
op: curves.attribute_set
ARGS:
  - {name: value_float, type: text}
  - {name: value_float_vector_2d, type: text}          # 2 valeurs separees par des virgules
  - {name: value_float_vector_3d, type: text}          # 3 valeurs separees par des virgules
  - {name: value_float_vector_4d, type: text}          # 4 valeurs separees par des virgules
  - {name: value_int, type: int}
  - {name: value_int_vector_2d, type: int}
  - {name: value_color, type: text}          # 4 valeurs separees par des virgules
  - {name: value_bool, type: text}          # true|false, vide pour ne rien poser

