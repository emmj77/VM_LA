tool: "blender_ui_button"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "the button of an interface field: assign_default | copy_as_driver | copy_data_path | copy_driver_to_selected | copy_python_command | copy_to_selected | jump_to_target | override_add | override_remove | reset_default | unset_property (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "ui.{{op}}_button" --arg "all={{all}}" --arg "full_path={{full_path}}"
ARGS:
  - {name: op, type: enum, values: [assign_default, copy_as_driver, copy_data_path, copy_driver_to_selected, copy_python_command, copy_to_selected, jump_to_target, override_add, override_remove, reset_default, unset_property]}
  - {name: all, type: text}
  - {name: full_path, type: text}
