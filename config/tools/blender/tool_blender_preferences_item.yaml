tool: "blender_preferences_item"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a preferences item (library, path, repo, keymap, key): asset_library_add | asset_library_remove | autoexec_path_add | autoexec_path_remove | extension_repo_add | extension_repo_remove | keyitem_add | keyitem_remove | script_directory_add | script_directory_remove (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "preferences.{{op}}" --arg "index={{index}}" --arg "directory={{directory}}" --arg "name={{name}}" --arg "remote_url={{remote_url}}" --arg "type={{type}}" --arg "access_token={{access_token}}" --arg "custom_directory={{custom_directory}}" --arg "filter_blenlib={{filter_blenlib}}" --arg "filter_obj={{filter_obj}}" --arg "filter_usd={{filter_usd}}" --arg "item_id={{item_id}}" --arg "remove_files={{remove_files}}" --arg "use_access_token={{use_access_token}}" --arg "use_custom_directory={{use_custom_directory}}" --arg "use_sync_on_startup={{use_sync_on_startup}}" --arg "filter_folder={{filter_folder}}" --arg "check_existing={{check_existing}}" --arg "display_type={{display_type}}" --arg "filemode={{filemode}}" --arg "filter_alembic={{filter_alembic}}" --arg "filter_archive={{filter_archive}}" --arg "filter_backup={{filter_backup}}" --arg "filter_blender={{filter_blender}}" --arg "filter_btx={{filter_btx}}" --arg "filter_font={{filter_font}}" --arg "filter_image={{filter_image}}" --arg "filter_movie={{filter_movie}}" --arg "filter_python={{filter_python}}" --arg "filter_sound={{filter_sound}}" --arg "filter_text={{filter_text}}" --arg "filter_volume={{filter_volume}}" --arg "hide_props_region={{hide_props_region}}" --arg "sort_method={{sort_method}}"
ARGS:
  - {name: op, type: enum, values: [asset_library_add, asset_library_remove, autoexec_path_add, autoexec_path_remove, extension_repo_add, extension_repo_remove, keyitem_add, keyitem_remove, script_directory_add, script_directory_remove]}
  - {name: index, type: int}
  - {name: directory, type: text}
  - {name: name, type: text}
  - {name: remote_url, type: text}
  - {name: type, type: text}
  - {name: access_token, type: text}
  - {name: custom_directory, type: text}
  - {name: filter_blenlib, type: text}
  - {name: filter_obj, type: text}
  - {name: filter_usd, type: text}
  - {name: item_id, type: int}
  - {name: remove_files, type: text}
  - {name: use_access_token, type: text}
  - {name: use_custom_directory, type: text}
  - {name: use_sync_on_startup, type: text}
  - {name: filter_folder, type: text}
  - {name: check_existing, type: text}
  - {name: display_type, type: text}
  - {name: filemode, type: int}
  - {name: filter_alembic, type: text}
  - {name: filter_archive, type: text}
  - {name: filter_backup, type: text}
  - {name: filter_blender, type: text}
  - {name: filter_btx, type: text}
  - {name: filter_font, type: text}
  - {name: filter_image, type: text}
  - {name: filter_movie, type: text}
  - {name: filter_python, type: text}
  - {name: filter_sound, type: text}
  - {name: filter_text, type: text}
  - {name: filter_volume, type: text}
  - {name: hide_props_region, type: text}
  - {name: sort_method, type: text}
