tool: "blender_wm_radial_control"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Set some size property (e.g. brush size) with mouse wheel"
machine: blender
op: wm.radial_control
ARGS:
  - {name: data_path_primary, type: text}
  - {name: data_path_secondary, type: text}
  - {name: use_secondary, type: text}
  - {name: rotation_path, type: text}
  - {name: color_path, type: text}
  - {name: fill_color_path, type: text}
  - {name: fill_color_override_path, type: text}
  - {name: fill_color_override_test_path, type: text}
  - {name: zoom_path, type: text}
  - {name: image_id, type: text}
  - {name: secondary_tex, type: text}          # true|false, vide pour ne rien poser
  - {name: release_confirm, type: text}          # true|false, vide pour ne rien poser

