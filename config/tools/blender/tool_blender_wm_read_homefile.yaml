tool: "blender_wm_read_homefile"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Open the default file"
machine: blender
op: wm.read_homefile
ARGS:
  - {name: filepath, type: text}
  - {name: load_ui, type: text}          # true|false, vide pour ne rien poser
  - {name: use_splash, type: text}          # true|false, vide pour ne rien poser
  - {name: use_factory_startup, type: text}          # true|false, vide pour ne rien poser
  - {name: use_factory_startup_app_template_only, type: text}          # true|false, vide pour ne rien poser
  - {name: app_template, type: text}
  - {name: use_empty, type: text}          # true|false, vide pour ne rien poser

