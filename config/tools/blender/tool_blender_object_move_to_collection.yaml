tool: "blender_object_move_to_collection"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Move objects to a collection"
machine: blender
op: object.move_to_collection
ARGS:
  - {name: collection_uid, type: int}
  - {name: is_new, type: text}          # true|false, vide pour ne rien poser
  - {name: new_collection_name, type: text}

