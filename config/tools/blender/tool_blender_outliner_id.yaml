tool: "blender_outliner_id"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a datablock in the outliner: copy | delete | linked_relocate | operation | paste | remap (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "outliner.id_{{op}}" --arg "id_type={{id_type}}" --arg "new_id={{new_id}}" --arg "old_id={{old_id}}" --arg "type={{type}}"
ARGS:
  - {name: op, type: enum, values: [copy, delete, linked_relocate, operation, paste, remap]}
  - {name: id_type, type: text}
  - {name: new_id, type: int}
  - {name: old_id, type: int}
  - {name: type, type: text}
