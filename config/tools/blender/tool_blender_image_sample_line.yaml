tool: "blender_image_sample_line"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Sample a line and show it in Scope panels"
machine: blender
op: image.sample_line
ARGS:
  - {name: xstart, type: int}
  - {name: xend, type: int}
  - {name: ystart, type: int}
  - {name: yend, type: int}
  - {name: flip, type: text}          # true|false, vide pour ne rien poser
  - {name: cursor, type: int}

