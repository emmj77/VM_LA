tool: "blender_sound_clip"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a sound datablock: mixdown | open | open_mono | pack | unpack (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "sound.{{op}}" --arg "filepath={{filepath}}" --arg "filter_blenlib={{filter_blenlib}}" --arg "filter_obj={{filter_obj}}" --arg "filter_usd={{filter_usd}}" --arg "cache={{cache}}" --arg "mono={{mono}}" --arg "show_multiview={{show_multiview}}" --arg "accuracy={{accuracy}}" --arg "bitrate={{bitrate}}" --arg "channels={{channels}}" --arg "codec={{codec}}" --arg "container={{container}}" --arg "format={{format}}" --arg "id={{id}}" --arg "method={{method}}" --arg "mixrate={{mixrate}}" --arg "split_channels={{split_channels}}" --arg "check_existing={{check_existing}}" --arg "display_type={{display_type}}" --arg "filemode={{filemode}}" --arg "filter_alembic={{filter_alembic}}" --arg "filter_archive={{filter_archive}}" --arg "filter_backup={{filter_backup}}" --arg "filter_blender={{filter_blender}}" --arg "filter_btx={{filter_btx}}" --arg "filter_folder={{filter_folder}}" --arg "filter_font={{filter_font}}" --arg "filter_image={{filter_image}}" --arg "filter_movie={{filter_movie}}" --arg "filter_python={{filter_python}}" --arg "filter_sound={{filter_sound}}" --arg "filter_text={{filter_text}}" --arg "filter_volume={{filter_volume}}" --arg "relative_path={{relative_path}}" --arg "sort_method={{sort_method}}" --arg "hide_props_region={{hide_props_region}}" --arg "use_multiview={{use_multiview}}"
ARGS:
  - {name: op, type: enum, values: [mixdown, open, open_mono, pack, unpack]}
  - {name: filepath, type: text}
  - {name: filter_blenlib, type: text}
  - {name: filter_obj, type: text}
  - {name: filter_usd, type: text}
  - {name: cache, type: text}
  - {name: mono, type: text}
  - {name: show_multiview, type: text}
  - {name: accuracy, type: int}
  - {name: bitrate, type: int}
  - {name: channels, type: text}
  - {name: codec, type: text}
  - {name: container, type: text}
  - {name: format, type: text}
  - {name: id, type: text}
  - {name: method, type: text}
  - {name: mixrate, type: int}
  - {name: split_channels, type: text}
  - {name: check_existing, type: text}
  - {name: display_type, type: text}
  - {name: filemode, type: int}
  - {name: filter_alembic, type: text}
  - {name: filter_archive, type: text}
  - {name: filter_backup, type: text}
  - {name: filter_blender, type: text}
  - {name: filter_btx, type: text}
  - {name: filter_folder, type: text}
  - {name: filter_font, type: text}
  - {name: filter_image, type: text}
  - {name: filter_movie, type: text}
  - {name: filter_python, type: text}
  - {name: filter_sound, type: text}
  - {name: filter_text, type: text}
  - {name: filter_volume, type: text}
  - {name: relative_path, type: text}
  - {name: sort_method, type: text}
  - {name: hide_props_region, type: text}
  - {name: use_multiview, type: text}
