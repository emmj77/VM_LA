tool: "blender_particle_dupliob"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a duplication object of a particle system: copy | move_down | move_up | refresh | remove (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "particle.dupliob_{{op}}"
ARGS:
  - {name: op, type: enum, values: [copy, move_down, move_up, refresh, remove]}
