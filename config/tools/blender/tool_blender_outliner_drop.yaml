tool: "blender_outliner_drop"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a drop target of the outliner: collection | datastack | item_drag | material | parent | scene (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "outliner.{{op}}_drop"
ARGS:
  - {name: op, type: enum, values: [collection, datastack, item_drag, material, parent, scene]}
