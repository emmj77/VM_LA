tool: "blender_fluid_preset_add"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Add or remove a Fluid Preset"
machine: blender
op: fluid.preset_add
ARGS:
  - {name: name, type: text}
  - {name: remove_name, type: text}          # true|false, vide pour ne rien poser
  - {name: remove_active, type: text}          # true|false, vide pour ne rien poser

