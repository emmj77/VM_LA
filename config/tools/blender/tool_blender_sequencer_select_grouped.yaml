tool: "blender_sequencer_select_grouped"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Select all strips grouped by various properties"
machine: blender
op: sequencer.select_grouped
ARGS:
  - {name: type, type: text}          # un de : TYPE | TYPE_BASIC | TYPE_EFFECT | DATA | EFFECT | EFFECT_LINK | OVERLAP
  - {name: extend, type: text}          # true|false, vide pour ne rien poser
  - {name: use_active_channel, type: text}          # true|false, vide pour ne rien poser

