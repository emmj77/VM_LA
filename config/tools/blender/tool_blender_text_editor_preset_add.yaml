tool: "blender_text_editor_preset_add"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Add or remove a Text Editor Preset"
machine: blender
op: text_editor.preset_add
ARGS:
  - {name: name, type: text}
  - {name: remove_name, type: text}          # true|false, vide pour ne rien poser
  - {name: remove_active, type: text}          # true|false, vide pour ne rien poser

