tool: "blender_render_preset_add"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Add or remove a Render Preset"
machine: blender
op: render.preset_add
ARGS:
  - {name: name, type: text}
  - {name: remove_name, type: text}          # true|false, vide pour ne rien poser
  - {name: remove_active, type: text}          # true|false, vide pour ne rien poser

