tool: "blender_clip_select"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Select tracking markers"
machine: blender
op: clip.select
ARGS:
  - {name: extend, type: text}          # true|false, vide pour ne rien poser
  - {name: deselect_all, type: text}          # true|false, vide pour ne rien poser
  - {name: location, type: text}          # 2 valeurs separees par des virgules

