tool: "blender_object_add_named"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Add named object"
machine: blender
op: object.add_named
ARGS:
  - {name: linked, type: text}          # true|false, vide pour ne rien poser
  - {name: name, type: text}
  - {name: session_uid, type: int}
  - {name: matrix, type: text}          # 16 valeurs separees par des virgules
  - {name: drop_x, type: int}
  - {name: drop_y, type: int}

