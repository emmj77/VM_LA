tool: "blender_anim_channels"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "an animation channel: bake | clean_empty | click | collapse | delete | editable_toggle | expand | fcurves_enable | group | move | rename | select_all | select_box | select_filter | setting_disable | setting_enable | setting_toggle | ungroup | view_selected (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "anim.channels_{{op}}" --arg "mode={{mode}}" --arg "type={{type}}" --arg "all={{all}}" --arg "extend={{extend}}" --arg "action={{action}}" --arg "bake_modifiers={{bake_modifiers}}" --arg "children_only={{children_only}}" --arg "deselect={{deselect}}" --arg "direction={{direction}}" --arg "extend_range={{extend_range}}" --arg "include_handles={{include_handles}}" --arg "interpolation_type={{interpolation_type}}" --arg "name={{name}}" --arg "range={{range}}" --arg "remove_outside_range={{remove_outside_range}}" --arg "step={{step}}" --arg "use_preview_range={{use_preview_range}}" --arg "use_scene_range={{use_scene_range}}" --arg "wait_for_input={{wait_for_input}}" --arg "xmax={{xmax}}" --arg "xmin={{xmin}}" --arg "ymax={{ymax}}" --arg "ymin={{ymin}}"
ARGS:
  - {name: op, type: enum, values: [bake, clean_empty, click, collapse, delete, editable_toggle, expand, fcurves_enable, group, move, rename, select_all, select_box, select_filter, setting_disable, setting_enable, setting_toggle, ungroup, view_selected]}
  - {name: mode, type: text}
  - {name: type, type: text}
  - {name: all, type: text}
  - {name: extend, type: text}
  - {name: action, type: text}
  - {name: bake_modifiers, type: text}
  - {name: children_only, type: text}
  - {name: deselect, type: text}
  - {name: direction, type: text}
  - {name: extend_range, type: text}
  - {name: include_handles, type: text}
  - {name: interpolation_type, type: text}
  - {name: name, type: text}
  - {name: range, type: int}
  - {name: remove_outside_range, type: text}
  - {name: step, type: text}
  - {name: use_preview_range, type: text}
  - {name: use_scene_range, type: text}
  - {name: wait_for_input, type: text}
  - {name: xmax, type: int}
  - {name: xmin, type: int}
  - {name: ymax, type: int}
  - {name: ymin, type: int}
