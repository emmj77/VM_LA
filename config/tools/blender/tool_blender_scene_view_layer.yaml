tool: "blender_scene_view_layer"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a view layer: add | add_aov | add_lightgroup | add_used_lightgroups | remove | remove_aov | remove_lightgroup | remove_unused_lightgroups (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "scene.view_layer_{{op}}" --arg "name={{name}}" --arg "type={{type}}"
ARGS:
  - {name: op, type: enum, values: [add, add_aov, add_lightgroup, add_used_lightgroups, remove, remove_aov, remove_lightgroup, remove_unused_lightgroups]}
  - {name: name, type: text}
  - {name: type, type: text}
