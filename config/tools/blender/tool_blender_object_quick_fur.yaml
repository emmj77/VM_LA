tool: "blender_object_quick_fur"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Add a fur setup to the selected objects"
machine: blender
op: object.quick_fur
ARGS:
  - {name: density, type: text}          # un de : LOW | MEDIUM | HIGH
  - {name: length, type: text}
  - {name: radius, type: text}
  - {name: view_percentage, type: text}
  - {name: apply_hair_guides, type: text}          # true|false, vide pour ne rien poser
  - {name: use_noise, type: text}          # true|false, vide pour ne rien poser
  - {name: use_frizz, type: text}          # true|false, vide pour ne rien poser

