tool: "blender_collection_exporter"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a collection exporter or importer: exporter_add | exporter_export | exporter_move | exporter_remove | importer_add | importer_remove (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "collection.{{op}}" --arg "index={{index}}" --arg "name={{name}}" --arg "direction={{direction}}"
ARGS:
  - {name: op, type: enum, values: [exporter_add, exporter_export, exporter_move, exporter_remove, importer_add, importer_remove]}
  - {name: index, type: int}
  - {name: name, type: text}
  - {name: direction, type: text}
