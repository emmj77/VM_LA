tool: "blender_uv_align"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Aligns selected UV vertices on a line"
machine: blender
op: uv.align
ARGS:
  - {name: axis, type: text}          # un de : ALIGN_S | ALIGN_T | ALIGN_U | ALIGN_AUTO | ALIGN_X | ALIGN_Y
  - {name: position_mode, type: text}          # un de : MEAN | MIN | MAX

