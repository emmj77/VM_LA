tool: "blender_object_shape_key"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a shape key of an object: add | apply_to_basis | clear | copy | lock | make_basis | mirror | move | remove | retime | transfer (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "object.shape_key_{{op}}" --arg "action={{action}}" --arg "all={{all}}" --arg "apply_mix={{apply_mix}}" --arg "from_mix={{from_mix}}" --arg "mode={{mode}}" --arg "type={{type}}" --arg "use_clamp={{use_clamp}}" --arg "use_topology={{use_topology}}"
ARGS:
  - {name: op, type: enum, values: [add, apply_to_basis, clear, copy, lock, make_basis, mirror, move, remove, retime, transfer]}
  - {name: action, type: text}
  - {name: all, type: text}
  - {name: apply_mix, type: text}
  - {name: from_mix, type: text}
  - {name: mode, type: text}
  - {name: type, type: text}
  - {name: use_clamp, type: text}
  - {name: use_topology, type: text}
