tool: "blender_node_select_circle"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Use circle selection to select nodes"
machine: blender
op: node.select_circle
ARGS:
  - {name: x, type: int}
  - {name: y, type: int}
  - {name: radius, type: int}
  - {name: wait_for_input, type: text}          # true|false, vide pour ne rien poser
  - {name: mode, type: text}          # un de : SET | ADD | SUB

