  - {name: sort_method, type: text}          # un de : 
  - {name: global_scale, type: text}
  - {name: use_scene_unit, type: text}          # true|false, vide pour ne rien poser
  - {name: use_facet_normal, type: text}          # true|false, vide pour ne rien poser
  - {name: forward_axis, type: text}          # un de : X | Y | Z | NEGATIVE_X | NEGATIVE_Y | NEGATIVE_Z
