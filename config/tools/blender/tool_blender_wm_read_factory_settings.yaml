tool: "blender_wm_read_factory_settings"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Load factory default startup file and preferences. To make changes permanent, use 'Save Startup File' and 'Save Preferences'"
machine: blender
op: wm.read_factory_settings
ARGS:
  - {name: use_factory_startup_app_template_only, type: text}          # true|false, vide pour ne rien poser
  - {name: app_template, type: text}
  - {name: use_empty, type: text}          # true|false, vide pour ne rien poser

