tool: "blender_rigidbody_objects"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a rigid body element: _add | _remove | s_add | s_remove (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "rigidbody.object{{op}}" --arg "type={{type}}"
ARGS:
  - {name: op, type: enum, values: [_add, _remove, s_add, s_remove]}
  - {name: type, type: text}
