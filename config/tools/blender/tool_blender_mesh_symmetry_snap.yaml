tool: "blender_mesh_symmetry_snap"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Snap vertex pairs to their mirrored locations"
machine: blender
op: mesh.symmetry_snap
ARGS:
  - {name: direction, type: text}          # un de : NEGATIVE_X | POSITIVE_X | NEGATIVE_Y | POSITIVE_Y | NEGATIVE_Z | POSITIVE_Z
  - {name: threshold, type: text}
  - {name: factor, type: text}
  - {name: use_center, type: text}          # true|false, vide pour ne rien poser
  - {name: use_topology, type: text}          # true|false, vide pour ne rien poser

