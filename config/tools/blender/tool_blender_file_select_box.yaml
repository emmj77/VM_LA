tool: "blender_file_select_box"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Activate/select the file(s) contained in the border"
machine: blender
op: file.select_box
ARGS:
  - {name: xmin, type: int}
  - {name: xmax, type: int}
  - {name: ymin, type: int}
  - {name: ymax, type: int}
  - {name: wait_for_input, type: text}          # true|false, vide pour ne rien poser
  - {name: mode, type: text}          # un de : SET | ADD | SUB

