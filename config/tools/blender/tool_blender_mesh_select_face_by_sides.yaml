tool: "blender_mesh_select_face_by_sides"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Select vertices or faces by the number of face sides"
machine: blender
op: mesh.select_face_by_sides
ARGS:
  - {name: number, type: int}
  - {name: type, type: text}          # un de : LESS | EQUAL | GREATER | NOTEQUAL
  - {name: extend, type: text}          # true|false, vide pour ne rien poser

