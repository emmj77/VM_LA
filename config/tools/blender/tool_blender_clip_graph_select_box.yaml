tool: "blender_clip_graph_select_box"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Select curve points using box selection"
machine: blender
op: clip.graph_select_box
ARGS:
  - {name: xmin, type: int}
  - {name: xmax, type: int}
  - {name: ymin, type: int}
  - {name: ymax, type: int}
  - {name: wait_for_input, type: text}          # true|false, vide pour ne rien poser
  - {name: deselect, type: text}          # true|false, vide pour ne rien poser
  - {name: extend, type: text}          # true|false, vide pour ne rien poser

