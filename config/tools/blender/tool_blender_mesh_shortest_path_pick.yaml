tool: "blender_mesh_shortest_path_pick"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Select shortest path between two selections"
machine: blender
op: mesh.shortest_path_pick
ARGS:
  - {name: edge_mode, type: text}          # un de : SELECT | SEAM | SHARP | CREASE | BEVEL | FREESTYLE
  - {name: use_face_step, type: text}          # true|false, vide pour ne rien poser
  - {name: use_topology_distance, type: text}          # true|false, vide pour ne rien poser
  - {name: use_fill, type: text}          # true|false, vide pour ne rien poser
  - {name: skip, type: int}
  - {name: nth, type: int}
  - {name: offset, type: int}
  - {name: index, type: int}

