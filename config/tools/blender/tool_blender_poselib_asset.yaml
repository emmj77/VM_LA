tool: "blender_poselib_asset"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a pose asset: apply_pos | blend_pos | create_pos | past (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "poselib.{{op}}e_asset" --arg "asset_library_identifier={{asset_library_identifier}}" --arg "asset_library_type={{asset_library_type}}" --arg "blend_factor={{blend_factor}}" --arg "flipped={{flipped}}" --arg "relative_asset_identifier={{relative_asset_identifier}}" --arg "asset_library_reference={{asset_library_reference}}" --arg "catalog_path={{catalog_path}}" --arg "pose_name={{pose_name}}" --arg "release_confirm={{release_confirm}}"
ARGS:
  - {name: op, type: enum, values: [apply_pos, blend_pos, create_pos, past]}
  - {name: asset_library_identifier, type: text}
  - {name: asset_library_type, type: text}
  - {name: blend_factor, type: text}
  - {name: flipped, type: text}
  - {name: relative_asset_identifier, type: text}
  - {name: asset_library_reference, type: text}
  - {name: catalog_path, type: text}
  - {name: pose_name, type: text}
  - {name: release_confirm, type: text}
