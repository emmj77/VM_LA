tool: "blender_wm_keyconfig_preset_remove"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Remove a custom keymap configuration from the preset list"
machine: blender
op: wm.keyconfig_preset_remove
ARGS:
  - {name: name, type: text}
  - {name: remove_name, type: text}          # true|false, vide pour ne rien poser
  - {name: remove_active, type: text}          # true|false, vide pour ne rien poser

