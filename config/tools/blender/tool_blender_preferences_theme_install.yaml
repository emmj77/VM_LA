tool: "blender_preferences_theme_install"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Load and apply a Blender XML theme file"
machine: blender
op: preferences.theme_install
ARGS:
  - {name: overwrite, type: text}          # true|false, vide pour ne rien poser
  - {name: filepath, type: text}
  - {name: filter_folder, type: text}          # true|false, vide pour ne rien poser
  - {name: filter_glob, type: text}

