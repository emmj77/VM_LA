tool: "blender_ui_eyedropper"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "an eyedropper target: bone | color | colorramp | colorramp_point | depth | driver | grease_pencil_color | id (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "ui.eyedropper_{{op}}" --arg "prop_data_path={{prop_data_path}}" --arg "mapping_type={{mapping_type}}" --arg "material_mode={{material_mode}}" --arg "mode={{mode}}"
ARGS:
  - {name: op, type: enum, values: [bone, color, colorramp, colorramp_point, depth, driver, grease_pencil_color, id]}
  - {name: prop_data_path, type: text}
  - {name: mapping_type, type: text}
  - {name: material_mode, type: text}
  - {name: mode, type: text}
