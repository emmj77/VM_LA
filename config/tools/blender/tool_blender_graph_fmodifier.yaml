tool: "blender_graph_fmodifier"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a graph editor F-modifier: add | copy | delete | paste (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "graph.fmodifier_{{op}}" --arg "only_active={{only_active}}" --arg "type={{type}}" --arg "mode={{mode}}" --arg "replace={{replace}}"
ARGS:
  - {name: op, type: enum, values: [add, copy, delete, paste]}
  - {name: only_active, type: text}
  - {name: type, type: text}
  - {name: mode, type: text}
  - {name: replace, type: text}
