tool: "blender_paint_select"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a selection in vertex or face paint: face_select_all | face_select_hide | face_select_less | face_select_linked | face_select_linked_pick | face_select_loop | face_select_more | vert_select_all | vert_select_hide | vert_select_less | vert_select_linked | vert_select_linked_pick | vert_select_loop | vert_select_more | vert_select_ungrouped (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "paint.{{op}}" --arg "face_step={{face_step}}" --arg "extend={{extend}}" --arg "select={{select}}" --arg "action={{action}}" --arg "unselected={{unselected}}" --arg "deselect={{deselect}}"
ARGS:
  - {name: op, type: enum, values: [face_select_all, face_select_hide, face_select_less, face_select_linked, face_select_linked_pick, face_select_loop, face_select_more, vert_select_all, vert_select_hide, vert_select_less, vert_select_linked, vert_select_linked_pick, vert_select_loop, vert_select_more, vert_select_ungrouped]}
  - {name: face_step, type: text}
  - {name: extend, type: text}
  - {name: select, type: text}
  - {name: action, type: text}
  - {name: unselected, type: text}
  - {name: deselect, type: text}
