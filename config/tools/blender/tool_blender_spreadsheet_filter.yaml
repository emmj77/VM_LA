tool: "blender_spreadsheet_filter"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a row filter of the spreadsheet: add | remove (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "spreadsheet.{{op}}_row_filter_rule" --arg "index={{index}}"
ARGS:
  - {name: op, type: enum, values: [add, remove]}
  - {name: index, type: int}
