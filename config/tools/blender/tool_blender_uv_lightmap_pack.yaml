tool: "blender_uv_lightmap_pack"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Pack each face's UVs into the UV bounds"
machine: blender
op: uv.lightmap_pack
ARGS:
  - {name: PREF_CONTEXT, type: text}          # un de : SEL_FACES | ALL_FACES
  - {name: PREF_PACK_IN_ONE, type: text}          # true|false, vide pour ne rien poser
  - {name: PREF_NEW_UVLAYER, type: text}          # true|false, vide pour ne rien poser
  - {name: PREF_BOX_DIV, type: int}
  - {name: PREF_MARGIN_DIV, type: text}

