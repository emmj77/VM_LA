tool: "blender_node_socket_item"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a socket-list item of a node: kind : 22 values, see ARGS ; op : add | move | remove"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "node.{{kind}}_item_{{op}}" --arg "node_identifier={{node_identifier}}" --arg "direction={{direction}}" --arg "init_from_active={{init_from_active}}" --arg "show_dialog={{show_dialog}}" --arg "item_name={{item_name}}" --arg "socket_type={{socket_type}}" --arg "index={{index}}"
ARGS:
  - {name: kind, type: enum, values: [bake_node, capture_attribute, closure_input, closure_output, closure_to_list, combine_bundle, enum_definition, evaluate_closure_input, evaluate_closure_output, field_to_grid, field_to_list, file_output, foreach_geometry_element_zone_generation, foreach_geometry_element_zone_input, foreach_geometry_element_zone_main, format_string, geometry_nodes_viewer, index_switch, repeat_zone, sample_attribute_items, separate_bundle, simulation_zone]}
  - {name: op, type: enum, values: [add, move, remove]}
  - {name: node_identifier, type: int}
  - {name: direction, type: text}
  - {name: init_from_active, type: text}
  - {name: show_dialog, type: text}
  - {name: item_name, type: text}
  - {name: socket_type, type: text}
  - {name: index, type: int}
