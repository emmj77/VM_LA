tool: "blender_wm_obj_import"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Load a Wavefront OBJ scene"
machine: blender
op: wm.obj_import
ARGS:
  - {name: filepath, type: text}
  - {name: directory, type: text}
  - {name: files, type: text}
