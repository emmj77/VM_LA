tool: "blender_pose_clear"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "values cleared on a pose: constraints | ik | loc | rot | scale | transforms | user_transforms (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "pose.{{op}}_clear" --arg "only_selected={{only_selected}}"
ARGS:
  - {name: op, type: enum, values: [constraints, ik, loc, rot, scale, transforms, user_transforms]}
  - {name: only_selected, type: text}
