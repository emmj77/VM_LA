tool: "blender_wm_context"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a context value: cycle_array | cycle_enum | cycle_int | menu_enum | pie_enum | scale_float | scale_int | set_boolean | set_enum | set_float | set_id | set_int | set_string | set_value | toggle_enum (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "wm.context_{{op}}" --arg "data_path={{data_path}}" --arg "value={{value}}" --arg "reverse={{reverse}}" --arg "relative={{relative}}" --arg "wrap={{wrap}}" --arg "always_step={{always_step}}" --arg "value_1={{value_1}}" --arg "value_2={{value_2}}"
ARGS:
  - {name: op, type: enum, values: [cycle_array, cycle_enum, cycle_int, menu_enum, pie_enum, scale_float, scale_int, set_boolean, set_enum, set_float, set_id, set_int, set_string, set_value, toggle_enum]}
  - {name: data_path, type: text}
  - {name: value, type: text}
  - {name: reverse, type: text}
  - {name: relative, type: text}
  - {name: wrap, type: text}
  - {name: always_step, type: text}
  - {name: value_1, type: text}
  - {name: value_2, type: text}
