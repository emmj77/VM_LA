tool: "blender_paint_hide_show"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Hide/show some vertices"
machine: blender
op: paint.hide_show
ARGS:
  - {name: xmin, type: int}
  - {name: xmax, type: int}
  - {name: ymin, type: int}
  - {name: ymax, type: int}
  - {name: wait_for_input, type: text}          # true|false, vide pour ne rien poser
  - {name: action, type: text}          # un de : HIDE | SHOW
  - {name: area, type: text}          # un de : OUTSIDE | Inside
  - {name: use_front_faces_only, type: text}          # true|false, vide pour ne rien poser

