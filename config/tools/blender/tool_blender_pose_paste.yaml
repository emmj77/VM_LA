tool: "blender_pose_paste"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Paste the stored pose on to the current pose"
machine: blender
op: pose.paste
ARGS:
  - {name: flipped, type: text}          # true|false, vide pour ne rien poser
  - {name: selected_mask, type: text}          # true|false, vide pour ne rien poser

