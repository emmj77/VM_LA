tool: "blender_sequencer_scene_strip_add_new"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Add a strip using a new scene as the source"
machine: blender
op: sequencer.scene_strip_add_new
ARGS:
  - {name: move_strips, type: text}          # true|false, vide pour ne rien poser
  - {name: frame_start, type: int}
  - {name: channel, type: int}
  - {name: replace_sel, type: text}          # true|false, vide pour ne rien poser
  - {name: overlap, type: text}          # true|false, vide pour ne rien poser
  - {name: overlap_shuffle_override, type: text}          # true|false, vide pour ne rien poser
  - {name: skip_locked_or_muted_channels, type: text}          # true|false, vide pour ne rien poser
  - {name: type, type: text}          # un de : NEW | EMPTY | LINK_COPY | FULL_COPY

