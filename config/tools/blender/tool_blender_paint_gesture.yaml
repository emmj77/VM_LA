tool: "blender_paint_gesture"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a paint gesture (hide, mask): hide_show_lasso | hide_show_line | hide_show_polyline | mask_box | mask_lasso | mask_line | mask_polyline (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "paint.{{op}}_gesture" --arg "use_front_faces_only={{use_front_faces_only}}" --arg "mode={{mode}}" --arg "path={{path}}" --arg "value={{value}}" --arg "action={{action}}" --arg "area={{area}}" --arg "cursor={{cursor}}" --arg "flip={{flip}}" --arg "smooth_stroke_factor={{smooth_stroke_factor}}" --arg "smooth_stroke_radius={{smooth_stroke_radius}}" --arg "use_limit_to_segment={{use_limit_to_segment}}" --arg "use_smooth_stroke={{use_smooth_stroke}}" --arg "xend={{xend}}" --arg "xstart={{xstart}}" --arg "yend={{yend}}" --arg "ystart={{ystart}}" --arg "wait_for_input={{wait_for_input}}" --arg "xmax={{xmax}}" --arg "xmin={{xmin}}" --arg "ymax={{ymax}}" --arg "ymin={{ymin}}"
ARGS:
  - {name: op, type: enum, values: [hide_show_lasso, hide_show_line, hide_show_polyline, mask_box, mask_lasso, mask_line, mask_polyline]}
  - {name: use_front_faces_only, type: text}
  - {name: mode, type: text}
  - {name: path, type: text}
  - {name: value, type: text}
  - {name: action, type: text}
  - {name: area, type: text}
  - {name: cursor, type: int}
  - {name: flip, type: text}
  - {name: smooth_stroke_factor, type: text}
  - {name: smooth_stroke_radius, type: int}
  - {name: use_limit_to_segment, type: text}
  - {name: use_smooth_stroke, type: text}
  - {name: xend, type: int}
  - {name: xstart, type: int}
  - {name: yend, type: int}
  - {name: ystart, type: int}
  - {name: wait_for_input, type: text}
  - {name: xmax, type: int}
  - {name: xmin, type: int}
  - {name: ymax, type: int}
  - {name: ymin, type: int}
