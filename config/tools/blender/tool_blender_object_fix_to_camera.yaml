tool: "blender_object_fix_to_camera"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Generate new keys to fix the selected object/bone to the camera on unkeyed frames"
machine: blender
op: object.fix_to_camera
ARGS:
  - {name: use_location, type: text}          # true|false, vide pour ne rien poser
  - {name: use_rotation, type: text}          # true|false, vide pour ne rien poser
  - {name: use_scale, type: text}          # true|false, vide pour ne rien poser

