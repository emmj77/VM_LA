tool: "blender_spreadsheet_column"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a column of the spreadsheet: fit_column | reorder_columns | resize_column (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "spreadsheet.{{op}}"
ARGS:
  - {name: op, type: enum, values: [fit_column, reorder_columns, resize_column]}
