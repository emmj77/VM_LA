tool: "blender_gp_material"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a grease pencil material: copy_to_object | hide | isolate | lock_all | lock_unselected | lock_unused | reveal | select | unlock_all (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "grease_pencil.material_{{op}}" --arg "affect_visibility={{affect_visibility}}" --arg "deselect={{deselect}}" --arg "invert={{invert}}" --arg "only_active={{only_active}}"
ARGS:
  - {name: op, type: enum, values: [copy_to_object, hide, isolate, lock_all, lock_unselected, lock_unused, reveal, select, unlock_all]}
  - {name: affect_visibility, type: text}
  - {name: deselect, type: text}
  - {name: invert, type: text}
  - {name: only_active, type: text}
