tool: "blender_clip_detect_features"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Automatically detect features and place markers to track"
machine: blender
op: clip.detect_features
ARGS:
  - {name: placement, type: text}          # un de : FRAME | INSIDE_GPENCIL | OUTSIDE_GPENCIL
  - {name: margin, type: int}
  - {name: threshold, type: text}
  - {name: min_distance, type: int}

