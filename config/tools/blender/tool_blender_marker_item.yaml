tool: "blender_marker_item"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a timeline marker: add | delete | duplicate | move | rename (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "marker.{{op}}" --arg "frames={{frames}}" --arg "confirm={{confirm}}" --arg "name={{name}}" --arg "tweak={{tweak}}"
ARGS:
  - {name: op, type: enum, values: [add, delete, duplicate, move, rename]}
  - {name: frames, type: int}
  - {name: confirm, type: text}
  - {name: name, type: text}
  - {name: tweak, type: text}
