tool: "blender_transform_bbone_resize"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Scale selected bendy bones display size"
machine: blender
op: transform.bbone_resize
ARGS:
  - {name: value, type: text}          # 3 valeurs separees par des virgules
  - {name: orient_type, type: text}          # un de : 
  - {name: orient_matrix, type: text}          # 9 valeurs separees par des virgules
  - {name: orient_matrix_type, type: text}          # un de : 
  - {name: constraint_axis, type: text}          # 3 valeurs separees par des virgules
  - {name: mirror, type: text}          # true|false, vide pour ne rien poser
  - {name: release_confirm, type: text}          # true|false, vide pour ne rien poser
  - {name: use_accurate, type: text}          # true|false, vide pour ne rien poser

