tool: "blender_mesh_dissolve_limited"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Dissolve selected edges and vertices, limited by the angle of surrounding geometry"
machine: blender
op: mesh.dissolve_limited
ARGS:
  - {name: angle_limit, type: text}
  - {name: use_dissolve_boundaries, type: text}          # true|false, vide pour ne rien poser
  - {name: delimit, type: text}          # un de : NORMAL | MATERIAL | SEAM | SHARP | UV

