tool: "blender_wm_xr_navigation_teleport"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Set VR viewer location to controller raycast hit location"
machine: blender
op: wm.xr_navigation_teleport
ARGS:
  - {name: selectable_only, type: text}          # true|false, vide pour ne rien poser
  - {name: force, type: text}
  - {name: range, type: text}
  - {name: ray_line_width, type: text}
  - {name: destination_indicator_width, type: text}
  - {name: hit_color, type: text}          # 4 valeurs separees par des virgules
  - {name: miss_color, type: text}          # 4 valeurs separees par des virgules
  - {name: fallback_color, type: text}          # 4 valeurs separees par des virgules

