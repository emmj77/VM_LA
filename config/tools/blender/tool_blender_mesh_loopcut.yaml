tool: "blender_mesh_loopcut"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Add a new loop between existing loops"
machine: blender
op: mesh.loopcut
ARGS:
  - {name: number_cuts, type: int}
  - {name: smoothness, type: text}
  - {name: falloff, type: text}          # un de : SMOOTH | SPHERE | ROOT | INVERSE_SQUARE | SHARP | LINEAR
  - {name: object_index, type: int}
  - {name: edge_index, type: int}
  - {name: mesh_select_mode_init, type: text}          # 3 valeurs separees par des virgules

