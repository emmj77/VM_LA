tool: "blender_wm_tool_set_by_index"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Set the tool by index (for key-maps)"
machine: blender
op: wm.tool_set_by_index
ARGS:
  - {name: index, type: int}
  - {name: cycle, type: text}          # true|false, vide pour ne rien poser
  - {name: expand, type: text}          # true|false, vide pour ne rien poser
  - {name: as_fallback, type: text}          # true|false, vide pour ne rien poser
  - {name: space_type, type: text}          # un de : EMPTY | VIEW_3D | IMAGE_EDITOR | NODE_EDITOR | SEQUENCE_EDITOR | CLIP_EDITOR | DOPESHEET_EDITOR | GRAPH_EDITOR | NLA_EDITOR | TEXT_EDITOR | CONSOLE | INFO | TOPBAR | STATUSBAR | OUTLINER | PROPERTIES | FILE_BROWSER | SPREADSHEET | PREFERENCES

