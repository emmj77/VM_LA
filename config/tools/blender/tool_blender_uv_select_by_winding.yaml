tool: "blender_uv_select_by_winding"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Select UV faces by their winding"
machine: blender
op: uv.select_by_winding
ARGS:
  - {name: winding, type: text}          # un de : POSITIVE | NEGATIVE
  - {name: extend, type: text}          # true|false, vide pour ne rien poser

