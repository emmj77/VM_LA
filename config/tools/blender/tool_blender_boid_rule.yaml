tool: "blender_boid_rule"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a boid rule: add | del | move_down | move_up (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "boid.rule_{{op}}" --arg "type={{type}}"
ARGS:
  - {name: op, type: enum, values: [add, del, move_down, move_up]}
  - {name: type, type: text}
