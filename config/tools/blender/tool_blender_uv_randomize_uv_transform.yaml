tool: "blender_uv_randomize_uv_transform"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Randomize the UV island's location, rotation, and scale"
machine: blender
op: uv.randomize_uv_transform
ARGS:
  - {name: random_seed, type: int}
  - {name: use_loc, type: text}          # true|false, vide pour ne rien poser
  - {name: loc, type: text}          # 2 valeurs separees par des virgules
  - {name: use_rot, type: text}          # true|false, vide pour ne rien poser
  - {name: rot, type: text}
  - {name: use_scale, type: text}          # true|false, vide pour ne rien poser
  - {name: scale_even, type: text}          # true|false, vide pour ne rien poser
  - {name: scale, type: text}          # 2 valeurs separees par des virgules

