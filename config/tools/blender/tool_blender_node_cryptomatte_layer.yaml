tool: "blender_node_cryptomatte_layer"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a cryptomatte layer of a node: add | remove (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "node.cryptomatte_layer_{{op}}"
ARGS:
  - {name: op, type: enum, values: [add, remove]}
