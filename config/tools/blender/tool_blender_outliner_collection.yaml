tool: "blender_outliner_collection"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a collection in the outliner: color_tag_set | disable | disable_render | duplicate | duplicate_linked | enable | enable_render | exclude_clear | exclude_set | hide | hide_inside | hierarchy_delete | holdout_clear | holdout_set | indirect_only_clear | indirect_only_set | instance | isolate | link | new | objects_deselect | objects_select | show | show_inside (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "outliner.collection_{{op}}" --arg "color={{color}}" --arg "extend={{extend}}" --arg "nested={{nested}}"
ARGS:
  - {name: op, type: enum, values: [color_tag_set, disable, disable_render, duplicate, duplicate_linked, enable, enable_render, exclude_clear, exclude_set, hide, hide_inside, hierarchy_delete, holdout_clear, holdout_set, indirect_only_clear, indirect_only_set, instance, isolate, link, new, objects_deselect, objects_select, show, show_inside]}
  - {name: color, type: text}
  - {name: extend, type: text}
  - {name: nested, type: text}
