tool: "blender_outliner_item_operation"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "an item operation of the outliner: animdata | constraint | data | lib | liboverride | liboverride_troubleshoot | modifier | object | scene (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "outliner.{{op}}_operation" --arg "type={{type}}" --arg "selection_set={{selection_set}}"
ARGS:
  - {name: op, type: enum, values: [animdata, constraint, data, lib, liboverride, liboverride_troubleshoot, modifier, object, scene]}
  - {name: type, type: text}
  - {name: selection_set, type: text}
