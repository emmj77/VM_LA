tool: "blender_view3d_ndof"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a 3D navigation device move: all | orbit | orbit_zoom | pan (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "view3d.ndof_{{op}}"
ARGS:
  - {name: op, type: enum, values: [all, orbit, orbit_zoom, pan]}
