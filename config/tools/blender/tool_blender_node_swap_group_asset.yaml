tool: "blender_node_swap_group_asset"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Swap selected nodes with the specified node group asset"
machine: blender
op: node.swap_group_asset
ARGS:
  - {name: asset_library_type, type: text}          # un de : ALL | LOCAL | ESSENTIALS | ONLINE_ESSENTIALS | CUSTOM
  - {name: asset_library_identifier, type: text}
  - {name: relative_asset_identifier, type: text}

