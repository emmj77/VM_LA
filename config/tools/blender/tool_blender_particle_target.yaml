tool: "blender_particle_target"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a target of a particle system: move_down | move_up | remove (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "particle.target_{{op}}"
ARGS:
  - {name: op, type: enum, values: [move_down, move_up, remove]}
