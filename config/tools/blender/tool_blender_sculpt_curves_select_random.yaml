tool: "blender_sculpt_curves_select_random"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Randomizes existing selection or create new random selection"
machine: blender
op: sculpt_curves.select_random
ARGS:
  - {name: seed, type: int}
  - {name: partial, type: text}          # true|false, vide pour ne rien poser
  - {name: probability, type: text}
  - {name: min, type: text}
  - {name: constant_per_curve, type: text}          # true|false, vide pour ne rien poser

