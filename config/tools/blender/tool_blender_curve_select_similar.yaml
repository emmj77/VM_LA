tool: "blender_curve_select_similar"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Select similar curve points by property type"
machine: blender
op: curve.select_similar
ARGS:
  - {name: type, type: text}          # un de : TYPE | RADIUS | WEIGHT | DIRECTION
  - {name: compare, type: text}          # un de : EQUAL | GREATER | LESS
  - {name: threshold, type: text}

