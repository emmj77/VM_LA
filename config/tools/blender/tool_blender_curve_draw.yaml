tool: "blender_curve_draw"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Draw a freehand spline"
machine: blender
op: curve.draw
ARGS:
  - {name: error_threshold, type: text}
  - {name: fit_method, type: text}          # un de : REFIT | SPLIT
  - {name: corner_angle, type: text}
  - {name: use_cyclic, type: text}          # true|false, vide pour ne rien poser
  - {name: stroke, type: text}
  - {name: wait_for_input, type: text}          # true|false, vide pour ne rien poser

