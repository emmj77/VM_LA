tool: "blender_wm_batch_rename"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Rename multiple items at once"
machine: blender
op: wm.batch_rename
ARGS:
  - {name: data_type, type: text}          # un de : OBJECT | COLLECTION | MATERIAL | MESH | CURVE | META | VOLUME | GREASEPENCIL | ARMATURE | LATTICE | LIGHT | LIGHT_PROBE | CAMERA | SPEAKER | BONE | NODE | SEQUENCE_STRIP | ACTION_CLIP | SCENE | BRUSH
  - {name: data_source, type: text}          # un de : SELECT | ALL
  - {name: actions, type: text}

