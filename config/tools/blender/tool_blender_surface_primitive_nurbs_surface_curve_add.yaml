tool: "blender_surface_primitive_nurbs_surface_curve_add"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Construct a NURBS surface curve"
machine: blender
op: surface.primitive_nurbs_surface_curve_add
ARGS:
  - {name: radius, type: text}
  - {name: enter_editmode, type: text}          # true|false, vide pour ne rien poser
  - {name: align, type: text}          # un de : WORLD | VIEW | CURSOR
  - {name: location, type: text}          # 3 valeurs separees par des virgules
  - {name: rotation, type: text}          # 3 valeurs separees par des virgules
  - {name: scale, type: text}          # 3 valeurs separees par des virgules

