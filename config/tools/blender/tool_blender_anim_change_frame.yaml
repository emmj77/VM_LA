tool: "blender_anim_change_frame"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Interactively change the current frame number"
machine: blender
op: anim.change_frame
ARGS:
  - {name: frame, type: text}
  - {name: snap, type: text}          # true|false, vide pour ne rien poser
  - {name: seq_solo_preview, type: text}          # true|false, vide pour ne rien poser
  - {name: pass_through_on_strip_handles, type: text}          # true|false, vide pour ne rien poser

