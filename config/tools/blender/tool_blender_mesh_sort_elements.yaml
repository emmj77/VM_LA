tool: "blender_mesh_sort_elements"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "The order of selected vertices/edges/faces is modified, based on a given method"
machine: blender
op: mesh.sort_elements
ARGS:
  - {name: type, type: text}          # un de : VIEW_ZAXIS | VIEW_XAXIS | CURSOR_DISTANCE | MATERIAL | SELECTED | RANDOMIZE | REVERSE
  - {name: elements, type: text}          # un de : VERT | EDGE | FACE
  - {name: reverse, type: text}          # true|false, vide pour ne rien poser
  - {name: seed, type: int}

