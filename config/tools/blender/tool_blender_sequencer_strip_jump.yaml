tool: "blender_sequencer_strip_jump"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Move playhead to the next or previous edit point, which may be a strip handle or its center"
machine: blender
op: sequencer.strip_jump
ARGS:
  - {name: next, type: text}          # true|false, vide pour ne rien poser
  - {name: center, type: text}          # true|false, vide pour ne rien poser

