tool: "blender_wm_redraw_timer"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Simple redraw timer to test the speed of updating the interface"
machine: blender
op: wm.redraw_timer
ARGS:
  - {name: type, type: text}          # un de : DRAW | DRAW_SWAP | DRAW_WIN | DRAW_WIN_SWAP | ANIM_STEP | ANIM_PLAY | UNDO
  - {name: iterations, type: int}
  - {name: time_limit, type: text}

