tool: "blender_view3d_view_axis"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Use a preset viewpoint"
machine: blender
op: view3d.view_axis
ARGS:
  - {name: type, type: text}          # un de : LEFT | RIGHT | BOTTOM | TOP | FRONT | BACK
  - {name: align_active, type: text}          # true|false, vide pour ne rien poser
  - {name: relative, type: text}          # true|false, vide pour ne rien poser

