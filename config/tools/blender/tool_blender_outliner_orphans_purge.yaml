tool: "blender_outliner_orphans_purge"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Clear all orphaned data-blocks without any users from the file"
machine: blender
op: outliner.orphans_purge
ARGS:
