tool: "blender_object_hide_collection"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Show only objects in collection (Shift to extend)"
machine: blender
op: object.hide_collection
ARGS:
  - {name: collection_index, type: int}
  - {name: toggle, type: text}          # true|false, vide pour ne rien poser
  - {name: extend, type: text}          # true|false, vide pour ne rien poser

