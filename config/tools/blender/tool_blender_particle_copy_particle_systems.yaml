tool: "blender_particle_copy_particle_systems"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Copy particle systems from the active object to selected objects"
machine: blender
op: particle.copy_particle_systems
ARGS:
  - {name: space, type: text}          # un de : OBJECT | WORLD
  - {name: remove_target_particles, type: text}          # true|false, vide pour ne rien poser
  - {name: use_active, type: text}          # true|false, vide pour ne rien poser

