tool: "blender_geometry_color_attribute"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a mesh attribute: attribute_add | attribute_convert | attribute_remove | color_attribute_add | color_attribute_convert | color_attribute_duplicate | color_attribute_remove | color_attribute_render_set (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "geometry.{{op}}" --arg "data_type={{data_type}}" --arg "domain={{domain}}" --arg "name={{name}}" --arg "color={{color}}" --arg "mode={{mode}}"
ARGS:
  - {name: op, type: enum, values: [attribute_add, attribute_convert, attribute_remove, color_attribute_add, color_attribute_convert, color_attribute_duplicate, color_attribute_remove, color_attribute_render_set]}
  - {name: data_type, type: text}
  - {name: domain, type: text}
  - {name: name, type: text}
  - {name: color, type: text}
  - {name: mode, type: text}
