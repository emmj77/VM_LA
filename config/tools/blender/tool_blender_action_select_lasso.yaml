tool: "blender_action_select_lasso"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Select keyframe points using lasso selection"
machine: blender
op: action.select_lasso
ARGS:
  - {name: path, type: text}
  - {name: use_smooth_stroke, type: text}          # true|false, vide pour ne rien poser
  - {name: smooth_stroke_factor, type: text}
  - {name: smooth_stroke_radius, type: int}
  - {name: mode, type: text}          # un de : SET | ADD | SUB

