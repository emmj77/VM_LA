tool: "blender_sequencer_add_scene_strip_from_scene_asset"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Add a strip using a duplicate of this scene asset as the source"
machine: blender
op: sequencer.add_scene_strip_from_scene_asset
ARGS:
  - {name: move_strips, type: text}          # true|false, vide pour ne rien poser
  - {name: frame_start, type: int}
  - {name: channel, type: int}
  - {name: replace_sel, type: text}          # true|false, vide pour ne rien poser
  - {name: overlap, type: text}          # true|false, vide pour ne rien poser
  - {name: overlap_shuffle_override, type: text}          # true|false, vide pour ne rien poser
  - {name: skip_locked_or_muted_channels, type: text}          # true|false, vide pour ne rien poser
  - {name: asset_library_type, type: text}          # un de : ALL | LOCAL | ESSENTIALS | ONLINE_ESSENTIALS | CUSTOM
  - {name: asset_library_identifier, type: text}
  - {name: relative_asset_identifier, type: text}

