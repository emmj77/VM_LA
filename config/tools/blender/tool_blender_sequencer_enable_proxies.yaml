tool: "blender_sequencer_enable_proxies"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Enable selected proxies on all selected Movie and Image strips"
machine: blender
op: sequencer.enable_proxies
ARGS:
  - {name: proxy_25, type: text}          # true|false, vide pour ne rien poser
  - {name: proxy_50, type: text}          # true|false, vide pour ne rien poser
  - {name: proxy_75, type: text}          # true|false, vide pour ne rien poser
  - {name: proxy_100, type: text}          # true|false, vide pour ne rien poser
  - {name: overwrite, type: text}          # true|false, vide pour ne rien poser

