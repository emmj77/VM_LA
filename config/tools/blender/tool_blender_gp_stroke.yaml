tool: "blender_gp_stroke"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a grease pencil stroke: material_set | merge_by_distance | reset_vertex_color | simplify | smooth | split | subdivide | subdivide_smooth | switch_direction | trim (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "grease_pencil.stroke_{{op}}" --arg "factor={{factor}}" --arg "mode={{mode}}" --arg "GREASE_PENCIL_OT_stroke_smooth={{GREASE_PENCIL_OT_stroke_smooth}}" --arg "GREASE_PENCIL_OT_stroke_subdivide={{GREASE_PENCIL_OT_stroke_subdivide}}" --arg "distance={{distance}}" --arg "iterations={{iterations}}" --arg "keep_shape={{keep_shape}}" --arg "length={{length}}" --arg "material={{material}}" --arg "number_cuts={{number_cuts}}" --arg "only_selected={{only_selected}}" --arg "path={{path}}" --arg "smooth_ends={{smooth_ends}}" --arg "smooth_opacity={{smooth_opacity}}" --arg "smooth_position={{smooth_position}}" --arg "smooth_radius={{smooth_radius}}" --arg "smooth_stroke_factor={{smooth_stroke_factor}}" --arg "smooth_stroke_radius={{smooth_stroke_radius}}" --arg "steps={{steps}}" --arg "threshold={{threshold}}" --arg "use_smooth_stroke={{use_smooth_stroke}}" --arg "use_unselected={{use_unselected}}"
ARGS:
  - {name: op, type: enum, values: [material_set, merge_by_distance, reset_vertex_color, simplify, smooth, split, subdivide, subdivide_smooth, switch_direction, trim]}
  - {name: factor, type: text}
  - {name: mode, type: text}
  - {name: GREASE_PENCIL_OT_stroke_smooth, type: text}
  - {name: GREASE_PENCIL_OT_stroke_subdivide, type: text}
  - {name: distance, type: text}
  - {name: iterations, type: int}
  - {name: keep_shape, type: text}
  - {name: length, type: text}
  - {name: material, type: text}
  - {name: number_cuts, type: int}
  - {name: only_selected, type: text}
  - {name: path, type: text}
  - {name: smooth_ends, type: text}
  - {name: smooth_opacity, type: text}
  - {name: smooth_position, type: text}
  - {name: smooth_radius, type: text}
  - {name: smooth_stroke_factor, type: text}
  - {name: smooth_stroke_radius, type: int}
  - {name: steps, type: int}
  - {name: threshold, type: text}
  - {name: use_smooth_stroke, type: text}
  - {name: use_unselected, type: text}
