tool: "blender_brush_asset"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a brush asset: activate | delete | edit_metadata | load_preview | revert | save | save_as (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "brush.asset_{{op}}" --arg "catalog_path={{catalog_path}}" --arg "asset_library_identifier={{asset_library_identifier}}" --arg "asset_library_reference={{asset_library_reference}}" --arg "asset_library_type={{asset_library_type}}" --arg "author={{author}}" --arg "description={{description}}" --arg "filepath={{filepath}}" --arg "filter_blenlib={{filter_blenlib}}" --arg "filter_obj={{filter_obj}}" --arg "filter_usd={{filter_usd}}" --arg "name={{name}}" --arg "relative_asset_identifier={{relative_asset_identifier}}" --arg "show_multiview={{show_multiview}}" --arg "use_toggle={{use_toggle}}" --arg "check_existing={{check_existing}}" --arg "display_type={{display_type}}" --arg "filemode={{filemode}}" --arg "filter_alembic={{filter_alembic}}" --arg "filter_archive={{filter_archive}}" --arg "filter_backup={{filter_backup}}" --arg "filter_blender={{filter_blender}}" --arg "filter_btx={{filter_btx}}" --arg "filter_folder={{filter_folder}}" --arg "filter_font={{filter_font}}" --arg "filter_image={{filter_image}}" --arg "filter_movie={{filter_movie}}" --arg "filter_python={{filter_python}}" --arg "filter_sound={{filter_sound}}" --arg "filter_text={{filter_text}}" --arg "filter_volume={{filter_volume}}" --arg "hide_props_region={{hide_props_region}}" --arg "sort_method={{sort_method}}" --arg "use_multiview={{use_multiview}}"
ARGS:
  - {name: op, type: enum, values: [activate, delete, edit_metadata, load_preview, revert, save, save_as]}
  - {name: catalog_path, type: text}
  - {name: asset_library_identifier, type: text}
  - {name: asset_library_reference, type: text}
  - {name: asset_library_type, type: text}
  - {name: author, type: text}
  - {name: description, type: text}
  - {name: filepath, type: text}
  - {name: filter_blenlib, type: text}
  - {name: filter_obj, type: text}
  - {name: filter_usd, type: text}
  - {name: name, type: text}
  - {name: relative_asset_identifier, type: text}
  - {name: show_multiview, type: text}
  - {name: use_toggle, type: text}
  - {name: check_existing, type: text}
  - {name: display_type, type: text}
  - {name: filemode, type: int}
  - {name: filter_alembic, type: text}
  - {name: filter_archive, type: text}
  - {name: filter_backup, type: text}
  - {name: filter_blender, type: text}
  - {name: filter_btx, type: text}
  - {name: filter_folder, type: text}
  - {name: filter_font, type: text}
  - {name: filter_image, type: text}
  - {name: filter_movie, type: text}
  - {name: filter_python, type: text}
  - {name: filter_sound, type: text}
  - {name: filter_text, type: text}
  - {name: filter_volume, type: text}
  - {name: hide_props_region, type: text}
  - {name: sort_method, type: text}
  - {name: use_multiview, type: text}
