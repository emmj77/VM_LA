tool: "blender_uv_project"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a UV projection: cube | cylinder | smart | sphere (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "uv.{{op}}_project" --arg "correct_aspect={{correct_aspect}}" --arg "scale_to_bounds={{scale_to_bounds}}" --arg "clip_to_bounds={{clip_to_bounds}}" --arg "align={{align}}" --arg "direction={{direction}}" --arg "pole={{pole}}" --arg "seam={{seam}}" --arg "angle_limit={{angle_limit}}" --arg "area_weight={{area_weight}}" --arg "cube_size={{cube_size}}" --arg "island_margin={{island_margin}}" --arg "margin_method={{margin_method}}" --arg "radius={{radius}}" --arg "rotate_method={{rotate_method}}"
ARGS:
  - {name: op, type: enum, values: [cube, cylinder, smart, sphere]}
  - {name: correct_aspect, type: text}
  - {name: scale_to_bounds, type: text}
  - {name: clip_to_bounds, type: text}
  - {name: align, type: text}
  - {name: direction, type: text}
  - {name: pole, type: text}
  - {name: seam, type: text}
  - {name: angle_limit, type: text}
  - {name: area_weight, type: text}
  - {name: cube_size, type: text}
  - {name: island_margin, type: text}
  - {name: margin_method, type: text}
  - {name: radius, type: text}
  - {name: rotate_method, type: text}
