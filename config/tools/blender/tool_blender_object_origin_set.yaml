tool: "blender_object_origin_set"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Set the object's origin, by either moving the data, or set to center of data, or use 3D cursor"
machine: blender
op: object.origin_set
ARGS:
  - {name: type, type: text}          # un de : GEOMETRY_ORIGIN | ORIGIN_GEOMETRY | ORIGIN_CURSOR | ORIGIN_CENTER_OF_MASS | ORIGIN_CENTER_OF_VOLUME
  - {name: center, type: text}          # un de : MEDIAN | BOUNDS

