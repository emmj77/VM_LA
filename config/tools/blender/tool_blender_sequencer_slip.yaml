tool: "blender_sequencer_slip"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Slip the contents of selected strips"
machine: blender
op: sequencer.slip
ARGS:
  - {name: offset, type: text}
  - {name: slip_keyframes, type: text}          # true|false, vide pour ne rien poser
  - {name: use_cursor_position, type: text}          # true|false, vide pour ne rien poser
  - {name: ignore_connections, type: text}          # true|false, vide pour ne rien poser

