tool: "blender_sequencer_strip_add"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a sequencer strip: effect | image | mask | movie | movieclip | scene | sound (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "sequencer.{{op}}_strip_add" --arg "channel={{channel}}" --arg "frame_start={{frame_start}}" --arg "move_strips={{move_strips}}" --arg "overlap={{overlap}}" --arg "overlap_shuffle_override={{overlap_shuffle_override}}" --arg "replace_sel={{replace_sel}}" --arg "skip_locked_or_muted_channels={{skip_locked_or_muted_channels}}" --arg "directory={{directory}}" --arg "files={{files}}" --arg "filter_blenlib={{filter_blenlib}}" --arg "filter_obj={{filter_obj}}" --arg "filter_usd={{filter_usd}}" --arg "filepath={{filepath}}" --arg "fit_method={{fit_method}}" --arg "length={{length}}" --arg "set_view_transform={{set_view_transform}}" --arg "show_multiview={{show_multiview}}" --arg "adjust_playback_rate={{adjust_playback_rate}}" --arg "cache={{cache}}" --arg "clip={{clip}}" --arg "color={{color}}" --arg "height={{height}}" --arg "image_import_type={{image_import_type}}" --arg "mask={{mask}}" --arg "mono={{mono}}" --arg "scene={{scene}}" --arg "sound={{sound}}" --arg "type={{type}}" --arg "use_framerate={{use_framerate}}" --arg "use_placeholders={{use_placeholders}}" --arg "use_sequence_detection={{use_sequence_detection}}" --arg "width={{width}}" --arg "check_existing={{check_existing}}" --arg "display_type={{display_type}}" --arg "filemode={{filemode}}" --arg "filter_alembic={{filter_alembic}}" --arg "filter_archive={{filter_archive}}" --arg "filter_backup={{filter_backup}}" --arg "filter_blender={{filter_blender}}" --arg "filter_btx={{filter_btx}}" --arg "filter_folder={{filter_folder}}" --arg "filter_font={{filter_font}}" --arg "filter_image={{filter_image}}" --arg "filter_movie={{filter_movie}}" --arg "filter_python={{filter_python}}" --arg "filter_sound={{filter_sound}}" --arg "filter_text={{filter_text}}" --arg "filter_volume={{filter_volume}}" --arg "relative_path={{relative_path}}" --arg "sort_method={{sort_method}}" --arg "use_multiview={{use_multiview}}"
ARGS:
  - {name: op, type: enum, values: [effect, image, mask, movie, movieclip, scene, sound]}
  - {name: channel, type: int}
  - {name: frame_start, type: int}
  - {name: move_strips, type: text}
  - {name: overlap, type: text}
  - {name: overlap_shuffle_override, type: text}
  - {name: replace_sel, type: text}
  - {name: skip_locked_or_muted_channels, type: text}
  - {name: directory, type: text}
  - {name: files, type: text}
  - {name: filter_blenlib, type: text}
  - {name: filter_obj, type: text}
  - {name: filter_usd, type: text}
  - {name: filepath, type: text}
  - {name: fit_method, type: text}
  - {name: length, type: int}
  - {name: set_view_transform, type: text}
  - {name: show_multiview, type: text}
  - {name: adjust_playback_rate, type: text}
  - {name: cache, type: text}
  - {name: clip, type: text}
  - {name: color, type: text}
  - {name: height, type: int}
  - {name: image_import_type, type: text}
  - {name: mask, type: text}
  - {name: mono, type: text}
  - {name: scene, type: text}
  - {name: sound, type: text}
  - {name: type, type: text}
  - {name: use_framerate, type: text}
  - {name: use_placeholders, type: text}
  - {name: use_sequence_detection, type: text}
  - {name: width, type: int}
  - {name: check_existing, type: text}
  - {name: display_type, type: text}
  - {name: filemode, type: int}
  - {name: filter_alembic, type: text}
  - {name: filter_archive, type: text}
  - {name: filter_backup, type: text}
  - {name: filter_blender, type: text}
  - {name: filter_btx, type: text}
  - {name: filter_folder, type: text}
  - {name: filter_font, type: text}
  - {name: filter_image, type: text}
  - {name: filter_movie, type: text}
  - {name: filter_python, type: text}
  - {name: filter_sound, type: text}
  - {name: filter_text, type: text}
  - {name: filter_volume, type: text}
  - {name: relative_path, type: text}
  - {name: sort_method, type: text}
  - {name: use_multiview, type: text}
