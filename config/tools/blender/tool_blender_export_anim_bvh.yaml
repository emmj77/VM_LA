tool: "blender_export_anim_bvh"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Save a BVH motion capture file from an armature"
machine: blender
op: export_anim.bvh
ARGS:
  - {name: filepath, type: text}
  - {name: check_existing, type: text}          # true|false, vide pour ne rien poser
  - {name: filter_glob, type: text}
  - {name: global_scale, type: text}
  - {name: frame_start, type: int}
  - {name: frame_end, type: int}
  - {name: rotate_mode, type: text}          # un de : NATIVE | XYZ | XZY | YXZ | YZX | ZXY | ZYX
  - {name: root_transform_only, type: text}          # true|false, vide pour ne rien poser
  - {name: sort_children_by_names, type: text}          # true|false, vide pour ne rien poser

