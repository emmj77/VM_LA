tool: "blender_sculpt_mask"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a sculpt mask: by_color | filter | from_boundary | from_cavity | init (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "sculpt.mask_{{op}}" --arg "invert={{invert}}" --arg "mix_factor={{mix_factor}}" --arg "mix_mode={{mix_mode}}" --arg "settings_source={{settings_source}}" --arg "auto_iteration_count={{auto_iteration_count}}" --arg "blur_steps={{blur_steps}}" --arg "boundary_mode={{boundary_mode}}" --arg "contiguous={{contiguous}}" --arg "factor={{factor}}" --arg "filter_type={{filter_type}}" --arg "iterations={{iterations}}" --arg "location={{location}}" --arg "mode={{mode}}" --arg "preserve_previous_mask={{preserve_previous_mask}}" --arg "propagation_steps={{propagation_steps}}" --arg "threshold={{threshold}}" --arg "use_curve={{use_curve}}"
ARGS:
  - {name: op, type: enum, values: [by_color, filter, from_boundary, from_cavity, init]}
  - {name: invert, type: text}
  - {name: mix_factor, type: text}
  - {name: mix_mode, type: text}
  - {name: settings_source, type: text}
  - {name: auto_iteration_count, type: text}
  - {name: blur_steps, type: int}
  - {name: boundary_mode, type: text}
  - {name: contiguous, type: text}
  - {name: factor, type: text}
  - {name: filter_type, type: text}
  - {name: iterations, type: int}
  - {name: location, type: int}
  - {name: mode, type: text}
  - {name: preserve_previous_mask, type: text}
  - {name: propagation_steps, type: int}
  - {name: threshold, type: text}
  - {name: use_curve, type: text}
