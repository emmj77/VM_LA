tool: "blender_constraint_move_to_index"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Change the constraint's position in the list so it evaluates after the set number of others"
machine: blender
op: constraint.move_to_index
ARGS:
  - {name: constraint, type: text}
  - {name: owner, type: text}          # un de : OBJECT | BONE
  - {name: index, type: int}

