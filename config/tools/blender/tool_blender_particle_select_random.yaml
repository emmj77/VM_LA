tool: "blender_particle_select_random"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Select a randomly distributed set of hair or points"
machine: blender
op: particle.select_random
ARGS:
  - {name: ratio, type: text}
  - {name: seed, type: int}
  - {name: action, type: text}          # un de : SELECT | DESELECT
  - {name: type, type: text}          # un de : HAIR | POINTS

