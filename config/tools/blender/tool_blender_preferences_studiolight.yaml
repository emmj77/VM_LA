tool: "blender_preferences_studiolight"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a studio light: copy_settings | install | new | uninstall (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "preferences.studiolight_{{op}}" --arg "index={{index}}" --arg "directory={{directory}}" --arg "filename={{filename}}" --arg "files={{files}}" --arg "type={{type}}" --arg "filter_folder={{filter_folder}}" --arg "filter_glob={{filter_glob}}"
ARGS:
  - {name: op, type: enum, values: [copy_settings, install, new, uninstall]}
  - {name: index, type: int}
  - {name: directory, type: text}
  - {name: filename, type: text}
  - {name: files, type: text}
  - {name: type, type: text}
  - {name: filter_folder, type: text}
  - {name: filter_glob, type: text}
