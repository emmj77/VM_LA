tool: "blender_object_select_grouped"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Select all visible objects grouped by various properties"
machine: blender
op: object.select_grouped
ARGS:
  - {name: extend, type: text}          # true|false, vide pour ne rien poser
  - {name: type, type: text}          # un de : CHILDREN_RECURSIVE | CHILDREN | PARENT | SIBLINGS | TYPE | COLLECTION | HOOK | PASS | COLOR | KEYINGSET | LIGHT_TYPE

