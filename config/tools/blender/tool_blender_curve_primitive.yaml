tool: "blender_curve_primitive"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a curve primitive: bezier_circle | bezier_curve | nurbs_circle | nurbs_curve | nurbs_path (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "curve.primitive_{{op}}_add" --arg "align={{align}}" --arg "enter_editmode={{enter_editmode}}" --arg "location={{location}}" --arg "radius={{radius}}" --arg "rotation={{rotation}}" --arg "scale={{scale}}"
ARGS:
  - {name: op, type: enum, values: [bezier_circle, bezier_curve, nurbs_circle, nurbs_curve, nurbs_path]}
  - {name: align, type: text}
  - {name: enter_editmode, type: text}
  - {name: location, type: text}
  - {name: radius, type: text}
  - {name: rotation, type: text}
  - {name: scale, type: text}
