tool: "blender_mesh_remove_doubles"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Merge vertices based on their proximity"
machine: blender
op: mesh.remove_doubles
ARGS:
  - {name: threshold, type: text}
  - {name: use_centroid, type: text}          # true|false, vide pour ne rien poser
  - {name: use_unselected, type: text}          # true|false, vide pour ne rien poser
  - {name: use_sharp_edge_from_normals, type: text}          # true|false, vide pour ne rien poser

