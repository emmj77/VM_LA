tool: "blender_graph_select_key_handles"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "For selected keyframes, select/deselect any combination of the key itself and its handles"
machine: blender
op: graph.select_key_handles
ARGS:
  - {name: left_handle_action, type: text}          # un de : SELECT | DESELECT | KEEP
  - {name: right_handle_action, type: text}          # un de : SELECT | DESELECT | KEEP
  - {name: key_action, type: text}          # un de : SELECT | DESELECT | KEEP

