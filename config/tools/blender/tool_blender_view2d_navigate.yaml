tool: "blender_view2d_navigate"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a 2D view (pan, zoom, scroll): edge_pan | ndof | pan | reset | scroll_down | scroll_left | scroll_right | scroll_up | scroller_activate | smoothview | zoom | zoom_border | zoom_in | zoom_out (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "view2d.{{op}}" --arg "deltax={{deltax}}" --arg "deltay={{deltay}}" --arg "page={{page}}" --arg "wait_for_input={{wait_for_input}}" --arg "xmax={{xmax}}" --arg "xmin={{xmin}}" --arg "ymax={{ymax}}" --arg "ymin={{ymin}}" --arg "zoomfacx={{zoomfacx}}" --arg "zoomfacy={{zoomfacy}}" --arg "delay={{delay}}" --arg "inside_padding={{inside_padding}}" --arg "max_speed={{max_speed}}" --arg "outside_padding={{outside_padding}}" --arg "speed_ramp={{speed_ramp}}" --arg "use_cursor_init={{use_cursor_init}}" --arg "zoom_influence={{zoom_influence}}" --arg "zoom_out={{zoom_out}}"
ARGS:
  - {name: op, type: enum, values: [edge_pan, ndof, pan, reset, scroll_down, scroll_left, scroll_right, scroll_up, scroller_activate, smoothview, zoom, zoom_border, zoom_in, zoom_out]}
  - {name: deltax, type: text}
  - {name: deltay, type: text}
  - {name: page, type: text}
  - {name: wait_for_input, type: text}
  - {name: xmax, type: int}
  - {name: xmin, type: int}
  - {name: ymax, type: int}
  - {name: ymin, type: int}
  - {name: zoomfacx, type: text}
  - {name: zoomfacy, type: text}
  - {name: delay, type: text}
  - {name: inside_padding, type: text}
  - {name: max_speed, type: text}
  - {name: outside_padding, type: text}
  - {name: speed_ramp, type: text}
  - {name: use_cursor_init, type: text}
  - {name: zoom_influence, type: text}
  - {name: zoom_out, type: text}
