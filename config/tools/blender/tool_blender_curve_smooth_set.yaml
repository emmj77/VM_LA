tool: "blender_curve_smooth_set"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "the radius, tilt or weight of a curve point: radius | tilt | weight (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "curve.smooth_{{op}}"
ARGS:
  - {name: op, type: enum, values: [radius, tilt, weight]}
