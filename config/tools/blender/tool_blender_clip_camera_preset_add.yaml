tool: "blender_clip_camera_preset_add"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Add or remove a Tracking Camera Intrinsics Preset"
machine: blender
op: clip.camera_preset_add
ARGS:
  - {name: name, type: text}
  - {name: remove_name, type: text}          # true|false, vide pour ne rien poser
  - {name: remove_active, type: text}          # true|false, vide pour ne rien poser
  - {name: use_focal_length, type: text}          # true|false, vide pour ne rien poser

