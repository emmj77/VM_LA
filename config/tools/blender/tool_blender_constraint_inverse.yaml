tool: "blender_constraint_inverse"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a constraint inverse: childof_clear | childof_set | objectsolver_clear | objectsolver_set (op picks which)"
COMMAND: |
  exec dash "$ROOT/config/engine/engine.sh" carrier blender --op "constraint.{{op}}_inverse" --arg "constraint={{constraint}}" --arg "owner={{owner}}"
ARGS:
  - {name: op, type: enum, values: [childof_clear, childof_set, objectsolver_clear, objectsolver_set]}
  - {name: constraint, type: text}
  - {name: owner, type: text}
