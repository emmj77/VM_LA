tool: "blender_image_invert"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Invert image's channels"
machine: blender
op: image.invert
ARGS:
  - {name: invert_r, type: text}          # true|false, vide pour ne rien poser
  - {name: invert_g, type: text}          # true|false, vide pour ne rien poser
  - {name: invert_b, type: text}          # true|false, vide pour ne rien poser
  - {name: invert_a, type: text}          # true|false, vide pour ne rien poser

