tool: "blender_mesh_bridge_edge_loops"
doc: blender
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Create a bridge of faces between two or more selected edge loops"
machine: blender
op: mesh.bridge_edge_loops
ARGS:
  - {name: type, type: text}          # un de : SINGLE | CLOSED | PAIRS
  - {name: use_merge, type: text}          # true|false, vide pour ne rien poser
  - {name: merge_factor, type: text}
  - {name: twist_offset, type: int}
  - {name: number_cuts, type: int}
  - {name: interpolation, type: text}          # un de : LINEAR | PATH | SURFACE
  - {name: smoothness, type: text}
  - {name: profile_shape_factor, type: text}
  - {name: profile_shape, type: text}          # un de : SMOOTH | SPHERE | ROOT | INVERSE_SQUARE | SHARP | LINEAR

