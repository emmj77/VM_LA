# QUI : OUVRE un programme qui est deja la (commande du PATH, ou un chemin absolu, ou une AppImage
#       posee dans ~/Applications).
# ORIGINE : demande de Moussa (17/10). C'est le geste qui ne touche a RIEN : il n'installe pas, il ne
#          retire pas, il n'ecrit pas dans le programme -- il le lance et il dit ce qu'il est advenu.
# REFUSE : une forme qui n'est pas un nom de programme ni un chemin absolu (donc aucun espace, aucun
#          metacharactere, aucun texte libre : le nom part dans une ligne de commande) ; un programme
#          INTROUVABLE -- et alors il dit OU il a cherche, et ce qu'il a trouve d'approchant.
# CE QU'IL DIT : si le programme tourne encore une seconde apres, son PID ; s'il a rendu la main tout
#          de suite, sa premiere ligne de sortie (c'est la que se lit « cannot open display »).
tool: "open_program"
date: "2026-10-17"
tags: ["open_program", "ouvrir", "lancer", "program-manage"]

RULES:
  enabled: true
  timeout: 120

DESCRIPTION: "opens a program that already exists and says what became of it"

COMMAND: |
  LC_ALL=C; export LC_ALL
  N="{{name}}"
  case "$N" in
    '') echo 'refuse : il faut nommer le programme a ouvrir' >&2 ; exit 1 ;;
  esac
  # LA FORME : un nom, ou un chemin absolu. Le nom part dans une ligne de commande -- il est donc
  # juge comme un nom. Un espace, un point-virgule, un dollar, un accent grave n'entrent pas ici.
  case "$N" in
    /*)
      case "$N" in *[!A-Za-z0-9/_.+-]*) echo "refuse : « $N » porte un caractere qui n entre pas dans un chemin (lettres, chiffres, / _ . + - seulement)" >&2 ; exit 1 ;; esac
      ;;
    *)
      case "$N" in *[!a-z0-9_.+-]*) echo "refuse : « $N » n est pas un nom de programme (minuscules, chiffres, _ . + - seulement)" >&2 ; exit 1 ;; esac
      ;;
  esac
  O=
  # 1. LE PATH. 2. LE CHEMIN DONNE. 3. ~/Applications, deux niveaux : c'est la que vivent les
  # AppImages de cette machine, et un programme pose la n'a pas d'autre nom que son fichier.
  if command -v "$N" >/dev/null 2>&1; then
    O=$(command -v "$N")
  elif [ -x "$N" ] && [ ! -d "$N" ]; then
    O=$N
  else
    APPS="$HOME/Applications"
    if [ -d "$APPS" ]; then
      O=$(find "$APPS" -maxdepth 2 -name "$(basename -- "$N")*" -type f -perm -u+x 2>/dev/null | sort | head -n 1)
    fi
    if [ -z "$O" ]; then
      AP=$(find "$APPS" -maxdepth 2 -type f -perm -u+x 2>/dev/null | sed -n 's#.*/##p' | sort -u | head -n 12 | tr '\n' ' ')
      echo "refuse : « $N » est introuvable. Cherche : le PATH, le chemin donne, et $APPS (deux niveaux)." >&2
      [ -n "$AP" ] && echo "         Ce qui est pose dans ~/Applications : $AP" >&2
      exit 1
    fi
  fi
  L="$ROOT/work/ouvert.log"
  mkdir -p "$ROOT/work" 2>/dev/null
  : > "$L" 2>/dev/null
  setsid "$O" >"$L" 2>&1 </dev/null &
  PID=$!
  sleep 1
  if kill -0 "$PID" 2>/dev/null; then
    printf 'ouvert : %s (PID %s) ; il tourne ; sa sortie va dans work/ouvert.log\n' "$O" "$PID"
  else
    printf 'ouvert : %s ; il a rendu la main tout de suite\n' "$O"
    D=$(head -n 1 "$L" 2>/dev/null | cut -c1-160)
    [ -n "$D" ] && printf 'ce qu il a dit : %s\n' "$D"
  fi

ARGS:
  - {name: name, type: text}
