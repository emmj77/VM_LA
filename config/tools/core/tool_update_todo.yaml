tool: "update_todo"
date: "2026-10-17"
tags: ["update_todo", "plan"]
RULES:
  enabled: true
  timeout: 600
DESCRIPTION: "advances the plan of the skill : the CURRENT point is done (a call imposed by the engine may pass its state)"
COMMAND: |
  ST="{{state}}"
  [ -n "$ST" ] || ST=complete
  case "$ST" in
    progress|complete) ;;
    *) printf '%s\n' "$(msg unknown_state_st_progress "$ST")" >&2 ; exit 1 ;;
  esac
  [ -x "$PROCS/plan.sh" ] || { echo "refused: the plan brick is missing ($PROCS/plan.sh)" >&2 ; exit 1 ; }
  "$PROCS/plan.sh" progress "$ST"

ARGS:
  - {name: state, type: text}
