# QUI : loads a chosen part of the memory or of the sessions, by exchange number
# ORIGINE : migre tel quel de la ligne 179 du registre (2026-10-17). Le corps n'a PAS ete reecrit ici.
# REFUSE : (a completer par l'auteur -- ce que ce tool refuse, en le nommant)
tool: "load_memory"
date: "2026-10-17"
tags: ["load_memory"]

RULES:
  enabled: true
  timeout: 600

DESCRIPTION: "loads a chosen part of the memory or of the sessions, by exchange number"

COMMAND: |
  # LOAD_MEMORY CHARGE LA PARTIE DEMANDEE, de l'une ou l'autre : jamais les deux.
  #   memory   -> la TABLE (le sommaire de l'echange)
  #   sessions -> le CORPS (les lignes brutes de l'echange)
  # La CLE est l'ECHANGE : c'est le lien entre les deux bases, et le seul nombre qui aille
  # des deux cotes. Rien trouve se DIT : jamais un silence.
  S="{{source}}"; K={{key}}
  case "$S" in
    memory)
      M=${LA_MEMORY_DB:-$ROOT/config/memory.db}
      [ -f "$M" ] || { echo "refuse : la base de memoire est introuvable ($M)" >&2; exit 1; }
      N=$(sqlite3 "$M" "SELECT count(*) FROM memory WHERE exchange = $K;" 2>/dev/null || printf '')
      case "${N:-}" in ''|*[!0-9]*) N=0 ;; esac
      [ "$N" -gt 0 ] || { echo "refuse : aucun echange $K dans la table de memoire" >&2; exit 1; }
      sqlite3 -line "$M" "SELECT id, exchange, stamp, human, agent FROM memory WHERE exchange = $K ORDER BY id;" 2>/dev/null
      ;;
    sessions)
      D=${LA_SESSIONS_DB:-$ROOT/config/sessions.db}
      [ -f "$D" ] || { echo "refuse : le corps des sessions est introuvable ($D)" >&2; exit 1; }
      N=$(sqlite3 "$D" "SELECT count(*) FROM messages WHERE exchange = $K;" 2>/dev/null || printf '')
      case "${N:-}" in ''|*[!0-9]*) N=0 ;; esac
      [ "$N" -gt 0 ] || { echo "refuse : aucun echange $K dans le corps des sessions" >&2; exit 1; }
      sqlite3 -line "$D" "SELECT id, exchange, ts, role, substr(content, 1, 4000) AS content FROM messages WHERE exchange = $K ORDER BY id;" 2>/dev/null
      ;;
    *) echo "refuse : source hors liste ($S) ; memory ou sessions" >&2; exit 1 ;;
  esac

ARGS:
  - {name: source, type: text}
  - {name: key, type: int}
