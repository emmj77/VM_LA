# QUI : manages a skill : creation, one tool per field, load, remove, list
# ORIGINE : migre tel quel de la ligne 126 du registre (2026-10-17). Le corps n'a PAS ete reecrit ici.
# REFUSE : (a completer par l'auteur -- ce que ce tool refuse, en le nommant)
tool: "skill_manage"
date: "2026-10-17"
tags: ["skill_manage"]

RULES:
  enabled: true
  timeout: 600

DESCRIPTION: "manages a skill : creation, one tool per field, load, remove, list"

COMMAND: |
  LC_ALL=C; export LC_ALL
  A="{{action}}"
  NAME="{{name}}"
  SK="$ROOT/skills"
  SM="$ROOT/config/templates/skill_template.yaml"
  [ -d "$SK" ] || { echo "refuse : skills/ introuvable ; la portee du tool n existe pas ($SK)" >&2; exit 1; }
  SLUG=$(printf '%s' "$NAME" | tr 'A-Z' 'a-z' | tr -cs 'a-z0-9' '-' | sed -e 's/^-*//' -e 's/-*$//' | cut -c1-40 | sed -e 's/-*$//')
  if [ -z "$SLUG" ] && [ "$A" != skill_list ]; then echo "refuse : name hors form (${NAME:-absent}) ; il ne donne aucun slug utilisable" >&2; exit 1; fi
  CH=$(sed -n 's/^[[:space:]]*chars:[[:space:]]*\([0-9][0-9]*\).*$/\1/p' -- "$SM" | head -n 1)
  case "$CH" in ''|*[!0-9]*) CH=100 ;; esac
  CL=$(sed -n 's/^[[:space:]]*lines:[[:space:]]*\([0-9][0-9]*\).*$/\1/p' -- "$SM" | head -n 1)
  case "$CL" in ''|*[!0-9]*) CL=50 ;; esac
  # LA MARQUE : un skill ECRIT PAR L AGENT porte source: agent. Le source du moule, lui,
  # dit a QUI le moule appartient (humain) -- ce n'est pas ce qu un skill doit porter.
  MARK=agent
  D="$SK/$SLUG"
  C="$D/skill.yaml"
  bytes() { printf '%s' "$1" | wc -c | tr -d ' '; }
  foldv() {
    set -f
    L="$1"; P=non
    for W in $3; do
      if [ "$P" = non ]; then L="$L$W"; P=oui; continue; fi
      if [ $(( ${#L} + 1 + ${#W} )) -le "$CH" ]; then L="$L $W"; continue; fi
      printf '%s\n' "$L"; L="$2$W"
    done
    printf '%s\n' "$L"
    set +f
  }
  pose() {
    I=0
    printf '%s\n' "$1" | while IFS= read -r V; do
      V=$(printf '%s' "$V" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
      [ -n "$V" ] || continue
      I=$((I+1))
      foldv "  $((100+I)): " "    " "$V"
    done
  }
  relit() {
    FL=; NO=0
    while IFS= read -r L; do
      NO=$((NO+1))
      if [ "$(bytes "$L")" -gt "$CH" ]; then FL=$NO; break; fi
    done < "$1"
    printf '%s' "$FL"
  }
  block() {
    F="$1"; K="$2"; R="$3"
    DEB=; END=; NO=0; VU=non
    while IFS= read -r L; do
      NO=$((NO+1))
      if [ "$VU" = non ]; then
        case "$L" in "$K":*) DEB=$NO; VU=oui ;; esac
        continue
      fi
      case "$L" in ' '*) ;; *) END=$NO; break ;; esac
    done < "$F"
    [ -n "$DEB" ] || return 1
    [ -n "$END" ] || END=$((NO+1))
    T="$F.$$.tmp"
    { head -n "$((DEB-1))" -- "$F"; printf '%s\n' "$R"; tail -n "+$END" -- "$F"; } > "$T" || return 1
    [ -s "$T" ] || { rm -f "$T"; return 1; }
    FL=$(relit "$T")
    [ -z "$FL" ] || { rm -f "$T"; echo "refuse : la ligne $FL depasse $CH bytes (LC_ALL=C) ; rien n est ecrit" >&2; exit 1; }
    mv -f "$T" "$F" || { rm -f "$T"; return 1; }
    return 0
  }
  place() {
    if [ -L "$D" ]; then echo "refuse : la cible est un lien symbolique (skills/$SLUG)" >&2; exit 1; fi
    [ -d "$D" ] || { echo "refuse : LE SKILL N EXISTS PAS (skills/$SLUG/skill.yaml)" >&2; exit 1; }
    if [ -L "$C" ]; then echo "refuse : la cible est un lien symbolique (skills/$SLUG/skill.yaml)" >&2; exit 1; fi
    [ -f "$C" ] || { echo "refuse : LE SKILL N EXISTS PAS (skills/$SLUG/skill.yaml)" >&2; exit 1; }
    [ -n "$MARK" ] || { echo "refuse : le template_file ne porte pas la marque d un skill (source: ...) : $SM" >&2; exit 1; }
    SRC_OWNER=$(sed -n 's/^source: *//p' -- "$C" | head -n 1 | tr -d '"' | sed -e 's/[[:space:]]*$//')
    if [ -z "$SRC_OWNER" ] || [ "$SRC_OWNER" != "$MARK" ]; then echo "refuse : un skill de l humain est en lecture seule ; il ne porte pas la marque du template_file (source: $MARK)" >&2; exit 1; fi
  }
  approve() {
    if [ "${LA_APPROVED:-0}" != 1 ]; then printf '%s\n' "approbation requise : $1"; exit 3; fi
  }
  mots() { printf '%s' "$1" | tr ',' '\n' | tr -s '[:space:]' '\n' | sed -e '/^[[:space:]]*$/d'; }
  a_tool() {
    [ -f "$LA_CONFIG" ] || return 1
    if jq -e . "$LA_CONFIG" >/dev/null 2>&1; then
      jq -e --arg g "$1" 'any(.tools[]?; ((.tool // .name) == $g))' "$LA_CONFIG" >/dev/null 2>&1
    else
      PAT="^[[:space:]]*tool:[[:space:]]*${1}[[:space:]]*\$"
      grep -q -- "$PAT" "$LA_CONFIG"
    fi
  }
  line_write() {   # $1 fichier  $2 id  $3 la ligne montee : ecrit UNE ligne, par son id
    F="$1"; ID="$2"; R="$3"
    case "$ID" in
      1[0-9][0-9])      SEC=SUMMARY ; SUB=0 ;;
      2[0-9][0-9])      SEC=TOOLS  ; SUB=0 ;;
      3[0-9][0-9])      SEC=DOCS   ; SUB=0 ;;
      4[0-9][0-9])      SEC=PLAN   ; SUB=0 ;;
      6[0-9][0-9])      SEC=ERROR  ; SUB=0 ;;
      1[0-9][0-9][0-9]) SEC=SECTIONS ; SUB=1 ;;
      2[0-9][0-9][0-9]) SEC=SECTIONS ; SUB=2 ;;
      *) echo "refuse : l id $ID n entre dans aucune section (101 SUMMARY, 200 TOOLS, 300 DOCS, 400 PLAN, 600 ERROR, 1000+ SECTIONS)" >&2 ; exit 1 ;;
    esac
    T="$F.$$.tmp"
    awk -v id="$ID" -v new="$R" -v sec="$SEC" -v nth="$SUB" '
      function idof(s,  a) { if (match(s, /[0-9]+/)) return substr(s, RSTART, RLENGTH) + 0; return -1 }
      BEGIN { placed = 0 ; insec = 0 ; nsub = 0 }
      $0 ~ "^" sec ":" { if (insec && !placed) { print new ; placed = 1 } insec = 1 ; nsub = 0 ; print ; next }
      /^[A-Za-z_]+:/ { if (insec && !placed) { print new ; placed = 1 } insec = 0 ; print ; next }
      insec && nth > 0 && $0 ~ /^  SECTION:/ { nsub++ ; print ; next }
      insec && $0 ~ /^[[:space:]]*[0-9]+:/ {
        cur = idof($0)
        if (cur == id) { print new ; placed = 1 ; next }
        if (!placed && (nth == 0 || nsub == nth) && cur > id) { print new ; placed = 1 }
        print ; next
      }
      { print }
      END { if (!placed) print new }
    ' "$F" > "$T" || return 1
    [ -s "$T" ] || { rm -f "$T" ; return 1 ; }
    FL=$(relit "$T")
    [ -z "$FL" ] || { rm -f "$T" ; echo "refuse : la ligne $FL depasse $CH bytes (LC_ALL=C) ; rien n est ecrit" >&2 ; exit 1 ; }
    mv -f "$T" "$F" || { rm -f "$T" ; return 1 ; }
    return 0
  }
  case "$A" in
  set_line)   # UNE ligne, par son ID. Jamais le fichier, jamais deux lignes.
    place
    LINE_ID="{{id}}"
    case "$LINE_ID" in ''|*[!0-9]*) echo "refuse : l id est absent ou hors form (${LINE_ID:-rien}) ; une ligne s ecrit par son id" >&2 ; exit 1 ;; esac
    VALUE=$(cat)
    VALUE=$(printf '%s' "$VALUE" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
    [ -n "$VALUE" ] || { echo "refuse : value vide ; un id sans contenu ne s ecrit pas" >&2 ; exit 1 ; }
    R="  $LINE_ID: \"$VALUE\""
    [ "$(bytes "$R")" -le "$CH" ] || { echo "refuse : la ligne $LINE_ID depasse $CH bytes ($(bytes "$R"))" >&2 ; exit 1 ; }
    line_write "$C" "$LINE_ID" "$R" || { echo "refuse : ecriture impossible (skills/$SLUG/skill.yaml)" >&2 ; exit 1 ; }
    echo "skills/$SLUG/skill.yaml : ligne $LINE_ID posee ($(bytes "$R") bytes)"
    ;;
  create_skill)
    approve "creer le skill $SLUG ; skills/$SLUG/ nait du moule, ses champs restent vides"
    [ -f "$SM" ] || { echo "refuse : le template_file est introuvable ($SM)" >&2; exit 1; }
    [ -n "$MARK" ] || { echo "refuse : le template_file ne porte pas la marque d un skill (source: ...) : $SM" >&2; exit 1; }
    if [ -e "$D" ] || [ -L "$D" ]; then echo "refuse : le skill existe deja (skills/$SLUG) ; le template_file n ecrase jamais un skill" >&2; exit 1; fi
    mkdir "$D" || { echo "refuse : creation impossible (skills/$SLUG/)" >&2; exit 1; }
    DATE=$(date -u +%Y-%m-%d)
    OB=$(printf '\173\173'); CB=$(printf '\175\175')
    HN="${OB}name${CB}"; HD="${OB}date${CB}"
    sed -e "s|$HN|$SLUG|g" -e "s|$HD|$DATE|g" -- "$SM" > "$C" || { rm -f "$C"; rmdir "$D"; echo "refuse : le montage n a rien ecrit (skills/$SLUG/skill.yaml)" >&2; exit 1; }
    [ -s "$C" ] || { rm -f "$C"; rmdir "$D"; echo "refuse : le montage n a rien ecrit (skills/$SLUG/skill.yaml)" >&2; exit 1; }
    FL=$(relit "$C")
    [ -z "$FL" ] || { rm -f "$C"; rmdir "$D"; echo "refuse : la ligne $FL depasse $CH bytes (LC_ALL=C) ; ce qui venait d etre ecrit est retire" >&2; exit 1; }
    echo "skills/$SLUG/skill.yaml cree ; chaque champ se pose ensuite par son tool"
    ;;
  set_tags)
    place
    VALUE=$(cat)
    TAGS=$(mots "$VALUE")
    [ -n "$TAGS" ] || { echo 'refuse : value vide ; la ligne tags demande au moins un tag' >&2; exit 1; }
    NL=$(printf '%s\n' "$TAGS" | wc -l | tr -d ' ')
    [ "$NL" -le "$CL" ] || { echo "refuse : trop de tags ($NL ; la bound cap.lines est $CL)" >&2; exit 1; }
    JOIN=; BAD=
    for T in $TAGS; do
      case "$T" in *[!A-Za-z0-9_.-]*) BAD=$T; break ;; esac
      if [ -z "$JOIN" ]; then JOIN="$T"; else JOIN="$JOIN, $T"; fi
    done
    [ -z "$BAD" ] || { echo "refuse : un tag hors form ($BAD) ; lettre, chiffre, tiret, point, souligne" >&2; exit 1; }
    R="tags: [$JOIN]"
    [ "$(bytes "$R")" -le "$CH" ] || { echo "refuse : la ligne tags depasse $CH bytes ($(bytes "$R"))" >&2; exit 1; }
    block "$C" "tags" "$R" || { echo "refuse : ecriture impossible (skills/$SLUG/skill.yaml)" >&2; exit 1; }
    echo "skills/$SLUG/skill.yaml : tags posees ($JOIN)"
    ;;
  set_tools)
    place
    approve "changer les tools du skill $SLUG ; cela ouvre ou ferme des tools"
    VALUE=$(cat)
    TO=$(mots "$VALUE")
    [ -n "$TO" ] || { echo 'refuse : value vide ; la section tools demande au moins un tool' >&2; exit 1; }
    [ -n "${LA_CONFIG:-}" ] && [ -f "$LA_CONFIG" ] || { echo "refuse : la table des tools est introuvable (${LA_CONFIG:-inconnue})" >&2; exit 1; }
    for G in $TO; do
      case "$G" in *[!a-z0-9_]*) echo "refuse : le tool n a pas la form d un name ($G)" >&2; exit 1 ;; esac
      a_tool "$G" || { echo "refuse : le tool n existe pas dans la table ($G)" >&2; exit 1; }
    done
    NL=$(printf '%s\n' "$TO" | wc -l | tr -d ' ')
    [ "$NL" -le "$CL" ] || { echo "refuse : trop de tools ($NL ; la bound cap.lines est $CL)" >&2; exit 1; }
    R=$(printf 'tools:\n%s' "$(pose "$(printf '%s\n' $TO)")")
    block "$C" "tools" "$R" || { echo "refuse : ecriture impossible (skills/$SLUG/skill.yaml)" >&2; exit 1; }
    M=$(printf '%s ' $TO); M=$(printf '%s' "$M" | sed -e 's/[[:space:]]*$//')
    echo "skills/$SLUG/skill.yaml : tools poses ($M)"
    ;;
  set_steps)
    place
    VALUE=$(cat)
    NL=$(printf '%s\n' "$VALUE" | sed -e '/^[[:space:]]*$/d' | wc -l | tr -d ' ')
    [ "$NL" -ge 1 ] || { echo 'refuse : value vide ; le mode operatoire est obligatoire' >&2; exit 1; }
    [ "$NL" -le 8 ] || { echo "refuse : trop d etapes ($NL ; la bound est 8)" >&2; exit 1; }
    LONG=$(printf '%s\n' "$VALUE" | awk 'length($0) > 200 { print NR; exit }')
    [ -z "$LONG" ] || { echo "refuse : une etape depasse 200 caracteres (ligne $LONG)" >&2; exit 1; }
    R=$(printf 'steps:\n%s' "$(pose "$VALUE")")
    block "$C" "steps" "$R" || { echo "refuse : ecriture impossible (skills/$SLUG/skill.yaml)" >&2; exit 1; }
    echo "skills/$SLUG/skill.yaml : $NL etape(s) posee(s)"
    ;;
  set_plan)
    place
    VALUE=$(cat)
    V=$(printf '%s\n' "$VALUE" | sed -e '/^[[:space:]]*$/d')
    NL=$(printf '%s\n' "$V" | wc -l | tr -d ' ')
    [ "$NL" -ge 1 ] || { echo 'refuse : value vide ; la section plan demande au moins une ligne' >&2; exit 1; }
    [ "$NL" -le "$CL" ] || { echo "refuse : trop de lignes ($NL ; la bound cap.lines est $CL)" >&2; exit 1; }
    R=$(printf 'plan:\n%s' "$(pose "$V")")
    block "$C" "plan" "$R" || { echo "refuse : ecriture impossible (skills/$SLUG/skill.yaml)" >&2; exit 1; }
    echo "skills/$SLUG/skill.yaml : $NL ligne(s) posee(s) dans plan"
    ;;
  set_dirs)
    place
    VALUE=$(cat)
    V=$(printf '%s\n' "$VALUE" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d')
    NL=$(printf '%s\n' "$V" | wc -l | tr -d ' ')
    [ "$NL" -ge 1 ] || { echo 'refuse : value vide ; la section dirs demande au moins un dossier' >&2; exit 1; }
    [ "$NL" -le "$CL" ] || { echo "refuse : trop de dossiers ($NL ; la bound cap.lines est $CL)" >&2; exit 1; }
    BAD=$(printf '%s\n' "$V" | grep -vE '^[^ :]+/ : [^ :]+( [^ :]+)*$' | head -n 1)
    [ -z "$BAD" ] || { echo "refuse : un dossier hors form ($BAD) ; la shape est '<chemin>/ : <ext> <ext>'" >&2; exit 1; }
    R=$(printf 'dirs:\n%s' "$(pose "$V")")
    block "$C" "dirs" "$R" || { echo "refuse : ecriture impossible (skills/$SLUG/skill.yaml)" >&2; exit 1; }
    echo "skills/$SLUG/skill.yaml : $NL dossier(s) pose(s)"
    ;;
  set_error)
    place
    VALUE=$(cat)
    V=$(printf '%s\n' "$VALUE" | sed -e '/^[[:space:]]*$/d')
    NL=$(printf '%s\n' "$V" | wc -l | tr -d ' ')
    [ "$NL" -ge 1 ] || { echo 'refuse : value vide ; la section error demande au moins une ligne' >&2; exit 1; }
    [ "$NL" -le "$CL" ] || { echo "refuse : trop de lignes ($NL ; la bound cap.lines est $CL)" >&2; exit 1; }
    R=$(printf 'error:\n%s' "$(pose "$V")")
    block "$C" "error" "$R" || { echo "refuse : ecriture impossible (skills/$SLUG/skill.yaml)" >&2; exit 1; }
    echo "skills/$SLUG/skill.yaml : $NL ligne(s) posee(s) dans error"
    ;;
  set_paths)
    place
    approve "changer les chemins du skill $SLUG ; paths EST la portee lue par le engine"
    VALUE=$(cat)
    ROT=$(printf '%s\n' "$VALUE" | sed -n 's/^[[:space:]]*root[[:space:]]*:[[:space:]]*//p' | head -n 1)
    WOK=$(printf '%s\n' "$VALUE" | sed -n 's/^[[:space:]]*work[[:space:]]*:[[:space:]]*//p' | head -n 1)
    SPK=$(printf '%s\n' "$VALUE" | sed -n 's/^[[:space:]]*specs[[:space:]]*:[[:space:]]*//p' | head -n 1)
    if [ -z "$ROT" ] || [ -z "$WOK" ] || [ -z "$SPK" ]; then echo 'refuse : paths demande trois lignes : root: ... work: ... specs: ...' >&2; exit 1; fi
    for P in "$ROT" "$WOK" "$SPK"; do
      case "$P" in /*) echo "refuse : un chemin de paths est ABSOLU ($P)" >&2; exit 1 ;; esac
      case "$P" in *..*) echo "refuse : un chemin de paths remonte ($P)" >&2; exit 1 ;; esac
      case "$P" in *'$'*) echo "refuse : un chemin de paths porte un dollar ($P)" >&2; exit 1 ;; esac
      case "$P" in *'"'*) echo "refuse : un chemin de paths porte un guillemet ($P)" >&2; exit 1 ;; esac
      case "$P" in *\\*) echo "refuse : un chemin de paths porte un antislash ($P)" >&2; exit 1 ;; esac
    done
    R=$(printf 'paths:\n  root: %s\n  work: %s\n  specs: %s' "$ROT" "$WOK" "$SPK")
    block "$C" "paths" "$R" || { echo "refuse : ecriture impossible (skills/$SLUG/skill.yaml)" >&2; exit 1; }
    echo "skills/$SLUG/skill.yaml : paths pose (root=$ROT work=$WOK specs=$SPK)"
    ;;
  set_resume)
    place
    VALUE=$(cat)
    V=$(printf '%s\n' "$VALUE" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d')
    NL=$(printf '%s\n' "$V" | wc -l | tr -d ' ')
    [ "$NL" -ge 1 ] || { echo 'refuse : value vide ; la section resume demande au moins une ligne' >&2; exit 1; }
    [ "$NL" -le "$CL" ] || { echo "refuse : trop de lignes ($NL ; la bound cap.lines est $CL)" >&2; exit 1; }
    LONG=$(printf '%s\n' "$V" | awk -v ch="$CH" '{ if (length("  " (100+NR) ": " $0) > ch) { print NR; exit } }')
    [ -z "$LONG" ] || { echo "refuse : la ligne $LONG du resume depasse $CH bytes (la bound cap.chars) ; rien n est ecrit" >&2; exit 1; }
    R=$(printf 'resume:\n%s' "$(pose "$V")")
    block "$C" "resume" "$R" || { echo "refuse : ecriture impossible (skills/$SLUG/skill.yaml)" >&2; exit 1; }
    echo "skills/$SLUG/skill.yaml : $NL ligne(s) posee(s) dans resume"
    ;;
  view_skill)
    if [ -L "$SK/$SLUG" ]; then echo "refuse : la cible est un lien symbolique (skills/$SLUG)" >&2; exit 1; fi
    [ -d "$SK/$SLUG" ] && [ -f "$C" ] || { echo "refuse : le skill n existe pas (skills/$SLUG/skill.yaml)" >&2; exit 1; }
    cat "$C"
    ;;
  load_skill)
    if [ -L "$SK/$SLUG" ]; then echo "refuse : la cible est un lien symbolique (skills/$SLUG)" >&2; exit 1; fi
    [ -d "$SK/$SLUG" ] && [ -f "$C" ] || { echo "refuse : le skill n existe pas (skills/$SLUG/skill.yaml)" >&2; exit 1; }
    OUV=$(printf '' | "${PROCS:-$ROOT/config/engine}/plan.sh" status 2>/dev/null) || OUV=
    case "$OUV" in
      ''|'no open plan'*|'aucun plan ouvert'*) : ;;
      *) { echo "refuse : un plan est ouvert dans le skill actif ; load_skill n est PAS cumulatif (une tache = une skill = un plan), termine le plan (progress complete jusqu a la derniere etape) avant de charger une AUTRE skill" >&2; exit 1; } ;;
    esac
    # LE POINTEUR DE SKILL ACTIVE : load_skill ECRIT le nom dans le fichier d etat
    # skills/.active. C est CE fichier que lisent engine.sh, second.sh et loop.sh
    # (le resume, les paths, la palette suivent). Un FICHIER ordinaire, jamais un lien.
    STATE="$SK/.active"
    if [ -L "$STATE" ]; then echo "refuse : le pointeur de skill active est un lien ($STATE) ; un fichier d etat n est jamais un lien" >&2; exit 1; fi
    printf '%s\n' "$SLUG" > "$STATE" || { echo "refuse : le pointeur de skill active n a pas pu etre ecrit ($STATE)" >&2; exit 1; }
    [ "$(sed -n '1p' "$STATE" 2>/dev/null)" = "$SLUG" ] || { echo "refuse : le pointeur de skill active n a pas ete ecrit ($STATE)" >&2; exit 1; }
    cat "$C"
    ;;
  skill_list)
    N=0
    for F in "$SK"/*/skill.yaml; do
      [ -f "$F" ] || continue
      [ -L "$F" ] && continue
      N=$((N+1))
      NM=$(sed -n 's/^skill: *//p' -- "$F" | head -n 1)
      [ -n "$NM" ] || NM=$(basename "$(dirname "$F")")
      TG=$(sed -n 's/^tags: *//p' -- "$F" | head -n 1)
      [ -n "$TG" ] || TG="[]"
      printf '%s %s\n' "$NM" "$TG"
    done
    [ "$N" -ge 1 ] || { echo "refuse : aucun skill sous $SK" >&2; exit 1; }
    ;;
  remove_skill)
    if [ -L "$D" ]; then echo "refuse : la cible est un lien symbolique (skills/$SLUG) ; on ne retire pas au travers" >&2; exit 1; fi
    [ -d "$D" ] || { echo "refuse : le skill n existe pas (skills/$SLUG)" >&2; exit 1; }
    if [ -L "$C" ]; then echo "refuse : la cible est un lien symbolique (skills/$SLUG/skill.yaml)" >&2; exit 1; fi
    if [ -d "$C" ]; then echo "refuse : la cible est un dossier (skills/$SLUG/skill.yaml) ; on ne retire qu un fichier de skill" >&2; exit 1; fi
    [ -f "$C" ] || { echo "refuse : le skill n existe pas (skills/$SLUG/skill.yaml)" >&2; exit 1; }
    [ -n "$MARK" ] || { echo "refuse : le template_file ne porte pas la marque d un skill (source: ...) : $SM" >&2; exit 1; }
    SRC_OWNER=$(sed -n 's/^source: *//p' -- "$C" | head -n 1 | tr -d '"' | sed -e 's/[[:space:]]*$//')
    if [ -z "$SRC_OWNER" ] || [ "$SRC_OWNER" != "$MARK" ]; then echo "refuse : ce skill n a pas ete ecrit par l agent ; il ne porte pas la marque du template_file (source: $MARK)" >&2; exit 1; fi
    approve "retirer le skill $SLUG ; skills/$SLUG/ part vers la corbeille du systeme, jamais efface"
    gio trash -- "$D" >/dev/null 2>&1 || { echo "refuse : la corbeille du systeme a refuse le deplacement (skills/$SLUG)" >&2; exit 1; }
    if [ -e "$C" ]; then echo "refuse : le skill est reste a sa place (skills/$SLUG)" >&2; exit 1; fi
    echo "skills/$SLUG retire : deplace vers la corbeille du systeme, jamais efface"
    ;;
  *)
    echo "refuse : action inconnue ($A)" >&2; exit 1 ;;
  esac

ARGS:
  - {name: action, type: enum, values: [create_skill, set_line, set_tags, set_tools, set_steps, set_plan, set_dirs, set_error, set_paths, set_resume, view_skill, load_skill, skill_list, remove_skill]}
  - {name: name, type: text}
  - {name: value, type: text, stdin: true}
  - {name: id, type: int}
