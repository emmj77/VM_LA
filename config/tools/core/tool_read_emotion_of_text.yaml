# QUI : lit l'HUMEUR d'un texte -- l'etat du demandeur, en trois etiquettes
# ORIGINE : demande de Moussa (17/10) : « il travaille sur chaque prompt user et ajoute un flag au
#           head secondaire a un offset donne : user_emotional_status ». Le flag vit dans la section
#           OFFSET 2 de config/engine/second.sh ; ce tool est la MEME mesure, a la demande.
#           Instrument : GoEmotions int8 (28 etiquettes, 119,6 Mo, 307 Mo de vive au pic, 340 ms de
#           chargement, 50 a 70 ms par texte). Mesure du 17/10 : excellent en ANGLAIS (annoyance
#           0,79 sur un reproche, gratitude 0,99, admiration 0,95) ; en FRANCAIS il s'ecrase sur
#           `neutral` 0,90 a 0,96 -- le modele a appris l'anglais et rien d'autre.
# REFUSE : texte vide ; langue non anglaise (mesuree par fastText lid.176 AVANT de charger le
#          modele : une demande francaise coute 18 ms, pas 340) ; modele absent.
tool: "read_emotion_of_text"
date: "2026-10-17"
tags: ["read_emotion_of_text", "emotion", "goemotions", "humeur", "head"]

RULES:
  enabled: true
  timeout: 600

DESCRIPTION: "reads the mood of a text : the three strongest states, with their confidence"

COMMAND: |
  # UN INSTRUMENT QUI NE LIT PAS LA LANGUE SE TAIT. GoEmotions n'a appris que l'anglais : sur du
  # francais il rend `neutral` avec une confiance de 0,9 -- un fait FAUX, et c'est pire qu'aucun
  # fait. Le porteur mesure donc la langue d'abord (fastText lid.176, 18 ms) et refuse si elle
  # n'est pas l'anglaise. Le refus porte le DIT : la langue vue, et la raison.
  P="$ROOT/config/py/read_emotion.py"
  [ -f "$P" ] || { echo "refuse : le porteur de l humeur est absent ($P)" >&2 ; exit 1 ; }
  /usr/bin/python3 "$P"

ARGS:
  - {name: text, type: text, stdin: true}
