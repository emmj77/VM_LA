# QUI : lit le RELIEF d'une image (ce qui est devant, ce qui est derriere) et ecrit la carte (PNG)
# ORIGINE : micro-modele du releve du 17/10 (Depth Anything V2 Small). Pose : 96,7 Mo, 519-588 ms.
# REFUSE : une source absente ; un modele absent de la machine.
tool: "read_depth_of_img"
date: "2026-10-17"
tags: ["read_depth_of_img", "relief", "profondeur", "depth-anything"]

RULES:
  enabled: true
  timeout: 900

DESCRIPTION: "reads the depth of an image and writes the relief map (PNG)"

COMMAND: |
  LC_ALL=C; export LC_ALL
  # LE RELIEF. Sur une planche ou une illustration, savoir ce qui est DEVANT et ce qui est DERRIERE
  # est un FAIT, pas une opinion : c'est la carte qui manquait pour placer un personnage, un flou,
  # une ombre. Le modele rend un relief RELATIF (pas des metres) : la carte se lit en niveaux.
  F="$W/{{source}}"; [ -f "$F" ] || F="$ROOT/{{source}}"
  [ -f "$F" ] || { echo "refuse : l image est introuvable ({{source}})" >&2 ; exit 1 ; }
  O="{{out}}"; [ -n "$O" ] || O="$(basename "$F" | sed 's/\.[^.]*$//')_relief.png"
  PY=${LA_PYTHON:-/usr/bin/python3}
  PORTEUR="${LA_MICRO_VISION:-$ROOT/config/py/micro_vision.py}"
  [ -f "$PORTEUR" ] || { echo "refuse : le porteur des gestes est introuvable ($PORTEUR)" >&2 ; exit 1 ; }
  LC_ALL=C "$PY" "$PORTEUR" depth "$F" "$W/$O"

ARGS:
  - {name: source, type: path}
  - {name: out, type: path}
