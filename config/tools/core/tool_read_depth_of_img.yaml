tool: "read_depth_of_img"
date: "2026-10-20"
tags: ["read_depth_of_img", "depth", "depth-anything"]
RULES:
  enabled: true
  timeout: 900
DESCRIPTION: "reads the depth of an image and writes the relief map (PNG)"
COMMAND: |
  LC_ALL=C; export LC_ALL
  F="$W/{{source}}"; [ -f "$F" ] || F="$ROOT/{{source}}"
  O=""; [ -z "{{out}}" ] || O="$W/{{out}}"
  exec "${LA_PYTHON:-/usr/bin/python3}" "${LA_MICRO_VISION:-$ROOT/config/programs/micro_vision.py}" depth "$F" "$O"

ARGS:
  - {name: source, type: path}
  - {name: out, type: path}
