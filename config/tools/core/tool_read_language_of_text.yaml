tool: "read_language_of_text"
date: "2026-10-17"
tags: ["read_language_of_text", "langue", "fasttext", "filter"]
RULES:
  enabled: true
  timeout: 600
DESCRIPTION: "tells the language of a text, with its confidence"
COMMAND: |
  LC_ALL=C; export LC_ALL
  command -v fasttext >/dev/null 2>&1 || { printf '%s\n' "$(msg missing_binary 'fasttext')" >&2 ; exit 1 ; }
  MODELE="${LA_LID_MODEL:-${LA_GGUF_DIR:-$HOME/LLM_GGUF}/lid.176.ftz}"
  [ -f "$MODELE" ] || { printf '%s\n' "$(msg language_model_missing "$MODELE")" >&2 ; exit 1 ; }
  T=$(cat)
  [ -n "$(printf '%s' "$T" | tr -d '[:space:]')" ] || { printf '%s\n' "$(msg no_text_to_read)" >&2 ; exit 1 ; }
  printf '%s\n' "$T" | fasttext predict-prob "$MODELE" - 1 \
    | sed -e 's/^__label__//'

ARGS:
  - {name: text, type: text, stdin: true}
