tool: "load_project"
date: "2026-10-17"
tags: ["load_project", "project"]
RULES:
  enabled: true
  timeout: 60
DESCRIPTION: "loads a project : writes projects/.active, then its SKILLS become the perimeter"
COMMAND: |
  N=$(cat | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
  D="$ROOT/projects"
  case "$N" in ''|*/*|*..*) printf '%s\n' "$(msg project_name_expected_nor)" >&2; exit 1;; esac
  [ -f "$D/$N/project.yml" ] || { printf '%s\n' "$(msg project_yml_not_found "$D" "$N")" >&2; exit 1; }
  printf '%s\n' "$N" > "${LA_STATE_PROJECT:-$D/.active}" || { printf '%s\n' "$(msg cannot_write "$D")" >&2; exit 1; }
  printf '%s\n' "$(msg project_loaded)""$N"

ARGS:
  - {name: name, type: text, stdin: true}
