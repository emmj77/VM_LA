# QUI : reads the doc NAMED by the active skill, before a sensitive tool
# ORIGINE : ligne 137 du registre ; corps REECRIT le 2026-10-17 -- il lit les ressources NOMMEES.
# REFUSE : aucun skill actif, ou manifeste de la skill introuvable. Une ressource absente ne refuse jamais.
tool: "load_doc"
date: "2026-10-17"
tags: ["load_doc"]

RULES:
  enabled: true
  timeout: 600

DESCRIPTION: "reads the docs NAMED by the active skill (DOCS): the web, a machine, or a path"

COMMAND: |
  # LA DOC DE LA SKILL ACTIVE : elle est NOMMEE par sa section DOCS (loi 1033 : l id 3xx porte la
  # doc), et elle SEULE. IL N Y A PAS DE DOSSIER docs/ : ce dossier n a jamais existe, et une
  # doc ne vit pas dans une arborescence inventee. Ce que la skill NOMME est l une de ces trois
  # choses, et le corps les sert TOUTES (la section entiere, pas la premiere ligne) :
  #   - le WEB : la valeur web_search (24 skills sur 30). La doc se cherche, se lit, se CITE.
  #   - une MACHINE (unity, blender, krita, 3d, comfyui) : le dossier des corps, son inventaire,
  #     ET LES SUJETS DE DOC QUE LES CORPS CITENT (leur champ doc:) : c est la doc CITEe.
  #   - un CHEMIN (Ressources, pour unity) : il se resout sous la racine, sous la skill, sous sa
  #     machine, sous son PERIMETER.workspace (loi 1008 : l emplacement est declare par la skill).
  # LA PORTE S OUVRE MEME QUAND RIEN N EST TROUVE : le verrou ne juge pas le contenu lu (loi 1007),
  # et une ressource absente ne doit pas garder la famille PLAN fermee (loi 1003).
  T="{{topic}}"
  case "$T" in
    ''|*[!a-zA-Z0-9_.-]*) [ -n "$T" ] && printf 'topic hors form (%s) : les ressources nommees par la skill sont servies\n' "$T" >&2 ; T= ;;
  esac
  A=$(sed -n '1p' "$ROOT/skills/.active" 2>/dev/null | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
  case "$A" in ''|*/*|*..*) A= ;; esac
  [ -n "$A" ] || { echo "refuse : aucun skill actif (skills/.active est vide)" >&2 ; exit 1; }
  S="$ROOT/skills/$A/skill.yaml"
  [ -f "$S" ] || { echo "refuse : le manifeste de la skill active est introuvable ($S)" >&2 ; exit 1; }
  RES=$(sed -n '/^DOCS:/,/^[^[:space:]]/p' "$S" \
        | sed -n 's/^[[:space:]]*[0-9][0-9]*:[[:space:]]*//p' \
        | sed -e 's/^"//' -e 's/"[[:space:]]*$//' | grep -v '^$')
  if [ -z "$RES" ]; then
    printf 'la skill %s ne nomme AUCUNE ressource de doc (section DOCS vide) : rien a lire.\n' "$A"
    exit 0
  fi
  WS=$(sed -n '/^PERIMETER:/,/^[^[:space:]]/p' "$S" | sed -n 's/^[[:space:]]*workspace:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' | head -n 1)
  # LE SUJET DU MODELE NE REMPLACE PAS LA LISTE : un sujet hors liste est IGNORE, et DIT.
  if [ -n "$T" ]; then
    if printf '%s\n' "$RES" | grep -qxF -- "$T"; then LISTE="$T" ; else
      printf 'le sujet demande (%s) n est pas nomme par la skill %s : les ressources nommees sont servies.\n\n' "$T" "$A"
      LISTE="$RES"
    fi
  else LISTE="$RES"; fi

  printf '%s\n' "$LISTE" | while IFS= read -r R; do
    [ -n "$R" ] || continue
    case "$R" in
      web_search|web|none)
        printf 'LA DOC DE LA SKILL %s VIT SUR LE WEB (ressource nommee : %s) :\n' "$A" "$R"
        printf 'cherche la source OFFICIELLE, lis-la, et cite ce que tu lis.\n'
        continue ;;
    esac
    # LES PERIMETRES DE PROJET : un projet DECLARE ou vit son dossier (projects/<nom>/project.yml,
    # champ path) -- et on CHERCHE le dossier, on n ecrit jamais un chemin en dur : un chemin pose,
    # c est un chemin casse le jour ou le dossier se deplace. Le perimetre borne l ECRITURE (lois
    # 1202-1204) ; LA LECTURE, ELLE, EST LIBRE : tout est lisible, seule l ecriture est limitee.
    PERIM=
    PAC=$(sed -n '1p' "$ROOT/projects/.active" 2>/dev/null | tr -d '\r')
    PJL="$ROOT/projects/*/project.yml"
    if [ -n "$PAC" ] && [ -f "$ROOT/projects/$PAC/project.yml" ]; then
      PJL="$ROOT/projects/$PAC/project.yml $ROOT/projects/*/project.yml"
    fi
    for PJ in $PJL; do
      [ -f "$PJ" ] || continue
      PP=$(sed -n 's/^path:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' "$PJ" | head -n 1)
      [ -n "$PP" ] || continue
      for D in "$ROOT/$PP" "$HOME/$PP" "$ROOT/../$PP"; do
        [ -d "$D/$R" ] && { PERIM="$D/$R" ; break; }
      done
      [ -n "$PERIM" ] && break
    done
    P=
    # L ORDRE : LA MACHINE D ABORD (le dossier des corps, qui CITENT leurs sujets de doc), puis le
    # PERIMETRE d un projet, puis un chemin de la racine, puis la skill elle-meme, puis le
    # workspace declare (loi 1008).
    for C in "$ROOT/config/tools/$R" "$PERIM" "$ROOT/$R" "$ROOT/skills/$A/$R" "$ROOT/skills/$R" \
             ${WS:+"$ROOT/$WS/$R"}; do
      case "$C" in *..*) continue ;; esac
      [ -e "$C" ] || continue
      P="$C" ; break
    done
    if [ -z "$P" ]; then
      printf 'LA SKILL %s NOMME UNE RESSOURCE DE DOC QUI N EST PAS SOUS LA RACINE : %s\n' "$A" "$R"
      printf 'Cherche-la sur le WEB (web_search), lis la bonne source, cite-la.\n'
      continue
    fi
    if [ -f "$P" ]; then
      # UN FICHIER SE LIT -- SIL EST DU TEXTE. Un binaire (base, image, archive) s ANNONCE : le
      # dumper ne donne que du bruit dans la tete, et une tete pleine de bruit hallucine. La
      # nature vient de `file`, jamais d une devinette sur l extension.
      NAT=$(file -b --mime-type "$P" 2>/dev/null || echo '?')
      case "$NAT" in
        text/*|application/json|application/xml|application/yaml|application/csv)
          printf 'LA DOC %s DE LA SKILL %s : %s\n\n' "$R" "$A" "$P"
          LC_ALL=C sed -n '1,400p' "$P" ;;
        *)
          printf 'LA RESSOURCE %s DE LA SKILL %s EST UN FICHIER QUI N EST PAS DU TEXTE : %s\n' "$R" "$A" "$P"
          printf 'nature : %s ; %s octet(s). Il ne se LIT pas ici : il se traite par son outil (une base\n' "$NAT" "$(wc -c < "$P" | tr -d ' ')"
          printf 'par sqlite3, une image par son lecteur). Le nommer suffit a savoir qu il est la.\n' ;;
      esac
      continue
    fi
    # UN DOSSIER S OUVRE : son contenu, DOSSIERS ET FICHIERS -- et les sujets de doc que ses
    # corps citent. On ouvre le dossier avant de lire le moindre fichier : c est lui, la doc.
    # Les sous-dossiers portent un / : un dossier ouvert se VOIT d un coup d oeil.
    SUJ=$(grep -h '^doc:' "$P"/tool_*.yaml 2>/dev/null | sed -e 's/^doc:[[:space:]]*//' -e 's/[[:space:]]*$//' | LC_ALL=C sort -u | grep -v '^$' | tr '\n' ' ')
    NF=$(find "$P" -maxdepth 1 -type f 2>/dev/null | wc -l)
    ND=$(find "$P" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | wc -l)
    if [ "$NF" -eq 1 ] && [ "$ND" -eq 0 ]; then
      F=$(find "$P" -maxdepth 1 -type f 2>/dev/null)
      NAT=$(file -b --mime-type "$F" 2>/dev/null || echo '?')
      case "$NAT" in
        text/*|application/json|application/xml|application/yaml|application/csv)
          printf 'LA DOC %s DE LA SKILL %s (le seul fichier de %s) :\n\n' "$R" "$A" "$P"
          LC_ALL=C sed -n '1,400p' "$F" ; continue ;;
      esac
      printf 'LA RESSOURCE %s DE LA SKILL %s (le seul fichier de %s) EST UN FICHIER QUI N EST PAS DU TEXTE :\n' "$R" "$A" "$P"
      printf 'nature : %s ; %s octet(s). Il ne se LIT pas ici : il se traite par son outil.\n' "$NAT" "$(wc -c < "$F" | tr -d ' ')"
      continue
    fi
    printf 'LA RESSOURCE %s DE LA SKILL %s : le dossier %s (%s fichier(s), %s sous-dossier(s))\n\n' "$R" "$A" "$P" "$NF" "$ND"
    for E in "$P"/*; do
      [ -e "$E" ] || continue
      [ -d "$E" ] && printf '  %s/\n' "$(basename "$E")" || printf '  %s\n' "$(basename "$E")"
    done | LC_ALL=C sort | head -n 60
    if [ -n "$SUJ" ]; then
      printf '\nLES SUJETS DE DOC CITES PAR LES CORPS DE %s : %s\n' "$R" "$SUJ"
      printf 'Le texte se prend a la SOURCE (web_search), et il se cite.\n'
    fi
  done
  exit 0


ARGS:
  - {name: topic, type: text}
