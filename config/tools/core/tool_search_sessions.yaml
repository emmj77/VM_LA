# QUI : searches the sessions body and returns the exchanges that carry the words
# ORIGINE : migre tel quel de la ligne 178 du registre (2026-10-17). Le corps n'a PAS ete reecrit ici.
# REFUSE : (a completer par l'auteur -- ce que ce tool refuse, en le nommant)
tool: "search_sessions"
date: "2026-10-17"
tags: ["search_sessions"]

RULES:
  enabled: true
  timeout: 600

DESCRIPTION: "searches the sessions body and returns the exchanges that carry the words"

COMMAND: |
  # LE CORPS (sessions.db) : chaque tour y laisse ses lignes, brutes. On cherche dans le TEXTE
  # des messages et on nomme l'ECHANGE : c'est ce que search_memory rend aussi, donc les deux
  # lectures se repondent.
  T=$(cat); [ -n "$T" ] || { echo "refuse : question vide" >&2; exit 1; }
  D=${LA_SESSIONS_DB:-$ROOT/config/sessions.db}
  [ -f "$D" ] || { echo "refuse : le corps des sessions est introuvable ($D)" >&2; exit 1; }
  _Q=$(printf '%s' "$T" | sed "s/'/''/g")
  sqlite3 "$D" "SELECT exchange || ' | ' || ts || ' | ' || role || ' | ' || substr(replace(content, char(10), ' '), 1, 200) FROM messages WHERE content LIKE '%$_Q%' ORDER BY id DESC LIMIT 20;" 2>/dev/null

ARGS:
  - {name: text, type: text, stdin: true}
