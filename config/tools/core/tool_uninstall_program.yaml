# QUI : RETIRE un programme installe (paquet Debian, par apt) -- et dit ce qui part avec lui
# ORIGINE : demande de Moussa (17/10). Le pendant de install_program, et le meme refus de forme.
# REFUSE : un nom hors form ; un paquet qui n'est pas installe ; un retrait SANS SON DOUBLE : l'outil
#          demande le nom DEUX fois (name ET confirm). Le modele doit donc l'ecrire deux fois --
#          c'est la seule marque d'intention qu'un tool puisse exiger sans parler a l'humain (un tool
#          qui demande est un tool qui n'a pas fini son travail).
# CE QU'IL DIT AVANT : la liste de ce qui partirait avec le paquet (la simulation d'apt), afin que
#          l'humain qui lit le retour voie les degats AVANT de les avoir.
# CE QU'IL NE FAIT PAS : --purge (la configuration reste), et jamais autoremove : retirer un paquet
#          ne doit pas decider tout seul de ce qui n'a plus de raison d'etre.
tool: "uninstall_program"
date: "2026-10-17"
tags: ["uninstall_program", "retirer", "desinstaller", "apt", "program-manage"]

RULES:
  enabled: true
  timeout: 1800

DESCRIPTION: "removes an installed program (apt) -- the name must be given twice"

COMMAND: |
  LC_ALL=C; export LC_ALL
  P="{{name}}"
  C="{{confirm}}"
  case "$P" in
    '') echo 'refuse : il faut nommer le paquet a retirer' >&2 ; exit 1 ;;
    -*|.*|*..*) echo "refuse : « $P » n est pas un nom de paquet" >&2 ; exit 1 ;;
    *[!a-z0-9+.-]*) echo "refuse : « $P » porte un caractere qui n entre pas dans un nom de paquet" >&2 ; exit 1 ;;
  esac
  # LE DOUBLE : un retrait se nomme deux fois. Deux champs, une seule intention.
  [ "$C" = "$P" ] || {
    echo "refuse : un retrait se nomme DEUX fois (name et confirm). J ai lu « $P » et « ${C:-rien} »." >&2
    echo "         Repose l appel avec confirm = $P." >&2
    exit 1
  }
  command -v apt-get >/dev/null 2>&1 || { echo 'refuse : apt-get est absent de la machine' >&2 ; exit 1 ; }
  dpkg -s "$P" >/dev/null 2>&1 || { echo "refuse : $P n est pas installe sur cette machine" >&2 ; exit 1 ; }
  V=$(dpkg-query -W -f='${Version}' "$P" 2>/dev/null)
  # CE QUI PARTIRAIT : la simulation, bornee, dite AVANT l acte.
  PART=$(apt-get -s -y remove -- "$P" 2>/dev/null | sed -n 's/^Remv \([^ ]*\).*/\1/p' | tr '\n' ' ' | cut -c1-200)
  L=$(sudo -n apt-get -y remove -- "$P" 2>&1) || {
    echo "refuse : le retrait de $P a echoue : $(printf '%s' "$L" | tail -n 3 | tr '\n' ' ' | cut -c1-200)" >&2
    exit 1
  }
  if dpkg -s "$P" >/dev/null 2>&1; then
    echo "refuse : $P est toujours installe apres le retrait (rien n a bouge)" >&2
    exit 1
  fi
  printf 'retire : %s (etait %s) ; partis avec lui : %s ; sa configuration est restee (pas de --purge)\n' \
    "$P" "${V:-?}" "${PART:-rien}"

ARGS:
  - {name: name, type: text}
  - {name: confirm, type: text}
