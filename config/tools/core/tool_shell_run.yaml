# QUI : runs a shell command under landrun : read-only, writes into the workspace
# ORIGINE : migre tel quel de la ligne 120 du registre (2026-10-17). Le corps n'a PAS ete reecrit ici.
# REFUSE : (a completer par l'auteur -- ce que ce tool refuse, en le nommant)
tool: "shell_run"
date: "2026-10-17"
tags: ["shell_run"]

RULES:
  enabled: true
  timeout: 600

DESCRIPTION: "runs a shell command under landrun : read-only, writes into the workspace"

COMMAND: |
  C=$(cat); [ -n "$C" ] || { echo 'refuse : command vide ou absente' >&2; exit 1; }
  L=${LA_LANDRUN:-/home/moussa/.local/bin/landrun}; T="{{timeout}}"; [ -n "$T" ] || T=30; [ -x "$L" ] || { echo "refuse : landrun introuvable ($L)" >&2; exit 1; }
  cd "$ROOT" || exit 1; timeout "$T" "$L" --ro / --rox /usr --rox /bin --rox /lib --rox /lib64 --rw "$W" -- /bin/sh -c "$C"

ARGS:
  - {name: command, type: text, stdin: true}
  - {name: timeout, type: int}
