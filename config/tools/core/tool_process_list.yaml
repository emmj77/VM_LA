# QUI : lists the machine's processes, filtered by a pattern
# ORIGINE : migre tel quel de la ligne 119 du registre (2026-10-17). Le corps n'a PAS ete reecrit ici.
# REFUSE : (a completer par l'auteur -- ce que ce tool refuse, en le nommant)
tool: "process_list"
date: "2026-10-17"
tags: ["process_list"]

RULES:
  enabled: true
  timeout: 600

DESCRIPTION: "lists the machine's processes, filtered by a pattern"

COMMAND: |
  PAT=$(cat)
  if [ -n "$PAT" ]; then hx proc -n 40 -- "$PAT"; else hx proc -n 40; fi

ARGS:
  - {name: pattern, type: text, stdin: true}
