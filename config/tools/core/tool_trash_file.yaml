# QUI : moves a file from work to the system trash, without erasing
# ORIGINE : migre tel quel de la ligne 107 du registre (2026-10-17). Le corps n'a PAS ete reecrit ici.
# REFUSE : (a completer par l'auteur -- ce que ce tool refuse, en le nommant)
tool: "trash_file"
date: "2026-10-17"
tags: ["trash_file"]

RULES:
  enabled: true
  timeout: 600

DESCRIPTION: "moves a file from work to the system trash, without erasing"

COMMAND: |
  [ -f "$W/{{path}}" ] || { echo "refuse: cible absente" >&2; exit 1; }; gio trash -- "$W/{{path}}"

ARGS:
  - {name: path, type: path}
