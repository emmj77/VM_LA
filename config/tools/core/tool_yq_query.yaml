# QUI : reads a yaml, a json or a md's yaml header, with yq
# ORIGINE : migre tel quel de la ligne 118 du registre (2026-10-17). Le corps n'a PAS ete reecrit ici.
# REFUSE : (a completer par l'auteur -- ce que ce tool refuse, en le nommant)
tool: "yq_query"
date: "2026-10-17"
tags: ["yq_query"]

RULES:
  enabled: true
  timeout: 600

DESCRIPTION: "reads a yaml, a json or a md's yaml header, with yq"

COMMAND: |
  Q=$(cat); [ -n "$Q" ] || { echo 'refuse : query vide ou absente' >&2; exit 1; }
  F="$ROOT/{{path}}"; case "$F" in *.md) E="-f extract" ;; *) E="" ;; esac
  yq eval -M $E --security-disable-env-ops --security-disable-file-ops --expression "$Q" "$F"

ARGS:
  - {name: query, type: text, stdin: true}
  - {name: path, type: path}
