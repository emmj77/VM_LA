# QUI : updates ONE law of the CANON (projects/<active>/spec.yaml) : a law that ALREADY EXISTS.
# ORIGINE : ecrit le 17/10/2026. write_spec garde la CREATION (une spec neuve, une loi neuve, une
#          section) ; mettre a jour le canon est un AUTRE geste -- et c est celui-la que le moteur
#          impose a la sortie d un projet et tous les dix tours.
# REFUSE : une loi hors form ; un canon introuvable ; une loi QUI N EXISTE PAS (c est write_spec qui
#          l ecrit pour la premiere fois) ; plus d une ligne ; une ligne au-dela du cap du skill.
tool: "update_spec"
date: "2026-10-17"
tags: ["update_spec", "spec"]

RULES:
  enabled: true
  timeout: 600

DESCRIPTION: "updates ONE law of the CANON (projects/<active>/spec.yaml) : a law that already exists"

COMMAND: |
  # UPDATE_SPEC : UNE loi, celle qu on met a jour. Une loi qui n existe pas ne se met pas a jour :
  # l ecrire pour la premiere fois, c est write_spec, et le refus le DIT.
  [ -r "$PROCS/spec.sh" ] || { echo "refuse : la brique du spec est introuvable ($PROCS/spec.sh)" >&2 ; exit 1 ; }
  . "$PROCS/spec.sh"
  LAW="{{law}}"
  case "$LAW" in ''|*[!0-9]*) echo "refuse : la loi hors form ($LAW) ; une loi est un nombre" >&2 ; exit 1 ;; esac
  F="$SPEC_FILE"
  [ -f "$F" ] || { echo "refuse : le spec du skill actif est introuvable ($F)" >&2 ; exit 1 ; }
  grep -q "^  $LAW:" "$F" || { echo "refuse : la loi $LAW n existe pas dans le canon ($F) ; c est write_spec qui l ecrit pour la premiere fois" >&2 ; exit 1 ; }
  SK="$SKILL"
  [ -f "$SK" ] || { echo "refuse : le skill actif est introuvable ($SK)" >&2 ; exit 1 ; }
  CH=$(sed -n 's/^[[:space:]]*chars:[[:space:]]*\([0-9][0-9]*\).*$/\1/p' "$SK" | head -n 1)
  case "$CH" in ''|*[!0-9]*) CH=100 ;; esac
  BODY=$(cat)
  V=$(printf '%s\n' "$BODY" | sed -e '/^[[:space:]]*$/d')
  [ "$(printf '%s\n' "$V" | wc -l | tr -d ' ')" = 1 ] || { echo 'refuse : update_spec met a jour UNE loi ; j en ai recu plusieurs' >&2 ; exit 1 ; }
  V=$(printf '%s' "$V" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
  R="  $LAW: \"$V\""
  [ "$(printf '%s' "$R" | wc -c | tr -d ' ')" -le "$CH" ] || { echo "refuse : la loi $LAW depasse $CH bytes" >&2 ; exit 1 ; }
  OLD=$(sed -n "s/^  $LAW: \"\(.*\)\"$/\1/p" "$F" | head -n 1)
  [ "$OLD" != "$V" ] || { echo "refuse : la loi $LAW est DEJA celle-la ; rien a mettre a jour" >&2 ; exit 1 ; }
  law_write "$F" "$LAW" "$R" || { echo "refuse : ecriture impossible ($F)" >&2 ; exit 1 ; }
  echo "$F : loi $LAW mise a jour ($(printf '%s' "$R" | wc -c | tr -d ' ') bytes)"

ARGS:
  - {name: law, type: int}
  - {name: law_text, type: text, stdin: true}
