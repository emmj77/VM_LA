tool: "download_file"
date: "2026-10-19"
tags: ["download_file", "telechargement", "curl", "file", "sha256"]
RULES:
  enabled: true
  timeout: 300
  approval: whole
DESCRIPTION: "downloads one https file into the workspace and says its size and sha256"
COMMAND: |
  LC_ALL=C; export LC_ALL
  U=$(cat | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | head -n 1)
  N="{{name}}"
  command -v curl >/dev/null 2>&1 || { printf '%s\n' "$(msg curl_missing_machine)" >&2 ; exit 1 ; }
  case "$U" in
    '') printf '%s\n' "$(msg address_url_required)" >&2 ; exit 1 ;;
    https://?*) ;;
    http://*) printf '%s\n' "$(msg http_not_accepted_file)" >&2 ; exit 1 ;;
    *) printf '%s\n' "$(msg not_https_address_nor "$U")" >&2 ; exit 1 ;;
  esac
  HOST=$(printf '%s' "$U" | sed -e 's#^https://##' -e 's#[/:].*$##')
  [ -n "$HOST" ] || { printf '%s\n' "$(msg address_carries_readable_host)" >&2 ; exit 1 ; }
  case "$HOST" in
    ''|*[!a-zA-Z0-9.-]*) printf '%s\n' "$(msg not_host_name "$HOST")" >&2 ; exit 1 ;;
  esac

  [ -n "$N" ] || N=$(printf '%s' "$U" | sed -e 's#^.*/##' -e 's#[?#].*##')
  case "$N" in
    ''|-*|*/*|*..*) printf '%s\n' "$(msg not_file_name_leading "$N")" >&2 ; exit 1 ;;
    *[!A-Za-z0-9._+-]*) printf '%s\n' "$(msg carries_character_does_not "$N")" >&2 ; exit 1 ;;
  esac
  D="${W:-$PWD}"
  [ -d "$D" ] || { printf '%s\n' "$(msg workspace_missing "$D")" >&2 ; exit 1 ; }
  F="$D/$N"
  [ -e "$F" ] && { printf '%s\n' "$(msg already_exists_here_give "$N")" >&2 ; exit 1 ; }

  MAX=$(sed -n '/^download:/,/^[^[:space:]]/p' "$ROOT/config/la_config.yaml" 2>/dev/null \
        | sed -n 's/^[[:space:]]*max_mb:[[:space:]]*//p' | head -n 1 | sed -e 's/#.*//' -e 's/[[:space:]]*$//')
  case "$MAX" in ''|*[!0-9]*) MAX=200 ;; esac

  ERR=$(curl -fsSL --proto-redir =https --max-filesize $((MAX * 1024 * 1024)) \
          --max-time 240 --retry 1 -o "$F" "$U" 2>&1) || {
    rm -f "$F" 2>/dev/null
    printf '%s\n' "$(msg download_failed "$(printf '%s' "$ERR" | tail -n 2 | tr '\n' ' ' | cut -c1-200)")" >&2
    exit 1
  }
  [ -s "$F" ] || { rm -f "$F" 2>/dev/null ; printf '%s\n' "$(msg downloaded_file_empty)" >&2 ; exit 1 ; }
  SZ=$(wc -c < "$F" | tr -d ' ')
  SHA=$(sha256sum "$F" | cut -d' ' -f1)
  printf 'telecharge : %s (%s octets) depuis %s ; sha256 %s\n' "$N" "$SZ" "$HOST" "$SHA"

ARGS:
  - {name: url, type: text, stdin: true}
  - {name: name, type: text}
