tool: "vision_analyze"
date: "2026-10-17"
tags: ["vision_analyze"]
RULES:
  enabled: true
  timeout: 600
DESCRIPTION: "reads a workspace image with the API's multimodal model"
COMMAND: |
  LC_ALL=C; export LC_ALL
  if [ -z "${OLLAMA_API_KEY:-}" ] && [ -r "$ROOT/config/.env" ]; then
    set -a
    . "$ROOT/config/.env" 2>/dev/null || true
    set +a
  fi
  KEY=${OLLAMA_API_KEY:-}
  [ -n "$KEY" ] || { printf '%s\n' "$(msg api_key_missing)" >&2 ; exit 1 ; }
  API=${LA_API_URL:-https://ollama.com/v1}
  MODELE=${LA_API_MODEL:-deepseek-v4.1-flash}
  F="$W/{{path}}"
  [ -f "$F" ] || { printf '%s\n' "$(msg image_missing_path)" >&2 ; exit 1 ; }
  case "$F" in
    *.png) M=image/png ;;
    *.jpg|*.jpeg) M=image/jpeg ;;
    *.webp) M=image/webp ;;
    *.gif) M=image/gif ;;
    *.bmp) M=image/bmp ;;
    *) printf '%s\n' "$(msg image_type_unread)" >&2 ; exit 1 ;;
  esac
  Q=$(cat); [ -n "$Q" ] || Q="Decris cette image en detail, en francais."
  command -v jq >/dev/null 2>&1 || { printf '%s\n' "$(msg jq_missing)" >&2 ; exit 1 ; }
  TD=$(mktemp -d "${TMPDIR:-/tmp}/vision_analyze.XXXXXX") || { printf '%s\n' "$(msg no_temporary_space)" >&2 ; exit 1 ; }
  trap 'rm -f "$TD/b" "$TD/q"' EXIT INT TERM HUP
  base64 -w 0 -- "$F" > "$TD/b" || { printf '%s\n' "$(msg image_unreadable "$F")" >&2 ; exit 1 ; }
  jq -cn --arg m "$M" --rawfile b "$TD/b" --arg q "$Q" --arg mo "$MODELE" '{model:$mo,stream:false,temperature:0.1,max_tokens:2048,messages:[{role:"user",content:[{type:"text",text:$q},{type:"image_url",image_url:{url:("data:"+$m+";base64,"+$b)}}]}]}' > "$TD/q" || { printf '%s\n' "$(msg request_not_built)" >&2 ; exit 1 ; }
  R=$(curl -sS -m 180 -H 'Content-Type: application/json' -H "Authorization: Bearer $KEY" --data-binary @"$TD/q" "$API/chat/completions") || { printf '%s\n' "$(msg api_no_answer "$API")" >&2 ; exit 1 ; }
  T=$(printf '%s' "$R" | jq -r 'if ((.choices[0].message.content // "") != "") then .choices[0].message.content else (.choices[0].message.reasoning // "") end' 2>/dev/null | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d')
  [ -n "$T" ] || { printf '%s\n' "$(msg api_rendered_nothing "$(printf '%s' "$R" | tr '\n' ' ' | cut -c1-200)")"$R" | tr '\n' ' ' | cut -c1-200))" >&2 ; exit 1 ; }
  printf '%s\n' "$T"

ARGS:
  - {name: path, type: path}
  - {name: question, type: text, stdin: true}
