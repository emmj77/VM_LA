tool: "read_text_in_img"
date: "2026-10-17"
tags: ["read_text_in_img", "ocr", "texte", "image"]
RULES:
  enabled: true
  timeout: 600
DESCRIPTION: "reads the TEXT of an image, character by character"
COMMAND: |
  LC_ALL=C; export LC_ALL
  F="$W/{{path}}"; [ -f "$F" ] || F="$ROOT/{{path}}"
  [ -f "$F" ] || { echo "refused: the image is missing ({{path}})" >&2 ; exit 1 ; }
  case "$F" in
    *.png|*.jpg|*.jpeg|*.webp|*.tif|*.tiff|*.bmp|*.pnm) ;;
    *) printf '%s\n' "$(msg image_type_not_read)" >&2 ; exit 1 ;;
  esac
  command -v tesseract >/dev/null 2>&1 || { printf '%s\n' "$(msg tesseract_missing_machine)" >&2 ; exit 1 ; }
  L=${LA_TESSERACT_LANG:-fra+eng}
  T=$(tesseract "$F" stdout -l "$L" 2>/dev/null | sed -e 's/[[:space:]]*$//' -e '/^$/d')
  if [ -z "$T" ]; then
    printf '%s\n' "$(msg text_found_image_path "$L")"
    exit 0
  fi
  printf '%s\n' "$T"

ARGS:
  - {name: path, type: path}
