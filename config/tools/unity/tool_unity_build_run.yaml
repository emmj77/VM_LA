tool: "unity_build_run"
date: "2026-10-18"
tags: ["unity", "cli", "build"]
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Launch the project's most recent successful build without rebuilding. Standalone players launch natively; WebGL builds are served from a local static server"
COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- build run --no-banner --no-pager --non-interactive


  [ -n "{{project}}" ] && set -- "$@" "{{project}}"
  [ -n "{{path}}" ] && set -- "$@" --path "{{path}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_build_run_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"
ARGS:
  - {name: project, type: text}   # facultatif
  - {name: path, type: text}   # Launch this build output instead of the recorded last build

