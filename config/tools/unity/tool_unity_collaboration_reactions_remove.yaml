tool: "unity_collaboration_reactions_remove"
date: "2026-10-18"
tags: ["unity", "cli", "collaboration"]
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Remove an emoji reaction from an annotation thread"
COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- collaboration reactions remove --no-banner --no-pager --non-interactive
  [ -n "{{annotationid}}" ] || { printf '%s\n' "$(msg argument_required 'annotationid' 'unity collaboration reactions remove')" >&2; exit 1; }
  [ -n "{{emoji}}" ] || { printf '%s\n' "$(msg argument_required 'emoji' 'unity collaboration reactions remove')" >&2; exit 1; }

  [ -n "{{annotationid}}" ] && set -- "$@" "{{annotationid}}"
  [ -n "{{emoji}}" ] && set -- "$@" "{{emoji}}"
  [ -n "{{project_id}}" ] && set -- "$@" --project-id "{{project_id}}"
  [ -n "{{project_path}}" ] && set -- "$@" --project-path "{{project_path}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_collaboration_reactions_remove)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"
ARGS:
  - {name: annotationid, type: text}
  - {name: emoji, type: text}
  - {name: project_id, type: text}   # Unity Cloud project id
  - {name: project_path, type: text}   # Path to the Unity project (defaults to the current directory); used to

