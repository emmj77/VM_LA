tool: "coplay_physics_overlap"
date: "2026-10-18"
tags: ["unity", "coplay", "physics"]
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Perform a physics overlap query."
COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing_paths)" >&2; exit 1; }
  set -f
  set -- physics overlap
  [ -n "{{shape}}" ] && set -- "$@" --shape "{{shape}}"
  [ -n "{{position}}" ] && set -- "$@" --position "{{position}}"
  [ -n "{{size}}" ] && set -- "$@" --size "{{size}}"
  [ -n "{{dimension}}" ] && set -- "$@" --dimension "{{dimension}}"

  OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
  RC=$?
  [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
  printf '%s\n' "$OUT"
ARGS:
  - {name: shape, type: text}
  - {name: position, type: text}
  - {name: size, type: text}
  - {name: dimension, type: text}

