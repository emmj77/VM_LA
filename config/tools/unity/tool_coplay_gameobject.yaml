tool: "coplay_gameobject"
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a game object: delete | duplicate | find | modify | move (op picks which) ; direction (move) : left | right | up | down | forward | back | front | backward | behind"
COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing)" >&2; exit 1; }
  case "{{op}}" in
  delete)
    set -f
    set -- gameobject delete
    case "{{force}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean 'force')" >&2; exit 1 ;; esac
    [ -n "{{target}}" ] || { printf '%s\n' "$(msg argument_required 'target' 'gameobject delete')" >&2; exit 1; }
    [ -n "{{search_method}}" ] && set -- "$@" --search-method "{{search_method}}"
    [ "{{force}}" = true ] && set -- "$@" --force
    [ -n "{{target}}" ] && set -- "$@" "{{target}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  duplicate)
    set -f
    set -- gameobject duplicate
    T=$(printf '%s' "{{offset}}" | tr -d '0123456789. -')
    [ -z "$T" ] || { printf '%s\n' "$(msg wants_numbers 'offset' '3' '%s')""{{offset}}" >&2; exit 1; }
    unset T
    [ -n "{{target}}" ] || { printf '%s\n' "$(msg argument_required 'target' 'gameobject duplicate')" >&2; exit 1; }
    [ -n "{{name}}" ] && set -- "$@" --name "{{name}}"
    [ -n "{{offset}}" ] && set -- "$@" --offset {{offset}}
    [ -n "{{search_method}}" ] && set -- "$@" --search-method "{{search_method}}"
    [ -n "{{target}}" ] && set -- "$@" "{{target}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  find)
    set -f
    set -- gameobject find
    case "{{include_inactive}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean 'include_inactive')" >&2; exit 1 ;; esac
    [ -n "{{search_term}}" ] || { printf '%s\n' "$(msg argument_required 'search_term' 'gameobject find')" >&2; exit 1; }
    [ -n "{{method}}" ] && set -- "$@" --method "{{method}}"
    [ "{{include_inactive}}" = true ] && set -- "$@" --include-inactive
    [ -n "{{limit}}" ] && set -- "$@" --limit "{{limit}}"
    [ -n "{{cursor}}" ] && set -- "$@" --cursor "{{cursor}}"
    [ -n "{{search_term}}" ] && set -- "$@" "{{search_term}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  modify)
    set -f
    set -- gameobject modify
    T=$(printf '%s' "{{position}}" | tr -d '0123456789. -')
    [ -z "$T" ] || { printf '%s\n' "$(msg wants_numbers 'position' '3' '%s')""{{position}}" >&2; exit 1; }
    unset T
    T=$(printf '%s' "{{rotation}}" | tr -d '0123456789. -')
    [ -z "$T" ] || { printf '%s\n' "$(msg wants_numbers 'rotation' '3' '%s')""{{rotation}}" >&2; exit 1; }
    unset T
    T=$(printf '%s' "{{scale}}" | tr -d '0123456789. -')
    [ -z "$T" ] || { printf '%s\n' "$(msg wants_numbers 'scale' '3' '%s')""{{scale}}" >&2; exit 1; }
    unset T
    case "{{active}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean 'active')" >&2; exit 1 ;; esac
    case "{{static}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean 'static')" >&2; exit 1 ;; esac
    [ -n "{{target}}" ] || { printf '%s\n' "$(msg argument_required 'target' 'gameobject modify')" >&2; exit 1; }
    [ -n "{{name}}" ] && set -- "$@" --name "{{name}}"
    [ -n "{{position}}" ] && set -- "$@" --position {{position}}
    [ -n "{{rotation}}" ] && set -- "$@" --rotation {{rotation}}
    [ -n "{{scale}}" ] && set -- "$@" --scale {{scale}}
    [ -n "{{parent}}" ] && set -- "$@" --parent "{{parent}}"
    [ -n "{{tag}}" ] && set -- "$@" --tag "{{tag}}"
    [ -n "{{layer}}" ] && set -- "$@" --layer "{{layer}}"
    [ "{{active}}" = true ] && set -- "$@" --active
    [ "{{static}}" = true ] && set -- "$@" --static
    [ -n "{{add_components}}" ] && set -- "$@" --add-components "{{add_components}}"
    [ -n "{{remove_components}}" ] && set -- "$@" --remove-components "{{remove_components}}"
    [ -n "{{search_method}}" ] && set -- "$@" --search-method "{{search_method}}"
    [ -n "{{target}}" ] && set -- "$@" "{{target}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  move)
    set -f
    set -- gameobject move
    case "{{local}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean 'local')" >&2; exit 1 ;; esac
    [ -n "{{target}}" ] || { printf '%s\n' "$(msg argument_required 'target' 'gameobject move')" >&2; exit 1; }
    [ -n "{{reference}}" ] && set -- "$@" --reference "{{reference}}"
    [ -n "{{direction}}" ] && set -- "$@" --direction "{{direction}}"
    [ -n "{{distance}}" ] && set -- "$@" --distance "{{distance}}"
    [ "{{local}}" = true ] && set -- "$@" --local
    [ -n "{{search_method}}" ] && set -- "$@" --search-method "{{search_method}}"
    [ -n "{{target}}" ] && set -- "$@" "{{target}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  esac
ARGS:
  - {name: op, type: enum, values: [delete, duplicate, find, modify, move]}
  - {name: search_term, type: text}
  - {name: target, type: text}
  - {name: add_components, type: text}
  - {name: cursor, type: int}
  - {name: direction, type: text}
  - {name: distance, type: text}
  - {name: layer, type: text}
  - {name: limit, type: int}
  - {name: method, type: text}
  - {name: name, type: text}
  - {name: parent, type: text}
  - {name: reference, type: text}
  - {name: remove_components, type: text}
  - {name: search_method, type: text}
  - {name: tag, type: text}
  - {name: active, type: text}
  - {name: force, type: text}
  - {name: include_inactive, type: text}
  - {name: local, type: text}
  - {name: offset, type: text}
  - {name: position, type: text}
  - {name: rotation, type: text}
  - {name: scale, type: text}
  - {name: static, type: text}
