tool: "coplay_graphics_pipeline_set"
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "the render pipeline settings: quality | settings (op picks which)"
COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing)" >&2; exit 1; }
  case "{{op}}" in
  quality)
    set -f
    set -- graphics pipeline-set-quality
    [ -n "{{level}}" ] && set -- "$@" --level "{{level}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  settings)
    set -f
    set -- graphics pipeline-set-settings
    T=$(printf '%s' "{{setting}}" | tr -d '0123456789. -')
    [ -z "$T" ] || { printf '%s\n' "$(msg wants_numbers 'setting' '2' '%s')""{{setting}}" >&2; exit 1; }
    unset T
    [ -n "{{setting}}" ] && set -- "$@" --setting {{setting}}
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  esac
ARGS:
  - {name: op, type: enum, values: [quality, settings]}
  - {name: level, type: text}
  - {name: setting, type: text}
