tool: "coplay_audio"
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "an audio source: play | stop | volume (op picks which)"
COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing)" >&2; exit 1; }
  case "{{op}}" in
  play)
    set -f
    set -- audio play
    [ -n "{{target}}" ] || { printf '%s\n' "$(msg argument_required 'target' 'audio play')" >&2; exit 1; }
    [ -n "{{clip}}" ] && set -- "$@" --clip "{{clip}}"
    [ -n "{{search_method}}" ] && set -- "$@" --search-method "{{search_method}}"
    [ -n "{{target}}" ] && set -- "$@" "{{target}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  stop)
    set -f
    set -- audio stop
    [ -n "{{target}}" ] || { printf '%s\n' "$(msg argument_required 'target' 'audio stop')" >&2; exit 1; }
    [ -n "{{search_method}}" ] && set -- "$@" --search-method "{{search_method}}"
    [ -n "{{target}}" ] && set -- "$@" "{{target}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  volume)
    set -f
    set -- audio volume
    [ -n "{{target}}" ] || { printf '%s\n' "$(msg argument_required 'target' 'audio volume')" >&2; exit 1; }
    [ -n "{{level}}" ] || { printf '%s\n' "$(msg argument_required 'level' 'audio volume')" >&2; exit 1; }
    [ -n "{{search_method}}" ] && set -- "$@" --search-method "{{search_method}}"
    [ -n "{{target}}" ] && set -- "$@" "{{target}}"
    [ -n "{{level}}" ] && set -- "$@" "{{level}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  esac
ARGS:
  - {name: op, type: enum, values: [play, stop, volume]}
  - {name: target, type: text}
  - {name: level, type: text}
  - {name: clip, type: text}
  - {name: search_method, type: text}
