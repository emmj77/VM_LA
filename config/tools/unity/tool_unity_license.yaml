# QUI : list the unity licenses active on this machine
# ORIGINE : migre tel quel de la ligne 151 du registre (2026-10-17). Le corps n'a PAS ete reecrit ici.
# REFUSE : (a completer par l'auteur -- ce que ce tool refuse, en le nommant)
tool: "unity_license"
date: "2026-10-17"
tags: ["unity", "unity_license"]

unity
doc: unity

RULES:
  enabled: true
  timeout: 40

DESCRIPTION: "list the unity licenses active on this machine"

COMMAND: |
  unity --no-banner --no-pager --non-interactive --format json license </dev/null

ARGS: []                    # aucun argument : ce tool se nomme seul
