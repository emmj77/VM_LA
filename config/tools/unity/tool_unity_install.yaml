tool: "unity_install"
date: "2026-10-18"
tags: ["unity", "cli", "install"]
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Install a Unity editor"
COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- install --no-banner --no-pager --non-interactive
  case "{{cm}}" in ''|true|false) ;; *) printf '%s\n' "$(msg cm_true_false)" >&2; exit 1 ;; esac
  case "{{no_cm}}" in ''|true|false) ;; *) printf '%s\n' "$(msg cm_true_false_2)" >&2; exit 1 ;; esac
  case "{{force}}" in ''|true|false) ;; *) printf '%s\n' "$(msg force_true_false)" >&2; exit 1 ;; esac
  case "{{yes}}" in ''|true|false) ;; *) printf '%s\n' "$(msg yes_true_false)" >&2; exit 1 ;; esac
  case "{{accept_eula}}" in ''|true|false) ;; *) printf '%s\n' "$(msg accept_eula_true_false)" >&2; exit 1 ;; esac
  case "{{dry_run}}" in ''|true|false) ;; *) printf '%s\n' "$(msg dry_run_true_false)" >&2; exit 1 ;; esac
  case "{{resume}}" in ''|true|false) ;; *) printf '%s\n' "$(msg resume_true_false)" >&2; exit 1 ;; esac
  case "{{no_elevate}}" in ''|true|false) ;; *) printf '%s\n' "$(msg elevate_true_false)" >&2; exit 1 ;; esac
  case "{{list_modules}}" in ''|true|false) ;; *) printf '%s\n' "$(msg list_modules_true_false)" >&2; exit 1 ;; esac

  [ -n "{{version}}" ] && set -- "$@" "{{version}}"
  [ -n "{{architecture}}" ] && set -- "$@" --architecture "{{architecture}}"
  [ -n "{{changeset}}" ] && set -- "$@" --changeset "{{changeset}}"
  [ -n "{{module}}" ] && set -- "$@" --module "{{module}}"
  [ "{{cm}}" = true ] && set -- "$@" --cm
  [ "{{no_cm}}" = true ] && set -- "$@" --no-cm
  [ "{{force}}" = true ] && set -- "$@" --force
  [ "{{yes}}" = true ] && set -- "$@" --yes
  [ "{{accept_eula}}" = true ] && set -- "$@" --accept-eula
  [ "{{dry_run}}" = true ] && set -- "$@" --dry-run
  [ "{{resume}}" = true ] && set -- "$@" --resume
  [ "{{no_elevate}}" = true ] && set -- "$@" --no-elevate
  [ "{{list_modules}}" = true ] && set -- "$@" --list-modules
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_install_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"
ARGS:
  - {name: version, type: text}   # facultatif
  - {name: architecture, type: text}   # Editor architecture (x86_64 or arm64)
  - {name: changeset, type: text}   # Changeset for archive installs
  - {name: module, type: text}   # Module IDs to install alongside editor
  - {name: cm, type: text}   # true pour poser --cm ; Install all child modules automatically
  - {name: no_cm, type: text}   # true pour poser --no-cm ; Do not install child modules automatically
  - {name: force, type: text}   # true pour poser --force ; Force reinstall of an already-installed editor
  - {name: yes, type: text}   # true pour poser --yes ; Automatically select the first match without prompting
  - {name: accept_eula, type: text}   # true pour poser --accept-eula ; Accept all module license agreements automatically
  - {name: dry_run, type: text}   # true pour poser --dry-run ; Print what would be downloaded without installing
  - {name: resume, type: text}   # true pour poser --resume ; Resume interrupted downloads from cache
  - {name: no_elevate, type: text}   # true pour poser --no-elevate ; Skip the elevated (UAC) install helper on Windows; the Editor installe
  - {name: list_modules, type: text}   # true pour poser --list-modules ; List the editor's modules with the Hub id and accepted aliases, then e

