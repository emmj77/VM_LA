tool: "unity_modules_list"
date: "2026-10-18"
tags: ["unity", "cli", "modules"]
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "List available modules for an editor version"
COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- modules list --no-banner --no-pager --non-interactive
  [ -n "{{version}}" ] || { printf '%s\n' "$(msg argument_required 'version' 'unity modules list')" >&2; exit 1; }

  [ -n "{{version}}" ] && set -- "$@" "{{version}}"
  [ -n "{{architecture}}" ] && set -- "$@" --architecture "{{architecture}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_modules_list_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"
ARGS:
  - {name: version, type: text}
  - {name: architecture, type: text}   # CPU architecture to use when multiple builds are installed for the sam

