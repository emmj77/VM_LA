tool: "unity_vcs_uvcs_review_comments"
date: "2026-10-18"
tags: ["unity", "cli", "vcs"]
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Read a review's comments with the file and line each one is anchored to"
COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- vcs uvcs review comments --no-banner --no-pager --non-interactive
  case "{{all_activity}}" in ''|true|false) ;; *) printf '%s\n' "$(msg all_activity_true_false)" >&2; exit 1 ;; esac

  [ -n "{{path}}" ] && set -- "$@" "{{path}}"
  [ -n "{{review}}" ] && set -- "$@" --review "{{review}}"
  [ -n "{{changeset}}" ] && set -- "$@" --changeset "{{changeset}}"
  [ -n "{{branch}}" ] && set -- "$@" --branch "{{branch}}"
  [ "{{all_activity}}" = true ] && set -- "$@" --all-activity
  [ -n "{{limit}}" ] && set -- "$@" --limit "{{limit}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_vcs_uvcs_review_4)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"
ARGS:
  - {name: path, type: text}   # facultatif
  - {name: review, type: text}   # The review to read, by id
  - {name: changeset, type: text}   # Read the review attached to this changeset instead
  - {name: branch, type: text}   # Read the review attached to this branch instead
  - {name: all_activity, type: text}   # true pour poser --all-activity ; Include status changes and reviewer requests, not just file comments
  - {name: limit, type: text}   # How many rows to return (default 50, max 500)

