tool: "coplay_material_info"
date: "2026-10-18"
tags: ["unity", "coplay", "material"]
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Get information about a material."
COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing_paths)" >&2; exit 1; }
  set -f
  set -- material info
  [ -n "{{path}}" ] || { printf '%s\n' "$(msg argument_required 'path' 'material info')" >&2; exit 1; }
  [ -n "{{path}}" ] && set -- "$@" "{{path}}"

  OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
  RC=$?
  [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
  printf '%s\n' "$OUT"
ARGS:
  - {name: path, type: text}

