tool: "coplay_vfx_trail"
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a trail renderer: clear | info | set-time (op picks which)"
COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing)" >&2; exit 1; }
  case "{{op}}" in
  clear)
    set -f
    set -- vfx trail clear
    [ -n "{{target}}" ] || { printf '%s\n' "$(msg argument_required 'target' 'vfx trail clear')" >&2; exit 1; }
    [ -n "{{search_method}}" ] && set -- "$@" --search-method "{{search_method}}"
    [ -n "{{component_index}}" ] && set -- "$@" --component-index "{{component_index}}"
    [ -n "{{target}}" ] && set -- "$@" "{{target}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  info)
    set -f
    set -- vfx trail info
    [ -n "{{target}}" ] || { printf '%s\n' "$(msg argument_required 'target' 'vfx trail info')" >&2; exit 1; }
    [ -n "{{search_method}}" ] && set -- "$@" --search-method "{{search_method}}"
    [ -n "{{component_index}}" ] && set -- "$@" --component-index "{{component_index}}"
    [ -n "{{target}}" ] && set -- "$@" "{{target}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  set-time)
    set -f
    set -- vfx trail set-time
    [ -n "{{target}}" ] || { printf '%s\n' "$(msg argument_required 'target' 'vfx trail set-time')" >&2; exit 1; }
    [ -n "{{duration}}" ] || { printf '%s\n' "$(msg argument_required 'duration' 'vfx trail set-time')" >&2; exit 1; }
    [ -n "{{search_method}}" ] && set -- "$@" --search-method "{{search_method}}"
    [ -n "{{component_index}}" ] && set -- "$@" --component-index "{{component_index}}"
    [ -n "{{target}}" ] && set -- "$@" "{{target}}"
    [ -n "{{duration}}" ] && set -- "$@" "{{duration}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  esac
ARGS:
  - {name: op, type: enum, values: [clear, info, set-time]}
  - {name: target, type: text}
  - {name: duration, type: text}
  - {name: component_index, type: int}
  - {name: search_method, type: text}
