tool: "coplay_ui_create"
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "a UI element: create-button | create-canvas | create-image | create-text (op picks which)"
COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing)" >&2; exit 1; }
  case "{{op}}" in
  create-button)
    set -f
    set -- ui create-button
    [ -n "{{name}}" ] || { printf '%s\n' "$(msg argument_required 'name' 'ui create-button')" >&2; exit 1; }
    [ -n "{{parent}}" ] && set -- "$@" --parent "{{parent}}"
    [ -n "{{text}}" ] && set -- "$@" --text "{{text}}"
    [ -n "{{name}}" ] && set -- "$@" "{{name}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  create-canvas)
    set -f
    set -- ui create-canvas
    [ -n "{{name}}" ] || { printf '%s\n' "$(msg argument_required 'name' 'ui create-canvas')" >&2; exit 1; }
    [ -n "{{render_mode}}" ] && set -- "$@" --render-mode "{{render_mode}}"
    [ -n "{{name}}" ] && set -- "$@" "{{name}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  create-image)
    set -f
    set -- ui create-image
    [ -n "{{name}}" ] || { printf '%s\n' "$(msg argument_required 'name' 'ui create-image')" >&2; exit 1; }
    [ -n "{{parent}}" ] && set -- "$@" --parent "{{parent}}"
    [ -n "{{sprite}}" ] && set -- "$@" --sprite "{{sprite}}"
    [ -n "{{name}}" ] && set -- "$@" "{{name}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  create-text)
    set -f
    set -- ui create-text
    T=$(printf '%s' "{{position}}" | tr -d '0123456789. -')
    [ -z "$T" ] || { printf '%s\n' "$(msg wants_numbers 'position' '2' '%s')""{{position}}" >&2; exit 1; }
    unset T
    [ -n "{{name}}" ] || { printf '%s\n' "$(msg argument_required 'name' 'ui create-text')" >&2; exit 1; }
    [ -n "{{parent}}" ] && set -- "$@" --parent "{{parent}}"
    [ -n "{{text}}" ] && set -- "$@" --text "{{text}}"
    [ -n "{{position}}" ] && set -- "$@" --position {{position}}
    [ -n "{{name}}" ] && set -- "$@" "{{name}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  esac
ARGS:
  - {name: op, type: enum, values: [create-button, create-canvas, create-image, create-text]}
  - {name: name, type: text}
  - {name: parent, type: text}
  - {name: render_mode, type: text}
  - {name: sprite, type: text}
  - {name: text, type: text}
  - {name: position, type: text}
