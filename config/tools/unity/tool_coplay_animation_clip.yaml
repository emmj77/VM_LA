tool: "coplay_animation_clip"
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "an animation clip: add-curve | add-event | assign | create | create-preset | info | remove-event | set-curve | set-vector-curve (op picks which) ; preset (create-preset) : bounce | rotate | pulse | fade | shake | hover | spin | sway | bob | wiggle | blink | slide_in | elastic"
COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing)" >&2; exit 1; }
  case "{{op}}" in
  add-curve)
    set -f
    set -- animation clip add-curve
    [ -n "{{clip_path}}" ] || { printf '%s\n' "$(msg argument_required 'clip_path' 'animation clip add-curve')" >&2; exit 1; }
    [ -n "{{property_path}}" ] && set -- "$@" --property "{{property_path}}"
    [ -n "{{component_type}}" ] && set -- "$@" --type "{{component_type}}"
    [ -n "{{keys}}" ] && set -- "$@" --keys "{{keys}}"
    [ -n "{{clip_path}}" ] && set -- "$@" "{{clip_path}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  add-event)
    set -f
    set -- animation clip add-event
    [ -n "{{clip_path}}" ] || { printf '%s\n' "$(msg argument_required 'clip_path' 'animation clip add-event')" >&2; exit 1; }
    [ -n "{{function_name}}" ] && set -- "$@" --function "{{function_name}}"
    [ -n "{{time}}" ] && set -- "$@" --time "{{time}}"
    [ -n "{{string_param}}" ] && set -- "$@" --string-param "{{string_param}}"
    [ -n "{{float_param}}" ] && set -- "$@" --float-param "{{float_param}}"
    [ -n "{{int_param}}" ] && set -- "$@" --int-param "{{int_param}}"
    [ -n "{{clip_path}}" ] && set -- "$@" "{{clip_path}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  assign)
    set -f
    set -- animation clip assign
    [ -n "{{target}}" ] || { printf '%s\n' "$(msg argument_required 'target' 'animation clip assign')" >&2; exit 1; }
    [ -n "{{clip_path}}" ] || { printf '%s\n' "$(msg argument_required 'clip_path' 'animation clip assign')" >&2; exit 1; }
    [ -n "{{search_method}}" ] && set -- "$@" --search-method "{{search_method}}"
    [ -n "{{target}}" ] && set -- "$@" "{{target}}"
    [ -n "{{clip_path}}" ] && set -- "$@" "{{clip_path}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  create)
    set -f
    set -- animation clip create
    case "{{loop}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean 'loop')" >&2; exit 1 ;; esac
    [ -n "{{clip_path}}" ] || { printf '%s\n' "$(msg argument_required 'clip_path' 'animation clip create')" >&2; exit 1; }
    [ -n "{{name}}" ] && set -- "$@" --name "{{name}}"
    [ -n "{{length}}" ] && set -- "$@" --length "{{length}}"
    [ "{{loop}}" = true ] && set -- "$@" --loop
    [ -n "{{frame_rate}}" ] && set -- "$@" --frame-rate "{{frame_rate}}"
    [ -n "{{clip_path}}" ] && set -- "$@" "{{clip_path}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  create-preset)
    set -f
    set -- animation clip create-preset
    case "{{loop}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean 'loop')" >&2; exit 1 ;; esac
    [ -n "{{clip_path}}" ] || { printf '%s\n' "$(msg argument_required 'clip_path' 'animation clip create-preset')" >&2; exit 1; }
    [ -n "{{preset}}" ] || { printf '%s\n' "$(msg argument_required 'preset' 'animation clip create-preset')" >&2; exit 1; }
    [ -n "{{duration}}" ] && set -- "$@" --duration "{{duration}}"
    [ -n "{{amplitude}}" ] && set -- "$@" --amplitude "{{amplitude}}"
    [ "{{loop}}" = true ] && set -- "$@" --loop
    [ -n "{{clip_path}}" ] && set -- "$@" "{{clip_path}}"
    [ -n "{{preset}}" ] && set -- "$@" "{{preset}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  info)
    set -f
    set -- animation clip info
    [ -n "{{clip_path}}" ] || { printf '%s\n' "$(msg argument_required 'clip_path' 'animation clip info')" >&2; exit 1; }
    [ -n "{{clip_path}}" ] && set -- "$@" "{{clip_path}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  remove-event)
    set -f
    set -- animation clip remove-event
    [ -n "{{clip_path}}" ] || { printf '%s\n' "$(msg argument_required 'clip_path' 'animation clip remove-event')" >&2; exit 1; }
    [ -n "{{event_index}}" ] && set -- "$@" --event-index "{{event_index}}"
    [ -n "{{function_name}}" ] && set -- "$@" --function "{{function_name}}"
    [ -n "{{time}}" ] && set -- "$@" --time "{{time}}"
    [ -n "{{clip_path}}" ] && set -- "$@" "{{clip_path}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  set-curve)
    set -f
    set -- animation clip set-curve
    [ -n "{{clip_path}}" ] || { printf '%s\n' "$(msg argument_required 'clip_path' 'animation clip set-curve')" >&2; exit 1; }
    [ -n "{{property_path}}" ] && set -- "$@" --property "{{property_path}}"
    [ -n "{{component_type}}" ] && set -- "$@" --type "{{component_type}}"
    [ -n "{{keys}}" ] && set -- "$@" --keys "{{keys}}"
    [ -n "{{clip_path}}" ] && set -- "$@" "{{clip_path}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  set-vector-curve)
    set -f
    set -- animation clip set-vector-curve
    [ -n "{{clip_path}}" ] || { printf '%s\n' "$(msg argument_required 'clip_path' 'animation clip set-vector-curve')" >&2; exit 1; }
    [ -n "{{vector_property}}" ] && set -- "$@" --property "{{vector_property}}"
    [ -n "{{component_type}}" ] && set -- "$@" --type "{{component_type}}"
    [ -n "{{keys}}" ] && set -- "$@" --keys "{{keys}}"
    [ -n "{{clip_path}}" ] && set -- "$@" "{{clip_path}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  esac
ARGS:
  - {name: op, type: enum, values: [add-curve, add-event, assign, create, create-preset, info, remove-event, set-curve, set-vector-curve]}
  - {name: target, type: text}
  - {name: clip_path, type: text}
  - {name: preset, type: text}
  - {name: amplitude, type: text}
  - {name: component_type, type: text}
  - {name: duration, type: text}
  - {name: event_index, type: int}
  - {name: float_param, type: text}
  - {name: frame_rate, type: text}
  - {name: function_name, type: text}
  - {name: int_param, type: int}
  - {name: keys, type: text}
  - {name: length, type: text}
  - {name: name, type: text}
  - {name: property_path, type: text}
  - {name: search_method, type: text}
  - {name: string_param, type: text}
  - {name: time, type: text}
  - {name: vector_property, type: text}
  - {name: loop, type: text}
