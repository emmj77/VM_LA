tool: "upipe_set_autotick"
date: "2026-10-18"
tags: ["unity", "pipeline", "set_autotick"]
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Keep the editor ticking while unfocused by forcing EditorApplication.SignalTick at a throttled rate."
COMMAND: |
  PROJ=$(sed -n '1p' "$ROOT/projects/.active" 2>/dev/null | tr -d '\r')
  P=
  [ -n "$PROJ" ] && P=$(sed -n 's/^path:[[:space:]]*//p' "$ROOT/projects/$PROJ/project.yml" 2>/dev/null | head -1 | tr -d '"')
  [ -n "$P" ] || { printf '%s\n' "$(msg no_project_unity)" >&2; exit 1; }
  case "$P" in /*) ;; *) P="$HOME/$P" ;; esac
  [ -d "$P" ] || { printf '%s\n' "$(msg project_missing '%s')""$P" >&2; exit 1; }
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  case "{{enable}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean_in 'enable' 'set_autotick')""{{enable}}" >&2; exit 1 ;; esac
  case "{{persist}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean_in 'persist' 'set_autotick')""{{persist}}" >&2; exit 1 ;; esac
  set -- command --project-path "$P" set_autotick
  [ -n "{{enable}}" ] && set -- "$@" --enable "{{enable}}"
  [ -n "{{interval_ms}}" ] && set -- "$@" --interval_ms "{{interval_ms}}"
  [ -n "{{persist}}" ] && set -- "$@" --persist "{{persist}}"

  OUT=$(timeout 90 "$CLI" --no-banner --no-pager --non-interactive --format json "$@" </dev/null 2>&1)
  printf '%s' "$OUT" | jq -e '.success == true' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | jq -r '.errors[0].message // .errors[0].code // "reponse illisible du CLI"' 2>/dev/null || printf '%s' "$OUT")" >&2; exit 1; }
  printf '%s\n' "$OUT" | jq -c '.data'
ARGS:
  - {name: enable, type: text}          # true|false, vide pour ne rien poser
  - {name: interval_ms, type: int}
  - {name: persist, type: text}          # true|false, vide pour ne rien poser

