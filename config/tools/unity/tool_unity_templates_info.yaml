tool: "unity_templates_info"
date: "2026-10-18"
tags: ["unity", "cli", "templates"]
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Show detailed information about a Unity project template"
COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- templates info --no-banner --no-pager --non-interactive
  [ -n "{{name}}" ] || { printf '%s\n' "$(msg argument_required 'name' 'unity templates info')" >&2; exit 1; }

  [ -n "{{name}}" ] && set -- "$@" "{{name}}"
  [ -n "{{editor}}" ] && set -- "$@" --editor "{{editor}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_templates_info_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"
ARGS:
  - {name: name, type: text}
  - {name: editor, type: text}   # Unity editor version (uses stored default if omitted)

