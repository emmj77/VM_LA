tool: "coplay_probuilder_move_vertices"
date: "2026-10-18"
tags: ["unity", "coplay", "probuilder"]
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Move vertices by an offset."
COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing_paths)" >&2; exit 1; }
  set -f
  set -- probuilder move-vertices
  T=$(printf '%s' "{{offset}}" | tr -d '0123456789. -')
  [ -z "$T" ] || { printf '%s\n' "$(msg wants_numbers 'offset' '3' '%s')""{{offset}}" >&2; exit 1; }
  unset T
  [ -n "{{target}}" ] || { printf '%s\n' "$(msg argument_required 'target' 'probuilder move-vertices')" >&2; exit 1; }
  [ -n "{{vertices}}" ] && set -- "$@" --vertices "{{vertices}}"
  [ -n "{{offset}}" ] && set -- "$@" --offset {{offset}}
  [ -n "{{search_method}}" ] && set -- "$@" --search-method "{{search_method}}"
  [ -n "{{target}}" ] && set -- "$@" "{{target}}"

  OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
  RC=$?
  [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
  printf '%s\n' "$OUT"
ARGS:
  - {name: vertices, type: text}
  - {name: offset, type: text}          # 3 nombres : x y z
  - {name: search_method, type: text}          # un de : by_name | by_path | by_id | by_tag | by_layer
  - {name: target, type: text}

