tool: "unity_pipeline_cloud_build_builds_list"
date: "2026-10-18"
tags: ["unity", "cli", "pipeline"]
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "List Build Automation builds"
COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- pipeline cloud-build builds list --no-banner --no-pager --non-interactive


  [ -n "{{build_target}}" ] && set -- "$@" --build-target "{{build_target}}"
  [ -n "{{page}}" ] && set -- "$@" --page "{{page}}"
  [ -n "{{limit}}" ] && set -- "$@" --limit "{{limit}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_pipeline_cloud_build_2)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"
ARGS:
  - {name: build_target, type: text}   # Limit the results to one build target. Omit to include every target.
  - {name: page, type: text}   # The page of results to return, starting at 1. Defaults to 1.
  - {name: limit, type: text}   # The number of results per page, from 1 through 100. Defaults to 25.

