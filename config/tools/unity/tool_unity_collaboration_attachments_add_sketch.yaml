tool: "unity_collaboration_attachments_add_sketch"
date: "2026-10-18"
tags: ["unity", "cli", "collaboration"]
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Add a sketch attachment to an annotation"
COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- collaboration attachments add sketch --no-banner --no-pager --non-interactive
  [ -n "{{annotationid}}" ] || { printf '%s\n' "$(msg argument_required 'annotationid' 'unity collaboration attachments add sketch')" >&2; exit 1; }

  [ -n "{{annotationid}}" ] && set -- "$@" "{{annotationid}}"
  [ -n "{{sketch_data}}" ] && set -- "$@" --sketch-data "{{sketch_data}}"
  [ -n "{{camera}}" ] && set -- "$@" --camera "{{camera}}"
  [ -n "{{time}}" ] && set -- "$@" --time "{{time}}"
  [ -n "{{preview}}" ] && set -- "$@" --preview "{{preview}}"
  [ -n "{{sketch_image}}" ] && set -- "$@" --sketch-image "{{sketch_image}}"
  [ -n "{{project_id}}" ] && set -- "$@" --project-id "{{project_id}}"
  [ -n "{{project_path}}" ] && set -- "$@" --project-path "{{project_path}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_collaboration_attachments_add)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"
ARGS:
  - {name: annotationid, type: text}
  - {name: sketch_data, type: text}   # Sketch data as a JSON string
  - {name: camera, type: text}   # Camera state as a JSON object (position, rotation required)
  - {name: time, type: text}   # Playback time as a JSON object (timeScale, timeStamp)
  - {name: preview, type: text}   # Path to a preview image file
  - {name: sketch_image, type: text}   # Path to a rendered sketch image file
  - {name: project_id, type: text}   # Unity Cloud project id
  - {name: project_path, type: text}   # Path to the Unity project (defaults to the current directory); used to

