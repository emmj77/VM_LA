tool: "unity_config_update_check"
date: "2026-10-18"
tags: ["unity", "cli", "config"]
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Enable or disable the background check for CLI updates"
COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- config update-check --no-banner --no-pager --non-interactive


  [ -n "{{state}}" ] && set -- "$@" "{{state}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_config_update_check)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"
ARGS:
  - {name: state, type: text}   # facultatif

