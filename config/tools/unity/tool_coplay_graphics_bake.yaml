tool: "coplay_graphics_bake"
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "the lightmap bake: cancel | clear | settings | start | status (op picks which)"
COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing)" >&2; exit 1; }
  case "{{op}}" in
  cancel)
    set -f
    set -- graphics bake-cancel
    :
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  clear)
    set -f
    set -- graphics bake-clear
    :
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  settings)
    set -f
    set -- graphics bake-settings
    :
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  start)
    set -f
    set -- graphics bake-start
    case "{{sync}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean 'sync')" >&2; exit 1 ;; esac
    [ "{{sync}}" = true ] && set -- "$@" --sync
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  status)
    set -f
    set -- graphics bake-status
    :
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  esac
ARGS:
  - {name: op, type: enum, values: [cancel, clear, settings, start, status]}
  - {name: sync, type: text}
