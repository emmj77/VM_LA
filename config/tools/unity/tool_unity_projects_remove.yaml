tool: "unity_projects_remove"
date: "2026-10-18"
tags: ["unity", "cli", "projects"]
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Remove projects from the Hub registry (does not delete files on disk)"
COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- projects remove --no-banner --no-pager --non-interactive
  T=$(printf '%s' "{{paths}}" | tr -d 'A-Za-z0-9_./ -')
  [ -z "$T" ] || { printf '%s\n' "$(msg paths_wants_space_separated)" >&2; exit 1; }
  case "{{force}}" in ''|true|false) ;; *) printf '%s\n' "$(msg force_true_false)" >&2; exit 1 ;; esac

  [ -n "{{paths}}" ] && set -- "$@" {{paths}}
  [ "{{force}}" = true ] && set -- "$@" --force
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_projects_remove_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"
ARGS:
  - {name: paths, type: text}   # plusieurs valeurs separees par des espaces
  - {name: force, type: text}   # true pour poser --force ; Skip confirmation prompt

