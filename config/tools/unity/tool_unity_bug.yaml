tool: "unity_bug"
date: "2026-10-18"
tags: ["unity", "cli", "bug"]
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Report a bug directly to the Unity bug reporter (requires you to be signed in)"
COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- bug --no-banner --no-pager --non-interactive


  [ -n "{{email}}" ] && set -- "$@" --email "{{email}}"
  [ -n "{{title}}" ] && set -- "$@" --title "{{title}}"
  [ -n "{{description}}" ] && set -- "$@" --description "{{description}}"
  [ -n "{{steps}}" ] && set -- "$@" --steps "{{steps}}"
  [ -n "{{reproducibility}}" ] && set -- "$@" --reproducibility "{{reproducibility}}"
  [ -n "{{attachments}}" ] && set -- "$@" --attachments "{{attachments}}"
  [ -n "{{share_project}}" ] && set -- "$@" --share-project "{{share_project}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_bug_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"
ARGS:
  - {name: email, type: text}   # Contact email for the report (defaults to your Unity account email; ov
  - {name: title, type: text}   # One-line summary of the bug (at least 3 characters)
  - {name: description, type: text}   # What happened (at least 10 characters)
  - {name: steps, type: text}   # Steps to reproduce; repeat values to add lines
  - {name: reproducibility, type: text}   # How often the bug reproduces
  - {name: attachments, type: text}   # Files to attach to the report; repeat to add multiple
  - {name: share_project, type: text}   # Attach a copy of the Unity project at this path (use . for the current

