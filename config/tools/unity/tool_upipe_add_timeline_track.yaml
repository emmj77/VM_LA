tool: "upipe_add_timeline_track"
date: "2026-10-18"
tags: ["unity", "pipeline", "add_timeline_track"]
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Add a track (Animation | Audio | Activation | Control | Playable | Signal | Marker) to a TimelineAsset, optionally nested under a parent group/track."
COMMAND: |
  PROJ=$(sed -n '1p' "$ROOT/projects/.active" 2>/dev/null | tr -d '\r')
  P=
  [ -n "$PROJ" ] && P=$(sed -n 's/^path:[[:space:]]*//p' "$ROOT/projects/$PROJ/project.yml" 2>/dev/null | head -1 | tr -d '"')
  [ -n "$P" ] || { printf '%s\n' "$(msg no_project_unity)" >&2; exit 1; }
  case "$P" in /*) ;; *) P="$HOME/$P" ;; esac
  [ -d "$P" ] || { printf '%s\n' "$(msg project_missing '%s')""$P" >&2; exit 1; }
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -n "{{timeline}}" ] || { printf '%s\n' "$(msg argument_required 'timeline' 'add_timeline_track')" >&2; exit 1; }
  [ -n "{{trackType}}" ] || { printf '%s\n' "$(msg argument_required 'trackType' 'add_timeline_track')" >&2; exit 1; }
  case "{{dry_run}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean_in 'dry_run' 'add_timeline_track')""{{dry_run}}" >&2; exit 1 ;; esac
  set -- command --project-path "$P" add_timeline_track
  [ -n "{{timeline}}" ] && set -- "$@" --timeline "{{timeline}}"
  [ -n "{{trackType}}" ] && set -- "$@" --trackType "{{trackType}}"
  [ -n "{{name}}" ] && set -- "$@" --name "{{name}}"
  [ -n "{{parentTrack}}" ] && set -- "$@" --parentTrack "{{parentTrack}}"
  [ -n "{{dry_run}}" ] && set -- "$@" --dry_run "{{dry_run}}"

  OUT=$(timeout 90 "$CLI" --no-banner --no-pager --non-interactive --format json "$@" </dev/null 2>&1)
  printf '%s' "$OUT" | jq -e '.success == true' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | jq -r '.errors[0].message // .errors[0].code // "reponse illisible du CLI"' 2>/dev/null || printf '%s' "$OUT")" >&2; exit 1; }
  printf '%s\n' "$OUT" | jq -c '.data'
ARGS:
  - {name: timeline, type: text}
  - {name: trackType, type: text}
  - {name: name, type: text}
  - {name: parentTrack, type: text}
  - {name: dry_run, type: text}          # true|false, vide pour ne rien poser

