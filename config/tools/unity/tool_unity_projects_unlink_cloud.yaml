tool: "unity_projects_unlink_cloud"
date: "2026-10-18"
tags: ["unity", "cli", "projects"]
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Disable Unity Cloud for a local project"
COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- projects unlink cloud --no-banner --no-pager --non-interactive
  [ -n "{{path}}" ] || { printf '%s\n' "$(msg argument_required 'path' 'unity projects unlink cloud')" >&2; exit 1; }
  case "{{cascade_vcs}}" in ''|true|false) ;; *) printf '%s\n' "$(msg cascade_vcs_true_false)" >&2; exit 1 ;; esac
  case "{{unlink_workspace}}" in ''|true|false) ;; *) printf '%s\n' "$(msg unlink_workspace_true_false)" >&2; exit 1 ;; esac

  [ -n "{{path}}" ] && set -- "$@" "{{path}}"
  [ "{{cascade_vcs}}" = true ] && set -- "$@" --cascade-vcs
  [ "{{unlink_workspace}}" = true ] && set -- "$@" --unlink-workspace
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_projects_unlink_cloud)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"
ARGS:
  - {name: path, type: text}
  - {name: cascade_vcs, type: text}   # true pour poser --cascade-vcs ; Also remove the Unity Version Control workspace bound to this project.
  - {name: unlink_workspace, type: text}   # true pour poser --unlink-workspace ; Confirm cascade removal of a UVCS workspace that contains other projec

