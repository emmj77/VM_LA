# QUI : print diagnostic info about your unity cli environment
# ORIGINE : migre tel quel de la ligne 146 du registre (2026-10-17). Le corps n'a PAS ete reecrit ici.
# REFUSE : (a completer par l'auteur -- ce que ce tool refuse, en le nommant)
tool: "unity_doctor"
date: "2026-10-17"
tags: ["unity", "unity_doctor"]

doc: unity

RULES:
  enabled: true
  timeout: 40

DESCRIPTION: "print diagnostic info about your unity cli environment"

COMMAND: |
  unity --no-banner --no-pager --non-interactive --format json doctor </dev/null

ARGS: []                    # aucun argument : ce tool se nomme seul
