tool: "unity_templates_list"
date: "2026-10-18"
tags: ["unity", "cli", "templates"]
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "List Unity project templates for an editor version"
COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- templates list --no-banner --no-pager --non-interactive
  case "{{installed}}" in ''|true|false) ;; *) printf '%s\n' "$(msg installed_true_false)" >&2; exit 1 ;; esac
  case "{{custom}}" in ''|true|false) ;; *) printf '%s\n' "$(msg custom_true_false)" >&2; exit 1 ;; esac

  [ -n "{{editor}}" ] && set -- "$@" --editor "{{editor}}"
  [ "{{installed}}" = true ] && set -- "$@" --installed
  [ -n "{{type}}" ] && set -- "$@" --type "{{type}}"
  [ "{{custom}}" = true ] && set -- "$@" --custom
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_templates_list_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"
ARGS:
  - {name: editor, type: text}   # Unity editor version (uses stored default if omitted)
  - {name: installed, type: text}   # true pour poser --installed ; Show only locally installed templates
  - {name: type, type: text}   # Filter by template type (core, learning, sample, custom, new, all)
  - {name: custom, type: text}   # true pour poser --custom ; Show only user-generated (custom) templates

