# QUI : list every command and subcommand as a machine-readable manifest
# ORIGINE : migre tel quel de la ligne 156 du registre (2026-10-17). Le corps n'a PAS ete reecrit ici.
# REFUSE : (a completer par l'auteur -- ce que ce tool refuse, en le nommant)
tool: "unity_commands"
date: "2026-10-17"
tags: ["unity", "unity_commands"]

doc: unity

RULES:
  enabled: true
  timeout: 40

DESCRIPTION: "list every command and subcommand as a machine-readable manifest"

COMMAND: |
  unity --no-banner --no-pager --non-interactive --format json commands </dev/null

ARGS: []                    # aucun argument : ce tool se nomme seul
