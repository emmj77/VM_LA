tool: "unity_docs"
date: "2026-10-18"
tags: ["unity", "cli", "docs"]
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Open Unity documentation for a class or topic, matched to your project's editor version"
COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- docs --no-banner --no-pager --non-interactive
  [ -n "{{topic}}" ] || { printf '%s\n' "$(msg argument_required 'topic' 'unity docs')" >&2; exit 1; }
  case "{{manual}}" in ''|true|false) ;; *) printf '%s\n' "$(msg manual_true_false)" >&2; exit 1 ;; esac
  case "{{search}}" in ''|true|false) ;; *) printf '%s\n' "$(msg search_true_false)" >&2; exit 1 ;; esac
  case "{{url}}" in ''|true|false) ;; *) printf '%s\n' "$(msg url_true_false)" >&2; exit 1 ;; esac

  [ -n "{{topic}}" ] && set -- "$@" "{{topic}}"
  [ -n "{{editor_version}}" ] && set -- "$@" --editor-version "{{editor_version}}"
  [ "{{manual}}" = true ] && set -- "$@" --manual
  [ "{{search}}" = true ] && set -- "$@" --search
  [ "{{url}}" = true ] && set -- "$@" --url
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_docs_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"
ARGS:
  - {name: topic, type: text}
  - {name: editor_version, type: text}   # Documentation version to open, instead of the current project's
  - {name: manual, type: text}   # true pour poser --manual ; Look the topic up in the manual instead of the scripting API reference
  - {name: search, type: text}   # true pour poser --search ; Open the documentation search results for the topic
  - {name: url, type: text}   # true pour poser --url ; Print the URL instead of opening it in your browser

