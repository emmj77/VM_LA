tool: "unity_logs"
date: "2026-10-18"
tags: ["unity", "cli", "logs"]
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Read and tail the Hub log file"
COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- logs --no-banner --no-pager --non-interactive
  case "{{follow}}" in ''|true|false) ;; *) printf '%s\n' "$(msg follow_true_false)" >&2; exit 1 ;; esac

  [ -n "{{tail}}" ] && set -- "$@" --tail "{{tail}}"
  [ "{{follow}}" = true ] && set -- "$@" --follow
  [ -n "{{level}}" ] && set -- "$@" --level "{{level}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_logs_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"
ARGS:
  - {name: tail, type: text}   # Number of recent log entries to show (default: 20; 0 = show all)
  - {name: follow, type: text}   # true pour poser --follow ; Stream new log entries as they are written (like tail -f)
  - {name: level, type: text}   # Minimum log level to show (trace, debug, info, warn, error, fatal)

