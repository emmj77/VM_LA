tool: "coplay_docs_get"
date: "2026-10-18"
tags: ["unity", "coplay", "docs"]
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Fetch documentation for a Unity class or..."
COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing_paths)" >&2; exit 1; }
  set -f
  set -- docs get
  [ -n "{{class_name}}" ] || { printf '%s\n' "$(msg argument_required 'class_name' 'docs get')" >&2; exit 1; }
  [ -n "{{member_name}}" ] || { printf '%s\n' "$(msg argument_required 'member_name' 'docs get')" >&2; exit 1; }
  [ -n "{{version}}" ] && set -- "$@" --version "{{version}}"
  [ -n "{{class_name}}" ] && set -- "$@" "{{class_name}}"
  [ -n "{{member_name}}" ] && set -- "$@" "{{member_name}}"

  OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
  RC=$?
  [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
  printf '%s\n' "$OUT"
ARGS:
  - {name: version, type: text}
  - {name: class_name, type: text}
  - {name: member_name, type: text}

