tool: "unity_cloud_org_create"
date: "2026-10-18"
tags: ["unity", "cli", "cloud"]
doc: unity
RULES:
  enabled: true
  timeout: 120
DESCRIPTION: "Create a Unity Cloud organization"
COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- cloud org create --no-banner --no-pager --non-interactive
  [ -n "{{name}}" ] || { printf '%s\n' "$(msg argument_required 'name' 'unity cloud org create')" >&2; exit 1; }
  case "{{set_default}}" in ''|true|false) ;; *) printf '%s\n' "$(msg set_default_true_false)" >&2; exit 1 ;; esac

  [ -n "{{name}}" ] && set -- "$@" "{{name}}"
  [ -n "{{industry}}" ] && set -- "$@" --industry "{{industry}}"
  [ "{{set_default}}" = true ] && set -- "$@" --set-default
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_cloud_org_create)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"
ARGS:
  - {name: name, type: text}
  - {name: industry, type: text}   # Industry the organization works in
  - {name: set_default, type: text}   # true pour poser --set-default ; Set the new organization as the active default

