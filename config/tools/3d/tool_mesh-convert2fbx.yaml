# QUI : converts a 3D mesh to .fbx (via the cage CLI `mesh convert`)
# ORIGINE : enveloppe le CLI de la cage `mesh convert`.
# REFUSE : une entree absente ; une cible deja existante.
tool: "mesh-convert2fbx"
date: "2026-10-17"
tags: ["3d", "mesh-convert2fbx", "fbx", "convert"]
doc: 3d

RULES:
  enabled: true
  timeout: 600

DESCRIPTION: "converts a 3D mesh to .fbx"

COMMAND: |
  I=$(cat); [ -n "$I" ] || { echo 'refuse : mesh absent' >&2; exit 1; }; [ -f "$I" ] || { echo "refuse : mesh introuvable ($I)" >&2; exit 1; }
  O="{{out}}"; [ -n "$O" ] || O="${I%.*}.fbx"
  mesh convert "$I" "$O"

ARGS:
  - {name: input, type: path, stdin: true}
  - {name: out, type: path, required: false}
