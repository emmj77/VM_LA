# QUI : image -> 3D (Pixal3D / TRELLIS.2), variante OPTIMISE (rapide : basse res, moins d'etapes)
# ORIGINE : enveloppe `pixal3d gen --workflow <variante>` (CLI de la cage).
# REFUSE : une image d'entree absente.
tool: "pixal3d-optimise"
date: "2026-10-17"
tags: ["3d", "pixal3d", "optimise", "glb"]
doc: 3d

RULES:
  enabled: true
  timeout: 1800

DESCRIPTION: "image -> 3D (Pixal3D), variante optimisee (res reduite, moins d'etapes, seeds 2042+)"

COMMAND: |
  I=$(cat); [ -n "$I" ] || { echo 'refuse : image absente' >&2; exit 1; }; [ -f "$I" ] || { echo "refuse : image introuvable ($I)" >&2; exit 1; }
  W=/mnt/hermes_workspace/hermes/tools/pixal3d_variantes/optimise/workflow_pixal3d_rts_api.json
  O="{{out}}"; [ -n "$O" ] || O="$ROOT/work/GLB_PIXAL3D"
  pixal3d gen "$I" --workflow "$W" --out "$O"

ARGS:
  - {name: image, type: path, stdin: true}
  - {name: out, type: path, required: false}
