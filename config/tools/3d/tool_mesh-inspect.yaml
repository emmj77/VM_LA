# QUI : inspects a 3D mesh (via the cage CLI `mesh inspect`)
# ORIGINE : enveloppe le CLI de la cage `mesh inspect`.
# REFUSE : une entree absente.
tool: "mesh-inspect"
date: "2026-10-17"
tags: ["3d", "mesh-inspect", "inspect"]
doc: 3d

RULES:
  enabled: true
  timeout: 300

DESCRIPTION: "inspects a 3D mesh"

COMMAND: |
  I=$(cat); [ -n "$I" ] || { echo 'refuse : mesh absent' >&2; exit 1; }; [ -f "$I" ] || { echo "refuse : mesh introuvable ($I)" >&2; exit 1; }
  mesh inspect "$I"

ARGS:
  - {name: input, type: path, stdin: true}
