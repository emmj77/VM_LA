tool: "mesh-inspect"
date: "2026-10-17"
tags: ["3d", "mesh-inspect", "inspect"]
doc: 3d
RULES:
  enabled: true
  timeout: 300
DESCRIPTION: "inspects a 3D mesh"
COMMAND: |
  I=$(cat); [ -n "$I" ] || { printf '%s\n' "$(msg missing_mesh)" >&2; exit 1; }; [ -f "$I" ] || { printf '%s\n' "$(msg mesh_found_i "$I")" >&2; exit 1; }
  mesh inspect "$I"

ARGS:
  - {name: input, type: path, stdin: true}
