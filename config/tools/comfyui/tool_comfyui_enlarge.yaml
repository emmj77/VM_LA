# QUI : agrandit un dessin (l'aplat d'un .kra, ou une image) par le modele ESRGAN de la machine du
#   dessin, puis ramene a la taille voulue (le modele rend 4x ; ffmpeg ajuste en lanczos). Le texte des
#   reglages vit ICI ; la machine n'est jointe que par son API sur 127.0.0.1:8188.
# REFUSE : (1) la source absente, ou un .kra dont l'aplat ne sort pas ; (2) ComfyUI muet ; (3) un envoi,
#   un graphe ou une execution refuses -- NOMMES ; (4) un agrandissement qui ne vient pas dans le delai.
# ORIGINE : reecrit en shell le 2026-10-17. Avant : « python3 comfy_tool.py agrandir », qui lisait
#   TOOLS/config/agrandir.json et passait par PIL.
# PAS ENCORE : la pose dans un calque d'un .kra. Un agrandissement change la TAILLE du dessin, et le
#   plugin ne sait pas redimensionner un document : un 2x pose dans un calque 1x serait rogne.
#   Ce geste-la demande une decision (nouveau fichier, ou redimensionnement du document).
tool: "comfyui_enlarge"
date: "2026-10-17"
tags: ["comfyui", "comfyui_enlarge"]

doc: comfyui

RULES:
  enabled: true
  timeout: 700

DESCRIPTION: "enlarges a drawing (a .kra flat, or an image) with the drawing machine's ESRGAN model, then scales it back to the wanted size"

COMMAND: |
  SERVICE=http://127.0.0.1:8188
  curl -sf --max-time 10 "$SERVICE/system_stats" >/dev/null 2>&1 || { printf "refuse : la machine du dessin (ComfyUI) ne repond pas sur %s\n" "$SERVICE" >&2; exit 1; }
  SRC="$W/{{source}}"
  [ -f "$SRC" ] || { printf "refuse : la source est absente (%s)\n" "$SRC" >&2; exit 1; }
  command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1 || { printf "refuse : ffmpeg/ffprobe manquent a la machine\n" >&2; exit 1; }
  T="${TMPDIR:-/tmp}"
  BRUT="$T/la_agrandir_source.png"
  case "$SRC" in
    *.kra|*.krz) unzip -p "$SRC" mergedimage.png > "$BRUT" 2>/dev/null ;;
    *) cp "$SRC" "$BRUT" ;;
  esac
  [ -s "$BRUT" ] || { printf "refuse : %s ne donne aucune image (un .kra sans mergedimage.png ?)\n" "$SRC" >&2; exit 1; }
  TAILLE=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$BRUT" | tr ',' 'x')
  L=${TAILLE%x*}; H=${TAILLE#*x}
  FACTEUR="{{factor}}"; case "$FACTEUR" in ''|*[!0-9]*) FACTEUR=2 ;; esac
  [ "$FACTEUR" -ge 1 ] && [ "$FACTEUR" -le 4 ] || { printf "refuse : le facteur doit etre entre 1 et 4 (recu : %s)\n" "$FACTEUR" >&2; exit 1; }
  NOM=$(curl -s -F "image=@$BRUT" -F "type=input" -F "subfolder=" -F "overwrite=true" "$SERVICE/upload/image" | jq -r '.name // empty')
  [ -n "$NOM" ] || { printf "refuse : la machine a refuse l'envoi de %s\n" "$BRUT" >&2; exit 1; }
  MODELE="${LA_COMFY_UPSCALE:-4x-UltraSharp.pth}"
  G=$(jq -cn --arg m "$MODELE" --arg img "$NOM" '
    {"1":{"class_type":"LoadImage","inputs":{"image":$img}},
     "2":{"class_type":"UpscaleModelLoader","inputs":{"model_name":$m}},
     "3":{"class_type":"ImageUpscaleWithModel","inputs":{"upscale_model":["2",0],"image":["1",0]}},
     "5":{"class_type":"SaveImage","inputs":{"filename_prefix":"la_agrandi","images":["3",0]}}}')
  R=$(jq -cn --argjson p "$G" '{prompt:$p,client_id:"la"}' | curl -s -H 'Content-Type: application/json' --data-binary @- "$SERVICE/prompt")
  PID=$(printf '%s' "$R" | jq -r '.prompt_id // empty')
  [ -n "$PID" ] || { printf "refuse : la machine n'a pas accepte le graphe : %s\n" "$(printf '%s' "$R" | jq -c '.error // .node_errors // .' | cut -c1-400)" >&2; exit 1; }
  printf "soumis : %s (modele %s, source %sx%s)\n" "$PID" "$MODELE" "$L" "$H"
  i=0
  while [ "$i" -lt 300 ]; do
    H2=$(curl -s "$SERVICE/history/$PID")
    printf '%s' "$H2" | jq -e --arg p "$PID" 'has($p)' >/dev/null 2>&1 && break
    sleep 2
    i=$((i + 1))
  done
  [ "$i" -lt 300 ] || { printf "refuse : l'agrandissement n'est pas venu en 600 s (prompt %s)\n" "$PID" >&2; exit 1; }
  ECHEC=$(printf '%s' "$H2" | jq -r --arg p "$PID" '.[$p].status.messages[]? | select(.[0]=="execution_error") | ((.[1].exception_type // "erreur") + " : " + (.[1].exception_message // ""))' | head -n 1)
  [ -z "$ECHEC" ] || { printf "refuse : la machine a echoue : %s\n" "$ECHEC" >&2; exit 1; }
  IMG=$(printf '%s' "$H2" | jq -r --arg p "$PID" '.[$p].outputs[]?.images[]? | [.filename, (.subfolder // ""), (.type // "output")] | @tsv' | head -n 1)
  [ -n "$IMG" ] || { printf "refuse : la machine a fini et ne rend aucune image\n" >&2; exit 1; }
  G4="$T/la_agrandi_4x.png"
  curl -s -G --data-urlencode "filename=$(printf '%s' "$IMG" | cut -f1)" --data-urlencode "subfolder=$(printf '%s' "$IMG" | cut -f2)" --data-urlencode "type=$(printf '%s' "$IMG" | cut -f3)" "$SERVICE/view" -o "$G4"
  [ -s "$G4" ] || { printf "refuse : l'image agrandie n'est pas descendue (%s)\n" "$G4" >&2; exit 1; }
  TAILLE4=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$G4" | tr ',' 'x')
  SORTIE="$W/{{output}}"
  [ -n "{{output}}" ] || SORTIE="$W/agrandi-$(date +%Y%m%d-%H%M%S).png"
  VOULU="$((L * FACTEUR)):$((H * FACTEUR))"
  if [ "$TAILLE4" = "$(printf '%s' "$VOULU" | tr ':' 'x')" ]; then cp "$G4" "$SORTIE"; else ffmpeg -y -loglevel error -i "$G4" -vf "scale=${VOULU}:flags=lanczos" "$SORTIE" || { printf "refuse : ffmpeg n'a pas su ramener a %s\n" "$VOULU" >&2; exit 1; }; fi
  [ -s "$SORTIE" ] || { printf "refuse : %s est vide\n" "$SORTIE" >&2; exit 1; }
  printf "agrandi %sx : %s (%s, %s octets) -- modele a rendu %s\n" "$FACTEUR" "$SORTIE" "$VOULU" "$(wc -c < "$SORTIE")" "$TAILLE4"

ARGS:
  - {name: source, type: path}                # le dessin (.kra ou image), relatif a l'espace du skill
  - {name: factor, type: int}                 # le facteur d'agrandissement, 1 a 4 (vide : 2)
  - {name: output, type: path}                # le PNG de sortie, dans l'espace du skill (vide : un nom date)
