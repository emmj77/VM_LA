# QUI : text-to-image (FLUX.1-dev, 1024x1024) via ComfyUI
# ORIGINE : lance le workflow flux_dev_txt2img.json (skill comfyui de la cage).
# REFUSE : prompt vide ; serveur ComfyUI injoignable.
tool: "flux-txt2img"
date: "2026-10-17"
tags: ["comfyui", "flux-txt2img", "txt2img", "flux", "image"]
doc: comfyui

RULES:
  enabled: true
  timeout: 1800

DESCRIPTION: "text-to-image (FLUX.1-dev, 1024x1024) via ComfyUI"

COMMAND: |
  P=$(cat); [ -n "$P" ] || { echo 'refuse : prompt vide' >&2; exit 1; }
  S=http://127.0.0.1:8188; curl -sS -m 5 "$S/system_stats" >/dev/null 2>&1 || { echo "refuse : ComfyUI ne repond pas sur $S" >&2; exit 1; }
  D=/mnt/hermes_workspace/hermes/skills/software-development/comfyui
  O="{{out}}"; [ -n "$O" ] || O="$ROOT/work/GEN"
  python3 "$D/scripts/run_workflow.py" --workflow "$D/workflows/flux_dev_txt2img.json" --args "{\"prompt\": \"$P\"}" --output-dir "$O"

ARGS:
  - {name: prompt, type: text, stdin: true}
  - {name: out, type: path, required: false}
