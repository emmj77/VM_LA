# QUI : colorise PLUSIEURS .kra d'affilee, exactement comme comfyui_colorize, un par un -- le meme
#   enchainement de machines (Krita le masque, la machine du dessin les couleurs, l'aplatisseur
#   l'aplat), et chaque dessin repart avec son calque neuf ecrit.
# REFUSE : (1) un dossier absent ou sans .kra ; (2) une machine muette, NOMMEE ; (3) un dessin qui
#   echoue -- il est NOMME et on passe au suivant ; (4) un plafond hors de 1 a 20.
# ORIGINE : ecrit le 2026-10-17. Remplace « python3 comfy_tool.py colorier_lot ».
tool: "comfyui_colorize_batch"
date: "2026-10-17"
tags: ["comfyui", "comfyui_colorize_batch"]

doc: comfyui

RULES:
  enabled: true
  timeout: 2400

DESCRIPTION: "colourises every .kra of a folder, one by one, the same way comfyui_colorize does it for one"

COMMAND: |
  SERVICE=http://127.0.0.1:8188
  APLAT=http://127.0.0.1:${LA_APLATISSEUR_PORT:-8097}
  curl -sf --max-time 10 "$SERVICE/system_stats" >/dev/null 2>&1 || { printf "refuse : la machine du dessin (ComfyUI) ne repond pas sur %s\n" "$SERVICE" >&2; exit 1; }
  curl -sf --max-time 10 "$APLAT/health" >/dev/null 2>&1 || { printf "refuse : l'aplatisseur ne repond pas sur %s\n" "$APLAT" >&2; exit 1; }
  command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1 || { printf "refuse : ffmpeg/ffprobe manquent a la machine\n" >&2; exit 1; }
  T="${TMPDIR:-/tmp}"
  TEXTE=$(cat)
  [ -n "$TEXTE" ] || { printf "refuse : le texte du sujet manque sur l'entree standard\n" >&2; exit 1; }
  DOSSIER="$W/{{folder}}"
  [ -d "$DOSSIER" ] || { printf "refuse : le dossier est absent (%s)\n" "$DOSSIER" >&2; exit 1; }
  LIMITE="{{limit}}"; case "$LIMITE" in ''|*[!0-9]*) LIMITE=10 ;; esac
  [ "$LIMITE" -ge 1 ] && [ "$LIMITE" -le 20 ] || { printf "refuse : le plafond doit etre entre 1 et 20 (recu %s)\n" "$LIMITE" >&2; exit 1; }
  LISTE=$(find "$DOSSIER" -maxdepth 1 -name '*.kra' | sort | head -n "$LIMITE")
  [ -n "$LISTE" ] || { printf "refuse : aucun .kra dans %s\n" "$DOSSIER" >&2; exit 1; }
  printf "a coloriser : %s dessin(s)\n" "$(printf '%s\n' "$LISTE" | wc -l)"
  ENC="{{layer}}"; [ -n "$ENC" ] || ENC="encrage"
  GRAINE() { od -An -N4 -tu4 /dev/urandom | tr -d ' '; }
  SERVICEK=http://127.0.0.1:5678
  curl -sf --max-time 10 "$SERVICEK/health" >/dev/null 2>&1 || { printf "refuse : la machine Krita ne repond pas sur %s\n" "$SERVICEK" >&2; exit 1; }
  K() { curl -sS --max-time "$2" -H 'Content-Type: application/json' -d "$1" "$SERVICEK/"; }
  calque_seul() {          # $1 = le calque a rendre, $2 = le PNG de sortie
    K "$(jq -cn --arg p "$FICHIER" '{action:"open_file",params:{path:$p}}')" 180 | jq -e '.status == "ok"' >/dev/null 2>&1 || { printf "refuse : %s ne s'ouvre pas dans Krita\n" "$FICHIER" >&2; return 1; }
    LISTE=$(K '{"action":"list_layers","params":{}}' 60)
    NOMS=$(printf '%s' "$LISTE" | jq -r '.layers[].name')
    printf '%s\n' "$NOMS" | grep -Fxq "$1" || { printf "refuse : pas de calque « %s » (il a : %s)\n" "$1" "$(printf '%s' "$NOMS" | tr '\n' ' ')" >&2; return 1; }
    VIS=$(printf '%s' "$LISTE" | jq -r '.layers[] | select(.visible) | .name')
    CACHES=$(printf '%s' "$LISTE" | jq -r '.layers[] | select(.visible|not) | .name')
    printf '%s\n' "$NOMS" | while IFS= read -r N; do if [ "$N" = "$1" ]; then V=true; else V=false; fi; K "$(jq -cn --arg n "$N" --argjson v "$V" '{action:"set_layer_visibility",params:{name:$n,visible:$v}}')" 30 >/dev/null; done
    K "$(jq -cn --arg n "$1" '{action:"select_layer",params:{name:$n}}')" 30 >/dev/null
    K "$(jq -cn --arg p "$2" '{action:"save",params:{path:$p}}')" 300 | jq -e '.status == "ok"' >/dev/null 2>&1 || { printf "refuse : Krita n'a pas su rendre le calque %s\n" "$1" >&2; return 1; }
    [ -s "$2" ] || { printf "refuse : le calque %s est vide\n" "$1" >&2; return 1; }
    if printf '%s' "$VIS" | grep -q . ; then printf '%s\n' "$VIS" | while IFS= read -r N; do K "$(jq -cn --arg n "$N" '{action:"set_layer_visibility",params:{name:$n,visible:true}}')" 30 >/dev/null; done; fi
    if printf '%s' "$CACHES" | grep -q . ; then printf '%s\n' "$CACHES" | while IFS= read -r N; do K "$(jq -cn --arg n "$N" '{action:"set_layer_visibility",params:{name:$n,visible:false}}')" 30 >/dev/null; done; fi
    return 0
  }
  rendre() {              # $1 = graphe deja construit ; pose $RENDU, ou refuse et sort
    R=$(jq -cn --argjson p "$1" '{prompt:$p,client_id:"la"}' | curl -s -H 'Content-Type: application/json' --data-binary @- "$SERVICE/prompt")
    PID=$(printf '%s' "$R" | jq -r '.prompt_id // empty')
    [ -n "$PID" ] || { printf "refuse : la machine n'a pas accepte le graphe : %s\n" "$(printf '%s' "$R" | jq -c '.error // .node_errors // .' | cut -c1-400)" >&2; exit 1; }
    TOUR=0
    while [ "$TOUR" -lt 600 ]; do H2=$(curl -s "$SERVICE/history/$PID"); printf '%s' "$H2" | jq -e --arg p "$PID" 'has($p)' >/dev/null 2>&1 && break; sleep 2; TOUR=$((TOUR + 1)); done
    [ "$TOUR" -lt 600 ] || { printf "refuse : le rendu n'est pas venu en 1200 s (prompt %s)\n" "$PID" >&2; exit 1; }
    ECHEC=$(printf '%s' "$H2" | jq -r --arg p "$PID" '.[$p].status.messages[]? | select(.[0]=="execution_error") | ((.[1].exception_type // "erreur") + " : " + (.[1].exception_message // ""))' | head -n 1)
    [ -z "$ECHEC" ] || { printf "refuse : la machine a echoue : %s\n" "$ECHEC" >&2; exit 1; }
    IMG=$(printf '%s' "$H2" | jq -r --arg p "$PID" '.[$p].outputs[]?.images[]? | [.filename, (.subfolder // ""), (.type // "output")] | @tsv' | head -n 1)
    [ -n "$IMG" ] || { printf "refuse : le rendu est fini et la machine ne rend aucune image\n" >&2; exit 1; }
    RENDU="$T/la_rendu.png"
    curl -s -G --data-urlencode "filename=$(printf '%s' "$IMG" | cut -f1)" --data-urlencode "subfolder=$(printf '%s' "$IMG" | cut -f2)" --data-urlencode "type=$(printf '%s' "$IMG" | cut -f3)" "$SERVICE/view" -o "$RENDU"
    [ -s "$RENDU" ] || { printf "refuse : le rendu n'est pas descendu\n" >&2; exit 1; }
  }
  aplatir() {              # $1 = masque, $2 = guide, $3 = sortie ; pose le compte des regions
    RA=$(curl -sS --max-time 600 -H 'Content-Type: application/json' -d "$(jq -cn --arg m "$1" --arg g "$2" --arg o "$3" '{mask:$m,guide:$g,out:$o}')" "$APLAT/")
    printf '%s' "$RA" | jq -e '.status == "ok"' >/dev/null 2>&1 || { printf "refuse : l'aplatisseur a refuse : %s\n" "$(printf '%s' "$RA" | jq -r '.error.message // "reponse illisible"')" >&2; exit 1; }
    REGIONS=$(printf '%s' "$RA" | jq -r .regions); GRANDES=$(printf '%s' "$RA" | jq -r .grandes); PETITES=$(printf '%s' "$RA" | jq -r .petites)
    return 0
  }
  GRAINE() { od -An -N4 -tu4 /dev/urandom | tr -d ' '; }
  OK=0; RATES=0
  for FICHIER in $LISTE; do
    BASE=$(basename "$FICHIER" .kra)
    printf "== %s\n" "$BASE"
    unzip -p "$FICHIER" mergedimage.png > "$T/la_lot_aplat.png" 2>/dev/null
    if [ ! -s "$T/la_lot_aplat.png" ]; then printf "   refuse : %s ne donne aucun aplat, suivant\n" "$BASE" >&2; RATES=$((RATES + 1)); continue; fi
    TAILLE=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$T/la_lot_aplat.png" | tr ',' 'x')
    L=${TAILLE%x*}; H=${TAILLE#*x}
    if ! calque_seul "$ENC" "$T/la_lot_masque.png"; then printf "   refuse : %s (pas de calque %s), suivant\n" "$BASE" "$ENC" >&2; RATES=$((RATES + 1)); continue; fi
    NOM=$(curl -s -F "image=@$T/la_lot_aplat.png" -F "type=input" -F "subfolder=" -F "overwrite=true" "$SERVICE/upload/image" | jq -r '.name // empty')
    if [ -z "$NOM" ]; then printf "   refuse : la machine a refuse l'aplat de %s, suivant\n" "$BASE" >&2; RATES=$((RATES + 1)); continue; fi
    set -- $(awk -v l="$L" -v h="$H" -v b="${LA_COMFY_TAILLE:-1024}" 'BEGIN{e=sqrt(b*b/(l*h)); tw=int(l*e)/64*64; th=int(h*e)/64*64; if(tw<64)tw=64; if(th<64)th=64; printf "%d %d", tw, th}')
    TW=$1; TH=$2; GRAINE=$(GRAINE)
  GRAPHE=$(jq -cn --arg ck "${LA_COMFY_CKPT:-dreamshaper_8.safetensors}" --arg cnet "${LA_COMFY_CONTROLNET:-control_v11p_sd15_lineart_fp16.safetensors}" --arg t "$TEXTE" --arg img "$NOM" \
    --argjson larg "$TW" --argjson haut "$TH" --argjson force "${LA_COMFY_FORCE:-0.9}" --argjson etapes "${LA_COMFY_ETAPES:-25}" --argjson cfg "${LA_COMFY_CFG:-7.0}" \
    --argjson res "${LA_COMFY_RESOLUTION:-1024}" --argjson sd "$GRAINE" '
    {"4":{"class_type":"CheckpointLoaderSimple","inputs":{"ckpt_name":$ck}},
     "10":{"class_type":"LoadImage","inputs":{"image":$img}},
     "11":{"class_type":"ControlNetLoader","inputs":{"control_net_name":$cnet}},
     "6":{"class_type":"CLIPTextEncode","inputs":{"text":$t,"clip":["4",1]}},
     "7":{"class_type":"CLIPTextEncode","inputs":{"text":"low quality, worst quality, blurry, jpeg artifacts, text, watermark, signature","clip":["4",1]}},
     "12":{"class_type":"LineArtPreprocessor","inputs":{"image":["10",0],"resolution":$res,"coarse":"disable"}},
     "13":{"class_type":"ControlNetApplyAdvanced","inputs":{"positive":["6",0],"negative":["7",0],"control_net":["11",0],"image":["12",0],"strength":$force,"start_percent":0.0,"end_percent":1.0,"vae":["4",2]}},
     "5":{"class_type":"EmptyLatentImage","inputs":{"width":$larg,"height":$haut,"batch_size":1}},
     "3":{"class_type":"KSampler","inputs":{"seed":$sd,"steps":$etapes,"cfg":$cfg,"sampler_name":"dpmpp_2m","scheduler":"karras","denoise":1.0,"model":["4",0],"positive":["13",0],"negative":["13",1],"latent_image":["5",0]}},
     "8":{"class_type":"VAEDecode","inputs":{"samples":["3",0],"vae":["4",2]}},
     "9":{"class_type":"SaveImage","inputs":{"filename_prefix":"la_couleur","images":["8",0]}}}')
    rendre "$GRAPHE"
    ffmpeg -y -v error -i "$RENDU" -vf "scale=${L}:${H}:flags=lanczos" -frames:v 1 "$T/la_lot_guide.png"
    aplatir "$T/la_lot_masque.png" "$T/la_lot_guide.png" "$T/la_lot_final.png"
    NOMC="{{output_layer}}"; [ -n "$NOMC" ] || NOMC="couleur"
    case "{{keep}}" in
      file) cp "$T/la_lot_final.png" "$W/couleur_$BASE.png"; printf "   %s : %s regions -> couleur_%s.png\n" "$BASE" "$REGIONS" "$BASE"; OK=$((OK + 1)) ;;
      *) if K "$(jq -cn --arg p "$T/la_lot_final.png" --arg n "$NOMC" '{action:"import_image",params:{path:$p,name:$n}}')" 300 | jq -e '.status == "ok"' >/dev/null 2>&1 && K "$(jq -cn --arg p "$FICHIER" '{action:"save_document",params:{path:$p}}')" 300 | jq -e '.status == "ok"' >/dev/null 2>&1; then
           printf "   %s : %s regions, calque %s ecrit (%s octets)\n" "$BASE" "$REGIONS" "$NOMC" "$(wc -c < "$FICHIER")"; OK=$((OK + 1))
         else printf "   refuse : %s n'a pas pu reprendre l'aplat\n" "$BASE" >&2; RATES=$((RATES + 1)); fi ;;
    esac
  done
  printf "colorises : %s ; rates : %s\n" "$OK" "$RATES"
  [ "$OK" -gt 0 ] || { printf "refuse : aucun dessin n'a pu etre colorise\n" >&2; exit 1; }
ARGS:
  - {name: folder, type: path}                # le dossier de .kra, relatif a l'espace du skill
  - {name: layer, type: text}                 # le calque d'encrage = le masque (vide : encrage)
  - {name: limit, type: int}                  # le plafond de dessins, 1 a 20 (vide : 10)
  - {name: output_layer, type: text}          # le nom du calque neuf (vide : couleur)
  - {name: keep, type: enum, values: [kra, file, ""]}   # kra : chaque .kra est ecrit ; file : PNG a cote
  - {name: style, type: text, stdin: true}    # le sujet, en texte libre : par l'ENTREE STANDARD
