# QUI : inpainting (SDXL, image + masque) via ComfyUI
# ORIGINE : lance le workflow sdxl_inpaint.json (skill comfyui de la cage).
# REFUSE : image ou masque absent ; serveur ComfyUI injoignable.
tool: "sdxl-inpaint"
date: "2026-10-17"
tags: ["comfyui", "sdxl-inpaint", "inpaint", "image"]
doc: comfyui

RULES:
  enabled: true
  timeout: 1200

DESCRIPTION: "inpainting (SDXL, image + masque) via ComfyUI"

COMMAND: |
  I=$(cat); [ -n "$I" ] || { echo 'refuse : image absente' >&2; exit 1; }; [ -f "$I" ] || { echo "refuse : image introuvable ($I)" >&2; exit 1; }
  M="{{mask}}"; [ -n "$M" ] || { echo 'refuse : masque absent' >&2; exit 1; }; [ -f "$M" ] || { echo "refuse : masque introuvable ($M)" >&2; exit 1; }
  S=http://127.0.0.1:8188; curl -sS -m 5 "$S/system_stats" >/dev/null 2>&1 || { echo "refuse : ComfyUI ne repond pas sur $S" >&2; exit 1; }
  D=/mnt/hermes_workspace/hermes/skills/software-development/comfyui
  O="{{out}}"; [ -n "$O" ] || O="$ROOT/work/GEN"
  python3 "$D/scripts/run_workflow.py" --workflow "$D/workflows/sdxl_inpaint.json" --input-image "image=$I" --input-image "mask=$M" --args "{\"prompt\": \"{{prompt}}\"}" --output-dir "$O"

ARGS:
  - {name: image, type: path, stdin: true}
  - {name: mask, type: path}
  - {name: prompt, type: text, required: false}
  - {name: out, type: path, required: false}
