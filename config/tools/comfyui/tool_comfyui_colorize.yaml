# QUI : colorise un dessin au trait. Trois machines, chacune son metier :
#   · Krita rend le calque d'encrage SEUL (c'est le masque) et reprend l'aplat a la fin ;
#   · la machine du dessin (ComfyUI) PROPOSE les couleurs (ControlNet lineart + une reference
#     de palette si on en donne une) ;
#   · l'aplatisseur (127.0.0.1:8097) APLATIT : chaque region fermee par le trait recoit UNE couleur,
#     celle du ton eclaire que le rendu y met, et rien d'autre -- aucun pixel du modele n'est pose.
# Le texte du sujet vient par l'ENTREE STANDARD (comme comfyui_style) : il appartient a l'appel, pas
# a la recette. Les reglages de la machine se surchargent par l'environnement (LA_COMFY_*).
# REFUSE : (1) le dessin absent ou sans calque d'encrage ; (2) une des machines muette, NOMMEE ;
# (3) un graphe, une execution ou un echange refuses ; (4) un aplat vide.
# ORIGINE : ecrit le 2026-10-17. Remplace « python3 comfy_tool.py colorier » (numpy+scipy+PIL).
#   L'aplat lui-meme est sorti du python et vit maintenant dans la machine aplatisseur (8097).
tool: "comfyui_colorize"
date: "2026-10-17"
tags: ["comfyui", "comfyui_colorize"]

doc: comfyui

RULES:
  enabled: true
  timeout: 1200

DESCRIPTION: "colourises an ink drawing: the drawing machine proposes colours (lineart controlnet), the aplatisseur flattens them into the regions closed by the ink, Krita takes the flat back into a new layer"

COMMAND: |
  SERVICE=http://127.0.0.1:8188
  APLAT=http://127.0.0.1:${LA_APLATISSEUR_PORT:-8097}
  TEXTE=$(cat)
  [ -n "$TEXTE" ] || { printf "refuse : le texte du sujet manque sur l'entree standard\n" >&2; exit 1; }
  curl -sf --max-time 10 "$SERVICE/system_stats" >/dev/null 2>&1 || { printf "refuse : la machine du dessin (ComfyUI) ne repond pas sur %s\n" "$SERVICE" >&2; exit 1; }
  curl -sf --max-time 10 "$APLAT/health" >/dev/null 2>&1 || { printf "refuse : l'aplatisseur ne repond pas sur %s\n" "$APLAT" >&2; exit 1; }
  command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1 || { printf "refuse : ffmpeg/ffprobe manquent a la machine\n" >&2; exit 1; }
  SRC="$W/{{source}}"
  [ -f "$SRC" ] || { printf "refuse : le dessin est absent (%s)\n" "$SRC" >&2; exit 1; }
  case "$SRC" in *.kra|*.krz) ;; *) printf "refuse : il faut un .kra (%s)\n" "$SRC" >&2; exit 1 ;; esac
  T="${TMPDIR:-/tmp}"
  # --- 1. l'aplat du dessin (pour le ControlNet) : direct depuis le zip, sans Krita ---
  APLAT_SRC="$T/la_colorier_aplat.png"
  unzip -p "$SRC" mergedimage.png > "$APLAT_SRC" 2>/dev/null
  [ -s "$APLAT_SRC" ] || { printf "refuse : %s ne donne aucun aplat (pas de mergedimage.png)\n" "$SRC" >&2; exit 1; }
  TAILLE=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$APLAT_SRC" | tr ',' 'x')
  L=${TAILLE%x*}; H=${TAILLE#*x}
  # --- 2. le MASQUE : le calque d'encrage SEUL, rendu par Krita ---
  SERVICEK=http://127.0.0.1:5678
  curl -sf --max-time 10 "$SERVICEK/health" >/dev/null 2>&1 || { printf "refuse : la machine Krita ne repond pas sur %s (elle rend le calque d'encrage et reprend l'aplat)\n" "$SERVICEK" >&2; exit 1; }
  K() { curl -sS --max-time "$2" -H 'Content-Type: application/json' -d "$1" "$SERVICEK/"; }
  K "$(jq -cn --arg p "$SRC" '{action:"open_file",params:{path:$p}}')" 180 | jq -e '.status == "ok"' >/dev/null 2>&1 || { printf "refuse : %s ne s'ouvre pas dans Krita\n" "$SRC" >&2; exit 1; }
  ENC="{{layer}}"; [ -n "$ENC" ] || ENC="encrage"
  LISTE=$(K '{"action":"list_layers","params":{}}' 60)
  NOMS=$(printf '%s' "$LISTE" | jq -r '.layers[].name')
  printf '%s\n' "$NOMS" | grep -Fxq "$ENC" || { printf "refuse : ce dessin n'a pas de calque « %s » (il a : %s)\n" "$ENC" "$(printf '%s' "$NOMS" | tr '\n' ' ')" >&2; exit 1; }
  VIS=$(printf '%s' "$LISTE" | jq -r '.layers[] | select(.visible) | .name')
  CACHES=$(printf '%s' "$LISTE" | jq -r '.layers[] | select(.visible|not) | .name')
  printf '%s\n' "$NOMS" | while IFS= read -r N; do if [ "$N" = "$ENC" ]; then V=true; else V=false; fi; K "$(jq -cn --arg n "$N" --argjson v "$V" '{action:"set_layer_visibility",params:{name:$n,visible:$v}}')" 30 >/dev/null; done
  K "$(jq -cn --arg n "$ENC" '{action:"select_layer",params:{name:$n}}')" 30 >/dev/null
  MASQUE="$T/la_colorier_masque.png"
  K "$(jq -cn --arg p "$MASQUE" '{action:"save",params:{path:$p}}')" 300 | jq -e '.status == "ok"' >/dev/null 2>&1 || { printf "refuse : Krita n'a pas su rendre le calque %s\n" "$ENC" >&2; exit 1; }
  [ -s "$MASQUE" ] || { printf "refuse : le calque %s est vide\n" "$ENC" >&2; exit 1; }
  if printf '%s' "$VIS" | grep -q . ; then printf '%s\n' "$VIS" | while IFS= read -r N; do K "$(jq -cn --arg n "$N" '{action:"set_layer_visibility",params:{name:$n,visible:true}}')" 30 >/dev/null; done; fi
  if printf '%s' "$CACHES" | grep -q . ; then printf '%s\n' "$CACHES" | while IFS= read -r N; do K "$(jq -cn --arg n "$N" '{action:"set_layer_visibility",params:{name:$n,visible:false}}')" 30 >/dev/null; done; fi
  printf "le masque : calque %s seul (%sx%s)\n" "$ENC" "$L" "$H"
  # --- 3. la machine du dessin propose les couleurs ---
  NOM=$(curl -s -F "image=@$APLAT_SRC" -F "type=input" -F "subfolder=" -F "overwrite=true" "$SERVICE/upload/image" | jq -r '.name // empty')
  [ -n "$NOM" ] || { printf "refuse : la machine a refuse l'envoi de l'aplat\n" >&2; exit 1; }
  set -- $(awk -v l="$L" -v h="$H" -v b="${LA_COMFY_TAILLE:-1024}" 'BEGIN{e=sqrt(b*b/(l*h)); tw=int(l*e)/64*64; th=int(h*e)/64*64; if(tw<64)tw=64; if(th<64)th=64; printf "%d %d", tw, th}')
  TW=$1; TH=$2
  G=$(jq -cn --arg ck "${LA_COMFY_CKPT:-dreamshaper_8.safetensors}" --arg cnet "${LA_COMFY_CONTROLNET:-control_v11p_sd15_lineart_fp16.safetensors}" --arg t "$TEXTE" --arg img "$NOM" \
    --argjson larg "$TW" --argjson haut "$TH" --argjson force "${LA_COMFY_FORCE:-0.9}" --argjson etapes "${LA_COMFY_ETAPES:-25}" --argjson cfg "${LA_COMFY_CFG:-7.0}" \
    --argjson res "${LA_COMFY_RESOLUTION:-1024}" --argjson sd "$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')" '
    {"4":{"class_type":"CheckpointLoaderSimple","inputs":{"ckpt_name":$ck}},
     "10":{"class_type":"LoadImage","inputs":{"image":$img}},
     "11":{"class_type":"ControlNetLoader","inputs":{"control_net_name":$cnet}},
     "6":{"class_type":"CLIPTextEncode","inputs":{"text":$t,"clip":["4",1]}},
     "7":{"class_type":"CLIPTextEncode","inputs":{"text":"low quality, worst quality, blurry, jpeg artifacts, text, watermark, signature","clip":["4",1]}},
     "12":{"class_type":"LineArtPreprocessor","inputs":{"image":["10",0],"resolution":$res,"coarse":"disable"}},
     "13":{"class_type":"ControlNetApplyAdvanced","inputs":{"positive":["6",0],"negative":["7",0],"control_net":["11",0],"image":["12",0],"strength":$force,"start_percent":0.0,"end_percent":1.0,"vae":["4",2]}},
     "5":{"class_type":"EmptyLatentImage","inputs":{"width":$larg,"height":$haut,"batch_size":1}},
     "3":{"class_type":"KSampler","inputs":{"seed":$sd,"steps":$etapes,"cfg":$cfg,"sampler_name":"dpmpp_2m","scheduler":"karras","denoise":1.0,"model":["4",0],"positive":["13",0],"negative":["13",1],"latent_image":["5",0]}},
     "8":{"class_type":"VAEDecode","inputs":{"samples":["3",0],"vae":["4",2]}},
     "9":{"class_type":"SaveImage","inputs":{"filename_prefix":"la_couleur","images":["8",0]}}}')
  R=$(jq -cn --argjson p "$G" '{prompt:$p,client_id:"la"}' | curl -s -H 'Content-Type: application/json' --data-binary @- "$SERVICE/prompt")
  PID=$(printf '%s' "$R" | jq -r '.prompt_id // empty')
  [ -n "$PID" ] || { printf "refuse : la machine n'a pas accepte le graphe : %s\n" "$(printf '%s' "$R" | jq -c '.error // .node_errors // .' | cut -c1-400)" >&2; exit 1; }
  i=0
  while [ "$i" -lt 450 ]; do H2=$(curl -s "$SERVICE/history/$PID"); printf '%s' "$H2" | jq -e --arg p "$PID" 'has($p)' >/dev/null 2>&1 && break; sleep 2; i=$((i + 1)); done
  [ "$i" -lt 450 ] || { printf "refuse : le rendu n'est pas venu en 900 s (prompt %s)\n" "$PID" >&2; exit 1; }
  ECHEC=$(printf '%s' "$H2" | jq -r --arg p "$PID" '.[$p].status.messages[]? | select(.[0]=="execution_error") | ((.[1].exception_type // "erreur") + " : " + (.[1].exception_message // ""))' | head -n 1)
  [ -z "$ECHEC" ] || { printf "refuse : la machine a echoue : %s\n" "$ECHEC" >&2; exit 1; }
  IMG=$(printf '%s' "$H2" | jq -r --arg p "$PID" '.[$p].outputs[]?.images[]? | [.filename, (.subfolder // ""), (.type // "output")] | @tsv' | head -n 1)
  [ -n "$IMG" ] || { printf "refuse : le rendu est fini et la machine ne rend aucune image\n" >&2; exit 1; }
  RENDU="$T/la_colorier_rendu.png"
  curl -s -G --data-urlencode "filename=$(printf '%s' "$IMG" | cut -f1)" --data-urlencode "subfolder=$(printf '%s' "$IMG" | cut -f2)" --data-urlencode "type=$(printf '%s' "$IMG" | cut -f3)" "$SERVICE/view" -o "$RENDU"
  [ -s "$RENDU" ] || { printf "refuse : le rendu n'est pas descendu\n" >&2; exit 1; }
  GUIDE="$T/la_colorier_guide.png"
  ffmpeg -y -v error -i "$RENDU" -vf "scale=${L}:${H}:flags=lanczos" -frames:v 1 "$GUIDE" || { printf "refuse : le rendu n'a pas pu etre ramene a %sx%s\n" "$L" "$H" >&2; exit 1; }
  printf "le rendu de la machine : %s -> %sx%s\n" "$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$RENDU")" "$L" "$H"
  # --- 4. l'aplatisseur aplatit ---
  APLATI="$T/la_colorier_final.png"
  RA=$(curl -sS --max-time 600 -H 'Content-Type: application/json' -d "$(jq -cn --arg m "$MASQUE" --arg g "$GUIDE" --arg o "$APLATI" --argjson s "${LA_APLAT_SEUIL:-60}" '{mask:$m,guide:$g,out:$o,seuil:$s}')" "$APLAT/")
  printf '%s' "$RA" | jq -e '.status == "ok"' >/dev/null 2>&1 || { printf "refuse : l'aplatisseur a refuse : %s\n" "$(printf '%s' "$RA" | jq -r '.error.message // "reponse illisible"')" >&2; exit 1; }
  [ -s "$APLATI" ] || { printf "refuse : l'aplatisseur a rendu un fichier vide\n" >&2; exit 1; }
  printf "l'aplat : %s regions (%s grandes, %s petites recollees), %s octets\n" "$(printf '%s' "$RA" | jq -r .regions)" "$(printf '%s' "$RA" | jq -r .grandes)" "$(printf '%s' "$RA" | jq -r .petites)" "$(wc -c < "$APLATI")"
  # --- 5. le dessin reprend l'aplat ---
  SORTIE="$W/{{output}}"
  [ -n "{{output}}" ] || SORTIE="$W/couleur-$(date +%Y%m%d-%H%M%S).png"
  cp "$APLATI" "$SORTIE"
  case "{{keep}}" in
    file) ;;
    *)
      NOMC="{{output_layer}}"; [ -n "$NOMC" ] || NOMC="couleur"
      K "$(jq -cn --arg p "$SORTIE" --arg n "$NOMC" '{action:"import_image",params:{path:$p,name:$n}}')" 300 | jq -e '.status == "ok"' >/dev/null 2>&1 || { printf "refuse : Krita n'a pas su poser le calque %s\n" "$NOMC" >&2; exit 1; }
      K "$(jq -cn --arg p "$SRC" '{action:"save_document",params:{path:$p}}')" 300 | jq -e '.status == "ok"' >/dev/null 2>&1 || { printf "refuse : le calque est pose mais %s n'a pas pu etre ecrit\n" "$SRC" >&2; exit 1; }
      printf "calque %s ecrit dans %s (%s octets)\n" "$NOMC" "$SRC" "$(wc -c < "$SRC")"
      ;;
  esac

ARGS:
  - {name: source, type: path}                # le dessin .kra, relatif a l'espace du skill
  - {name: layer, type: text}                 # le calque d'encrage = le masque (vide : encrage)
  - {name: output, type: path}                # le PNG de sortie, dans l'espace du skill
  - {name: output_layer, type: text}          # le nom du calque neuf (vide : couleur)
  - {name: keep, type: enum, values: [kra, file, ""]}   # kra : rentre dans le .kra ; file : PNG seul
  - {name: style, type: text, stdin: true}    # le sujet, en texte libre : par l'ENTREE STANDARD
