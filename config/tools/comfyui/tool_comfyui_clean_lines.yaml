# QUI : nettoie le TRAIT d'un dessin .kra comme le faisait le python, mais en shell : on retire les
#   taches isolees (erosion puis dilatation), on bouche les micro-trous (dilatation puis erosion), on
#   epaissit si on veut. Le pixel est fait par ffmpeg ; Krita ne fait que rendre le calque et le
#   reprendre. Le trait net rentre dans un calque NEUF du .kra, et le .kra est ECRIT.
# REFUSE : (1) le dessin absent ou pas un .kra ; (2) le calque du trait absent -- la machine nomme ceux
#   qu'elle a ; (3) la machine muette ; (4) ffmpeg/ffprobe manquants.
# ORIGINE : ecrit le 2026-10-17. Remplace « python3 comfy_tool.py nettoyer_trait » (PIL MinFilter/MaxFilter).
tool: "comfyui_clean_lines"
date: "2026-10-17"
tags: ["comfyui", "comfyui_clean_lines"]

doc: comfyui

RULES:
  enabled: true
  timeout: 600

DESCRIPTION: "cleans the ink line of a .kra drawing (removes specks, closes micro-holes, thickens it) and writes it back into a new layer"

COMMAND: |
  NOM="{{layer}}"; [ -n "$NOM" ] || NOM="encrage"
  SERVICE=http://127.0.0.1:5678
  K() { curl -sS --max-time "$2" -H 'Content-Type: application/json' -d "$1" "$SERVICE/"; }
  curl -sf --max-time 10 "$SERVICE/health" >/dev/null 2>&1 || { printf "refuse : la machine Krita ne repond pas sur %s (le plugin kritamcp s'ouvre avec Krita ouverte)\n" "$SERVICE" >&2; exit 1; }
  command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1 || { printf "refuse : ffmpeg/ffprobe manquent a la machine\n" >&2; exit 1; }
  SRC="$W/{{source}}"
  [ -f "$SRC" ] || { printf "refuse : le dessin est absent (%s)\n" "$SRC" >&2; exit 1; }
  case "$SRC" in *.kra|*.krz) ;; *) printf "refuse : il faut un .kra (%s)\n" "$SRC" >&2; exit 1 ;; esac
  K "$(jq -cn --arg p "$SRC" '{action:"open_file",params:{path:$p}}')" 180 | jq -e '.status == "ok"' >/dev/null 2>&1 || { printf "refuse : %s ne s'ouvre pas dans Krita\n" "$SRC" >&2; exit 1; }
  ENC="$NOM"
  LISTE=$(K '{"action":"list_layers","params":{}}' 60)
  NOMS=$(printf '%s' "$LISTE" | jq -r '.layers[].name')
  printf '%s\n' "$NOMS" | grep -Fxq "$ENC" || { printf "refuse : ce dessin n'a pas de calque « %s » (il a : %s)\n" "$ENC" "$(printf '%s' "$NOMS" | tr '\n' ' ')" >&2; exit 1; }
  VIS=$(printf '%s' "$LISTE" | jq -r '.layers[] | select(.visible) | .name')
  CACHES=$(printf '%s' "$LISTE" | jq -r '.layers[] | select(.visible|not) | .name')
  printf '%s\n' "$NOMS" | while IFS= read -r N; do
    if [ "$N" = "$ENC" ]; then V=true; else V=false; fi
    K "$(jq -cn --arg n "$N" --argjson v "$V" '{action:"set_layer_visibility",params:{name:$n,visible:$v}}')" 30 >/dev/null
  done
  K "$(jq -cn --arg n "$ENC" '{action:"select_layer",params:{name:$n}}')" 30 >/dev/null
  T="${TMPDIR:-/tmp}"
  TRAIT="$T/la_trait.png"
  K "$(jq -cn --arg p "$TRAIT" '{action:"save",params:{path:$p}}')" 300 | jq -e '.status == "ok"' >/dev/null 2>&1 || { printf "refuse : la machine n'a pas su rendre le calque %s\n" "$ENC" >&2; exit 1; }
  [ -s "$TRAIT" ] || { printf "refuse : le calque %s est vide\n" "$ENC" >&2; exit 1; }
  if printf '%s' "$VIS" | grep -q . ; then printf '%s\n' "$VIS" | while IFS= read -r N; do K "$(jq -cn --arg n "$N" '{action:"set_layer_visibility",params:{name:$n,visible:true}}')" 30 >/dev/null; done; fi
  if printf '%s' "$CACHES" | grep -q . ; then printf '%s\n' "$CACHES" | while IFS= read -r N; do K "$(jq -cn --arg n "$N" '{action:"set_layer_visibility",params:{name:$n,visible:false}}')" 30 >/dev/null; done; fi
  TAILLE=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$TRAIT" 2>/dev/null | tr ',' 'x')
  L=${TAILLE%x*}; H=${TAILLE#*x}
  [ -n "$L" ] && [ -n "$H" ] || { printf "refuse : la machine a rendu un calque illisible\n" >&2; exit 1; }
  printf 'le trait, seul : %s (%sx%s, %s calque(s) au total)\n' "$TRAIT" "$L" "$H" "$(printf '%s' "$NOMS" | grep -c .)"
  case "{{clean}}" in
    none)   TACHE=0; TROU=0; EPAIS=0 ;;
    light)  TACHE=4; TROU=1; EPAIS=1 ;;
    strong) TACHE=12; TROU=3; EPAIS=2 ;;
    *)      TACHE=8; TROU=2; EPAIS=1 ;;
  esac
  CH="alphaextract,lut=y='if(gt(val,60),255,0)'"
  C=""
  i=0
  while [ "$i" -lt "$TACHE" ]; do C="$C,erosion"; i=$((i + 1)); done
  C="${C#,}"
  [ -n "$C" ] && CH="$CH,$C"
  D=""
  i=0
  while [ "$i" -lt "$TACHE" ]; do D="$D,dilation"; i=$((i + 1)); done
  D="${D#,}"
  [ -n "$D" ] && CH="$CH,$D"
  E=""
  i=0
  while [ "$i" -lt "$TROU" ]; do E="$E,dilation"; i=$((i + 1)); done
  E="${E#,}"
  [ -n "$E" ] && CH="$CH,$E"
  F=""
  i=0
  while [ "$i" -lt "$TROU" ]; do F="$F,erosion"; i=$((i + 1)); done
  F="${F#,}"
  [ -n "$F" ] && CH="$CH,$F"
  G=""
  i=0
  while [ "$i" -lt "$EPAIS" ]; do G="$G,dilation"; i=$((i + 1)); done
  G="${G#,}"
  [ -n "$G" ] && CH="$CH,$G"
  MASQUE="$T/la_masque_trait.png"
  ffmpeg -y -loglevel error -i "$TRAIT" -vf "$CH,format=gray" "$MASQUE" || { printf "refuse : ffmpeg n'a pas su nettoyer le trait\n" >&2; exit 1; }
  SORTIE="$W/{{output}}"
  [ -n "{{output}}" ] || SORTIE="$W/trait_nettoye.png"
  ffmpeg -y -loglevel error -f lavfi -i "color=c=black:s=${L}x${H}" -i "$MASQUE" -filter_complex "[0:v][1:v]alphamerge" -frames:v 1 "$SORTIE" || { printf "refuse : ffmpeg n'a pas su recomposer le trait\n" >&2; exit 1; }
  printf "trait net : %s (%s octets)\n" "$SORTIE" "$(wc -c < "$SORTIE")"
  case "{{keep}}" in
    file) ;;
    *)
      NOM="{{output_layer}}"; [ -n "$NOM" ] || NOM="encrage_nettoye"
      K "$(jq -cn --arg p "$SORTIE" --arg n "$NOM" '{action:"import_image",params:{path:$p,name:$n}}')" 300 | jq -e '.status == "ok"' >/dev/null 2>&1 || { printf "refuse : la machine n'a pas su poser le calque neuf\n" >&2; exit 1; }
      K "$(jq -cn --arg p "$SRC" '{action:"save_document",params:{path:$p}}')" 300 | jq -e '.status == "ok"' >/dev/null 2>&1 || { printf "refuse : le calque est pose mais %s n'a pas pu etre ecrit\n" "$SRC" >&2; exit 1; }
      printf "calque %s ecrit dans %s (%s octets)\n" "$NOM" "$SRC" "$(wc -c < "$SRC")"
      ;;
  esac

ARGS:
  - {name: source, type: path}                # le dessin, relatif a l'espace du skill
  - {name: layer, type: text}                 # le calque du trait (vide : encrage)
  - {name: clean, type: enum, values: [none, light, normal, strong, ""]}   # la force du nettoyage
  - {name: output, type: path}                # le PNG de sortie, dans l'espace du skill
  - {name: output_layer, type: text}          # le nom du calque neuf (vide : encrage_nettoye)
  - {name: keep, type: enum, values: [kra, file, ""]}   # kra : rentre dans le .kra ; file : PNG seul
