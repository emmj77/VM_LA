# LE MOULE D'UN SPEC. Chaque ligne porte son ID : l'id est un OFFSET, jamais une position.
# AUCUNE ECRITURE LIBRE : un tool pose des LIGNES sous un id precis, et rien d'autre.
# UNE SECTION S'OUVRE PAR : SECTION : le nom de la section
# LES NUMEROS VONT PAR CENTAINE : 100 la premiere section, 200 la seconde, ainsi de suite.
id: "{{name}}"
created: "{{date}}"
last_revision: "{{date}}"
source: human
version: "{{version}}"
Rules:
  lines_per_section: 100   # LE MAXIMUM de lignes dans une section
  chars_per_line: 100      # LE MAXIMUM d'OCTETS par ligne (LC_ALL=C) : une loi courte, lisible d'un coup

SECTION : {{section}}
  100: "..."
  101: "..."
  
SECTION : {{section}}
  200: "..."
  201: "..."
