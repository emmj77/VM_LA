# LE MOULE D'UNE ENTREE DU REGISTRE (config/la_tools.yaml). LE REGISTRE EST LA LISTE : il porte
# l'identite d'un tool, jamais son corps (le corps, la description et les arguments vivent dans
# config/tools/<machine>/tool_<nom>.yaml -- voir tool_template.yaml).
#
# QUATRE CHOSES, ET RIEN DE PLUS :
#   id          un numero, unique, celui que le modele ecrit pour appeler le tool
#   tool        le nom du tool, tel que le fichier tool_<nom>.yaml le porte
#   family      la NATURE (dix valeurs, voir ci-dessous) : c'est elle qui decide ou un chemin a le
#               droit d'etre, et c'est elle que le filtre fastText ouvre
#   sub_family  la CATEGORIE dans la famille (facultative) : pour un atelier, c'est un fait du nom
#
# LES DIX FAMILLES
#   READ     lire, lister, chercher, consulter          (chemin sous la racine)
#   WRITE    ecrire, modifier, transformer un document  (sous l'espace du skill)
#   MANAGE   skills, projets, services, paquets, table  (nomme son registre)
#   REPLY    parler a l'humain                          (aucun chemin)
#   PLAN     le plan, la memoire, le canon              (nomme son registre)
#   VISION   lire une image ou un ecran                 (sous la racine)
#   BLENDER  l'atelier 3D                               (sous l'espace du skill)
#   UNITY    le moteur de jeu                           (sous l'espace du skill)
#   KRITA    le dessin                                  (sous l'espace du skill)
#   IMAGE    fabriquer une image, convertir un modele   (sous l'espace du skill)
#
# LA SOUS-FAMILLE EST UN FAIT DU NOM, PAS UN CHOIX : la categorie RNA pour un operateur Blender
# (object, mesh, node, sequencer...), le module du CLI pour Unity (animation, graphics, physics...),
# le prefixe pour Krita. Les portes d'un atelier listent par sous-famille : `ls familles` rend la
# carte, `ls mesh` la liste. 3 253 tools en portent une.

  - id: 0
    tool: "{{name}}"
    family: "{{family}}"                # READ | WRITE | MANAGE | REPLY | PLAN | VISION | BLENDER | UNITY | KRITA | IMAGE
    sub_family: "{{sub_family}}"        # facultative ; vide pour le coeur, un mot du nom pour un atelier
    doc: "{{doc}}"                      # facultative : le domaine dont la doc s'ouvre avec ce tool
    guardrail: true                     # facultative : le tool ne s'appelle pas hors perimetre
    enabled: false                      # facultative : pose mais eteint
    visible: true                       # facultative : false = INVISIBLE au modele (outil interne au pont) ; defaut = true
