# LE MOULE D'UN TOOL. Un tool = UN FICHIER : config/tools/<machine>/tool_<nom>.yaml
# Le moteur le lit, remplace les trous {{...}}, et ENVOIE LES COMMANDES AU SHELL. Un seul
# executant : le moteur. Ni .sh a part, ni python (lois 516/517).
# LE REGISTRE config/la_tools.yaml ne porte QUE : id . tool . family . sub_family . [doc] .
# [guardrail] . [enabled: false] — c'est la LISTE, et son moule est registry_template.yaml.
# LA FAMILLE (dix valeurs) DECIDE OU UN CHEMIN A LE DROIT D'ETRE ; LA SOUS-FAMILLE dit la categorie
# dans la famille (object, mesh, animation...) et c'est un FAIT DU NOM : rien a inventer ici.
# Tout le reste (le corps, la description, les arguments) vit dans ce fichier.
tool: "{{name}}"             # le nom du tool, tel que le modele l'appelle (le fichier : tool_<nom>.yaml)
# LA FAMILLE ET LA SOUS-FAMILLE NE S'ECRIVENT PAS ICI : elles appartiennent au registre
# (config/la_tools.yaml, moule registry_template.yaml). Un tool se pose en deux morceaux : son
# corps ici, son identite la-bas.
date: "{{date}}"             # la date de pose
tags: ["{{name}}"]           # les mots qui font penser a ce tool

RULES:                       # ce qui borne le tool, dit AVANT tout effet
  enabled: true              # le tool est-il actif ? (true | false)
  timeout: 300               # le plafond de temps, en secondes : le MOTEUR le pose, le corps ne le decide pas
  # ... deux ou trois autres choses a decider (a completer)

DESCRIPTION: "..."           # UNE ligne, pour l'oeil du modele : ce que le tool FAIT. Les guillemets
                             # sont retires a la lecture ; le moteur ET la boucle la lisent ici.

# LE CORPS : une suite de commandes shell, dash + coreutils + jq (curl pour la machine), rien d'autre.
#   1 les arguments arrivent par leurs trous {{nom}}, deja valides par le moteur (forme, portee,
#     famille) : le corps ne revalide pas ce qui l'est deja.
#   2 le TEXTE LIBRE arrive par l'ENTREE STANDARD : T=$(cat). Jamais dans la commande.
#   3 il REFUSE EN NOMMANT (message sur l'erreur, sortie non nulle) : jamais un silence.
#   4 ce qu'il rend sur la sortie standard est borne et mis dans la FORME UNIQUE par le moteur :
#     le corps n'ecrit pas de JSON a la main.
#   5 il ne joint QUE la machine : un service sur 127.0.0.1. Jamais le dehors.
#   6 le bloc va jusqu'a la premiere ligne NON indentee ; les lignes vides du corps sont gardees.
COMMAND: |
  {{command}}

ARGS:                        # les arguments, DANS L'ORDRE DECLARE. Le moteur les valide AVANT tout effet.
  - {name: image, type: path}                  # path | enum | int | bool | text
  - {name: style, type: text, stdin: true}     # stdin: true = le texte libre de ce tool entre par l'entree
# Aucun argument ? alors la ligne exacte, et rien de plus :
# ARGS: []
