# LA -- LE REGISTRE DES TOOLS. Un fichier, une entree par tool. Rien d'autre.
#
# Le CORPS de chaque tool, sa DESCRIPTION et ses ARGUMENTS vivent dans SON fichier :
# config/tools/<machine>/tool_<nom>.yaml (ARGS, COMMAND). Ici, il n'y a QUE la liste.
#
# Ce que le catalogue du 02 - LES OUTILS ecrit pour l'oeil, ce fichier l'ecrit pour la MACHINE.
#
#    UNE ENTREE DE REGISTRE PORTE : id . tool . family . [guardrail] . [enabled: false]
#      id       une IDENTITE, jamais une position : ajouter un tool ne renumerote RIEN
#      tool     le NOM, tel que le fichier le porte (tool_<nom>.yaml)
#      family   READ (sous la racine) | WRITE (sous l'espace du skill) | MANAGE | REPLY
#
#    LE MOTEUR lit cette entree, OUVRE le fichier du tool, valide, puis execute les commandes
#    au shell. Le texte libre rentre par l'ENTREE STANDARD (stdin: true), JAMAIS dans la commande.
#
