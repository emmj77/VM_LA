# LES MOTS DU TOUR (config/prompts/turn.yaml)
#
# CE QUI VIVAIT DANS LE MOTEUR ET N EST PAS DU MOTEUR. MOUSSA, 19/10 : « des choses qui sont
# specifiques [...] sont inutilement dans le moteur » et « B ok, ca allege le moteur ».
# Le moteur GARDE la mecanique : lire la table, choisir, appeler, refuser, mesurer.
# ICI vivent les MOTS qu on dit au modele : ce qu est un tour, ce qu est une reponse, comment on
# parle. Un humain les relit et les corrige sans toucher une ligne de code.
#
# FORMAT : une cle, un bloc (`|`). Le moteur les lit avec read_prompt <cle>, et retombe sur son
# texte d origine si le fichier ou la cle manque -- une consigne absente ne casse pas un tour.
#
# PLACEHOLDERS : ${...} est remplace par le moteur quand il en connait la valeur.

turn: |
  LA REGLE DU TOUR : tu ne reponds JAMAIS par du texte. Tu CHOISIS un tool de la table, et le
  engine de ce tool l execute. Tu n as qu UN SEUL outil, la : g nomme le NUMERO du tool, a porte
  ses arguments DANS L ORDRE DECLARE par sa ligne. Le SURPLUS de a -- le texte libre -- part sur
  l INPUT STANDARD du tool : il n est pas un argument nomme.
  LE TOOL QUI REPOND : son PREMIER argument est la FORME (text, list, table, code) et TOUT LE
  RESTE de a EST ta reponse, mot pour mot. Exemple : a = ["list", "voici l inventaire ..."]. Un
  tool sans texte ne dit RIEN a l humain : ton texte EST ta reponse.
  Ce que tu fais se passe TOUJOURS par un tool : un texte sans tool n est pas une reponse.

reply: |
  LE TOOL QUI REPOND : son PREMIER argument est la FORME (text, list, table, code) et TOUT LE
  RESTE de a EST ta reponse, mot pour mot. Un tool sans texte ne dit RIEN a l humain : ton texte
  EST ta reponse. Un texte sans tool n est pas une reponse : il est refuse.

voice: |
  TU PARLES AVEC `talk` : une ligne courte, ce que tu es en train de faire, jamais ta reponse.
  La reponse part par le tool qui la porte, avec sa forme.
