  t_msg_count: "%s message(s) for me"
  t_msg_none: "no message for me"
  t_msg_nobody: "no board is readable (%s)"
  t_msg_from: "%s wrote to me at %s :"
  t_msg_wait: "%s and the following wait for the next call (the declared bound is reached)"
  t_msg_lost: "MESSAGES WERE LOST before I read them : my watermark fell outside the board"

forms:
  head_bytes: 1000           # octets gardes en tete de la forme RESUME

summary:
  msg_chars: 1000            # ce qu on garde d un echange avant de le donner au compacteur
  lines_max: 12
  bytes_max: 1200
  brief_lines: 2             # la forme breve : deux cotes, deux lignes chacun
  brief_bytes: 200
  input_max: 24000
  tokens_max: 400
  timeout: 300
  temperature: 0.2
  top_p: 0.9
  repeat_penalty: 1.15
  t_output: "You will summarize the tool output placed between the lines [[[ and ]]]. It may be JSON, a list of files or prose: summarize its CONTENT in French, do not copy it. At most %s lines and at most %s bytes. Write only the summary, without an introductory sentence."
  t_exchange: "You will summarize an EXCHANGE between a human (ME) and an agent (AGENT), placed between the lines [[[ and ]]. Keep what MOVED FORWARD, the DECISIONS taken and the FILES modified. Invent nothing: what is not in the exchange is not written. At most %s lines and at most %s bytes. Write only the summary, without an introductory sentence."
  t_frame_open: "[[["
  t_frame_close: "]]]"
  t_prime: "Summary :"

note:
  timeout: 20                # secondes : l attente du modele local pour la note de fin de tour
  side_lines: 2
  request_bytes: 4000
  reply_bytes: 19000
  t_human: "HUMAN REQUEST :"
  t_agent: "AGENT REPLY :"
  t_frame_human: "WHAT THE HUMAN ASKED, AND WHAT HE GOT"
  t_frame_agent: "WHAT THE AGENT DID, AND WHERE IT STANDS"
  t_empty_human: "the local model returned nothing on the human side"
  t_empty_agent: "the local model returned nothing on the agent side"
  t_no_vector: "note: no vector was posed (the embedder is silent on %s) : the entry stays readable by words"

limits:
  health_timeout: 3           # secondes : une sonde /health qui n a pas repondu a ce terme est muette
  ping_timeout: 2             # secondes : la sonde courte (/health de la page, /ping du pont, la porte TLS)
  bench_timeout: 120          # secondes : le banc du selecteur, quand le docteur le joue
  tunnel_steps: 12            # au-dela, un tunnel de tool n est plus un tunnel : c est un roman
  db_busy_ms: 5000            # millisecondes : sqlite attend ce temps avant de rendre SQLITE_BUSY
  rerank_timeout: 15          # secondes : l attente du juge (reranker) sur une part de tete
  frame_bytes: 400            # octets gardes pour les marques d un retour borne (tete ET queue)
  stop_tries: 50              # fois 0,1 s : ce qu on attend qu un processus rende la main avant KILL
  port_tries: 100             # fois 0,1 s : ce qu on attend qu un porteur (blender) ouvre sa porte
  boot_tries: 40              # fois 0,25 s : ce qu on attend qu un service se leve au demarrage
  engine_bytes: 4000         # ce que le moteur rend au harnais
  engine_lines: 200
  return_bytes: 4000          # au-dela, le retour garde son CHEMIN dans la base, pas son texte
  engine_timeout: 600        # secondes : marge au-dessus du plus long delai interne
  form_queue_bytes: 1000     # octets gardes en queue de la forme RESUME (la tete : forms:)
  form_judge_bytes: 400      # ce que le reranker LIT de chaque retour pour le juger
  form_demand_chars: 600     # ce qu on envoie du tour comme question au reranker
  form_rerank_timeout: 5     # secondes d attente du juge

