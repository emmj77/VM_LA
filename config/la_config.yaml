archi:                                         # LE FICHIER MAITRE : ce qui doit exister, avec son id
  note: |
    deux mondes, deux comportements.
    les tools : l id vit dans l en-tete du corps, la_tools en est la projection, le build la reecrit.
    le reste  : l id vit dans l en-tete du fichier, la_config en tient la liste, un id qui
                apparait ou disparait leve une erreur.
    les dossiers n ont pas d en-tete : leur id ne vit qu ici.
  rules: |
    archi - LE FICHIER MAITRE                                   root: ~/Documents/VM_LA   # ce qui doit exister, et son id
    2026-10-20   # la section archi de la_config : la cible, et l id de chaque chose
    left = the machine, english. right = the human, french after #   # anglais a gauche, francais a droite

    RULES
      One file = one job, 200 lines maximum.                             # un fichier = un metier
      Nothing runs when sourced, except engine/la.sh.                    # rien ne s execute au source
      One door to a tool: engine/run.sh <id> [args].                     # une seule porte vers le shell
      Two worlds: a tool id is projected into la_tools by the build; any other id is
      locked here, and its appearance or disappearance is an error.      # deux mondes, deux regles
      One owner per fact: la_config owns the names and the addresses, a body its behaviour.
      One carrier: la(g,a).                                              # un seul porteur depuis le modele
      engine/shell.sh alone builds a command line.                       # lui seul batit la commande
      No python, no heredoc, no eval in a .sh.                           # le shell reste du shell
      No literal: path, port, unit, model, list, cap, threshold.         # aucun fait en dur
      No case, no list in a .sh: every list is a table of conf/.         # toute liste est une table
      English in the machine.                                            # francais seulement apres le diese
      One source per fact: one reader, one list declared once.           # un fait = une source
      One writer per state file, log, base.                              # un seul ecrivain chacun
      Python reads the environment only.                                 # jamais un YAML, jamais un chemin
      Every base, log and state dir has a cap.                           # toute chose a une borne
      Nothing is erased: gio trash.                                      # rien ne s efface
      The engine knows no instrument: a binary is reached by a body.     # un binaire, un corps de tool
      A refusal is a key of conf/texts.yaml, never a string in a .sh.    # un refus est une phrase
      A tool cannot grant itself approval: it carries a human signature. # le feu vert se signe, il ne se demande pas
      tools/ holds YAML only: a body carries its code, there is no script beside it. # que du yaml, le code est dans le corps

    CRITERION   # trois questions, dans cet ordre

      1. runs during a turn, without the model asking?   -> brick, sourced      # brique du tour
      2. action asked, parameters, verdict?              -> YAML tool            # action, donc tool
      3. the shell cannot write it (http, onnx, sherpa)? -> instrument          # le shell ne sait pas

      A tool cannot approve another tool by itself. It can carry a decision a human
      signed; the gate then checks the signature, not the caller good faith.

      The engine is a conductor: it does nothing itself, it calls the bodies it needs,
      in order. A step that falls stops the turn. The model never sees these bodies.  # le moteur est un chef d orchestre

      Three conditions, or the conductor does not exist.                           # trois conditions
        caller  the door knows who calls: the model, or the engine                 # la porte sait qui appelle
        state   state/turn.json, because two processes share no variable           # l etat est un fichier
        trace   one kind per call, or the live channel becomes unreadable          # la trace distingue l etape


    25 directories, 97 files

    DOCTOR - one control is a tool          # un controle est un tool, pas un .sh a part
      family  tools/doctor: nine bodies, seventeen controls in ops       # neuf corps, dix-sept controles
      door    the same run.sh as every tool: one shape, one trace, one cap  # aucun chemin a part
      in      nothing. The LA_* environment only, like a program.        # rien, l environnement suffit
      out     the shape of the door: status ok|note|fail, result, return # une ligne, une forme
      code    0 = the control ran. It does not mean all is well.         # il a tourne, c est tout
      crash   a crashing control is one refuse, it does not kill doctor  # il ne tue pas le docteur
      count   engine.doctor walks the family and sums: one fail = red    # le compte, jamais l avis
      order   the registry order of the family, there is no list to keep # l ordre est le registre
      cache   state/doctor.cache, for the applet and the page            # pour qui ne lit pas du texte

    DOOR - engine/run.sh
      in      run.sh <id|name> [arg ...]           stdin: leftover text  # un id, ou un nom pour le moteur
      caller  LA_FROM: the model reads tools/registry.yaml, the engine reads registry-engine.yaml
      reads   registry body active skill approval caps                   # ce qu elle consulte
      engine  a call from the engine skips palette, perimeter and arity, and carries no approval
      model   a call from the model keeps all four, and the four gated bodies wait for a human
      out     one JSON line: status tool line result ts return           # toujours la meme forme
      codes   0 ok | 3 approval required | 124 timeout | else refused    # des codes stables
      writes  state/returns, and nothing else: the base and the trace belong to two bodies
      order   id family body coherence perimeter arity types paths approval holes run shape
                                                                         # l ordre impose des controles

    APPROVAL - engine/approval.sh, tool engine.approve
      gate    before a gated tool runs, the door calls approval.sh       # la porte demande
      state   state/approve holds the signed decision, approve.request the pending one
      tool    the model may call engine.approve to ask (request) or to read (status)
      human   only a human channel signs: an hmac of the request id with a key of conf/.env
      never   a tool signs for the human. a grant without a valid signature is a refusal
      window  state/approve expires, past the window the tool is refused again

    SHELL - engine/shell.sh
      head.yaml    la(g,a)                       # g = id of the registry line, a = declared args
      engine       la(name,a)                    # le moteur appelle par nom, un corps de sa famille
      body without COMMAND, with machine and op:                            # la regle du porteur
        <machine> --op <op> --arg "<arg>={{<arg>}}" ...

    TEXTS - conf/texts.yaml                     # toutes les phrases, une cle, un usage
      refusals  tool_unknown arity perimeter approval_required timeout path_outside_canon
      turn      the texts the model reads       # protocole, portee, consigne
      board     the texts the panel reads       # le tableau
      bridge    the texts the bridge returns    # le telephone
      voice     the texts that are spoken       # la voix
      doctor    the labels of the checks        # les libelles
      rule      a key without reader = fail, a reader without key = fail, no french
      where     nowhere else: not in a .sh, not in a .py

    TOOLS - family engine                       # seize actions, un corps YAML chacune
      models     40 l.  load unload status       # charger le reranker, demarrer, arreter, l etat
      asr        22 l.  start stop status        # l oreille
      tts        26 l.  start stop status        # la voix
      retention  64 l.  audio returns logs bases # applique les bornes
      tunnel     60 l.  up down status qr        # wireguard, serveur et telephone
      backup     78 l.  now verify restore       # la sauvegarde hors disque
      update    151 l.  check apply rollback     # la mise a jour, et le retour arriere
      switch     82 l.  list take                # change de moteur
      spec       27 l.  add list                 # ecrit une loi du canon
      stat       28 l.  exchanges tools          # lit sessions.db et rend un compte
      approve    76 l.  request grant deny status# la demande, la signature, le refus
      commands  117 l.  board app once cli say turn doctor tool new update help # les surfaces de la
      install   274 l.  units command desktop applet certs # ce qu on pose sur la machine
      hist       90 l.  init add window apply result# sessions.db, ce que le tour ecrit
      trace      60 l.  line                     # trace.jsonl, ce que le tour raconte
      doctor    418 l.  short light json all     # le diagnostic : parcourt la famille doctor

      model says   la(g, a)                      # g = id de la ligne du registre
      door reads   tools/<family>/tool_<action>.yaml
      body says    COMMAND: | its own shell code, inline. or machine + op for a machine
      one carrier  shell.sh takes the block out of the body and runs it, capped
      door returns status tool line result ts return

    TOOLS - family doctor                        # les controles, en tools comme le reste
      structure   root scripts programs          # racine, cles, syntaxe, programmes, litteraux
      tools       table paths                    # registre et corps, chemins cites par la table
      texts       prompt                         # les phrases que lit le modele
      knowledge   skills active canon            # competence, projet, canon
      data        bases memory                   # bases, memoire
      machine     residents instruments benches  # ce qui ecoute, ce qui est appele, les bancs
      forms       forms                          # formulaires de retour
      language    vocab                          # aucun mot francais
      manifest    manifest                       # le disque contre ce fichier
      keys        keys                           # la_config contre les corps
      entry       engine.doctor: short light json all                     # le compte et le verdict
      light       benches skip, programs partial                          # ce que --light epargne

    ENGINE FAMILY - not tools like the others  # la famille ENGINE n est pas une famille comme les autres
      visible   the model never sees them: no head schema, no palette, no permanent   # invisibles au modele
      registry  tools/engine/registry-engine.yaml, un fichier un nom, aucun doublon # deux canaux, deux noms
      channel   the model channel reads tools/registry.yaml only: it stays short      # le canal reste court
      caller    the door knows who calls, and hands the right table to tab.sh         # la porte donne la table
      name      an engine body is called by its name, never by a numeric id           # appele par son nom
      checks    no palette, no perimeter of a skill, no arity of a skill              # pas de perimetre de skill
      approval  none: the four gated bodies are asked by the model, never by the engine # le feu vert reste au modele
      result    no cap and no returns entry: the result feeds the turn, not the model # borne pour le modele seulement
      failure   a step that falls stops the turn, and the doctor sees the refuse      # un echec arrete le tour
      trace     kind=step, so the live channel tells an engine call from a model call # la trace distingue
      plan      an open plan restricts the model, never the engine                    # le plan lie le modele

    PIPELINE - conf/pipeline.yaml              # le tour est une suite declaree, pas un programme
      turn    facts second scope prompt call tools reply note
      step    one name, one body. it reads state/turn.json and rewrites it
      chief   loop.sh reads the order, step.sh runs the step, run.sh opens the door, shell.sh builds
      fail    the step that falls stops the turn, leaves turn.json as it is, and the doctor sees it
      gain    add a step = one line here and one body. no .sh to touch

    SIX LISTS - where each one landed           # les six listes, et leur adresse
      commands    engine.commands, ops are the surfaces of la           # les onze surfaces
      checks      family doctor, ops are the controls                   # dix-sept controles
      residents   la_config : unit port probe de chaque service         # ce qui ecoute
      retention   engine.retention, ops are the folders                 # les bornes
      units       engine.install genere config/units/*.in depuis la_config # ce qu on pose
      env         la_config paths: and ports:, exported by boot.sh      # les LA_*

    BODY KEYS - five for every body, six more for the engine   # les cles d un corps
      always    tool RULES DESCRIPTION ARGS, COMMAND or machine+op      # les cinq de tout corps
      turn      RULES.turn doc|plan|toolset|project|canon|none          # l effet sur le tour
      count     RULES.count false, RULES.paths read|write               # le compteur, ce qu on garde
      events    the watch body carries its events: say voice image      # watcher.sh:16
      kinds     a second head and a summary carry their kinds in ops    # second.sh:395
      why       loop.sh 1271 1283 1310 1314 name tools and decide for them  # ce que ces cles suppriment

    CONFIG - conf/la_config.yaml, the names      # tout ce qui se nomme, et qui le possede
      names     paths ports models lists caps thresholds                 # des noms, jamais du texte
      addresses unit port probe de chaque service : ici, le corps ne les repete pas
      families  name, base (root|work|none), registry (model|engine)     # les familles, declarees une fois
      readers   engine/cfg.sh and programs/laconf.py only. a body never parses la_config
      why       engine.sh:298 and 367 hold the ten families twice, and doctor.sh greps the source to get them
                                                                         # ce que la table supprime

    IDS - two worlds, two rules                  # un id par chose, deux comportements
      tool      l id vit dans l en-tete du corps. la_tools est la projection, ecrite au build
                et sur reload_tools : un id nouveau entre, un id retire sort, aucune erreur.
      other     l id vit dans l en-tete du fichier, et sa liste est ici, dans archi.files.
                un id qui apparait ou disparait leve une erreur : c est une decision, pas un effet.
      population tool, skill, project : l id vit dans l en-tete, l index le projette au build.
            un id nouveau entre, un id retire sort, aucune erreur : c est une population.
      lock      config/ : l id est ici, dans archi.files. un ecart est une erreur.
      chain     project J## -> SKILLS [K##] -> TOOLSET [id du tool]. une reference morte = erreur.
      letters   R racine C conf E engine P programs U units S setup A applet H page B bases
                N state F filter Z certs D dossier, K une skill, J un projet ; le tool garde son numero.
      dir       un dossier n a pas d en-tete : son id ne vit qu ici, dans archi.dirs.
      format    une lettre par aire, voir letters. jamais reutilise, jamais renumero.
      resolve   cfg path E07 donne le chemin. personne d autre ne sait ou habite E07.
      check     trois directions : declare sans disque, disque sans id, reference morte.
    GABARITS - engine.new, quatre ops       # ce qu une pose ecrit, et rien d autre
      sh        #!/bin/sh, puis # id: <libre>, # role: une ligne, puis le corps
      tool      tool, family, l id libre du numero, ARGS, COMMAND
      skill     skill, id K##, TOOLSET {id du tool: nom}, RULES, SUMMARY
      project   project, id J##, SKILLS [K##], path, RULES
      regle     chaque gabarit ecrit son id en premiere ligne, et ne recopie jamais un nom
      why       un fichier sans id est invisible pour l index, donc inappelable, donc mort

    ENVIRONMENT GIVEN TO PROGRAMS         # ce qu un programme recoit, et rien de plus
      source  la_config paths: and ports:, exported once by boot.sh     # une seule origine, un seul moment
      names   LA_ROOT LA_CONFIG LA_STATE LA_DATA LA_WORK LA_RETURNS LA_AUDIO LA_PAGE LA_TOOL
              LA_SESSIONS_DB LA_MEMORY_DB LA_TRACE LA_REPLY_STREAM LA_ENV
              LA_PORT_BRIDGE LA_PORT_TLS LA_PORT_DASH LA_PORT_MODELS LA_PORT_TTS LA_PORT_ASR
              LA_MODEL LA_HOST LA_AGENT LA_SESSION LA_TURN LA_CAP_BYTES LA_CAP_LINES
      read    a program reads os.environ only: no YAML, no path built   # python lit l environnement
      gain    a new LA_* is one line of la_config, and nothing else moves  # le moteur ne bouge plus

    DEPENDENCIES
      dash coreutils awk sed grep find xargs jq sqlite3 curl        # le socle
      systemctl --user tailscale git tesseract ffmpeg node          # services et instruments
      tree                                                          # le corps manifest compare l arbre
      forbidden: python3 outside programs/, yq, heredoc, eval        # ce qui n entre pas

    COMMANDS
      la board | cli | say <text> | app | turn        # les surfaces
      la doctor [--short|--light|--json|--all]        # le diagnostic, par la porte
      la tool <id|name> [args]                        # un tool par la porte, par id ou par nom
      la new skill|project|tool <name>                # les gabarits, sans fichier gabarit
