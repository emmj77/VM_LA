id: "G022"
tool: "load_doc"
permanent: true
date: "2026-10-17"
tags: ["plan", "shell", "file", "load"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "reads the docs NAMED by the active skill (DOCS): the web, a machine, or a path"

COMMAND: |
  T="{{topic}}"
  case "$T" in
    ''|*[!a-zA-Z0-9_.-]*) [ -n "$T" ] && printf '%s\n' "$(msg topic_malformed "$T")" >&2 ; T= ;;
  esac
  A=$(sed -n '1p' "${LA_STATE_SKILL:-$(cfg path skills)/.active}" 2>/dev/null | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
  case "$A" in ''|*/*|*..*) A= ;; esac
  [ -n "$A" ] || { printf '%s\n' "$(msg no_active_skill)" >&2 ; exit 1; }
  S="$(cfg path skills)/$A/skill.yaml"
  [ -f "$S" ] || { printf '%s\n' "$(msg active_manifest_missing "$S")" >&2 ; exit 1; }
  # the lock lifts for this turn : the skill says which doc was asked, the content is not judged
  _tf=$(cfg abs turn) ; [ -s "$_tf" ] && _turn_set ".doc = \"$A\"" 2>/dev/null
  RES=$(sed -n '/^DOCS:/,/^[^[:space:]]/p' "$S" \
        | sed -n 's/^[[:space:]]*[0-9][0-9]*:[[:space:]]*//p' \
        | sed -e 's/^"//' -e 's/"[[:space:]]*$//' | grep -v '^$')
  if [ -z "$RES" ]; then
    printf '%s\n' "$(msg docs_empty "$A")"
    exit 0
  fi
  WS=$(sed -n '/^WRITABLE_WORKSPACE:/,/^[^[:space:]]/p' "$S" | sed -n 's/^[[:space:]]*workspace:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' | head -n 1)
  if [ -n "$T" ]; then
    if printf '%s\n' "$RES" | grep -qxF -- "$T"; then LIST="$T" ; else
      printf '%s\n' "$(msg topic_not_named "$T" "$A")"
      LIST="$RES"
    fi
  else LIST="$RES"; fi

  printf '%s\n' "$LIST" | while IFS= read -r R; do
    [ -n "$R" ] || continue
    case "$R" in
      web_search|web|none)
        printf '%s\n' "$(msg doc_on_web "$A" "$R")"
        printf '%s\n' "$(msg seek_official)"
        continue ;;
    esac
    WWS=
    PAC=$(sed -n '1p' "${LA_STATE_PROJECT:-$ROOT/projects/.active}" 2>/dev/null | tr -d '\r')
    PJL="$ROOT/projects/*/project.yml"
    if [ -n "$PAC" ] && [ -f "$ROOT/projects/$PAC/project.yml" ]; then
      PJL="$ROOT/projects/$PAC/project.yml $ROOT/projects/*/project.yml"
    fi
    for PJ in $PJL; do
      [ -f "$PJ" ] || continue
      PP=$(sed -n 's/^path:[[:space:]]*"\{0,1\}\([^"]*\)"\{0,1\}[[:space:]]*$/\1/p' "$PJ" | head -n 1)
      [ -n "$PP" ] || continue
      for D in "$ROOT/$PP" "$HOME/$PP" "$ROOT/../$PP"; do
        [ -d "$D/$R" ] && { WWS="$D/$R" ; break; }
      done
      [ -n "$WWS" ] && break
    done
    P=
    for C in "$(cfg path tools)/$R" "$WWS" "$ROOT/$R" "$(cfg path skills)/$A/$R" "$(cfg path skills)/$R" \
             ${WS:+"$ROOT/$WS/$R"}; do
      case "$C" in *..*) continue ;; esac
      [ -e "$C" ] || continue
      P="$C" ; break
    done
    if [ -z "$P" ]; then
      # the DOCS section IS the doc : a value that names no file on disk is a line of it,
      # printed as it stands. a skill with no DOCS asks for nothing, and the lock lifts anyway.
      printf '%s\n' "$R"
      continue
    fi
    if [ -f "$P" ]; then
      NAT=$(file -b --mime-type "$P" 2>/dev/null || echo '?')
      case "$NAT" in
        text/*|application/json|application/xml|application/yaml|application/csv)
          printf '%s\n' "$(msg skill_document_line "$R" "$A" "$P")"
          LC_ALL=C sed -n '1,400p' "$P" ;;
        *)
          printf '%s\n' "$(msg resource_not_text "$R" "$A" "$P")"
          printf '%s\n' "$(msg resource_nature_db "$NAT" "$(wc -c < "$P" | tr -d ' ')")"
          printf '%s\n' "$(msg resource_nature_tail)";;
      esac
      continue
    fi
    TOPIC=$(grep -h '^doc:' "$P"/tool_*.yaml 2>/dev/null | sed -e 's/^doc:[[:space:]]*//' -e 's/[[:space:]]*$//' | LC_ALL=C sort -u | grep -v '^$' | tr '\n' ' ')
    NF=$(find "$P" -maxdepth 1 -type f 2>/dev/null | wc -l)
    ND=$(find "$P" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | wc -l)
    if [ "$NF" -eq 1 ] && [ "$ND" -eq 0 ]; then
      F=$(find "$P" -maxdepth 1 -type f 2>/dev/null)
      NAT=$(file -b --mime-type "$F" 2>/dev/null || echo '?')
      case "$NAT" in
        text/*|application/json|application/xml|application/yaml|application/csv)
          printf '%s\n' "$(msg doc_single_file "$R" "$A" "$P")"
          LC_ALL=C sed -n '1,400p' "$F" ; continue ;;
      esac
      printf '%s\n' "$(msg resource_single_not_text "$R" "$A" "$P")"
      printf '%s\n' "$(msg resource_nature "$NAT" "$(wc -c < "$F" | tr -d ' ')")"
      continue
    fi
    printf '%s\n' "$(msg resource_dir "$R" "$A" "$P" "$NF" "$ND")"
    for E in "$P"/*; do
      [ -e "$E" ] || continue
      [ -d "$E" ] && printf '  %s/\n' "$(basename "$E")" || printf '  %s\n' "$(basename "$E")"
    done | LC_ALL=C sort | head -n 60
    if [ -n "$TOPIC" ]; then
      printf '%s\n' "$(msg document_has_no_topic "$R" "$TOPIC")"
      printf '%s\n' "$(msg text_from_source)"
    fi
  done
  exit 0

ARGS:
  - {name: topic, type: text}
