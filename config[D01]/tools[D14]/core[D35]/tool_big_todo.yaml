id: "G048"
tool: "big_todo"
date: "2026-10-17"
tags: ["plan", "shell", "plan", "project"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "writes the big plan of the loaded project: name, goal, and the steps separated by ; -- the PROJECT_PLAN section of project.yml, first step in_progress, 12 steps and 100 characters a step at most."

COMMAND: |
  [ -n "{{goal}}" ] || { printf '%s\n' "$(msg big_todo_goal_empty)" >&2 ; exit 1; }
  [ -n "{{points}}" ] || { printf '%s\n' "$(msg big_todo_point_empty)" >&2 ; exit 1; }
  PTS=$(printf '%s' "{{points}}" | tr ';' '\n')
  skl_big_write "{{name}}" "{{goal}}" "$PTS"
  _rc=$?
  case $_rc in
    0) exit 0 ;;
    10) printf '%s\n' "$(msg refusals.plan_steps_bound "$(cfg num loop.plan_steps 12)")" >&2 ; exit 1 ;;
    11) printf '%s\n' "$(msg refusals.plan_line_bound "$(cfg num loop.plan_chars 100)")" >&2 ; exit 1 ;;
    14) printf '%s\n' "$(msg refusals.big_plan_no_project)" >&2 ; exit 1 ;;
    15) printf '%s\n' "$(msg refusals.big_plan_open)" >&2 ; exit 1 ;;
    *) exit 1 ;;
  esac

ARGS:
  - {name: name, type: text}
  - {name: goal, type: text}
  - {name: points, type: text}
