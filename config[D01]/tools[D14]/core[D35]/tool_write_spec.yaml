id: "G020"
tool: "write_spec"
date: "2026-10-17"
tags: ["write", "shell", "config", "write"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "writes ONE law of the CANON (projects/<active>/spec.yaml), bounded by cap"

COMMAND: |
  SEC="{{section}}"
  [ -r "$PROCS/spec.sh" ] || { echo "refused: the spec brick is missing ($PROCS/spec.sh)" >&2 ; exit 1 ; }
  . "$PROCS/spec.sh"
  LAW="{{law}}"
  if [ -n "$LAW" ]; then   # ONE law, by its number. Never the file, never two laws.
    case "$LAW" in *[!0-9]*) printf '%s\n' "$(msg malformed_law_law_law "$LAW")" >&2 ; exit 1 ;; esac
    [ -n "$SEC" ] || SEC=free
    F="$SPEC_FILE"
    [ -f "$F" ] || { echo "refused: the active skill spec is missing ($F)" >&2 ; exit 1; }
    SK="$SKILL"
    CH=$(sed -n 's/^[[:space:]]*chars:[[:space:]]*\([0-9][0-9]*\).*$/\1/p' "$SK" | head -n 1)
    case "$CH" in ''|*[!0-9]*) CH=100 ;; esac
    BODY=$(cat)
    V=$(printf '%s\n' "$BODY" | sed -e '/^[[:space:]]*$/d')
    [ "$(printf '%s\n' "$V" | wc -l | tr -d ' ')" = 1 ] || { printf '%s\n' "$(msg set_law_writes_one)" >&2 ; exit 1; }
    V=$(printf '%s' "$V" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
    R="  $LAW: \"$V\""
    [ "$(printf '%s' "$R" | wc -c | tr -d ' ')" -le "$CH" ] || { printf '%s\n' "$(msg law_law_goes_past "$LAW" "$CH")" >&2 ; exit 1; }
    law_write "$F" "$LAW" "$R" || { printf '%s\n' "$(msg write_failed_file "$F")" >&2 ; exit 1; }
    printf '%s\n' "$(msg law_set "$F" "$LAW" "$(printf '%s' "$R" | wc -c | tr -d ' ')")"
    exit 0
  fi
  case "$SEC" in ''|*[!a-zA-Z0-9_]*) printf '%s\n' "$(msg malformed_section_section_spec "$SEC")" >&2; exit 1 ;; esac
  F="$SPEC_FILE"
  [ -f "$F" ] || { echo "refused: the active skill spec is missing ($F)" >&2; exit 1; }
  SK="$SKILL"
  [ -f "$SK" ] || { echo "refused: the active skill is missing ($SK)" >&2; exit 1; }
  CH=$(sed -n 's/^[[:space:]]*chars:[[:space:]]*\([0-9][0-9]*\).*$/\1/p' "$SK" | head -n 1)
  case "$CH" in ''|*[!0-9]*) CH=100 ;; esac
  CL=$(sed -n 's/^[[:space:]]*lines:[[:space:]]*\([0-9][0-9]*\).*$/\1/p' "$SK" | head -n 1)
  case "$CL" in ''|*[!0-9]*) CL=20 ;; esac
  grep -q "^SECTION : ${SEC}\$" "$F" || { printf '%s\n' "$(msg section_not_found "$SEC")" >&2; exit 1; }
  BODY=$(cat)
  V=$(printf '%s\n' "$BODY" | sed -e '/^[[:space:]]*$/d')
  N=$(printf '%s\n' "$V" | wc -l | tr -d ' ')
  [ "$N" -ge 1 ] || { printf '%s\n' "$(msg empty_section_write_spec)" >&2; exit 1; }
  [ "$N" -le "$CL" ] || { printf '%s\n' "$(msg too_many_lines_bound "$N" "$CL")" >&2; exit 1; }
  LENGTH=$(printf '%s\n' "$V" | awk -v n="$CH" 'length($0) > n { print NR; exit }')
  [ -z "$LENGTH" ] || { printf '%s\n' "$(msg line_goes_past_bytes "$CH" "$LENGTH")" >&2; exit 1; }
  BAD=$(printf '%s\n' "$V" | grep -vE '^[0-9]+: ' | head -n 1)
  [ -z "$BAD" ] || { printf '%s\n' "$(msg malformed_line_shape_id "$BAD")" >&2; exit 1; }
  TMP="$F.$$.tmp"
  {
    sed -n "1,/^${SEC}:/p" "$F" | sed '$d'
    printf '%s:\n' "$SEC"
    printf '%s\n' "$V" | sed -e 's/^/  /'
    sed -n "/^${SEC}:/,\$p" "$F" | sed -e '1d' | sed -n '/^[A-Za-z0-9_]/,$p'
  } > "$TMP" || { rm -f "$TMP"; printf '%s\n' "$(msg write_failed_file "$F")" >&2; exit 1; }
  [ -s "$TMP" ] || { rm -f "$TMP"; printf '%s\n' "$(msg mount_wrote_nothing)" >&2; exit 1; }
  grep -q "^${SEC}:" "$TMP" || { rm -f "$TMP"; printf '%s\n' "$(msg section_not_written "$SEC")" >&2; exit 1; }
  AV=$( { sed -n "1,/^${SEC}:/p" "$F" | sed '$d'; sed -n "/^${SEC}:/,\$p" "$F" | sed -e '1d' | sed -n '/^[A-Za-z0-9_]/,$p'; } )
  AP=$( { sed -n "1,/^${SEC}:/p" "$TMP" | sed '$d'; sed -n "/^${SEC}:/,\$p" "$TMP" | sed -e '1d' | sed -n '/^[A-Za-z0-9_]/,$p'; } )
  [ "$AV" = "$AP" ] || { rm -f "$TMP"; printf '%s\n' "$(msg another_section_moved_nothing "$SEC")" >&2; exit 1; }
  mv -f "$TMP" "$F" || { rm -f "$TMP"; printf '%s\n' "$(msg write_failed_file "$F")" >&2; exit 1; }
  printf '%s\n' "$(msg section_set_line_s "$F" "$SEC" "$N" "$CL" "$CH")"

ARGS:
  - {name: section, type: text}
  - {name: lines, type: text, stdin: true}
  - {name: law, type: int}
