id: "G036"
tool: "count_lines_of_code"
date: "2026-10-17"
tags: ["read", "shell", "project", "run"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "counts code, comments and blank lines of a project, by language"

COMMAND: |
  LC_ALL=C; export LC_ALL
  P="{{path}}"; [ -n "$P" ] || P=.
  D="$ROOT/$P"
  [ -e "$D" ] || { printf '%s\n' "$(msg path_missing_var "$P")" >&2 ; exit 1 ; }
  command -v tokei >/dev/null 2>&1 || { printf '%s\n' "$(msg binary_missing 'tokei')" >&2 ; exit 1 ; }
  command -v jq >/dev/null 2>&1 || { printf '%s\n' "$(msg jq_missing)" >&2 ; exit 1 ; }
  tokei "$D" -e .git -e backups -e node_modules --output json \
    | jq -r '"\(.Total.code) lignes de code ; \(.Total.comments) commentaires ; \(.Total.blanks) blancs",
             ([ to_entries[] | select(.key != "Total") | select(.value.code > 0)
                | "\(.key) \(.value.code)" ] | sort | join(" | "))'

ARGS:
  - {name: path, type: path}
