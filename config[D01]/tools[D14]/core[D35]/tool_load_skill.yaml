id: "G053"
tool: "load_skill"
permanent: true
date: "2026-10-17"
tags: ["manage", "shell", "project", "load"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: "work"
  approval: required
  turn: none
  count: false
  paths: write

DESCRIPTION: "loads a skill : writes skills/.active ; its TOOLS become the tools the model may call (the skill must be in the project's list)"

COMMAND: |
  NAME="{{name}}"
  SK=$(cfg path skills)
  [ -d "$SK" ] || { printf '%s\n' "$(msg skills_dir_missing "$SK")" >&2 ; exit 1 ; }
  SLUG=$(printf '%s' "$NAME" | tr 'A-Z' 'a-z' | tr -cs 'a-z0-9' '-' | sed -e 's/^-*//' -e 's/-*$//' | cut -c1-40 | sed -e 's/-*$//')
  [ -n "$SLUG" ] || { printf '%s\n' "$(msg name_no_slug "${NAME:-absent}")" >&2 ; exit 1 ; }
  C="$SK/$SLUG/skill.yaml"
  if [ -L "$SK/$SLUG" ]; then printf '%s\n' "$(msg target_symlink "$SLUG")" >&2 ; exit 1 ; fi
  [ -d "$SK/$SLUG" ] && [ -f "$C" ] || { printf '%s\n' "$(msg skill_absent_file "$SLUG")" >&2 ; exit 1 ; }
  H=$(sed -n 's/^HUMAN_ONLY:[[:space:]]*//p' "$C" | head -n 1 | sed -e 's/#.*$//' | tr -d ' ')
  if [ "$H" = true ] && [ "${LA_FROM:-model}" = model ]; then
    printf '%s\n' "$(msg refusals.human_only_skill "$SLUG")" >&2 ; exit 1
  fi
  PROCS=${PROCS:-$(cfg path programs 2>/dev/null)}
  if [ -n "$PROCS" ] && [ -f "$PROCS/lib.sh" ]; then
    . "$PROCS/lib.sh"
  else
    active_project() { PNAME=""; PROJECT=""; }
    project_skills() { :; }
  fi
  active_project ; PSK=
  [ -n "$PNAME" ] && PSK=$(project_skills "$PROJECT")
  if [ -n "$PNAME" ] && [ -n "$PSK" ]; then
    printf '%s\n' "$PSK" | grep -qxF -- "$SLUG" \
      || { printf '%s\n' "$(msg project_skill_absent "$PNAME" "$SLUG" "$(printf '%s ' $PSK)")" >&2 ; exit 1 ; }
  fi
  OUV=$(printf '' | "${PROCS:-$ROOT/config/engine}/plan.sh" status 2>/dev/null) || OUV=
  case "$OUV" in
    ''|'no open plan'*|'aucun plan ouvert'*) : ;;
    *) { printf '%s\n' "$(msg plan_open_strict)" >&2; exit 1; } ;;
  esac
  STATE="${LA_STATE_SKILL:-$SK/.active}"
  if [ -L "$STATE" ]; then printf '%s\n' "$(msg pointer_symlink "$STATE")" >&2; exit 1; fi
  ANC=$(sed -n '1p' "$STATE" 2>/dev/null)
  if [ -n "$ANC" ] && [ "$ANC" != "$SLUG" ] && [ -f "$SK/$ANC/skill.yaml" ]; then
    PA=$(sed -n 's/^PORTEUR:[[:space:]]*//p' "$SK/$ANC/skill.yaml" 2>/dev/null | head -n 1 | sed -e 's/#.*$//' | tr -d ' \"')
    [ -n "$PA" ] && [ -x "$PROCS/$PA" ] && "$PROCS/$PA" stop >/dev/null 2>&1
  fi
  printf '%s\n' "$SLUG" > "$STATE" || { printf '%s\n' "$(msg pointer_not_written "$STATE")" >&2; exit 1; }
  [ "$(sed -n '1p' "$STATE" 2>/dev/null)" = "$SLUG" ] || { printf '%s\n' "$(msg pointer_not_written "$STATE")" >&2; exit 1; }
  PN=$(sed -n 's/^PORTEUR:[[:space:]]*//p' "$C" 2>/dev/null | head -n 1 | sed -e 's/#.*$//' | tr -d ' \"')
  if [ -n "$PN" ] && [ -x "$PROCS/$PN" ]; then
    "$PROCS/$PN" start >/dev/null 2>&1 \
      || printf '%s\n' "$(msg carrier_did_not_start "$PN")" >&2
  fi
  cat "$C"

ARGS:
  - {name: name, type: text}
