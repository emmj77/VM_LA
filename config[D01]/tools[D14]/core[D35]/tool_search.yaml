id: "G005"
tool: "search"
date: "2026-10-17"
tags: ["read", "shell", "project", "search"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "searches a fixed text across the project, returns the files that carry it"

COMMAND: |
  T="{{text}}"; [ ${#T} -ge 3 ] || { printf '%s\n' "$(msg text_too_short)" >&2; exit 1; }; cd "$ROOT" && LC_ALL=C grep -rlF -- "$T" . | LC_ALL=C sort | cut -c3-

ARGS:
  - {name: text, type: text, stdin: true}
