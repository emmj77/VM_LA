id: "G051"
tool: "skill_list"
date: "2026-10-17"
tags: ["skill_list", "skill"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "lists the skills : one per line with its tags (the ones the ACTIVE PROJECT opens, when one is loaded)"

COMMAND: |
  SK="$ROOT/skills"
  [ -d "$SK" ] || { printf '%s\n' "$(msg skills_dir_missing "$SK")" >&2 ; exit 1 ; }
  [ -f "$PROCS/lib.sh" ] || { printf '%s\n' "$(msg shared_library_missing "$PROCS")" >&2 ; exit 1 ; }
  . "$PROCS/lib.sh"
  active_project ; PSK=
  [ -n "$PNAME" ] && PSK=$(project_skills "$PROJECT")
  N=0 ; NT=0
  for F in "$SK"/*/skill.yaml; do
    [ -f "$F" ] || continue
    [ -L "$F" ] && continue
    NT=$((NT+1))
    if [ -n "$PNAME" ] && [ -n "$PSK" ]; then
      printf '%s\n' "$PSK" | grep -qxF -- "$(basename "$(dirname "$F")")" || continue
    fi
    N=$((N+1))
    NM=$(sed -n 's/^skill: *//p' -- "$F" | head -n 1)
    [ -n "$NM" ] || NM=$(basename "$(dirname "$F")")
    TG=$(sed -n 's/^tags: *//p' -- "$F" | head -n 1)
    [ -n "$TG" ] || TG="[]"
    printf '%s %s\n' "$NM" "$TG"
  done
  [ -n "$PNAME" ] && printf '%s\n' "$(msg project_opens_skill_s)""$PNAME" "$N" "$NT"
  [ "$N" -ge 1 ] || { printf '%s\n' "$(msg no_skill_to_show "${PNAME:+le projet $PNAME n ouvre aucune skill presente sous }" "$SK")" >&2 ; exit 1 ; }

ARGS:
