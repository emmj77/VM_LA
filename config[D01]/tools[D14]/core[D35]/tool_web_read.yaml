id: "G069"
tool: "web_read"
permanent: true
date: "2026-10-20"
tags: ["read", "shell", "text", "read"]


RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "opens a page with agent-browser and returns its text (cut to the engine output size)."

COMMAND: |
  LC_ALL=C; export LC_ALL
  A=$(command -v agent-browser 2>/dev/null || echo /usr/local/bin/agent-browser)
  [ -x "$A" ] || { echo "refused: agent-browser is missing (sudo npm i -g agent-browser)" >&2 ; exit 1 ; }
  U="{{url}}"
  [ -n "$U" ] || { echo "refused: empty url" >&2 ; exit 1 ; }
  OUT=$("$A" --profile /home/moussa/.agent-browser/profile read "$U" 2>&1)
  case "$OUT" in
    ''|✗*|*"Read request failed"*)
      # a host may refuse the direct reader: the page is returned and the text read
      "$A" --profile /home/moussa/.agent-browser/profile open "$U" >/dev/null 2>&1 || { echo "refused: the page cannot be reached" >&2 ; exit 1 ; }
      OUT=$("$A" eval "document.body.innerText" 2>/dev/null | sed 's/\\n/\n/g') ;;
  esac
  [ -n "$OUT" ] || { echo "refused: empty page" >&2 ; exit 1 ; }
  # the engine caps at 200 lines AND 4000 bytes: both stay under
  printf '%s' "$OUT" | head -n 180 | head -c 3500 | iconv -c -f utf-8 -t utf-8

ARGS:
  - {name: url, type: text}
