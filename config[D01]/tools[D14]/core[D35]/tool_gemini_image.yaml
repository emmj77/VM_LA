id: "G068"
tool: "gemini_image"
date: "2026-10-20"
tags: ["image", "shell", "img", "run"]


RULES:
  enabled: true
  timeout: 300
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Genere une image sur Gemini web a partir d'un prompt, attend le bouton de telechargement, enregistre le fichier dans work/ et rend son chemin et sa taille."

COMMAND: |
  LC_ALL=C; export LC_ALL
  A=$(command -v agent-browser 2>/dev/null || echo "$(cfg str machine.browser.bin)")
  [ -x "$A" ] || { echo "refused: agent-browser is missing (sudo npm i -g agent-browser)" >&2 ; exit 1 ; }
  W=$(cfg here work[D25] 2>/dev/null) || W="${ROOT}/work[D25]"
  P="{{prompt}}"
  [ -n "$P" ] || { echo "refused: empty prompt" >&2 ; exit 1 ; }
  N="{{name}}"
  [ -n "$N" ] || N="gemini-$(date +%Y%m%d-%H%M%S)"
  N=$(printf '%s' "$N" | tr -c 'a-zA-Z0-9._-' '-' | sed 's/-*$//')
  OUT="$W/$N.jpg"
  "$A" --profile "$(cfg str machine.browser.profile)" --restore open https://gemini.google.com/app >/dev/null 2>&1 || { echo "refused: gemini does not open" >&2 ; exit 1 ; }
  S1=$("$A" snapshot 2>/dev/null)
  printf '%s' "$S1" | grep -qiE 'sign in|se connecter' && {
    echo "refused: no Google session in the Chromium profile — sign in once: agent-browser --profile "$(cfg str machine.browser.profile)" --headed --restore open https://gemini.google.com/app" >&2 ; exit 1 ; }
  # the Gemini input box is a contenteditable: it is emptied before writing
  "$A" click "[role=textbox]" >/dev/null 2>&1 || { echo "refused: the gemini input box is not there (page changed?)" >&2 ; exit 1 ; }
  "$A" press "Control+a" >/dev/null 2>&1
  "$A" keyboard inserttext "$P" >/dev/null 2>&1 || { echo "refused: cannot write in the box" >&2 ; exit 1 ; }
  "$A" press Enter >/dev/null 2>&1 || { echo "refused: cannot send" >&2 ; exit 1 ; }
  # we wait for the button that downloads the full-size image (the apostrophe is a point:
  # the label reads « Telecharger l'image en taille reelle »)
  i=0
  while [ "$i" -lt 40 ]; do
    sleep 3; i=$((i+1))
    "$A" snapshot 2>/dev/null | grep -qiE "charger l.image|download (the )?(full|original)" && break
  done
  # every snapshot expires the previous refs: a fresh ref is taken again
  # and it is retried, because Gemini re-renders the button between two reads.
  T=$(mktemp -d); k=0; F=
  while [ "$k" -lt 3 ]; do
    k=$((k+1))
    REF=$("$A" snapshot 2>/dev/null | grep -iE "charger l.image|download (the )?(full|original)" | grep -o 'ref=e[0-9]*' | tail -1 | cut -d= -f2)
    [ -n "$REF" ] || { sleep 5 ; continue ; }
    # without --download-path: the flag returns 0 file. The binary writes a name
    # of an identifier in the target folder, and exits on error even when it works.
    "$A" download "@$REF" "$T/$N.jpg" >/dev/null 2>&1
    sleep 5
    F=$(find "$T" -maxdepth 1 -type f | head -1)
    [ -n "$F" ] && break
    sleep 2
  done
  [ -n "$F" ] || { gio trash "$T" 2>/dev/null ; echo "refused: the image is there but the download returned nothing" >&2 ; exit 1 ; }
  file -b "$F" | grep -qi image || { gio trash "$T" 2>/dev/null ; echo "refused: the downloaded file is not an image" >&2 ; exit 1 ; }
  mv "$F" "$OUT" && gio trash "$T" 2>/dev/null
  echo "$OUT $(stat -c%s "$OUT") o"

ARGS:
  - {name: prompt, type: text, stdin: true}
  - {name: name, type: text}
