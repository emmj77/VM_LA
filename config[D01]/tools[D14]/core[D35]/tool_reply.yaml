id: "G001"
tool: "reply"
permanent: true
date: "2026-10-18"
tags: ["reply", "shell", "audio", "run"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "the answer to the human, in words: the machine decides how it reaches them, the screen or the voice; the model only writes text"

COMMAND: |
  # the model writes text; the medium is the machine's business
  _t="{{text}}"
  printf '%s\n' "$_t"

ARGS:
  - {name: text, type: text, stdin: true}
