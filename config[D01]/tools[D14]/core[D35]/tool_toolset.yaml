id: "G026"
tool: "toolset"
date: "2026-10-17"
tags: ["plan", "shell", "file", "list"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "shows the COMPLETE list of the tour's tools (the active skill's palette, plus the permanent tools)"

COMMAND: |
  T="$(cfg path tools)/registry.yaml"
  W="${TMPDIR:-/tmp}/toolset.$$"
  skl_gate | grep -v '^$' | sort -u > "$W.names"
  awk -v NAMES="$W.names" '
    BEGIN { while ((getline n < NAMES) > 0) keep[n] = 1 }
    /^- id: /{ i = $3; f = ""; d = "" }
    /^  tool: /{ t = $2; gsub(/"/, "", t) }
    /^  family: /{ f = $2 }
    /^  doc: /{ d = $2 }
    /^  visible: /{ if (keep[t]) { gsub(/"/, "", d); gsub(/"/, "", f); printf "%s  %s  %s\n", i, t, (d == "" ? f : d) } }' "$T" > "$W"
  RC=0
  if [ -s "$W" ]; then cat "$W"; else printf '%s\n' "$(msg no_tool_for_this_turn)" >&2; RC=1; fi
  rm -f "$W" "$W.names"
  exit $RC

ARGS: []                    # no argument: this tool names itself
