id: "G026"
tool: "toolset"
date: "2026-10-17"
tags: ["plan", "shell", "file", "list"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "shows the COMPLETE list of the tour's tools (the active skill's palette, plus the permanent tools)"

COMMAND: |
  table_index || { printf 'FAULT no register\n' >&2 ; exit 1 ; }
  _names=$(skl_gate | grep -v '^$' | sort -u)
  _out=$(printf '%s\n' "$TABLE_INDEX" | awk -F'|' -v N="$_names" '
    BEGIN { n = split(N, a, "\n") ; for (i = 1 ; i <= n ; i++) if (a[i] != "") keep[a[i]] = 1 }
    keep[$2] { printf "%s  %s  %s\n", $1, $2, ($5 != "" ? $5 : $3) }')
  if [ -n "$_out" ]; then printf '%s\n' "$_out" ; else printf '%s\n' "$(msg no_tool_for_this_turn)" >&2 ; exit 1 ; fi

ARGS: []                    # no argument: this tool names itself
