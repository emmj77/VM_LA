id: "G072"
tool: "tunnel_provision"
date: "2026-10-20"
tags: ["manage", "shell", "text", "run"]

RULES:
  enabled: true
  timeout: 180
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "provisions the wireguard tunnel: server conf, phone profile, QR code, brings wg0 up (needs sudo -n)"

COMMAND: |
  A="{{public_address}}"
  [ -n "$A" ] || { printf '%s\n' "$(msg tunnel_public_missing)" >&2 ; exit 1 ; }
  case "$A" in
    *[!A-Za-z0-9.:-]*) printf '%s\n' "$(msg tunnel_public_bad "$A")" >&2 ; exit 1 ;;
  esac
  [ -x "$HERE/tunnel.sh" ] || { printf '%s\n' "$(msg tunnel_brick_missing "$HERE/tunnel.sh")" >&2 ; exit 1 ; }
  sudo -n true 2>/dev/null || { printf '%s\n' "$(msg tunnel_needs_sudo)" >&2 ; exit 1 ; }
  exec "$HERE/tunnel.sh" "$A"

ARGS:
  - {name: public_address, type: text, required: true}   # l adresse publique du poste, celle que le telephone appelle
