id: "G077"
tool: "free_terminal"
date: "2026-10-21"
tags: ["free_terminal", "debug", "free"]
RULES:
  enabled: true
  timeout: 600
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: write
DESCRIPTION: "a free shell on the host: the whole disk writable, and the calls that delete a name refused by the kernel (machine.free_terminal.deny). every command is logged."
COMMAND: |
  C="$*"; [ -n "$C" ] || C=$(cat); [ -n "$C" ] || { printf '%s\n' "$(msg empty_missing_command)" >&2; exit 1; }
  T=600
  DENY=$(cfg list machine.free_terminal.deny)
  ERR=$(cfg str machine.free_terminal.error)
  [ -n "$DENY" ] && [ -n "$ERR" ] || { printf '%s\n' "$(msg filter_missing)" >&2; exit 1; }
  F=""
  for s in $DENY; do F="$F -p SystemCallFilter=~$s"; done
  B=$(command -v bwrap) || { printf '%s\n' "$(msg bwrap_missing)" >&2; exit 1; }
  SR=$(command -v systemd-run) || { printf '%s\n' "$(msg unit_missing)" >&2; exit 1; }
  L="${LA_STATE:-$HOME/.la}/free_terminal.log"
  printf '{"ts":%s,"cmd":"%s"}\n' "$(date +%s)" "$(fs_json "$C")" >> "$L" 2>/dev/null
  "$SR" -q --user --pipe --wait --collect -p "RuntimeMaxSec=$T" $F -p "SystemCallErrorNumber=$ERR" \
    -- "$B" --bind / / --dev /dev --proc /proc -- /bin/sh -c "$C"
ARGS:
  - {name: command, type: text, stdin: true}
