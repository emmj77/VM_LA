id: "G033"
tool: "project_list"
date: "2026-10-17"
tags: ["project_list", "project"]

RULES:
  enabled: true
  timeout: 60
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "lists the projects : one name per line"

COMMAND: |
  D="$ROOT/projects"
  [ -d "$D" ] || { printf '%s\n' "$(msg no_project "$D")"; exit 0; }
  for f in "$D"/*/project.yml; do
    [ -f "$f" ] || continue
    sed -n 's/^project:[[:space:]]*//p' "$f" | head -n 1 | tr -d '"'
  done

ARGS: []
