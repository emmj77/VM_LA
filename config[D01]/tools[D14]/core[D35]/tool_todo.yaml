id: "G015"
tool: "todo"
date: "2026-10-17"
tags: ["todo"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "opens the plan in the active skill's PLAN: section ; the points arrive one per line"

COMMAND: |
  [ -n "{{name}}" ] || { printf '%s\n' "$(msg empty_name_todo_wants)" >&2; exit 1; }
  [ -n "{{goal}}" ] || { printf '%s\n' "$(msg empty_goal_todo_wants)" >&2; exit 1; }
  PB=$(cfg path plan 2>/dev/null) ; [ -n "$PB" ] && [ -x "$PB/plan.sh" ] || { printf '%s\n' "refused: the plan brick is missing (plan/plan.sh)" >&2 ; exit 1 ; }
  "$PB/plan.sh" todo "{{name}}" "{{goal}}"

ARGS:
  - {name: name, type: text}
  - {name: goal, type: text}
  - {name: points, type: text, stdin: true}
