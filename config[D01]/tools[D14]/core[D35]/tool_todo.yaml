id: "G015"
tool: "todo"
permanent: true
date: "2026-10-17"
tags: ["plan", "shell", "plan", "run"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "writes the plan of the agent: name, goal, and the steps separated by ; -- the first step opens in_progress, the others wait. 12 steps at most, 100 characters a step."

COMMAND: |
  [ -n "{{name}}" ] || { printf '%s\n' "$(msg empty_name_todo_wants)" >&2; exit 1; }
  [ -n "{{goal}}" ] || { printf '%s\n' "$(msg empty_goal_todo_wants)" >&2; exit 1; }
  [ -n "{{points}}" ] || { printf '%s\n' "$(msg empty_points_todo_wants)" >&2; exit 1; }
  PTS=$(printf '%s' "{{points}}" | tr ';' '\n')
  skl_plan_write "{{name}}" "{{goal}}" "$PTS"
  _rc=$?
  case $_rc in
    0) exit 0 ;;
    12) printf '%s\n' "$(msg refusals.plan_open_active_skill)" >&2 ; exit 1 ;;
    10) printf '%s\n' "$(msg refusals.plan_steps_bound "$(cfg num loop.plan_steps 12)")" >&2 ; exit 1 ;;
    11) printf '%s\n' "$(msg refusals.plan_line_bound "$(cfg num loop.plan_chars 100)")" >&2 ; exit 1 ;;
    *) printf '%s\n' "$(msg refusals.plan_file_missing)" >&2 ; exit 1 ;;
  esac

ARGS:
  - {name: name, type: text}
  - {name: goal, type: text}
  - {name: points, type: text}
