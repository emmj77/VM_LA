id: "G049"
tool: "update_big_todo"
date: "2026-10-17"
tags: ["plan", "shell", "animation", "project"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "moves the big plan of the loaded project: completed closes the open step and opens the next, in_progress keeps it. The last completed erases the plan: the PROJECT_PLAN section stays empty."

COMMAND: |
  ST="{{state}}"
  [ -n "$ST" ] || ST=completed
  skl_big_advance "$ST"
  _rc=$?
  case $_rc in
    0|9) exit 0 ;;
    2) printf '%s\n' "$(msg refusals.plan_state_unknown in_progress completed)" >&2 ; exit 1 ;;
    14) printf '%s\n' "$(msg refusals.big_plan_no_project)" >&2 ; exit 1 ;;
    5) printf '%s\n' "$(msg refusals.big_plan_missing)" >&2 ; exit 1 ;;
    *) exit 1 ;;
  esac

ARGS:
  - {name: state, type: text}
