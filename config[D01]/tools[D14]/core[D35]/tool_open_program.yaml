id: "G047"
tool: "open_program"
date: "2026-10-17"
tags: ["manage", "shell", "file", "open"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "opens a program that already exists and says what became of it"

COMMAND: |
  LC_ALL=C; export LC_ALL
  N="{{name}}"
  case "$N" in
    '') printf '%s\n' "$(msg program_open_must_be)" >&2 ; exit 1 ;;
  esac
  case "$N" in
    /*)
      case "$N" in *[!A-Za-z0-9/_.+-]*) printf '%s\n' "$(msg character_not_allowed_in_path "$N")" >&2 ; exit 1 ;; esac
      ;;
    *)
      case "$N" in *[!a-z0-9_.+-]*) printf '%s\n' "$(msg program_name_not_lowercase "$N")" >&2 ; exit 1 ;; esac
      ;;
  esac
  O=
  if command -v "$N" >/dev/null 2>&1; then
    O=$(command -v "$N")
  elif [ -x "$N" ] && [ ! -d "$N" ]; then
    O=$N
  else
    APPS="$HOME/Applications"
    if [ -d "$APPS" ]; then
      O=$(find "$APPS" -maxdepth 2 -name "$(basename -- "$N")*" -type f -perm -u+x 2>/dev/null | sort | head -n 1)
    fi
    if [ -z "$O" ]; then
      AP=$(find "$APPS" -maxdepth 2 -type f -perm -u+x 2>/dev/null | sed -n 's#.*/##p' | sort -u | head -n 12 | tr '\n' ' ')
      printf '%s\n' "$(msg program_not_found "$N" "$APPS")" >&2
      [ -n "$AP" ] && printf '%s\n' "$(msg applications_set_to "$AP")" >&2
      exit 1
    fi
  fi
  L="$STATE/ouvert.log"
  mkdir -p "$ROOT/work" 2>/dev/null
  : > "$L" 2>/dev/null
  setsid "$O" >"$L" 2>&1 </dev/null &
  PID=$!
  sleep 1
  if kill -0 "$PID" 2>/dev/null; then
    printf '%s\n' "$(msg process_opened)""$O" "$PID" "$L"
  else
    printf '%s\n' "$(msg opened_gave_hand_back)""$O"
    D=$(head -n 1 "$L" 2>/dev/null | cut -c1-160)
    [ -n "$D" ] && printf '%s\n' "$(msg machine_answer)""$D"
  fi

ARGS:
  - {name: name, type: text}
