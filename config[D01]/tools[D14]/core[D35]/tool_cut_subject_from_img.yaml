id: "G038"
tool: "cut_subject_from_img"
date: "2026-10-20"
tags: ["cut_subject_from_img", "matte", "u2net"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "cuts the subject out of an image and writes its alpha mask (PNG)"

COMMAND: |
  LC_ALL=C; export LC_ALL
  F="$W/{{source}}"; [ -f "$F" ] || F="$ROOT/{{source}}"
  O=""; [ -z "{{out}}" ] || O="$W/{{out}}"
  run_call vision.image "op=matte" "image=$F" "out=$O" "zone=0,0,0,0"

ARGS:
  - {name: source, type: path}
  - {name: out, type: path}
