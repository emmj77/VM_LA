# keep the tools a request needs, by meaning. no python: curl, sqlite3, awk.
id: "G075"
tool: "tools.pick"
family: "core"
sub_family: "tools"
date: "2026-10-21"
tags: ["manage", "local", "file", "list"]
RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: write
DESCRIPTION: "Keeps the k tools a request needs, from a candidate list, by meaning"
COMMAND: |
  _f='{{candidates}}' ; _q='{{request}}' ; _k='{{k}}'
  [ -n "$_f" ] && [ -f "$_f" ] || { printf 'no such list: %s\n' "$_f" >&2; exit 1; }
  [ "$_k" -gt 0 ] 2>/dev/null || exit 0
  _all=$(wc -l < "$_f" | tr -d ' ')
  [ "$_all" -gt "$_k" ] || exit 0

  _db=$(cfg abs tool_vec) || exit 1
  _reg=$(cfg abs registry) || exit 1
  _h=$(cfg str models.host) || _h=127.0.0.1
  _p=$(cfg num models.port) || _p=8091
  _m=$(cfg str models.embed) || _m=local

  _qv=$(jq -n --arg t "$_q" --arg m "$_m" '{input: [$t], model: $m}' \
        | curl -s --max-time 30 -H 'Content-Type: application/json' -d @- \
               "http://$_h:$_p/v1/embeddings" 2>/dev/null \
        | jq -r '.data[0].embedding | map(tostring) | join(",")' 2>/dev/null)
  if [ -z "$_qv" ] || [ "$_qv" = "null" ]; then
    printf 'note: no vector for the request, every candidate goes through\n' >&2
    cat "$_f"
    exit 0
  fi

  _sc=$(tmpfile pick_sc) || exit 1
  : > "$_sc"
  _i=0
  while IFS= read -r _l; do
    _i=$((_i + 1))
    _key=${_l%%|*}
    _nm=$(table_field "$_reg" "$_key" tool 2>/dev/null)
    [ -n "$_nm" ] || _nm=$_key
    _vv=$(sqlite3 "$_db" "select vec from tool_vec where name='$_nm'" 2>/dev/null)
    if [ -n "$_vv" ]; then
      _s=$(awk -v a="$_qv" -v b="$_vv" 'BEGIN {
             n = split(a, A, ","); m = split(b, B, ",")
             if (n != m) { printf "-2"; exit }
             d = 0; na = 0; nb = 0
             for (i = 1; i <= n; i++) { d += A[i] * B[i]; na += A[i] * A[i]; nb += B[i] * B[i] }
             printf "%.9f", d / (sqrt(na) * sqrt(nb) + 1e-9) }')
    else
      _s=-3
    fi
    printf '%s\t%s\n' "$_s" "$_i" >> "$_sc"
  done < "$_f"

  awk -F '\t' -v k="$_k" -v all="$_all" '
    NR == FNR { sc[FNR] = $1 + 0; idx[FNR] = $2 + 0; n = FNR; next }
    { line[FNR] = $0 }
    END {
      for (x = 1; x <= n; x++)
        for (y = x + 1; y <= n; y++)
          if (sc[y] > sc[x] || (sc[y] == sc[x] && idx[y] < idx[x])) {
            t = sc[x]; sc[x] = sc[y]; sc[y] = t
            t = idx[x]; idx[x] = idx[y]; idx[y] = t
          }
      c = 0
      for (x = 1; x <= n; x++) { if (sc[x] < -2.5) continue; if (c >= k) break; print line[idx[x]]; c++ }
      for (x = 1; x <= n; x++) { if (sc[x] >= -2.5) continue; if (c >= k) break; print line[idx[x]]; c++ }
      printf "preselection: %d of %d kept by meaning\n", c, all > "/dev/stderr"
    }
  ' "$_sc" "$_f"
ARGS:
  - {name: candidates, type: text}   # the list, one tool per line
  - {name: request, type: text}      # what the human asked
  - {name: k, type: num}             # how many to keep
