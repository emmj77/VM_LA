id: "G041"
tool: "read_language_of_text"
date: "2026-10-17"
tags: ["read_language_of_text", "langue", "fasttext", "filter"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "tells the language of a text, with its confidence"

COMMAND: |
  LC_ALL=C; export LC_ALL
  command -v fasttext >/dev/null 2>&1 || { printf '%s\n' "$(msg binary_missing 'fasttext')" >&2 ; exit 1 ; }
  MODEL="${LA_LID_MODEL:-${LA_GGUF_DIR:-$HOME/LLM_GGUF}/lid.176.ftz}"
  [ -f "$MODEL" ] || { printf '%s\n' "$(msg language_model_missing "$MODEL")" >&2 ; exit 1 ; }
  T=$(cat)
  [ -n "$(printf '%s' "$T" | tr -d '[:space:]')" ] || { printf '%s\n' "$(msg nothing_to_read)" >&2 ; exit 1 ; }
  printf '%s\n' "$T" | fasttext predict-prob "$MODEL" - 1 \
    | sed -e 's/^__label__//'

ARGS:
  - {name: text, type: text, stdin: true}
