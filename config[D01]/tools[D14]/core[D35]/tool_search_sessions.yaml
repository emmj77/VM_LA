id: "G029"
tool: "search_sessions"
date: "2026-10-17"
tags: ["search_sessions"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "searches the sessions body and returns the exchanges that carry the words"

COMMAND: |
  T=$(cat); [ -n "$T" ] || { printf '%s\n' "$(msg empty_question)" >&2; exit 1; }
  D=${LA_SESSIONS_DB:-$ROOT/config/sessions.db}
  [ -f "$D" ] || { printf '%s\n' "$(msg session_body_missing_d "$D")" >&2; exit 1; }
  _Q=$(printf '%s' "$T" | sed "s/'/''/g")
  sqlite3 "$D" "SELECT exchange || ' | ' || ts || ' | ' || role || ' | ' || substr(replace(content, char(10), ' '), 1, 200) FROM messages WHERE content LIKE '%$_Q%' ORDER BY id DESC LIMIT 20;" 2>/dev/null

ARGS:
  - {name: text, type: text, stdin: true}
