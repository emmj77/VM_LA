id: "G016"
tool: "update_todo"
date: "2026-10-17"
tags: ["plan", "shell", "animation", "update"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "moves the plan of the agent: completed closes the open step and opens the next; in_progress keeps it (the recall is pushed back). The last completed closes the plan, deletes its file and unloads the skill."

COMMAND: |
  ST="{{state}}"
  [ -n "$ST" ] || ST=completed
  skl_plan_advance "$ST"
  _rc=$?
  case $_rc in
    0) exit 0 ;;
    9) exit 0 ;;
    2) printf '%s\n' "$(msg refusals.plan_state_unknown in_progress completed)" >&2 ; exit 1 ;;
    4) printf '%s\n' "$(msg refusals.plan_is_closed)" >&2 ; exit 1 ;;
    *) printf '%s\n' "$(msg refusals.plan_file_missing)" >&2 ; exit 1 ;;
  esac

ARGS:
  - {name: state, type: text}
