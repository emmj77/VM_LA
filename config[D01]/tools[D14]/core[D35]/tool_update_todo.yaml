id: "G016"
tool: "update_todo"
date: "2026-10-17"
tags: ["update_todo", "plan"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "advances the plan of the skill : the CURRENT point is done (a call imposed by the engine may pass its state)"

COMMAND: |
  ST="{{state}}"
  [ -n "$ST" ] || ST=complete
  case "$ST" in
    progress|complete) ;;
    *) printf '%s\n' "$(msg unknown_state_st_progress "$ST")" >&2 ; exit 1 ;;
  esac
  PB=$(cfg path plan 2>/dev/null) ; [ -n "$PB" ] && [ -x "$PB/plan.sh" ] || { printf '%s\n' "refused: the plan brick is missing (plan/plan.sh)" >&2 ; exit 1 ; }
  "$PB/plan.sh" progress "$ST"

ARGS:
  - {name: state, type: text}
