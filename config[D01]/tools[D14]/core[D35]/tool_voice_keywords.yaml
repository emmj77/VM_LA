# id: G078
NAME: voice_keywords
tags: ["manage", "python", "config", "write"]
FAMILY: MANAGE
DESCRIPTION: "regenerates the microphone's keywords from the command list (voice: true) of the master file"
TIMEOUT: 120
APPROVAL: none
PATHS: write

COMMAND: |
  M="$LA_CONF"
  [ -f "$M" ] || { printf '%s\n' "refused: the master file is not in the tree ($M)" >&2 ; exit 1 ; }
  R=$(cfg str machine.kws.root) || exit 1
  P=$(cfg str machine.kws.python) || exit 1
  [ -f "$R/bpe.model" ] || { printf '%s\n' "refused: the kws model is missing ($R/bpe.model)" >&2 ; exit 1 ; }
  [ -x "$P" ] || { printf '%s\n' "refused: the python is missing ($P)" >&2 ; exit 1 ; }
  S=$(dirname "$(dirname "$M")")/programs[D10]/voice_keywords.py
  [ -f "$S" ] || { printf '%s\n' "refused: the generator is missing ($S)" >&2 ; exit 1 ; }
  "$P" "$S" "$M" "$R/bpe.model" "$(dirname "$M")/voice_keywords.txt"

ARGS: []                    # no argument: the command list of the master file is the source
