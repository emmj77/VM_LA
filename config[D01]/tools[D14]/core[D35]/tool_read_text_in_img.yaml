id: "G035"
tool: "read_text_in_img"
date: "2026-10-17"
tags: ["read_text_in_img", "ocr", "texte", "image"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "reads the TEXT of an image, character by character"

COMMAND: |
  LC_ALL=C; export LC_ALL
  F="$W/{{path}}"; [ -f "$F" ] || F="$ROOT/{{path}}"
  [ -f "$F" ] || { echo "refused: the image is missing ({{path}})" >&2 ; exit 1 ; }
  case "$F" in
    *.png|*.jpg|*.jpeg|*.webp|*.tif|*.tiff|*.bmp|*.pnm) ;;
    *) printf '%s\n' "$(msg image_type_not_read)" >&2 ; exit 1 ;;
  esac
  _I=$(cfg str machine.ocr.bin)
  [ -x "$_I" ] || { printf '%s\n' "$(msg indra_missing_machine)" >&2 ; exit 1 ; }
  T=$("$_I" "$F" --format text 2>/dev/null | sed -e 's/[[:space:]]*$//' -e '/^$/d')
  if [ -z "$T" ]; then
    printf '%s\n' "$(msg text_found_image_path)"
    exit 0
  fi
  printf '%s\n' "$T"

ARGS:
  - {name: path, type: path}
