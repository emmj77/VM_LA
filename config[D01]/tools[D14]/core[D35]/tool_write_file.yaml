id: "G004"
tool: "write_file"
permanent: true
date: "2026-10-17"
tags: ["write", "shell", "table", "write"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "writes a file inside writable_workspace (new, append, replace) and creates parent folders"

COMMAND: |
  C="{{path}}"
  [ -n "$C" ] || { printf '%s\n' "$(msg write_file_wants_path)" >&2; exit 1; }
  case "{{mode}}" in
    new)
      [ -e "$W/$C" ] && { printf '%s\n' "$(msg file_already_exists)""$C" >&2; exit 1; }
      # the folder law: a missing parent is made only when the armed skill opens subfolders
      _sa=$(head -n 1 -- "$(cfg abs skill_active)" 2>/dev/null)
      if [ ! -d "$(dirname -- "$W/$C")" ] && [ -n "$_sa" ] && [ "$(skill_rule create_subfolder)" != true ]; then
        printf '%s\n' "$(msg subfolder_refused)" >&2; exit 1
      fi
      mkdir -p -- "$(dirname "$W/$C")" 2>/dev/null || { printf '%s\n' "$(msg parent_directories_cannot_be)""$C" >&2; exit 1; }
      cat > "$W/$C"
      ;;
    append)
      [ -f "$W/$C" ] || { printf '%s\n' "$(msg file_missing)""$C" >&2; exit 1; }
      cat >> "$W/$C"
      ;;
    replace)
      [ -f "$W/$C" ] || { printf '%s\n' "$(msg file_missing)""$C" >&2; exit 1; }
      cat > "$W/$C"
      ;;
  esac

ARGS:
  - {name: path, type: path}
  - {name: mode, type: enum, values: [new, append, replace]}
  - {name: text, type: text, stdin: true}
