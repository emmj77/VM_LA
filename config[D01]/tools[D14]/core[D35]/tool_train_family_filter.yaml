id: "G043"
tool: "train_family_filter"
date: "2026-10-17"
tags: ["manage", "shell", "project", "run"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "trains the family filter (fastText) on the project corpus and reports the measure"

COMMAND: |
  LC_ALL=C; export LC_ALL
  F="$ROOT/config/filter/families.txt"
  [ -f "$F" ] || { printf '%s\n' "$(msg filter_corpus_missing "$F")" >&2 ; exit 1 ; }
  command -v fasttext >/dev/null 2>&1 || { printf '%s\n' "$(msg binary_missing 'fasttext')" >&2 ; exit 1 ; }
  D="$ROOT/config/filter"
  P="$D/clean.txt"
  grep -v '^[[:space:]]*#' "$F" | sed -e '/^[[:space:]]*$/d' > "$P" || { printf '%s\n' "$(msg corpus_failed)" >&2 ; exit 1 ; }
  N=$(wc -l < "$P" | tr -d ' ')
  [ "$N" -ge 40 ] || { printf '%s\n' "$(msg corpus_too_short "$N")" >&2 ; exit 1 ; }
  awk 'NR%4==0' "$P" > "$D/test_raw.txt" || { printf '%s\n' "$(msg corpus_failed)" >&2 ; exit 1 ; }
  awk 'NR%4!=0' "$P" > "$D/learned.txt" || { printf '%s\n' "$(msg corpus_failed)" >&2 ; exit 1 ; }
  sed -e 's/^__label__[A-Za-z]* //' "$D/test_raw.txt" > "$D/test.txt"
  sed -e 's/^\(__label__[A-Za-z]*\).*/\1/' "$D/test_raw.txt" > "$D/test_expected.txt"
  T0=$(date +%s%N)
  fasttext supervised -input "$D/learned.txt" -output "$D/family_test" -dim 10 -bucket 10000 \
    -epoch 50 -lr 0.5 -wordNgrams 2 -minCount 1 -thread 1 -verbose 0 \
    || { printf '%s\n' "$(msg fasttext_no_learn)" >&2 ; exit 1 ; }
  T1=$(date +%s%N)
  fasttext predict "$D/family_test.bin" "$D/test.txt" 1 > "$D/test_seen.txt" \
    || { printf '%s\n' "$(msg fasttext_no_judge)" >&2 ; exit 1 ; }
  T=$(wc -l < "$D/test.txt" | tr -d ' ')
  J=$(paste -d' ' "$D/test_expected.txt" "$D/test_seen.txt" | awk '$1 == $2' | wc -l | tr -d ' ')
  FAUX=$(paste -d'|' "$D/test.txt" "$D/test_expected.txt" "$D/test_seen.txt" \
    | awk -F'|' '$2 != $3 { a=$2 ; s=$3 ; sub(/^__label__/, "", a) ; sub(/^__label__/, "", s) ; printf " ; %s judge %s : %s", a, s, $1 }')
  fasttext supervised -input "$P" -output "$D/famille" -dim 10 -bucket 10000 \
    -epoch 50 -lr 0.5 -wordNgrams 2 -minCount 1 -thread 1 -verbose 0 \
    || { printf '%s\n' "$(msg fasttext_no_relearn)" >&2 ; exit 1 ; }
  T2=$(date +%s%N)
  WEIGHT=$(wc -c < "$D/family.bin" | tr -d ' ')
  CLASSES=$(sed -e 's/^\(__label__[A-Za-z]*\).*/\1/' "$P" | sort | uniq -c | awk '{ printf "%s %s | ", substr($2, 10), $1 }')
  printf '%s\n' "$(msg corpus_report_p)"\
    "$N" "$T" "$J" "$T" "$(((T1 - T0) / 1000000))" "$WEIGHT" "$CLASSES"
  [ -z "$FAUX" ] || printf '%s\n' "$(msg wrong_judgements)""$FAUX"

ARGS: []
