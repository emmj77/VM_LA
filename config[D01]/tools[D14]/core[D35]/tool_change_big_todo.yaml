id: "G050"
tool: "change_big_todo"
date: "2026-10-17"
tags: ["plan", "shell", "plan", "run"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "REWRITES the big plan of the project (it REPLACES every point) ; this one needs the user's validation"

COMMAND: |
  [ -n "{{name}}" ] || { printf '%s\n' "$(msg workstream_name_required)" >&2 ; exit 1 ; }
  [ -n "{{goal}}" ] || { printf '%s\n' "$(msg workstream_goal_required)" >&2 ; exit 1 ; }
  PB=$(cfg path plan 2>/dev/null) ; [ -n "$PB" ] && [ -x "$PB/plan.sh" ] || { printf '%s\n' "refused: the plan brick is missing (plan/plan.sh)" >&2 ; exit 1 ; }
  "$PB/plan.sh" big change "{{name}}" "{{goal}}"

ARGS:
  - {name: name, type: text}
  - {name: goal, type: text}
  - {name: points, type: text, stdin: true}
