id: "K017"
tool: "krita_ai_create_region"
date: "2026-10-18"
tags: ["krita", "krita_ai_create_region"]

RULES:
  enabled: true
  timeout: 180
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Create a new region linked to a freshly created (transparent) paint layer. Bypasses ai_diffusion's create_region heuristic — that one tries to link th"

COMMAND: |
  SERVICE=$(krita_url) || exit 1
  num() { case "$1" in ''|*[!0-9.-]*) printf 'null' ;; *) printf '%s' "$1" ;; esac; }
  tab() { case "$1" in '') printf 'null' ;; *) printf '%s' "$1" | jq -c . 2>/dev/null || printf 'null' ;; esac; }

  D=$(jq -cn \
    --arg positive "{{positive}}" \
    --arg group "{{group}}" \
    --arg name "{{name}}" \
    '{action:"ai_create_region", params:({ positive:$positive, group:(if $group=="" then null else $group=="true" end), name:$name } | with_entries(select(.value != null and .value != "")))}')
  REP=$(curl -sS --max-time 180 -H 'Content-Type: application/json' -d "$D" "$SERVICE/")
  printf '%s' "$REP" | jq -e '.status == "ok"' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$REP" | jq -r '.error.message // "reponse illisible de la machine"')" >&2; exit 1; }
  printf '%s\n' "$(printf '%s' "$REP" | jq -c .)"

ARGS:
  - {name: positive, type: text}
  - {name: group, type: bool}
  - {name: name, type: text}
