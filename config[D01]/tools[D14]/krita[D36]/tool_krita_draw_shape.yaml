id: "K041"
tool: "krita_draw_shape"
date: "2026-10-18"
tags: ["krita", "krita_draw_shape"]

RULES:
  enabled: true
  timeout: 180
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Draw a shape (rectangle, ellipse, line)"

COMMAND: |
  SERVICE=$(krita_url) || exit 1
  num() { case "$1" in ''|*[!0-9.-]*) printf 'null' ;; *) printf '%s' "$1" ;; esac; }
  tab() { case "$1" in '') printf 'null' ;; *) printf '%s' "$1" | jq -c . 2>/dev/null || printf 'null' ;; esac; }
  A_x=$(num "{{x}}")
  A_y=$(num "{{y}}")
  A_width=$(num "{{width}}")
  A_height=$(num "{{height}}")
  A_x2=$(num "{{x2}}")
  A_y2=$(num "{{y2}}")
  A_line_width=$(num "{{line_width}}")

  D=$(jq -cn \
    --arg shape "{{shape}}" \
    --argjson x "$A_x" \
    --argjson y "$A_y" \
    --argjson width "$A_width" \
    --argjson height "$A_height" \
    --arg fill "{{fill}}" \
    --arg stroke "{{stroke}}" \
    --argjson x2 "$A_x2" \
    --argjson y2 "$A_y2" \
    --argjson line_width "$A_line_width" \
    '{action:"draw_shape", params:({ shape:$shape, x:$x, y:$y, width:$width, height:$height, fill:(if $fill=="" then null else $fill=="true" end), stroke:(if $stroke=="" then null else $stroke=="true" end), x2:$x2, y2:$y2, line_width:$line_width } | with_entries(select(.value != null and .value != "")))}')
  REP=$(curl -sS --max-time 180 -H 'Content-Type: application/json' -d "$D" "$SERVICE/")
  printf '%s' "$REP" | jq -e '.status == "ok"' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$REP" | jq -r '.error.message // "unreadable answer"')" >&2; exit 1; }
  printf '%s\n' "$(printf '%s' "$REP" | jq -c .)"

ARGS:
  - {name: shape, type: text}
  - {name: x, type: int}
  - {name: y, type: int}
  - {name: width, type: int}
  - {name: height, type: int}
  - {name: fill, type: bool}
  - {name: stroke, type: bool}
  - {name: x2, type: int}
  - {name: y2, type: int}
  - {name: line_width, type: int}
