id: "K028"
tool: "krita_ai_set_control"
date: "2026-10-18"
tags: ["krita", "krita_ai_set_control"]

RULES:
  enabled: true
  timeout: 180
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Update mode and/or strength of an existing Control Layer"

COMMAND: |
  SERVICE=$(krita_url) || exit 1
  num() { case "$1" in ''|*[!0-9.-]*) printf 'null' ;; *) printf '%s' "$1" ;; esac; }
  tab() { case "$1" in '') printf 'null' ;; *) printf '%s' "$1" | jq -c . 2>/dev/null || printf 'null' ;; esac; }
  A_index=$(num "{{index}}")

  D=$(jq -cn \
    --argjson index "$A_index" \
    --arg mode "{{mode}}" \
    --arg strength "{{strength}}" \
    '{action:"ai_set_control", params:({ index:$index, mode:$mode, strength:$strength } | with_entries(select(.value != null and .value != "")))}')
  REP=$(curl -sS --max-time 180 -H 'Content-Type: application/json' -d "$D" "$SERVICE/")
  printf '%s' "$REP" | jq -e '.status == "ok"' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$REP" | jq -r '.error.message // "unreadable answer"')" >&2; exit 1; }
  printf '%s\n' "$(printf '%s' "$REP" | jq -c .)"

ARGS:
  - {name: index, type: int}
  - {name: mode, type: text}
  - {name: strength, type: text}
