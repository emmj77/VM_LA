id: "K030"
tool: "krita_ai_set_prompt"
date: "2026-10-18"
tags: ["krita", "krita", "turn", "set"]

RULES:
  enabled: true
  timeout: 180
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "ai_set_prompt"

COMMAND: |
  SERVICE=$(krita_url) || exit 1
  num() { case "$1" in ''|*[!0-9.-]*) printf 'null' ;; *) printf '%s' "$1" ;; esac; }
  tab() { case "$1" in '') printf 'null' ;; *) printf '%s' "$1" | jq -c . 2>/dev/null || printf 'null' ;; esac; }

  D=$(jq -cn \
    --arg positive "{{positive}}" \
    --arg negative "{{negative}}" \
    '{action:"ai_set_prompt", params:({ positive:$positive, negative:$negative } | with_entries(select(.value != null and .value != "")))}')
  REP=$(curl -sS --max-time 180 -H 'Content-Type: application/json' -d "$D" "$SERVICE/")
  printf '%s' "$REP" | jq -e '.status == "ok"' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$REP" | jq -r '.error.message // "unreadable answer"')" >&2; exit 1; }
  printf '%s\n' "$(printf '%s' "$REP" | jq -c .)"

ARGS:
  - {name: positive, type: text}
  - {name: negative, type: text}
