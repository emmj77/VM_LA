id: "K076"
tool: "krita_stroke"
date: "2026-10-18"
tags: ["krita", "krita_stroke"]

RULES:
  enabled: true
  timeout: 180
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Paint a stroke along points using pixel-level drawing with soft edges"

COMMAND: |
  SERVICE=$(krita_url) || exit 1
  num() { case "$1" in ''|*[!0-9.-]*) printf 'null' ;; *) printf '%s' "$1" ;; esac; }
  tab() { case "$1" in '') printf 'null' ;; *) printf '%s' "$1" | jq -c . 2>/dev/null || printf 'null' ;; esac; }
  A_points=$(tab "{{points}}")
  A_size=$(num "{{size}}")

  D=$(jq -cn \
    --argjson points "$A_points" \
    --argjson size "$A_size" \
    --arg hardness "{{hardness}}" \
    --arg opacity "{{opacity}}" \
    --arg pressure "{{pressure}}" \
    '{action:"stroke", params:({ points:$points, size:$size, hardness:$hardness, opacity:$opacity, pressure:$pressure } | with_entries(select(.value != null and .value != "")))}')
  REP=$(curl -sS --max-time 180 -H 'Content-Type: application/json' -d "$D" "$SERVICE/")
  printf '%s' "$REP" | jq -e '.status == "ok"' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$REP" | jq -r '.error.message // "reponse illisible de la machine"')" >&2; exit 1; }
  printf '%s\n' "$(printf '%s' "$REP" | jq -c .)"

ARGS:
  - {name: points, type: text}          # JSON : [[x,y], ...]
  - {name: size, type: int}
  - {name: hardness, type: text}
  - {name: opacity, type: text}
  - {name: pressure, type: text}
