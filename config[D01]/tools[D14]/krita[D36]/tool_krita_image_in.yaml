id: "K012"
tool: "krita_image_in"
date: "2026-10-17"
tags: ["krita", "krita_image_in"]

RULES:
  enabled: true
  timeout: 300
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "puts an image into a new layer of the open document"

COMMAND: |
  SERVICE=$(krita_url) || exit 1
  IMAGE="$W/{{image}}"
  [ -f "$IMAGE" ] || { printf '%s\n' "$(msg image_missing)""$IMAGE" >&2; exit 1; }
  NAME="{{name}}"
  [ -n "$NAME" ] || NAME=$(basename "$IMAGE")
  REP=$(curl -sS --max-time 240 -H 'Content-Type: application/json' \
    -d "$(jq -cn --arg p "$IMAGE" --arg n "$NAME" '{action:"import_image",params:{path:$p,name:$n}}')" "$SERVICE/")
  printf '%s' "$REP" | jq -e '.status == "ok"' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$REP" | jq -r '.error.message // "reponse illisible de la machine"')" >&2; exit 1; }
  printf '%s\n' "$(msg layer_image_set_x)""$NAME" "$(printf '%s' "$REP" | jq -r .width)" "$(printf '%s' "$REP" | jq -r .height)"

ARGS:
  - {name: image, type: path}                 # l'image, relative a l'espace du skill
  - {name: name, type: text}                  # le nom du calque neuf (vide : le nom du fichier)
