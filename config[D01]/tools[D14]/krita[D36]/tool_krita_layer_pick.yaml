id: "K005"
tool: "krita_layer_pick"
date: "2026-10-17"
tags: ["krita", "krita", "img", "run"]

RULES:
  enabled: true
  timeout: 40
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "makes one layer the active one (the one the other tools act on)"

COMMAND: |
  SERVICE=$(krita_url) || exit 1
  NAME="{{name}}"
  [ -n "$NAME" ] || { printf '%s\n' "$(msg layer_name_required)" >&2; exit 1; }
  REP=$(curl -sS --max-time 60 -H 'Content-Type: application/json' -d "$(jq -cn --arg n "$NAME" '{action:"select_layer",params:{name:$n}}')" "$SERVICE/")
  printf '%s' "$REP" | jq -e '.status == "ok"' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$REP" | jq -r '.error.message // "unreadable answer"')" >&2; exit 1; }
  printf '%s\n' "$(msg active_layer)""$(printf '%s' "$REP" | jq -r .name)"

ARGS:
  - {name: name, type: text}                   # the layer name
