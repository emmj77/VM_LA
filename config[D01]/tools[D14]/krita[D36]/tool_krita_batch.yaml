id: "K033"
tool: "krita_batch"
date: "2026-10-18"
tags: ["krita", "krita", "img", "run"]

RULES:
  enabled: true
  timeout: 180
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Execute multiple commands sequentially"

COMMAND: |
  SERVICE=$(krita_url) || exit 1
  num() { case "$1" in ''|*[!0-9.-]*) printf 'null' ;; *) printf '%s' "$1" ;; esac; }
  tab() { case "$1" in '') printf 'null' ;; *) printf '%s' "$1" | jq -c . 2>/dev/null || printf 'null' ;; esac; }

  D=$(jq -cn \
    --arg commands "{{commands}}" \
    --arg stop_on_error "{{stop_on_error}}" \
    '{action:"batch", params:({ commands:$commands, stop_on_error:(if $stop_on_error=="" then null else $stop_on_error=="true" end) } | with_entries(select(.value != null and .value != "")))}')
  REP=$(curl -sS --max-time 180 -H 'Content-Type: application/json' -d "$D" "$SERVICE/")
  printf '%s' "$REP" | jq -e '.status == "ok"' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$REP" | jq -r '.error.message // "unreadable answer"')" >&2; exit 1; }
  printf '%s\n' "$(printf '%s' "$REP" | jq -c .)"

ARGS:
  - {name: commands, type: text}
  - {name: stop_on_error, type: bool}
