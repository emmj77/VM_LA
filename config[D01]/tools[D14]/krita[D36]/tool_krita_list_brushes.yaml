id: "K052"
tool: "krita_list_brushes"
date: "2026-10-18"
tags: ["krita", "krita", "draw", "list"]

RULES:
  enabled: true
  timeout: 60
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "List available brush presets"

COMMAND: |
  SERVICE=$(krita_url) || exit 1
  num() { case "$1" in ''|*[!0-9.-]*) printf 'null' ;; *) printf '%s' "$1" ;; esac; }
  tab() { case "$1" in '') printf 'null' ;; *) printf '%s' "$1" | jq -c . 2>/dev/null || printf 'null' ;; esac; }
  A_limit=$(num "{{limit}}")

  D=$(jq -cn \
    --arg filter "{{filter}}" \
    --argjson limit "$A_limit" \
    '{action:"list_brushes", params:({ filter:$filter, limit:$limit } | with_entries(select(.value != null and .value != "")))}')
  REP=$(curl -sS --max-time 60 -H 'Content-Type: application/json' -d "$D" "$SERVICE/")
  printf '%s' "$REP" | jq -e '.status == "ok"' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$REP" | jq -r '.error.message // "unreadable answer"')" >&2; exit 1; }
  printf '%s\n' "$(printf '%s' "$REP" | jq -c .)"

ARGS:
  - {name: filter, type: text}
  - {name: limit, type: int}
