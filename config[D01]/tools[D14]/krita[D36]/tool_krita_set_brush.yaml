id: "K071"
tool: "krita_set_brush"
date: "2026-10-18"
tags: ["krita", "krita_set_brush"]

RULES:
  enabled: true
  timeout: 60
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Set brush preset and size"

COMMAND: |
  SERVICE=$(krita_url) || exit 1
  num() { case "$1" in ''|*[!0-9.-]*) printf 'null' ;; *) printf '%s' "$1" ;; esac; }
  tab() { case "$1" in '') printf 'null' ;; *) printf '%s' "$1" | jq -c . 2>/dev/null || printf 'null' ;; esac; }
  A_size=$(num "{{size}}")

  D=$(jq -cn \
    --arg preset "{{preset}}" \
    --argjson size "$A_size" \
    --arg opacity "{{opacity}}" \
    '{action:"set_brush", params:({ preset:$preset, size:$size, opacity:$opacity } | with_entries(select(.value != null and .value != "")))}')
  REP=$(curl -sS --max-time 60 -H 'Content-Type: application/json' -d "$D" "$SERVICE/")
  printf '%s' "$REP" | jq -e '.status == "ok"' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$REP" | jq -r '.error.message // "unreadable answer"')" >&2; exit 1; }
  printf '%s\n' "$(printf '%s' "$REP" | jq -c .)"

ARGS:
  - {name: preset, type: text}
  - {name: size, type: int}
  - {name: opacity, type: text}
