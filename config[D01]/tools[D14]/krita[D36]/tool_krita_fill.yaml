id: "K010"
tool: "krita_fill"
date: "2026-10-17"
tags: ["krita", "krita", "img", "run"]

RULES:
  enabled: true
  timeout: 300
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "fills the current selection on the active layer with a colour"

COMMAND: |
  SERVICE=$(krita_url) || exit 1
  COLOUR="{{color}}"
  case "$COLOUR" in
    '#'[0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F]) ;;
    *) printf '%s\n' "$(msg colour_written_rrggbb)""$COLOUR" >&2; exit 1 ;;
  esac
  REP=$(curl -sS --max-time 40 -H 'Content-Type: application/json' -d "$(jq -cn --arg c "$COLOUR" '{action:"set_color",params:{color:$c}}')" "$SERVICE/")
  printf '%s' "$REP" | jq -e '.status == "ok"' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$REP" | jq -r '.error.message // "unreadable answer"')" >&2; exit 1; }
  REP=$(curl -sS --max-time 180 -H 'Content-Type: application/json' -d '{"action":"fill_selection","params":{}}' "$SERVICE/")
  printf '%s' "$REP" | jq -e '.status == "ok"' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$REP" | jq -r '.error.message // "unreadable answer"')" >&2; exit 1; }
  printf 'rempli de %s\n' "$COLOUR"

ARGS:
  - {name: color, type: text}                  # the colour, #rrggbb
