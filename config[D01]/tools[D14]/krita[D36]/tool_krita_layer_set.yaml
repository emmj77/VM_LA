id: "K006"
tool: "krita_layer_set"
date: "2026-10-17"
tags: ["krita", "krita_layer_set"]

RULES:
  enabled: true
  timeout: 90
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "sets a layer's visibility, opacity or name"

COMMAND: |
  SERVICE=$(krita_url) || exit 1
  NAME="{{name}}"; WHAT="{{what}}"; VAL="{{value}}"
  case "$WHAT" in
    visibility)
      case "$VAL" in true|false) ;; *) printf '%s\n' "$(msg visible_must_be_true)""$VAL" >&2; exit 1 ;; esac
      D=$(jq -cn --arg n "$NAME" --argjson v "$VAL" '{action:"set_layer_visibility",params:{name:$n,visible:$v}}') ;;
    opacity)
      case "$VAL" in ''|*[!0-9.]*) printf '%s\n' "$(msg opacity_wants_number_0)""$VAL" >&2; exit 1 ;; esac
      D=$(jq -cn --arg n "$NAME" --argjson o "$VAL" '{action:"set_layer_opacity",params:{name:$n,opacity:$o}}') ;;
    rename)
      [ -n "$VAL" ] || { printf '%s\n' "$(msg new_name_required)" >&2; exit 1; }
      D=$(jq -cn --arg o "$NAME" --arg n "$VAL" '{action:"rename_layer",params:{old_name:$o,new_name:$n}}') ;;
    *) printf '%s\n' "$(msg op_must_be_visibility)""$WHAT" >&2; exit 1 ;;
  esac
  REP=$(curl -sS --max-time 40 -H 'Content-Type: application/json' -d "$D" "$SERVICE/")
  printf '%s' "$REP" | jq -e '.status == "ok"' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$REP" | jq -r '.error.message // "reponse illisible de la machine"')" >&2; exit 1; }
  printf '%s : %s\n' "$NAME" "$(printf '%s' "$REP" | jq -c .)"

ARGS:
  - {name: name, type: text}                   # le calque
  - {name: what, type: enum, values: [visibility, opacity, rename]}   # le reglage
  - {name: value, type: text}                  # true/false . un nombre de 0 a 1 . le nouveau nom
