id: "K023"
tool: "krita_ai_overview"
date: "2026-10-18"
tags: ["krita", "krita", "img", "run"]

RULES:
  enabled: true
  timeout: 180
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Consolidated AI Diffusion state in one round-trip: status + regions + controls + recent jobs + styles. Lets the client know exactly where it stands be"

COMMAND: |
  SERVICE=$(krita_url) || exit 1
  num() { case "$1" in ''|*[!0-9.-]*) printf 'null' ;; *) printf '%s' "$1" ;; esac; }
  tab() { case "$1" in '') printf 'null' ;; *) printf '%s' "$1" | jq -c . 2>/dev/null || printf 'null' ;; esac; }
  A_jobs_limit=$(num "{{jobs_limit}}")
  A_styles_limit=$(num "{{styles_limit}}")

  D=$(jq -cn \
    --argjson jobs_limit "$A_jobs_limit" \
    --argjson styles_limit "$A_styles_limit" \
    '{action:"ai_overview", params:({ jobs_limit:$jobs_limit, styles_limit:$styles_limit } | with_entries(select(.value != null and .value != "")))}')
  REP=$(curl -sS --max-time 180 -H 'Content-Type: application/json' -d "$D" "$SERVICE/")
  printf '%s' "$REP" | jq -e '.status == "ok"' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$REP" | jq -r '.error.message // "unreadable answer"')" >&2; exit 1; }
  printf '%s\n' "$(printf '%s' "$REP" | jq -c .)"

ARGS:
  - {name: jobs_limit, type: int}
  - {name: styles_limit, type: int}
