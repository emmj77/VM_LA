# one step of the turn. it reads state/turn.json, does its work, writes it back.
id: "T005"
tool: "turn.reply"
date: "2026-10-20"
tags: ["turn", "reply"]
RULES:
  enabled: true
  timeout: 60
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: write
DESCRIPTION: "the words of the answer, on the stream and on the board"
COMMAND: |
  _tr() { printf '%s %s\n' "${1:-step}" "${2:-}" | run_call engine.trace "op=line" >/dev/null; }

  # la reponse est le texte rendu par l outil reply ; a defaut, le contenu du modele
  _r=$(jq -r '[.calls[] | select(.tool == "reply")] | last | .result | fromjson? | .result // empty' "$(cfg abs turn)" 2>/dev/null)
  # a defaut : ce que le modele a dit. certains ecrivent leur appel en texte : on en tire le texte
  if [ -z "$_r" ]; then
    _c=$(_turn_get '.reply_msg.content // ""')
    case $_c in
      *'"text"'*) _r=$(printf '%s' "$_c" | sed -n 's/.*"text"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p') ;;
      *) _r=$_c ;;
    esac
  fi
  [ -n "$_r" ] || _r=$(_turn_get '.reply_msg.reasoning // ""')
  printf '%s\n' "$_r" | write_atomic "$(cfg abs reply_stream)"
  printf '%s\n' "$_r"
  _tr reply "$(printf '%s' "$_r" | wc -c) bytes"
  # la reponse finale arme le sommeil automatique : 580 s, puis le timer reveille le modele (loi 1577)
  _as=$(cfg num loop.autosleep 580) || _as=580
  systemctl --user stop la-autosleep.timer >/dev/null 2>&1
  _c="'${LA_TOOL:-}' engine engine.turn 'text=reveil: le sommeil de $_as secondes est arrive a son terme'"
  systemd-run --user --unit=la-autosleep --on-active="${_as}s" \
    --timer-property=AccuracySec=1s --collect /bin/dash -c "$_c" >/dev/null 2>&1 \
    && _tr reply "sommeil auto ${_as}s arme"
  _d=$(cfg path state) && : > "$_d/watch.armed" 2>/dev/null
  exit 0



ARGS: []
