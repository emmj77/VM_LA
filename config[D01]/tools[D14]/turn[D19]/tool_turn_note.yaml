# one step of the turn. it reads state/turn.json, does its work, writes it back.
id: "T003"
tool: "turn.note"
date: "2026-10-20"
tags: ["manage", "local", "turn", "cut"]
RULES:
  enabled: true
  timeout: 60
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: write
DESCRIPTION: "the turn kept: memory, compaction, the cut"
COMMAND: |
  _tr() { printf '%s %s\n' "${1:-step}" "${2:-}" | run_call engine.trace "op=line" >/dev/null; }

  _f=$(cfg abs memory) || { printf 'FAULT no memory in the tree\n'; exit 0; }
  mkdir -p -- "$(dirname -- "$_f")" || exit 0
  # the answer is what the voice said, not the tool call that carried it
  _rs=$(cat "$(cfg path state)/reply.stream" 2>/dev/null | tr '\n' ' ' | cut -c1-600)
  _rc=$(jq -r '.reply_msg.content // ""' "$(cfg abs turn)" 2>/dev/null)
  [ -n "$_rc" ] || _rc=$_rs
  jq -c --arg rep "$_rc" '{id:.id,ts:.started,prompt:.prompt,reply:$rep,calls:(.calls|length),tokens:.tokens,skill:.skill,project:.project}' \
    "$(cfg abs turn)" >> "$_f" 2>/dev/null || { printf 'FAULT the memory refuses\n'; exit 0; }
  # compaction: the memory keeps the last notes, it is not an archive
  _keep=$(cfg num loop.memory_keep 500) || _keep=500
  _n=$(wc -l < "$_f" 2>/dev/null) || _n=0
  if [ "$_n" -gt "$_keep" ]; then
    _t=$(tmpfile memory) && tail -n "$_keep" "$_f" > "$_t" 2>/dev/null && mv -f -- "$_t" "$_f"
  fi
  # the model cache is purged except its head: only the head is replayed, one token
  # the server keeps the common prefix (the head) and drops the rest of the thread
  _head=$(jq -r '.messages[0].content // ""' "$(cfg abs turn)" 2>/dev/null | cut -c1-4000)
  if [ -n "$_head" ]; then
    _al=$(jq -r '.engine // "main"' "$(cfg abs turn)" 2>/dev/null)
    _m=$(cfg str "engines.$_al.model" 2>/dev/null) || _m=$(cfg str models.local 2>/dev/null)
    _h=$(cfg str models.host 127.0.0.1) || _h=127.0.0.1
    _pt=$(cfg num models.port 8091) || _pt=8091
    _lst=$(curl -sS -m 5 "http://$_h:$_pt/v1/models" 2>/dev/null)
    case "$_lst" in
    *"$_m"*) _local=1 ;;
    *)       _local=0 ;;
    esac
    # the purge concerns only the model served here
    if [ -n "$_m" ] && [ "$_local" = 1 ]; then
      jq -cn --arg m "$_m" --arg h "$_head" \
        '{model:$m,messages:[{role:"system",content:$h}],max_tokens:1,cache_prompt:true,stream:false}' \
        | curl -sS -m 20 -H 'Content-Type: application/json' -d @- \
            "http://$_h:$_pt/v1/chat/completions" >/dev/null 2>&1 \
        && _tr note "kv purge, la tete reste"
    fi
  fi
  # the kernel takes back the page cache of the residents: memory does not grow without end
  run_call engine.purge "op=all" >/dev/null 2>&1
  _turn_set '(.status = "done")'
  _tr note "turn closed"
  exit 0

ARGS: []
