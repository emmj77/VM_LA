# one step of the turn. it reads state/turn.json, does its work, writes it back.
id: "T004"
tool: "turn.prompt"
date: "2026-10-20"
tags: ["manage", "shell", "turn", "run"]
RULES:
  enabled: true
  timeout: 60
  writable_workspace: ""
  approval: none
  turn: doc
  count: false
  paths: write
DESCRIPTION: "the messages: the head first, then what the human asked"
COMMAND: |

  # the stable prefix: the head, zone by zone, in the order the config holds them
  _who=$(cfg str head.name "LA")
  _lang=$(cfg str head.language_response "french")
  # THE PROJECTS: their NAMES only, read from the machine. The summary is the
  # project's own, shown when it is loaded - never doubled here.
  _prj=""
  _pdir=$(ls -d "${LA_ROOT:-.}"/projects\[D*\] 2>/dev/null | head -n 1)
  if [ -n "$_pdir" ]; then
    for _f in "$_pdir"/*/project.yml; do
      [ -f "$_f" ] || continue
      _n=$(sed -n 's/^project:[[:space:]]*//p' "$_f" | head -n 1 | tr -d '"')
      [ -n "$_n" ] || continue
      _prj=$_prj$_n' '
    done
  fi
  _head=$(_flat | awk -F'\t' -v P="$_prj" '$1 ~ /^head\.[A-Z_]+\.[0-9]+$/ {
      z = $1; sub(/\.[0-9]+$/, "", z); sub(/^head\./, "", z)
      if (z != last) { printf "\n%s\n", z; last = z }
      if ($2 == "@PROJECTS@") { sub(/[ ]+$/, "", P); printf "%s\n", P; next }
      printf "%s\n", $2
    }')
  _sys=$(printf '%s, you answer in %s.%s' "$_who" "$_lang" "$_head")

  # the second head: an ORDER of ids held in la_config (head.second_order). the producers
  # live in engine/head_second.sh, one function per id. no section logic lives here: we
  # source the producers and call the function named by each id, in the config's order.
  _req=$(_turn_get '.prompt' 2>/dev/null)
  [ -n "$_req" ] || _req=${PROMPT:-}

  _second=$(
    _ed=$(cfg path engine) ; case $_ed in /*) ;; *) _ed="$LA_ROOT/$_ed" ;; esac
    . "$_ed/head_second.sh"
    _t=$(cfg abs turn) 2>/dev/null ; _t=${_t:-}
    for _s in $(cfg list head.second_order); do
      _fn="_sec_$_s"
      command -v "$_fn" >/dev/null 2>&1 && "$_fn"
    done
  )

  _sys=$(printf '%s\n\n%s' "$_sys" "$_second")
  _shf=$(cfg abs second_head 2>/dev/null)
  [ -n "$_shf" ] && printf '%s\n' "$_second" | write_atomic "$_shf" 2>/dev/null

  _u=$(_turn_get '.prompt')
  [ -n "$_u" ] || _u=${PROMPT:-}
  _msgs=$(jq -n --arg s "$_sys" --arg u "$_u" '[{role:"system",content:$s},{role:"user",content:$u}]')
  _turn_set_json '(.messages = $v)' "$_msgs"
  trace_line prompt "$(printf '%s' "$_u" | wc -c) bytes"
  exit 0

ARGS: []
