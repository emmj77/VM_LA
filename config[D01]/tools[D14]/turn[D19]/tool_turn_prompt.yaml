# one step of the turn. it reads state/turn.json, does its work, writes it back.
id: "T004"
tool: "turn.prompt"
date: "2026-10-20"
tags: ["turn", "prompt"]
RULES:
  enabled: true
  timeout: 60
  writable_workspace: ""
  approval: none
  turn: doc
  count: false
  paths: write
DESCRIPTION: "the messages: the head first, then what the human asked"
COMMAND: |
  _tr() { printf '%s %s\n' "${1:-step}" "${2:-}" | run_call engine.trace "op=line" >/dev/null; }

  # the stable prefix: the head, zone by zone, in the order the config holds them
  _who=$(cfg str head.name "LA")
  _lang=$(cfg str head.language_response "french")
  # the projects are READ from the machine, never written in the master file
  _prj=""
  _pdir=$(ls -d "${LA_ROOT:-.}"/projects\[D*\] 2>/dev/null | head -n 1)
  if [ -n "$_pdir" ]; then
    for _f in "$_pdir"/*/project.yml; do
      [ -f "$_f" ] || continue
      _n=$(sed -n 's/^project:[[:space:]]*//p' "$_f" | head -n 1 | tr -d '"')
      [ -n "$_n" ] || continue
      _s=$(sed -n '/^SUMMARY:/,$p' "$_f" | sed -n 's/^[[:space:]]*101:[[:space:]]*//p' | head -n 1 | tr -d '"')
      _prj=$_prj$(printf '%s: %s|' "$_n" "${_s:-no summary}")
    done
  fi
  _head=$(_flat | awk -F'\t' -v P="$_prj" '$1 ~ /^head\.[A-Z_]+\.[0-9]+$/ {
      z = $1; sub(/\.[0-9]+$/, "", z); sub(/^head\./, "", z)
      if (z != last) { printf "\n%s\n", z; last = z }
      if ($2 == "@PROJECTS@") { sub(/\|+$/, "", P); gsub(/\|/, "\n", P); printf "%s\n", P; next }
      printf "%s\n", $2
    }')
  _sys=$(printf '%s, you answer in %s.%s' "$_who" "$_lang" "$_head")

  # the second head: what moves, after the stable prefix
  _req=$(_turn_get '.prompt' 2>/dev/null)
  [ -n "$_req" ] || _req=${PROMPT:-}
  _second=$(
    printf '== THE HUMAN ==\n'
    printf 'you are talking with the human (%s) ; the agent answering is %s\n' \
      "$(cfg str agents.human user)" "$(cfg str agents.main jarvis)"
    printf '== THE ACTIVE PROJECT ==\n'
    _pr=$(skl_project 2>/dev/null)
    if [ -n "$_pr" ]; then printf 'project : %s\n' "$_pr"; else printf 'no project loaded : every skill is reachable\n'; fi
    printf '== THE ACTIVE SKILL ==\n'
    _sk=$(skl_skill 2>/dev/null)
    if [ -n "$_sk" ]; then printf 'skill : %s\n' "$_sk"; else printf 'no skill loaded : no skill is active\n'; fi
    # nothing loaded: three likely skills, one bounded line, that is all
    if [ -z "$_sk" ] && [ -n "$_req" ]; then
      _fd=$(find "$(dirname "$(dirname "$LA_CONFIG")")" -maxdepth 1 -type d -name 'filter\[D*\]' -print 2>/dev/null | head -n 1)
      _fm="$_fd/skills.bin"
      if [ -r "$_fm" ]; then
        _pp=$(printf '%s\n' "$_req" | tr 'A-Z' 'a-z' | fasttext predict-prob "$_fm" - 3 2>/dev/null \
          | sed 's/__label__//g' \
          | awk '{ o = ""; for (i = 1; i <= NF; i += 2) o = o (i > 1 ? " · " : "") $i " " sprintf("%.2f", $(i+1)); print o }')
        [ -n "$_pp" ] && printf 'skills probables : %s\n' "$_pp"
      fi
    fi
    printf '== THE LOCAL MODEL SUMMARY ==\n'
    _sf=$(cfg abs second 2>/dev/null)
    _sm=""; _ex=none; _sy=none
    if [ -n "$_sf" ] && [ -f "$_sf" ]; then
      _sm=$(_flat "$_sf" | awk -F'\t' '$1 ~ /^summary\./ { print $2; exit }')
      _ex=$(_flat "$_sf" | awk -F'\t' '$1 == "exchanges" { print $2; exit }')
      _sy=$(_flat "$_sf" | awk -F'\t' '$1 == "stamp" { print $2; exit }')
    fi
    if [ -n "$_sm" ]; then
      printf 'exchanges %s ; written %s\n%s\n' "${_ex:-none}" "${_sy:-none}" "$_sm"
    else
      printf 'no summary yet\n'
    fi
    printf '== THE LOADED SKILL PLAN ==\n'
    _pl=$(plan_status 2>/dev/null | head -n 8)
    if [ -n "$_pl" ]; then printf '%s\n' "$_pl"; else printf 'no open plan\n'; fi
    printf '== THE STICKY NOTE ==\n'
    _sn=$(cfg abs note 2>/dev/null)
    if [ -n "$_sn" ] && [ -s "$_sn" ]; then head -c 1200 "$_sn"; printf '\n'; else printf 'the note is empty\n'; fi
    printf '== THE AGENTS ==\n'
    _main=$(cfg str agents.main jarvis)
    _st=$(jq -r '.status // "idle"' "$_t" 2>/dev/null)
    for _a in $(cfg str agents.names "$_main"); do
      if [ "$_a" = "$_main" ] && [ "$_st" = running ]; then
        printf '%s  active : a turn runs\n' "$_a"
      else
        printf '%s  idle : no turn runs\n' "$_a"
      fi
    done
    printf '== THE CHAT ==\n'
    _cf=$(cfg str agents.chat 2>/dev/null)
    case $_cf in ""|/*) ;; *) _cf="$LA_ROOT/$_cf" ;; esac
    if [ -n "$_cf" ] && [ -s "$_cf" ]; then
      grep '^{' "$_cf" | tail -n 6 | jq -r '(.from // "?") + " -> " + (.to // "?") + " : " + ((.body // "") | .[0:120])' 2>/dev/null
    else
      printf 'the chat is empty\n'
    fi
  )

  _sys=$(printf '%s\n\n%s' "$_sys" "$_second")
  _shf=$(cfg abs second_head 2>/dev/null)
  [ -n "$_shf" ] && printf '%s\n' "$_second" | write_atomic "$_shf" 2>/dev/null

  _u=$(_turn_get '.prompt')
  [ -n "$_u" ] || _u=${PROMPT:-}
  _msgs=$(jq -n --arg s "$_sys" --arg u "$_u" '[{role:"system",content:$s},{role:"user",content:$u}]')
  _turn_set_json '(.messages = $v)' "$_msgs"
  _tr prompt "$(printf '%s' "$_u" | wc -c) bytes"
  exit 0

ARGS: []
