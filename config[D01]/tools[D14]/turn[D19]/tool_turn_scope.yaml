# one step of the turn. it reads state/turn.json, does its work, writes it back.
id: "T006"
tool: "turn.scope"
date: "2026-10-20"
tags: ["manage", "local", "turn", "run"]
RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: toolset
  count: false
  paths: write
DESCRIPTION: "the tools of this turn and nothing more, as the provider wants them"
COMMAND: |

  _reg=$(cfg abs registry) || { printf 'FAULT no register\n'; exit 0; }
  _names=$(skl_gate | sort -u | grep -v '^$')
  _arr='[]'
  for _n in $_names; do
    [ -n "$_n" ] || continue
    _bd=""
    _fn=$(printf '%s' "$_n" | tr '.' '_')
    for _x in "$(cfg path tools)"/*/tool_"$_fn".yaml; do
      [ -f "$_x" ] && { _bd=$_x; break; }
    done
    [ -n "$_bd" ] || continue
    _d=$(_door_field "$_bd" DESCRIPTION)
    _props='{}'
    _req='[]'
    for _a in $(_door_decl "$_bd"); do
      _an=${_a%%:*}
      _at=${_a#*:}
      case $_at in int) _ty=integer ;; bool) _ty=boolean ;; *) _ty=string ;; esac
      _props=$(printf '%s' "$_props" | jq --arg k "$_an" --arg t "$_ty" '. + {($k): {type: $t}}')
      _req=$(printf '%s' "$_req" | jq --arg k "$_an" '. + [$k]')
    done
    _obj=$(jq -n --arg n "$_n" --arg d "$_d" --argjson pr "$_props" --argjson rq "$_req" \
      '{type:"function",function:{name:$n,description:$d,parameters:{type:"object",properties:$pr,required:$rq}}}')
    _arr=$(printf '%s' "$_arr" | jq --argjson o "$_obj" '. + [$o]')
  done
  # the reranker cuts the toolset: every tool is scored against the turn's request
  _n=$(printf '%s' "$_arr" | jq 'length')
  # the cut keeps the top of the ranking: 30% of the toolset, never fewer than three.
  # inside a closed plan it does not apply: the step's tool is not up for discussion.
  _pct=$(cfg num loop.share 30) || _pct=30
  _top=$(( (_n * _pct + 99) / 100 ))
  [ "$_top" -lt 3 ] && _top=3
  _closed=0
  [ -n "$(skl_lock)" ] && _closed=1
  if [ "$_closed" != 1 ] && [ "${_n:-0}" -gt "$_top" ]; then
    _q=$(jq -r '.prompt // ""' "$(cfg abs turn)" 2>/dev/null)
    _m=$(cfg str models.rerank) || _m=""
    _h=$(cfg str models.host 127.0.0.1)
    _pt=$(cfg num models.port 8091) || _pt=8091
    _t=$(cfg num limits.scope_timeout 10) || _t=10
    if [ -n "$_m" ] && [ -n "$_q" ]; then
      _body=$(printf '%s' "$_arr" | jq -c --arg m "$_m" --arg q "$_q" \
        '{model:$m,query:$q,documents:[.[] | (.function.name + " : " + (.function.description // ""))]}')
      _r=$(printf '%s' "$_body" | curl -sS -m "$_t" -H 'Content-Type: application/json' \
        -d @- "http://$_h:$_pt/v1/rerank" 2>/dev/null)
      _ix=$(printf '%s' "$_r" | jq -c --argjson k "$_top" \
        '.results | sort_by(-.relevance_score) | .[:$k] | map(.index)' 2>/dev/null)
      if [ -n "$_ix" ] && [ "$_ix" != "null" ]; then
        # the kept names, one by one, then the filter: every step is checked
        _names=""
        for _k in $(printf '%s' "$_ix" | jq -r '.[]' 2>/dev/null); do
          _nm=$(printf '%s' "$_arr" | jq -r --argjson q "$_k" '.[$q].function.name // empty' 2>/dev/null)
          [ -n "$_nm" ] && _names="$_names $_nm"
        done
        # only reply is untouchable: the loop must be able to say its word
        _names="$_names reply"
        _arr=$(printf '%s' "$_arr" | jq -c --arg n "$_names" \
          'map(select(.function.name as $x | ($n | split(" ") | index($x)) != null))' 2>/dev/null) || _arr=$_arr
      fi
    fi
  fi
  _turn_set_json '(.tools = $v)' "$_arr"
  trace_line scope "$(printf '%s' "$_arr" | jq 'length') of $_n tools"
  exit 0

ARGS: []
