# one step of the turn. it reads state/turn.json, does its work, writes it back.
id: "T008"
tool: "turn.tools"
date: "2026-10-20"
tags: ["manage", "shell", "turn", "run"]
RULES:
  enabled: true
  timeout: 300
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: write
DESCRIPTION: "every call the answer named, run through the door, then told back"
COMMAND: |

  _calls=$(_turn_get '.reply_msg.tool_calls // [] | length')
  [ "${_calls:-0}" -gt 0 ] 2>/dev/null || { trace_line tools none; exit 0; }
  _n=0
  while [ "$_n" -lt "$_calls" ]; do
    _name=$(_turn_get ".reply_msg.tool_calls[$_n].function.name")
    _args=$(_turn_get ".reply_msg.tool_calls[$_n].function.arguments")
    _cid=$(_turn_get ".reply_msg.tool_calls[$_n].id")
    # every value arrives as one word, apostrophes included: without that "la boucle marche" became "la"
    _pairs=$(printf '%s' "$_args" | jq -r 'to_entries[] | "\(.key)=\(.value | tostring)" | @sh' 2>/dev/null | tr '\n' ' ')
    # the call belongs to the model: the door reads it in the common register, not in the engine one
    _line=$(eval "LA_FROM=model run_call \"$_name\" $_pairs")
    _msgs=$(jq -n --arg cid "$_cid" --arg c "$_line" '[{role:"tool",tool_call_id:$cid,content:$c}]')
    _turn_set_json '(.messages = (.messages + $v))' "$_msgs"
    _cj=$(jq -n --arg n "$_name" --arg a "$_args" --arg r "$_line" '{tool:$n,args:$a,result:$r}')
    _turn_set_json '(.calls = (.calls + [$v]))' "$_cj"
    trace_line tool "$_name $(printf '%s' "$_args" | jq -r 'to_entries | map("\(.key)=\(.value|tostring)") | join(" ")' 2>/dev/null | head -c 120)"
    _n=$((_n + 1))
  done
  _turn_set '(.messages = (.messages + [{role: "assistant", content: (.reply_msg.content // "")}]))'
  exit 0

ARGS: []
