# kept for the callers that still name it. a route no longer needs it: the engine closes the
# step on the fact, at the call itself (engine/shell.sh -> skl_step_close). this tool is a note.
id: "T010"
tool: "turn.advance"
date: "2026-10-21"
tags: ["manage", "shell", "turn", "run"]
RULES:
  enabled: true
  timeout: 60
  writable_workspace: ""
  approval: none
  turn: advance
  count: false
  paths: read
DESCRIPTION: "a note: on a route the engine closes the step on the fact, at the call itself"
COMMAND: |
  _sk=$(skl_skill 2>/dev/null) || exit 0
  [ -n "$_sk" ] || exit 0
  if skl_plan_is_closed "$_sk" 2>/dev/null; then
    printf 'ok nothing to advance here: on a route the engine closes the step on the fact, at the call itself\n'
  fi
  exit 0

ARGS: []
