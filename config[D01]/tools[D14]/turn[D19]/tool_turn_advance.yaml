# one step of the turn, after the tools. the plan of the armed skill moves by itself:
# it reads what the step's tool returned, and moves the [progress] mark when the fact is there.
id: "T010"
tool: "turn.advance"
date: "2026-10-21"
tags: ["turn", "advance"]
RULES:
  enabled: true
  timeout: 60
  writable_workspace: ""
  approval: none
  turn: advance
  count: false
  paths: write
DESCRIPTION: "the step advances on a fact: the step's tool said ok, the file moved, the mark goes"
COMMAND: |

  _tr() { printf '%s %s\n' "${1:-step}" "${2:-}" | LA_FROM=engine run_call engine.trace op=line >/dev/null; }

  _sk=$(skl_skill 2>/dev/null) || exit 0
  [ -n "$_sk" ] || exit 0
  skl_plan_is_closed "$_sk" || exit 0
  _st=$(skl_plan_step "$_sk" 2>/dev/null) || exit 0
  _id=$(printf '%s' "$_st" | awk -F'\t' '{ print $1 }')
  _tool=$(printf '%s' "$_st" | awk -F'\t' '{ print $2 }')
  _bytes=$(printf '%s' "$_st" | awk -F'\t' '{ print $3 }')
  [ -n "$_tool" ] || { _tr step "advance: step $_id names no tool"; printf 'note step %s names no tool\n' "$_id"; exit 0; }

  # the fact: one call of THAT tool, status ok, and a result that starts with ok.
  # a body always exits 0, so status ok proves nothing about the work; the text does.
  # reply does not return "ok": its word IS the fact, and only answer closes a step.
  if [ "$_tool" = reply ]; then
    _n=$(jq -r '[ .calls[]? | select(.tool == "reply")
        | select((((.args | fromjson? // {}) | .mode) // "") == "answer") ] | length' \
        "$(cfg abs turn)" 2>/dev/null)
  else
    _n=$(jq -r --arg t "$_tool" '
      [ .calls[]? | select(.tool == $t)
        | (.result | fromjson? // empty)
        | select(.status == "ok")
        | select((.result // "") | test("^ok( |$)")) ] | length' "$(cfg abs turn)" 2>/dev/null)
  fi
  [ "${_n:-0}" -gt 0 ] 2>/dev/null || exit 0

  # the delta condition, when the line carries it: path@size, the size read when the step opened
  _after=""
  if [ -n "$_bytes" ]; then
    _p=${_bytes%@*}
    _s0=${_bytes#*@}
    case $_s0 in ''|*[!0-9]*) _s0="" ;; esac
    _pf=$(cfg here "$_p" 2>/dev/null)
    _s1=""
    [ -n "$_pf" ] && [ -f "$_pf" ] && _s1=$(wc -c < "$_pf" | tr -d ' ')
    if [ -z "$_s1" ]; then
      _tr step "advance: $_p cannot be read, step $_id stays open"
      printf 'BOUND the file %s cannot be read, the step stays open\n' "$_p"
      exit 0
    fi
    if [ -n "$_s0" ] && [ "$_s1" = "$_s0" ]; then
      _tr step "advance: no effect on $_p ($_s0 bytes), step $_id stays open"
      printf 'BOUND %s\n' "$(msg refusals.step_no_effect "$_p" "$_s0")"
      exit 0
    fi
    _after=$_s1
  fi

  # the move: the current line becomes done, the next one becomes progress and takes its mark
  _f="$(cfg path skills)/$_sk/skill.yaml"
  _t=$(tmpfile advance) || exit 0
  awk -v cur="$_id" -v aft="$_after" '
    function stamps(line, s,  R, seg, base) {
      if (!match(line, /--[ \t]*bytes:[ \t]*[^ ]+/)) return line
      R = RSTART
      seg = substr(line, RSTART, RLENGTH)
      base = seg
      sub(/@[0-9]*$/, "", base)
      return substr(line, 1, R - 1) base "@" s substr(line, R + RLENGTH)
    }
    /^PLAN:[ \t]*$/ { inplan = 1; print; next }
    inplan && /^[^ \t]/ { inplan = 0 }
    inplan && /^[ \t]*[0-9]+:/ {
      idp = $0
      sub(/^[ \t]*/, "", idp)
      id = idp
      sub(/:.*/, "", id)
      if (id == cur && !done) { sub(/\[progress\]/, "[done]", $0); print; done = 1; next }
      if (done && !taken && $0 ~ /\[todo\]/) {
        sub(/\[todo\]/, "[progress]", $0)
        if (aft != "") $0 = stamps($0, aft)
        taken = 1
        print
        next
      }
    }
    { print }
    END { exit (done ? 0 : 9) }' "$_f" > "$_t"
  if [ $? != 0 ] || [ ! -s "$_t" ]; then
    rm -f "$_t"
    _tr step "advance: step $_id is not in the plan of $_sk"
    printf 'FAULT the plan of %s carries no step %s\n' "$_sk" "$_id"
    exit 0
  fi
  if ! mv -f "$_t" "$_f"; then
    rm -f "$_t"
    printf 'FAULT the skill file of %s cannot be written\n' "$_sk"
    exit 0
  fi

  _left=$(grep -c '\[progress\]' "$_f" 2>/dev/null)
  case ${_left:-0} in ''|*[!0-9]*) _left=0 ;; esac
  if [ "$_left" = 0 ]; then
    _tr step "advance: the plan of $_sk is finished at step $_id"
    printf 'ok the plan of %s is finished at step %s\n' "$_sk" "$_id"
  else
    _tr step "advance: step $_id closed, the plan of $_sk moved on"
    printf 'ok step %s closed, the plan of %s moved on\n' "$_id" "$_sk"
  fi
  exit 0

ARGS: []
