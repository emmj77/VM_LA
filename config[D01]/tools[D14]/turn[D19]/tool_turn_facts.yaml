# one step of the turn. it reads state/turn.json, does its work, writes it back.
id: "T002"
tool: "turn.facts"
date: "2026-10-20"
tags: ["manage", "shell", "object", "run"]
RULES:
  enabled: true
  timeout: 60
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: write
DESCRIPTION: "the turn object, born before anything touches it"
COMMAND: |

  _id=$(date +%Y%m%d-%H%M%S)
  _al=$(cfg str active_engine)
  jq -n \
    --arg id "$_id" --arg p "${PROMPT:-}" --arg a "$(cfg str agents.main)" \
    --arg s "$(skl_skill 2>/dev/null)" --arg j "$(skl_project 2>/dev/null)" \
    --arg c "${LA_CHANNEL:-cli}" --arg i "${LA_INPUT:-text}" \
    --arg e "$_al" --arg m "$(cfg str "engines.$_al.model")" --argjson t "$(date +%s)" \
    '{id:$id,prompt:$p,agent:$a,skill:$s,project:$j,channel:$c,input:$i,engine:$e,model:$m,started:$t,
      status:"running",family:"agent",calls:[],tokens:0,reply:"",messages:[]}' |
    write_atomic "$(cfg abs turn)"
  # the turn opens the words: thinking.stream holds THIS turn, never the one before
  : > "$LA_STATE/thinking.stream"
  trace_line facts "$_id"
  exit 0

ARGS: []
