# the residents of the machine: the five that stay loaded, their state, their start and their stop
id: "E021"
tool: "engine.residents"
date: "2026-10-21"
tags: ["manage", "systemd", "process", "run"]
RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: write
DESCRIPTION: "the residents: their state, their start and their stop. they are permanent, asleep when idle, never unloaded"
COMMAND: |

  _op=${1:-status}
  _names="models asr tts"
  _each() {   # $1 = start|stop
    for _k in $_names; do
      _u=$(cfg str "units.$_k.unit" 2>/dev/null) || continue
      systemctl --user "$1" "$_u" 2>/dev/null
      printf '%s %s\n' "$1" "$_u"
    done
  }
  case $_op in
  status)
    _up=0; _n=0
    for _k in $_names; do
      _n=$((_n + 1))
      _u=$(cfg str "units.$_k.unit" 2>/dev/null) || continue
      if systemctl --user is-active --quiet "$_u" 2>/dev/null; then
        _up=$((_up + 1)); printf 'ok %s up\n' "$_u"
      else
        printf 'note %s down\n' "$_u"
      fi
    done
    printf 'note %s/%s unit(s) up\n' "$_up" "$_n"
    ;;
  up)     _each start ;;
  down)   _each stop ;;
  listen)
    # L OREILLE N EST PAS UN RESIDENT : elle s ouvre sur demande, et se referme pareil
    _k=$(cfg str units.kws.unit 2>/dev/null) || _k=""
    [ -n "$_k" ] || { printf 'FAULT units.kws.unit is not in the config\n'; exit 0; }
    if systemctl --user is-active --quiet "$_k" 2>/dev/null; then
      systemctl --user stop "$_k" 2>/dev/null; printf 'listen off\n'
    else
      systemctl --user start "$_k" 2>/dev/null; printf 'listen on\n'
    fi
    ;;
  toggle)
    _up=0
    for _k in $_names; do
      _u=$(cfg str "units.$_k.unit" 2>/dev/null) || continue
      systemctl --user is-active --quiet "$_u" 2>/dev/null && _up=$((_up + 1))
    done
    if [ "$_up" -gt 0 ]; then _each stop; else _each start; fi
    ;;
  *) printf 'FAULT unknown op %s\n' "$_op" ;;
  esac
  exit 0

ARGS:
  - {name: op, type: enum, values: status,up,down,toggle,listen}
