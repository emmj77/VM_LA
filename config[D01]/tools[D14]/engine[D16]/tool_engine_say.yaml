# an action of the engine. the model never sees it; the engine calls it by name.
id: "E018"
tool: "engine.say"
date: "2026-10-21"
tags: ["engine", "say"]
RULES:
  enabled: true
  timeout: 60
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: write
DESCRIPTION: "the queue of words: put one, take one, say it once, keep what was already said"
COMMAND: |

  _op=${1:-status}
  _q=$(cfg abs say_queue 2>/dev/null) || { printf 'FAULT no say queue in the tree\n'; exit 0; }
  _d=$(cfg abs say_done 2>/dev/null) || _d="${_q%.queue}.done"
  _in=$(cat)
  case $_op in
  put)
    printf '%s' "$_in" | tr '\n' ' ' | sed 's/[[:space:]]*$//' > "$_q.new" 2>/dev/null
    [ -s "$_q.new" ] || { gio trash -- "$_q.new" 2>/dev/null; printf 'FAULT put wants the words on the input\n'; exit 0; }
    cat "$_q" >> "$_q.new" 2>/dev/null
    mv -f "$_q.new" "$_q"
    printf 'ok the word is in the queue\n'
    ;;
  take)
    [ -s "$_q" ] || { printf 'note nothing waits to be said\n'; exit 0; }
    _p=$(head -n 1 "$_q")
    printf '%s\t%s\n' "$(date +%s)" "$_p" >> "$_d" 2>/dev/null
    tail -n +2 "$_q" > "$_q.new" 2>/dev/null && mv -f "$_q.new" "$_q"
    printf 'ok %s\n' "$_p"
    ;;
  said)
    [ -f "$_d" ] || { printf 'note nothing was said yet\n'; exit 0; }
    tail -n "${2:-10}" "$_d" 2>/dev/null | sed 's/^/ok /'
    ;;
  clear)
    [ -f "$_d" ] && gio trash -- "$_d" 2>/dev/null
    printf 'ok what was said is set aside\n'
    ;;
  status)
    _n=$(grep -c . "$_q" 2>/dev/null) || _n=0
    _m=$(grep -c . "$_d" 2>/dev/null) || _m=0
    printf 'ok %s waiting, %s said\n' "$_n" "$_m"
    ;;
  *) printf 'FAULT unknown op %s\n' "$_op" ;;
  esac
  exit 0

ARGS:
  - {name: op, type: enum, values: put,take,said,clear,status}
