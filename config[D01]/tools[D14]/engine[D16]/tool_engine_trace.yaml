# an action of the engine. the model never sees it; the engine calls it by name.
id: "E013"
tool: "engine.trace"
date: "2026-10-21"
tags: ["manage", "shell", "process", "trace"]
RULES:
  enabled: true
  timeout: 30
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: write
DESCRIPTION: "the living channel: write one line, or read the tail as reasoning and tools"
COMMAND: |

  _op=${1:-line}
  _f=$(cfg abs trace 2>/dev/null) || { printf 'FAULT no trace in the tree\n'; exit 0; }
  case $_op in
  line)
    _in=$(cat)
    [ -n "$_in" ] || { printf 'FAULT line wants kind and text on the input\n'; exit 0; }
    # one event, one line: the kind is the first word of the first line, the text keeps every word
    # (a multi-line text broke the field: awk read one kind per line, sed ate a word per line)
    _k=$(printf '%s' "$_in" | head -n 1 | awk '{ print $1 }')
    _t=$(printf '%s' "$_in" | tr '\n' ' ' | sed 's/^[^ ]*[ ]*//')
    printf '{"ts":%s,"kind":"%s","text":"%s"}\n' "$(date +%s)" "$(fs_json "$_k")" "$(fs_json "$_t")" >> "$_f"
    printf 'ok line written\n'
    ;;
  json)
    _n=$(cfg num limits.live_lines 40) || _n=40
    [ -f "$_f" ] || { printf '{"thinking":[],"journal":[],"reply":{}}\n'; exit 0; }
    # ONE TURN AT A TIME: the lines kept are those after the last "turn start", so the screen
    # never mixes the tools of yesterday with the tools of the turn being run.
    tail -n "$_n" "$_f" | jq -s '([to_entries[] | select(.value.kind == "turn" and .value.text == "start") | .key] | last) as $k
      | (if $k == null then . else .[$k + 1:] end)
      | {"thinking": [.[] | select(.kind == "think") | {ts, text}],
         "journal": [.[] | select(.kind == "tool" or .kind == "approve") | {ts, text}],
         "reply": {}}' 2>/dev/null || printf '{"thinking":[],"journal":[],"reply":{}}\n'
    ;;
  tail)
    tail -n "${2:-20}" "$_f" 2>/dev/null
    ;;
  *) printf 'FAULT unknown op %s\n' "$_op" ;;
  esac
  exit 0

ARGS:
  - {name: op, type: enum, values: line,json,tail}
