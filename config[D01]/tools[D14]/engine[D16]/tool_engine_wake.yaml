# an action of the engine. the model never sees it; the engine calls it by name.
id: "E026"
tool: "engine.wake"
date: "2026-10-21"
tags: ["manage", "shell", "process", "run"]
RULES:
  enabled: true
  timeout: 30
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: write
DESCRIPTION: "a wake opens a request: the event that woke the session is written where the loop reads it"
COMMAND: |

  _ev=$(printf '%s' "$(cat)" | tr '\n' ' ' | cut -c1-400)
  [ -n "$_ev" ] || { printf 'FAULT a wake wants the event that caused it\n'; exit 0; }
  _d=$(cfg path state) || { printf 'FAULT no state in the tree\n'; exit 0; }
  printf '%s\n' "$_ev" >> "$_d/request.txt" || { printf 'FAULT the request was not written\n'; exit 0; }
  trace_line wake "$_ev"
  printf 'ok the request is open: %s\n' "$_ev"
  exit 0

ARGS: []
