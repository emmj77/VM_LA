# an action of the engine. the model never sees it; the engine calls it by name.
id: "E010"
tool: "engine.spec"
date: "2026-10-20"
tags: ["manage", "shell", "process", "add"]
RULES:
  enabled: true
  timeout: 60
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write
DESCRIPTION: "the canon: add one law, or read it"
COMMAND: |

  _op=${1:-list}
  _f=$(canon_path 2>/dev/null) || { printf 'FAULT no canon: the armed project names none\n'; exit 0; }
  [ -f "$_f" ] || { printf 'FAULT the canon is not on the disk\n'; exit 0; }
  case $_op in
  list)
    _n=$(awk '/^SPEC:/ { f = 1 ; next } f && /^[^ \t]/ { f = 0 } f && /^    - / { n++ } END { print n + 0 }' "$_f")
    printf 'ok %s statement(s) in %s\n' "$_n" "${_f#$ROOT/}"
    awk '/^SPEC:/ { f = 1 ; next } f && /^[^ \t]/ { f = 0 } f && /^  [a-z_"]+:/ { k = $0 ; sub(/^  /, "", k) ; sub(/:.*/, "", k) ; pend = k ; next } f && pend != "" && /^    - / { printf "  %s\n", pend ; pend = "" }' "$_f"
    ;;
  add)
    _in=$(cat)
    _sec=$(printf '%s' "$_in" | awk '{ print $1 }')
    _txt=$(printf '%s' "$_in" | sed 's/^[^ ]*[ ]*//')
    [ -n "$_sec" ] && [ -n "$_txt" ] || { printf 'FAULT add wants the section then the statement, on the input\n'; exit 0; }
    [ "${#_txt}" -le 100 ] || { printf 'FAULT a statement takes 100 bytes at most\n'; exit 0; }
    _t=$(tmpfile spec) || exit 0
    awk -v sec="$_sec" -v txt="$_txt" '
      BEGIN { f = 0 ; placed = 0 }
      $0 ~ ("^  " sec ":") { f = 1 ; print ; next }
      f && /^  [^ ]/ { if (!placed) { printf "    - \"%s\"\n", txt ; placed = 1 } f = 0 }
      f && /^[^ ]/ { if (!placed) { printf "    - \"%s\"\n", txt ; placed = 1 } f = 0 }
      { print }
      END { if (!placed) exit 9 }
    ' "$_f" > "$_t" || { printf 'FAULT no section named %s\n' "$_sec"; exit 0; }
    [ -s "$_t" ] || { printf 'FAULT the build wrote nothing\n'; exit 0; }
    mv -f "$_t" "$_f" || { printf 'FAULT the write is impossible\n'; exit 0; }
    printf 'ok statement written in %s.%s\n' "${_f#$ROOT/}" "$_sec"
    ;;
  *) printf 'FAULT unknown op %s\n' "$_op" ;;
  esac
  exit 0

ARGS:
  - {name: op, type: enum, values: add,list}
