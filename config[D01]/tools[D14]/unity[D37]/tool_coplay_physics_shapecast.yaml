id: "U202"
tool: "coplay_physics_shapecast"
date: "2026-10-18"
tags: ["unity", "unity", "project", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Cast a shape (sphere, box, capsule) along..."

COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing_paths)" >&2; exit 1; }
  set -f
  set -- physics shapecast
  [ -n "{{shape}}" ] && set -- "$@" --shape "{{shape}}"
  [ -n "{{origin}}" ] && set -- "$@" --origin "{{origin}}"
  [ -n "{{direction}}" ] && set -- "$@" --direction "{{direction}}"
  [ -n "{{size}}" ] && set -- "$@" --size "{{size}}"
  [ -n "{{max_distance}}" ] && set -- "$@" --max-distance "{{max_distance}}"
  [ -n "{{dimension}}" ] && set -- "$@" --dimension "{{dimension}}"

  OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
  RC=$?
  [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
  printf '%s\n' "$OUT"

ARGS:
  - {name: shape, type: text}
  - {name: origin, type: text}
  - {name: direction, type: text}
  - {name: size, type: text}
  - {name: max_distance, type: text}
  - {name: dimension, type: text}
