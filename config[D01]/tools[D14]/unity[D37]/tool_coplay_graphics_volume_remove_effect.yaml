id: "U180"
tool: "coplay_graphics_volume_remove_effect"
date: "2026-10-18"
tags: ["unity", "coplay", "graphics"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Remove an effect from a Volume."

COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing_paths)" >&2; exit 1; }
  set -f
  set -- graphics volume-remove-effect
  [ -n "{{target}}" ] && set -- "$@" --target "{{target}}"
  [ -n "{{effect}}" ] && set -- "$@" --effect "{{effect}}"

  OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
  RC=$?
  [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
  printf '%s\n' "$OUT"

ARGS:
  - {name: target, type: text}
  - {name: effect, type: text}
