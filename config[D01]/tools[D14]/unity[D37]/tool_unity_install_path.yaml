id: "U353"
tool: "unity_install_path"
date: "2026-10-18"
tags: ["unity", "cli", "install-path"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Set or get the editor install path"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- install-path --no-banner --no-pager --non-interactive
  case "{{get}}" in ''|true|false) ;; *) printf '%s\n' "$(msg get_true_false)" >&2; exit 1 ;; esac

  [ -n "{{set}}" ] && set -- "$@" --set "{{set}}"
  [ "{{get}}" = true ] && set -- "$@" --get
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_install_path_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: set, type: text}   # Set the install path
  - {name: get, type: text}   # true pour poser --get ; Get the current install path
