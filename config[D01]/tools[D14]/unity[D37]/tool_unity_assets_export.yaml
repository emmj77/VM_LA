id: "U233"
tool: "unity_assets_export"
date: "2026-10-18"
tags: ["unity", "cli", "assets"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Export project assets to a .unitypackage"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- assets export --no-banner --no-pager --non-interactive
  T=$(printf '%s' "{{asset_path}}" | tr -d 'A-Za-z0-9_./ -')
  [ -z "$T" ] || { printf '%s\n' "$(msg asset_path_wants_space)" >&2; exit 1; }
  case "{{no_dependencies}}" in ''|true|false) ;; *) printf '%s\n' "$(msg dependencies_true_false)" >&2; exit 1 ;; esac

  [ -n "{{asset_path}}" ] && set -- "$@" {{asset_path}}
  [ -n "{{output}}" ] && set -- "$@" --output "{{output}}"
  [ -n "{{project}}" ] && set -- "$@" --project "{{project}}"
  [ "{{no_dependencies}}" = true ] && set -- "$@" --no-dependencies
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_assets_export_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: asset_path, type: text}   # several values separated by spaces
  - {name: output, type: text}   # Path of the .unitypackage file to write
  - {name: project, type: text}   # Project to export from (defaults to the current directory)
  - {name: no_dependencies, type: text}   # true to set --no-dependencies ; Export only the paths you name, and leave out the assets they depend o
