id: "U154"
tool: "coplay_build_platform"
date: "2026-10-18"
tags: ["unity", "coplay", "build"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Read or switch the active build platform."

COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing_paths)" >&2; exit 1; }
  set -f
  set -- build platform
  [ -n "{{target}}" ] || { printf '%s\n' "$(msg argument_required 'target' 'build platform')" >&2; exit 1; }
  [ -n "{{subtarget}}" ] && set -- "$@" --subtarget "{{subtarget}}"
  [ -n "{{target}}" ] && set -- "$@" "{{target}}"

  OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
  RC=$?
  [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
  printf '%s\n' "$OUT"

ARGS:
  - {name: subtarget, type: text}          # un de : player | server
  - {name: target, type: text}
