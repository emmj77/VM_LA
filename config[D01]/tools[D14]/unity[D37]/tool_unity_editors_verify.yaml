id: "U348"
tool: "unity_editors_verify"
date: "2026-10-18"
tags: ["unity", "unity", "project", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Structurally verify an installed editor — check its files and modules are present on disk"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- editors verify --no-banner --no-pager --non-interactive
  [ -n "{{version}}" ] || { printf '%s\n' "$(msg argument_required 'version' 'unity editors verify')" >&2; exit 1; }

  [ -n "{{version}}" ] && set -- "$@" "{{version}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_editors_verify_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: version, type: text}
