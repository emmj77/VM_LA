id: "U371"
tool: "unity_pipeline_automation_jobs_get"
date: "2026-10-18"
tags: ["unity", "unity", "project", "show"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Show one Pipeline Automation job"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- pipeline automation jobs get --no-banner --no-pager --non-interactive
  [ -n "{{job_id}}" ] || { printf '%s\n' "$(msg argument_required 'job_id' 'unity pipeline automation jobs get')" >&2; exit 1; }

  [ -n "{{job_id}}" ] && set -- "$@" "{{job_id}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_pipeline_automation_jobs_2)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: job_id, type: text}
