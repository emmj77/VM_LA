id: "U190"
tool: "coplay_physics_apply_force"
date: "2026-10-18"
tags: ["unity", "unity", "project", "apply"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Apply force to a Rigidbody."

COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing_paths)" >&2; exit 1; }
  set -f
  set -- physics apply-force
  [ -n "{{target}}" ] && set -- "$@" --target "{{target}}"
  [ -n "{{force}}" ] && set -- "$@" --force "{{force}}"
  [ -n "{{force_mode}}" ] && set -- "$@" --force-mode "{{force_mode}}"
  [ -n "{{dimension}}" ] && set -- "$@" --dimension "{{dimension}}"
  [ -n "{{torque}}" ] && set -- "$@" --torque "{{torque}}"
  [ -n "{{position}}" ] && set -- "$@" --position "{{position}}"

  OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
  RC=$?
  [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
  printf '%s\n' "$OUT"

ARGS:
  - {name: target, type: text}
  - {name: force, type: text}
  - {name: force_mode, type: text}
  - {name: dimension, type: text}
  - {name: torque, type: text}
  - {name: position, type: text}
