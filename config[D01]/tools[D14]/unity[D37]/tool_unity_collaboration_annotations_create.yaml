id: "U264"
tool: "unity_collaboration_annotations_create"
date: "2026-10-18"
tags: ["unity", "unity", "project", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Create a new annotation on a target"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- collaboration annotations create --no-banner --no-pager --non-interactive
  [ -n "{{target}}" ] || { printf '%s\n' "$(msg argument_required 'target' 'unity collaboration annotations create')" >&2; exit 1; }
  case "{{unresolve_root_annotation}}" in ''|true|false) ;; *) printf '%s\n' "$(msg unresolve_root_annotation_true)" >&2; exit 1 ;; esac

  [ -n "{{target}}" ] && set -- "$@" "{{target}}"
  [ -n "{{project_id}}" ] && set -- "$@" --project-id "{{project_id}}"
  [ -n "{{project_path}}" ] && set -- "$@" --project-path "{{project_path}}"
  [ -n "{{text}}" ] && set -- "$@" --text "{{text}}"
  [ -n "{{reply_to}}" ] && set -- "$@" --reply-to "{{reply_to}}"
  [ -n "{{status}}" ] && set -- "$@" --status "{{status}}"
  [ -n "{{metadata}}" ] && set -- "$@" --metadata "{{metadata}}"
  [ -n "{{target_context}}" ] && set -- "$@" --target-context "{{target_context}}"
  [ -n "{{camera}}" ] && set -- "$@" --camera "{{camera}}"
  [ -n "{{local_space}}" ] && set -- "$@" --local-space "{{local_space}}"
  [ -n "{{time}}" ] && set -- "$@" --time "{{time}}"
  [ -n "{{attachments}}" ] && set -- "$@" --attachments "{{attachments}}"
  [ "{{unresolve_root_annotation}}" = true ] && set -- "$@" --unresolve-root-annotation
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_collaboration_annotations_create)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: target, type: text}
  - {name: project_id, type: text}   # Unity Cloud project id
  - {name: project_path, type: text}   # Path to the Unity project (defaults to the current directory); used to
  - {name: text, type: text}   # Annotation text body
  - {name: reply_to, type: text}   # Parent annotation id to reply to (creates a reply, not a thread)
  - {name: status, type: text}   # Initial status
  - {name: metadata, type: text}   # Metadata as key=value pairs (repeat the flag)
  - {name: target_context, type: text}   # Target context as key=value pairs (repeat the flag)
  - {name: camera, type: text}   # Camera state as a JSON object (position, rotation, fieldOfView, target
  - {name: local_space, type: text}   # Local-space anchor as a JSON object (parentId, position, cameraPositio
  - {name: time, type: text}   # Playback time as a JSON object (timeScale, timeStamp)
  - {name: attachments, type: text}   # Attachments as a JSON array of attachment objects
  - {name: unresolve_root_annotation, type: text}   # true to set --unresolve-root-annotation ; When replying, unresolve the root annotation's thread
