id: "U343"
tool: "unity_editors_module_remove"
date: "2026-10-18"
tags: ["unity", "cli", "editors"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Remove installed modules from an editor"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- editors module remove --no-banner --no-pager --non-interactive
  [ -n "{{version}}" ] || { printf '%s\n' "$(msg argument_required 'version' 'unity editors module remove')" >&2; exit 1; }
  case "{{yes}}" in ''|true|false) ;; *) printf '%s\n' "$(msg yes_true_false)" >&2; exit 1 ;; esac

  [ -n "{{version}}" ] && set -- "$@" "{{version}}"
  [ -n "{{module}}" ] && set -- "$@" --module "{{module}}"
  [ -n "{{architecture}}" ] && set -- "$@" --architecture "{{architecture}}"
  [ "{{yes}}" = true ] && set -- "$@" --yes
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_editors_module_remove)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: version, type: text}
  - {name: module, type: text}   # Module ID(s) to remove
  - {name: architecture, type: text}   # Editor architecture (x86_64 or arm64)
  - {name: yes, type: text}   # true to set --yes ; Skip the confirmation prompt
