id: "U218"
tool: "coplay_probuilder_weld_vertices"
date: "2026-10-18"
tags: ["unity", "unity", "project", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Weld vertices within a proximity radius."

COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing_paths)" >&2; exit 1; }
  set -f
  set -- probuilder weld-vertices
  [ -n "{{target}}" ] || { printf '%s\n' "$(msg argument_required 'target' 'probuilder weld-vertices')" >&2; exit 1; }
  [ -n "{{vertices}}" ] && set -- "$@" --vertices "{{vertices}}"
  [ -n "{{radius}}" ] && set -- "$@" --radius "{{radius}}"
  [ -n "{{search_method}}" ] && set -- "$@" --search-method "{{search_method}}"
  [ -n "{{target}}" ] && set -- "$@" "{{target}}"

  OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
  RC=$?
  [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
  printf '%s\n' "$OUT"

ARGS:
  - {name: vertices, type: text}
  - {name: radius, type: text}
  - {name: search_method, type: text}          # one of: by_name | by_path | by_id | by_tag | by_layer
  - {name: target, type: text}
