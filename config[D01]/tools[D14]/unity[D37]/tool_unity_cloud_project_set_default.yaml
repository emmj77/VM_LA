id: "U261"
tool: "unity_cloud_project_set_default"
date: "2026-10-18"
tags: ["unity", "cli", "cloud"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Set the active default project for the active organization"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- cloud project set-default --no-banner --no-pager --non-interactive
  [ -n "{{id_or_name}}" ] || { printf '%s\n' "$(msg argument_required 'id_or_name' 'unity cloud project set-default')" >&2; exit 1; }

  [ -n "{{id_or_name}}" ] && set -- "$@" "{{id_or_name}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_cloud_project_set)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: id_or_name, type: text}
