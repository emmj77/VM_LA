id: "U329"
tool: "unity_doctor"
date: "2026-10-18"
tags: ["unity", "unity", "project", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Print diagnostic info about your Unity CLI environment"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- doctor --no-banner --no-pager --non-interactive
  case "{{ci}}" in ''|true|false) ;; *) printf '%s\n' "$(msg ci_true_false)" >&2; exit 1 ;; esac

  [ "{{ci}}" = true ] && set -- "$@" --ci
  [ -n "{{tail}}" ] && set -- "$@" --tail "{{tail}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_doctor_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: ci, type: text}   # true to set --ci ; Run preflight checks and exit non-zero when the environment cannot bui
  - {name: tail, type: text}   # Number of recent log lines to include (default: 20)
