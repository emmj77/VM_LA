id: "U396"
tool: "unity_projects_open"
date: "2026-10-18"
tags: ["unity", "cli", "projects"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Open a Unity project by name, fuzzy title match, or path"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- projects open --no-banner --no-pager --non-interactive
  case "{{wait}}" in ''|true|false) ;; *) printf '%s\n' "$(msg wait_true_false)" >&2; exit 1 ;; esac

  [ -n "{{pattern}}" ] && set -- "$@" "{{pattern}}"
  [ -n "{{editor_version}}" ] && set -- "$@" --editor-version "{{editor_version}}"
  [ -n "{{editor_path}}" ] && set -- "$@" --editor-path "{{editor_path}}"
  [ -n "{{architecture}}" ] && set -- "$@" --architecture "{{architecture}}"
  [ -n "{{build_target}}" ] && set -- "$@" --build-target "{{build_target}}"
  [ -n "{{build_target_group}}" ] && set -- "$@" --build-target-group "{{build_target_group}}"
  [ -n "{{args}}" ] && set -- "$@" --args "{{args}}"
  [ "{{wait}}" = true ] && set -- "$@" --wait
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_projects_open_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: pattern, type: text}   # facultatif
  - {name: editor_version, type: text}   # Override project Editor version (e.g. 2021.3.4f1)
  - {name: editor_path, type: text}   # Use this Unity Editor application path
  - {name: architecture, type: text}   # Editor architecture (x86_64 or arm64)
  - {name: build_target, type: text}   # Pass -buildTarget to Unity (e.g. StandaloneOSX)
  - {name: build_target_group, type: text}   # Pass -buildTargetGroup to Unity
  - {name: args, type: text}   # Extra arguments passed to Unity
  - {name: wait, type: text}   # true pour poser --wait ; Wait for the Editor to exit instead of returning right away
