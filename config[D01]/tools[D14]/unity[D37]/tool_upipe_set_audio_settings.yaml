id: "U118"
tool: "upipe_set_audio_settings"
date: "2026-10-18"
tags: ["unity", "pipeline", "set_audio_settings"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Change project Audio settings. Requires confirm=true; use dry_run to preview."

COMMAND: |
  PROJ=$(sed -n '1p' "$ROOT/projects/.active" 2>/dev/null | tr -d '\r')
  P=
  [ -n "$PROJ" ] && P=$(sed -n 's/^path:[[:space:]]*//p' "$ROOT/projects/$PROJ/project.yml" 2>/dev/null | head -1 | tr -d '"')
  [ -n "$P" ] || { printf '%s\n' "$(msg no_project_loaded)" >&2; exit 1; }
  case "$P" in /*) ;; *) P="$HOME/$P" ;; esac
  [ -d "$P" ] || { printf '%s\n' "$(msg project_missing '%s')""$P" >&2; exit 1; }
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  case "{{confirm}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean_in 'confirm' 'set_audio_settings')""{{confirm}}" >&2; exit 1 ;; esac
  case "{{dry_run}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean_in 'dry_run' 'set_audio_settings')""{{dry_run}}" >&2; exit 1 ;; esac
  set -- command --project-path "$P" set_audio_settings
  [ -n "{{settings}}" ] && set -- "$@" --settings "{{settings}}"
  [ -n "{{confirm}}" ] && set -- "$@" --confirm "{{confirm}}"
  [ -n "{{dry_run}}" ] && set -- "$@" --dry_run "{{dry_run}}"
  [ -n "{{volume}}" ] && set -- "$@" --volume "{{volume}}"
  [ -n "{{rolloffScale}}" ] && set -- "$@" --rolloffScale "{{rolloffScale}}"
  [ -n "{{dopplerFactor}}" ] && set -- "$@" --dopplerFactor "{{dopplerFactor}}"

  OUT=$(timeout 90 "$CLI" --no-banner --no-pager --non-interactive --format json "$@" </dev/null 2>&1)
  printf '%s' "$OUT" | jq -e '.success == true' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | jq -r '.errors[0].message // .errors[0].code // "reponse illisible du CLI"' 2>/dev/null || printf '%s' "$OUT")" >&2; exit 1; }
  printf '%s\n' "$OUT" | jq -c '.data'

ARGS:
  - {name: settings, type: text}
  - {name: confirm, type: text}          # true|false, vide pour ne rien poser
  - {name: dry_run, type: text}          # true|false, vide pour ne rien poser
  - {name: volume, type: text}
  - {name: rolloffScale, type: text}
  - {name: dopplerFactor, type: text}
