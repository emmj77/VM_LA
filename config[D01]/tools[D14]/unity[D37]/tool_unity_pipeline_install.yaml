id: "U379"
tool: "unity_pipeline_install"
date: "2026-10-18"
tags: ["unity", "cli", "pipeline"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Install the Unity Pipeline package to a Unity project"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- pipeline install --no-banner --no-pager --non-interactive
  case "{{force}}" in ''|true|false) ;; *) printf '%s\n' "$(msg force_true_false)" >&2; exit 1 ;; esac

  [ -n "{{project_path}}" ] && set -- "$@" --project-path "{{project_path}}"
  [ "{{force}}" = true ] && set -- "$@" --force
  [ -n "{{package_version}}" ] && set -- "$@" --package-version "{{package_version}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_pipeline_install_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: project_path, type: text}   # Path to Unity project (auto-detected if not specified)
  - {name: force, type: text}   # true to set --force ; Re-resolve and update the package to the latest version even if alread
  - {name: package_version, type: text}   # Install a specific version of the package (overwrites any version alre
