id: "U111"
tool: "upipe_save_prefab_contents"
date: "2026-10-18"
tags: ["unity", "unity", "project", "save"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Open a prefab asset in an isolated prefab stage, apply a declarative edit, and save it back (nested-prefab safe)."

COMMAND: |
  PROJ=$(sed -n '1p' "$ROOT/projects/.active" 2>/dev/null | tr -d '\r')
  P=
  [ -n "$PROJ" ] && P=$(sed -n 's/^path:[[:space:]]*//p' "$ROOT/projects/$PROJ/project.yml" 2>/dev/null | head -1 | tr -d '"')
  [ -n "$P" ] || { printf '%s\n' "$(msg no_project_loaded)" >&2; exit 1; }
  case "$P" in /*) ;; *) P="$HOME/$P" ;; esac
  [ -d "$P" ] || { printf '%s\n' "$(msg project_missing '%s')""$P" >&2; exit 1; }
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -n "{{prefab}}" ] || { printf '%s\n' "$(msg argument_required 'prefab' 'save_prefab_contents')" >&2; exit 1; }
  case "{{active}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean_in 'active' 'save_prefab_contents')""{{active}}" >&2; exit 1 ;; esac
  set -- command --project-path "$P" save_prefab_contents
  [ -n "{{prefab}}" ] && set -- "$@" --prefab "{{prefab}}"
  [ -n "{{rename_child}}" ] && set -- "$@" --rename_child "{{rename_child}}"
  [ -n "{{new_name}}" ] && set -- "$@" --new_name "{{new_name}}"
  [ -n "{{set_active_child}}" ] && set -- "$@" --set_active_child "{{set_active_child}}"
  [ -n "{{active}}" ] && set -- "$@" --active "{{active}}"

  OUT=$(timeout 90 "$CLI" --no-banner --no-pager --non-interactive --format json "$@" </dev/null 2>&1)
  printf '%s' "$OUT" | jq -e '.success == true' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | jq -r '.errors[0].message // .errors[0].code // "reponse illisible du CLI"' 2>/dev/null || printf '%s' "$OUT")" >&2; exit 1; }
  printf '%s\n' "$OUT" | jq -c '.data'

ARGS:
  - {name: prefab, type: text}
  - {name: rename_child, type: text}
  - {name: new_name, type: text}
  - {name: set_active_child, type: text}
  - {name: active, type: text}          # true|false, empty to set nothing
