id: "U404"
tool: "unity_projects_upgrade"
date: "2026-10-18"
tags: ["unity", "cli", "projects"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Upgrade a Unity project to a different editor version"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- projects upgrade --no-banner --no-pager --non-interactive
  case "{{yes}}" in ''|true|false) ;; *) printf '%s\n' "$(msg yes_true_false)" >&2; exit 1 ;; esac
  case "{{wait}}" in ''|true|false) ;; *) printf '%s\n' "$(msg wait_true_false)" >&2; exit 1 ;; esac

  [ -n "{{pathorname}}" ] && set -- "$@" "{{pathorname}}"
  [ -n "{{to}}" ] && set -- "$@" --to "{{to}}"
  [ "{{yes}}" = true ] && set -- "$@" --yes
  [ "{{wait}}" = true ] && set -- "$@" --wait
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_projects_upgrade_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: pathorname, type: text}   # facultatif
  - {name: to, type: text}   # Target Unity Editor version (e.g. 6000.0.30f1)
  - {name: yes, type: text}   # true pour poser --yes ; Skip confirmation prompt
  - {name: wait, type: text}   # true pour poser --wait ; Wait for the Editor to exit instead of returning right away
