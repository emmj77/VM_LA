id: "U297"
tool: "unity_collaboration_jira_project_update"
date: "2026-10-18"
tags: ["unity", "cli", "collaboration"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Update a Jira project configuration"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- collaboration jira project update --no-banner --no-pager --non-interactive
  [ -n "{{projectconfigid}}" ] || { printf '%s\n' "$(msg argument_required 'projectconfigid' 'unity collaboration jira project update')" >&2; exit 1; }
  case "{{clear_linked_unity_projects}}" in ''|true|false) ;; *) printf '%s\n' "$(msg clear_linked_unity_projects)" >&2; exit 1 ;; esac

  [ -n "{{projectconfigid}}" ] && set -- "$@" "{{projectconfigid}}"
  [ -n "{{organization_id}}" ] && set -- "$@" --organization-id "{{organization_id}}"
  [ -n "{{default_reporter_id}}" ] && set -- "$@" --default-reporter-id "{{default_reporter_id}}"
  [ -n "{{linked_unity_project_id}}" ] && set -- "$@" --linked-unity-project-id "{{linked_unity_project_id}}"
  [ "{{clear_linked_unity_projects}}" = true ] && set -- "$@" --clear-linked-unity-projects
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_collaboration_jira_project_3)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: projectconfigid, type: text}
  - {name: organization_id, type: text}   # Unity organization ID
  - {name: default_reporter_id, type: text}   # Jira account ID used as the fallback reporter when an annotation autho
  - {name: linked_unity_project_id, type: text}   # Unity project ID to link (repeatable; replaces the existing linked lis
  - {name: clear_linked_unity_projects, type: text}   # true pour poser --clear-linked-unity-projects ; Remove all linked Unity projects (sends an empty list; cannot be combi
