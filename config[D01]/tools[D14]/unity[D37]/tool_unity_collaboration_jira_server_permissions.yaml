id: "U300"
tool: "unity_collaboration_jira_server_permissions"
date: "2026-10-18"
tags: ["unity", "cli", "collaboration"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Check required Jira permissions for a server configuration"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- collaboration jira server permissions --no-banner --no-pager --non-interactive
  [ -n "{{serverconfigid}}" ] || { printf '%s\n' "$(msg argument_required 'serverconfigid' 'unity collaboration jira server permissions')" >&2; exit 1; }

  [ -n "{{serverconfigid}}" ] && set -- "$@" "{{serverconfigid}}"
  [ -n "{{organization_id}}" ] && set -- "$@" --organization-id "{{organization_id}}"
  [ -n "{{jira_project_id}}" ] && set -- "$@" --jira-project-id "{{jira_project_id}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_collaboration_jira_server_2)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: serverconfigid, type: text}
  - {name: organization_id, type: text}   # Unity organization ID
  - {name: jira_project_id, type: text}   # Jira project ID to check permissions in
