id: "U184"
tool: "coplay_material_create"
date: "2026-10-18"
tags: ["unity", "unity", "material", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Create a new material."

COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing_paths)" >&2; exit 1; }
  set -f
  set -- material create
  [ -n "{{path}}" ] || { printf '%s\n' "$(msg argument_required 'path' 'material create')" >&2; exit 1; }
  [ -n "{{shader}}" ] && set -- "$@" --shader "{{shader}}"
  [ -n "{{properties}}" ] && set -- "$@" --properties "{{properties}}"
  [ -n "{{path}}" ] && set -- "$@" "{{path}}"

  OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
  RC=$?
  [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
  printf '%s\n' "$OUT"

ARGS:
  - {name: shader, type: text}
  - {name: properties, type: text}
  - {name: path, type: text}
