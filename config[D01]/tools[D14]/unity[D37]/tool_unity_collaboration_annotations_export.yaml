id: "U267"
tool: "unity_collaboration_annotations_export"
date: "2026-10-18"
tags: ["unity", "cli", "collaboration"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Export all annotations on a project as JSON"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- collaboration annotations export --no-banner --no-pager --non-interactive
  case "{{resolve_users}}" in ''|true|false) ;; *) printf '%s\n' "$(msg resolve_users_true_false)" >&2; exit 1 ;; esac

  [ -n "{{project_id}}" ] && set -- "$@" --project-id "{{project_id}}"
  [ -n "{{project_path}}" ] && set -- "$@" --project-path "{{project_path}}"
  [ -n "{{target}}" ] && set -- "$@" --target "{{target}}"
  [ -n "{{out}}" ] && set -- "$@" --out "{{out}}"
  [ "{{resolve_users}}" = true ] && set -- "$@" --resolve-users
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_collaboration_annotations_export)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: project_id, type: text}   # Unity Cloud project id
  - {name: project_path, type: text}   # Path to the Unity project (defaults to the current directory); used to
  - {name: target, type: text}   # Restrict the export to a target path (default: the whole project)
  - {name: out, type: text}   # Write the JSON export to a file instead of stdout
  - {name: resolve_users, type: text}   # true pour poser --resolve-users ; Replace user IDs with display names
