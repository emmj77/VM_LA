id: "U335"
tool: "unity_editors_add"
date: "2026-10-18"
tags: ["unity", "cli", "editors"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Add an existing Unity editor to the Hub"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- editors add --no-banner --no-pager --non-interactive
  T=$(printf '%s' "{{path}}" | tr -d 'A-Za-z0-9_./ -')
  [ -z "$T" ] || { printf '%s\n' "$(msg path_wants_space_separated)" >&2; exit 1; }
  case "{{skip_signature_check}}" in ''|true|false) ;; *) printf '%s\n' "$(msg skip_signature_check_true)" >&2; exit 1 ;; esac

  [ -n "{{path}}" ] && set -- "$@" {{path}}
  [ "{{skip_signature_check}}" = true ] && set -- "$@" --skip-signature-check
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_editors_add_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: path, type: text}   # several values separated by spaces
  - {name: skip_signature_check, type: text}   # true to set --skip-signature-check ; Skip code-signature and bundle-ID checks (use for development builds)
