id: "U464"
tool: "coplay_graphics_volume"
date: "2026-10-17"
tags: ["unity", "unity", "process", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "a post-process volume: create | info (op picks which)"

COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing)" >&2; exit 1; }
  case "{{op}}" in
  create)
    set -f
    set -- graphics volume-create
    case "{{is_global}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean 'is_global')" >&2; exit 1 ;; esac
    [ -n "{{name}}" ] && set -- "$@" --name "{{name}}"
    [ "{{is_global}}" = true ] && set -- "$@" --global
    [ -n "{{weight}}" ] && set -- "$@" --weight "{{weight}}"
    [ -n "{{priority}}" ] && set -- "$@" --priority "{{priority}}"
    [ -n "{{profile_path}}" ] && set -- "$@" --profile-path "{{profile_path}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  info)
    set -f
    set -- graphics volume-info
    [ -n "{{target}}" ] && set -- "$@" --target "{{target}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  esac

ARGS:
  - {name: op, type: enum, values: [create, info]}
  - {name: name, type: text}
  - {name: priority, type: text}
  - {name: profile_path, type: text}
  - {name: target, type: text}
  - {name: weight, type: text}
  - {name: is_global, type: text}
