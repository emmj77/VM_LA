id: "U336"
tool: "unity_editors_default"
date: "2026-10-18"
tags: ["unity", "cli", "editors"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Show or set the default editor version used when no version is specified"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- editors default --no-banner --no-pager --non-interactive
  case "{{unset}}" in ''|true|false) ;; *) printf '%s\n' "$(msg unset_true_false)" >&2; exit 1 ;; esac

  [ -n "{{version}}" ] && set -- "$@" "{{version}}"
  [ "{{unset}}" = true ] && set -- "$@" --unset
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_editors_default_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: version, type: text}   # facultatif
  - {name: unset, type: text}   # true to set --unset ; Clear the stored default editor version
