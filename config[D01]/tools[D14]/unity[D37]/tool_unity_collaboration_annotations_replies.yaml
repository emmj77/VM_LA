id: "U270"
tool: "unity_collaboration_annotations_replies"
date: "2026-10-18"
tags: ["unity", "unity", "project", "list"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "List replies for a root annotation"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- collaboration annotations replies --no-banner --no-pager --non-interactive
  [ -n "{{annotationid}}" ] || { printf '%s\n' "$(msg argument_required 'annotationid' 'unity collaboration annotations replies')" >&2; exit 1; }
  case "{{all}}" in ''|true|false) ;; *) printf '%s\n' "$(msg all_true_false)" >&2; exit 1 ;; esac
  case "{{resolve_users}}" in ''|true|false) ;; *) printf '%s\n' "$(msg resolve_users_true_false)" >&2; exit 1 ;; esac
  case "{{full}}" in ''|true|false) ;; *) printf '%s\n' "$(msg full_true_false)" >&2; exit 1 ;; esac

  [ -n "{{annotationid}}" ] && set -- "$@" "{{annotationid}}"
  [ -n "{{project_id}}" ] && set -- "$@" --project-id "{{project_id}}"
  [ -n "{{project_path}}" ] && set -- "$@" --project-path "{{project_path}}"
  [ -n "{{next}}" ] && set -- "$@" --next "{{next}}"
  [ -n "{{limit}}" ] && set -- "$@" --limit "{{limit}}"
  [ "{{all}}" = true ] && set -- "$@" --all
  [ -n "{{sort}}" ] && set -- "$@" --sort "{{sort}}"
  [ -n "{{status_filter}}" ] && set -- "$@" --status-filter "{{status_filter}}"
  [ -n "{{fields}}" ] && set -- "$@" --fields "{{fields}}"
  [ "{{resolve_users}}" = true ] && set -- "$@" --resolve-users
  [ "{{full}}" = true ] && set -- "$@" --full
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_collaboration_annotations_replies)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: annotationid, type: text}
  - {name: project_id, type: text}   # Unity Cloud project id
  - {name: project_path, type: text}   # Path to the Unity project (defaults to the current directory); used to
  - {name: next, type: text}   # Pagination cursor from a previous response
  - {name: limit, type: text}   # Number of replies per page (1–100, default 10)
  - {name: all, type: text}   # true to set --all ; Fetch all replies
  - {name: sort, type: text}   # Sort order: Ascending or Descending (default Ascending)
  - {name: status_filter, type: text}   # Filter by status: All, Active, Sending, Draft (repeat flag for multipl
  - {name: fields, type: text}   # Comma-separated list of fields to display, or 'all' for every field (t
  - {name: resolve_users, type: text}   # true to set --resolve-users ; Replace user IDs with display names
  - {name: full, type: text}   # true to set --full ; Show reply text without truncation (whitespace, including line breaks,
