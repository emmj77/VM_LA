id: "U405"
tool: "unity_projects_verify"
date: "2026-10-18"
tags: ["unity", "cli", "projects"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Check a project for integrity problems that break a build, without launching the Editor"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- projects verify --no-banner --no-pager --non-interactive
  case "{{strict}}" in ''|true|false) ;; *) printf '%s\n' "$(msg strict_true_false)" >&2; exit 1 ;; esac

  [ -n "{{project}}" ] && set -- "$@" "{{project}}"
  [ "{{strict}}" = true ] && set -- "$@" --strict
  [ -n "{{check}}" ] && set -- "$@" --check "{{check}}"
  [ -n "{{expect_editor}}" ] && set -- "$@" --expect-editor "{{expect_editor}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_projects_verify_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: project, type: text}   # facultatif
  - {name: strict, type: text}   # true to set --strict ; Treat warnings as errors
  - {name: check, type: text}   # Run only these checks, comma-separated. Choices: META_MISSING, META_OR
  - {name: expect_editor, type: text}   # Editor version this project is expected to target, for the drift check
