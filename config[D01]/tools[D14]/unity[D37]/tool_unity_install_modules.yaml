id: "U352"
tool: "unity_install_modules"
date: "2026-10-18"
tags: ["unity", "cli", "install-modules"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Install or list modules for an installed editor (fully interactive when no arguments provided)"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- install-modules --no-banner --no-pager --non-interactive
  case "{{list}}" in ''|true|false) ;; *) printf '%s\n' "$(msg list_true_false)" >&2; exit 1 ;; esac
  case "{{all}}" in ''|true|false) ;; *) printf '%s\n' "$(msg all_true_false)" >&2; exit 1 ;; esac
  case "{{cm}}" in ''|true|false) ;; *) printf '%s\n' "$(msg cm_true_false)" >&2; exit 1 ;; esac
  case "{{no_cm}}" in ''|true|false) ;; *) printf '%s\n' "$(msg cm_true_false_2)" >&2; exit 1 ;; esac
  case "{{accept_eula}}" in ''|true|false) ;; *) printf '%s\n' "$(msg accept_eula_true_false)" >&2; exit 1 ;; esac
  case "{{dry_run}}" in ''|true|false) ;; *) printf '%s\n' "$(msg dry_run_true_false)" >&2; exit 1 ;; esac
  case "{{yes}}" in ''|true|false) ;; *) printf '%s\n' "$(msg yes_true_false)" >&2; exit 1 ;; esac
  case "{{reinstall}}" in ''|true|false) ;; *) printf '%s\n' "$(msg reinstall_true_false)" >&2; exit 1 ;; esac
  case "{{force}}" in ''|true|false) ;; *) printf '%s\n' "$(msg force_true_false)" >&2; exit 1 ;; esac
  case "{{no_elevate}}" in ''|true|false) ;; *) printf '%s\n' "$(msg elevate_true_false)" >&2; exit 1 ;; esac

  [ -n "{{editor_version}}" ] && set -- "$@" --editor-version "{{editor_version}}"
  [ -n "{{module}}" ] && set -- "$@" --module "{{module}}"
  [ "{{list}}" = true ] && set -- "$@" --list
  [ "{{all}}" = true ] && set -- "$@" --all
  [ -n "{{architecture}}" ] && set -- "$@" --architecture "{{architecture}}"
  [ "{{cm}}" = true ] && set -- "$@" --cm
  [ "{{no_cm}}" = true ] && set -- "$@" --no-cm
  [ "{{accept_eula}}" = true ] && set -- "$@" --accept-eula
  [ "{{dry_run}}" = true ] && set -- "$@" --dry-run
  [ "{{yes}}" = true ] && set -- "$@" --yes
  [ "{{reinstall}}" = true ] && set -- "$@" --reinstall
  [ "{{force}}" = true ] && set -- "$@" --force
  [ "{{no_elevate}}" = true ] && set -- "$@" --no-elevate
  [ -n "{{retries}}" ] && set -- "$@" --retries "{{retries}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_install_modules_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: editor_version, type: text}   # Version of the editor (interactive selection if omitted)
  - {name: module, type: text}   # Module IDs to install
  - {name: list, type: text}   # true pour poser --list ; List available modules for the editor
  - {name: all, type: text}   # true pour poser --all ; Install all available modules
  - {name: architecture, type: text}   # Editor architecture (x86_64 or arm64)
  - {name: cm, type: text}   # true pour poser --cm ; Install all child modules automatically
  - {name: no_cm, type: text}   # true pour poser --no-cm ; Do not install child modules automatically
  - {name: accept_eula, type: text}   # true pour poser --accept-eula ; Accept all module license agreements automatically
  - {name: dry_run, type: text}   # true pour poser --dry-run ; Print what would be downloaded without installing
  - {name: yes, type: text}   # true pour poser --yes ; Automatically select the first match without prompting
  - {name: reinstall, type: text}   # true pour poser --reinstall ; Reinstall modules that are already installed (repair)
  - {name: force, type: text}   # true pour poser --force ; Reinstall modules and skip confirmation prompts (implies --reinstall; 
  - {name: no_elevate, type: text}   # true pour poser --no-elevate ; Skip the elevated (UAC) install helper on Windows; the Editor installe
  - {name: retries, type: text}   # Retry a failed module download or validation this many times with back
