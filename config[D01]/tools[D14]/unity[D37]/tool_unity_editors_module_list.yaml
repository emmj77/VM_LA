id: "U341"
tool: "unity_editors_module_list"
date: "2026-10-18"
tags: ["unity", "cli", "editors"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "List available modules for an installed editor"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- editors module list --no-banner --no-pager --non-interactive
  [ -n "{{version}}" ] || { printf '%s\n' "$(msg argument_required 'version' 'unity editors module list')" >&2; exit 1; }

  [ -n "{{version}}" ] && set -- "$@" "{{version}}"
  [ -n "{{architecture}}" ] && set -- "$@" --architecture "{{architecture}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_editors_module_list)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: version, type: text}
  - {name: architecture, type: text}   # Editor architecture (x86_64 or arm64)
