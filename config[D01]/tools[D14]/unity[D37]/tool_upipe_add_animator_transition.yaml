id: "U004"
tool: "upipe_add_animator_transition"
date: "2026-10-18"
tags: ["unity", "pipeline", "add_animator_transition"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Add a transition between two states (or from AnyState/Entry, to Exit) on a layer, with optional conditions. Validates that the states exist and each condition's parameter exists and its mode matches t"

COMMAND: |
  PROJ=$(sed -n '1p' "$ROOT/projects/.active" 2>/dev/null | tr -d '\r')
  P=
  [ -n "$PROJ" ] && P=$(sed -n 's/^path:[[:space:]]*//p' "$ROOT/projects/$PROJ/project.yml" 2>/dev/null | head -1 | tr -d '"')
  [ -n "$P" ] || { printf '%s\n' "$(msg no_project_loaded)" >&2; exit 1; }
  case "$P" in /*) ;; *) P="$HOME/$P" ;; esac
  [ -d "$P" ] || { printf '%s\n' "$(msg project_missing '%s')""$P" >&2; exit 1; }
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -n "{{controller}}" ] || { printf '%s\n' "$(msg argument_required 'controller' 'add_animator_transition')" >&2; exit 1; }
  [ -n "{{fromState}}" ] || { printf '%s\n' "$(msg argument_required 'fromState' 'add_animator_transition')" >&2; exit 1; }
  [ -n "{{toState}}" ] || { printf '%s\n' "$(msg argument_required 'toState' 'add_animator_transition')" >&2; exit 1; }
  case "{{hasExitTime}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean_in 'hasExitTime' 'add_animator_transition')""{{hasExitTime}}" >&2; exit 1 ;; esac
  case "{{hasFixedDuration}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean_in 'hasFixedDuration' 'add_animator_transition')""{{hasFixedDuration}}" >&2; exit 1 ;; esac
  case "{{dry_run}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean_in 'dry_run' 'add_animator_transition')""{{dry_run}}" >&2; exit 1 ;; esac
  set -- command --project-path "$P" add_animator_transition
  [ -n "{{controller}}" ] && set -- "$@" --controller "{{controller}}"
  [ -n "{{layer}}" ] && set -- "$@" --layer "{{layer}}"
  [ -n "{{fromState}}" ] && set -- "$@" --fromState "{{fromState}}"
  [ -n "{{toState}}" ] && set -- "$@" --toState "{{toState}}"
  [ -n "{{conditions}}" ] && set -- "$@" --conditions "{{conditions}}"
  [ -n "{{hasExitTime}}" ] && set -- "$@" --hasExitTime "{{hasExitTime}}"
  [ -n "{{exitTime}}" ] && set -- "$@" --exitTime "{{exitTime}}"
  [ -n "{{duration}}" ] && set -- "$@" --duration "{{duration}}"
  [ -n "{{hasFixedDuration}}" ] && set -- "$@" --hasFixedDuration "{{hasFixedDuration}}"
  [ -n "{{dry_run}}" ] && set -- "$@" --dry_run "{{dry_run}}"

  OUT=$(timeout 90 "$CLI" --no-banner --no-pager --non-interactive --format json "$@" </dev/null 2>&1)
  printf '%s' "$OUT" | jq -e '.success == true' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | jq -r '.errors[0].message // .errors[0].code // "reponse illisible du CLI"' 2>/dev/null || printf '%s' "$OUT")" >&2; exit 1; }
  printf '%s\n' "$OUT" | jq -c '.data'

ARGS:
  - {name: controller, type: text}
  - {name: layer, type: int}
  - {name: fromState, type: text}
  - {name: toState, type: text}
  - {name: conditions, type: text}
  - {name: hasExitTime, type: text}          # true|false, vide pour ne rien poser
  - {name: exitTime, type: int}
  - {name: duration, type: text}
  - {name: hasFixedDuration, type: text}          # true|false, vide pour ne rien poser
  - {name: dry_run, type: text}          # true|false, vide pour ne rien poser
