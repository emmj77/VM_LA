id: "U459"
tool: "coplay_graphics_bake_create"
date: "2026-10-17"
tags: ["coplay_graphics_bake_create"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "lightmap probes: probes | reflection (op picks which)"

COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing)" >&2; exit 1; }
  case "{{op}}" in
  probes)
    set -f
    set -- graphics bake-create-probes
    [ -n "{{name}}" ] && set -- "$@" --name "{{name}}"
    [ -n "{{spacing}}" ] && set -- "$@" --spacing "{{spacing}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  reflection)
    set -f
    set -- graphics bake-create-reflection
    [ -n "{{name}}" ] && set -- "$@" --name "{{name}}"
    [ -n "{{resolution}}" ] && set -- "$@" --resolution "{{resolution}}"
    [ -n "{{mode}}" ] && set -- "$@" --mode "{{mode}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  esac

ARGS:
  - {name: op, type: enum, values: [probes, reflection]}
  - {name: mode, type: text}
  - {name: name, type: text}
  - {name: resolution, type: int}
  - {name: spacing, type: text}
