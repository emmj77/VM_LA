id: "U222"
tool: "coplay_profiler_set_areas"
date: "2026-10-18"
tags: ["unity", "unity", "project", "set"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Toggle specific ProfilerAreas on or off."

COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing_paths)" >&2; exit 1; }
  set -f
  set -- profiler set-areas
  [ -n "{{area}}" ] && set -- "$@" --area "{{area}}"

  OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
  RC=$?
  [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
  printf '%s\n' "$OUT"

ARGS:
  - {name: area, type: text}
