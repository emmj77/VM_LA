id: "U419"
tool: "unity_vcs_blame"
date: "2026-10-18"
tags: ["unity", "cli", "vcs"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Show who last changed each GameObject and component in a scene or prefab"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- vcs blame --no-banner --no-pager --non-interactive
  [ -n "{{path}}" ] || { printf '%s\n' "$(msg argument_required 'path' 'unity vcs blame')" >&2; exit 1; }

  [ -n "{{path}}" ] && set -- "$@" "{{path}}"
  [ -n "{{at}}" ] && set -- "$@" --at "{{at}}"
  [ -n "{{object}}" ] && set -- "$@" --object "{{object}}"
  [ -n "{{field}}" ] && set -- "$@" --field "{{field}}"
  [ -n "{{max_revisions}}" ] && set -- "$@" --max-revisions "{{max_revisions}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_vcs_blame_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: path, type: text}
  - {name: at, type: text}   # Revision to blame (default: HEAD)
  - {name: object, type: text}   # Report only this object, by name or hierarchy path, and its components
  - {name: field, type: text}   # Report only the commit that last changed this serialized field
  - {name: max_revisions, type: text}   # How many revisions to walk before giving up
