id: "U387"
tool: "unity_projects_create"
date: "2026-10-18"
tags: ["unity", "unity", "project", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Create a new Unity project and register it in the Hub"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- projects create --no-banner --no-pager --non-interactive
  [ -n "{{name}}" ] || { printf '%s\n' "$(msg argument_required 'name' 'unity projects create')" >&2; exit 1; }
  case "{{open}}" in ''|true|false) ;; *) printf '%s\n' "$(msg open_true_false)" >&2; exit 1 ;; esac
  case "{{cloud}}" in ''|true|false) ;; *) printf '%s\n' "$(msg cloud_true_false)" >&2; exit 1 ;; esac
  case "{{no_cloud}}" in ''|true|false) ;; *) printf '%s\n' "$(msg cloud_true_false_2)" >&2; exit 1 ;; esac
  case "{{git_token_stdin}}" in ''|true|false) ;; *) printf '%s\n' "$(msg git_token_stdin_true)" >&2; exit 1 ;; esac
  case "{{no_initial_commit}}" in ''|true|false) ;; *) printf '%s\n' "$(msg initial_commit_true_false)" >&2; exit 1 ;; esac
  case "{{git_lfs}}" in ''|true|false) ;; *) printf '%s\n' "$(msg git_lfs_true_false)" >&2; exit 1 ;; esac

  [ -n "{{name}}" ] && set -- "$@" "{{name}}"
  [ -n "{{path}}" ] && set -- "$@" --path "{{path}}"
  [ -n "{{editor_version}}" ] && set -- "$@" --editor-version "{{editor_version}}"
  [ -n "{{template}}" ] && set -- "$@" --template "{{template}}"
  [ -n "{{architecture}}" ] && set -- "$@" --architecture "{{architecture}}"
  [ "{{open}}" = true ] && set -- "$@" --open
  [ "{{cloud}}" = true ] && set -- "$@" --cloud
  [ "{{no_cloud}}" = true ] && set -- "$@" --no-cloud
  [ -n "{{cloud_org}}" ] && set -- "$@" --cloud-org "{{cloud_org}}"
  [ -n "{{cloud_project}}" ] && set -- "$@" --cloud-project "{{cloud_project}}"
  [ -n "{{vcs}}" ] && set -- "$@" --vcs "{{vcs}}"
  [ -n "{{git_namespace}}" ] && set -- "$@" --git-namespace "{{git_namespace}}"
  [ -n "{{git_repo}}" ] && set -- "$@" --git-repo "{{git_repo}}"
  [ -n "{{git_visibility}}" ] && set -- "$@" --git-visibility "{{git_visibility}}"
  [ -n "{{git_default_branch}}" ] && set -- "$@" --git-default-branch "{{git_default_branch}}"
  [ -n "{{git_remote_protocol}}" ] && set -- "$@" --git-remote-protocol "{{git_remote_protocol}}"
  [ -n "{{git_description}}" ] && set -- "$@" --git-description "{{git_description}}"
  [ -n "{{git_token}}" ] && set -- "$@" --git-token "{{git_token}}"
  [ "{{git_token_stdin}}" = true ] && set -- "$@" --git-token-stdin
  [ "{{no_initial_commit}}" = true ] && set -- "$@" --no-initial-commit
  [ "{{git_lfs}}" = true ] && set -- "$@" --git-lfs
  [ -n "{{vcs_region}}" ] && set -- "$@" --vcs-region "{{vcs_region}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_projects_create_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: name, type: text}
  - {name: path, type: text}   # Parent directory for the new project
  - {name: editor_version, type: text}   # Unity editor version (e.g. 6000.0.26f1, latest, lts)
  - {name: template, type: text}   # Template package name (e.g. com.unity.template.3d)
  - {name: architecture, type: text}   # Editor architecture (x86_64 or arm64)
  - {name: open, type: text}   # true to set --open ; Open the project in the Editor after creation
  - {name: cloud, type: text}   # true to set --cloud ; Enable Unity Cloud with a new project
  - {name: no_cloud, type: text}   # true to set --no-cloud ; Create the project without enabling Unity Cloud
  - {name: cloud_org, type: text}   # Organization for the Unity Cloud project (id or name); overrides UNITY
  - {name: cloud_project, type: text}   # Use an existing Unity Cloud project (id or name) instead of creating o
  - {name: vcs, type: text}   # Create and link a git repository: github, gitlab, or a self-hosted hos
  - {name: git_namespace, type: text}   # GitHub organization or GitLab group for the repository; defaults to th
  - {name: git_repo, type: text}   # Name for the remote repository; defaults to the project name
  - {name: git_visibility, type: text}   # Repository visibility: private, public, or internal (default private)
  - {name: git_default_branch, type: text}   # Default branch name for the new repository (default main)
  - {name: git_remote_protocol, type: text}   # Transport for the remote: https or ssh (default https)
  - {name: git_description, type: text}   # Description for the new repository
  - {name: git_token, type: text}   # Personal access token; overrides your Git credential manager (prefer -
  - {name: git_token_stdin, type: text}   # true to set --git-token-stdin ; Read the personal access token from stdin (CI-safe)
  - {name: no_initial_commit, type: text}   # true to set --no-initial-commit ; Skip the automatic initial commit and push
  - {name: git_lfs, type: text}   # true to set --git-lfs ; Initialize Git LFS before the first commit
  - {name: vcs_region, type: text}   # UVCS region for the organization's subscription (first use only).
