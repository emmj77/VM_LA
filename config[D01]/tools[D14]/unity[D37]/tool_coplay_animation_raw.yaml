id: "U152"
tool: "coplay_animation_raw"
date: "2026-10-18"
tags: ["unity", "coplay", "animation"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Execute any animation action directly."

COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing_paths)" >&2; exit 1; }
  set -f
  set -- animation raw
  [ -n "{{action}}" ] || { printf '%s\n' "$(msg argument_required 'action' 'animation raw')" >&2; exit 1; }
  [ -n "{{target}}" ] || { printf '%s\n' "$(msg argument_required 'target' 'animation raw')" >&2; exit 1; }
  [ -n "{{clip_path}}" ] && set -- "$@" --clip-path "{{clip_path}}"
  [ -n "{{extra_params}}" ] && set -- "$@" --params "{{extra_params}}"
  [ -n "{{search_method}}" ] && set -- "$@" --search-method "{{search_method}}"
  [ -n "{{action}}" ] && set -- "$@" "{{action}}"
  [ -n "{{target}}" ] && set -- "$@" "{{target}}"

  OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
  RC=$?
  [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
  printf '%s\n' "$OUT"

ARGS:
  - {name: clip_path, type: text}
  - {name: extra_params, type: text}
  - {name: search_method, type: text}          # un de : by_id | by_name | by_path
  - {name: action, type: text}
  - {name: target, type: text}
