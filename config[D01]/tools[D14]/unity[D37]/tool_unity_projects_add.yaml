id: "U383"
tool: "unity_projects_add"
date: "2026-10-18"
tags: ["unity", "cli", "projects"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Register existing Unity project folders in the Hub registry"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- projects add --no-banner --no-pager --non-interactive
  T=$(printf '%s' "{{paths}}" | tr -d 'A-Za-z0-9_./ -')
  [ -z "$T" ] || { printf '%s\n' "$(msg paths_wants_space_separated)" >&2; exit 1; }

  [ -n "{{paths}}" ] && set -- "$@" {{paths}}
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_projects_add_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: paths, type: text}   # plusieurs valeurs separees par des espaces
