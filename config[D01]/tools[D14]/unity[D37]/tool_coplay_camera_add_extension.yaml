id: "U156"
tool: "coplay_camera_add_extension"
date: "2026-10-18"
tags: ["unity", "unity", "scene", "add"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Add extension to CinemachineCamera."

COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing_paths)" >&2; exit 1; }
  set -f
  set -- camera add-extension
  [ -n "{{target}}" ] || { printf '%s\n' "$(msg argument_required 'target' 'camera add-extension')" >&2; exit 1; }
  [ -n "{{extension_type}}" ] || { printf '%s\n' "$(msg argument_required 'extension_type' 'camera add-extension')" >&2; exit 1; }
  [ -n "{{search_method}}" ] && set -- "$@" --search-method "{{search_method}}"
  [ -n "{{props}}" ] && set -- "$@" --props "{{props}}"
  [ -n "{{target}}" ] && set -- "$@" "{{target}}"
  [ -n "{{extension_type}}" ] && set -- "$@" "{{extension_type}}"

  OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
  RC=$?
  [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
  printf '%s\n' "$OUT"

ARGS:
  - {name: search_method, type: text}          # one of: by_id | by_name | by_path
  - {name: props, type: text}
  - {name: target, type: text}
  - {name: extension_type, type: text}
