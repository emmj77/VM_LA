id: "U468"
tool: "coplay_physics_configure"
date: "2026-10-17"
tags: ["coplay_physics_configure"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "a physics element: joint | material | rigidbody (op picks which)"

COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing)" >&2; exit 1; }
  case "{{op}}" in
  joint)
    set -f
    set -- physics configure-joint
    [ -n "{{properties}}" ] || { printf '%s\n' "$(msg argument_required 'properties' 'physics configure-joint')" >&2; exit 1; }
    [ -n "{{target}}" ] && set -- "$@" --target "{{target}}"
    [ -n "{{joint_type}}" ] && set -- "$@" --joint-type "{{joint_type}}"
    [ -n "{{component_index}}" ] && set -- "$@" --component-index "{{component_index}}"
    [ -n "{{properties}}" ] && set -- "$@" "{{properties}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  material)
    set -f
    set -- physics configure-material
    [ -n "{{properties}}" ] || { printf '%s\n' "$(msg argument_required 'properties' 'physics configure-material')" >&2; exit 1; }
    [ -n "{{path}}" ] && set -- "$@" --path "{{path}}"
    [ -n "{{dimension}}" ] && set -- "$@" --dimension "{{dimension}}"
    [ -n "{{properties}}" ] && set -- "$@" "{{properties}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  rigidbody)
    set -f
    set -- physics configure-rigidbody
    [ -n "{{properties}}" ] || { printf '%s\n' "$(msg argument_required 'properties' 'physics configure-rigidbody')" >&2; exit 1; }
    [ -n "{{target}}" ] && set -- "$@" --target "{{target}}"
    [ -n "{{dimension}}" ] && set -- "$@" --dimension "{{dimension}}"
    [ -n "{{properties}}" ] && set -- "$@" "{{properties}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  esac

ARGS:
  - {name: op, type: enum, values: [joint, material, rigidbody]}
  - {name: properties, type: text}
  - {name: component_index, type: int}
  - {name: dimension, type: text}
  - {name: joint_type, type: text}
  - {name: path, type: text}
  - {name: target, type: text}
