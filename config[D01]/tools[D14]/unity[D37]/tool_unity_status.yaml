id: "U409"
tool: "unity_status"
date: "2026-10-18"
tags: ["unity", "cli", "status"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Show live state of every connected Unity Editor (port, project, version, PID, state)"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- status --no-banner --no-pager --non-interactive


  [ -n "{{port}}" ] && set -- "$@" --port "{{port}}"
  [ -n "{{project_path}}" ] && set -- "$@" --project-path "{{project_path}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_status_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: port, type: text}   # Filter to a single Editor instance on this port
  - {name: project_path, type: text}   # Filter by project path substring (case-insensitive)
