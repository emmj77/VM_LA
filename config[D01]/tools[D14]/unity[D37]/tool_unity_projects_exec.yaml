id: "U388"
tool: "unity_projects_exec"
date: "2026-10-18"
tags: ["unity", "cli", "projects"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Run a command in every registered project that matches the filters"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- projects exec --no-banner --no-pager --non-interactive
  T=$(printf '%s' "{{command}}" | tr -d 'A-Za-z0-9_./ -')
  [ -z "$T" ] || { printf '%s\n' "$(msg command_wants_space_separated)" >&2; exit 1; }
  case "{{continue_on_error}}" in ''|true|false) ;; *) printf '%s\n' "$(msg continue_error_true_false)" >&2; exit 1 ;; esac
  case "{{dry_run}}" in ''|true|false) ;; *) printf '%s\n' "$(msg dry_run_true_false)" >&2; exit 1 ;; esac

  [ -n "{{command}}" ] && set -- "$@" {{command}}
  [ -n "{{filter}}" ] && set -- "$@" --filter "{{filter}}"
  [ -n "{{parallel}}" ] && set -- "$@" --parallel "{{parallel}}"
  [ "{{continue_on_error}}" = true ] && set -- "$@" --continue-on-error
  [ "{{dry_run}}" = true ] && set -- "$@" --dry-run
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_projects_exec_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: command, type: text}   # several values separated by spaces
  - {name: filter, type: text}   # Only include projects matching this filter (repeatable, all must match
  - {name: parallel, type: text}   # How many projects to run at once (default: 1)
  - {name: continue_on_error, type: text}   # true to set --continue-on-error ; Keep going after a project fails instead of stopping the run
  - {name: dry_run, type: text}   # true to set --dry-run ; List the projects the command would run in, and run nothing
