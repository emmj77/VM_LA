id: "U127"
tool: "upipe_set_material_properties"
date: "2026-10-18"
tags: ["unity", "unity", "material", "set"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Set shader properties on a material (Float/Range/Int=number; Color=[r,g,b,a] or '#RRGGBBAA' hex; Vector=[x,y,z,w]; Texture=an object reference or null to clear), optionally reassign the shader, set th"

COMMAND: |
  PROJ=$(sed -n '1p' "$(cfg abs project_active)" 2>/dev/null | tr -d '\r')
  P=
  [ -n "$PROJ" ] && P=$(sed -n 's/^path:[[:space:]]*//p' "$(project_dir "$PROJ")/project.yml" 2>/dev/null | head -1 | tr -d '"')
  [ -n "$P" ] || { printf '%s\n' "$(msg no_project_loaded)" >&2; exit 1; }
  case "$P" in /*) ;; *) P="$HOME/$P" ;; esac
  [ -d "$P" ] || { printf '%s\n' "$(msg project_missing '%s')""$P" >&2; exit 1; }
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -n "{{material}}" ] || { printf '%s\n' "$(msg argument_required 'material' 'set_material_properties')" >&2; exit 1; }
  case "{{confirm}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean_in 'confirm' 'set_material_properties')""{{confirm}}" >&2; exit 1 ;; esac
  case "{{dry_run}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean_in 'dry_run' 'set_material_properties')""{{dry_run}}" >&2; exit 1 ;; esac
  set -- command --project-path "$P" set_material_properties
  [ -n "{{material}}" ] && set -- "$@" --material "{{material}}"
  [ -n "{{shader}}" ] && set -- "$@" --shader "{{shader}}"
  [ -n "{{properties}}" ] && set -- "$@" --properties "{{properties}}"
  [ -n "{{renderQueue}}" ] && set -- "$@" --renderQueue "{{renderQueue}}"
  [ -n "{{enableKeywords}}" ] && set -- "$@" --enableKeywords "{{enableKeywords}}"
  [ -n "{{disableKeywords}}" ] && set -- "$@" --disableKeywords "{{disableKeywords}}"
  [ -n "{{confirm}}" ] && set -- "$@" --confirm "{{confirm}}"
  [ -n "{{dry_run}}" ] && set -- "$@" --dry_run "{{dry_run}}"

  OUT=$(timeout 90 "$CLI" --no-banner --no-pager --non-interactive --format json "$@" </dev/null 2>&1)
  printf '%s' "$OUT" | jq -e '.success == true' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | jq -r '.errors[0].message // .errors[0].code // "reponse illisible du CLI"' 2>/dev/null || printf '%s' "$OUT")" >&2; exit 1; }
  printf '%s\n' "$OUT" | jq -c '.data'

ARGS:
  - {name: material, type: text}
  - {name: shader, type: text}
  - {name: properties, type: text}
  - {name: renderQueue, type: text}
  - {name: enableKeywords, type: text}
  - {name: disableKeywords, type: text}
  - {name: confirm, type: text}          # true|false, empty to set nothing
  - {name: dry_run, type: text}          # true|false, empty to set nothing
