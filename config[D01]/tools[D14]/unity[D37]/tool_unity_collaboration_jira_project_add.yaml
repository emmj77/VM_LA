id: "U293"
tool: "unity_collaboration_jira_project_add"
date: "2026-10-18"
tags: ["unity", "cli", "collaboration"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Add a Jira project configuration under a server"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- collaboration jira project add --no-banner --no-pager --non-interactive
  [ -n "{{serverconfigid}}" ] || { printf '%s\n' "$(msg argument_required 'serverconfigid' 'unity collaboration jira project add')" >&2; exit 1; }

  [ -n "{{serverconfigid}}" ] && set -- "$@" "{{serverconfigid}}"
  [ -n "{{organization_id}}" ] && set -- "$@" --organization-id "{{organization_id}}"
  [ -n "{{jira_project_id}}" ] && set -- "$@" --jira-project-id "{{jira_project_id}}"
  [ -n "{{default_reporter_id}}" ] && set -- "$@" --default-reporter-id "{{default_reporter_id}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_collaboration_jira_project)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: serverconfigid, type: text}
  - {name: organization_id, type: text}   # Unity organization ID
  - {name: jira_project_id, type: text}   # Jira project ID to associate
  - {name: default_reporter_id, type: text}   # Jira account ID used as the fallback reporter when an annotation autho
