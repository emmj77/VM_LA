id: "U220"
tool: "coplay_profiler_get_counters"
date: "2026-10-18"
tags: ["unity", "coplay", "profiler"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Read profiler counters by category (async,..."

COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing_paths)" >&2; exit 1; }
  set -f
  set -- profiler get-counters
  [ -n "{{category}}" ] && set -- "$@" --category "{{category}}"
  [ -n "{{counter}}" ] && set -- "$@" --counter "{{counter}}"

  OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
  RC=$?
  [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
  printf '%s\n' "$OUT"

ARGS:
  - {name: category, type: text}
  - {name: counter, type: text}
