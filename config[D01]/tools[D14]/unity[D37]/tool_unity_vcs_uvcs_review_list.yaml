id: "U441"
tool: "unity_vcs_uvcs_review_list"
date: "2026-10-18"
tags: ["unity", "unity", "text", "list"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "List the code reviews on this repository"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- vcs uvcs review list --no-banner --no-pager --non-interactive


  [ -n "{{path}}" ] && set -- "$@" "{{path}}"
  [ -n "{{changeset}}" ] && set -- "$@" --changeset "{{changeset}}"
  [ -n "{{branch}}" ] && set -- "$@" --branch "{{branch}}"
  [ -n "{{status}}" ] && set -- "$@" --status "{{status}}"
  [ -n "{{limit}}" ] && set -- "$@" --limit "{{limit}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_vcs_uvcs_review_3)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: path, type: text}   # facultatif
  - {name: changeset, type: text}   # Only reviews attached to this changeset
  - {name: branch, type: text}   # Only reviews attached to this branch
  - {name: status, type: text}   # Only reviews in this state
  - {name: limit, type: text}   # How many rows to return (default 50, max 500)
