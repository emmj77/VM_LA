id: "U312"
tool: "unity_config_accelerator"
date: "2026-10-18"
tags: ["unity", "unity", "config", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "View or change the configured Unity Accelerator"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- config accelerator --no-banner --no-pager --non-interactive
  case "{{unset}}" in ''|true|false) ;; *) printf '%s\n' "$(msg unset_true_false)" >&2; exit 1 ;; esac

  [ -n "{{endpoint}}" ] && set -- "$@" "{{endpoint}}"
  [ "{{unset}}" = true ] && set -- "$@" --unset
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_config_accelerator_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: endpoint, type: text}   # facultatif
  - {name: unset, type: text}   # true to set --unset ; Remove the persisted Unity Accelerator configuration
