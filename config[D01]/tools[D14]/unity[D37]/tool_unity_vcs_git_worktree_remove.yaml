id: "U426"
tool: "unity_vcs_git_worktree_remove"
date: "2026-10-18"
tags: ["unity", "unity", "project", "remove"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Delete a worktree and drop its row from the Hub project registry"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- vcs git worktree remove --no-banner --no-pager --non-interactive
  [ -n "{{path}}" ] || { printf '%s\n' "$(msg argument_required 'path' 'unity vcs git worktree remove')" >&2; exit 1; }
  case "{{discard_changes}}" in ''|true|false) ;; *) printf '%s\n' "$(msg discard_changes_true_false)" >&2; exit 1 ;; esac
  case "{{force}}" in ''|true|false) ;; *) printf '%s\n' "$(msg force_true_false)" >&2; exit 1 ;; esac
  case "{{dry_run}}" in ''|true|false) ;; *) printf '%s\n' "$(msg dry_run_true_false)" >&2; exit 1 ;; esac
  case "{{yes}}" in ''|true|false) ;; *) printf '%s\n' "$(msg yes_true_false)" >&2; exit 1 ;; esac

  [ -n "{{path}}" ] && set -- "$@" "{{path}}"
  [ "{{discard_changes}}" = true ] && set -- "$@" --discard-changes
  [ "{{force}}" = true ] && set -- "$@" --force
  [ "{{dry_run}}" = true ] && set -- "$@" --dry-run
  [ "{{yes}}" = true ] && set -- "$@" --yes
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_vcs_git_worktree)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: path, type: text}
  - {name: discard_changes, type: text}   # true to set --discard-changes ; Delete the worktree even though it holds uncommitted work
  - {name: force, type: text}   # true to set --force ; Remove even while an Editor holds the worktree
  - {name: dry_run, type: text}   # true to set --dry-run ; Run every check and report the plan, then change nothing
  - {name: yes, type: text}   # true to set --yes ; Answer yes to every confirmation
