id: "U002"
tool: "upipe_add_animator_parameter"
date: "2026-10-18"
tags: ["unity", "unity", "animation", "add"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Add a parameter (Float | Int | Bool | Trigger) to an AnimatorController. A duplicate name returns code 'duplicate_parameter'."

COMMAND: |
  PROJ=$(sed -n '1p' "$(cfg abs project_active)" 2>/dev/null | tr -d '\r')
  P=
  [ -n "$PROJ" ] && P=$(sed -n 's/^path:[[:space:]]*//p' "$(project_dir "$PROJ")/project.yml" 2>/dev/null | head -1 | tr -d '"')
  [ -n "$P" ] || { printf '%s\n' "$(msg no_project_loaded)" >&2; exit 1; }
  case "$P" in /*) ;; *) P="$HOME/$P" ;; esac
  [ -d "$P" ] || { printf '%s\n' "$(msg project_missing '%s')""$P" >&2; exit 1; }
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -n "{{controller}}" ] || { printf '%s\n' "$(msg argument_required 'controller' 'add_animator_parameter')" >&2; exit 1; }
  [ -n "{{name}}" ] || { printf '%s\n' "$(msg argument_required 'name' 'add_animator_parameter')" >&2; exit 1; }
  [ -n "{{type}}" ] || { printf '%s\n' "$(msg argument_required 'type' 'add_animator_parameter')" >&2; exit 1; }
  case "{{dry_run}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean_in 'dry_run' 'add_animator_parameter')""{{dry_run}}" >&2; exit 1 ;; esac
  set -- command --project-path "$P" add_animator_parameter
  [ -n "{{controller}}" ] && set -- "$@" --controller "{{controller}}"
  [ -n "{{name}}" ] && set -- "$@" --name "{{name}}"
  [ -n "{{type}}" ] && set -- "$@" --type "{{type}}"
  [ -n "{{defaultValue}}" ] && set -- "$@" --defaultValue "{{defaultValue}}"
  [ -n "{{dry_run}}" ] && set -- "$@" --dry_run "{{dry_run}}"

  OUT=$(timeout 90 "$CLI" --no-banner --no-pager --non-interactive --format json "$@" </dev/null 2>&1)
  printf '%s' "$OUT" | jq -e '.success == true' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | jq -r '.errors[0].message // .errors[0].code // "reponse illisible du CLI"' 2>/dev/null || printf '%s' "$OUT")" >&2; exit 1; }
  printf '%s\n' "$OUT" | jq -c '.data'

ARGS:
  - {name: controller, type: text}
  - {name: name, type: text}
  - {name: type, type: text}
  - {name: defaultValue, type: text}
  - {name: dry_run, type: text}          # true|false, empty to set nothing
