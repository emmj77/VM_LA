id: "U356"
tool: "unity_job_wait"
date: "2026-10-18"
tags: ["unity", "cli", "job"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Wait for a detached job to finish and print its result"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- job wait --no-banner --no-pager --non-interactive
  [ -n "{{job_id}}" ] || { printf '%s\n' "$(msg argument_required 'job_id' 'unity job wait')" >&2; exit 1; }

  [ -n "{{job_id}}" ] && set -- "$@" "{{job_id}}"
  [ -n "{{poll_interval}}" ] && set -- "$@" --poll-interval "{{poll_interval}}"
  [ -n "{{timeout}}" ] && set -- "$@" --timeout "{{timeout}}"
  [ -n "{{project_path}}" ] && set -- "$@" --project-path "{{project_path}}"
  [ -n "{{runtime}}" ] && set -- "$@" --runtime "{{runtime}}"
  [ -n "{{runtime_path}}" ] && set -- "$@" --runtime-path "{{runtime_path}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_job_wait_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: job_id, type: text}
  - {name: poll_interval, type: text}   # Polling interval in milliseconds (default: 500)
  - {name: timeout, type: text}   # Stop waiting after this many seconds; 0 waits until the job finishes (
  - {name: project_path, type: text}   # Path to Unity project (auto-detected if not specified)
  - {name: runtime, type: text}   # Connect to a Unity Player runtime instance (search by process name)
  - {name: runtime_path, type: text}   # Connect to a Unity Player by path to port file
