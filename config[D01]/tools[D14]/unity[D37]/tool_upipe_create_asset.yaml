id: "U038"
tool: "upipe_create_asset"
date: "2026-10-18"
tags: ["unity", "unity", "object", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Create a new ScriptableObject (or other UnityEngine.Object) asset of the given type at a path under the authoring root."

COMMAND: |
  PROJ=$(sed -n '1p' "$ROOT/projects/.active" 2>/dev/null | tr -d '\r')
  P=
  [ -n "$PROJ" ] && P=$(sed -n 's/^path:[[:space:]]*//p' "$ROOT/projects/$PROJ/project.yml" 2>/dev/null | head -1 | tr -d '"')
  [ -n "$P" ] || { printf '%s\n' "$(msg no_project_loaded)" >&2; exit 1; }
  case "$P" in /*) ;; *) P="$HOME/$P" ;; esac
  [ -d "$P" ] || { printf '%s\n' "$(msg project_missing '%s')""$P" >&2; exit 1; }
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -n "{{path}}" ] || { printf '%s\n' "$(msg argument_required 'path' 'create_asset')" >&2; exit 1; }
  [ -n "{{type}}" ] || { printf '%s\n' "$(msg argument_required 'type' 'create_asset')" >&2; exit 1; }
  case "{{confirm}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean_in 'confirm' 'create_asset')""{{confirm}}" >&2; exit 1 ;; esac
  case "{{dry_run}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean_in 'dry_run' 'create_asset')""{{dry_run}}" >&2; exit 1 ;; esac
  set -- command --project-path "$P" create_asset
  [ -n "{{path}}" ] && set -- "$@" --path "{{path}}"
  [ -n "{{type}}" ] && set -- "$@" --type "{{type}}"
  [ -n "{{shader}}" ] && set -- "$@" --shader "{{shader}}"
  [ -n "{{confirm}}" ] && set -- "$@" --confirm "{{confirm}}"
  [ -n "{{dry_run}}" ] && set -- "$@" --dry_run "{{dry_run}}"

  OUT=$(timeout 90 "$CLI" --no-banner --no-pager --non-interactive --format json "$@" </dev/null 2>&1)
  printf '%s' "$OUT" | jq -e '.success == true' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | jq -r '.errors[0].message // .errors[0].code // "reponse illisible du CLI"' 2>/dev/null || printf '%s' "$OUT")" >&2; exit 1; }
  printf '%s\n' "$OUT" | jq -c '.data'

ARGS:
  - {name: path, type: text}
  - {name: type, type: text}
  - {name: shader, type: text}
  - {name: confirm, type: text}          # true|false, empty to set nothing
  - {name: dry_run, type: text}          # true|false, empty to set nothing
