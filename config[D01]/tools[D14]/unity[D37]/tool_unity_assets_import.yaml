id: "U234"
tool: "unity_assets_import"
date: "2026-10-18"
tags: ["unity", "cli", "assets"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Import a .unitypackage into a project using the Editor in batch mode"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- assets import --no-banner --no-pager --non-interactive
  [ -n "{{file}}" ] || { printf '%s\n' "$(msg argument_required 'file' 'unity assets import')" >&2; exit 1; }

  [ -n "{{file}}" ] && set -- "$@" "{{file}}"
  [ -n "{{project}}" ] && set -- "$@" --project "{{project}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_assets_import_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: file, type: text}
  - {name: project, type: text}   # Project path or registered project name (defaults to the current direc
