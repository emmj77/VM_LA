id: "U045"
tool: "upipe_create_script"
date: "2026-10-18"
tags: ["unity", "unity", "project", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Create a new C# script (default base class MonoBehaviour) from a template under the authoring root. NOTE: the type does not exist until a recompile completes — to attach it, call recompile, poll recom"

COMMAND: |
  PROJ=$(sed -n '1p' "$ROOT/projects/.active" 2>/dev/null | tr -d '\r')
  P=
  [ -n "$PROJ" ] && P=$(sed -n 's/^path:[[:space:]]*//p' "$ROOT/projects/$PROJ/project.yml" 2>/dev/null | head -1 | tr -d '"')
  [ -n "$P" ] || { printf '%s\n' "$(msg no_project_loaded)" >&2; exit 1; }
  case "$P" in /*) ;; *) P="$HOME/$P" ;; esac
  [ -d "$P" ] || { printf '%s\n' "$(msg project_missing '%s')""$P" >&2; exit 1; }
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -n "{{name}}" ] || { printf '%s\n' "$(msg argument_required 'name' 'create_script')" >&2; exit 1; }
  case "{{overwrite}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean_in 'overwrite' 'create_script')""{{overwrite}}" >&2; exit 1 ;; esac
  set -- command --project-path "$P" create_script
  [ -n "{{name}}" ] && set -- "$@" --name "{{name}}"
  [ -n "{{path}}" ] && set -- "$@" --path "{{path}}"
  [ -n "{{namespace}}" ] && set -- "$@" --namespace "{{namespace}}"
  [ -n "{{base_class}}" ] && set -- "$@" --base_class "{{base_class}}"
  [ -n "{{overwrite}}" ] && set -- "$@" --overwrite "{{overwrite}}"

  OUT=$(timeout 90 "$CLI" --no-banner --no-pager --non-interactive --format json "$@" </dev/null 2>&1)
  printf '%s' "$OUT" | jq -e '.success == true' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | jq -r '.errors[0].message // .errors[0].code // "reponse illisible du CLI"' 2>/dev/null || printf '%s' "$OUT")" >&2; exit 1; }
  printf '%s\n' "$OUT" | jq -c '.data'

ARGS:
  - {name: name, type: text}
  - {name: path, type: text}
  - {name: namespace, type: text}
  - {name: base_class, type: text}
  - {name: overwrite, type: text}          # true|false, empty to set nothing
