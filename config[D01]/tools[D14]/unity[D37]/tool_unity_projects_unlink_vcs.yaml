id: "U402"
tool: "unity_projects_unlink_vcs"
date: "2026-10-18"
tags: ["unity", "unity", "project", "remove"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Remove all git remotes from a local project, including any you added yourself such as upstream (the remote repositories themselves are not deleted)"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- projects unlink vcs --no-banner --no-pager --non-interactive
  case "{{unlink_workspace}}" in ''|true|false) ;; *) printf '%s\n' "$(msg unlink_workspace_true_false)" >&2; exit 1 ;; esac

  [ -n "{{path}}" ] && set -- "$@" "{{path}}"
  [ "{{unlink_workspace}}" = true ] && set -- "$@" --unlink-workspace
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_projects_unlink_vcs)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: path, type: text}   # facultatif
  - {name: unlink_workspace, type: text}   # true to set --unlink-workspace ; Confirm removal of a UVCS workspace that contains other projects (work
