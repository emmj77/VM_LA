id: "U448"
tool: "coplay_animation_controller"
date: "2026-10-17"
tags: ["unity", "unity", "animation", "add"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "an animation controller: add-blend-tree-child | add-parameter | add-state | add-transition | assign | create | create-blend-tree-1d | create-blend-tree-2d | info | remove-layer | set-layer-weight (op picks which)"

COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing)" >&2; exit 1; }
  case "{{op}}" in
  add-blend-tree-child)
    set -f
    set -- animation controller add-blend-tree-child
    T=$(printf '%s' "{{position}}" | tr -d '0123456789. -')
    [ -z "$T" ] || { printf '%s\n' "$(msg expects_space_separated_numbers 'position' '2' '%s')""{{position}}" >&2; exit 1; }
    unset T
    [ -n "{{controller_path}}" ] || { printf '%s\n' "$(msg argument_required 'controller_path' 'animation controller add-blend-tree-child')" >&2; exit 1; }
    [ -n "{{state_name}}" ] || { printf '%s\n' "$(msg argument_required 'state_name' 'animation controller add-blend-tree-child')" >&2; exit 1; }
    [ -n "{{clip_path}}" ] && set -- "$@" --clip-path "{{clip_path}}"
    [ -n "{{threshold}}" ] && set -- "$@" --threshold "{{threshold}}"
    [ -n "{{position}}" ] && set -- "$@" --position {{position}}
    [ -n "{{layer_index}}" ] && set -- "$@" --layer-index "{{layer_index}}"
    [ -n "{{controller_path}}" ] && set -- "$@" "{{controller_path}}"
    [ -n "{{state_name}}" ] && set -- "$@" "{{state_name}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  add-parameter)
    set -f
    set -- animation controller add-parameter
    [ -n "{{controller_path}}" ] || { printf '%s\n' "$(msg argument_required 'controller_path' 'animation controller add-parameter')" >&2; exit 1; }
    [ -n "{{param_name}}" ] || { printf '%s\n' "$(msg argument_required 'param_name' 'animation controller add-parameter')" >&2; exit 1; }
    [ -n "{{param_type}}" ] && set -- "$@" --type "{{param_type}}"
    [ -n "{{default_value}}" ] && set -- "$@" --default-value "{{default_value}}"
    [ -n "{{controller_path}}" ] && set -- "$@" "{{controller_path}}"
    [ -n "{{param_name}}" ] && set -- "$@" "{{param_name}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  add-state)
    set -f
    set -- animation controller add-state
    case "{{is_default}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean 'is_default')" >&2; exit 1 ;; esac
    [ -n "{{controller_path}}" ] || { printf '%s\n' "$(msg argument_required 'controller_path' 'animation controller add-state')" >&2; exit 1; }
    [ -n "{{state_name}}" ] || { printf '%s\n' "$(msg argument_required 'state_name' 'animation controller add-state')" >&2; exit 1; }
    [ -n "{{clip_path}}" ] && set -- "$@" --clip-path "{{clip_path}}"
    [ -n "{{speed}}" ] && set -- "$@" --speed "{{speed}}"
    [ "{{is_default}}" = true ] && set -- "$@" --is-default
    [ -n "{{layer_index}}" ] && set -- "$@" --layer-index "{{layer_index}}"
    [ -n "{{controller_path}}" ] && set -- "$@" "{{controller_path}}"
    [ -n "{{state_name}}" ] && set -- "$@" "{{state_name}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  add-transition)
    set -f
    set -- animation controller add-transition
    case "{{has_exit_time}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean 'has_exit_time')" >&2; exit 1 ;; esac
    [ -n "{{controller_path}}" ] || { printf '%s\n' "$(msg argument_required 'controller_path' 'animation controller add-transition')" >&2; exit 1; }
    [ -n "{{from_state}}" ] || { printf '%s\n' "$(msg argument_required 'from_state' 'animation controller add-transition')" >&2; exit 1; }
    [ -n "{{to_state}}" ] || { printf '%s\n' "$(msg argument_required 'to_state' 'animation controller add-transition')" >&2; exit 1; }
    [ "{{has_exit_time}}" = true ] && set -- "$@" --has-exit-time
    [ -n "{{duration}}" ] && set -- "$@" --duration "{{duration}}"
    [ -n "{{conditions}}" ] && set -- "$@" --conditions "{{conditions}}"
    [ -n "{{layer_index}}" ] && set -- "$@" --layer-index "{{layer_index}}"
    [ -n "{{controller_path}}" ] && set -- "$@" "{{controller_path}}"
    [ -n "{{from_state}}" ] && set -- "$@" "{{from_state}}"
    [ -n "{{to_state}}" ] && set -- "$@" "{{to_state}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  assign)
    set -f
    set -- animation controller assign
    [ -n "{{controller_path}}" ] || { printf '%s\n' "$(msg argument_required 'controller_path' 'animation controller assign')" >&2; exit 1; }
    [ -n "{{target}}" ] || { printf '%s\n' "$(msg argument_required 'target' 'animation controller assign')" >&2; exit 1; }
    [ -n "{{search_method}}" ] && set -- "$@" --search-method "{{search_method}}"
    [ -n "{{controller_path}}" ] && set -- "$@" "{{controller_path}}"
    [ -n "{{target}}" ] && set -- "$@" "{{target}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  create)
    set -f
    set -- animation controller create
    [ -n "{{controller_path}}" ] || { printf '%s\n' "$(msg argument_required 'controller_path' 'animation controller create')" >&2; exit 1; }
    [ -n "{{controller_path}}" ] && set -- "$@" "{{controller_path}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  create-blend-tree-1d)
    set -f
    set -- animation controller create-blend-tree-1d
    [ -n "{{controller_path}}" ] || { printf '%s\n' "$(msg argument_required 'controller_path' 'animation controller create-blend-tree-1d')" >&2; exit 1; }
    [ -n "{{state_name}}" ] || { printf '%s\n' "$(msg argument_required 'state_name' 'animation controller create-blend-tree-1d')" >&2; exit 1; }
    [ -n "{{blend_param}}" ] && set -- "$@" --blend-param "{{blend_param}}"
    [ -n "{{layer_index}}" ] && set -- "$@" --layer-index "{{layer_index}}"
    [ -n "{{controller_path}}" ] && set -- "$@" "{{controller_path}}"
    [ -n "{{state_name}}" ] && set -- "$@" "{{state_name}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  create-blend-tree-2d)
    set -f
    set -- animation controller create-blend-tree-2d
    [ -n "{{controller_path}}" ] || { printf '%s\n' "$(msg argument_required 'controller_path' 'animation controller create-blend-tree-2d')" >&2; exit 1; }
    [ -n "{{state_name}}" ] || { printf '%s\n' "$(msg argument_required 'state_name' 'animation controller create-blend-tree-2d')" >&2; exit 1; }
    [ -n "{{blend_param_x}}" ] && set -- "$@" --blend-param-x "{{blend_param_x}}"
    [ -n "{{blend_param_y}}" ] && set -- "$@" --blend-param-y "{{blend_param_y}}"
    [ -n "{{blend_type}}" ] && set -- "$@" --blend-type "{{blend_type}}"
    [ -n "{{layer_index}}" ] && set -- "$@" --layer-index "{{layer_index}}"
    [ -n "{{controller_path}}" ] && set -- "$@" "{{controller_path}}"
    [ -n "{{state_name}}" ] && set -- "$@" "{{state_name}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  info)
    set -f
    set -- animation controller info
    [ -n "{{controller_path}}" ] || { printf '%s\n' "$(msg argument_required 'controller_path' 'animation controller info')" >&2; exit 1; }
    [ -n "{{controller_path}}" ] && set -- "$@" "{{controller_path}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  remove-layer)
    set -f
    set -- animation controller remove-layer
    [ -n "{{controller_path}}" ] || { printf '%s\n' "$(msg argument_required 'controller_path' 'animation controller remove-layer')" >&2; exit 1; }
    [ -n "{{layer_index}}" ] && set -- "$@" --layer-index "{{layer_index}}"
    [ -n "{{layer_name}}" ] && set -- "$@" --layer-name "{{layer_name}}"
    [ -n "{{controller_path}}" ] && set -- "$@" "{{controller_path}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  set-layer-weight)
    set -f
    set -- animation controller set-layer-weight
    [ -n "{{controller_path}}" ] || { printf '%s\n' "$(msg argument_required 'controller_path' 'animation controller set-layer-weight')" >&2; exit 1; }
    [ -n "{{weight}}" ] || { printf '%s\n' "$(msg argument_required 'weight' 'animation controller set-layer-weight')" >&2; exit 1; }
    [ -n "{{layer_index}}" ] && set -- "$@" --layer-index "{{layer_index}}"
    [ -n "{{layer_name}}" ] && set -- "$@" --layer-name "{{layer_name}}"
    [ -n "{{controller_path}}" ] && set -- "$@" "{{controller_path}}"
    [ -n "{{weight}}" ] && set -- "$@" "{{weight}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  esac

ARGS:
  - {name: op, type: enum, values: [add-blend-tree-child, add-parameter, add-state, add-transition, assign, create, create-blend-tree-1d, create-blend-tree-2d, info, remove-layer, set-layer-weight]}
  - {name: controller_path, type: text}
  - {name: weight, type: text}
  - {name: target, type: text}
  - {name: from_state, type: text}
  - {name: to_state, type: text}
  - {name: param_name, type: text}
  - {name: state_name, type: text}
  - {name: blend_param, type: text}
  - {name: blend_param_x, type: text}
  - {name: blend_param_y, type: text}
  - {name: blend_type, type: text}
  - {name: clip_path, type: text}
  - {name: conditions, type: text}
  - {name: default_value, type: text}
  - {name: duration, type: text}
  - {name: layer_index, type: int}
  - {name: layer_name, type: text}
  - {name: param_type, type: text}
  - {name: search_method, type: text}
  - {name: speed, type: text}
  - {name: threshold, type: text}
  - {name: has_exit_time, type: text}
  - {name: is_default, type: text}
  - {name: position, type: text}
