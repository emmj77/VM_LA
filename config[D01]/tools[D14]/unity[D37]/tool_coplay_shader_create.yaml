id: "U226"
tool: "coplay_shader_create"
date: "2026-10-18"
tags: ["unity", "coplay", "shader"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Create a new shader."

COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing_paths)" >&2; exit 1; }
  set -f
  set -- shader create
  [ -n "{{name}}" ] || { printf '%s\n' "$(msg argument_required 'name' 'shader create')" >&2; exit 1; }
  [ -n "{{path}}" ] && set -- "$@" --path "{{path}}"
  [ -n "{{contents}}" ] && set -- "$@" --contents "{{contents}}"
  [ -n "{{file_path}}" ] && set -- "$@" --file "{{file_path}}"
  [ -n "{{name}}" ] && set -- "$@" "{{name}}"

  OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
  RC=$?
  [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
  printf '%s\n' "$OUT"

ARGS:
  - {name: path, type: text}
  - {name: contents, type: text}
  - {name: file_path, type: text}
  - {name: name, type: text}
