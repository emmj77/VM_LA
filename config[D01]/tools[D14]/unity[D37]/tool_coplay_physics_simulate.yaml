id: "U203"
tool: "coplay_physics_simulate"
date: "2026-10-18"
tags: ["unity", "coplay", "physics"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Run physics simulation steps in edit mode."

COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing_paths)" >&2; exit 1; }
  set -f
  set -- physics simulate
  [ -n "{{steps}}" ] && set -- "$@" --steps "{{steps}}"
  [ -n "{{step_size}}" ] && set -- "$@" --step-size "{{step_size}}"
  [ -n "{{dimension}}" ] && set -- "$@" --dimension "{{dimension}}"

  OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
  RC=$?
  [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
  printf '%s\n' "$OUT"

ARGS:
  - {name: steps, type: int}
  - {name: step_size, type: text}
  - {name: dimension, type: text}
