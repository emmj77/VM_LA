id: "U088"
tool: "upipe_move_asset"
date: "2026-10-18"
tags: ["unity", "unity", "project", "move"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Move (or rename via a new path) an asset to a new location under the authoring root. Preserves the asset's GUID."

COMMAND: |
  PROJ=$(sed -n '1p' "$(cfg abs project_active)" 2>/dev/null | tr -d '\r')
  P=
  [ -n "$PROJ" ] && P=$(sed -n 's/^path:[[:space:]]*//p' "$(project_dir "$PROJ")/project.yml" 2>/dev/null | head -1 | tr -d '"')
  [ -n "$P" ] || { printf '%s\n' "$(msg no_project_loaded)" >&2; exit 1; }
  case "$P" in /*) ;; *) P="$HOME/$P" ;; esac
  [ -d "$P" ] || { printf '%s\n' "$(msg project_missing '%s')""$P" >&2; exit 1; }
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -n "{{asset}}" ] || { printf '%s\n' "$(msg argument_required 'asset' 'move_asset')" >&2; exit 1; }
  [ -n "{{destination}}" ] || { printf '%s\n' "$(msg argument_required 'destination' 'move_asset')" >&2; exit 1; }
  case "{{dry_run}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean_in 'dry_run' 'move_asset')""{{dry_run}}" >&2; exit 1 ;; esac
  set -- command --project-path "$P" move_asset
  [ -n "{{asset}}" ] && set -- "$@" --asset "{{asset}}"
  [ -n "{{destination}}" ] && set -- "$@" --destination "{{destination}}"
  [ -n "{{dry_run}}" ] && set -- "$@" --dry_run "{{dry_run}}"

  OUT=$(timeout 90 "$CLI" --no-banner --no-pager --non-interactive --format json "$@" </dev/null 2>&1)
  printf '%s' "$OUT" | jq -e '.success == true' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | jq -r '.errors[0].message // .errors[0].code // "reponse illisible du CLI"' 2>/dev/null || printf '%s' "$OUT")" >&2; exit 1; }
  printf '%s\n' "$OUT" | jq -c '.data'

ARGS:
  - {name: asset, type: text}
  - {name: destination, type: text}
  - {name: dry_run, type: text}          # true|false, empty to set nothing
