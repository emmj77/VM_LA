id: "U003"
tool: "upipe_add_animator_state"
date: "2026-10-18"
tags: ["unity", "unity", "animation", "add"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Add a state to a layer, optionally with a motion (AnimationClip or BlendTree) and as the layer default. A layer name with no match returns code 'layer_not_found'."

COMMAND: |
  PROJ=$(sed -n '1p' "$ROOT/projects/.active" 2>/dev/null | tr -d '\r')
  P=
  [ -n "$PROJ" ] && P=$(sed -n 's/^path:[[:space:]]*//p' "$ROOT/projects/$PROJ/project.yml" 2>/dev/null | head -1 | tr -d '"')
  [ -n "$P" ] || { printf '%s\n' "$(msg no_project_loaded)" >&2; exit 1; }
  case "$P" in /*) ;; *) P="$HOME/$P" ;; esac
  [ -d "$P" ] || { printf '%s\n' "$(msg project_missing '%s')""$P" >&2; exit 1; }
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -n "{{controller}}" ] || { printf '%s\n' "$(msg argument_required 'controller' 'add_animator_state')" >&2; exit 1; }
  [ -n "{{name}}" ] || { printf '%s\n' "$(msg argument_required 'name' 'add_animator_state')" >&2; exit 1; }
  case "{{isDefault}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean_in 'isDefault' 'add_animator_state')""{{isDefault}}" >&2; exit 1 ;; esac
  case "{{dry_run}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean_in 'dry_run' 'add_animator_state')""{{dry_run}}" >&2; exit 1 ;; esac
  set -- command --project-path "$P" add_animator_state
  [ -n "{{controller}}" ] && set -- "$@" --controller "{{controller}}"
  [ -n "{{layer}}" ] && set -- "$@" --layer "{{layer}}"
  [ -n "{{name}}" ] && set -- "$@" --name "{{name}}"
  [ -n "{{motion}}" ] && set -- "$@" --motion "{{motion}}"
  [ -n "{{isDefault}}" ] && set -- "$@" --isDefault "{{isDefault}}"
  [ -n "{{position}}" ] && set -- "$@" --position "{{position}}"
  [ -n "{{dry_run}}" ] && set -- "$@" --dry_run "{{dry_run}}"

  OUT=$(timeout 90 "$CLI" --no-banner --no-pager --non-interactive --format json "$@" </dev/null 2>&1)
  printf '%s' "$OUT" | jq -e '.success == true' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | jq -r '.errors[0].message // .errors[0].code // "reponse illisible du CLI"' 2>/dev/null || printf '%s' "$OUT")" >&2; exit 1; }
  printf '%s\n' "$OUT" | jq -c '.data'

ARGS:
  - {name: controller, type: text}
  - {name: layer, type: int}
  - {name: name, type: text}
  - {name: motion, type: text}
  - {name: isDefault, type: text}          # true|false, empty to set nothing
  - {name: position, type: text}
  - {name: dry_run, type: text}          # true|false, empty to set nothing
