id: "U415"
tool: "unity_templates_location"
date: "2026-10-18"
tags: ["unity", "unity", "project", "set"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Get, set, or reset the default storage path for custom templates"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- templates location --no-banner --no-pager --non-interactive
  case "{{reset}}" in ''|true|false) ;; *) printf '%s\n' "$(msg reset_true_false)" >&2; exit 1 ;; esac

  [ -n "{{set}}" ] && set -- "$@" --set "{{set}}"
  [ "{{reset}}" = true ] && set -- "$@" --reset
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_templates_location_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: set, type: text}   # Set the default templates storage path
  - {name: reset, type: text}   # true to set --reset ; Reset to the Hub default templates path
