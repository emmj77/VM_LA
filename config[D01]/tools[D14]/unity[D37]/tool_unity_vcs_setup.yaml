id: "U433"
tool: "unity_vcs_setup"
date: "2026-10-18"
tags: ["unity", "cli", "vcs"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Get this project into version control and push a first commit, asking only what cannot be detected"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- vcs setup --no-banner --no-pager --non-interactive
  case "{{git_token_stdin}}" in ''|true|false) ;; *) printf '%s\n' "$(msg git_token_stdin_true)" >&2; exit 1 ;; esac
  case "{{no_initial_commit}}" in ''|true|false) ;; *) printf '%s\n' "$(msg initial_commit_true_false)" >&2; exit 1 ;; esac
  case "{{git_lfs}}" in ''|true|false) ;; *) printf '%s\n' "$(msg git_lfs_true_false)" >&2; exit 1 ;; esac
  case "{{dry_run}}" in ''|true|false) ;; *) printf '%s\n' "$(msg dry_run_true_false)" >&2; exit 1 ;; esac

  [ -n "{{path}}" ] && set -- "$@" "{{path}}"
  [ -n "{{vcs}}" ] && set -- "$@" --vcs "{{vcs}}"
  [ -n "{{git_namespace}}" ] && set -- "$@" --git-namespace "{{git_namespace}}"
  [ -n "{{git_repo}}" ] && set -- "$@" --git-repo "{{git_repo}}"
  [ -n "{{git_visibility}}" ] && set -- "$@" --git-visibility "{{git_visibility}}"
  [ -n "{{git_default_branch}}" ] && set -- "$@" --git-default-branch "{{git_default_branch}}"
  [ -n "{{git_remote_protocol}}" ] && set -- "$@" --git-remote-protocol "{{git_remote_protocol}}"
  [ -n "{{git_description}}" ] && set -- "$@" --git-description "{{git_description}}"
  [ -n "{{git_token}}" ] && set -- "$@" --git-token "{{git_token}}"
  [ "{{git_token_stdin}}" = true ] && set -- "$@" --git-token-stdin
  [ "{{no_initial_commit}}" = true ] && set -- "$@" --no-initial-commit
  [ "{{git_lfs}}" = true ] && set -- "$@" --git-lfs
  [ -n "{{vcs_region}}" ] && set -- "$@" --vcs-region "{{vcs_region}}"
  [ "{{dry_run}}" = true ] && set -- "$@" --dry-run
  [ -n "{{preset}}" ] && set -- "$@" --preset "{{preset}}"
  [ -n "{{save_preset}}" ] && set -- "$@" --save-preset "{{save_preset}}"
  [ -n "{{cloud_org}}" ] && set -- "$@" --cloud-org "{{cloud_org}}"
  [ -n "{{cloud_project}}" ] && set -- "$@" --cloud-project "{{cloud_project}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_vcs_setup_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: path, type: text}   # facultatif
  - {name: vcs, type: text}   # Provider to use. Skips the question. One of github, gitlab, uvcs, or a
  - {name: git_namespace, type: text}   # GitHub organization or GitLab group for the repository; defaults to th
  - {name: git_repo, type: text}   # Name for the remote repository; defaults to the project folder name
  - {name: git_visibility, type: text}   # Repository visibility: private, public, or internal (default private)
  - {name: git_default_branch, type: text}   # Default branch name for a new repository (default main)
  - {name: git_remote_protocol, type: text}   # Transport for the new remote: https or ssh (default https)
  - {name: git_description, type: text}   # Description for a new repository
  - {name: git_token, type: text}   # Personal access token; overrides your Git credential manager (prefer -
  - {name: git_token_stdin, type: text}   # true pour poser --git-token-stdin ; Read the personal access token from stdin (CI-safe)
  - {name: no_initial_commit, type: text}   # true pour poser --no-initial-commit ; Skip the automatic initial commit and push
  - {name: git_lfs, type: text}   # true pour poser --git-lfs ; Initialize Git LFS before the first commit (new repositories only)
  - {name: vcs_region, type: text}   # UVCS region for the organization's subscription (first use only).
  - {name: dry_run, type: text}   # true pour poser --dry-run ; Show what Unity Version Control setup creates, then exit without creat
  - {name: preset, type: text}   # Preset to fill in every option you did not pass. Defaults to your save
  - {name: save_preset, type: text}   # After a successful run, save its choices under this name and make it y
  - {name: cloud_org, type: text}   # Cloud organization id or name (for --vcs uvcs on a project not yet clo
  - {name: cloud_project, type: text}   # Existing Unity Cloud project id or name to use (for --vcs uvcs).
