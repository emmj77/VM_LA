id: "U283"
tool: "unity_collaboration_attachments_update_spatial"
date: "2026-10-18"
tags: ["unity", "cli", "collaboration"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Update a spatial-3d attachment"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- collaboration attachments update spatial --no-banner --no-pager --non-interactive
  [ -n "{{annotationid}}" ] || { printf '%s\n' "$(msg argument_required 'annotationid' 'unity collaboration attachments update spatial')" >&2; exit 1; }
  [ -n "{{attachmentid}}" ] || { printf '%s\n' "$(msg argument_required 'attachmentid' 'unity collaboration attachments update spatial')" >&2; exit 1; }

  [ -n "{{annotationid}}" ] && set -- "$@" "{{annotationid}}"
  [ -n "{{attachmentid}}" ] && set -- "$@" "{{attachmentid}}"
  [ -n "{{label}}" ] && set -- "$@" --label "{{label}}"
  [ -n "{{position}}" ] && set -- "$@" --position "{{position}}"
  [ -n "{{camera}}" ] && set -- "$@" --camera "{{camera}}"
  [ -n "{{time}}" ] && set -- "$@" --time "{{time}}"
  [ -n "{{local}}" ] && set -- "$@" --local "{{local}}"
  [ -n "{{metadata}}" ] && set -- "$@" --metadata "{{metadata}}"
  [ -n "{{project_id}}" ] && set -- "$@" --project-id "{{project_id}}"
  [ -n "{{project_path}}" ] && set -- "$@" --project-path "{{project_path}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_collaboration_attachments_update)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: annotationid, type: text}
  - {name: attachmentid, type: text}
  - {name: label, type: text}   # A label for the spatial attachment
  - {name: position, type: text}   # Anchor position as a JSON object (x, y, z)
  - {name: camera, type: text}   # Camera state as a JSON object (position, rotation required)
  - {name: time, type: text}   # Playback time as a JSON object (timeScale, timeStamp)
  - {name: local, type: text}   # Local-space anchor as a JSON object
  - {name: metadata, type: text}   # Metadata as key=value pairs (repeat the flag)
  - {name: project_id, type: text}   # Unity Cloud project id
  - {name: project_path, type: text}   # Path to the Unity project (defaults to the current directory); used to
