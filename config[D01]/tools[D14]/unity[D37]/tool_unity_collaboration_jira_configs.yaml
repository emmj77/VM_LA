id: "U285"
tool: "unity_collaboration_jira_configs"
date: "2026-10-18"
tags: ["unity", "cli", "collaboration"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Read Jira configurations. Provide exactly one of --organization-id or --project-id"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- collaboration jira configs --no-banner --no-pager --non-interactive


  [ -n "{{organization_id}}" ] && set -- "$@" --organization-id "{{organization_id}}"
  [ -n "{{project_id}}" ] && set -- "$@" --project-id "{{project_id}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_collaboration_jira_configs)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: organization_id, type: text}   # The Unity organization id to read all Jira configurations for
  - {name: project_id, type: text}   # The Unity project id to read available Jira configurations for
