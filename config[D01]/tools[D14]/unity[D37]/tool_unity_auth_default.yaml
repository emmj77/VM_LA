id: "U237"
tool: "unity_auth_default"
date: "2026-10-18"
tags: ["unity", "unity", "project", "show"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Show or set the default account for a Unity project"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- auth default --no-banner --no-pager --non-interactive
  case "{{clear}}" in ''|true|false) ;; *) printf '%s\n' "$(msg clear_true_false)" >&2; exit 1 ;; esac

  [ -n "{{account}}" ] && set -- "$@" "{{account}}"
  [ -n "{{project}}" ] && set -- "$@" --project "{{project}}"
  [ "{{clear}}" = true ] && set -- "$@" --clear
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_auth_default_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: account, type: text}   # facultatif
  - {name: project, type: text}   # Path inside the Unity project (defaults to the current directory)
  - {name: clear, type: text}   # true to set --clear ; Remove the project's default account
