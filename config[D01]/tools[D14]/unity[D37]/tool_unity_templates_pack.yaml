id: "U416"
tool: "unity_templates_pack"
date: "2026-10-18"
tags: ["unity", "cli", "templates"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Pack a Unity project into a portable template archive"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- templates pack --no-banner --no-pager --non-interactive
  [ -n "{{project_path}}" ] || { printf '%s\n' "$(msg argument_required 'project_path' 'unity templates pack')" >&2; exit 1; }
  case "{{keep_embedded_packages}}" in ''|true|false) ;; *) printf '%s\n' "$(msg keep_embedded_packages_true)" >&2; exit 1 ;; esac
  case "{{keep_project_settings}}" in ''|true|false) ;; *) printf '%s\n' "$(msg keep_project_settings_true)" >&2; exit 1 ;; esac
  case "{{overwrite}}" in ''|true|false) ;; *) printf '%s\n' "$(msg overwrite_true_false)" >&2; exit 1 ;; esac

  [ -n "{{project_path}}" ] && set -- "$@" "{{project_path}}"
  [ -n "{{output}}" ] && set -- "$@" --output "{{output}}"
  [ -n "{{name}}" ] && set -- "$@" --name "{{name}}"
  [ -n "{{display_name}}" ] && set -- "$@" --display-name "{{display_name}}"
  [ -n "{{description}}" ] && set -- "$@" --description "{{description}}"
  [ -n "{{template_version}}" ] && set -- "$@" --template-version "{{template_version}}"
  [ "{{keep_embedded_packages}}" = true ] && set -- "$@" --keep-embedded-packages
  [ "{{keep_project_settings}}" = true ] && set -- "$@" --keep-project-settings
  [ "{{overwrite}}" = true ] && set -- "$@" --overwrite
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_templates_pack_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: project_path, type: text}
  - {name: output, type: text}   # File path to write the template archive to (e.g. ./my-template.tgz)
  - {name: name, type: text}   # Template package name (e.g. com.myorg.template.mytemplate)
  - {name: display_name, type: text}   # Human-readable template name (e.g. 'My Template')
  - {name: description, type: text}   # Short description of the template
  - {name: template_version, type: text}   # Template version (e.g. 1.0.0) — use --template-version to avoid confli
  - {name: keep_embedded_packages, type: text}   # true pour poser --keep-embedded-packages ; Keep embedded packages in the template archive
  - {name: keep_project_settings, type: text}   # true pour poser --keep-project-settings ; Keep project settings in the template archive
  - {name: overwrite, type: text}   # true pour poser --overwrite ; Replace the output file if it already exists
