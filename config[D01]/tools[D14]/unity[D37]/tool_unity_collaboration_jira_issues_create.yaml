id: "U286"
tool: "unity_collaboration_jira_issues_create"
date: "2026-10-18"
tags: ["unity", "cli", "collaboration"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Create a Jira issue linked to an annotation"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- collaboration jira issues create --no-banner --no-pager --non-interactive
  [ -n "{{annotationid}}" ] || { printf '%s\n' "$(msg argument_required 'annotationid' 'unity collaboration jira issues create')" >&2; exit 1; }

  [ -n "{{annotationid}}" ] && set -- "$@" "{{annotationid}}"
  [ -n "{{project_id}}" ] && set -- "$@" --project-id "{{project_id}}"
  [ -n "{{project_path}}" ] && set -- "$@" --project-path "{{project_path}}"
  [ -n "{{jira_project_config_id}}" ] && set -- "$@" --jira-project-config-id "{{jira_project_config_id}}"
  [ -n "{{summary}}" ] && set -- "$@" --summary "{{summary}}"
  [ -n "{{type}}" ] && set -- "$@" --type "{{type}}"
  [ -n "{{description}}" ] && set -- "$@" --description "{{description}}"
  [ -n "{{assignee_user_id}}" ] && set -- "$@" --assignee-user-id "{{assignee_user_id}}"
  [ -n "{{reporter_user_id}}" ] && set -- "$@" --reporter-user-id "{{reporter_user_id}}"
  [ -n "{{parent_issue_id}}" ] && set -- "$@" --parent-issue-id "{{parent_issue_id}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_collaboration_jira_issues_7)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: annotationid, type: text}
  - {name: project_id, type: text}   # Unity project ID
  - {name: project_path, type: text}   # Path to the Unity project (defaults to the current directory); used to
  - {name: jira_project_config_id, type: text}   # The Jira project configuration ID to create the issue under
  - {name: summary, type: text}   # Summary line for the Jira issue
  - {name: type, type: text}   # Jira issue type ID
  - {name: description, type: text}   # Description body for the Jira issue
  - {name: assignee_user_id, type: text}   # Jira account ID to assign the issue to
  - {name: reporter_user_id, type: text}   # Jira account ID to set as the reporter
  - {name: parent_issue_id, type: text}   # Jira ID of the parent issue when creating a sub-task
