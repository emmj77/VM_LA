id: "U121"
tool: "upipe_set_component_properties"
date: "2026-10-18"
tags: ["unity", "unity", "object", "set"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Set serialized properties on a component (one Undo step). 'properties' maps property name -> value; object references accept an ObjectRef handle."

COMMAND: |
  PROJ=$(sed -n '1p' "$ROOT/projects/.active" 2>/dev/null | tr -d '\r')
  P=
  [ -n "$PROJ" ] && P=$(sed -n 's/^path:[[:space:]]*//p' "$ROOT/projects/$PROJ/project.yml" 2>/dev/null | head -1 | tr -d '"')
  [ -n "$P" ] || { printf '%s\n' "$(msg no_project_loaded)" >&2; exit 1; }
  case "$P" in /*) ;; *) P="$HOME/$P" ;; esac
  [ -d "$P" ] || { printf '%s\n' "$(msg project_missing '%s')""$P" >&2; exit 1; }
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -n "{{target}}" ] || { printf '%s\n' "$(msg argument_required 'target' 'set_component_properties')" >&2; exit 1; }
  [ -n "{{properties}}" ] || { printf '%s\n' "$(msg argument_required 'properties' 'set_component_properties')" >&2; exit 1; }
  set -- command --project-path "$P" set_component_properties
  [ -n "{{target}}" ] && set -- "$@" --target "{{target}}"
  [ -n "{{properties}}" ] && set -- "$@" --properties "{{properties}}"
  [ -n "{{type}}" ] && set -- "$@" --type "{{type}}"

  OUT=$(timeout 90 "$CLI" --no-banner --no-pager --non-interactive --format json "$@" </dev/null 2>&1)
  printf '%s' "$OUT" | jq -e '.success == true' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | jq -r '.errors[0].message // .errors[0].code // "reponse illisible du CLI"' 2>/dev/null || printf '%s' "$OUT")" >&2; exit 1; }
  printf '%s\n' "$OUT" | jq -c '.data'

ARGS:
  - {name: target, type: text}
  - {name: properties, type: text}
  - {name: type, type: text}
