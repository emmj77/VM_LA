id: "U201"
tool: "coplay_physics_set_settings"
date: "2026-10-18"
tags: ["unity", "unity", "config", "set"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Set a physics setting (key value)."

COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing_paths)" >&2; exit 1; }
  set -f
  set -- physics set-settings
  [ -n "{{key}}" ] || { printf '%s\n' "$(msg argument_required 'key' 'physics set-settings')" >&2; exit 1; }
  [ -n "{{value}}" ] || { printf '%s\n' "$(msg argument_required 'value' 'physics set-settings')" >&2; exit 1; }
  [ -n "{{dimension}}" ] && set -- "$@" --dimension "{{dimension}}"
  [ -n "{{key}}" ] && set -- "$@" "{{key}}"
  [ -n "{{value}}" ] && set -- "$@" "{{value}}"

  OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
  RC=$?
  [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
  printf '%s\n' "$OUT"

ARGS:
  - {name: dimension, type: text}
  - {name: key, type: text}
  - {name: value, type: text}
