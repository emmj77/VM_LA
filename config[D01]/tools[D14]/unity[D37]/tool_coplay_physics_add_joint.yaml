id: "U189"
tool: "coplay_physics_add_joint"
date: "2026-10-18"
tags: ["unity", "coplay", "physics"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Add a physics joint to a GameObject."

COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing_paths)" >&2; exit 1; }
  set -f
  set -- physics add-joint
  [ -n "{{target}}" ] && set -- "$@" --target "{{target}}"
  [ -n "{{joint_type}}" ] && set -- "$@" --joint-type "{{joint_type}}"
  [ -n "{{connected_body}}" ] && set -- "$@" --connected-body "{{connected_body}}"
  [ -n "{{dimension}}" ] && set -- "$@" --dimension "{{dimension}}"

  OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
  RC=$?
  [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
  printf '%s\n' "$OUT"

ARGS:
  - {name: target, type: text}
  - {name: joint_type, type: text}
  - {name: connected_body, type: text}
  - {name: dimension, type: text}
