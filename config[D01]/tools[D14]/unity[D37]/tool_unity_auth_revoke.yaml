id: "U241"
tool: "unity_auth_revoke"
date: "2026-10-18"
tags: ["unity", "unity", "project", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Stop an application from using your sign-in"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- auth revoke --no-banner --no-pager --non-interactive
  [ -n "{{application}}" ] || { printf '%s\n' "$(msg argument_required 'application' 'unity auth revoke')" >&2; exit 1; }
  case "{{restore}}" in ''|true|false) ;; *) printf '%s\n' "$(msg restore_true_false)" >&2; exit 1 ;; esac

  [ -n "{{application}}" ] && set -- "$@" "{{application}}"
  [ "{{restore}}" = true ] && set -- "$@" --restore
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_auth_revoke_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: application, type: text}
  - {name: restore, type: text}   # true to set --restore ; Restore a previously revoked application
