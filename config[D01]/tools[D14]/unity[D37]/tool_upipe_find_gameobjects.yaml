id: "U055"
tool: "upipe_find_gameobjects"
date: "2026-10-18"
tags: ["unity", "unity", "object", "find"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Find GameObjects in loaded scenes by name, tag, component type, and/or hierarchy path (filters are combined). Returns structured identities."

COMMAND: |
  PROJ=$(sed -n '1p' "$ROOT/projects/.active" 2>/dev/null | tr -d '\r')
  P=
  [ -n "$PROJ" ] && P=$(sed -n 's/^path:[[:space:]]*//p' "$ROOT/projects/$PROJ/project.yml" 2>/dev/null | head -1 | tr -d '"')
  [ -n "$P" ] || { printf '%s\n' "$(msg no_project_loaded)" >&2; exit 1; }
  case "$P" in /*) ;; *) P="$HOME/$P" ;; esac
  [ -d "$P" ] || { printf '%s\n' "$(msg project_missing '%s')""$P" >&2; exit 1; }
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  case "{{include_inactive}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean_in 'include_inactive' 'find_gameobjects')""{{include_inactive}}" >&2; exit 1 ;; esac
  set -- command --project-path "$P" find_gameobjects
  [ -n "{{name}}" ] && set -- "$@" --name "{{name}}"
  [ -n "{{tag}}" ] && set -- "$@" --tag "{{tag}}"
  [ -n "{{type}}" ] && set -- "$@" --type "{{type}}"
  [ -n "{{hierarchy_path}}" ] && set -- "$@" --hierarchy_path "{{hierarchy_path}}"
  [ -n "{{include_inactive}}" ] && set -- "$@" --include_inactive "{{include_inactive}}"

  OUT=$(timeout 90 "$CLI" --no-banner --no-pager --non-interactive --format json "$@" </dev/null 2>&1)
  printf '%s' "$OUT" | jq -e '.success == true' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | jq -r '.errors[0].message // .errors[0].code // "reponse illisible du CLI"' 2>/dev/null || printf '%s' "$OUT")" >&2; exit 1; }
  printf '%s\n' "$OUT" | jq -c '.data'

ARGS:
  - {name: name, type: text}
  - {name: tag, type: text}
  - {name: type, type: text}
  - {name: hierarchy_path, type: text}
  - {name: include_inactive, type: text}          # true|false, empty to set nothing
