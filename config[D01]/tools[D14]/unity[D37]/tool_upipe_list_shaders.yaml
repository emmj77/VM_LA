id: "U085"
tool: "upipe_list_shaders"
date: "2026-10-18"
tags: ["unity", "unity", "material", "list"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Discover available shaders so an agent can pick a valid name for set_material_properties / create_asset. Returns `[{ name, assetPath, isBuiltin, isSupported }]` — `assetPath` is omitted for built-in s"

COMMAND: |
  PROJ=$(sed -n '1p' "$ROOT/projects/.active" 2>/dev/null | tr -d '\r')
  P=
  [ -n "$PROJ" ] && P=$(sed -n 's/^path:[[:space:]]*//p' "$ROOT/projects/$PROJ/project.yml" 2>/dev/null | head -1 | tr -d '"')
  [ -n "$P" ] || { printf '%s\n' "$(msg no_project_loaded)" >&2; exit 1; }
  case "$P" in /*) ;; *) P="$HOME/$P" ;; esac
  [ -d "$P" ] || { printf '%s\n' "$(msg project_missing '%s')""$P" >&2; exit 1; }
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  case "{{includeBuiltin}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean_in 'includeBuiltin' 'list_shaders')""{{includeBuiltin}}" >&2; exit 1 ;; esac
  set -- command --project-path "$P" list_shaders
  [ -n "{{filter}}" ] && set -- "$@" --filter "{{filter}}"
  [ -n "{{includeBuiltin}}" ] && set -- "$@" --includeBuiltin "{{includeBuiltin}}"
  [ -n "{{limit}}" ] && set -- "$@" --limit "{{limit}}"

  OUT=$(timeout 90 "$CLI" --no-banner --no-pager --non-interactive --format json "$@" </dev/null 2>&1)
  printf '%s' "$OUT" | jq -e '.success == true' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | jq -r '.errors[0].message // .errors[0].code // "reponse illisible du CLI"' 2>/dev/null || printf '%s' "$OUT")" >&2; exit 1; }
  printf '%s\n' "$OUT" | jq -c '.data'

ARGS:
  - {name: filter, type: text}
  - {name: includeBuiltin, type: text}          # true|false, empty to set nothing
  - {name: limit, type: int}
