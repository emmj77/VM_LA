id: "U460"
tool: "coplay_graphics_feature"
date: "2026-10-17"
tags: ["coplay_graphics_feature"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "a renderer feature: add | configure | list | remove | reorder | toggle (op picks which)"

COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing)" >&2; exit 1; }
  case "{{op}}" in
  add)
    set -f
    set -- graphics feature-add
    [ -n "{{feature_type}}" ] && set -- "$@" --type "{{feature_type}}"
    [ -n "{{name}}" ] && set -- "$@" --name "{{name}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  configure)
    set -f
    set -- graphics feature-configure
    T=$(printf '%s' "{{prop}}" | tr -d '0123456789. -')
    [ -z "$T" ] || { printf '%s\n' "$(msg expects_space_separated_numbers 'prop' '2' '%s')""{{prop}}" >&2; exit 1; }
    unset T
    [ -n "{{index}}" ] && set -- "$@" --index "{{index}}"
    [ -n "{{name}}" ] && set -- "$@" --name "{{name}}"
    [ -n "{{prop}}" ] && set -- "$@" --prop {{prop}}
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  list)
    set -f
    set -- graphics feature-list
    :
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  remove)
    set -f
    set -- graphics feature-remove
    [ -n "{{index}}" ] && set -- "$@" --index "{{index}}"
    [ -n "{{name}}" ] && set -- "$@" --name "{{name}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  reorder)
    set -f
    set -- graphics feature-reorder
    [ -n "{{order}}" ] && set -- "$@" --order "{{order}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  toggle)
    set -f
    set -- graphics feature-toggle
    case "{{active}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean 'active')" >&2; exit 1 ;; esac
    [ -n "{{index}}" ] && set -- "$@" --index "{{index}}"
    [ -n "{{name}}" ] && set -- "$@" --name "{{name}}"
    [ "{{active}}" = true ] && set -- "$@" --active
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  esac

ARGS:
  - {name: op, type: enum, values: [add, configure, list, remove, reorder, toggle]}
  - {name: feature_type, type: text}
  - {name: index, type: int}
  - {name: name, type: text}
  - {name: order, type: text}
  - {name: active, type: text}
  - {name: prop, type: text}
