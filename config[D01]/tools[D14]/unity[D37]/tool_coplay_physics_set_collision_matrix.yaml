id: "U200"
tool: "coplay_physics_set_collision_matrix"
date: "2026-10-18"
tags: ["unity", "coplay", "physics"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Set collision between two layers."

COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing_paths)" >&2; exit 1; }
  set -f
  set -- physics set-collision-matrix
  case "{{collide}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean 'collide')" >&2; exit 1 ;; esac
  [ -n "{{layer_a}}" ] || { printf '%s\n' "$(msg argument_required 'layer_a' 'physics set-collision-matrix')" >&2; exit 1; }
  [ -n "{{layer_b}}" ] || { printf '%s\n' "$(msg argument_required 'layer_b' 'physics set-collision-matrix')" >&2; exit 1; }
  [ "{{collide}}" = true ] && set -- "$@" --collide
  [ -n "{{dimension}}" ] && set -- "$@" --dimension "{{dimension}}"
  [ -n "{{layer_a}}" ] && set -- "$@" "{{layer_a}}"
  [ -n "{{layer_b}}" ] && set -- "$@" "{{layer_b}}"

  OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
  RC=$?
  [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
  printf '%s\n' "$OUT"

ARGS:
  - {name: collide, type: text}          # true pour poser le drapeau, vide sinon
  - {name: dimension, type: text}
  - {name: layer_a, type: text}
  - {name: layer_b, type: text}
