id: "U249"
tool: "unity_cache_key"
date: "2026-10-18"
tags: ["unity", "cli", "cache"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Print a deterministic cache key for CI cache steps"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- cache key --no-banner --no-pager --non-interactive


  [ -n "{{path}}" ] && set -- "$@" "{{path}}"
  [ -n "{{target}}" ] && set -- "$@" --target "{{target}}"
  [ -n "{{component}}" ] && set -- "$@" --component "{{component}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_cache_key_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: path, type: text}   # facultatif
  - {name: target, type: text}   # Tie the key to a Unity build target
  - {name: component, type: text}   # Print only one component of the key: editor, packages, or target
