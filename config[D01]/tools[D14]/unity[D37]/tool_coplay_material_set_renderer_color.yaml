id: "U188"
tool: "coplay_material_set_renderer_color"
date: "2026-10-18"
tags: ["unity", "coplay", "material"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Set a renderer's material color directly."

COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing_paths)" >&2; exit 1; }
  set -f
  set -- material set-renderer-color
  [ -n "{{target}}" ] || { printf '%s\n' "$(msg argument_required 'target' 'material set-renderer-color')" >&2; exit 1; }
  [ -n "{{r}}" ] || { printf '%s\n' "$(msg argument_required 'r' 'material set-renderer-color')" >&2; exit 1; }
  [ -n "{{g}}" ] || { printf '%s\n' "$(msg argument_required 'g' 'material set-renderer-color')" >&2; exit 1; }
  [ -n "{{b}}" ] || { printf '%s\n' "$(msg argument_required 'b' 'material set-renderer-color')" >&2; exit 1; }
  [ -n "{{a}}" ] || { printf '%s\n' "$(msg argument_required 'a' 'material set-renderer-color')" >&2; exit 1; }
  [ -n "{{search_method}}" ] && set -- "$@" --search-method "{{search_method}}"
  [ -n "{{mode}}" ] && set -- "$@" --mode "{{mode}}"
  [ -n "{{target}}" ] && set -- "$@" "{{target}}"
  [ -n "{{r}}" ] && set -- "$@" "{{r}}"
  [ -n "{{g}}" ] && set -- "$@" "{{g}}"
  [ -n "{{b}}" ] && set -- "$@" "{{b}}"
  [ -n "{{a}}" ] && set -- "$@" "{{a}}"

  OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
  RC=$?
  [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
  printf '%s\n' "$OUT"

ARGS:
  - {name: search_method, type: text}          # one of: by_id | by_name | by_path | by_tag | by_layer | by_component
  - {name: mode, type: text}          # one of: shared | instance | property_block | create_unique
  - {name: target, type: text}
  - {name: r, type: text}
  - {name: g, type: text}
  - {name: b, type: text}
  - {name: a, type: text}
