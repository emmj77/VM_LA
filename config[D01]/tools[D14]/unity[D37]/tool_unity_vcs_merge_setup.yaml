id: "U430"
tool: "unity_vcs_merge_setup"
date: "2026-10-18"
tags: ["unity", "cli", "vcs"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Make Unity scene and prefab merges work in this repository, using the editor's UnityYAMLMerge tool"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- vcs merge-setup --no-banner --no-pager --non-interactive
  case "{{check}}" in ''|true|false) ;; *) printf '%s\n' "$(msg check_true_false)" >&2; exit 1 ;; esac
  case "{{skip_verify}}" in ''|true|false) ;; *) printf '%s\n' "$(msg skip_verify_true_false)" >&2; exit 1 ;; esac

  [ -n "{{path}}" ] && set -- "$@" "{{path}}"
  [ -n "{{editor_version}}" ] && set -- "$@" --editor-version "{{editor_version}}"
  [ -n "{{editor_path}}" ] && set -- "$@" --editor-path "{{editor_path}}"
  [ "{{check}}" = true ] && set -- "$@" --check
  [ "{{skip_verify}}" = true ] && set -- "$@" --skip-verify
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_vcs_merge_setup)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: path, type: text}   # facultatif
  - {name: editor_version, type: text}   # Use this editor version's merge tool instead of the one the project re
  - {name: editor_path, type: text}   # Use this editor installation instead of the one the project requires
  - {name: check, type: text}   # true to set --check ; Report what needs setting up and write nothing. Exits 4 when work rema
  - {name: skip_verify, type: text}   # true to set --skip-verify ; Skip the test merge that proves the tool runs
