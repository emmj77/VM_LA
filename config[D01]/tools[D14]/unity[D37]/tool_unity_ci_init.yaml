id: "U251"
tool: "unity_ci_init"
date: "2026-10-18"
tags: ["unity", "unity", "project", "write"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Write a CI workflow that installs the CLI, restores the caches, installs the editor, activates a license, tests, and builds"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- ci init --no-banner --no-pager --non-interactive
  case "{{overwrite}}" in ''|true|false) ;; *) printf '%s\n' "$(msg overwrite_true_false)" >&2; exit 1 ;; esac
  case "{{dry_run}}" in ''|true|false) ;; *) printf '%s\n' "$(msg dry_run_true_false)" >&2; exit 1 ;; esac

  [ -n "{{project_path}}" ] && set -- "$@" --project-path "{{project_path}}"
  [ -n "{{provider}}" ] && set -- "$@" --provider "{{provider}}"
  [ -n "{{target}}" ] && set -- "$@" --target "{{target}}"
  [ -n "{{shards}}" ] && set -- "$@" --shards "{{shards}}"
  [ "{{overwrite}}" = true ] && set -- "$@" --overwrite
  [ "{{dry_run}}" = true ] && set -- "$@" --dry-run
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_ci_init_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: project_path, type: text}   # Path to the Unity project (defaults to the current directory)
  - {name: provider, type: text}   # CI provider to generate a workflow for
  - {name: target, type: text}   # Build target the generated workflow builds
  - {name: shards, type: text}   # Split the tests across this many parallel jobs (omit for a single job)
  - {name: overwrite, type: text}   # true to set --overwrite ; Replace an existing workflow file
  - {name: dry_run, type: text}   # true to set --dry-run ; Print the workflow to stdout without writing it
