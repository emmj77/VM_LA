id: "U159"
tool: "coplay_camera_ensure_brain"
date: "2026-10-18"
tags: ["unity", "unity", "scene", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Ensure CinemachineBrain exists on main..."

COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing_paths)" >&2; exit 1; }
  set -f
  set -- camera ensure-brain
  [ -n "{{camera_ref}}" ] && set -- "$@" --camera-ref "{{camera_ref}}"
  [ -n "{{blend_style}}" ] && set -- "$@" --blend-style "{{blend_style}}"
  [ -n "{{blend_duration}}" ] && set -- "$@" --blend-duration "{{blend_duration}}"

  OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
  RC=$?
  [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
  printf '%s\n' "$OUT"

ARGS:
  - {name: camera_ref, type: text}
  - {name: blend_style, type: text}
  - {name: blend_duration, type: text}
