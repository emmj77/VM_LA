id: "U417"
tool: "unity_test"
date: "2026-10-18"
tags: ["unity", "cli", "test"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Run a project's EditMode/PlayMode tests in the editor and write a results report"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- test --no-banner --no-pager --non-interactive
  case "{{rerun_failed}}" in ''|true|false) ;; *) printf '%s\n' "$(msg rerun_failed_true_false)" >&2; exit 1 ;; esac
  case "{{affected}}" in ''|true|false) ;; *) printf '%s\n' "$(msg affected_true_false)" >&2; exit 1 ;; esac
  case "{{affected_compare}}" in ''|true|false) ;; *) printf '%s\n' "$(msg affected_compare_true_false)" >&2; exit 1 ;; esac
  case "{{coverage}}" in ''|true|false) ;; *) printf '%s\n' "$(msg coverage_true_false)" >&2; exit 1 ;; esac
  case "{{allow_install}}" in ''|true|false) ;; *) printf '%s\n' "$(msg allow_install_true_false)" >&2; exit 1 ;; esac
  case "{{no_accelerator}}" in ''|true|false) ;; *) printf '%s\n' "$(msg accelerator_true_false)" >&2; exit 1 ;; esac

  [ -n "{{project}}" ] && set -- "$@" "{{project}}"
  [ -n "{{mode}}" ] && set -- "$@" --mode "{{mode}}"
  [ -n "{{filter}}" ] && set -- "$@" --filter "{{filter}}"
  [ -n "{{output}}" ] && set -- "$@" --output "{{output}}"
  [ -n "{{report_format}}" ] && set -- "$@" --report-format "{{report_format}}"
  [ -n "{{junit_output}}" ] && set -- "$@" --junit-output "{{junit_output}}"
  [ -n "{{shard}}" ] && set -- "$@" --shard "{{shard}}"
  [ -n "{{shard_inventory}}" ] && set -- "$@" --shard-inventory "{{shard_inventory}}"
  [ -n "{{retries}}" ] && set -- "$@" --retries "{{retries}}"
  [ "{{rerun_failed}}" = true ] && set -- "$@" --rerun-failed
  [ "{{affected}}" = true ] && set -- "$@" --affected
  [ "{{affected_compare}}" = true ] && set -- "$@" --affected-compare
  [ -n "{{since}}" ] && set -- "$@" --since "{{since}}"
  [ "{{coverage}}" = true ] && set -- "$@" --coverage
  [ -n "{{coverage_output}}" ] && set -- "$@" --coverage-output "{{coverage_output}}"
  [ -n "{{coverage_options}}" ] && set -- "$@" --coverage-options "{{coverage_options}}"
  [ -n "{{editor_version}}" ] && set -- "$@" --editor-version "{{editor_version}}"
  [ -n "{{editor_path}}" ] && set -- "$@" --editor-path "{{editor_path}}"
  [ -n "{{architecture}}" ] && set -- "$@" --architecture "{{architecture}}"
  [ "{{allow_install}}" = true ] && set -- "$@" --allow-install
  [ -n "{{timeout}}" ] && set -- "$@" --timeout "{{timeout}}"
  [ -n "{{accelerator}}" ] && set -- "$@" --accelerator "{{accelerator}}"
  [ "{{no_accelerator}}" = true ] && set -- "$@" --no-accelerator
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_test_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: project, type: text}   # facultatif
  - {name: mode, type: text}   # Test platform to run: EditMode or PlayMode. If omitted, the editor's d
  - {name: filter, type: text}   # Run only tests whose names match this filter
  - {name: output, type: text}   # Path to write the results report (NUnit XML by default)
  - {name: report_format, type: text}   # Report formats to produce, comma-separated: nunit, junit, or both
  - {name: junit_output, type: text}   # Path to write the JUnit report to when both report formats are produce
  - {name: shard, type: text}   # Run only one slice of the suite, written as N/M, so parallel CI jobs c
  - {name: shard_inventory, type: text}   # Path to the results report a full run wrote, whose test list the shard
  - {name: retries, type: text}   # Re-run failing tests up to this many extra times (0-10), and report an
  - {name: rerun_failed, type: text}   # true to set --rerun-failed ; Run only the tests that failed in the previous run's results report, i
  - {name: affected, type: text}   # true to set --affected ; Run only the tests a change can reach, from the guid impact graph; run
  - {name: affected_compare, type: text}   # true to set --affected-compare ; Run every test, then report what affected-test selection would have sk
  - {name: since, type: text}   # Revision to compare against. Its merge base with HEAD is used. Default
  - {name: coverage, type: text}   # true to set --coverage ; Collect code coverage (requires the Unity Code Coverage package in the
  - {name: coverage_output, type: text}   # Directory to write the coverage report to (default: CodeCoverage)
  - {name: coverage_options, type: text}   # Semicolon-separated options passed through to the Code Coverage packag
  - {name: editor_version, type: text}   # Override editor version (default: from ProjectVersion.txt)
  - {name: editor_path, type: text}   # Path to a specific editor binary
  - {name: architecture, type: text}   # Editor architecture (x86_64 or arm64)
  - {name: allow_install, type: text}   # true to set --allow-install ; Install the project's editor version if it is not already installed
  - {name: timeout, type: text}   # Kill the Unity process after this many seconds (disabled by default)
  - {name: accelerator, type: text}   # Unity Accelerator endpoint for this invocation. A bare host defaults t
  - {name: no_accelerator, type: text}   # true to set --no-accelerator ; Ignore any configured Unity Accelerator for this invocation
