id: "U108"
tool: "upipe_run_tests"
date: "2026-10-18"
tags: ["unity", "pipeline", "run_tests"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Execute Unity tests with filtering options."

COMMAND: |
  PROJ=$(sed -n '1p' "$ROOT/projects/.active" 2>/dev/null | tr -d '\r')
  P=
  [ -n "$PROJ" ] && P=$(sed -n 's/^path:[[:space:]]*//p' "$ROOT/projects/$PROJ/project.yml" 2>/dev/null | head -1 | tr -d '"')
  [ -n "$P" ] || { printf '%s\n' "$(msg no_project_loaded)" >&2; exit 1; }
  case "$P" in /*) ;; *) P="$HOME/$P" ;; esac
  [ -d "$P" ] || { printf '%s\n' "$(msg project_missing '%s')""$P" >&2; exit 1; }
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  case "{{include_explicit}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean_in 'include_explicit' 'run_tests')""{{include_explicit}}" >&2; exit 1 ;; esac
  case "{{async_tests}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean_in 'async_tests' 'run_tests')""{{async_tests}}" >&2; exit 1 ;; esac
  set -- command --project-path "$P" run_tests
  [ -n "{{mode}}" ] && set -- "$@" --mode "{{mode}}"
  [ -n "{{filter}}" ] && set -- "$@" --filter "{{filter}}"
  [ -n "{{filter_type}}" ] && set -- "$@" --filter_type "{{filter_type}}"
  [ -n "{{include_explicit}}" ] && set -- "$@" --include_explicit "{{include_explicit}}"
  [ -n "{{async_tests}}" ] && set -- "$@" --async_tests "{{async_tests}}"
  [ -n "{{timeout}}" ] && set -- "$@" --timeout "{{timeout}}"

  OUT=$(timeout 90 "$CLI" --no-banner --no-pager --non-interactive --format json "$@" </dev/null 2>&1)
  printf '%s' "$OUT" | jq -e '.success == true' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | jq -r '.errors[0].message // .errors[0].code // "reponse illisible du CLI"' 2>/dev/null || printf '%s' "$OUT")" >&2; exit 1; }
  printf '%s\n' "$OUT" | jq -c '.data'

ARGS:
  - {name: mode, type: text}
  - {name: filter, type: text}
  - {name: filter_type, type: text}
  - {name: include_explicit, type: text}          # true|false, empty to set nothing
  - {name: async_tests, type: text}          # true|false, empty to set nothing
  - {name: timeout, type: int}
