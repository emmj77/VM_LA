id: "U480"
tool: "coplay_vfx_line"
date: "2026-10-17"
tags: ["coplay_vfx_line"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "a line renderer: clear | create-circle | create-line | info | set-positions (op picks which)"

COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing)" >&2; exit 1; }
  case "{{op}}" in
  clear)
    set -f
    set -- vfx line clear
    [ -n "{{target}}" ] || { printf '%s\n' "$(msg argument_required 'target' 'vfx line clear')" >&2; exit 1; }
    [ -n "{{search_method}}" ] && set -- "$@" --search-method "{{search_method}}"
    [ -n "{{component_index}}" ] && set -- "$@" --component-index "{{component_index}}"
    [ -n "{{target}}" ] && set -- "$@" "{{target}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  create-circle)
    set -f
    set -- vfx line create-circle
    T=$(printf '%s' "{{center}}" | tr -d '0123456789. -')
    [ -z "$T" ] || { printf '%s\n' "$(msg expects_space_separated_numbers 'center' '3' '%s')""{{center}}" >&2; exit 1; }
    unset T
    [ -n "{{target}}" ] || { printf '%s\n' "$(msg argument_required 'target' 'vfx line create-circle')" >&2; exit 1; }
    [ -n "{{center}}" ] && set -- "$@" --center {{center}}
    [ -n "{{radius}}" ] && set -- "$@" --radius "{{radius}}"
    [ -n "{{segments}}" ] && set -- "$@" --segments "{{segments}}"
    [ -n "{{search_method}}" ] && set -- "$@" --search-method "{{search_method}}"
    [ -n "{{component_index}}" ] && set -- "$@" --component-index "{{component_index}}"
    [ -n "{{target}}" ] && set -- "$@" "{{target}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  create-line)
    set -f
    set -- vfx line create-line
    T=$(printf '%s' "{{start}}" | tr -d '0123456789. -')
    [ -z "$T" ] || { printf '%s\n' "$(msg expects_space_separated_numbers 'start' '3' '%s')""{{start}}" >&2; exit 1; }
    unset T
    T=$(printf '%s' "{{end}}" | tr -d '0123456789. -')
    [ -z "$T" ] || { printf '%s\n' "$(msg expects_space_separated_numbers 'end' '3' '%s')""{{end}}" >&2; exit 1; }
    unset T
    [ -n "{{target}}" ] || { printf '%s\n' "$(msg argument_required 'target' 'vfx line create-line')" >&2; exit 1; }
    [ -n "{{start}}" ] && set -- "$@" --start {{start}}
    [ -n "{{end}}" ] && set -- "$@" --end {{end}}
    [ -n "{{search_method}}" ] && set -- "$@" --search-method "{{search_method}}"
    [ -n "{{component_index}}" ] && set -- "$@" --component-index "{{component_index}}"
    [ -n "{{target}}" ] && set -- "$@" "{{target}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  info)
    set -f
    set -- vfx line info
    [ -n "{{target}}" ] || { printf '%s\n' "$(msg argument_required 'target' 'vfx line info')" >&2; exit 1; }
    [ -n "{{search_method}}" ] && set -- "$@" --search-method "{{search_method}}"
    [ -n "{{component_index}}" ] && set -- "$@" --component-index "{{component_index}}"
    [ -n "{{target}}" ] && set -- "$@" "{{target}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  set-positions)
    set -f
    set -- vfx line set-positions
    [ -n "{{target}}" ] || { printf '%s\n' "$(msg argument_required 'target' 'vfx line set-positions')" >&2; exit 1; }
    [ -n "{{positions}}" ] && set -- "$@" --positions "{{positions}}"
    [ -n "{{search_method}}" ] && set -- "$@" --search-method "{{search_method}}"
    [ -n "{{component_index}}" ] && set -- "$@" --component-index "{{component_index}}"
    [ -n "{{target}}" ] && set -- "$@" "{{target}}"
    OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
    RC=$?
    [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
    printf '%s\n' "$OUT"
    ;;
  esac

ARGS:
  - {name: op, type: enum, values: [clear, create-circle, create-line, info, set-positions]}
  - {name: target, type: text}
  - {name: component_index, type: int}
  - {name: positions, type: text}
  - {name: radius, type: text}
  - {name: search_method, type: text}
  - {name: segments, type: int}
  - {name: center, type: text}
  - {name: end, type: text}
  - {name: start, type: text}
