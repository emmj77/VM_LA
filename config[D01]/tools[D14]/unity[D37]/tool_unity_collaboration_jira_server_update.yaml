id: "U303"
tool: "unity_collaboration_jira_server_update"
date: "2026-10-18"
tags: ["unity", "cli", "collaboration"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Update a Jira server configuration"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- collaboration jira server update --no-banner --no-pager --non-interactive
  [ -n "{{serverconfigid}}" ] || { printf '%s\n' "$(msg argument_required 'serverconfigid' 'unity collaboration jira server update')" >&2; exit 1; }

  [ -n "{{serverconfigid}}" ] && set -- "$@" "{{serverconfigid}}"
  [ -n "{{organization_id}}" ] && set -- "$@" --organization-id "{{organization_id}}"
  [ -n "{{url}}" ] && set -- "$@" --url "{{url}}"
  [ -n "{{username}}" ] && set -- "$@" --username "{{username}}"
  [ -n "{{key}}" ] && set -- "$@" --key "{{key}}"
  [ -n "{{name}}" ] && set -- "$@" --name "{{name}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_collaboration_jira_server_3)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: serverconfigid, type: text}
  - {name: organization_id, type: text}   # Unity organization ID
  - {name: url, type: text}   # New URL of the Jira server
  - {name: username, type: text}   # New username for Jira authentication
  - {name: key, type: text}   # New API key for Jira authentication
  - {name: name, type: text}   # New display name for this server configuration
