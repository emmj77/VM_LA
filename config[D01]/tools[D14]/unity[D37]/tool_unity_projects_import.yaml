id: "U390"
tool: "unity_projects_import"
date: "2026-10-18"
tags: ["unity", "unity", "project", "import"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Import a Hub project list from a previously exported JSON file"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- projects import --no-banner --no-pager --non-interactive


  [ -n "{{file}}" ] && set -- "$@" "{{file}}"
  [ -n "{{input}}" ] && set -- "$@" --input "{{input}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_projects_import_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: file, type: text}   # facultatif
  - {name: input, type: text}   # Read the export JSON from a file
