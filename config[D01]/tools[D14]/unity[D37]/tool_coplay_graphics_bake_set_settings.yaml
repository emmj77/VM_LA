id: "U171"
tool: "coplay_graphics_bake_set_settings"
date: "2026-10-18"
tags: ["unity", "unity", "scene", "set"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Set lighting/bake settings."

COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing_paths)" >&2; exit 1; }
  set -f
  set -- graphics bake-set-settings
  T=$(printf '%s' "{{setting}}" | tr -d '0123456789. -')
  [ -z "$T" ] || { printf '%s\n' "$(msg expects_space_separated_numbers 'setting' '2' '%s')""{{setting}}" >&2; exit 1; }
  unset T
  [ -n "{{setting}}" ] && set -- "$@" --setting {{setting}}

  OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
  RC=$?
  [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
  printf '%s\n' "$OUT"

ARGS:
  - {name: setting, type: text}          # 2 nombres : x y z
