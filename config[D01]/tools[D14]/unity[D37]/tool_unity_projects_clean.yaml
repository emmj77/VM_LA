id: "U384"
tool: "unity_projects_clean"
date: "2026-10-18"
tags: ["unity", "cli", "projects"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Delete a project's regenerable cache folders (Library, Temp, Logs, …) to reclaim disk space"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- projects clean --no-banner --no-pager --non-interactive
  case "{{dry_run}}" in ''|true|false) ;; *) printf '%s\n' "$(msg dry_run_true_false)" >&2; exit 1 ;; esac
  case "{{yes}}" in ''|true|false) ;; *) printf '%s\n' "$(msg yes_true_false)" >&2; exit 1 ;; esac
  case "{{force}}" in ''|true|false) ;; *) printf '%s\n' "$(msg force_true_false)" >&2; exit 1 ;; esac

  [ -n "{{project}}" ] && set -- "$@" "{{project}}"
  [ "{{dry_run}}" = true ] && set -- "$@" --dry-run
  [ "{{yes}}" = true ] && set -- "$@" --yes
  [ "{{force}}" = true ] && set -- "$@" --force
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_projects_clean_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: project, type: text}   # facultatif
  - {name: dry_run, type: text}   # true pour poser --dry-run ; List the folders that would be deleted, with sizes, and delete nothing
  - {name: yes, type: text}   # true pour poser --yes ; Skip the confirmation prompt
  - {name: force, type: text}   # true pour poser --force ; Clean even when the running-editor check cannot be completed
