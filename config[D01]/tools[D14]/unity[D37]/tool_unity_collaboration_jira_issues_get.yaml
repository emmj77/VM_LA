id: "U287"
tool: "unity_collaboration_jira_issues_get"
date: "2026-10-18"
tags: ["unity", "unity", "project", "show"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Show details of a Jira issue"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- collaboration jira issues get --no-banner --no-pager --non-interactive
  [ -n "{{jiraissueid}}" ] || { printf '%s\n' "$(msg argument_required 'jiraissueid' 'unity collaboration jira issues get')" >&2; exit 1; }

  [ -n "{{jiraissueid}}" ] && set -- "$@" "{{jiraissueid}}"
  [ -n "{{project_id}}" ] && set -- "$@" --project-id "{{project_id}}"
  [ -n "{{project_path}}" ] && set -- "$@" --project-path "{{project_path}}"
  [ -n "{{jira_project_config_id}}" ] && set -- "$@" --jira-project-config-id "{{jira_project_config_id}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_collaboration_jira_issues_6)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: jiraissueid, type: text}
  - {name: project_id, type: text}   # Unity project ID
  - {name: project_path, type: text}   # Path to the Unity project (defaults to the current directory); used to
  - {name: jira_project_config_id, type: text}   # The Jira project configuration ID the issue belongs to
