id: "U239"
tool: "unity_auth_login"
date: "2026-10-18"
tags: ["unity", "unity", "process", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Sign in to your Unity account (opens browser, or pass --client-id/--client-secret for a service account)"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- auth login --no-banner --no-pager --non-interactive
  case "{{secret_from_stdin}}" in ''|true|false) ;; *) printf '%s\n' "$(msg secret_stdin_true_false)" >&2; exit 1 ;; esac
  case "{{no_store}}" in ''|true|false) ;; *) printf '%s\n' "$(msg store_true_false)" >&2; exit 1 ;; esac

  [ -n "{{client_id}}" ] && set -- "$@" --client-id "{{client_id}}"
  [ -n "{{client_secret}}" ] && set -- "$@" --client-secret "{{client_secret}}"
  [ "{{secret_from_stdin}}" = true ] && set -- "$@" --secret-from-stdin
  [ "{{no_store}}" = true ] && set -- "$@" --no-store
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_auth_login_code)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: client_id, type: text}   # Service-account key ID for non-interactive sign-in
  - {name: client_secret, type: text}   # Service-account secret key (prefer --secret-from-stdin in shared shell
  - {name: secret_from_stdin, type: text}   # true to set --secret-from-stdin ; Read the service-account secret from stdin (keeps it out of argv / ps)
  - {name: no_store, type: text}   # true to set --no-store ; Do not persist credentials to the keyring (mint in-process only)
