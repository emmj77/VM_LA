id: "U092"
tool: "upipe_package_list"
date: "2026-10-18"
tags: ["unity", "pipeline", "package_list"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Which packages to list: installed (default) | available (registry) | all (both). Returns the full result synchronously — available/all block until the registry query completes."

COMMAND: |
  PROJ=$(sed -n '1p' "$ROOT/projects/.active" 2>/dev/null | tr -d '\r')
  P=
  [ -n "$PROJ" ] && P=$(sed -n 's/^path:[[:space:]]*//p' "$ROOT/projects/$PROJ/project.yml" 2>/dev/null | head -1 | tr -d '"')
  [ -n "$P" ] || { printf '%s\n' "$(msg no_project_loaded)" >&2; exit 1; }
  case "$P" in /*) ;; *) P="$HOME/$P" ;; esac
  [ -d "$P" ] || { printf '%s\n' "$(msg project_missing '%s')""$P" >&2; exit 1; }
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  case "{{include_indirect}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean_in 'include_indirect' 'package_list')""{{include_indirect}}" >&2; exit 1 ;; esac
  case "{{offline}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean_in 'offline' 'package_list')""{{offline}}" >&2; exit 1 ;; esac
  set -- command --project-path "$P" package_list
  [ -n "{{package_set}}" ] && set -- "$@" --scope "{{package_set}}"
  [ -n "{{include_indirect}}" ] && set -- "$@" --include_indirect "{{include_indirect}}"
  [ -n "{{offline}}" ] && set -- "$@" --offline "{{offline}}"

  OUT=$(timeout 90 "$CLI" --no-banner --no-pager --non-interactive --format json "$@" </dev/null 2>&1)
  printf '%s' "$OUT" | jq -e '.success == true' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | jq -r '.errors[0].message // .errors[0].code // "reponse illisible du CLI"' 2>/dev/null || printf '%s' "$OUT")" >&2; exit 1; }
  printf '%s\n' "$OUT" | jq -c '.data'

ARGS:
  - {name: package_set, type: text}   # installed | available | all, passed to upipe as --scope
  - {name: include_indirect, type: text}          # true|false, vide pour ne rien poser
  - {name: offline, type: text}          # true|false, vide pour ne rien poser
