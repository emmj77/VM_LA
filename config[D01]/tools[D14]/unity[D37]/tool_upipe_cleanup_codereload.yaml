id: "U027"
tool: "upipe_cleanup_codereload"
date: "2026-10-18"
tags: ["unity", "unity", "text", "remove"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Remove old code reload DLL versions and clear registry."

COMMAND: |
  PROJ=$(sed -n '1p' "$ROOT/projects/.active" 2>/dev/null | tr -d '\r')
  P=
  [ -n "$PROJ" ] && P=$(sed -n 's/^path:[[:space:]]*//p' "$ROOT/projects/$PROJ/project.yml" 2>/dev/null | head -1 | tr -d '"')
  [ -n "$P" ] || { printf '%s\n' "$(msg no_project_loaded)" >&2; exit 1; }
  case "$P" in /*) ;; *) P="$HOME/$P" ;; esac
  [ -d "$P" ] || { printf '%s\n' "$(msg project_missing '%s')""$P" >&2; exit 1; }
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -n "{{assemblyDir}}" ] || { printf '%s\n' "$(msg argument_required 'assemblyDir' 'cleanup_codereload')" >&2; exit 1; }
  case "{{force_domain_reload}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean_in 'force_domain_reload' 'cleanup_codereload')""{{force_domain_reload}}" >&2; exit 1 ;; esac
  set -- command --project-path "$P" cleanup_codereload
  [ -n "{{assemblyDir}}" ] && set -- "$@" --assemblyDir "{{assemblyDir}}"
  [ -n "{{force_domain_reload}}" ] && set -- "$@" --force_domain_reload "{{force_domain_reload}}"

  OUT=$(timeout 90 "$CLI" --no-banner --no-pager --non-interactive --format json "$@" </dev/null 2>&1)
  printf '%s' "$OUT" | jq -e '.success == true' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | jq -r '.errors[0].message // .errors[0].code // "reponse illisible du CLI"' 2>/dev/null || printf '%s' "$OUT")" >&2; exit 1; }
  printf '%s\n' "$OUT" | jq -c '.data'

ARGS:
  - {name: assemblyDir, type: text}
  - {name: force_domain_reload, type: text}          # true|false, empty to set nothing
