id: "U026"
tool: "upipe_capture_scene_view"
date: "2026-10-18"
tags: ["unity", "unity", "render", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Render the active Scene View to a PNG. Same result contract and parameter interactions as `capture_game_view`: inline base64, or path-only when `save_path` is set (opt back in with `include_inline_ima"

COMMAND: |
  PROJ=$(sed -n '1p' "$(cfg abs project_active)" 2>/dev/null | tr -d '\r')
  P=
  [ -n "$PROJ" ] && P=$(sed -n 's/^path:[[:space:]]*//p' "$(project_dir "$PROJ")/project.yml" 2>/dev/null | head -1 | tr -d '"')
  [ -n "$P" ] || { printf '%s\n' "$(msg no_project_loaded)" >&2; exit 1; }
  case "$P" in /*) ;; *) P="$HOME/$P" ;; esac
  [ -d "$P" ] || { printf '%s\n' "$(msg project_missing '%s')""$P" >&2; exit 1; }
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  case "{{include_inline_image}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean_in 'include_inline_image' 'capture_scene_view')""{{include_inline_image}}" >&2; exit 1 ;; esac
  set -- command --project-path "$P" capture_scene_view
  [ -n "{{width}}" ] && set -- "$@" --width "{{width}}"
  [ -n "{{height}}" ] && set -- "$@" --height "{{height}}"
  [ -n "{{save_path}}" ] && set -- "$@" --save_path "{{save_path}}"
  [ -n "{{include_inline_image}}" ] && set -- "$@" --include_inline_image "{{include_inline_image}}"
  [ -n "{{max_resolution}}" ] && set -- "$@" --max_resolution "{{max_resolution}}"

  OUT=$(timeout 90 "$CLI" --no-banner --no-pager --non-interactive --format json "$@" </dev/null 2>&1)
  printf '%s' "$OUT" | jq -e '.success == true' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | jq -r '.errors[0].message // .errors[0].code // "reponse illisible du CLI"' 2>/dev/null || printf '%s' "$OUT")" >&2; exit 1; }
  printf '%s\n' "$OUT" | jq -c '.data'

ARGS:
  - {name: width, type: int}
  - {name: height, type: int}
  - {name: save_path, type: text}
  - {name: include_inline_image, type: text}          # true|false, empty to set nothing
  - {name: max_resolution, type: int}
