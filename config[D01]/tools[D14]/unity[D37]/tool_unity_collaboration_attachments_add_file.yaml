id: "U275"
tool: "unity_collaboration_attachments_add_file"
date: "2026-10-18"
tags: ["unity", "cli", "collaboration"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Add a file attachment to an annotation"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- collaboration attachments add file --no-banner --no-pager --non-interactive
  [ -n "{{annotationid}}" ] || { printf '%s\n' "$(msg argument_required 'annotationid' 'unity collaboration attachments add file')" >&2; exit 1; }
  [ -n "{{file}}" ] || { printf '%s\n' "$(msg argument_required 'file' 'unity collaboration attachments add file')" >&2; exit 1; }

  [ -n "{{annotationid}}" ] && set -- "$@" "{{annotationid}}"
  [ -n "{{file}}" ] && set -- "$@" "{{file}}"
  [ -n "{{name}}" ] && set -- "$@" --name "{{name}}"
  [ -n "{{content_type}}" ] && set -- "$@" --content-type "{{content_type}}"
  [ -n "{{project_id}}" ] && set -- "$@" --project-id "{{project_id}}"
  [ -n "{{project_path}}" ] && set -- "$@" --project-path "{{project_path}}"
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_collaboration_attachments_add_file_failed)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: annotationid, type: text}
  - {name: file, type: text}
  - {name: name, type: text}   # Display name for the attachment (defaults to filename)
  - {name: content_type, type: text}   # Override content-type (defaults to type inferred from file extension)
  - {name: project_id, type: text}   # Unity Cloud project id
  - {name: project_path, type: text}   # Path to the Unity project (defaults to the current directory); used to
