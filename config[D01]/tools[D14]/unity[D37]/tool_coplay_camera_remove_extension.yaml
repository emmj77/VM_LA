id: "U164"
tool: "coplay_camera_remove_extension"
date: "2026-10-18"
tags: ["unity", "coplay", "camera"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Remove extension from CinemachineCamera."

COMMAND: |
  CLI=${LA_UNITY_MCP:-}   # unity: mcp dans la_config, pose par le moteur
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_mcp_missing_paths)" >&2; exit 1; }
  set -f
  set -- camera remove-extension
  [ -n "{{target}}" ] || { printf '%s\n' "$(msg argument_required 'target' 'camera remove-extension')" >&2; exit 1; }
  [ -n "{{extension_type}}" ] || { printf '%s\n' "$(msg argument_required 'extension_type' 'camera remove-extension')" >&2; exit 1; }
  [ -n "{{search_method}}" ] && set -- "$@" --search-method "{{search_method}}"
  [ -n "{{target}}" ] && set -- "$@" "{{target}}"
  [ -n "{{extension_type}}" ] && set -- "$@" "{{extension_type}}"

  OUT=$(timeout 90 "$CLI" --format json "$@" 2>&1)
  RC=$?
  [ "$RC" = 0 ] || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | head -5 | tr '\n' ' ')" >&2; exit 1; }
  printf '%s\n' "$OUT"

ARGS:
  - {name: search_method, type: text}          # un de : by_id | by_name | by_path
  - {name: target, type: text}
  - {name: extension_type, type: text}
