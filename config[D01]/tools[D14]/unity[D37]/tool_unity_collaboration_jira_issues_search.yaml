id: "U290"
tool: "unity_collaboration_jira_issues_search"
date: "2026-10-18"
tags: ["unity", "unity", "config", "search"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "Search Jira issues in a project configuration"

COMMAND: |
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -x "$CLI" ] || { printf '%s\n' "$(msg unity_cli_missing)" >&2; exit 1; }
  set -f
  set -- collaboration jira issues search --no-banner --no-pager --non-interactive
  case "{{include_subtasks}}" in ''|true|false) ;; *) printf '%s\n' "$(msg include_subtasks_true_false)" >&2; exit 1 ;; esac

  [ -n "{{project_id}}" ] && set -- "$@" --project-id "{{project_id}}"
  [ -n "{{project_path}}" ] && set -- "$@" --project-path "{{project_path}}"
  [ -n "{{jira_project_config_id}}" ] && set -- "$@" --jira-project-config-id "{{jira_project_config_id}}"
  [ -n "{{query}}" ] && set -- "$@" --query "{{query}}"
  [ "{{include_subtasks}}" = true ] && set -- "$@" --include-subtasks
  ERR="${TMPDIR:-/tmp}/unity.$$.err"
  OUT=$(timeout 100 "$CLI" "$@" </dev/null 2>"$ERR")
  RC=$?
  if [ "$RC" != 0 ]; then
    M=$(head -6 "$ERR" | tr '\n' ' ')
    [ -n "$M" ] || M=$(printf '%s' "$OUT" | head -6 | tr '\n' ' ')
    rm -f "$ERR"
    printf '%s\n' "$(msg unity_collaboration_jira_issues_3)""$RC" "$M" >&2
    exit 1
  fi
  rm -f "$ERR"
  printf '%s\n' "$OUT"

ARGS:
  - {name: project_id, type: text}   # Unity project ID
  - {name: project_path, type: text}   # Path to the Unity project (defaults to the current directory); used to
  - {name: jira_project_config_id, type: text}   # The Jira project configuration ID to search
  - {name: query, type: text}   # Plain-text search query (not JQL)
  - {name: include_subtasks, type: text}   # true to set --include-subtasks ; Include sub-tasks in the results
