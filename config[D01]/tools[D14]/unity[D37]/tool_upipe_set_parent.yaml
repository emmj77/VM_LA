id: "U129"
tool: "upipe_set_parent"
date: "2026-10-18"
tags: ["unity", "unity", "scene", "set"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Reparent a GameObject under a new parent, or detach it to scene root when no parent is given."

COMMAND: |
  PROJ=$(sed -n '1p' "$ROOT/projects/.active" 2>/dev/null | tr -d '\r')
  P=
  [ -n "$PROJ" ] && P=$(sed -n 's/^path:[[:space:]]*//p' "$ROOT/projects/$PROJ/project.yml" 2>/dev/null | head -1 | tr -d '"')
  [ -n "$P" ] || { printf '%s\n' "$(msg no_project_loaded)" >&2; exit 1; }
  case "$P" in /*) ;; *) P="$HOME/$P" ;; esac
  [ -d "$P" ] || { printf '%s\n' "$(msg project_missing '%s')""$P" >&2; exit 1; }
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -n "{{target}}" ] || { printf '%s\n' "$(msg argument_required 'target' 'set_parent')" >&2; exit 1; }
  case "{{world_position_stays}}" in ''|true|false) ;; *) printf '%s\n' "$(msg bad_boolean_in 'world_position_stays' 'set_parent')""{{world_position_stays}}" >&2; exit 1 ;; esac
  set -- command --project-path "$P" set_parent
  [ -n "{{target}}" ] && set -- "$@" --target "{{target}}"
  [ -n "{{parent}}" ] && set -- "$@" --parent "{{parent}}"
  [ -n "{{world_position_stays}}" ] && set -- "$@" --world_position_stays "{{world_position_stays}}"

  OUT=$(timeout 90 "$CLI" --no-banner --no-pager --non-interactive --format json "$@" </dev/null 2>&1)
  printf '%s' "$OUT" | jq -e '.success == true' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | jq -r '.errors[0].message // .errors[0].code // "reponse illisible du CLI"' 2>/dev/null || printf '%s' "$OUT")" >&2; exit 1; }
  printf '%s\n' "$OUT" | jq -c '.data'

ARGS:
  - {name: target, type: text}
  - {name: parent, type: text}
  - {name: world_position_stays, type: text}          # true|false, empty to set nothing
