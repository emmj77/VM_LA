id: "U023"
tool: "upipe_capture_editor_element"
date: "2026-10-18"
tags: ["unity", "pipeline", "capture_editor_element"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Capture a UI Toolkit VisualElement (by selector) from an EditorWindow to a PNG; returns path + base64."

COMMAND: |
  PROJ=$(sed -n '1p' "$ROOT/projects/.active" 2>/dev/null | tr -d '\r')
  P=
  [ -n "$PROJ" ] && P=$(sed -n 's/^path:[[:space:]]*//p' "$ROOT/projects/$PROJ/project.yml" 2>/dev/null | head -1 | tr -d '"')
  [ -n "$P" ] || { printf '%s\n' "$(msg no_project_loaded)" >&2; exit 1; }
  case "$P" in /*) ;; *) P="$HOME/$P" ;; esac
  [ -d "$P" ] || { printf '%s\n' "$(msg project_missing '%s')""$P" >&2; exit 1; }
  CLI=${LA_UNITY_CLI:-}   # unity: cli in la_config, set by the engine
  [ -n "{{window}}" ] || { printf '%s\n' "$(msg argument_required 'window' 'capture_editor_element')" >&2; exit 1; }
  [ -n "{{selector}}" ] || { printf '%s\n' "$(msg argument_required 'selector' 'capture_editor_element')" >&2; exit 1; }
  set -- command --project-path "$P" capture_editor_element
  [ -n "{{window}}" ] && set -- "$@" --window "{{window}}"
  [ -n "{{selector}}" ] && set -- "$@" --selector "{{selector}}"
  [ -n "{{output}}" ] && set -- "$@" --output "{{output}}"

  OUT=$(timeout 90 "$CLI" --no-banner --no-pager --non-interactive --format json "$@" </dev/null 2>&1)
  printf '%s' "$OUT" | jq -e '.success == true' >/dev/null 2>&1 \
    || { printf '%s\n' "$(msg refused_generic)""$(printf '%s' "$OUT" | jq -r '.errors[0].message // .errors[0].code // "reponse illisible du CLI"' 2>/dev/null || printf '%s' "$OUT")" >&2; exit 1; }
  printf '%s\n' "$OUT" | jq -c '.data'

ARGS:
  - {name: window, type: text}
  - {name: selector, type: text}
  - {name: output, type: text}
