id: "B895"
tool: "blender_object_add"
date: "2026-10-17"
tags: ["blender", "blender", "object", "add"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Add an object to the scene"

machine: "blender"
op: "object.add"

ARGS:
  - {name: radius, type: text}
  - {name: type, type: text}          # one of: MESH | CURVE | SURFACE | META | FONT | CURVES | POINTCLOUD | VOLUME | GREASEPENCIL | ARMATURE | LATTICE | EMPTY | LIGHT | LIGHT_PROBE | CAMERA | SPEAKER
  - {name: enter_editmode, type: text}          # true|false, empty to set nothing
  - {name: align, type: text}          # one of: WORLD | VIEW | CURSOR
  - {name: location, type: text}          # 3 values separated by commas
  - {name: rotation, type: text}          # 3 values separated by commas
  - {name: scale, type: text}          # 3 values separated by commas
