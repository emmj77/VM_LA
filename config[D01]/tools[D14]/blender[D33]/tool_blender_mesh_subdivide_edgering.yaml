id: "B740"
tool: "blender_mesh_subdivide_edgering"
date: "2026-10-17"
tags: ["blender", "blender", "mesh", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Subdivide perpendicular edges to the selected edge-ring"

machine: "blender"
op: "mesh.subdivide_edgering"

ARGS:
  - {name: number_cuts, type: int}
  - {name: interpolation, type: text}          # one of: LINEAR | PATH | SURFACE
  - {name: smoothness, type: text}
  - {name: profile_shape_factor, type: text}
  - {name: profile_shape, type: text}          # one of: SMOOTH | SPHERE | ROOT | INVERSE_SQUARE | SHARP | LINEAR
