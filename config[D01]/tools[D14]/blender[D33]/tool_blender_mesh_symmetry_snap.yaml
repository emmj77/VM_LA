id: "B742"
tool: "blender_mesh_symmetry_snap"
date: "2026-10-17"
tags: ["blender_mesh_symmetry_snap"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Snap vertex pairs to their mirrored locations"

machine: "blender"
op: "mesh.symmetry_snap"

ARGS:
  - {name: direction, type: text}          # one of: NEGATIVE_X | POSITIVE_X | NEGATIVE_Y | POSITIVE_Y | NEGATIVE_Z | POSITIVE_Z
  - {name: threshold, type: text}
  - {name: factor, type: text}
  - {name: use_center, type: text}          # true|false, empty to set nothing
  - {name: use_topology, type: text}          # true|false, empty to set nothing
