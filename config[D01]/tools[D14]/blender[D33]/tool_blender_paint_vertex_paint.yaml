id: "B1122"
tool: "blender_paint_vertex_paint"
date: "2026-10-17"
tags: ["blender", "blender", "draw", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Paint a stroke in the active color attribute layer"

machine: "blender"
op: "paint.vertex_paint"

ARGS:
  - {name: stroke, type: text}
  - {name: mode, type: text}          # one of: NORMAL | INVERT
  - {name: brush_toggle, type: text}          # one of: None | SMOOTH | ERASE | MASK
  - {name: pen_flip, type: text}          # true|false, empty to set nothing
  - {name: override_location, type: text}          # true|false, empty to set nothing
