id: "B1495"
tool: "blender_uv_export_layout"
date: "2026-10-17"
tags: ["blender_uv_export_layout"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Export UV layout to file"

machine: "blender"
op: "uv.export_layout"

ARGS:
  - {name: filepath, type: text}
  - {name: export_all, type: text}          # true|false, vide pour ne rien poser
  - {name: export_tiles, type: text}          # un de : NONE | UDIM | UV
  - {name: modified, type: text}          # true|false, vide pour ne rien poser
  - {name: mode, type: text}          # un de : SVG | EPS | PNG
  - {name: size, type: int}
  - {name: opacity, type: text}
  - {name: check_existing, type: text}          # true|false, vide pour ne rien poser
