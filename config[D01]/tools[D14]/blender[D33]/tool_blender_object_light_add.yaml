id: "B967"
tool: "blender_object_light_add"
date: "2026-10-17"
tags: ["blender_object_light_add"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Add a light object to the scene"

machine: "blender"
op: "object.light_add"

ARGS:
  - {name: type, type: text}          # one of: POINT | SUN | SPOT | AREA
  - {name: radius, type: text}
  - {name: align, type: text}          # one of: WORLD | VIEW | CURSOR
  - {name: location, type: text}          # 3 values separated by commas
  - {name: rotation, type: text}          # 3 values separated by commas
  - {name: scale, type: text}          # 3 values separated by commas
