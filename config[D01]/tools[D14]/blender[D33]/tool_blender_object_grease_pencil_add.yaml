id: "B948"
tool: "blender_object_grease_pencil_add"
date: "2026-10-17"
tags: ["blender", "blender", "object", "add"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Add a Grease Pencil object to the scene"

machine: "blender"
op: "object.grease_pencil_add"

ARGS:
  - {name: type, type: text}          # one of: EMPTY | STROKE | MONKEY | LINEART_SCENE | LINEART_COLLECTION | LINEART_OBJECT
  - {name: use_in_front, type: text}          # true|false, empty to set nothing
  - {name: stroke_depth_offset, type: text}
  - {name: use_lights, type: text}          # true|false, empty to set nothing
  - {name: stroke_depth_order, type: text}          # one of: 2D | 3D
  - {name: radius, type: text}
  - {name: align, type: text}          # one of: WORLD | VIEW | CURSOR
  - {name: location, type: text}          # 3 values separated by commas
  - {name: rotation, type: text}          # 3 values separated by commas
  - {name: scale, type: text}          # 3 values separated by commas
