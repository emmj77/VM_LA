id: "B1329"
tool: "blender_sequencer_add_scene_strip_from_scene_asset"
date: "2026-10-17"
tags: ["blender_sequencer_add_scene_strip_from_scene_asset"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Add a strip using a duplicate of this scene asset as the source"

machine: "blender"
op: "sequencer.add_scene_strip_from_scene_asset"

ARGS:
  - {name: move_strips, type: text}          # true|false, empty to set nothing
  - {name: frame_start, type: int}
  - {name: channel, type: int}
  - {name: replace_sel, type: text}          # true|false, empty to set nothing
  - {name: overlap, type: text}          # true|false, empty to set nothing
  - {name: overlap_shuffle_override, type: text}          # true|false, empty to set nothing
  - {name: skip_locked_or_muted_channels, type: text}          # true|false, empty to set nothing
  - {name: asset_library_type, type: text}          # one of: ALL | LOCAL | ESSENTIALS | ONLINE_ESSENTIALS | CUSTOM
  - {name: asset_library_identifier, type: text}
  - {name: relative_asset_identifier, type: text}
