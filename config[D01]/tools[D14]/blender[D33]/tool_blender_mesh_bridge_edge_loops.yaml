id: "B627"
tool: "blender_mesh_bridge_edge_loops"
date: "2026-10-17"
tags: ["blender", "blender", "mesh", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Create a bridge of faces between two or more selected edge loops"

machine: "blender"
op: "mesh.bridge_edge_loops"

ARGS:
  - {name: type, type: text}          # one of: SINGLE | CLOSED | PAIRS
  - {name: use_merge, type: text}          # true|false, empty to set nothing
  - {name: merge_factor, type: text}
  - {name: twist_offset, type: int}
  - {name: number_cuts, type: int}
  - {name: interpolation, type: text}          # one of: LINEAR | PATH | SURFACE
  - {name: smoothness, type: text}
  - {name: profile_shape_factor, type: text}
  - {name: profile_shape, type: text}          # one of: SMOOTH | SPHERE | ROOT | INVERSE_SQUARE | SHARP | LINEAR
