id: "B673"
tool: "blender_mesh_knife_tool"
date: "2026-10-17"
tags: ["blender", "blender", "mesh", "cut"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Cut new topology"

machine: "blender"
op: "mesh.knife_tool"

ARGS:
  - {name: use_occlude_geometry, type: text}          # true|false, empty to set nothing
  - {name: only_selected, type: text}          # true|false, empty to set nothing
  - {name: xray, type: text}          # true|false, empty to set nothing
  - {name: visible_measurements, type: text}          # one of: NONE | BOTH | DISTANCE | ANGLE
  - {name: angle_snapping, type: text}          # one of: NONE | SCREEN | RELATIVE
  - {name: angle_snapping_increment, type: text}
  - {name: wait_for_input, type: text}          # true|false, empty to set nothing
