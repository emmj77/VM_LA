id: "B1502"
tool: "blender_uv_pack_islands"
date: "2026-10-17"
tags: ["blender", "blender", "mesh", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Transform all islands so that they fill up the UV/UDIM space as much as possible"

machine: "blender"
op: "uv.pack_islands"

ARGS:
  - {name: udim_source, type: text}          # one of: CLOSEST_UDIM | ACTIVE_UDIM | ORIGINAL_AABB | CUSTOM_REGION
  - {name: rotate, type: text}          # true|false, empty to set nothing
  - {name: rotate_method, type: text}          # one of: ANY | CARDINAL | AXIS_ALIGNED | AXIS_ALIGNED_X | AXIS_ALIGNED_Y
  - {name: scale, type: text}          # true|false, empty to set nothing
  - {name: merge_overlap, type: text}          # true|false, empty to set nothing
  - {name: margin_method, type: text}          # one of: SCALED | ADD | FRACTION
  - {name: margin, type: text}
  - {name: pin, type: text}          # true|false, empty to set nothing
  - {name: pin_method, type: text}          # one of: SCALE | ROTATION | ROTATION_SCALE | LOCKED
  - {name: shape_method, type: text}          # one of: CONCAVE | CONVEX | AABB
