id: "B1502"
tool: "blender_uv_pack_islands"
date: "2026-10-17"
tags: ["blender_uv_pack_islands"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Transform all islands so that they fill up the UV/UDIM space as much as possible"

machine: "blender"
op: "uv.pack_islands"

ARGS:
  - {name: udim_source, type: text}          # un de : CLOSEST_UDIM | ACTIVE_UDIM | ORIGINAL_AABB | CUSTOM_REGION
  - {name: rotate, type: text}          # true|false, vide pour ne rien poser
  - {name: rotate_method, type: text}          # un de : ANY | CARDINAL | AXIS_ALIGNED | AXIS_ALIGNED_X | AXIS_ALIGNED_Y
  - {name: scale, type: text}          # true|false, vide pour ne rien poser
  - {name: merge_overlap, type: text}          # true|false, vide pour ne rien poser
  - {name: margin_method, type: text}          # un de : SCALED | ADD | FRACTION
  - {name: margin, type: text}
  - {name: pin, type: text}          # true|false, vide pour ne rien poser
  - {name: pin_method, type: text}          # un de : SCALE | ROTATION | ROTATION_SCALE | LOCKED
  - {name: shape_method, type: text}          # un de : CONCAVE | CONVEX | AABB
