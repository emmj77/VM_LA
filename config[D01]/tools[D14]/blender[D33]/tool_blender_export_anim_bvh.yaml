id: "B314"
tool: "blender_export_anim_bvh"
date: "2026-10-17"
tags: ["blender_export_anim_bvh"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Save a BVH motion capture file from an armature"

machine: "blender"
op: "export_anim.bvh"

ARGS:
  - {name: filepath, type: text}
  - {name: check_existing, type: text}          # true|false, empty to set nothing
  - {name: filter_glob, type: text}
  - {name: global_scale, type: text}
  - {name: frame_start, type: int}
  - {name: frame_end, type: int}
  - {name: rotate_mode, type: text}          # one of: NATIVE | XYZ | XZY | YXZ | YZX | ZXY | ZYX
  - {name: root_transform_only, type: text}          # true|false, empty to set nothing
  - {name: sort_children_by_names, type: text}          # true|false, empty to set nothing
