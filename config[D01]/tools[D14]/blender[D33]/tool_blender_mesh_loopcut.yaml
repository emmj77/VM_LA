id: "B676"
tool: "blender_mesh_loopcut"
date: "2026-10-17"
tags: ["blender_mesh_loopcut"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Add a new loop between existing loops"

machine: "blender"
op: "mesh.loopcut"

ARGS:
  - {name: number_cuts, type: int}
  - {name: smoothness, type: text}
  - {name: falloff, type: text}          # one of: SMOOTH | SPHERE | ROOT | INVERSE_SQUARE | SHARP | LINEAR
  - {name: object_index, type: int}
  - {name: edge_index, type: int}
  - {name: mesh_select_mode_init, type: text}          # 3 values separated by commas
