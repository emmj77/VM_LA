id: "B435"
tool: "blender_grease_pencil_brush_stroke"
date: "2026-10-17"
tags: ["blender", "blender", "draw", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Draw a new stroke in the active Grease Pencil object"

machine: "blender"
op: "grease_pencil.brush_stroke"

ARGS:
  - {name: stroke, type: text}
  - {name: mode, type: text}          # one of: NORMAL | INVERT
  - {name: brush_toggle, type: text}          # one of: None | SMOOTH | ERASE | MASK
  - {name: pen_flip, type: text}          # true|false, empty to set nothing
