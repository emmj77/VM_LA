id: "B628"
tool: "blender_mesh_circularize"
date: "2026-10-17"
tags: ["blender", "blender", "mesh", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Shape selected geometry into a circle"

machine: "blender"
op: "mesh.circularize"

ARGS:
  - {name: factor, type: text}
  - {name: fit_method, type: text}          # one of: LEAST_SQUARE | CONTRACT
  - {name: angle, type: text}
  - {name: use_custom_radius, type: text}          # true|false, empty to set nothing
  - {name: custom_radius, type: text}
  - {name: regular, type: text}          # true|false, empty to set nothing
  - {name: flatten, type: text}
  - {name: lock, type: text}          # 3 values separated by commas
