  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Generic sculpt expand operator"

machine: "blender"
op: "sculpt.expand"

ARGS:
  - {name: target, type: text}          # one of: MASK | FACE_SETS | COLOR
