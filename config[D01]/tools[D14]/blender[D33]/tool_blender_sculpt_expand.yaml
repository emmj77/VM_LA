  - {name: use_falloff_gradient, type: text}          # true|false, empty to set nothing
  - {name: use_modify_active, type: text}          # true|false, empty to set nothing
  - {name: use_reposition_pivot, type: text}          # true|false, empty to set nothing
  - {name: max_geodesic_move_preview, type: int}
  - {name: use_auto_mask, type: text}          # true|false, empty to set nothing
  - {name: normal_falloff_smooth, type: int}
