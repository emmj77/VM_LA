id: "B346"
tool: "blender_file_select_box"
date: "2026-10-17"
tags: ["blender", "blender", "mesh", "select"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Activate/select the file(s) contained in the border"

machine: "blender"
op: "file.select_box"

ARGS:
  - {name: xmin, type: int}
  - {name: xmax, type: int}
  - {name: ymin, type: int}
  - {name: ymax, type: int}
  - {name: wait_for_input, type: text}          # true|false, empty to set nothing
  - {name: mode, type: text}          # one of: SET | ADD | SUB
