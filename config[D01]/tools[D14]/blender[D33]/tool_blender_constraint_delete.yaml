tags: ["blender_constraint_delete"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Remove constraint from constraint stack"

machine: "blender"
op: "constraint.delete"

ARGS:
  - {name: constraint, type: text}
