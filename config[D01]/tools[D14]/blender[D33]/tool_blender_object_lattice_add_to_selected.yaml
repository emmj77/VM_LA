id: "B966"
tool: "blender_object_lattice_add_to_selected"
date: "2026-10-17"
tags: ["blender", "blender", "object", "add"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Add a lattice and use it to deform selected objects"

machine: "blender"
op: "object.lattice_add_to_selected"

ARGS:
  - {name: fit_to_selected, type: text}          # true|false, empty to set nothing
  - {name: radius, type: text}
  - {name: margin, type: text}
  - {name: add_modifiers, type: text}          # true|false, empty to set nothing
  - {name: resolution_u, type: int}
  - {name: resolution_v, type: int}
  - {name: resolution_w, type: int}
  - {name: enter_editmode, type: text}          # true|false, empty to set nothing
  - {name: align, type: text}          # one of: WORLD | VIEW | CURSOR
  - {name: location, type: text}          # 3 values separated by commas
  - {name: rotation, type: text}          # 3 values separated by commas
  - {name: scale, type: text}          # 3 values separated by commas
