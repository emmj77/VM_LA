id: "B1183"
tool: "blender_pose_blend_to_neighbor"
date: "2026-10-17"
tags: ["blender", "blender", "animation", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Blend from current position to previous or next keyframe"

machine: "blender"
op: "pose.blend_to_neighbor"

ARGS:
  - {name: factor, type: text}
  - {name: prev_frame, type: int}
  - {name: next_frame, type: int}
  - {name: channels, type: text}          # one of: ALL | LOC | ROT | SIZE | BBONE | CUSTOM
  - {name: axis_lock, type: text}          # one of: FREE | X | Y | Z
