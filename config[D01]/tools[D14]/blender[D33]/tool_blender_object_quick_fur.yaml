id: "B1015"
tool: "blender_object_quick_fur"
date: "2026-10-17"
tags: ["blender", "blender", "object", "add"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Add a fur setup to the selected objects"

machine: "blender"
op: "object.quick_fur"

ARGS:
  - {name: density, type: text}          # one of: LOW | MEDIUM | HIGH
  - {name: length, type: text}
  - {name: radius, type: text}
  - {name: view_percentage, type: text}
  - {name: apply_hair_guides, type: text}          # true|false, empty to set nothing
  - {name: use_noise, type: text}          # true|false, empty to set nothing
  - {name: use_frizz, type: text}          # true|false, empty to set nothing
