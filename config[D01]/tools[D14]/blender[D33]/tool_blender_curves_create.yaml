id: "B1715"
tool: "blender_curves_create"
date: "2026-10-17"
tags: ["blender", "blender", "draw", "add"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "a new hair curve: add_bezier | add_circle | draw | pen (op picks which)"

machine: "blender"
op: "curves.{{op}}"

