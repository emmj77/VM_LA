id: "B1701"
tool: "blender_asset_catalog"
date: "2026-10-17"
tags: ["blender_asset_catalog"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "an asset catalog: delete | new | redo | undo | undo_push (op picks which)"

machine: "blender"
op: "asset.catalog_{{op}}"

ARGS:
  - {name: op, type: enum, values: [delete, new, redo, undo, undo_push]}
  - {name: catalog_id, type: text}
  - {name: parent_path, type: text}
