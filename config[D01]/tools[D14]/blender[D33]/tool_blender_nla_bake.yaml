id: "B760"
tool: "blender_nla_bake"
date: "2026-10-17"
tags: ["blender_nla_bake"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Bake all selected objects location/scale/rotation animation to an action"

machine: "blender"
op: "nla.bake"

ARGS:
  - {name: frame_start, type: int}
  - {name: frame_end, type: int}
  - {name: step, type: int}
  - {name: only_selected, type: text}          # true|false, empty to set nothing
  - {name: visual_keying, type: text}          # true|false, empty to set nothing
  - {name: clear_constraints, type: text}          # true|false, empty to set nothing
  - {name: clear_parents, type: text}          # true|false, empty to set nothing
  - {name: use_current_action, type: text}          # true|false, empty to set nothing
  - {name: clean_curves, type: text}          # true|false, empty to set nothing
  - {name: bake_types, type: text}          # one of: POSE | OBJECT
  - {name: channel_types, type: text}          # one of: LOCATION | ROTATION | SCALE | BBONE | PROPS
