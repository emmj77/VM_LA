id: "B1536"
tool: "blender_uv_unwrap"
date: "2026-10-17"
tags: ["blender", "blender", "object", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Unwrap the mesh of the object being edited"

machine: "blender"
op: "uv.unwrap"

ARGS:
  - {name: method, type: text}          # one of: ANGLE_BASED | CONFORMAL | MINIMUM_STRETCH
  - {name: fill_holes, type: text}          # true|false, empty to set nothing
  - {name: correct_aspect, type: text}          # true|false, empty to set nothing
  - {name: use_subsurf_data, type: text}          # true|false, empty to set nothing
  - {name: use_original_bounds, type: text}          # true|false, empty to set nothing
  - {name: margin_method, type: text}          # one of: SCALED | ADD | FRACTION
  - {name: margin, type: text}
  - {name: no_flip, type: text}          # true|false, empty to set nothing
  - {name: iterations, type: int}
  - {name: use_weights, type: text}          # true|false, empty to set nothing
  - {name: weight_group, type: text}
  - {name: weight_factor, type: text}
