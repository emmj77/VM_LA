tags: ["blender_pose_breakdown"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Create a suitable breakdown pose on the current frame"

machine: "blender"
op: "pose.breakdown"

ARGS:
