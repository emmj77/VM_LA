id: "B1644"
tool: "blender_wm_properties_edit"
date: "2026-10-17"
tags: ["blender_wm_properties_edit"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Change a custom property's type, or adjust how it is displayed in the interface"

machine: "blender"
op: "wm.properties_edit"

ARGS:
  - {name: data_path, type: text}
  - {name: property_name, type: text}
  - {name: property_type, type: text}          # un de : FLOAT | FLOAT_ARRAY | INT | INT_ARRAY | BOOL | BOOL_ARRAY | STRING | DATA_BLOCK | PYTHON
  - {name: is_overridable_library, type: text}          # true|false, vide pour ne rien poser
  - {name: description, type: text}
  - {name: use_soft_limits, type: text}          # true|false, vide pour ne rien poser
  - {name: array_length, type: int}
  - {name: default_int, type: int}
  - {name: min_int, type: int}
  - {name: max_int, type: int}
  - {name: soft_min_int, type: int}
  - {name: soft_max_int, type: int}
  - {name: step_int, type: int}
  - {name: default_bool, type: text}          # 32 valeurs separees par des virgules
  - {name: default_float, type: text}          # 32 valeurs separees par des virgules
  - {name: min_float, type: text}
  - {name: max_float, type: text}
  - {name: soft_min_float, type: text}
  - {name: soft_max_float, type: text}
  - {name: precision, type: int}
  - {name: step_float, type: text}
  - {name: subtype, type: text}          # un de :
  - {name: default_string, type: text}
  - {name: id_type, type: text}          # un de : ACTION | ARMATURE | BRUSH | CACHEFILE | CAMERA | COLLECTION | CURVE | CURVES | FONT | GREASEPENCIL | GREASEPENCIL_V3 | IMAGE | KEY | LATTICE | LIBRARY | LIGHT | LIGHT_PROBE | LINESTYLE | MASK | MATERIAL | MESH | META | MOVIECLIP | NODETREE | OBJECT | PAINTCURVE | PALETTE | PARTICLE | POINTCLOUD | SCENE | SCREEN | SOUND | SPEAKER | TEXT | TEXTURE | VOLUME | WINDOWMANAGER | WORKSPACE | WORLD
  - {name: eval_string, type: text}
