id: "B624"
tool: "blender_mesh_bevel"
date: "2026-10-17"
tags: ["blender", "blender", "mesh", "cut"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Cut into selected items at an angle to create bevel or chamfer"

machine: "blender"
op: "mesh.bevel"

ARGS:
  - {name: offset_type, type: text}          # one of: OFFSET | WIDTH | DEPTH | PERCENT | ABSOLUTE
  - {name: offset, type: text}
  - {name: profile_type, type: text}          # one of: SUPERELLIPSE | CUSTOM
  - {name: offset_pct, type: text}
  - {name: segments, type: int}
  - {name: profile, type: text}
  - {name: affect, type: text}          # one of: VERTICES | EDGES
  - {name: clamp_overlap, type: text}          # true|false, empty to set nothing
  - {name: loop_slide, type: text}          # true|false, empty to set nothing
  - {name: mark_seam, type: text}          # true|false, empty to set nothing
  - {name: mark_sharp, type: text}          # true|false, empty to set nothing
  - {name: material, type: int}
  - {name: harden_normals, type: text}          # true|false, empty to set nothing
  - {name: face_strength_mode, type: text}          # one of: NONE | NEW | AFFECTED | ALL
  - {name: miter_outer, type: text}          # one of: SHARP | PATCH | ARC
  - {name: miter_inner, type: text}          # one of: SHARP | ARC
  - {name: spread, type: text}
  - {name: vmesh_method, type: text}          # one of: ADJ | CUTOFF
  - {name: release_confirm, type: text}          # true|false, empty to set nothing
