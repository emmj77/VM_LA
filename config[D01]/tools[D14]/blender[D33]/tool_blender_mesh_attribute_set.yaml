id: "B621"
tool: "blender_mesh_attribute_set"
date: "2026-10-17"
tags: ["blender", "blender", "mesh", "set"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Set values of the active attribute for selected elements"

machine: "blender"
op: "mesh.attribute_set"

ARGS:
  - {name: value_float, type: text}
  - {name: value_float_vector_2d, type: text}          # 2 values separated by commas
  - {name: value_float_vector_3d, type: text}          # 3 values separated by commas
  - {name: value_float_vector_4d, type: text}          # 4 values separated by commas
  - {name: value_int, type: int}
  - {name: value_int_vector_2d, type: int}
  - {name: value_color, type: text}          # 4 values separated by commas
  - {name: value_bool, type: text}          # true|false, empty to set nothing
