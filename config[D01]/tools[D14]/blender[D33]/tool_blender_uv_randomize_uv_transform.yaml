id: "B1506"
tool: "blender_uv_randomize_uv_transform"
date: "2026-10-17"
tags: ["blender_uv_randomize_uv_transform"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Randomize the UV island's location, rotation, and scale"

machine: "blender"
op: "uv.randomize_uv_transform"

ARGS:
  - {name: random_seed, type: int}
  - {name: use_loc, type: text}          # true|false, empty to set nothing
  - {name: loc, type: text}          # 2 values separated by commas
  - {name: use_rot, type: text}          # true|false, empty to set nothing
  - {name: rot, type: text}
  - {name: use_scale, type: text}          # true|false, empty to set nothing
  - {name: scale_even, type: text}          # true|false, empty to set nothing
  - {name: scale, type: text}          # 2 values separated by commas
