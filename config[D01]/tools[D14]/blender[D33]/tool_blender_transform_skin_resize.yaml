id: "B1461"
tool: "blender_transform_skin_resize"
date: "2026-10-17"
tags: ["blender_transform_skin_resize"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Scale selected vertices' skin radii"

machine: "blender"
op: "transform.skin_resize"

ARGS:
  - {name: value, type: text}          # 3 values separated by commas
  - {name: orient_type, type: text}          # one of:
  - {name: orient_matrix, type: text}          # 9 values separated by commas
  - {name: orient_matrix_type, type: text}          # one of:
  - {name: constraint_axis, type: text}          # 3 values separated by commas
  - {name: mirror, type: text}          # true|false, empty to set nothing
  - {name: use_proportional_edit, type: text}          # true|false, empty to set nothing
  - {name: proportional_edit_falloff, type: text}          # one of: SMOOTH | SPHERE | ROOT | INVERSE_SQUARE | SHARP | LINEAR | CONSTANT | RANDOM
  - {name: proportional_size, type: text}
  - {name: use_proportional_connected, type: text}          # true|false, empty to set nothing
  - {name: use_proportional_projected, type: text}          # true|false, empty to set nothing
  - {name: snap, type: text}          # true|false, empty to set nothing
  - {name: snap_elements, type: text}          # one of: INCREMENT | GRID | VERTEX | EDGE | FACE | VOLUME | EDGE_MIDPOINT | EDGE_PERPENDICULAR | FACE_MIDPOINT | FACE_PROJECT | FACE_NEAREST
  - {name: use_snap_project, type: text}          # true|false, empty to set nothing
  - {name: snap_target, type: text}          # one of: CLOSEST | CENTER | MEDIAN | ACTIVE
  - {name: use_snap_self, type: text}          # true|false, empty to set nothing
  - {name: use_snap_edit, type: text}          # true|false, empty to set nothing
  - {name: use_snap_nonedit, type: text}          # true|false, empty to set nothing
  - {name: use_snap_selectable, type: text}          # true|false, empty to set nothing
  - {name: snap_point, type: text}          # 3 values separated by commas
  - {name: release_confirm, type: text}          # true|false, empty to set nothing
  - {name: use_accurate, type: text}          # true|false, empty to set nothing
