  - {name: filter_blender, type: text}          # true|false, empty to set nothing
  - {name: filter_backup, type: text}          # true|false, empty to set nothing
  - {name: filter_image, type: text}          # true|false, empty to set nothing
  - {name: filter_movie, type: text}          # true|false, empty to set nothing
  - {name: filter_python, type: text}          # true|false, empty to set nothing
  - {name: filter_font, type: text}          # true|false, empty to set nothing
  - {name: filter_sound, type: text}          # true|false, empty to set nothing
  - {name: filter_text, type: text}          # true|false, empty to set nothing
  - {name: filter_archive, type: text}          # true|false, empty to set nothing
  - {name: filter_btx, type: text}          # true|false, empty to set nothing
  - {name: filter_alembic, type: text}          # true|false, empty to set nothing
  - {name: filter_usd, type: text}          # true|false, empty to set nothing
  - {name: filter_obj, type: text}          # true|false, empty to set nothing
  - {name: filter_volume, type: text}          # true|false, empty to set nothing
  - {name: filter_folder, type: text}          # true|false, empty to set nothing
  - {name: filter_blenlib, type: text}          # true|false, empty to set nothing
  - {name: filemode, type: int}
