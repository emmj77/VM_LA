id: "B325"
tool: "blender_file_external_operation"
date: "2026-10-17"
tags: ["blender", "blender", "mesh", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Perform external operation on a file or folder"

machine: "blender"
op: "file.external_operation"

ARGS:
  - {name: operation, type: text}          # one of: OPEN | FOLDER_OPEN | EDIT | NEW | FIND | SHOW | PLAY | BROWSE | PREVIEW | PRINT | INSTALL | RUNAS | PROPERTIES | FOLDER_FIND | CMD
