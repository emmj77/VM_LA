id: "B1765"
tool: "blender_preferences_addon"
date: "2026-10-17"
tags: ["blender_preferences_addon"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "an add-on: disable | enable | expand | install | refresh | remove | show (op picks which)"

machine: "blender"
op: "preferences.addon_{{op}}"

ARGS:
  - {name: op, type: enum, values: [disable, enable, expand, install, refresh, remove, show]}
  - {name: module, type: text}
  - {name: enable_on_install, type: text}
  - {name: filepath, type: text}
  - {name: overwrite, type: text}
  - {name: target, type: text}
  - {name: filter_folder, type: text}
  - {name: filter_glob, type: text}
  - {name: filter_python, type: text}
