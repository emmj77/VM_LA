id: "B736"
tool: "blender_mesh_spin"
date: "2026-10-17"
tags: ["blender", "blender", "mesh", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Extrude selected vertices in a circle around the cursor in indicated viewport"

machine: "blender"
op: "mesh.spin"

ARGS:
  - {name: steps, type: int}
  - {name: dupli, type: text}          # true|false, empty to set nothing
  - {name: angle, type: text}
  - {name: use_auto_merge, type: text}          # true|false, empty to set nothing
  - {name: use_normal_flip, type: text}          # true|false, empty to set nothing
  - {name: center, type: text}          # 3 values separated by commas
  - {name: axis, type: text}          # 3 values separated by commas
