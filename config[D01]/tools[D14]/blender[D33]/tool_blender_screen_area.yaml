id: "B1774"
tool: "blender_screen_area"
date: "2026-10-17"
tags: ["blender_screen_area"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "a screen area: close | dupli | join | move | options | split | swap (op picks which)"

machine: "blender"
op: "screen.area_{{op}}"

ARGS:
  - {name: op, type: enum, values: [close, dupli, join, move, options, split, swap]}
  - {name: cursor, type: int}
  - {name: delta, type: int}
  - {name: direction, type: text}
  - {name: factor, type: text}
  - {name: snap, type: text}
  - {name: source_xy, type: int}
  - {name: target_xy, type: int}
  - {name: x, type: int}
  - {name: y, type: int}
