id: "B407"
tool: "blender_graph_paste"
date: "2026-10-17"
tags: ["blender", "blender", "animation", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Paste keyframes from the internal clipboard for the selected channels, starting on the current frame"

machine: "blender"
op: "graph.paste"

ARGS:
  - {name: offset, type: text}          # one of: START | END | RELATIVE | NONE
  - {name: value_offset, type: text}          # one of: LEFT_KEY | RIGHT_KEY | CURRENT_FRAME | CURSOR_VALUE | NONE
  - {name: merge, type: text}          # one of: MIX | OVER_ALL | OVER_RANGE | OVER_RANGE_ALL
  - {name: flipped, type: text}          # true|false, empty to set nothing
