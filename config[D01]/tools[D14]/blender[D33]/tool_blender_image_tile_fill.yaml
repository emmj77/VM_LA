id: "B551"
tool: "blender_image_tile_fill"
date: "2026-10-17"
tags: ["blender", "blender", "img", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Fill the current tile with a generated image"

machine: "blender"
op: "image.tile_fill"

ARGS:
  - {name: color, type: text}          # 4 values separated by commas
  - {name: generated_type, type: text}          # one of: BLANK | UV_GRID | COLOR_GRID
  - {name: width, type: int}
  - {name: height, type: int}
  - {name: float, type: text}          # true|false, empty to set nothing
  - {name: alpha, type: text}          # true|false, empty to set nothing
