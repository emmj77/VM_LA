id: "B065"
tool: "blender_armature_calculate_roll"
date: "2026-10-17"
tags: ["blender_armature_calculate_roll"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Automatically fix alignment of select bones' axes"

machine: "blender"
op: "armature.calculate_roll"

ARGS:
  - {name: type, type: text}          # un de : POS_X | POS_Z | GLOBAL_POS_X | GLOBAL_POS_Y | GLOBAL_POS_Z | NEG_X | NEG_Z | GLOBAL_NEG_X | GLOBAL_NEG_Y | GLOBAL_NEG_Z | ACTIVE | VIEW | CURSOR
  - {name: axis_flip, type: text}          # true|false, vide pour ne rien poser
  - {name: axis_only, type: text}          # true|false, vide pour ne rien poser
