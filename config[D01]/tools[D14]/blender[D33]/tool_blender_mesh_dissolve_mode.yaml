  - {name: angle_threshold, type: text}
  - {name: use_preserve_quads, type: text}          # true|false, empty to set nothing
  - {name: use_face_split, type: text}          # true|false, empty to set nothing
  - {name: use_boundary_tear, type: text}          # true|false, empty to set nothing
