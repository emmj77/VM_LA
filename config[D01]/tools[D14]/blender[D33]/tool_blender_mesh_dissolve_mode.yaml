tags: ["blender", "blender", "mesh", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Dissolve geometry based on the selection mode"

machine: "blender"
op: "mesh.dissolve_mode"

ARGS:
