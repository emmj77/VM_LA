id: "B524"
tool: "blender_image_convert_to_mesh_plane"
date: "2026-10-17"
tags: ["blender", "blender", "material", "convert"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Convert selected reference images to textured mesh plane"

machine: "blender"
op: "image.convert_to_mesh_plane"

ARGS:
  - {name: interpolation, type: text}          # one of: Linear | Closest | Cubic | Smart
  - {name: extension, type: text}          # one of: CLIP | EXTEND | REPEAT
  - {name: use_auto_refresh, type: text}          # true|false, empty to set nothing
  - {name: relative, type: text}          # true|false, empty to set nothing
  - {name: shader, type: text}          # one of: PRINCIPLED | SHADELESS | EMISSION
  - {name: emit_strength, type: text}
  - {name: use_transparency, type: text}          # true|false, empty to set nothing
  - {name: render_method, type: text}          # one of: DITHERED | BLENDED
  - {name: use_backface_culling, type: text}          # true|false, empty to set nothing
  - {name: show_transparent_back, type: text}          # true|false, empty to set nothing
  - {name: overwrite_material, type: text}          # true|false, empty to set nothing
  - {name: name_from, type: text}          # one of: OBJECT | IMAGE
  - {name: delete_ref, type: text}          # true|false, empty to set nothing
