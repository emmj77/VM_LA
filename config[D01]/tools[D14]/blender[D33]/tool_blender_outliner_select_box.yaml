tags: ["blender", "blender", "mesh", "select"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Use box selection to select tree elements"

machine: "blender"
op: "outliner.select_box"

ARGS:
  - {name: tweak, type: text}          # true|false, empty to set nothing
  - {name: xmin, type: int}
  - {name: xmax, type: int}
  - {name: ymin, type: int}
  - {name: ymax, type: int}
  - {name: wait_for_input, type: text}          # true|false, empty to set nothing
  - {name: mode, type: text}          # one of: SET | ADD | SUB
