id: "B1674"
tool: "blender_wm_tool_set_by_id"
date: "2026-10-17"
tags: ["blender_wm_tool_set_by_id"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Set the tool by name (for key-maps)"

machine: "blender"
op: "wm.tool_set_by_id"

ARGS:
  - {name: name, type: text}
  - {name: cycle, type: text}          # true|false, empty to set nothing
  - {name: as_fallback, type: text}          # true|false, empty to set nothing
  - {name: space_type, type: text}          # one of: EMPTY | VIEW_3D | IMAGE_EDITOR | NODE_EDITOR | SEQUENCE_EDITOR | CLIP_EDITOR | DOPESHEET_EDITOR | GRAPH_EDITOR | NLA_EDITOR | TEXT_EDITOR | CONSOLE | INFO | TOPBAR | STATUSBAR | OUTLINER | PROPERTIES | FILE_BROWSER | SPREADSHEET | PREFERENCES
