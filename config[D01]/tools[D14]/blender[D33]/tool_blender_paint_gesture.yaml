id: "B1756"
tool: "blender_paint_gesture"
date: "2026-10-17"
tags: ["blender_paint_gesture"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "a paint gesture (hide, mask): hide_show_lasso | hide_show_line | hide_show_polyline | mask_box | mask_lasso | mask_line | mask_polyline (op picks which)"

machine: "blender"
op: "paint.{{op}}_gesture"

ARGS:
  - {name: op, type: enum, values: [hide_show_lasso, hide_show_line, hide_show_polyline, mask_box, mask_lasso, mask_line, mask_polyline]}
  - {name: use_front_faces_only, type: text}
  - {name: mode, type: text}
  - {name: path, type: text}
  - {name: value, type: text}
  - {name: action, type: text}
  - {name: area, type: text}
  - {name: cursor, type: int}
  - {name: flip, type: text}
  - {name: smooth_stroke_factor, type: text}
  - {name: smooth_stroke_radius, type: int}
  - {name: use_limit_to_segment, type: text}
  - {name: use_smooth_stroke, type: text}
  - {name: xend, type: int}
  - {name: xstart, type: int}
  - {name: yend, type: int}
  - {name: ystart, type: int}
  - {name: wait_for_input, type: text}
  - {name: xmax, type: int}
  - {name: xmin, type: int}
  - {name: ymax, type: int}
  - {name: ymin, type: int}
