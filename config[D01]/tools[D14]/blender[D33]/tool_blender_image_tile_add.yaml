id: "B550"
tool: "blender_image_tile_add"
date: "2026-10-17"
tags: ["blender_image_tile_add"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Adds a tile to the image"

machine: "blender"
op: "image.tile_add"

ARGS:
  - {name: number, type: int}
  - {name: count, type: int}
  - {name: label, type: text}
  - {name: fill, type: text}          # true|false, empty to set nothing
  - {name: color, type: text}          # 4 values separated by commas
  - {name: generated_type, type: text}          # one of: BLANK | UV_GRID | COLOR_GRID
  - {name: width, type: int}
  - {name: height, type: int}
  - {name: float, type: text}          # true|false, empty to set nothing
  - {name: alpha, type: text}          # true|false, empty to set nothing
