id: "B217"
tool: "blender_constraint_apply"
date: "2026-10-17"
tags: ["blender", "blender", "mesh", "apply"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Apply constraint and remove from the stack"

machine: "blender"
op: "constraint.apply"

ARGS:
  - {name: constraint, type: text}
  - {name: owner, type: text}          # one of: OBJECT | BONE
  - {name: report, type: text}          # true|false, empty to set nothing
