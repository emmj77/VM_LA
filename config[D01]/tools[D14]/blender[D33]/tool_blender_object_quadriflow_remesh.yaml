id: "B1013"
tool: "blender_object_quadriflow_remesh"
date: "2026-10-17"
tags: ["blender", "blender", "object", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Create a new quad based mesh using the surface data of the current mesh. All data layers will be lost"

machine: "blender"
op: "object.quadriflow_remesh"

ARGS:
  - {name: use_mesh_symmetry, type: text}          # true|false, empty to set nothing
  - {name: use_preserve_sharp, type: text}          # true|false, empty to set nothing
  - {name: use_preserve_boundary, type: text}          # true|false, empty to set nothing
  - {name: preserve_attributes, type: text}          # true|false, empty to set nothing
  - {name: smooth_normals, type: text}          # true|false, empty to set nothing
  - {name: mode, type: text}          # one of: RATIO | EDGE | FACES
  - {name: target_ratio, type: text}
  - {name: target_edge_length, type: text}
  - {name: target_faces, type: int}
  - {name: mesh_area, type: text}
  - {name: seed, type: int}
