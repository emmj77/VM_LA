id: "B1456"
tool: "blender_transform_edge_slide"
date: "2026-10-17"
tags: ["blender", "blender", "mesh", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Slide an edge loop along a mesh"

machine: "blender"
op: "transform.edge_slide"

ARGS:
  - {name: value, type: text}
  - {name: single_side, type: text}          # true|false, empty to set nothing
  - {name: use_even, type: text}          # true|false, empty to set nothing
  - {name: flipped, type: text}          # true|false, empty to set nothing
  - {name: use_clamp, type: text}          # true|false, empty to set nothing
  - {name: mirror, type: text}          # true|false, empty to set nothing
  - {name: snap, type: text}          # true|false, empty to set nothing
  - {name: snap_elements, type: text}          # one of: INCREMENT | GRID | VERTEX | EDGE | FACE | VOLUME | EDGE_MIDPOINT | EDGE_PERPENDICULAR | FACE_MIDPOINT | FACE_PROJECT | FACE_NEAREST
  - {name: use_snap_project, type: text}          # true|false, empty to set nothing
  - {name: snap_target, type: text}          # one of: CLOSEST | CENTER | MEDIAN | ACTIVE
  - {name: use_snap_self, type: text}          # true|false, empty to set nothing
  - {name: use_snap_edit, type: text}          # true|false, empty to set nothing
  - {name: use_snap_nonedit, type: text}          # true|false, empty to set nothing
  - {name: use_snap_selectable, type: text}          # true|false, empty to set nothing
  - {name: snap_point, type: text}          # 3 values separated by commas
  - {name: correct_uv, type: text}          # true|false, empty to set nothing
  - {name: release_confirm, type: text}          # true|false, empty to set nothing
  - {name: use_accurate, type: text}          # true|false, empty to set nothing
