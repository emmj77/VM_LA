  - {name: use_selected_objects, type: text}
  - {name: report, type: text}
  - {name: all_keyframes, type: text}
  - {name: asset_library_identifier, type: text}
  - {name: asset_library_type, type: text}
  - {name: index, type: int}
  - {name: keep_modifier, type: text}
