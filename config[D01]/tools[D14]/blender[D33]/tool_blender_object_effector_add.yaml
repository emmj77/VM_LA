id: "B935"
tool: "blender_object_effector_add"
date: "2026-10-17"
tags: ["blender_object_effector_add"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Add an empty object with a physics effector to the scene"

machine: "blender"
op: "object.effector_add"

ARGS:
  - {name: type, type: text}          # one of: FORCE | WIND | VORTEX | MAGNET | HARMONIC | CHARGE | LENNARDJ | TEXTURE | GUIDE | BOID | TURBULENCE | DRAG | FLUID
  - {name: radius, type: text}
  - {name: enter_editmode, type: text}          # true|false, empty to set nothing
  - {name: align, type: text}          # one of: WORLD | VIEW | CURSOR
  - {name: location, type: text}          # 3 values separated by commas
  - {name: rotation, type: text}          # 3 values separated by commas
  - {name: scale, type: text}          # 3 values separated by commas
