id: "B1779"
tool: "blender_sequencer_retiming"
date: "2026-10-17"
tags: ["blender_sequencer_retiming"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "the retiming of a strip: add_freeze_frame_slide | add_transition_slide | freeze_frame_add | key_add | key_delete | reset | segment_speed_set | show | transition_add (op picks which)"

machine: "blender"
op: "sequencer.retiming_{{op}}"

ARGS:
  - {name: op, type: enum, values: [add_freeze_frame_slide, add_transition_slide, freeze_frame_add, key_add, key_delete, reset, segment_speed_set, show, transition_add]}
  - {name: TRANSFORM_OT_seq_slide, type: text}
  - {name: duration, type: int}
  - {name: SEQUENCER_OT_retiming_freeze_frame_add, type: text}
  - {name: SEQUENCER_OT_retiming_transition_add, type: text}
  - {name: speed, type: text}
  - {name: timeline_frame, type: int}
