id: "B1385"
tool: "blender_sequencer_snap"
date: "2026-10-17"
tags: ["blender", "blender", "scene", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Snap strips to the current frame, using the active (or closest) strip as the anchor, and the mouse cursor relative to the playhead to determine the si"

machine: "blender"
op: "sequencer.snap"

ARGS:
  - {name: frame, type: int}
  - {name: side, type: text}          # one of: LEFT | RIGHT
  - {name: keep_offset, type: text}          # true|false, empty to set nothing
