DESCRIPTION: "Hide/show some vertices"

machine: "blender"
op: "paint.hide_show"

ARGS:
  - {name: xmin, type: int}
  - {name: xmax, type: int}
  - {name: ymin, type: int}
  - {name: ymax, type: int}
