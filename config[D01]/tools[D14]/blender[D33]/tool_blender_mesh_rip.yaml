id: "B697"
tool: "blender_mesh_rip"
date: "2026-10-17"
tags: ["blender_mesh_rip"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Disconnect vertices or edges from connected geometry"

machine: "blender"
op: "mesh.rip"

ARGS:
  - {name: mirror, type: text}          # true|false, empty to set nothing
  - {name: use_proportional_edit, type: text}          # true|false, empty to set nothing
  - {name: proportional_edit_falloff, type: text}          # one of: SMOOTH | SPHERE | ROOT | INVERSE_SQUARE | SHARP | LINEAR | CONSTANT | RANDOM
  - {name: proportional_size, type: text}
  - {name: use_proportional_connected, type: text}          # true|false, empty to set nothing
  - {name: use_proportional_projected, type: text}          # true|false, empty to set nothing
  - {name: release_confirm, type: text}          # true|false, empty to set nothing
  - {name: use_accurate, type: text}          # true|false, empty to set nothing
  - {name: use_fill, type: text}          # true|false, empty to set nothing
