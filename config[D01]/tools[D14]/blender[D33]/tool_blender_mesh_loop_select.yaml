id: "B674"
tool: "blender_mesh_loop_select"
date: "2026-10-17"
tags: ["blender", "blender", "mesh", "select"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Select a loop of connected edges"

machine: "blender"
op: "mesh.loop_select"

ARGS:
  - {name: delimit_edge_loop, type: text}          # one of: SEAM | SHARP | NGONS | INNER_CORNERS | OUTER_CORNERS
  - {name: delimit_face_loop, type: text}          # one of: SEAM | SHARP | MATERIAL
  - {name: extend, type: text}          # true|false, empty to set nothing
  - {name: deselect, type: text}          # true|false, empty to set nothing
  - {name: toggle, type: text}          # true|false, empty to set nothing
  - {name: object_index, type: int}
  - {name: edge_index, type: int}
  - {name: vert_index, type: int}
  - {name: face_index, type: int}
