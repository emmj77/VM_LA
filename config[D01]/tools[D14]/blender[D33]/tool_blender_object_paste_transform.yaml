id: "B1007"
tool: "blender_object_paste_transform"
date: "2026-10-17"
tags: ["blender", "blender", "animation", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Pastes the matrix from the clipboard to the currently active pose bone or object. Uses world-space matrices"

machine: "blender"
op: "object.paste_transform"

ARGS:
  - {name: method, type: text}          # one of: CURRENT | EXISTING_KEYS | BAKE
  - {name: bake_step, type: int}
  - {name: use_mirror, type: text}          # true|false, empty to set nothing
  - {name: mirror_axis_loc, type: text}          # one of: x | y | z
  - {name: mirror_axis_rot, type: text}          # one of: x | y | z
  - {name: use_relative, type: text}          # true|false, empty to set nothing
