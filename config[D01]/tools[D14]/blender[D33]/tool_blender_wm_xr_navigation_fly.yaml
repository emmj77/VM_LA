  - {name: turn_speed_factor, type: text}
  - {name: fly_speed_factor, type: text}
  - {name: speed_interpolation0, type: text}          # 2 valeurs separees par des virgules
  - {name: speed_interpolation1, type: text}          # 2 valeurs separees par des virgules
  - {name: alt_mode, type: text}          # un de : FORWARD | BACK | LEFT | RIGHT | UP | DOWN | TURNLEFT | TURNRIGHT | VIEWER_FORWARD | VIEWER_BACK | VIEWER_LEFT | VIEWER_RIGHT | CONTROLLER_FORWARD
  - {name: alt_lock_location_z, type: text}          # true|false, vide pour ne rien poser
  - {name: alt_lock_direction, type: text}          # true|false, vide pour ne rien poser
