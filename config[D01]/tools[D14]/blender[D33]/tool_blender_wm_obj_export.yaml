id: "B1625"
tool: "blender_wm_obj_export"
date: "2026-10-17"
tags: ["blender", "blender", "scene", "export"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Save the scene to a Wavefront OBJ file"

machine: "blender"
op: "wm.obj_export"

ARGS:
  - {name: filepath, type: text}
  - {name: check_existing, type: text}          # true|false, empty to set nothing
  - {name: filter_blender, type: text}          # true|false, empty to set nothing
  - {name: filter_backup, type: text}          # true|false, empty to set nothing
  - {name: filter_image, type: text}          # true|false, empty to set nothing
  - {name: filter_movie, type: text}          # true|false, empty to set nothing
  - {name: filter_python, type: text}          # true|false, empty to set nothing
  - {name: filter_font, type: text}          # true|false, empty to set nothing
  - {name: filter_sound, type: text}          # true|false, empty to set nothing
  - {name: filter_text, type: text}          # true|false, empty to set nothing
  - {name: filter_archive, type: text}          # true|false, empty to set nothing
  - {name: filter_btx, type: text}          # true|false, empty to set nothing
  - {name: filter_alembic, type: text}          # true|false, empty to set nothing
  - {name: filter_usd, type: text}          # true|false, empty to set nothing
  - {name: filter_obj, type: text}          # true|false, empty to set nothing
  - {name: filter_volume, type: text}          # true|false, empty to set nothing
  - {name: filter_folder, type: text}          # true|false, empty to set nothing
  - {name: filter_blenlib, type: text}          # true|false, empty to set nothing
  - {name: filemode, type: int}
  - {name: display_type, type: text}          # one of: DEFAULT | LIST_VERTICAL | LIST_HORIZONTAL | THUMBNAIL
  - {name: sort_method, type: text}          # one of:
  - {name: export_animation, type: text}          # true|false, empty to set nothing
  - {name: start_frame, type: int}
  - {name: end_frame, type: int}
  - {name: forward_axis, type: text}          # one of: X | Y | Z | NEGATIVE_X | NEGATIVE_Y | NEGATIVE_Z
  - {name: up_axis, type: text}          # one of: X | Y | Z | NEGATIVE_X | NEGATIVE_Y | NEGATIVE_Z
  - {name: global_scale, type: text}
  - {name: apply_modifiers, type: text}          # true|false, empty to set nothing
  - {name: apply_transform, type: text}          # true|false, empty to set nothing
  - {name: export_eval_mode, type: text}          # one of: DAG_EVAL_RENDER | DAG_EVAL_VIEWPORT
  - {name: export_selected_objects, type: text}          # true|false, empty to set nothing
  - {name: export_uv, type: text}          # true|false, empty to set nothing
  - {name: export_normals, type: text}          # true|false, empty to set nothing
  - {name: export_colors, type: text}          # true|false, empty to set nothing
  - {name: export_materials, type: text}          # true|false, empty to set nothing
  - {name: export_pbr_extensions, type: text}          # true|false, empty to set nothing
  - {name: path_mode, type: text}          # one of: AUTO | ABSOLUTE | RELATIVE | MATCH | STRIP | COPY
  - {name: export_triangulated_mesh, type: text}          # true|false, empty to set nothing
  - {name: export_curves_as_nurbs, type: text}          # true|false, empty to set nothing
  - {name: export_object_groups, type: text}          # true|false, empty to set nothing
  - {name: export_material_groups, type: text}          # true|false, empty to set nothing
  - {name: export_vertex_groups, type: text}          # true|false, empty to set nothing
  - {name: export_smooth_groups, type: text}          # true|false, empty to set nothing
  - {name: smooth_group_bitflags, type: text}          # true|false, empty to set nothing
  - {name: filter_glob, type: text}
  - {name: collection, type: text}
