id: "B1101"
tool: "blender_paint_add_texture_paint_slot"
date: "2026-10-17"
tags: ["blender_paint_add_texture_paint_slot"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Add a paint slot"

machine: "blender"
op: "paint.add_texture_paint_slot"

ARGS:
  - {name: type, type: text}          # one of: BASE_COLOR | SPECULAR | ROUGHNESS | METALLIC | NORMAL | BUMP | DISPLACEMENT
  - {name: slot_type, type: text}          # one of: IMAGE | COLOR_ATTRIBUTE
  - {name: name, type: text}
  - {name: color, type: text}          # 4 values separated by commas
  - {name: width, type: int}
  - {name: height, type: int}
  - {name: alpha, type: text}          # true|false, empty to set nothing
  - {name: generated_type, type: text}          # one of: BLANK | UV_GRID | COLOR_GRID
  - {name: float, type: text}          # true|false, empty to set nothing
  - {name: tiled, type: text}          # true|false, empty to set nothing
  - {name: domain, type: text}          # one of: POINT | CORNER
  - {name: data_type, type: text}          # one of: FLOAT_COLOR | BYTE_COLOR
