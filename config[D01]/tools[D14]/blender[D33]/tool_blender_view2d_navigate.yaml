  - {name: deltay, type: text}
  - {name: page, type: text}
  - {name: wait_for_input, type: text}
  - {name: xmax, type: int}
  - {name: xmin, type: int}
  - {name: ymax, type: int}
  - {name: ymin, type: int}
  - {name: zoomfacx, type: text}
  - {name: zoomfacy, type: text}
  - {name: delay, type: text}
  - {name: inside_padding, type: text}
  - {name: max_speed, type: text}
  - {name: outside_padding, type: text}
  - {name: speed_ramp, type: text}
  - {name: use_cursor_init, type: text}
  - {name: zoom_influence, type: text}
