id: "B1386"
tool: "blender_sequencer_split"
date: "2026-10-17"
tags: ["blender", "blender", "scene", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Split the selected strips in two"

machine: "blender"
op: "sequencer.split"

ARGS:
  - {name: frame, type: int}
  - {name: channel, type: int}
  - {name: type, type: text}          # one of: SOFT | HARD
  - {name: use_cursor_position, type: text}          # true|false, empty to set nothing
  - {name: side, type: text}          # one of: MOUSE | LEFT | RIGHT | BOTH | NO_CHANGE
  - {name: ignore_selection, type: text}          # true|false, empty to set nothing
  - {name: ignore_connections, type: text}          # true|false, empty to set nothing
