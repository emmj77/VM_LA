id: "B689"
tool: "blender_mesh_point_normals"
date: "2026-10-17"
tags: ["blender_mesh_point_normals"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Point selected custom normals to specified Target"

machine: "blender"
op: "mesh.point_normals"

ARGS:
  - {name: mode, type: text}          # un de : COORDINATES | MOUSE
  - {name: invert, type: text}          # true|false, vide pour ne rien poser
  - {name: align, type: text}          # true|false, vide pour ne rien poser
  - {name: target_location, type: text}          # 3 valeurs separees par des virgules
  - {name: spherize, type: text}          # true|false, vide pour ne rien poser
  - {name: spherize_strength, type: text}
