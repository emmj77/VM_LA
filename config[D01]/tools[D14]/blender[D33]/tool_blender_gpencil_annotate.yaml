id: "B370"
tool: "blender_gpencil_annotate"
date: "2026-10-17"
tags: ["blender", "blender", "mesh", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Make annotations on the active data"

machine: "blender"
op: "gpencil.annotate"

ARGS:
  - {name: mode, type: text}          # one of: DRAW | DRAW_STRAIGHT | DRAW_POLY | ERASER
  - {name: arrowstyle_start, type: text}          # one of: NONE | ARROW | ARROW_OPEN | ARROW_OPEN_INVERTED | DIAMOND
  - {name: arrowstyle_end, type: text}          # one of: NONE | ARROW | ARROW_OPEN | ARROW_OPEN_INVERTED | DIAMOND
  - {name: use_stabilizer, type: text}          # true|false, empty to set nothing
  - {name: stabilizer_factor, type: text}
  - {name: stabilizer_radius, type: int}
  - {name: stroke, type: text}
  - {name: wait_for_input, type: text}          # true|false, empty to set nothing
