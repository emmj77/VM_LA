id: "B1330"
tool: "blender_sequencer_box_blade"
date: "2026-10-17"
tags: ["blender", "blender", "draw", "cut"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Draw a box around the parts of strips you want to cut away"

machine: "blender"
op: "sequencer.box_blade"

ARGS:
  - {name: xmin, type: int}
  - {name: xmax, type: int}
  - {name: ymin, type: int}
  - {name: ymax, type: int}
  - {name: wait_for_input, type: text}          # true|false, empty to set nothing
  - {name: mode, type: text}          # one of: SET | ADD | SUB
  - {name: type, type: text}          # one of: SOFT | HARD
  - {name: ignore_selection, type: text}          # true|false, empty to set nothing
  - {name: ignore_connections, type: text}          # true|false, empty to set nothing
  - {name: remove_gaps, type: text}          # true|false, empty to set nothing
