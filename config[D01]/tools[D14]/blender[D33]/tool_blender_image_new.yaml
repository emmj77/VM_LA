id: "B532"
tool: "blender_image_new"
date: "2026-10-17"
tags: ["blender_image_new"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Create a new image"

machine: "blender"
op: "image.new"

ARGS:
  - {name: name, type: text}
  - {name: width, type: int}
  - {name: height, type: int}
  - {name: color, type: text}          # 4 valeurs separees par des virgules
  - {name: alpha, type: text}          # true|false, vide pour ne rien poser
  - {name: generated_type, type: text}          # un de : BLANK | UV_GRID | COLOR_GRID
  - {name: float, type: text}          # true|false, vide pour ne rien poser
  - {name: use_stereo_3d, type: text}          # true|false, vide pour ne rien poser
  - {name: tiled, type: text}          # true|false, vide pour ne rien poser
