  - {name: high, type: text}
  - {name: attack, type: text}
  - {name: release, type: text}
  - {name: threshold, type: text}
  - {name: use_accumulate, type: text}          # true|false, empty to set nothing
  - {name: use_additive, type: text}          # true|false, empty to set nothing
  - {name: use_square, type: text}          # true|false, empty to set nothing
  - {name: sthreshold, type: text}
