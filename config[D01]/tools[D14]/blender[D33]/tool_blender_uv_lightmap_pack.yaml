id: "B1498"
tool: "blender_uv_lightmap_pack"
date: "2026-10-17"
tags: ["blender", "blender", "mesh", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Pack each face's UVs into the UV bounds"

machine: "blender"
op: "uv.lightmap_pack"

ARGS:
  - {name: PREF_CONTEXT, type: text}          # one of: SEL_FACES | ALL_FACES
  - {name: PREF_PACK_IN_ONE, type: text}          # true|false, empty to set nothing
  - {name: PREF_NEW_UVLAYER, type: text}          # true|false, empty to set nothing
  - {name: PREF_BOX_DIV, type: int}
  - {name: PREF_MARGIN_DIV, type: text}
