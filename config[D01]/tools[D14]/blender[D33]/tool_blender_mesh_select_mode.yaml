id: "B716"
tool: "blender_mesh_select_mode"
date: "2026-10-17"
tags: ["blender", "blender", "mesh", "select"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Change selection mode"

machine: "blender"
op: "mesh.select_mode"

ARGS:
  - {name: use_extend, type: text}          # true|false, empty to set nothing
  - {name: use_expand, type: text}          # true|false, empty to set nothing
  - {name: type, type: text}          # one of: VERT | EDGE | FACE
  - {name: action, type: text}          # one of: DISABLE | ENABLE | TOGGLE
