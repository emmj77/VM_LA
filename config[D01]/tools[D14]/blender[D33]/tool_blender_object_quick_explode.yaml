id: "B1014"
tool: "blender_object_quick_explode"
date: "2026-10-17"
tags: ["blender", "blender", "object", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Make selected objects explode"

machine: "blender"
op: "object.quick_explode"

ARGS:
  - {name: style, type: text}          # one of: EXPLODE | BLEND
  - {name: amount, type: int}
  - {name: frame_duration, type: int}
  - {name: frame_start, type: int}
  - {name: frame_end, type: int}
  - {name: velocity, type: text}
  - {name: fade, type: text}          # true|false, empty to set nothing
