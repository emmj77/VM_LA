id: "B1018"
tool: "blender_object_randomize_transform"
date: "2026-10-17"
tags: ["blender", "blender", "object", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Randomize objects location, rotation, and scale"

machine: "blender"
op: "object.randomize_transform"

ARGS:
  - {name: random_seed, type: int}
  - {name: use_delta, type: text}          # true|false, empty to set nothing
  - {name: use_loc, type: text}          # true|false, empty to set nothing
  - {name: loc, type: text}          # 3 values separated by commas
  - {name: use_rot, type: text}          # true|false, empty to set nothing
  - {name: rot, type: text}          # 3 values separated by commas
  - {name: use_scale, type: text}          # true|false, empty to set nothing
  - {name: scale_even, type: text}          # true|false, empty to set nothing
  - {name: scale, type: text}          # 3 values separated by commas
