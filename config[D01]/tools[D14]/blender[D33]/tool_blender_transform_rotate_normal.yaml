id: "B1458"
tool: "blender_transform_rotate_normal"
date: "2026-10-17"
tags: ["blender_transform_rotate_normal"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Rotate custom normal of selected items"

machine: "blender"
op: "transform.rotate_normal"

ARGS:
  - {name: value, type: text}
  - {name: orient_axis, type: text}          # one of: X | Y | Z
  - {name: orient_type, type: text}          # one of:
  - {name: orient_matrix, type: text}          # 9 values separated by commas
  - {name: orient_matrix_type, type: text}          # one of:
  - {name: constraint_axis, type: text}          # 3 values separated by commas
  - {name: mirror, type: text}          # true|false, empty to set nothing
  - {name: release_confirm, type: text}          # true|false, empty to set nothing
  - {name: use_accurate, type: text}          # true|false, empty to set nothing
