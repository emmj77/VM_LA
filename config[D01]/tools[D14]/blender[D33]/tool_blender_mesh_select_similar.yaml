id: "B723"
tool: "blender_mesh_select_similar"
date: "2026-10-17"
tags: ["blender_mesh_select_similar"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Select similar vertices, edges or faces by property types"

machine: "blender"
op: "mesh.select_similar"

ARGS:
  - {name: type, type: text}          # one of: VERT_NORMAL | VERT_FACES | VERT_GROUPS | VERT_EDGES | VERT_CREASE | EDGE_LENGTH | EDGE_DIR | EDGE_FACES | EDGE_FACE_ANGLE | EDGE_CREASE | EDGE_BEVEL | EDGE_SEAM | EDGE_SHARP | EDGE_FREESTYLE | FACE_MATERIAL | FACE_AREA | FACE_SIDES | FACE_PERIMETER | FACE_NORMAL | FACE_COPLANAR | FACE_SMOOTH | FACE_FREESTYLE
  - {name: compare, type: text}          # one of: EQUAL | GREATER | LESS
  - {name: threshold, type: text}
