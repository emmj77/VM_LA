id: "B1737"
tool: "blender_mask_vertex_add"
date: "2026-10-17"
tags: ["blender", "blender", "mesh", "add"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "a vertex added to a mask: feather_vertex | feather_vertex_slide | vertex | vertex_slide (op picks which)"

machine: "blender"
op: "mask.add_{{op}}"

ARGS:
  - {name: op, type: enum, values: [feather_vertex, feather_vertex_slide, vertex, vertex_slide]}
  - {name: MASK_OT_slide_point, type: text}
  - {name: location, type: text}
  - {name: MASK_OT_add_feather_vertex, type: text}
  - {name: MASK_OT_add_vertex, type: text}
