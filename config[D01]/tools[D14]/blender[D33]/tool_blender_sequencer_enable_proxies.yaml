id: "B1344"
tool: "blender_sequencer_enable_proxies"
date: "2026-10-17"
tags: ["blender", "blender", "scene", "run"]

RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "Enable selected proxies on all selected Movie and Image strips"

machine: "blender"
op: "sequencer.enable_proxies"

ARGS:
  - {name: proxy_25, type: text}          # true|false, empty to set nothing
  - {name: proxy_50, type: text}          # true|false, empty to set nothing
  - {name: proxy_75, type: text}          # true|false, empty to set nothing
  - {name: proxy_100, type: text}          # true|false, empty to set nothing
  - {name: overwrite, type: text}          # true|false, empty to set nothing
