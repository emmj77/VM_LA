# the watch: a sleep that repeats by itself and wakes the model with its mission.
id: "W003"
tool: "watch.surveil"
date: "2026-10-21"
tags: ["manage", "systemd", "process", "run"]
RULES:
  enabled: true
  timeout: 60
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: write
DESCRIPTION: "arms one repeating systemd timer: every N seconds it wakes the session with its mission, twelve times at most, and stops itself"
COMMAND: |

  _op=${1:-status}
  _d=$(cfg path state) || { printf 'FAULT no state in the tree\n'; exit 0; }
  _j="$_d/surveil.json"
  _x="$_d/surveil.sh"
  _max=$(cfg num loop.surveil_max 12) || _max=12

  case $_op in
  arm*)
    _every=${_op#arm}
    _target=$(cat | tr '\n' ' ' | cut -c1-400)
    [ -n "$_target" ] || { printf 'FAULT the mission wants its target on the input\n'; exit 0; }
    _u="la-surveil-$(date +%s)"

    jq -cn --arg t "$_target" --argjson e "$_every" --argjson m "$_max" --arg u "$_u" \
      '{target:$t,every:$e,max:$m,count:0,state:"running",unit:$u}' | write_atomic "$_j"

    # one command line, built here: systemd repeats it, the count happens inside
    _cmd="c=\$(( \$(jq -r '.count // 0' '$_j' 2>/dev/null) + 1 )); jq --argjson c \"\$c\" '.count = \$c' '$_j' > '$_j.t' && mv -f '$_j.t' '$_j'; printf 'le reveil de surveillance %s/%s : %s\\n' \"\$c\" '$_max' '$_target' >> '$_d/request.txt'; '${LA_TOOL:-}' engine engine.turn 'text=reveil: continue la surveillance : $_target'; [ \"\$c\" -ge '$_max' ] && systemctl --user stop '$_u.timer'"
    systemd-run --user --unit="$_u" --on-active="${_every}s" \
      --timer-property=AccuracySec=1s --timer-property=OnUnitActiveSec="${_every}s" \
      --collect /bin/dash -c "$_cmd" >/dev/null 2>&1 \
      || { printf 'FAULT the watch was not armed\n'; exit 0; }
    trace_line surveil "programmee une fois, toutes les ${_every}s, $_max fois : $_target"
    printf 'ok la surveillance de %s est programmee une fois pour toutes, toutes les %s s, %s reveils au plus\n' \
      "$_target" "$_every" "$_max"
    ;;
  status)
    [ -r "$_j" ] || { printf 'note aucune surveillance en cours\n'; exit 0; }
    jq -r '"ok \(.state) : \(.target) toutes les \(.every)s, tour \(.count)/\(.max)"' "$_j" 2>/dev/null
    ;;
  stop)
    _u=$(jq -r '.unit // ""' "$_j" 2>/dev/null)
    [ -n "$_u" ] && systemctl --user stop "$_u.timer" >/dev/null 2>&1
    [ -r "$_j" ] && jq '.state = "stopped"' "$_j" | write_atomic "$_j"
    printf 'ok la surveillance est arretee\n'
    ;;
  *)
    printf 'FAULT unknown op %s\n' "$_op"
    ;;
  esac
  exit 0

ARGS:
  - {name: op, type: enum, values: [arm15,arm30,arm60,arm180,arm300,arm580,status,stop]}
