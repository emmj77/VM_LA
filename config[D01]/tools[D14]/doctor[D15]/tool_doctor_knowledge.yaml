# one control of the doctor. it names what it sees, it never decides the verdict.
id: "D004"
tool: "doctor.knowledge"
date: "2026-10-20"
tags: ["manage", "shell", "project", "run"]
RULES:
  enabled: true
  timeout: 90
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read
DESCRIPTION: "the skills, the armed skill and project, the canon"
COMMAND: |

  _op=${1:-skills}
  case $_op in
  skills)
    _d=$(cfg path skills) || { printf 'FAULT no skills directory\n'; exit 0; }
    _n=0
    for _s in "$_d"/*/skill.yaml; do
      [ -f "$_s" ] || continue
      _n=$((_n + 1))
      _nm=$(basename -- "$(dirname -- "$_s")")
      grep -q '^WRITABLE_WORKSPACE:' "$_s" || printf 'FAULT skill %s carries no WRITABLE_WORKSPACE\n' "$_nm"
      grep -q '^  workspace:' "$_s" || printf 'FAULT skill %s carries no workspace\n' "$_nm"
      grep -q '^SKILL_TOOL_SET:' "$_s" || printf 'FAULT skill %s carries no SKILL_TOOL_SET\n' "$_nm"
    done
    [ "$_n" -gt 0 ] && printf 'ok %s skill(s) read\n' "$_n" || printf 'FAULT no skill in skills\n'
    ;;
  active)
    _s=$(skl_skill 2>/dev/null)
    _p=$(skl_project 2>/dev/null)
    _d=$(cfg path skills) || exit 0
    if [ -n "$_s" ]; then
      [ -f "$_d/$_s/skill.yaml" ] && printf 'ok the armed skill is %s, and it exists\n' "$_s" \
        || printf 'FAULT skills/.active names %s, which does not exist\n' "$_s"
    else
      printf 'ok no armed skill\n'
    fi
    [ -n "$_p" ] && printf 'ok the armed project is %s\n' "$_p" || printf 'ok no armed project\n'
    ;;
  canon)
    _st=$(cfg abs project_active 2>/dev/null) && [ -r "$_st" ] || { printf 'ok no armed project, so no canon to hold\n'; exit 0; }
    _ap=$(head -n 1 -- "$_st")
    _pd=$(project_dir "$_ap" 2>/dev/null) || { printf 'FAULT the armed project %s names no folder\n' "$_ap"; exit 0; }
    _f="$_pd/project.yml"
    [ -f "$_f" ] || { printf 'FAULT the armed project %s names no manifest\n' "$_ap"; exit 0; }
    [ -s "$_f" ] || { printf 'FAULT the canon %s is empty\n' "${_f#$ROOT/}"; exit 0; }
    _spec=$(awk '/^SPEC:/ { f = 1 ; next } f && /^[^ \t]/ { f = 0 } f' "$_f")
    [ -n "$_spec" ] || { printf 'FAULT the canon carries no SPEC zone\n'; exit 0; }
    _d=$(printf '%s\n' "$_spec" | grep -E '^    - ' | sort | uniq -d | wc -l | tr -d ' ')
    [ "$_d" = 0 ] || printf 'FAULT %s statement(s) written twice\n' "$_d"
    _l=$(printf '%s\n' "$_spec" | awk '{ l = $0 ; sub(/^[ \t]*-[ \t]*/, "", l) ; sub(/^"/, "", l) ; sub(/"[ \t]*$/, "", l) ; if (length(l) > 100) n++ } END { print n + 0 }')
    [ "$_l" = 0 ] || printf 'FAULT %s statement(s) pass 100 bytes\n' "$_l"
    printf 'ok canon %s, %s statement(s)\n' "${_f#$ROOT/}" "$(printf '%s\n' "$_spec" | grep -cE '^    - ')"
    ;;
  *) printf 'FAULT unknown op %s\n' "$_op" ;;
  esac
  exit 0

ARGS:
  - {name: op, type: enum, values: skills,active,canon}
