# one control of the doctor. it names what it sees, it never decides the verdict.
id: "D003"
tool: "doctor.keys"
date: "2026-10-20"
tags: ["manage", "shell", "config", "run"]
RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read
DESCRIPTION: "la_config against the bodies: one owner per fact"
COMMAND: |

  _op=${1:-keys}
  if [ "$_op" = used ]; then
    # every name a body asks the config for must be in the config
    _tf=$(tmpfile keysused) || exit 0
    : > "$_tf"
    for _f in "$(cfg path tools)"/*/tool_*.yaml "$(cfg path engine)"/*.sh; do
      [ -f "$_f" ] || continue
      grep -ohE 'cfg (str|num|path|abs|list|has|dir|file) [A-Za-z_0-9.]+' "$_f" 2>/dev/null | awk '{print $3}' >> "$_tf"
    done
    sort -u "$_tf" -o "$_tf"
    _bad=0; _n=0
    while IFS= read -r _k; do
      case $_k in ""|*\$*|*"?"*) continue ;; esac
      _n=$((_n + 1))
      if _flat | cut -f1 | grep -qxF "$_k"; then continue; fi
      [ -n "$(cfg abs "$_k" 2>/dev/null)" ] && continue
      [ -n "$(cfg dir "$_k" 2>/dev/null)" ] && continue
      printf 'FAULT a body reads %s and la_config carries it nowhere\n' "$_k"
      _bad=$((_bad + 1))
    done < "$_tf"
    printf 'note %s name(s) asked by the bodies, %s unknown to the config\n' "$_n" "$_bad"
    exit 0
  fi

  exit 0

ARGS:
  - {name: op, type: enum, values: keys,used}
