# one control of the doctor. it names what it sees, it never decides the verdict.
id: "D005"
tool: "doctor.language"
date: "2026-10-20"
tags: ["manage", "python", "text", "run"]
RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read
DESCRIPTION: "no french word in the machinery, and no dead skill name"
COMMAND: |

  _op=${1:-vocab}
  _n=0
  _bad=0
  for _d in engine programs conf tools; do
    _p=$(cfg path "$_d" 2>/dev/null) || continue
    [ -d "$_p" ] || continue
    for _f in $(find "$_p" -type f \( -name '*.sh' -o -name '*.py' \) 2>/dev/null); do
      # board.py speaks French to the human (MOUSSA, 21/10): the doctor ignores it
      case ${_f##*/} in board.py) continue ;; esac
      _n=$((_n + 1))
      # FRENCH LIVES IN THE COMMENTS AND IN texts.yaml (MOUSSA, 21/10). Only
      # the .sh/.py code is looked at, outside comment lines, and the earlier pattern
      # had double backslashes: it caught any file holding a digit.
      # a FRENCH LETTER is an accented letter. A quote « » or the tokenizer mark ▁ is not.
      # The count is done in python: grep read the accent bytes differently depending on the
      # locale of the shell, and blamed the machinery for a symbol.
      _h=$(python3 -c 'import sys;acc=set("àâäçéèêëîïôöùûüÿœæÀÂÄÇÉÈÊËÎÏÔÖÙÛÜŸŒÆ");print(sum(1 for l in open(sys.argv[1],encoding="utf-8",errors="replace") if not l.lstrip().startswith("#") and any(c in acc for c in l)))' "$_f")
      [ "${_h:-0}" = 0 ] || { _bad=$((_bad + 1)); printf 'FAULT %s carries %s line(s) with a french letter\n' "${_f#$ROOT/}" "$_h"; }
    done
  done
  for _w in $(cfg list lists.french 2>/dev/null); do
    # a French word in a COMMENT is allowed (MOUSSA, 21/10): only the code is counted
    _c=$(LC_ALL=C grep -rIn --include='*.sh' --include='*.py' --exclude='board.py' "\b$_w\b" "$(cfg path engine)" "$(cfg path programs)" 2>/dev/null | grep -vP '^[^:]+:[0-9]+:[[:space:]]*#' | wc -l | tr -d ' ')
    [ "$_c" = 0 ] || { _bad=$((_bad + 1)); printf 'FAULT the word "%s" lives in %s file(s)\n' "$_w" "$_c"; }
  done
  [ "$_bad" = 0 ] && printf 'ok %s file(s) read, no french in the machinery\n' "$_n" \
    || printf 'FAULT %s file(s) speak french\n' "$_bad"
  exit 0

ARGS:
  - {name: op, type: enum, values: vocab}
