# one control of the doctor. it names what it sees, it never decides the verdict.
id: "D005"
tool: "doctor.language"
date: "2026-10-20"
tags: ["doctor", "language"]
RULES:
  enabled: true
  timeout: 120
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read
DESCRIPTION: "no french word in the machinery, and no dead skill name"
COMMAND: |

  _op=${1:-vocab}
  _n=0
  _bad=0
  for _d in engine programs conf tools; do
    _p=$(cfg path "$_d" 2>/dev/null) || continue
    [ -d "$_p" ] || continue
    for _f in $(find "$_p" -type f \( -name '*.sh' -o -name '*.py' \) 2>/dev/null); do
      # board.py parle francais a l humain (MOUSSA, 21/10) : le docteur l ignore
      case ${_f##*/} in board.py) continue ;; esac
      _n=$((_n + 1))
      # LE FRANCAIS VIT DANS LES COMMENTAIRES ET DANS texts.yaml (MOUSSA, 21/10). On ne
      # regarde que le code .sh/.py, hors lignes de commentaire, et le motif d avant
      # avait des doubles barres obliques : il attrapait tout fichier avec un chiffre.
      _h=$(LC_ALL=C grep -nP '[^\x00-\x7F]' "$_f" 2>/dev/null | grep -vcP '^[0-9]+:[[:space:]]*#' 2>/dev/null)
      [ "${_h:-0}" = 0 ] || { _bad=$((_bad + 1)); printf 'FAULT %s carries %s line(s) with a french letter\n' "${_f#$ROOT/}" "$_h"; }
    done
  done
  for _w in $(cfg list lists.french 2>/dev/null); do
    # un mot francais dans un COMMENTAIRE est permis (MOUSSA, 21/10) : on ne compte que le code
    _c=$(LC_ALL=C grep -rIn --include='*.sh' --include='*.py' --exclude='board.py' "\b$_w\b" "$(cfg path engine)" "$(cfg path programs)" 2>/dev/null | grep -vP '^[^:]+:[0-9]+:[[:space:]]*#' | wc -l | tr -d ' ')
    [ "$_c" = 0 ] || { _bad=$((_bad + 1)); printf 'FAULT the word "%s" lives in %s file(s)\n' "$_w" "$_c"; }
  done
  [ "$_bad" = 0 ] && printf 'ok %s file(s) read, no french in the machinery\n' "$_n" \
    || printf 'FAULT %s file(s) speak french\n' "$_bad"
  exit 0

ARGS:
  - {name: op, type: enum, values: vocab}
