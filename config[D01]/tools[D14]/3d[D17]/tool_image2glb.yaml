id: "3D001"
tool: "image2glb"
date: "2026-10-17"
tags: ["image", "shell", "img", "run"]

RULES:
  enabled: true
  timeout: 1800
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "turns an image into a 3D asset (.glb) via ComfyUI Pixal3D / TRELLIS.2"

COMMAND: |
  I=$(cat); [ -n "$I" ] || { echo 'refused: missing image' >&2; exit 1; }; [ -f "$I" ] || { echo "refused: image not found ($I)" >&2; exit 1; }
  O="{{out}}"; [ -n "$O" ] || O="$ROOT/work/GLB_PIXAL3D"
  pixal3d gen "$I" --out "$O"

ARGS:
  - {name: image, type: path, stdin: true}
  - {name: out, type: path, required: false}
