id: "3D005"
tool: "mesh-inspect"
date: "2026-10-17"
tags: ["3d", "mesh-inspect", "inspect"]

RULES:
  enabled: true
  timeout: 300
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "inspects a 3D mesh"

COMMAND: |
  I=$(cat); [ -n "$I" ] || { printf '%s\n' "$(msg mesh_missing)" >&2; exit 1; }; [ -f "$I" ] || { printf '%s\n' "$(msg mesh_found_i "$I")" >&2; exit 1; }
  mesh inspect "$I"

ARGS:
  - {name: input, type: path, stdin: true}
