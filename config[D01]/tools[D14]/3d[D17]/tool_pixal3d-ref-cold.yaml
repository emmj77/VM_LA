id: "3D008"
tool: "pixal3d-ref-cold"
date: "2026-10-17"
tags: ["3d", "pixal3d", "ref-cold", "glb"]

RULES:
  enabled: true
  timeout: 1800
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "image -> 3D (Pixal3D), variant fixed reference (graines neuves 1042+, le reste comme la base)"

COMMAND: |
  I=$(cat); [ -n "$I" ] || { echo 'refused: missing image' >&2; exit 1; }; [ -f "$I" ] || { echo "refused: image not found ($I)" >&2; exit 1; }
  W=/mnt/hermes_workspace/hermes/tools/pixal3d_variantes/ref_cold/workflow_pixal3d_rts_api.json
  O="{{out}}"; [ -n "$O" ] || O="$ROOT/work/GLB_PIXAL3D"
  pixal3d gen "$I" --workflow "$W" --out "$O"

ARGS:
  - {name: image, type: path, stdin: true}
  - {name: out, type: path, required: false}
