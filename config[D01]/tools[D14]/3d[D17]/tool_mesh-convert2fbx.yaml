id: "3D002"
tool: "mesh-convert2fbx"
date: "2026-10-17"
tags: ["3d", "mesh-convert2fbx", "fbx", "convert"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "converts a 3D mesh to .fbx"

COMMAND: |
  I=$(cat); [ -n "$I" ] || { printf '%s\n' "$(msg mesh_missing)" >&2; exit 1; }; [ -f "$I" ] || { printf '%s\n' "$(msg mesh_found_i "$I")" >&2; exit 1; }
  O="{{out}}"; [ -n "$O" ] || O="${I%.*}.fbx"
  mesh convert "$I" "$O"

ARGS:
  - {name: input, type: path, stdin: true}
  - {name: out, type: path, required: false}
