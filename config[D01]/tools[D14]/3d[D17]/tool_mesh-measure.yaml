id: "3D004"
tool: "mesh-measure"
date: "2026-10-17"
tags: ["image", "shell", "mesh", "run"]

RULES:
  enabled: true
  timeout: 300
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "measures a 3D mesh"

COMMAND: |
  I=$(cat); [ -n "$I" ] || { printf '%s\n' "$(msg mesh_missing)" >&2; exit 1; }; [ -f "$I" ] || { printf '%s\n' "$(msg mesh_found_i "$I")" >&2; exit 1; }
  mesh measure "$I"

ARGS:
  - {name: input, type: path, stdin: true}
