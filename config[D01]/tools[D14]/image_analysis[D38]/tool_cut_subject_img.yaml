id: "V004"
tool: "cut_subject_img"
date: "2026-10-21"
tags: ["vision", "shell", "img", "cut"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "cuts the subject out of an image and writes its alpha mask (PNG)"

COMMAND: |
  LC_ALL=C; export LC_ALL
  F="$W/{{source}}"; [ -f "$F" ] || F="$ROOT/{{source}}"
  [ -f "$F" ] || { printf 'refused: the image is missing (%s)\n' "{{source}}" >&2 ; exit 1 ; }
  O="$W/{{out}}"
  if [ -z "{{out}}" ]; then _b=$(basename "$F"); O="$(dirname "$F")/${_b%.*}.alpha.png"; fi
  run_call comfyui_pixel_job "op=matte" "image=$F" "out=$O" "zone=0,0,0,0"

ARGS:
  - {name: source, type: path}
  - {name: out, type: path}
