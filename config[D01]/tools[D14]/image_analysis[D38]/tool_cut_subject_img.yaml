id: "V004"
tool: "cut_subject_img"
date: "2026-10-21"
tags: ["vision", "shell", "img", "cut"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "cuts the subject out of an image and writes its alpha mask (PNG)"

COMMAND: |
  LC_ALL=C; export LC_ALL
  F="$W/{{source}}"; [ -f "$F" ] || F="$ROOT/{{source}}"
  [ -f "$F" ] || { printf 'refused: the image is missing (%s)\n' "{{source}}" >&2 ; exit 1 ; }
  O="$W/{{out}}"
  _r=$(run_call comfyui_pixel_job "op=matte" "image=$F" "out=$O" "zone=0,0,0,0") || { printf '%s\n' "$(printf '%s' "$_r" | jq -r '.result // "refused"' 2>/dev/null)" >&2 ; exit 1 ; }
  printf '%s\n' "$(printf '%s' "$_r" | jq -r '.result // empty' 2>/dev/null)"

ARGS:
  - {name: source, type: path}
  - {name: out, type: path}
