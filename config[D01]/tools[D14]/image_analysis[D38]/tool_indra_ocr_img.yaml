id: "V003"
tool: "indra_ocr_img"
date: "2026-10-21"
tags: ["vision", "indra", "img", "ocr"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "reads the TEXT of an image or a PDF, in markdown, plain text, or lines with boxes"

COMMAND: |
  LC_ALL=C; export LC_ALL
  F="$W/{{source}}"; [ -f "$F" ] || F="$ROOT/{{source}}"
  [ -f "$F" ] || { printf 'refused: the file is missing (%s)\n' "{{source}}" >&2 ; exit 1 ; }
  case "$F" in
    *.png|*.jpg|*.jpeg|*.webp|*.tif|*.tiff|*.bmp|*.pnm|*.pdf) ;;
    *) printf '%s\n' "$(msg image_type_not_read)" >&2 ; exit 1 ;;
  esac
  _I=$(cfg str machine.ocr.bin) || exit 1
  _M=$(cfg str machine.ocr.models) || exit 1
  [ -x "$_I" ] || { printf '%s\n' "$(msg indra_missing_machine)" >&2 ; exit 1 ; }
  _fmt='{{mode}}'
  case $_fmt in md|text|json) ;; *) printf 'refused: mode is md, text or json\n' >&2 ; exit 1 ;; esac
  T=$("$_I" "$F" --format "$_fmt" --model-dir "$_M" 2>/dev/null | sed -e 's/[[:space:]]*$//' -e '/^$/d')
  if [ -z "$T" ]; then
    printf '%s\n' "$(msg text_found_image_path)"
    exit 0
  fi
  printf '%s\n' "$T"

ARGS:
  - {name: source, type: path}
  - {name: mode, type: enum, values: [md, text, json]}
