id: "V005"
tool: "repair_zone_img"
date: "2026-10-21"
tags: ["vision", "shell", "img", "repair"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "repairs a rectangular zone of an image: removes what sits there and fills it"

COMMAND: |
  LC_ALL=C; export LC_ALL
  F="$W/{{source}}"; [ -f "$F" ] || F="$ROOT/{{source}}"
  [ -f "$F" ] || { printf 'refused: the image is missing (%s)\n' "{{source}}" >&2 ; exit 1 ; }
  O="$W/{{out}}"
  _r=$(run_call comfyui_pixel_job "op=inpaint" "image=$F" "out=$O" "zone={{zone}}") || { printf '%s\n' "$(printf '%s' "$_r" | jq -r '.result // "refused"' 2>/dev/null)" >&2 ; exit 1 ; }
  printf '%s\n' "$(printf '%s' "$_r" | jq -r '.result // empty' 2>/dev/null)"

ARGS:
  - {name: source, type: path}
  - {name: out, type: path}
  - {name: zone, type: text}
