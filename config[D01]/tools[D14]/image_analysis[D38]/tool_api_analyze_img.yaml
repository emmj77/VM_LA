id: "V001"
tool: "api_analyze_img"
date: "2026-10-21"
tags: ["vision", "api", "img", "analyze"]

RULES:
  enabled: true
  timeout: 600
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "reads an image with the API's multimodal model and returns its words"

COMMAND: |
  LC_ALL=C; export LC_ALL
  _ke=$(cfg str machine.vision.api.key_env) || exit 1
  KEY=$(printenv "$_ke" 2>/dev/null) || KEY=""
  [ -n "$KEY" ] || { printf '%s\n' "$(msg api_key_missing)" >&2 ; exit 1 ; }
  API=$(cfg str machine.vision.api.base) || exit 1
  MODEL=$(cfg str machine.vision.api.model) || exit 1
  F="$W/{{image}}"; [ -f "$F" ] || F="$ROOT/{{image}}"
  [ -f "$F" ] || { printf '%s\n' "$(msg image_missing_path)" >&2 ; exit 1 ; }
  case "$F" in
    *.png) M=image/png ;;
    *.jpg|*.jpeg) M=image/jpeg ;;
    *.webp) M=image/webp ;;
    *.gif) M=image/gif ;;
    *.bmp) M=image/bmp ;;
    *) printf '%s\n' "$(msg image_type_unread)" >&2 ; exit 1 ;;
  esac
  Q=$(cat); [ -n "$Q" ] || Q="Describe this image in detail."
  command -v jq >/dev/null 2>&1 || { printf '%s\n' "$(msg jq_missing)" >&2 ; exit 1 ; }
  TD=$(mktemp -d "${TMPDIR:-/tmp}/api_analyze_img.XXXXXX") || { printf '%s\n' "$(msg no_temp_space_left)" >&2 ; exit 1 ; }
  trap 'rm -f "$TD/b" "$TD/q"' EXIT INT TERM HUP
  base64 -w 0 -- "$F" > "$TD/b" || { printf '%s\n' "$(msg image_unreadable "$F")" >&2 ; exit 1 ; }
  jq -cn --arg m "$M" --rawfile b "$TD/b" --arg q "$Q" --arg mo "$MODEL" '{model:$mo,stream:false,temperature:0.1,max_tokens:2048,messages:[{role:"user",content:[{type:"text",text:$q},{type:"image_url",image_url:{url:("data:"+$m+";base64,"+$b)}}]}]}' > "$TD/q" || { printf '%s\n' "$(msg request_not_built)" >&2 ; exit 1 ; }
  R=$(curl -sS -m 180 -H 'Content-Type: application/json' -H "Authorization: Bearer $KEY" --data-binary @"$TD/q" "$API/chat/completions") || { printf '%s\n' "$(msg api_no_answer "$API")" >&2 ; exit 1 ; }
  T=$(printf '%s' "$R" | jq -r 'if ((.choices[0].message.content // "") != "") then .choices[0].message.content else (.choices[0].message.reasoning // "") end' 2>/dev/null | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d')
  [ -n "$T" ] || { printf '%s\n' "$(msg api_rendered_nothing "$(printf '%s' "$R" | tr '\n' ' ' | cut -c1-200)")" >&2 ; exit 1 ; }
  printf '%s\n' "$T"

ARGS:
  - {name: image, type: path}
  - {name: question, type: text, stdin: true}
