id: "V002"
tool: "local_analyze_img"
date: "2026-10-21"
tags: ["vision", "local", "img", "analyze"]

RULES:
  enabled: true
  timeout: 300
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "reads an image with a local model: small (fast) or big (detailed)"

COMMAND: |
  LC_ALL=C; export LC_ALL
  _md='{{model}}'
  NAME=$(cfg str "machine.llama.models.$_md.name") || { printf 'refused: no such model (%s)\n' "$_md" >&2 ; exit 1 ; }
  H=$(cfg str models.host) || H=127.0.0.1
  P=$(cfg num models.port) || exit 1
  MT=$(cfg num limits.vision_tokens) || MT=1024
  URL="http://$H:$P"
  F="$W/{{image}}"; [ -f "$F" ] || F="$ROOT/{{image}}"
  [ -f "$F" ] || { printf 'refused: the image is missing (%s)\n' "{{image}}" >&2 ; exit 1 ; }
  case "$F" in
    *.png) M=image/png ;;
    *.jpg|*.jpeg) M=image/jpeg ;;
    *.webp) M=image/webp ;;
    *.bmp) M=image/bmp ;;
    *) printf 'refused: this image type is not read (%s)\n' "$F" >&2 ; exit 1 ;;
  esac
  curl -fsS -m 3 "$URL/health" >/dev/null 2>&1 || { printf 'refused: the router is silent on %s:%s -- start la-models\n' "$H" "$P" >&2 ; exit 1 ; }
  Q="{{question}}"; [ -n "$Q" ] || Q="Describe this image in detail."
  command -v jq >/dev/null 2>&1 || { printf 'refused: jq is missing\n' >&2 ; exit 1 ; }
  TD=$(mktemp -d "${TMPDIR:-/tmp}/local_analyze_img.XXXXXX") || { printf 'refused: no space left for a temp folder\n' >&2 ; exit 1 ; }
  trap 'rm -f "$TD/b" "$TD/q"' EXIT INT TERM HUP
  base64 -w 0 -- "$F" > "$TD/b" || { printf 'refused: the image is unreadable (%s)\n' "$F" >&2 ; exit 1 ; }
  jq -cn --arg m "$M" --rawfile b "$TD/b" --arg q "$Q" --arg mo "$NAME" --argjson mt "$MT" '{model:$mo,stream:false,temperature:0.2,max_tokens:$mt,messages:[{role:"user",content:[{type:"text",text:$q},{type:"image_url",image_url:{url:("data:"+$m+";base64,"+$b)}}]}]}' > "$TD/q" || { printf 'refused: the request did not build\n' >&2 ; exit 1 ; }
  R=$(curl -sS -m 280 -H 'Content-Type: application/json' --data-binary @"$TD/q" "$URL/v1/chat/completions") || { printf 'refused: the router did not answer (%s)\n' "$URL" >&2 ; exit 1 ; }
  T=$(printf '%s' "$R" | jq -r 'if ((.choices[0].message.content // "") != "") then .choices[0].message.content else (.choices[0].message.reasoning // "") end' 2>/dev/null | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d')
  [ -n "$T" ] || { printf 'refused: the model rendered nothing (%s)\n' "$(printf '%s' "$R" | tr '\n' ' ' | cut -c1-200)" >&2 ; exit 1 ; }
  # the eye is not a resident: it leaves the memory as soon as it has read
  curl -fsS -m 10 -H 'Content-Type: application/json' -d "{\"model\":\"$NAME\"}" "$URL/models/unload" >/dev/null 2>&1
  printf '%s\n' "$T"

ARGS:
  - {name: model, type: enum, values: [small, big]}
  - {name: image, type: path}
  - {name: question, type: text, stdin: true}
