# one gesture on the plan of the armed skill: two lines per task, 400 to 419.
id: "P001"
tool: "plan.add"
date: "2026-10-20"
tags: ["plan", "add"]
RULES:
  enabled: true
  timeout: 30
  writable_workspace: ""
  approval: none
  turn: plan
  count: false
  paths: write
DESCRIPTION: "add one task, todo, after the last one"
COMMAND: |
  _s=$(skl_skill 2>/dev/null)
  [ -n "$_s" ] || { printf 'note no armed skill: the plan has nowhere to live\n'; exit 0; }
  _f="$(cfg path skills)/$_s/skill.yaml"
  [ -r "$_f" ] || { printf 'FAULT %s carries no skill.yaml\n' "$_s"; exit 0; }
  txt=$(cat)
  [ -n "$txt" ] || { printf 'FAULT add wants the task on the input\n'; exit 0; }
  id=0
  state=todo
  _t=$(tmpfile plan) || exit 0
  awk -v mode="add" -v id="$id" -v txt="$txt" -v state="" '
    function num(s) { if (match(s, /[0-9]+/)) return substr(s, RSTART, RLENGTH) + 0; return -1 }
    function nx() { return (max == 0) ? 400 : ((max % 2) ? max + 1 : max + 2) }
    /^PLAN:[ \t]*$/ { inplan = 1; print; next }
    inplan && /^[^ \t]/ { if (mode == "add" && !done) { n = nx(); printf "  %d: \"tache : %s\"\n  %d: \"etat : todo\"\n", n, txt, n + 1; done = 1 } inplan = 0 }
    inplan && /^[ \t]*[0-9]+:/ {
      k = num($0)
      if (k > max) max = k
      if (mode == "add") { print; next }
      if (k == id + 0) { printf "  %d: \"tache : %s\"\n", k, txt; done = 1; next }
      if (k == id + 1 && mode == "state") { printf "  %d: \"etat : %s\"\n", k, state; done = 1; next }
      print; next
    }
    { print }
    END {
      if (mode == "add" && !done) { n = nx(); printf "  %d: \"tache : %s\"\n  %d: \"etat : todo\"\n", n, txt, n + 1; done = 1 }
      exit (done ? 0 : 9)
    }' "$_f" > "$_t"
  [ $? = 0 ] || { printf 'FAULT no such task in the plan of %s\n' "$_s"; exit 0; }
  [ -s "$_t" ] || { printf 'FAULT the plan did not build\n'; exit 0; }
  mv -f "$_t" "$_f" || { printf 'FAULT the plan is not writable\n'; exit 0; }
  printf 'ok the task is in the plan of %s\n' "$_s"
  exit 0
ARGS: []
