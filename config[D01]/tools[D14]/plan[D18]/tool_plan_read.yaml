# one gesture on the plan of the armed skill: two lines per task, 400 to 419.
id: "P005"
tool: "plan.read"
date: "2026-10-20"
tags: ["plan", "shell", "plan", "read"]
RULES:
  enabled: true
  timeout: 30
  writable_workspace: ""
  approval: none
  turn: plan
  count: false
  paths: write
DESCRIPTION: "read the plan of the armed skill, task by task"
COMMAND: |
  _s=$(skl_skill 2>/dev/null)
  [ -n "$_s" ] || { printf 'note no armed skill: the plan has nowhere to live\n'; exit 0; }
  _f="$(cfg path skills)/$_s/skill.yaml"
  [ -r "$_f" ] || { printf 'FAULT %s carries no skill.yaml\n' "$_s"; exit 0; }
  _t=$(tmpfile plan) || exit 0
  _t=$(tmpfile plan_read) || exit 0
  awk '/^PLAN:[ \t]*$/ { p = 1; next } /^[^ \t]/ { p = 0 } p && NF' "$_f" > "$_t"
  _n=0; _todo=0; _prog=0; _done=0; _task=""
  while IFS= read -r _l; do
    case $_l in
      *'"tache : '*)  _task=$(printf '%s' "$_l" | sed 's/.*tache : //; s/"$//'); _n=$((_n + 1)) ;;
      *'"etat : '*)   _e=$(printf '%s' "$_l" | sed 's/.*etat : //; s/"$//')
                      case $_e in
                        todo)        _todo=$((_todo + 1)) ;;
                        in_progress) _prog=$((_prog + 1)) ;;
                        done)        _done=$((_done + 1)) ;;
                      esac
                      printf '  %-52s %s\n' "$_task" "$_e" ;;
    esac
  done < "$_t"
  rm -f "$_t"
  [ "$_n" -gt 0 ] && printf 'ok %s task(s) in the plan of %s: %s todo, %s in_progress, %s done\n' "$_n" "$_s" "$_todo" "$_prog" "$_done" \
    || printf 'ok the plan of %s is empty\n' "$_s"
  exit 0

ARGS: []
