id: "C003"
tool: "comfyui_colorize"
date: "2026-10-17"
tags: ["image", "comfyui", "animation", "run"]

RULES:
  enabled: true
  timeout: 1200
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "colourises an ink drawing: the drawing machine proposes colours (lineart controlnet), the aplatisseur flattens them into the regions closed by the ink, Krita takes the flat back into a new layer"

COMMAND: |
  SERVICE=http://127.0.0.1:8188
  APLAT=http://127.0.0.1:${LA_FLATTENER_PORT:-8097}
  TEXT="{{style}}"
  [ -n "$TEXT" ] || { printf '%s\n' "$(msg subject_missing)" >&2; exit 1; }
  curl -sf --max-time 10 "$SERVICE/system_stats" >/dev/null 2>&1 || { printf '%s\n' "$(msg comfy_no_answer)""$SERVICE" >&2; exit 1; }
  curl -sf --max-time 10 "$APLAT/health" >/dev/null 2>&1 || { printf '%s\n' "$(msg flattener_no_answer)""$APLAT" >&2; exit 1; }
  command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1 || { printf '%s\n' "$(msg ffmpeg_missing)" >&2; exit 1; }
  SRC="$W/{{source}}"
  [ -f "$SRC" ] || { printf '%s\n' "$(msg drawing_missing)""$SRC" >&2; exit 1; }
  case "$SRC" in *.kra|*.krz) ;; *) printf '%s\n' "$(msg kra_required '%s')""$SRC" >&2; exit 1 ;; esac
  T="${TMPDIR:-/tmp}"
  APLAT_SRC="$T/la_colorier_aplat.png"
  unzip -p "$SRC" mergedimage.png > "$APLAT_SRC" 2>/dev/null
  [ -s "$APLAT_SRC" ] || { printf '%s\n' "$(msg kra_has_no_merged_image)""$SRC" >&2; exit 1; }
  SIZE=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$APLAT_SRC" | tr ',' 'x')
  L=${SIZE%x*}; H=${SIZE#*x}
  SERVICEK=http://127.0.0.1:5678
  curl -sf --max-time 10 "$SERVICEK/health" >/dev/null 2>&1 || { printf '%s\n' "$(msg krita_no_answer_ink)""$SERVICEK" >&2; exit 1; }
  K() { curl -sS --max-time "$2" -H 'Content-Type: application/json' -d "$1" "$SERVICEK/"; }
  K "$(jq -cn --arg p "$SRC" '{action:"open_file",params:{path:$p}}')" 180 | jq -e '.status == "ok"' >/dev/null 2>&1 || { printf '%s\n' "$(msg krita_cannot_open_p)""$SRC" >&2; exit 1; }
  ENC="{{layer}}"; [ -n "$ENC" ] || ENC="encrage"
  LIST=$(K '{"action":"list_layers","params":{}}' 60)
  NAMES=$(printf '%s' "$LIST" | jq -r '.layers[].name')
  printf '%s\n' "$NAMES" | grep -Fxq "$ENC" || { printf '%s\n' "$(msg layer_unknown_drawing)""$ENC" "$(printf '%s' "$NAMES" | tr '\n' ' ')" >&2; exit 1; }
  VIS=$(printf '%s' "$LIST" | jq -r '.layers[] | select(.visible) | .name')
  CACHES=$(printf '%s' "$LIST" | jq -r '.layers[] | select(.visible|not) | .name')
  printf '%s\n' "$NAMES" | while IFS= read -r N; do if [ "$N" = "$ENC" ]; then V=true; else V=false; fi; K "$(jq -cn --arg n "$N" --argjson v "$V" '{action:"set_layer_visibility",params:{name:$n,visible:$v}}')" 30 >/dev/null; done
  K "$(jq -cn --arg n "$ENC" '{action:"select_layer",params:{name:$n}}')" 30 >/dev/null
  MASQUE="$T/la_colorier_masque.png"
  K "$(jq -cn --arg p "$MASQUE" '{action:"save",params:{path:$p}}')" 300 | jq -e '.status == "ok"' >/dev/null 2>&1 || { printf '%s\n' "$(msg krita_layer_unrendered)""$ENC" >&2; exit 1; }
  [ -s "$MASQUE" ] || { printf '%s\n' "$(msg layer_empty)""$ENC" >&2; exit 1; }
  if printf '%s' "$VIS" | grep -q . ; then printf '%s\n' "$VIS" | while IFS= read -r N; do K "$(jq -cn --arg n "$N" '{action:"set_layer_visibility",params:{name:$n,visible:true}}')" 30 >/dev/null; done; fi
  if printf '%s' "$CACHES" | grep -q . ; then printf '%s\n' "$CACHES" | while IFS= read -r N; do K "$(jq -cn --arg n "$N" '{action:"set_layer_visibility",params:{name:$n,visible:false}}')" 30 >/dev/null; done; fi
  printf '%s\n' "$(msg mask_single_layer)""$ENC" "$L" "$H"
  NAME=$(curl -s -F "image=@$APLAT_SRC" -F "type=input" -F "subfolder=" -F "overwrite=true" "$SERVICE/upload/image" | jq -r '.name // empty')
  [ -n "$NAME" ] || { printf '%s\n' "$(msg flat_refused)" >&2; exit 1; }
  set -- $(awk -v l="$L" -v h="$H" -v b="${LA_COMFY_SIZE:-1024}" 'BEGIN{e=sqrt(b*b/(l*h)); tw=int(l*e)/64*64; th=int(h*e)/64*64; if(tw<64)tw=64; if(th<64)th=64; printf "%d %d", tw, th}')
  TW=$1; TH=$2
  G=$(jq -cn --arg ck "${LA_COMFY_CKPT:-dreamshaper_8.safetensors}" --arg cnet "${LA_COMFY_CONTROLNET:-control_v11p_sd15_lineart_fp16.safetensors}" --arg t "$TEXT" --arg img "$NAME" \
    --argjson larg "$TW" --argjson haut "$TH" --argjson force "${LA_COMFY_FORCE:-0.9}" --argjson etapes "${LA_COMFY_STEPS:-25}" --argjson cfg "${LA_COMFY_CFG:-7.0}" \
    --argjson res "${LA_COMFY_RESOLUTION:-1024}" --argjson sd "$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')" '
    {"4":{"class_type":"CheckpointLoaderSimple","inputs":{"ckpt_name":$ck}},
     "10":{"class_type":"LoadImage","inputs":{"image":$img}},
     "11":{"class_type":"ControlNetLoader","inputs":{"control_net_name":$cnet}},
     "6":{"class_type":"CLIPTextEncode","inputs":{"text":$t,"clip":["4",1]}},
     "7":{"class_type":"CLIPTextEncode","inputs":{"text":"low quality, worst quality, blurry, jpeg artifacts, text, watermark, signature","clip":["4",1]}},
     "12":{"class_type":"LineArtPreprocessor","inputs":{"image":["10",0],"resolution":$res,"coarse":"disable"}},
     "13":{"class_type":"ControlNetApplyAdvanced","inputs":{"positive":["6",0],"negative":["7",0],"control_net":["11",0],"image":["12",0],"strength":$force,"start_percent":0.0,"end_percent":1.0,"vae":["4",2]}},
     "5":{"class_type":"EmptyLatentImage","inputs":{"width":$larg,"height":$haut,"batch_size":1}},
     "3":{"class_type":"KSampler","inputs":{"seed":$sd,"steps":$etapes,"cfg":$cfg,"sampler_name":"dpmpp_2m","scheduler":"karras","denoise":1.0,"model":["4",0],"positive":["13",0],"negative":["13",1],"latent_image":["5",0]}},
     "8":{"class_type":"VAEDecode","inputs":{"samples":["3",0],"vae":["4",2]}},
     "9":{"class_type":"SaveImage","inputs":{"filename_prefix":"la_couleur","images":["8",0]}}}')
  R=$(jq -cn --argjson p "$G" '{prompt:$p,client_id:"la"}' | curl -s -H 'Content-Type: application/json' --data-binary @- "$SERVICE/prompt")
  PID=$(printf '%s' "$R" | jq -r '.prompt_id // empty')
  [ -n "$PID" ] || { printf '%s\n' "$(msg graph_rejected)""$(printf '%s' "$R" | jq -c '.error // .node_errors // .' | cut -c1-400)" >&2; exit 1; }
  i=0
  while [ "$i" -lt 450 ]; do H2=$(curl -s "$SERVICE/history/$PID"); printf '%s' "$H2" | jq -e --arg p "$PID" 'has($p)' >/dev/null 2>&1 && break; sleep 2; i=$((i + 1)); done
  [ "$i" -lt 450 ] || { printf '%s\n' "$(msg render_timeout '900')""$PID" >&2; exit 1; }
  ECHEC=$(printf '%s' "$H2" | jq -r --arg p "$PID" '.[$p].status.messages[]? | select(.[0]=="execution_error") | ((.[1].exception_type // "erreur") + " : " + (.[1].exception_message // ""))' | head -n 1)
  [ -z "$ECHEC" ] || { printf '%s\n' "$(msg machine_failed)""$ECHEC" >&2; exit 1; }
  IMG=$(printf '%s' "$H2" | jq -r --arg p "$PID" '.[$p].outputs[]?.images[]? | [.filename, (.subfolder // ""), (.type // "output")] | @tsv' | head -n 1)
  [ -n "$IMG" ] || { printf '%s\n' "$(msg render_no_image)" >&2; exit 1; }
  RENDER="$T/la_colorier_rendu.png"
  curl -s -G --data-urlencode "filename=$(printf '%s' "$IMG" | cut -f1)" --data-urlencode "subfolder=$(printf '%s' "$IMG" | cut -f2)" --data-urlencode "type=$(printf '%s' "$IMG" | cut -f3)" "$SERVICE/view" -o "$RENDER"
  [ -s "$RENDER" ] || { printf '%s\n' "$(msg render_not_down)" >&2; exit 1; }
  GUIDE="$T/la_colorier_guide.png"
  ffmpeg -y -v error -i "$RENDER" -vf "scale=${L}:${H}:flags=lanczos" -frames:v 1 "$GUIDE" || { printf '%s\n' "$(msg render_resize_failed)""$L" "$H" >&2; exit 1; }
  printf '%s\n' "$(msg render_resized)""$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$RENDER")" "$L" "$H"
  APLATI="$T/la_colorier_final.png"
  RA=$(curl -sS --max-time 600 -H 'Content-Type: application/json' -d "$(jq -cn --arg m "$MASQUE" --arg g "$GUIDE" --arg o "$APLATI" --argjson s "${LA_FLATTENER_THRESHOLD:-60}" '{mask:$m,guide:$g,out:$o,seuil:$s}')" "$APLAT/")
  printf '%s' "$RA" | jq -e '.status == "ok"' >/dev/null 2>&1 || { printf '%s\n' "$(msg flattener_refused)""$(printf '%s' "$RA" | jq -r '.error.message // "reponse illisible"')" >&2; exit 1; }
  [ -s "$APLATI" ] || { printf '%s\n' "$(msg flattener_empty)" >&2; exit 1; }
  printf "l'aplat : %s regions (%s grandes, %s petites recollees), %s octets\n" "$(printf '%s' "$RA" | jq -r .regions)" "$(printf '%s' "$RA" | jq -r .grandes)" "$(printf '%s' "$RA" | jq -r .petites)" "$(wc -c < "$APLATI")"
  OUTPUT="$W/{{output}}"
  [ -n "{{output}}" ] || OUTPUT="$W/couleur-$(date +%Y%m%d-%H%M%S).png"
  cp "$APLATI" "$OUTPUT"
  case "{{keep}}" in
    file) ;;
    *)
      NOMC="{{output_layer}}"; [ -n "$NOMC" ] || NOMC="couleur"
      K "$(jq -cn --arg p "$OUTPUT" --arg n "$NOMC" '{action:"import_image",params:{path:$p,name:$n}}')" 300 | jq -e '.status == "ok"' >/dev/null 2>&1 || { printf '%s\n' "$(msg krita_layer_not_set)""$NOMC" >&2; exit 1; }
      K "$(jq -cn --arg p "$SRC" '{action:"save_document",params:{path:$p}}')" 300 | jq -e '.status == "ok"' >/dev/null 2>&1 || { printf '%s\n' "$(msg layer_write_failed)""$SRC" >&2; exit 1; }
      printf '%s\n' "$(msg layer_written '%s')""$NOMC" "$SRC" "$(wc -c < "$SRC")"
      ;;
  esac

ARGS:
  - {name: source, type: path}                # the .kra drawing, relative to the space of the skill
  - {name: layer, type: text}                 # the ink layer = the mask (empty: encrage)
  - {name: output, type: path}                # the output PNG, in the space of the skill
  - {name: output_layer, type: text}          # the new layer name (empty: colour)
  - {name: keep, type: enum, values: [kra, file, ""]}   # kra: goes into the .kra; file: PNG only
  - {name: style, type: text, stdin: true}    # the subject, free text: on STANDARD INPUT
