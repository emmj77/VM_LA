id: "C006"
tool: "comfyui_variants"
date: "2026-10-17"
tags: ["comfyui", "comfyui_variants"]

RULES:
  enabled: true
  timeout: 1800
  writable_workspace: "work"
  approval: none
  turn: none
  count: false
  paths: write

DESCRIPTION: "draws N variants of the same drawing (one seed each) and builds a contact sheet to judge them"

COMMAND: |
  SERVICE=http://127.0.0.1:8188
  APLAT=http://127.0.0.1:${LA_FLATTENER_PORT:-8097}
  curl -sf --max-time 10 "$SERVICE/system_stats" >/dev/null 2>&1 || { printf '%s\n' "$(msg comfy_no_answer)""$SERVICE" >&2; exit 1; }
  curl -sf --max-time 10 "$APLAT/health" >/dev/null 2>&1 || { printf '%s\n' "$(msg flattener_no_answer)""$APLAT" >&2; exit 1; }
  command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1 || { printf '%s\n' "$(msg ffmpeg_missing)" >&2; exit 1; }
  T="${TMPDIR:-/tmp}"
  N="{{count}}"; case "$N" in ''|*[!0-9]*) N=4 ;; esac
  [ "$N" -ge 1 ] && [ "$N" -le 9 ] || { printf '%s\n' "$(msg count_range)""$N" >&2; exit 1; }
  TEXT=$(cat)
  [ -n "$TEXT" ] || { printf '%s\n' "$(msg subject_missing)" >&2; exit 1; }
  FILE="$W/{{source}}"
  [ -f "$FILE" ] || { printf '%s\n' "$(msg drawing_missing)""$FILE" >&2; exit 1; }
  unzip -p "$FILE" mergedimage.png > "$T/la_var_aplat.png" 2>/dev/null
  [ -s "$T/la_var_aplat.png" ] || { printf '%s\n' "$(msg image_has_no_flat_colour_2)""$FILE" >&2; exit 1; }
  SIZE=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$T/la_var_aplat.png" | tr ',' 'x')
  L=${SIZE%x*}; H=${SIZE#*x}
  SERVICEK=http://127.0.0.1:5678
  curl -sf --max-time 10 "$SERVICEK/health" >/dev/null 2>&1 || { printf '%s\n' "$(msg krita_no_answer)""$SERVICEK" >&2; exit 1; }
  K() { curl -sS --max-time "$2" -H 'Content-Type: application/json' -d "$1" "$SERVICEK/"; }
  calque_seul() {          # $1 = the layer to render, $2 = the output PNG
    K "$(jq -cn --arg p "$FILE" '{action:"open_file",params:{path:$p}}')" 180 | jq -e '.status == "ok"' >/dev/null 2>&1 || { printf '%s\n' "$(msg krita_cannot_open_p)""$FILE" >&2; return 1; }
    LIST=$(K '{"action":"list_layers","params":{}}' 60)
    NAMES=$(printf '%s' "$LIST" | jq -r '.layers[].name')
    printf '%s\n' "$NAMES" | grep -Fxq "$1" || { printf '%s\n' "$(msg layer_unknown)""$1" "$(printf '%s' "$NAMES" | tr '\n' ' ')" >&2; return 1; }
    VIS=$(printf '%s' "$LIST" | jq -r '.layers[] | select(.visible) | .name')
    CACHES=$(printf '%s' "$LIST" | jq -r '.layers[] | select(.visible|not) | .name')
    printf '%s\n' "$NAMES" | while IFS= read -r N; do if [ "$N" = "$1" ]; then V=true; else V=false; fi; K "$(jq -cn --arg n "$N" --argjson v "$V" '{action:"set_layer_visibility",params:{name:$n,visible:$v}}')" 30 >/dev/null; done
    K "$(jq -cn --arg n "$1" '{action:"select_layer",params:{name:$n}}')" 30 >/dev/null
    K "$(jq -cn --arg p "$2" '{action:"save",params:{path:$p}}')" 300 | jq -e '.status == "ok"' >/dev/null 2>&1 || { printf '%s\n' "$(msg krita_layer_unrendered)""$1" >&2; return 1; }
    [ -s "$2" ] || { printf '%s\n' "$(msg layer_empty)""$1" >&2; return 1; }
    if printf '%s' "$VIS" | grep -q . ; then printf '%s\n' "$VIS" | while IFS= read -r N; do K "$(jq -cn --arg n "$N" '{action:"set_layer_visibility",params:{name:$n,visible:true}}')" 30 >/dev/null; done; fi
    if printf '%s' "$CACHES" | grep -q . ; then printf '%s\n' "$CACHES" | while IFS= read -r N; do K "$(jq -cn --arg n "$N" '{action:"set_layer_visibility",params:{name:$n,visible:false}}')" 30 >/dev/null; done; fi
    return 0
  }
  ENC="{{layer}}"; [ -n "$ENC" ] || ENC="encrage"
  calque_seul "$ENC" "$T/la_var_masque.png" || exit 1
  printf '%s\n' "$(msg mask_ink_only "$ENC" "${L}" "${H}")"
  NAME=$(curl -s -F "image=@$T/la_var_aplat.png" -F "type=input" -F "subfolder=" -F "overwrite=true" "$SERVICE/upload/image" | jq -r '.name // empty')
  [ -n "$NAME" ] || { printf '%s\n' "$(msg flat_refused)" >&2; exit 1; }
  set -- $(awk -v l="$L" -v h="$H" -v b="${LA_COMFY_SIZE:-1024}" 'BEGIN{e=sqrt(b*b/(l*h)); tw=int(l*e)/64*64; th=int(h*e)/64*64; if(tw<64)tw=64; if(th<64)th=64; printf "%d %d", tw, th}')
  TW=$1; TH=$2
  rendre() {              # $1 = the graph already built; sets $RENDER, or refuses and exits
    R=$(jq -cn --argjson p "$1" '{prompt:$p,client_id:"la"}' | curl -s -H 'Content-Type: application/json' --data-binary @- "$SERVICE/prompt")
    PID=$(printf '%s' "$R" | jq -r '.prompt_id // empty')
    [ -n "$PID" ] || { printf '%s\n' "$(msg graph_rejected)""$(printf '%s' "$R" | jq -c '.error // .node_errors // .' | cut -c1-400)" >&2; exit 1; }
    ROUND=0
    while [ "$ROUND" -lt 600 ]; do H2=$(curl -s "$SERVICE/history/$PID"); printf '%s' "$H2" | jq -e --arg p "$PID" 'has($p)' >/dev/null 2>&1 && break; sleep 2; ROUND=$((ROUND + 1)); done
    [ "$ROUND" -lt 600 ] || { printf '%s\n' "$(msg render_timeout '1200')""$PID" >&2; exit 1; }
    ECHEC=$(printf '%s' "$H2" | jq -r --arg p "$PID" '.[$p].status.messages[]? | select(.[0]=="execution_error") | ((.[1].exception_type // "erreur") + " : " + (.[1].exception_message // ""))' | head -n 1)
    [ -z "$ECHEC" ] || { printf '%s\n' "$(msg machine_failed)""$ECHEC" >&2; exit 1; }
    IMG=$(printf '%s' "$H2" | jq -r --arg p "$PID" '.[$p].outputs[]?.images[]? | [.filename, (.subfolder // ""), (.type // "output")] | @tsv' | head -n 1)
    [ -n "$IMG" ] || { printf '%s\n' "$(msg render_no_image)" >&2; exit 1; }
    RENDER="$T/la_rendu.png"
    curl -s -G --data-urlencode "filename=$(printf '%s' "$IMG" | cut -f1)" --data-urlencode "subfolder=$(printf '%s' "$IMG" | cut -f2)" --data-urlencode "type=$(printf '%s' "$IMG" | cut -f3)" "$SERVICE/view" -o "$RENDER"
    [ -s "$RENDER" ] || { printf '%s\n' "$(msg render_not_down)" >&2; exit 1; }
  }
  aplatir() {              # $1 = mask, $2 = guide, $3 = output; sets the region count
    RA=$(curl -sS --max-time 600 -H 'Content-Type: application/json' -d "$(jq -cn --arg m "$1" --arg g "$2" --arg o "$3" '{mask:$m,guide:$g,out:$o}')" "$APLAT/")
    printf '%s' "$RA" | jq -e '.status == "ok"' >/dev/null 2>&1 || { printf '%s\n' "$(msg flattener_refused)""$(printf '%s' "$RA" | jq -r '.error.message // "reponse illisible"')" >&2; exit 1; }
    REGIONS=$(printf '%s' "$RA" | jq -r .regions); GRANDES=$(printf '%s' "$RA" | jq -r .grandes); PETITES=$(printf '%s' "$RA" | jq -r .petites)
    return 0
  }
  GRAINE() { od -An -N4 -tu4 /dev/urandom | tr -d ' '; }
  TIRAGE=1; IMAGES=""; J=0; FILTRE=""; POS=""; COLONNES=0
  while [ "$TIRAGE" -le "$N" ]; do
    GRAINE=$(GRAINE)
  GRAPHE=$(jq -cn --arg ck "${LA_COMFY_CKPT:-dreamshaper_8.safetensors}" --arg cnet "${LA_COMFY_CONTROLNET:-control_v11p_sd15_lineart_fp16.safetensors}" --arg t "$TEXT" --arg img "$NAME" \
    --argjson larg "$TW" --argjson haut "$TH" --argjson force "${LA_COMFY_FORCE:-0.9}" --argjson etapes "${LA_COMFY_STEPS:-25}" --argjson cfg "${LA_COMFY_CFG:-7.0}" \
    --argjson res "${LA_COMFY_RESOLUTION:-1024}" --argjson sd "$GRAINE" '
    {"4":{"class_type":"CheckpointLoaderSimple","inputs":{"ckpt_name":$ck}},
     "10":{"class_type":"LoadImage","inputs":{"image":$img}},
     "11":{"class_type":"ControlNetLoader","inputs":{"control_net_name":$cnet}},
     "6":{"class_type":"CLIPTextEncode","inputs":{"text":$t,"clip":["4",1]}},
     "7":{"class_type":"CLIPTextEncode","inputs":{"text":"low quality, worst quality, blurry, jpeg artifacts, text, watermark, signature","clip":["4",1]}},
     "12":{"class_type":"LineArtPreprocessor","inputs":{"image":["10",0],"resolution":$res,"coarse":"disable"}},
     "13":{"class_type":"ControlNetApplyAdvanced","inputs":{"positive":["6",0],"negative":["7",0],"control_net":["11",0],"image":["12",0],"strength":$force,"start_percent":0.0,"end_percent":1.0,"vae":["4",2]}},
     "5":{"class_type":"EmptyLatentImage","inputs":{"width":$larg,"height":$haut,"batch_size":1}},
     "3":{"class_type":"KSampler","inputs":{"seed":$sd,"steps":$etapes,"cfg":$cfg,"sampler_name":"dpmpp_2m","scheduler":"karras","denoise":1.0,"model":["4",0],"positive":["13",0],"negative":["13",1],"latent_image":["5",0]}},
     "8":{"class_type":"VAEDecode","inputs":{"samples":["3",0],"vae":["4",2]}},
     "9":{"class_type":"SaveImage","inputs":{"filename_prefix":"la_couleur","images":["8",0]}}}')
    rendre "$GRAPHE"
    ffmpeg -y -v error -i "$RENDER" -vf "scale=${L}:${H}:flags=lanczos" -frames:v 1 "$T/la_var_guide.png"
    aplatir "$T/la_var_masque.png" "$T/la_var_guide.png" "$W/couleur_v$TIRAGE.png"
    printf "   tirage %s (graine %s) : %s regions (%s grandes, %s petites) -> couleur_v%s.png\n" "$TIRAGE" "$GRAINE" "$REGIONS" "$GRANDES" "$PETITES" "$TIRAGE"
    TIRAGE=$((TIRAGE + 1))
  done
  OUTPUT="$W/{{output}}"
  [ -n "{{output}}" ] || OUTPUT="$W/planche_$(date +%Y%m%d-%H%M%S).png"
  TIRAGE=1
  while [ "$TIRAGE" -le "$N" ]; do ffmpeg -y -v error -i "$W/couleur_v$TIRAGE.png" -vf "scale=560:-1" -frames:v 1 "$T/la_var_p$TIRAGE.png"; TIRAGE=$((TIRAGE + 1)); done
  case "$N" in
    1) ffmpeg -y -v error -i "$T/la_var_p1.png" -frames:v 1 "$OUTPUT" ;;
    2) ffmpeg -y -v error -i "$T/la_var_p1.png" -i "$T/la_var_p2.png" -filter_complex hstack -frames:v 1 "$OUTPUT" ;;
    3) ffmpeg -y -v error -i "$T/la_var_p1.png" -i "$T/la_var_p2.png" -i "$T/la_var_p3.png" -filter_complex "[0][1][2]hstack=inputs=3" -frames:v 1 "$OUTPUT" ;;
    4) ffmpeg -y -v error -i "$T/la_var_p1.png" -i "$T/la_var_p2.png" -i "$T/la_var_p3.png" -i "$T/la_var_p4.png" -filter_complex "[0][1]hstack[t];[2][3]hstack[b];[t][b]vstack" -frames:v 1 "$OUTPUT" ;;
    5|6) A=""; B=""; TIRAGE=1; while [ "$TIRAGE" -le "$N" ]; do if [ "$TIRAGE" -le 3 ]; then A="$A -i $T/la_var_p$TIRAGE.png"; else B="$B -i $T/la_var_p$TIRAGE.png"; fi; TIRAGE=$((TIRAGE + 1)); done
         ffmpeg -y -v error $A $B -filter_complex "[0][1][2]hstack[h1];[3][4][5]hstack[h2];[h1][h2]vstack" -frames:v 1 "$OUTPUT" ;;
    7|8|9) A=""; TIRAGE=1; while [ "$TIRAGE" -le "$N" ]; do A="$A -i $T/la_var_p$TIRAGE.png"; TIRAGE=$((TIRAGE + 1)); done
         ffmpeg -y -v error $A -filter_complex "[0][1][2]hstack[h1];[3][4][5]hstack[h2];[6][7][8]hstack[h3];[h1][h2][h3]vstack" -frames:v 1 "$OUTPUT" ;;
  esac
  [ -s "$OUTPUT" ] || { printf '%s\n' "$(msg contact_sheet_failed)" >&2; exit 1; }
  printf "planche-contact de %s tirages : %s (%s octets)\n" "$N" "$OUTPUT" "$(wc -c < "$OUTPUT")"

ARGS:
  - {name: source, type: path}                # the .kra drawing, relative to the space of the skill
  - {name: layer, type: text}                 # the ink layer = the mask (empty: encrage)
  - {name: count, type: int}                  # the number of draws, 1 to 9 (empty: 4)
  - {name: output, type: path}                # the contact sheet, in the space of the skill
  - {name: style, type: text, stdin: true}    # the subject, free text: on STANDARD INPUT
