id: "A008"
tool: "asset_builder_add_cylinder"
date: "2026-10-19"
tags: ["asset_builder", "geom"]


RULES:
  enabled: true
  timeout: 30
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "adds a cylinder part (radius top/bottom, height, segments)"

COMMAND: |
  LC_ALL=C; export LC_ALL
  B=/home/moussa/Applications/asset-builder/bin/asset-builder
  [ -x "$B" ] || { printf '%s\n' "$(msg asset_builder_found_b "$B")" >&2 ; exit 1 ; }
  A1="{{name}}"
  case "$A1" in ''|*[!a-z0-9_]*) printf '%s\n' "$(msg malformed_name_a1 "$A1")" >&2 ; exit 1 ;; esac
  A2="{{id}}"
  case "$A2" in ''|*[!a-z0-9_]*) printf '%s\n' "$(msg malformed_id_a2 "$A2")" >&2 ; exit 1 ;; esac
  A3="{{rt}}"
  case "$A3" in ''|*[!0-9.-]*) printf '%s\n' "$(msg rt_number_a3 "$A3")" >&2 ; exit 1 ;; esac
  A4="{{rb}}"
  case "$A4" in ''|*[!0-9.-]*) printf '%s\n' "$(msg rb_number_a4 "$A4")" >&2 ; exit 1 ;; esac
  A5="{{h}}"
  case "$A5" in ''|*[!0-9.-]*) printf '%s\n' "$(msg h_number_a5 "$A5")" >&2 ; exit 1 ;; esac
  A6="{{seg}}"
  case "$A6" in ''|*[!0-9]*) printf '%s\n' "$(msg seg_integer_a6 "$A6")" >&2 ; exit 1 ;; esac
  A7="{{pos}}"
  case "$A7" in ''|*[!0-9.,-]*) printf '%s\n' "$(msg pos_x_y_z "$A7")" >&2 ; exit 1 ;; esac
  A8="{{rot}}"
  case "$A8" in ''|*[!0-9.,-]*) printf '%s\n' "$(msg rot_x_y_z "$A8")" >&2 ; exit 1 ;; esac
  A9="{{mat}}"
  AB_HOME="$W/asset_builder" "$B" add_cylinder --name "$A1" --id "$A2" --rt "$A3" --rb "$A4" --h "$A5" --seg "$A6" --pos "$A7" --rot "$A8" --mat "$A9"

ARGS:
  - {name: name, type: text}
  - {name: id, type: text}
  - {name: rt, type: text}
  - {name: rb, type: text}
  - {name: h, type: text}
  - {name: seg, type: int}
  - {name: pos, type: text}
  - {name: rot, type: text}
  - {name: mat, type: text}
