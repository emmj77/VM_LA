id: "A015"
tool: "asset_builder_array"
date: "2026-10-19"
tags: ["asset_builder", "edit"]


RULES:
  enabled: true
  timeout: 60
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "repeats one part n times along a step vector (detail without code)"

COMMAND: |
  LC_ALL=C; export LC_ALL
  B=/home/moussa/Applications/asset-builder/bin/asset-builder
  [ -x "$B" ] || { printf '%s\n' "$(msg asset_builder_found_b "$B")" >&2 ; exit 1 ; }
  A1="{{name}}"
  case "$A1" in ''|*[!a-z0-9_]*) printf '%s\n' "$(msg malformed_name_a1 "$A1")" >&2 ; exit 1 ;; esac
  A2="{{id}}"
  case "$A2" in ''|*[!a-z0-9_]*) printf '%s\n' "$(msg malformed_id_a2 "$A2")" >&2 ; exit 1 ;; esac
  A3="{{n}}"
  case "$A3" in ''|*[!0-9]*) printf '%s\n' "$(msg n_integer_a3 "$A3")" >&2 ; exit 1 ;; esac
  A4="{{step}}"
  case "$A4" in ''|*[!0-9.,-]*) printf '%s\n' "$(msg step_x_y_z "$A4")" >&2 ; exit 1 ;; esac
  AB_HOME="$W/asset_builder" "$B" array --name "$A1" --id "$A2" --n "$A3" --step "$A4"

ARGS:
  - {name: name, type: text}
  - {name: id, type: text}
  - {name: n, type: int}
  - {name: step, type: text}
