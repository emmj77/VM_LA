id: "A002"
tool: "asset_builder_new"
date: "2026-10-19"
tags: ["asset_builder", "session"]


RULES:
  enabled: true
  timeout: 30
  writable_workspace: ""
  approval: none
  turn: none
  count: false
  paths: read

DESCRIPTION: "creates an asset document with a name and a triangle budget"

COMMAND: |
  LC_ALL=C; export LC_ALL
  B=/home/moussa/Applications/asset-builder/bin/asset-builder
  [ -x "$B" ] || { printf '%s\n' "$(msg asset_builder_found_b "$B")" >&2 ; exit 1 ; }
  A1="{{name}}"
  case "$A1" in ''|*[!a-z0-9_]*) printf '%s\n' "$(msg malformed_name_a1 "$A1")" >&2 ; exit 1 ;; esac
  A2="{{tris}}"
  case "$A2" in ''|*[!0-9]*) printf '%s\n' "$(msg tris_integer_a2 "$A2")" >&2 ; exit 1 ;; esac
  AB_HOME="$W/asset_builder" "$B" new --name "$A1" --tris "$A2"

ARGS:
  - {name: name, type: text}
  - {name: tris, type: int}
