# THE TAG VOCABULARY. A tag is how a tool is found: four words, one per class, closed lists.
# A body carries exactly four: the nature, the engine, the object, the verb.
#   tags: ["vision", "local", "img", "analyze"]
# The doctor refuses a tag that is not in these lists, and counts the four.
tags:
  natures:
    - read
    - write
    - manage
    - reply
    - plan
    - vision
    - blender
    - unity
    - krita
    - image
  engines:
