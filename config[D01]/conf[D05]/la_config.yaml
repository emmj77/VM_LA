# id: C03
extensions:
  - yaml
  - yml
  - json
  - jsonl
  - sh
  - py
  - db
  - txt
  - ini
  - head
  - md
  - html
  - css
  - js
  - svg
  - apk
  - pem
  - log
# LA - the master file.
# One entry per thing: id, key, path, role. No list is kept anywhere else.
# The code never writes a path: it asks cfg for a key, cfg answers from here.
# Only engine/cfg.sh reads this file.

api: 1
date: "2026-10-21"

# what the machine offers; nothing here belongs to the repo
machine:
  threads: 8
  free_terminal:                            # what a free shell may not do: the calls the kernel refuses
    deny: [unlink, unlinkat, rmdir]
    error: EPERM
  kws:
    root: "/home/moussa/Applications/sherpa-onnx/kws-en/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
    python: "/home/moussa/Applications/sherpa-onnx/.venv/bin/python"
  llama:
    bin: "/home/moussa/Applications/llama.cpp/build_cuda/bin/llama-server"
    gguf: "/home/moussa/LLM_GGUF"
    # the names the router answers to; the files and their projectors live in the preset
    models:
      small:
        name: "smolvlm-256m"
      big:
        name: "qwen3-vl-8b"
  vision:                                     # what reads an image through an API
    api:
      base: "https://ollama.com/v1"
      model: "deepseek-v4.1-flash"
      key_env: "OLLAMA_API_KEY"
  blender:
    bin: "/home/moussa/Applications/blender-5.2.2-linux-x64/blender"
    timeout: 110
  comfyui:
    host: "127.0.0.1"
    port: 8188
    root: "/home/moussa/Applications/ComfyUI"
    # one pixel job = one node, one weight, one scale, one output
    jobs:
      matte:
        node: "BackgroundRemoval"
        model: "birefnet.safetensors"
        scale: 0
        out: "png"
      inpaint:
        node: "INPAINT_LoadInpaintModel"
        model: "big-lama.pt"
        scale: 0
        out: "png"
      depth:
        node: "DepthAnythingV2Preprocessor"
        model: "depth_anything_v2_vitb.pth"
        scale: 512
        out: "png"
  krita:
    host: "127.0.0.1"
    port: 5678
  ocr:                                        # what reads the text out of an image
    bin: "/home/moussa/Applications/indra-ocr/.venv/bin/indra-ocr"
    models: "/home/moussa/LLM_GGUF/indra-ocr"
  app:
    apk: "/home/moussa/Applications/LA-app.apk"
  browser:                                    # the window of the page, as it was
    bin: "/usr/bin/chromium"
    class: "LA-Dashboard"
    window: "1500,950"
    profile: "/home/moussa/.local/share/la-dashboard/profil"
  asr:
    root: "/home/moussa/Applications/NeMo-Speech.cpp"
    cli: "build/cpu-server/bin/nemo-speech"
    model: "models/parakeet-tdt-0.6b-v3.q8_0.gguf"
  tts:
    uv: "/home/moussa/.local/bin/uv"
    python: "/home/moussa/Applications/sherpa-onnx/.venv/bin/python3"
    sid: 1
    threads: 8
    cache: "/home/moussa/.cache/uv"
    model: "/home/moussa/Applications/sherpa-onnx/voix/vits-piper-fr_FR-upmc-medium"
  unity:
    cli: ""
    mcp: ""

# who speaks, and how wide the board is
agents:
  main: "jarvis"
  names: "jarvis paul albert eleonore claire"
  chat: "config[D01]/data[D06]/agent_chat.jsonl"   # the chat between agents, one line per message
  human: "Moussa"
  run_chars: 120
  board_lines: 24
  body_bytes: 1024
  line_bytes: 1600

# the router: one server, every model, one pick
models:
  host: "127.0.0.1"
  port: 8091
  dir: "/home/moussa/LLM_GGUF"
  preset: "/home/moussa/LLM_GGUF/models.ini"
  max: 4
  sleep: 120
  context: 8192
  gpu_layers: 99
  embed: "harrier-oss-v1-270M-Q8_0"
  rerank: "bge-reranker-v2-m3-Q4_K_M"
  local: "LFM2.5-1.2B-Instruct-Q4_K_M.gguf"
  pick: 60

# the four services and their address; a body never repeats them
ports:                                        # the named ports of the document, one place only
  bridge: 8770
  dash: 8771
  tls: 8766

units:
  bridge:
    resident: "bridge"
    count: false
    unit: "la-bridge"
    port: 8770
    probe: "/ping"
  models:
    resident: "models"
    count: true
    unit: "la-models"
    port: 8091
    probe: "/health"
  asr:
    resident: "asr"
    count: true
    unit: "la-asr"
    port: 8080
    probe: "/health"
  tts:
    resident: "tts"
    count: true
    unit: "la-tts"
    port: 8090
    probe: "/health"
  dashboard:
    resident: "dash"
    count: false
    unit: "la-dash"
    port: 8771
    probe: "/ping"

# the families, their base, and the register they live in
families:
  READ:
    base: root
    register: model
  WRITE:
    base: work
    register: model
  MANAGE:
    base: none
    register: model
  REPLY:
    base: none
    register: model
  PLAN:
    base: none
    register: model
  VISION:
    base: root
    register: model
  BLENDER:
    base: work
    register: model
  UNITY:
    base: work
    register: model
  KRITA:
    base: work
    register: model
  IMAGE:
    base: work
    register: model
  ENGINE:
    base: none
    register: engine
  DOCTOR:
    base: none
    register: engine
  WATCH:
    base: none
    register: engine
  TURN:
    base: none
    register: engine
# the turn, measured in numbers
loop:
  feed_turns: 12
  same_words_seconds: 300
  window: 4
  msg_max: 8000
  msg_budget: 32000
  max_turns: 400
  autosleep: 580
  memory_keep: 500
  purge_margin: 150
  retry: 1
  surveil_max: 12
  max_tokens: 0
  max_calls: 0
  max_seconds: 0
  plan_every: 10
  update_every: 10
  timeout: 600
  share: 30
  speech_tries: 2
  load_tries: 8
  answer_tokens: 2048
  error_chars: 200
  desc_chars: 40

# every bound the engine applies
limits:
  said_window: 10
  live_lines: 40
  return_keep: 200
  vision_tokens: 1024
  effort_timeout: 8
  scope_timeout: 10
  audio_min_minutes: 60
  audio_keep: 20
  audio_mb: 200
  health_timeout: 3
  ping_timeout: 2
  bench_timeout: 120
  tunnel_steps: 12
  db_busy_ms: 5000
  rerank_timeout: 15
  frame_bytes: 400
  stop_tries: 50
  port_tries: 100
  boot_tries: 40
  engine_bytes: 4000
  engine_lines: 200
  return_bytes: 4000
  engine_timeout: 600
  approval_window: 300
  trace_bytes: 200000
  trace_keep: 5000
  form_queue_bytes: 1000
  form_judge_bytes: 400
  form_demand_chars: 600
  form_rerank_timeout: 5
  head_bytes: 1000
  poll_ms: 1500

active_skill: ""
active_project: ""

lists:                                        # the names the code never carries
  audio_patterns: [speech-*.wav, voice-*.wav]
  french: [coffre, dossier, moteur, outil, tache, etape, racine, sortie, fiche, ranger, regle, veille, juge, seuil, borne, gabarit, brouillon, porte, perimetre]

owners:                                       # who reads what: one fact, one owner
  - {fact: extensions, owner: la}
  - {fact: api, owner: turn.call}
  - {fact: date, owner: doctor.manifest}
  - {fact: machine, owner: shell}
  - {fact: agents, owner: loop}
  - {fact: models, owner: engine.models}
  - {fact: units, owner: engine.install}
  - {fact: families, owner: engine.reload}
  - {fact: permanent, owner: skl}
  - {fact: loop, owner: la}
  - {fact: limits, owner: run}
  - {fact: forms, owner: turn.reply}
  - {fact: lists, owner: doctor.language}
  - {fact: active_engine, owner: turn.prompt}
  - {fact: engines, owner: engine.switch}
  - {fact: secrets, owner: turn.call}
  - {fact: world, owner: cfg}
  - {fact: archi, owner: doctor.manifest}

update:
  return_tag: la-return

tunnel:
  phone: "config[D01]/state[D12]/phone.conf"
  port: 51820
  host: 10.10.0.1
  peer: 10.10.0.2
  public: ""
  file: /etc/wireguard/wg0.conf
  interface: wg0
  dns: 1.1.1.1
  keepalive: 25

active_engine: cloud
engines:
  cloud:
    provider: "ollama-cloud"
    post: "https://ollama.com/v1/chat/completions"
    header: "Authorization"
    variable: "OLLAMA_API_KEY"
    model: "deepseek-v4.1-flash"
    max_tokens: 32768
    stream: true
    thinking: "enabled"
    reasoning_effort: "high"
    tool_choice: "required"
    context: 1000000
  pro:
    provider: "deepseek"
    post: "https://api.deepseek.com/chat/completions"
    header: "Authorization"
    variable: "DEEPSEEK_API_KEY"
    model: "deepseek-v4-pro"
    max_tokens: 32768
    stream: false
    thinking: "enabled"
    reasoning_effort: "medium"
    tool_choice: "auto"
    context: 128000
  mimo:
    provider: "xiaomi-mimo"
    post: "https://api.xiaomimimo.com/v1/chat/completions"
    header: "api-key"
    variable: "MIMO_API_KEY"
    model: "mimo-v2.6-flash"
    max_tokens: 8192
    stream: false
    tool_choice: "auto"
    context: 128000


# the repo outside this directory: the world the engine works in, never owned by it
world:
  - {id: W04, key: docs,           path: "docs"}
  - {id: W05, key: skill_active,   path: "skills[D23]/.active"}
  - {id: W06, key: project_active, path: "projects[D21]/.active"}

# the commands: one name, one act or one tool. the cli, the dashboard and the app read this list, nobody else.
# act = a gesture the engine owns ; tool = an existing tool, called by the human door ; voice = a keyword for the spotter
commands:
  - id: "V01"
    name: "help"
    act: usage
    voice: true
  - id: "V02"
    name: "version"
    act: version
  - id: "V03"
    name: "map"
    act: map
  - id: "V04"
    name: "new"
    act: new
    voice: true
  - id: "V05"
    name: "stop"
    act: stop
    voice: true
  - id: "V06"
    name: "skill list"
    tool: skill_list
    voice: true
  - id: "V07"
    name: "skill load"
    tool: load_skill
    arg: name
    voice: true
  - id: "V08"
    name: "skill unload"
    act: skill_unload
    voice: true
  - id: "V09"
    name: "project list"
    tool: project_list
  - id: "V10"
    name: "load project"
    tool: load_project
    arg: name
    voice: true
  - id: "V11"
    name: "unload project"
    tool: unload_project
    voice: true
  - id: "V12"
    name: "service"
    act: service
    arg: name
  - id: "V13"
    name: "tool"
    act: tool_call
  - id: "V14"
    name: "voice keywords"
    tool: voice_keywords
  - id: "V15"
    name: "doctor"
    act: doctor
  - id: "V16"
    name: "model"
    act: model
    arg: alias

# the head of every prompt, in zones: the prefix that never moves (prompt cache)
head:
  name: "LA"
  language_response: "french"
  source: "agent"
  date: "2026-10-15"
  WHERE:
    101: "LA is a harness: it only makes tool calls."
    102: "Root VM_LA/. I write only in the ACTIVE SKILL space, and the ACTIVE SKILL sets the scope."
    103: "The station holds the VM; the VM runs the tools. Debian, dash, jq, coreutils."
  TOOLS_SCHEMA:
    101: "Each tool is one function of the API: the NAME is the tool name (reply, read_file, list_dir), and its arguments are named. No number, no line."
    102: "I fill only the declared argument names; free text goes to the argument the tool declares for it."
    103: "G077, T001, U03 are the ids of the master file lines, not what I call."
    104: '[{"type":"function","function":{"name":"reply","description":"the only tool the human hears","parameters":{"type":"object","properties":{"mode":{"type":"string","enum":["talk","ask","answer"]},"form":{"type":"string","enum":["text","list","table","code"]},"text":{"type":"string"}},"required":["mode","form","text"]}}}]'
    105: "The same shape, another tool: read_file {path:work/note.md}."
  PERMANENTS:
    101: "Injected every turn by the loop, never loaded: @PERMANENTS@."
  MECHANISM:
    101: "ONE TURN: la(g, a) -> the engine runs line g -> the result comes back -> I continue."
    102: "The engine checks BEFORE the effect: id, line, arguments, scope. A refusal comes back as is."
    103: "reply: mode, FORM (text/list/table/code), TEXT. Three arguments, in that order; only TEXT is heard by the human."
    104: "One reply talk per turn, one SHORT sentence. Then the work tools. An open plan closes with update_todo, then reply answer."
    105: "The 4th argument of reply is a work note, never said to the human. The conversation is not the state: PLAN and STATE live outside me."
    106: "recall(n) re-reads the last n messages: ask it once, on a memory hole."
  SKILL:
    101: "I see ONLY the ACTIVE SKILL: its scope, its tools, its SUMMARY."
    102: "I do not hold the 3300+ register: a missing tool is a skill to LOAD (load_skill)."
    103: "Outside the WORKSPACE the engine refuses my writes."
  BEHAVIOUR:
    101: "Never prose. I name a tool: tool_choice is required."
    102: "No active skill is not a failure: reply, one sentence."
  LAWS:
    100: "I answer the human in FRENCH. The machine speaks English."
    101: "I never name a path: the WORKSPACE sets the scope."
    102: "Every line carries its id; the obsolete is deleted, not annotated."
    103: "In doubt: reply ask. Never an imposed choice."
  USER:
    101: "Moussa. Debian 13, terminal. CAPITALS = urgent."
    102: "Every tool leaves one log line on the human channel; it never enters my context."
    103: "No key or token in memory/: it is readable. A secret lives in the launcher environment."
  PROJECTS:
    101: "@PROJECTS@"

# where the install puts its pieces, and the two names the bridge and the backup answer to
paths:
  trace: "state[D12]/trace.jsonl"
  bridge_log: "state[D12]/bridge.log"
  sessions: "config[D01]/state[D12]/sessions"
  user_units: "/home/moussa/.config/systemd/user"
  user_bin: "/home/moussa/.local/bin"
  user_apps: "/home/moussa/.local/share/applications"

bridge:
  host: "0.0.0.0"
  tls_host: ""

backup:
  support: "git"
  supports: "[git]"

# the settings page: the engine choices and the fields it may edit
schema:
  engine_choices:
    thinking: ["", enabled, disabled]
    reasoning_effort: ["", none, low, medium, high, max]
    reasoning_field: ["", reasoning, reasoning_content]
    stream: ["true", "false"]
    reasoning_echo: ["true", "false"]
    tool_choice: [auto, required, none]
    max_tokens: ["1024", "2048", "4096", "8192", "16384", "32768", "65536"]
  fields:
  - section: loop
    key: window
    kind: int
    min: 2
    max: 40
    step: 1
    why: la fenetre du tour, en messages (loi 809)
  - section: loop
    key: max_turns
    kind: int
    min: 0
    max: 400
    why: la borne de securite des tours (0 = aucune)
  - section: loop
    key: msg_budget
    kind: int
    min: 4000
    max: 128000
    step: 4000
    why: le budget en octets de tout ce que le modele lit
  - section: loop
    key: plan_every
    kind: int
    min: 1
    max: 50
    why: l imposition du plan, tous les N tours
  - section: loop
    key: update_every
    kind: int
    min: 1
    max: 50
    why: la mise a jour du grand plan et du canon, tous les N tours
  - section: loop
    key: share
    kind: int
    min: 0
    max: 100
    why: la part de tete du scope (loi 472)
  - section: loop
    key: speech_tries
    kind: int
    min: 1
    max: 8
    why: combien de fois un message sans parole est redemande
  - section: second
    key: order
    kind: order
    choices:
    - project
    - skill
    - summary
    - plan
    - agents
    - messages
    - tools
    - reads
    - next
    - task
    - stamp
    why: l ordre des sections du head secondaire, du plus stable au plus volatil
  - section: second
    key: agents_lines
    kind: int
    min: 3
    max: 30
    why: la fenetre des agents, en lignes
  - section: second
    key: agents_chars
    kind: int
    min: 200
    max: 4000
    step: 50
    why: la fenetre des agents, en octets
  - section: second
    key: msg_lines
    kind: int
    min: 4
    max: 60
    why: la fenetre des messages, en lignes
  - section: second
    key: msg_chars
    kind: int
    min: 400
    max: 6000
    step: 100
    why: la fenetre des messages, en octets
  - section: second
    key: plan_lines
    kind: int
    min: 4
    max: 40
    why: la fenetre du plan, en lignes
  - section: second
    key: tools_lines
    kind: int
    min: 1
    max: 20
    why: la fenetre des tools, en lignes
  - section: agents
    key: main
    kind: choice
    choices:
    - jarvis
    - paul
    - albert
    - eleonore
    - claire
    why: 'l agent principal : l auteur d un tour quand le lanceur n en pose pas'
  - section: agents
    key: board_lines
    kind: int
    min: 8
    max: 200
    why: le plafond du tableau des agents (reecriture, jamais un rm)
  - section: agents
    key: body_bytes
    kind: int
    min: 128
    max: 4096
    step: 64
    why: la borne d un message d agent
  - section: agents
    key: run_chars
    kind: int
    min: 20
    max: 400
    step: 10
    why: combien de signes de la demande entrent dans la marque du tour
  - section: dashboard
    key: poll_ms
    kind: int
    min: 500
    max: 10000
    step: 100
    why: la cadence de rafraichissement de cette page
  - section: dashboard
    key: feed_turns
    kind: int
    min: 2
    max: 60
    why: combien de tours l historique du chat relit
  - section: bridge
    key: port
    kind: int
    min: 1024
    max: 65535
    why: la porte du pont (le telephone s y connecte)

# THE TABLE (board.py, the other agent): its data lives here, not in its code.
board:
  columns: 82
  lines: 50
  residents:
    - {name: models, unit: la-models, port: 8091, probe: health}
    - {name: asr, unit: la-asr, port: 8080, probe: ready}
    - {name: tts, unit: la-tts, port: 8090, probe: health}
  appoints:
    # bridge: board.py carries it itself. dash: the page, which opens and closes by itself.
    - {name: dash, port: 8771, unit: la-dash.service}
  instruments:
    - {name: indra-ocr, label: "indra ocr", bin: "machine.ocr.bin", why: "the OCR of indra_ocr_img"}
  carriers: []
  forms: '[A-Za-z0-9_.\-]+\.(?:gguf|onnx|pb|ftz)'

# THE TAG VOCABULARY: a tag is how a tool is found. Four words per body, one per class,
# and every value comes from these four closed lists (doctor.tags counts them).
tags:
  natures: [read, write, manage, reply, plan, vision, blender, unity, krita, image]
  engines: [shell, api, local, indra, comfyui, llama, blender, unity, krita, git, systemd, python]
  objects: [img, document, audio, mesh, scene, project, plan, turn, process, config, table, text, file, object, node, material, texture, animation, render, draw]
  verbs: [read, write, list, search, find, show, set, load, save, cut, repair, depth, boxes, ocr, analyze, generate, upscale, convert, run, manage, delete, remove, move, copy, open, close, speak, transcribe, translate, summarize, add, apply, clear, hide, select, install, update, reload, trace, test, import, export]
