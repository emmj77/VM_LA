# id: Q05
# THE MOULD OF A REGISTER ENTRY (tools/registry.yaml). THE REGISTER IS THE LIST: it carries
# the identity of a tool, never its body (the body, the description and the arguments live in
# tools/<family>/tool_<name>.yaml -- see tool_template.yaml).
#
# FOUR THINGS, AND NOTHING MORE:
#   id          a number, unique, the one the model writes to call the tool
#   tool        the tool name, as the file tool_<name>.yaml carries it
#   family      the NATURE (ten values, see below): it decides where a path has the
#               right to be, and it is what the fastText filter opens
#   sub_family  the CATEGORY inside the family (optional): for a workshop, it is a fact of the name
#
# LES DIX FAMILLES
#   READ     read, list, search, consult                (path under the root)
#   WRITE    write, change, transform a document        (under the space of the skill)
#   MANAGE   skills, projects, services, packages, table (names its register)
#   REPLY    parler a l'humain                          (aucun chemin)
#   PLAN     the plan, the memory, the canon            (names its register)
#   VISION   read an image or a screen                  (under the root)
#   BLENDER  the 3D workshop                            (under the space of the skill)
#   UNITY    the game engine                            (under the space of the skill)
#   KRITA    the drawing                                (under the space of the skill)
#   IMAGE    make an image, convert a model             (under the space of the skill)
#
# THE SUB-FAMILY IS A FACT OF THE NAME, NOT A CHOICE: the RNA category for a Blender operator
# (object, mesh, node, sequencer...), the CLI module for Unity (animation, graphics, physics...),
# the prefix for Krita. A workshop's doors list by sub-family: `ls families` returns the
# map, `ls mesh` the list. 3 253 tools carry one.

  - id: 0
    tool: "{{name}}"
    family: "{{family}}"                # READ | WRITE | MANAGE | REPLY | PLAN | VISION | BLENDER | UNITY | KRITA | IMAGE
    sub_family: "{{sub_family}}"        # optional; empty for the core, a word of the name for a workshop
    doc: "{{doc}}"                      # optional: the domain whose doc opens with this tool
    guardrail: true                     # optional: the tool is not called outside the workspace
    enabled: false                      # optional: set but off
    visible: true                       # optional: false = INVISIBLE to the model (tool internal to the bridge); default = true
