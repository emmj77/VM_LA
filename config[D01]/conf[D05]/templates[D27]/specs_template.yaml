# id: Q04
# THE MOULD OF A SPEC. Every line carries its ID: the id is an OFFSET, never a position.
# NO FREE WRITING: a tool sets LINES under a precise id, and nothing else.
# A SECTION OPENS WITH: SECTION : the section name
# NUMBERS GO BY HUNDREDS: 100 the first section, 200 the second, and so on.
id: "{{name}}"
created: "{{date}}"
last_revision: "{{date}}"
version: "{{version}}"
Rules:
  lines_per_section: 100   # THE MAXIMUM of lines in one section
  chars_per_line: 100      # THE MAXIMUM of BYTES per line (LC_ALL=C): one short law, read in one look

SECTION : {{section}}
  100: "..."
  101: "..."
  
SECTION : {{section}}
  200: "..."
  201: "..."
