id: "K00"                    # the identity of the skill, quoted; never called in a turn
skill: "{{name}}"            # the skill name
date: "{{date}}"             # the date it was set
tags: ["{{name}}"]           # a tag seen in the prompt LOADS the skill, and opens its tools

SUMMARY:                      # for the secondary head, while the skill is loaded
  101: "..."                 # one summary law, 100 bytes at most
  102: "..."
  110: "..."
RULES:                       # under SUMMARY: the laws the HARNESS applies
  create_subfolder: true     # may this skill create folders under its workspace?
  max_section_lines: 100     # the ceiling of one section, in lines
APPROVAL: false              # MAY THIS SKILL TOUCH THE HARNESS?
                             # true: every act touching the TABLE or a SKILL (table_manage,
                             # skill_manage) asks for a HUMAN GO, at every call, and the go
                             # holds ONLY for the named act (state/approve, window of
                             # approval.window seconds, once). false: these acts are refused,
                             # as everywhere else.
HUMAN_ONLY: false            # MAY THE MODEL LOAD IT? false: yes. true: the human alone, and
                             # the model gets a named refusal (load_skill reads this, first).
PERMANENT_TODO: false        # IS THE PLAN A TUNNEL? (a closed route, not a suggestion)
                             # true: the PLAN is written HERE by the human, and the loop uses it:
                             #   - the MANDATORY TODO is dropped (the plan is already open);
                             #   - the turn TOOLSET closes on the ONE tool of the current step;
                             #   - the step closes on a FACT read from the machine (status ok AND
                             #     the text begins with "ok "), never on the word of the model.
                             # One step = ONE line, 100 bytes, ONE tool named at the end:
                             #   401: "[in_progress] read the state -- tools: tunnel_status"
                             #   402: "[todo] raise wg0 -- tools: tunnel_up"
                             # false: the plan is a JOURNAL, the model writes it and drives it.
SKILL_TOOL_SET:              # THE one name: the tools this skill opens, and them alone (200 to 299)
  200: "..."                 # one line, one tool name
  201: "..."
DOCS:                        # the source: the NAME of a file, OR of a folder (no path)
  300: "..."                 # the model searches it and reads the one useful file; otherwise "web_search"
PLAN:                        # a JOURNAL plan lives OUTSIDE: state/<agent>_todo.md (lowercase), written by todo,
                             # moved by update_todo (in_progress | completed, 12 steps at most, 100 chars
                             # a step). this section stays for a ROUTE only (PERMANENT_TODO: true): one
                             # line per step, its state in front, its ONE tool at the end.
  400: "..."                 # a route: 400 the goal, 401.. the steps
  401: "[in_progress] read the tunnel state -- tools: tunnel_status"
WRITABLE_WORKSPACE:          # the write space: two things, and only two
  workspace: "work/"         # the working folders
  type-file: ".md .yaml .sh .json .txt"   # the file types accepted
ERROR:                       # what the skill says when a tool refuses
  600: "..."
PORTEUR: ""                  # the carrier: the machine this skill holds open while it lives. It
                             # names an engine action that knows start|stop (e.g. engine.models).
                             # load_skill opens it by loading the skill, and closes it when
                             # ANOTHER skill takes the place. empty: no carrier.
