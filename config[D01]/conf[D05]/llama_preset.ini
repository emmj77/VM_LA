# id: C09
# LE PRESET DU ROUTEUR llama.cpp (config/llama_preset.ini) -- le fichier que le service charge.
#
# UN SEUL llama-server SERT TOUS LES MODELES. [*] donne les reglages communs a chaque enfant ;
# une section les reprend ou les change (priorite : ligne de commande > section > [*]).
#
# LE CACHE RAM EST COUPE PARTOUT : le cache hote de llama.cpp (defaut 8192 MiB par modele)
# grandit a chaque contenu nouveau et ne redescend jamais. Mesure 21/10 sur smolvlm :
# 30 textes nouveaux = +68 Mo, 30 fois les memes textes = +3 Mo.
#
# UN RESIDENT EST CHARGE AU DEMARRAGE ET S ENDORT S IL NE SERT PAS : sleep-idle-seconds rend
# les buffers, JAMAIS les poids (un resident qui se decharge est une faute).
# UN MODELE A LA DEMANDE (load-on-startup = false) n a pas de sommeil : l appelant le decharge
# par POST /models/unload quand il a fini, sinon il resterait charge pour rien.

[*]
cache-ram          = 0
no-warmup          = 1
parallel           = 1
sleep-idle-seconds = 120

# -- LES RESIDENTS ----------------------------------------------------------

# L EMBED : les vecteurs de la table. CPU, deux fils, aucun cache.
[harrier-oss-v1-270M-Q8_0]
load-on-startup = true
model           = /home/moussa/LLM_GGUF/harrier-oss-v1-270M-Q8_0.gguf
embedding       = 1
pooling         = last
ctx-size        = 512
threads         = 2
ngl             = 0
cache-prompt    = 0

# LE RERANKER : la P2200 (carte 1 -- la 3060 reste libre), tout le modele sur la carte.
[bge-reranker-v2-m3-Q4_K_M]
load-on-startup = true
model           = /home/moussa/LLM_GGUF/bge-reranker-v2-m3-Q4_K_M.gguf
reranking       = 1
pooling         = rank
ctx-size        = 1024
threads         = 6
ngl             = 99
main-gpu        = 1
cache-prompt    = 0

# LE LOCAL : le modele du tour et le compacteur. Il GARDE son cache de prefixe (la tete et la
# table se repetent d un tour a l autre : c est ce qui rend le tour payable).
[LFM2.5-1.2B-Instruct-Q4_K_M.gguf]
load-on-startup = true
model           = /home/moussa/LLM_GGUF/LFM2.5-1.2B-Instruct-Q4_K_M.gguf
ctx-size        = 6144
threads         = 8
ngl             = 0
cache-prompt    = 1

# -- A LA DEMANDE -----------------------------------------------------------

# LES YEUX : charges par la requete qui les nomme, decharges quand l oeil a fini.
[qwen3-vl-8b]
load-on-startup    = false
sleep-idle-seconds = -1
model              = /home/moussa/LLM_GGUF/Qwen_Qwen3-VL-8B-Instruct-Q5_K_M.gguf
mmproj             = /home/moussa/LLM_GGUF/mmproj-Qwen3VL-8B-Instruct-Q8_0.gguf
ctx-size           = 4096
ngl                = 99
cache-prompt       = 0

[smolvlm-256m]
load-on-startup    = false
sleep-idle-seconds = -1
model              = /home/moussa/LLM_GGUF/SmolVLM-256M-Instruct-Q8_0.gguf
mmproj             = /home/moussa/LLM_GGUF/mmproj-SmolVLM-256M-Instruct-Q8_0.gguf
ctx-size           = 4096
ngl                = 99
cache-prompt       = 0
