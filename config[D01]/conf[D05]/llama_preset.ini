# id: C09
# LE PRESET DU ROUTEUR llama.cpp (config/llama_preset.ini)
#
# UN SEUL llama-server SERT LES TROIS MODELES DE LA -- l embed, le reranker et le compacteur --
# et chacun garde SES reglages : c est ce que ce fichier dit, modele par modele.
#
#   [*]                       les reglages communs ; un modele peut les reprendre ou les changer
#   [nom-du-gguf-sans-.gguf]  le nom que les clients envoient dans le champ "model"
#
# CE QUE MOUSSA A EXIGE (19/10) : « les modeles doivent rester en ram sinon on paye le redemarrage ».
# D ou : PAS de sleep-idle-seconds ici, et --models-max 3 au lancement -- les trois tiennent, et
# aucun ne s endort. L ordonnanceur ne decharge que s il manque une place ; les clients de LA ne
# demandent jamais que ces trois noms, donc la place ne manque pas.
#
# STATELESS : cache-ram 0 et cache-prompt 0 partout. Un texte entre, un vecteur ou un score sort,
# rien ne reste -- sauf pour le compacteur, qui garde son cache de prefixe (la tete et la table se
# repetent d un tour a l autre : c est ce qui rend le tour payable).

[*]
parallel    = 1
cache-ram   = 0
no-warmup   = 1

# L EMBED : les vecteurs de la table. CPU, deux fils, un seul slot, aucun cache.
[harrier-oss-v1-270M-Q8_0]
embedding     = 1
pooling       = last
ctx-size      = 512
threads       = 2
ngl           = 0
cache-prompt  = 0

# LE RERANKER : la P2200 (carte 1 -- la 3060 reste libre), tout le modele sur la carte.
[bge-reranker-v2-m3-Q4_K_M]
reranking     = 1
pooling       = rank
ctx-size      = 1024
threads       = 6
ngl           = 99
main-gpu      = 1
cache-prompt  = 0

# LE COMPACTEUR : le resume qui va dans memory.db, sur le CPU. Il GARDE son cache de prefixe.
[LFM2.5-1.2B-Instruct-Q4_K_M]
ngl           = 0
ctx-size      = 6144
threads       = 8
