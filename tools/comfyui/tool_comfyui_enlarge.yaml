# QUI : enlarges 2x/4x (esrgan) and can lay back into a layer
# ORIGINE : migre tel quel de la ligne 169 du registre (2026-10-17). Le corps n'a PAS ete reecrit ici.
# REFUSE : (a completer par l'auteur -- ce que ce tool refuse, en le nommant)
tool: "comfyui_enlarge"
date: "2026-10-17"
tags: ["comfyui", "comfyui_enlarge"]

comfyui
doc: comfyui

RULES:
  enabled: true
  timeout: 300

DESCRIPTION: "enlarges 2x/4x (esrgan) and can lay back into a layer"

COMMAND: |
  "$HOME/Applications/ComfyUI/venv/bin/python3" "$HOME/Applications/ComfyUI/TOOLS/comfy_tool.py" agrandir </dev/null

ARGS: []                    # aucun argument : ce tool se nomme seul
