# QUI : lists the table's tools and each one's arguments, by family
# ORIGINE : migre tel quel de la ligne 109 du registre (2026-10-17). Le corps n'a PAS ete reecrit ici.
# REFUSE : (a completer par l'auteur -- ce que ce tool refuse, en le nommant)
tool: "tools_list"
date: "2026-10-17"
tags: ["tools_list"]

RULES:
  enabled: true
  timeout: 600

DESCRIPTION: "lists the table's tools and each one's arguments, by family"

COMMAND: |
  # LE REGISTRE, ET LES FICHIERS. Les arguments ne vivent plus dans le registre (config/la_tools.yaml)
  # mais dans le fichier du tool (tools/<machine>/tool_<nom>.yaml, sous la cle ARGS). On parcourt donc
  # les deux : une entree du registre a la fois, au grep et au sed, comme le moteur le fait lui-meme.
  TBL="$LA_CONFIG"
  [ -n "$TBL" ] || { echo 'refuse : LA_CONFIG est vide ; le registre est inconnu' >&2; exit 1; }
  [ -f "$TBL" ] || { echo "refuse : le registre est introuvable ($TBL)" >&2; exit 1; }
  [ -r "$TBL" ] || { echo "refuse : le registre est illisible ($TBL)" >&2; exit 1; }
  F="{{family}}"
  DEBS=$(grep -n '^  - id: ' "$TBL" | cut -d: -f1)
  N=$(printf '%s\n' "$DEBS" | grep -c .)
  [ "$N" -ge 1 ] || { echo "refuse : le registre ne porte aucune entree ($TBL)" >&2; exit 1; }
  TOTAL=$(wc -l < "$TBL")
  VU=0
  i=0
  while [ "$i" -lt "$N" ]; do
    i=$((i + 1))
    DEB=$(printf '%s\n' "$DEBS" | sed -n "${i}p")
    END=$(printf '%s\n' "$DEBS" | sed -n "$((i + 1))p")
    END=${END:-$((TOTAL + 1))}
    B=$(sed -n "${DEB},$((END - 1))p" "$TBL")
    G=$(printf '%s\n' "$B" | sed -n 's/^  - id:[[:space:]]*//p' | head -n 1)
    T=$(printf '%s\n' "$B" | sed -n 's/^    tool:[[:space:]]*//p' | head -n 1)
    FA=$(printf '%s\n' "$B" | sed -n 's/^    family:[[:space:]]*//p' | head -n 1)
    if [ -z "$F" ] || [ "$FA" = "$F" ]; then
      FF=
      for D in "$ROOT"/tools/*/ "$ROOT"/tools/; do
        [ -f "$D/tool_$T.yaml" ] && { FF="$D/tool_$T.yaml"; break; }
      done
      A=
      if [ -n "$FF" ]; then
        A=$(sed -n '/^ARGS:/,$p' "$FF" \
            | sed -n 's/^  - {name:[[:space:]]*\([A-Za-z0-9_]*\).*/\1/p' | paste -sd',' - | sed 's/,/, /g')
      fi
      [ -n "$A" ] && A=" $A"
      printf '%s %s [%s]%s\n' "$G" "$T" "$FA" "$A"
      VU=$((VU + 1))
    fi
  done
  [ "$VU" -ge 1 ] || { echo "refuse : aucun tool dans la famille ${F:-toutes}" >&2; exit 1; }

ARGS:
  - {name: family, type: enum, values: [READ, MANAGE, WRITE, REPLY, ""]}
