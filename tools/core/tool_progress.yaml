# QUI : marks the CURRENT point of the plan : progress (still going) or complete (done)
# ORIGINE : migre tel quel de la ligne 122 du registre (2026-10-17). Le corps n'a PAS ete reecrit ici.
# REFUSE : (a completer par l'auteur -- ce que ce tool refuse, en le nommant)
tool: "progress"
date: "2026-10-17"
tags: ["progress"]

RULES:
  enabled: true
  timeout: 600

DESCRIPTION: "marks the CURRENT point of the plan : progress (still going) or complete (done)"

COMMAND: |
  [ -n "{{state}}" ] || { echo 'refuse : state vide ; progress veut son etat : progress ou complete' >&2; exit 1; }
  [ -x "$PROCS/plan.sh" ] || { echo "refuse : la brique du plan est introuvable ($PROCS/plan.sh)" >&2; exit 1; }
  "$PROCS/plan.sh" progress "{{state}}"

ARGS:
  - {name: state, type: text}
